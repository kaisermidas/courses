чки — королеви.", "cards": [{"f": "«Княжа Україна»", "b": "Цикл віршованих оповідей Олеся про історію княжої Русі."}, {"f": "Боян", "b": "Легендарний співець давньої Русі, згаданий у «Заспіві»."}, {"f": "Що збудував Ярослав Мудрий?", "b": "Софійський собор, Золоті ворота, школи."}, {"f": "«Руська правда»", "b": "Збірка законів, укладена за Ярослава Мудрого."}, {"f": "Чому Ярослава назвали Мудрим?", "b": "Любив книги, зібрав бібліотеку, дав закони, розбудував Київ."}, {"f": "Ким стали дочки Ярослава?", "b": "Королевами європейських країн."}], "quiz": [{"t": "choice", "q": "«Княжа Україна» — це…", "o": ["роман", "цикл віршованих оповідей про історію", "збірка казок"], "a": 1, "e": "Олесь переповів літописи віршами."}, {"t": "choice", "q": "Хто такий Боян?", "o": ["Князь", "Легендарний співець", "Літописець"], "a": 1, "e": "Співець давньої Русі."}, {"t": "choice", "q": "Який собор збудував Ярослав Мудрий?", "o": ["Софійський", "Михайлівський", "Успенський"], "a": 0, "e": "Софію Київську."}, {"t": "choice", "q": "Що таке «Руська правда»?", "o": ["Газета", "Збірка законів", "Літопис"], "a": 1, "e": "Перший збірник законів Русі."}, {"t": "choice", "q": "Кого здолав Ярослав у боротьбі за престол?", "o": ["Святополка", "Олега", "Ігоря"], "a": 0, "e": "Брата Святополка."}, {"t": "choice", "q": "Чому Ярослава назвали Мудрим?", "o": ["Бо був старий", "За любов до книг, закони, розбудову Києва", "Бо воював"], "a": 1, "e": "Мудрий правитель і книжник."}, {"t": "tf", "q": "Дочки Ярослава Мудрого стали королевами в Європі.", "a": true, "e": "Так, зокрема Анна — королева Франції."}, {"t": "choice", "q": "Яка ідея «Княжої України»?", "o": ["Гордість за предків і любов до рідної землі", "Страх перед минулим", "Похвала війні"], "a": 0, "e": "Знати й любити свою історію."}]}, {"id": "ist-menzatiuk-shablia", "sec": "Історичне минуле", "title": "Зірка Мензатюк. «Таємниця козацької шаблі». Епічний твір", "goal": "Ти пам'ятаєш героїв і сюжет пригодницької повісті та знаєш ознаки епічного твору.", "learn": [{"h": "Зірка Мензатюк", "p": ["Сучасна письменниця з Буковини (народилася на Чернівеччині), живе в Києві. Пише для дітей казки, оповідання, повісті про Україну та її історію: «Таємниця козацької шаблі», «Київські казки»."]}, {"h": "Сюжет", "p": ["Родина <b>Руснаків</b> — тато, мама й дочка <b>Наталочка</b> — купили авто, яке назвали <b>Машкою</b>. Друг тата, історик <b>пан Богдан</b>, розповів: до нього з'являється патріотичний <b>привид</b> козака і просить урятувати <b>козацьку шаблю</b> — реліквію, якій загрожує небезпека на заході України, на місці великої битви. Руснаки вирушають у подорож: <b>Берестечко</b> (Козацькі Могили), <b>Дубно</b>, Тараканівський форт, <b>Кам'янець</b>. Їм заважає елегантний хлопець <b>Антип (Антипко)</b>, який теж «шукає» шаблю, а насправді хоче її продати за кордон; він підбиває Наталочку хитрувати й обманювати батьків. Наталочка виявляє наївність, але й щирість і патріотизм. Зрештою шаблю знаходять і рятують."], "note": "Головна думка: любов до України, повага до історичної пам'яті; чесність важливіша за хитрість."}, {"h": "Епічний твір", "p": ["<span class='term'>Епічний твір</span> — розповідь про події та героїв, яку веде оповідач; має сюжет (послідовність подій), персонажів, описи. Види: оповідання, повість, роман, казка. «Таємниця козацької шаблі» — пригодницька повість із фантастичним елементом (привид, сигнали Машки)."]}], "remember": "Руснаки (Наталочка, тато, мама, авто Машка), пан Богдан, привид, шабля; маршрут Берестечко — Дубно — Кам'янець; Антипко заважає й підбиває хитрувати. Епічний твір — розповідь оповідача про події й героїв.", "cards": [{"f": "Хто головна героїня повісті?", "b": "Наталочка Руснак."}, {"f": "Хто така Машка?", "b": "Автомобіль родини Руснаків."}, {"f": "Хто розповів про шаблю?", "b": "Пан Богдан, історик, до якого з'являвся привид козака."}, {"f": "Хто такий Антипко?", "b": "Елегантний хлопець, що заважає Руснакам; хоче продати шаблю; радить Наталочці хитрувати."}, {"f": "Куди їздили Руснаки?", "b": "Берестечко (Козацькі Могили), Дубно, Кам'янець."}, {"f": "Епічний твір", "b": "Розповідь оповідача про події та героїв; має сюжет і персонажів."}], "quiz": [{"t": "choice", "q": "Як звали головну героїню?", "o": ["Оленка", "Наталочка", "Маруся"], "a": 1, "e": "Наталочка Руснак."}, {"t": "choice", "q": "Хто така Машка?", "o": ["Собака", "Автомобіль", "Сестра"], "a": 1, "e": "Так родина назвала своє авто."}, {"t": "choice", "q": "Хто просив урятувати шаблю?", "o": ["Учитель історії", "Патріотично налаштований привид", "Антипко"], "a": 1, "e": "Привид з'являвся до пана Богдана."}, {"t": "choice", "q": "Яку роль відіграє Антипко?", "o": ["Допомагає Руснакам", "Заважає їм і хоче продати шаблю", "Він — привид"], "a": 1, "e": "Антипко — суперник, радить обманювати."}, {"t": "choice", "q": "На місце якої битви приїхали Руснаки?", "o": ["Полтавської", "Берестецької", "Хотинської"], "a": 1, "e": "Берестечко, Козацькі Могили."}, {"t": "choice", "q": "«Таємниця козацької шаблі» — це…", "o": ["оповідання", "пригодницька повість", "драма"], "a": 1, "e": "Повість із розділами й багатьма подіями."}, {"t": "choice", "q": "Епічний твір — це…", "o": ["вірш про почуття", "розповідь оповідача про події й героїв", "твір для сцени"], "a": 1, "e": "Епос — розповідь."}, {"t": "choice", "q": "Ким був пан Богдан?", "o": ["Істориком, мандрівником", "Продавцем авто", "Козаком"], "a": 0, "e": "Історик, друг тата."}, {"t": "tf", "q": "Антипко радив Наталочці бути чесною з батьками.", "a": false, "e": "Навпаки — радив «схитрувати», тобто обманути."}, {"t": "choice", "q": "Головна думка повісті:", "o": ["Купуйте авто", "Любов до України й повага до історичної пам'яті", "Привиди існують"], "a": 1, "e": "Патріотизм і чесність."}]}, {"id": "ist-nechui-zaporozhtsi", "sec": "Історичне минуле", "title": "Іван Нечуй-Левицький. «Запорожці»", "goal": "Ти пам'ятаєш зміст оповідання-сну про Запорозьку Січ.", "learn": [{"h": "Іван Нечуй-Левицький (1838–1918)", "p": ["Класик української прози з Черкащини (Стеблів). Автор повістей «Кайдашева сім'я», «Микола Джеря». Для дітей — оповідання «Запорожці»."]}, {"h": "Сюжет", "p": ["Хлопчик <b>Павлусь</b> задивився на Дніпро й засинає в човні; течія несе його на острів <b>Хортицю</b>. У сні він бачить <b>Запорозьку Січ</b>: козаків у широких шароварах, курені, <b>кошового отамана</b>, козацьку раду. Козаки приймають його, розповідають про звичаї, побут, славу. Павлусь дивується волі, побратимству й порядку на Січі. Прокинувшись, він розуміє, що бачив сон, але залишається захопленим козацькою славою."], "note": "Головна думка: пам'ять про Січ і козацьку волю живе в кожному українцеві."}, {"h": "Реальне й фантастичне", "p": ["Реальне: хлопчик, човен, Дніпро, Хортиця. Фантастичне (сон): жива Січ і козаки. Такий прийом дозволяє «побачити» історію очима дитини."]}], "remember": "Нечуй-Левицький — «Запорожці»: хлопчик Павлусь заснув у човні, приплив до Хортиці і в сні побачив Запорозьку Січ, козаків, кошового. Ідея — пам'ять про козацьку волю.", "cards": [{"f": "Хто головний герой «Запорожців»?", "b": "Хлопчик Павлусь."}, {"f": "Куди принесла течія човен Павлуся?", "b": "На острів Хортицю."}, {"f": "Що побачив Павлусь у сні?", "b": "Запорозьку Січ: козаків, курені, кошового, раду."}, {"f": "Чиї повісті «Кайдашева сім'я», «Микола Джеря»?", "b": "Івана Нечуя-Левицького."}, {"f": "Який прийом використав автор?", "b": "Сон — щоб показати минуле очима дитини."}], "quiz": [{"t": "choice", "q": "Як звали хлопчика в «Запорожцях»?", "o": ["Олесь", "Павлусь", "Сашко"], "a": 1, "e": "Павлусь."}, {"t": "choice", "q": "Де заснув Павлусь?", "o": ["У хаті", "У човні на Дніпрі", "У полі"], "a": 1, "e": "Течія понесла човен."}, {"t": "choice", "q": "На який острів потрапив хлопчик?", "o": ["Хортицю", "Зміїний", "Труханів"], "a": 0, "e": "Хортиця — осередок Січі."}, {"t": "choice", "q": "Хто керував Січчю?", "o": ["Князь", "Кошовий отаман", "Гетьман"], "a": 1, "e": "Кошовий отаман."}, {"t": "choice", "q": "Як Павлусь побачив Січ?", "o": ["Насправді", "У сні", "На малюнку"], "a": 1, "e": "Це був сон."}, {"t": "choice", "q": "Автор «Запорожців» — …", "o": ["Нечуй-Левицький", "Франко", "Олесь"], "a": 0, "e": "Іван Нечуй-Левицький."}, {"t": "tf", "q": "Козаки прогнали Павлуся із Січі.", "a": false, "e": "Ні, прийняли й розповіли про свої звичаї."}, {"t": "choice", "q": "Головна думка твору:", "o": ["Не спати в човні", "Пам'ять про козацьку волю живе в народі", "Дніпро небезпечний"], "a": 1, "e": "Гордість за козацьке минуле."}]}, {"id": "pryr-shevchenko-buriany", "sec": "Рідна Україна. Світ природи", "title": "Тарас Шевченко. С. Васильченко «У бур'янах»", "goal": "Ти знаєш головні факти дитинства Шевченка й пам'ятаєш зміст оповідання Васильченка.", "learn": [{"h": "Тарас Шевченко (1814–1861)", "p": ["Народився 9 березня 1814 року в селі <b>Моринці</b>, дитинство минуло в <b>Кирилівці</b> (Керелівці) на Черкащині, у родині кріпаків. Рано осиротів. Був козачком у пана, вчився малювати; у Петербурзі друзі викупили його з кріпацтва (1838). Поет і художник, автор <b>«Кобзаря»</b> (1840). За вірші проти влади відбув 10 років солдатчини. Помер у Петербурзі, перепохований на <b>Чернечій горі</b> в Каневі."]}, {"h": "«У бур'янах» (Степан Васильченко)", "p": ["Оповідання про дитинство Тараса. Малий Тарас — допитливий, мрійливий, любить блукати серед високих <b>бур'янів</b>, слухати казки й пісні. Батько <b>Григорій</b>, мати <b>Катерина</b>, старша сестра <b>Катря</b> — його «нянька», <b>дід Іван</b> розповідає про гайдамаків. Тарас пішов шукати <b>залізні стовпи, що підпирають небо</b>, на край світу — його привезли додому <b>чумаки</b>. Ранні картини життя кріпаків, бідність, а разом із тим — краса природи й пісня."], "note": "Головна думка: талант і мрійливість виростають навіть у злиднях; любов до рідного краю з дитинства."}], "remember": "Шевченко: 1814, Моринці — Кирилівка, кріпак, викуп 1838, «Кобзар» 1840, Канів. «У бур'янах»: Тарас-мрійник, сестра Катря, дід Іван, пошук залізних стовпів, чумаки привезли додому.", "cards": [{"f": "Коли і де народився Шевченко?", "b": "9 березня 1814 року, село Моринці на Черкащині."}, {"f": "Де минуло дитинство Тараса?", "b": "У селі Кирилівка (Керелівка)."}, {"f": "Коли Шевченка викупили з кріпацтва?", "b": "1838 року, у Петербурзі."}, {"f": "«Кобзар»", "b": "Перша збірка віршів Шевченка, 1840 рік."}, {"f": "Де похований Шевченко?", "b": "На Чернечій горі в Каневі."}, {"f": "Кого шукав малий Тарас в оповіданні «У бур'янах»?", "b": "Залізні стовпи, що підпирають небо; його привезли додому чумаки."}, {"f": "Хто автор оповідання «У бур'янах»?", "b": "Степан Васильченко."}], "quiz": [{"t": "choice", "q": "У якому році народився Шевченко?", "o": ["1814", "1840", "1861"], "a": 0, "e": "9 березня 1814 року."}, {"t": "choice", "q": "У якому селі народився Шевченко?", "o": ["Кирилівка", "Моринці", "Канів"], "a": 1, "e": "Народився в Моринцях, ріс у Кирилівці."}, {"t": "choice", "q": "Ким були батьки Тараса?", "o": ["Кріпаками", "Дворянами", "Купцями"], "a": 0, "e": "Кріпаки."}, {"t": "choice", "q": "Як називається перша збірка Шевченка?", "o": ["«Заповіт»", "«Кобзар»", "«Гайдамаки»"], "a": 1, "e": "«Кобзар», 1840."}, {"t": "choice", "q": "Де похований Шевченко?", "o": ["У Києві", "У Каневі", "У Петербурзі"], "a": 1, "e": "На Чернечій горі в Каневі."}, {"t": "choice", "q": "Хто написав «У бур'янах»?", "o": ["Шевченко", "Васильченко", "Франко"], "a": 1, "e": "Степан Васильченко — про дитинство Шевченка."}, {"t": "choice", "q": "Що шукав малий Тарас, коли пішов з дому?", "o": ["Скарб", "Залізні стовпи, що підпирають небо", "Сестру"], "a": 1, "e": "Мрійливий хлопчик шукав край світу."}, {"t": "choice", "q": "Хто привіз Тараса додому?", "o": ["Чумаки", "Козаки", "Пан"], "a": 0, "e": "Чумаки — торговці сіллю."}, {"t": "input", "q": "Як звали старшу сестру Тараса, його «няньку»?", "a": ["катря", "катерина"], "e": "Катря."}, {"t": "tf", "q": "Шевченко був і поетом, і художником.", "a": true, "e": "Так, він навчався в Академії мистецтв."}]}, {"id": "pryr-shevchenko-virshi", "sec": "Рідна Україна. Світ природи", "title": "Шевченко: «За сонцем хмаронька пливе», «Садок вишневий коло хати». Ліричний твір", "goal": "Ти знаєш, що таке ліричний твір і засоби образної мови, і пам'ятаєш два вірші Шевченка.", "learn": [{"h": "Ліричний твір", "p": ["<span class='term'>Ліричний твір</span> — віршований твір, у якому передано почуття, переживання, думки. Подій майже немає — є настрій і картина. <span class='term'>Ліричний герой</span> — той, чиї почуття виражено у вірші (не завжди сам автор)."]}, {"h": "«За сонцем хмаронька пливе»", "p": ["Картина вечора: хмаронька пливе за сонцем, розстеляє червоні поли, кличе сонце спати; настає туман, темніє. Ліричний герой сумує: серцю «немов одрадісно… а серденько одпочине». Природа персоніфікована: хмаронька «пливе», «поли розстилає», сонечко «спати кличе». Вірш написано в засланні — туга за Україною."]}, {"h": "«Садок вишневий коло хати»", "p": ["Ідилія українського вечора: хрущі гудуть над вишнями, плугатарі йдуть з плугами, дівчата співають, матері чекають, сім'я вечеряє коло хати, мати вкладає дітей, а сама засинає; тиша, зіроньки, соловейко. Написано у Петербурзі в казематі (1847) — спогад про рідне село, мрія про мир і спокій."], "note": "Настрій — тихий, лагідний, замилування. Композиція: три строфи — три картини (пейзаж → сім'я → сон)."}, {"h": "Засоби образної мови", "p": ["<b>Епітет</b>: <i>червоні поли, вишневий садок</i>. <b>Метафора/персоніфікація</b>: <i>хмаронька пливе, сонце спати кличе</i>. <b>Порівняння</b>: <i>мов дитинку</i>. <b>Зменшувально-пестливі слова</b>: <i>хмаронька, серденько, соловейко, зіроньки</i> — надають ніжності."]}], "remember": "Ліричний твір передає почуття; ліричний герой — той, чиї почуття у вірші. «За сонцем хмаронька пливе» — вечір, сум, персоніфікація. «Садок вишневий коло хати» — мирний вечір у селі, три картини, пестливі слова.", "cards": [{"f": "Ліричний твір", "b": "Віршований твір, що передає почуття й переживання."}, {"f": "Ліричний герой", "b": "Той, чиї почуття виражено у вірші."}, {"f": "Персоніфікація", "b": "Наділення неживого рисами живого: хмаронька пливе, сонце спати кличе."}, {"f": "Де написано «Садок вишневий коло хати»?", "b": "У казематі в Петербурзі, 1847 — спогад про Україну."}, {"f": "Скільки картин у «Садку вишневому»?", "b": "Три: вечір у селі → сім'я вечеряє → усі засинають."}, {"f": "Навіщо пестливі слова (хмаронька, серденько)?", "b": "Надають ніжності, лагідності."}], "quiz": [{"t": "choice", "q": "Ліричний твір передає насамперед…", "o": ["події", "почуття й настрій", "діалоги героїв"], "a": 1, "e": "Лірика — про переживання."}, {"t": "choice", "q": "Хто такий ліричний герой?", "o": ["Головний герой казки", "Той, чиї почуття виражені у вірші", "Автор словника"], "a": 1, "e": "Не завжди сам поет."}, {"t": "choice", "q": "«Хмаронька пливе, сонце спати кличе» — це…", "o": ["персоніфікація", "гіпербола", "порівняння"], "a": 0, "e": "Неживому надано дій живого."}, {"t": "choice", "q": "Який настрій у вірші «За сонцем хмаронька пливе»?", "o": ["Веселий", "Сумний, задумливий", "Гнівний"], "a": 1, "e": "Туга ліричного героя."}, {"t": "choice", "q": "Хто гуде над вишнями в «Садку вишневому»?", "o": ["Бджоли", "Хрущі", "Комарі"], "a": 1, "e": "«Хрущі над вишнями гудуть»."}, {"t": "choice", "q": "Де написано «Садок вишневий коло хати»?", "o": ["У Кирилівці", "У казематі в Петербурзі", "У Каневі"], "a": 1, "e": "Ув'язнений поет згадував рідне село."}, {"t": "choice", "q": "Скільки строф-картин у «Садку вишневому»?", "o": ["Дві", "Три", "П'ять"], "a": 1, "e": "Пейзаж, сім'я, сон."}, {"t": "choice", "q": "«Вишневий садок», «червоні поли» — це…", "o": ["епітети", "метафори", "порівняння"], "a": 0, "e": "Художні означення."}, {"t": "input", "q": "Хто співає ввечері в «Садку вишневому»? «… співають ідучи»", "a": ["дівчата"], "e": "Дівчата."}, {"t": "tf", "q": "Слова «серденько», «зіроньки», «соловейко» — зменшувально-пестливі.", "a": true, "e": "Так, надають ніжності."}]}, {"id": "pryr-tychyna-rylskyi", "sec": "Рідна Україна. Світ природи", "title": "Павло Тичина і Максим Рильський: вірші про природу", "goal": "Ти пам'ятаєш вірші Тичини («Не бував ти у наших краях!», «Гаї шумлять», «Блакить мою душу обвіяла») і Рильського («Дощ», «Осінь-маляр…»).", "learn": [{"h": "Павло Тичина (1891–1967)", "p": ["Поет із Чернігівщини (село Піски), мав чудовий музичний слух — його вірші співучі. Збірка <b>«Сонячні кларнети»</b>. Творив письменницькі новотвори (<i>яблуневоцвітно</i>)."], "ex": ["<b>«Не бував ти у наших краях!»</b> — захоплена розповідь про рідну землю: степи, річки, небо, «там же небо — блакитні простори». Патріотична гордість, звертання до співрозмовника.", "<b>«Гаї шумлять»</b> — радість від природи: гаї шумлять, хмарки біжать, річка «дзвінка», ліричний герой «іду, іду», «гей, дзвін гуде іздалеку». Багато повторів, музичність.", "<b>«Блакить мою душу обвіяла»</b> — весна, душа радіє, «гей, поля жовтіють… далі, далі…». Єдність людини й природи."]}, {"h": "Максим Рильський (1895–1964)", "p": ["Поет, перекладач, учений, з Київщини (Романівка). Класичні, точні вірші про природу й працю."], "ex": ["<b>«Дощ» («Благодатний, довгожданий…»)</b> — літній дощ, якого чекали поля й люди: «дощик вийшов і на землю впав»; сад, ластівки, радість оновлення. Епітети: благодатний, довгожданий.", "<b>«Осінь-маляр із палітрою пишною»</b> — осінь як художниця, що фарбує дерева: «тихо береться до праці», кладе на клени «жовті», на дуби «червоні» барви. Метафора-персоніфікація осені."]}], "remember": "Тичина — музичні вірші, «Сонячні кларнети»: «Не бував ти у наших краях!» (гордість за край), «Гаї шумлять» (радість, повтори), «Блакить мою душу обвіяла» (весна). Рильський: «Дощ» (благодатний, довгожданий), «Осінь-маляр» (осінь як художниця).", "cards": [{"f": "Хто написав «Гаї шумлять»?", "b": "Павло Тичина."}, {"f": "Хто написав «Осінь-маляр із палітрою пишною»?", "b": "Максим Рильський."}, {"f": "Збірка Тичини «Сонячні кларнети»", "b": "Перша збірка, музична, сонячна поезія."}, {"f": "«Не бував ти у наших краях!» — головне почуття", "b": "Гордість за рідну землю, захоплення."}, {"f": "«Осінь-маляр» — який засіб?", "b": "Персоніфікація/метафора: осінь — художниця з палітрою."}, {"f": "«Дощ» Рильського — епітети до дощу", "b": "Благодатний, довгожданий."}], "quiz": [{"t": "choice", "q": "Хто автор вірша «Гаї шумлять»?", "o": ["Тичина", "Рильський", "Шевченко"], "a": 0, "e": "Павло Тичина."}, {"t": "choice", "q": "Хто автор вірша «Осінь-маляр із палітрою пишною»?", "o": ["Тичина", "Рильський", "Олесь"], "a": 1, "e": "Максим Рильський."}, {"t": "choice", "q": "Чому осінь названо маляром?", "o": ["Бо дощить", "Бо вона розфарбовує дерева, як художник", "Бо холодно"], "a": 1, "e": "Осінь-художниця з палітрою."}, {"t": "choice", "q": "«Осінь-маляр» — який художній засіб?", "o": ["Персоніфікація", "Гіпербола", "Порівняння"], "a": 0, "e": "Пора року наділена рисами людини."}, {"t": "choice", "q": "Яке почуття в «Не бував ти у наших краях!»?", "o": ["Гордість за рідний край", "Сум", "Страх"], "a": 0, "e": "Захоплення рідною землею."}, {"t": "choice", "q": "Якими епітетами Рильський називає дощ?", "o": ["Холодний, сірий", "Благодатний, довгожданий", "Дрібний, нудний"], "a": 1, "e": "Дощ довго чекали — він благодатний."}, {"t": "choice", "q": "Особливість поезії Тичини:", "o": ["Музичність, співучість", "Довгі описи битв", "Відсутність рими"], "a": 0, "e": "Тичина мав музичний слух — вірші звучать як пісня."}, {"t": "choice", "q": "Як називається перша збірка Тичини?", "o": ["«Кобзар»", "«Сонячні кларнети»", "«Княжа Україна»"], "a": 1, "e": "«Сонячні кларнети»."}, {"t": "tf", "q": "«Блакить мою душу обвіяла» — вірш про зиму.", "a": false, "e": "Про весну і радість оновлення."}]}, {"id": "pryr-hutsalo-los", "sec": "Рідна Україна. Світ природи", "title": "Євген Гуцало. «Лось». Оповідання. Вірші «Зірка», «Журавлі високі пролітають»", "goal": "Ти пам'ятаєш сюжет «Лося», знаєш ознаки оповідання й пам'ятаєш вірші Гуцала.", "learn": [{"h": "Євген Гуцало (1937–1995)", "p": ["Прозаїк і поет із Вінниччини (Старий Животів). Багато писав про природу й дітей, про село; оповідання «Лось», «Сім'я дикої качки»."]}, {"h": "«Лось»", "p": ["Красивий лось із заповідника прийшов у ліс і на річці провалився в <b>ополонку</b> — крига не витримала. Двоє <b>братів</b> (старший і менший), що йшли лісом, витягли його: старший подав жердину, лось вибрався. Хлопці милувалися ним. Але тут пролунав постріл — браконьєр <b>Шпичак</b> убив лося заради м'яса й рогів. Хлопці плакали; Шпичак намагався їх задобрити й залякати, щоб мовчали. Хлопці не пробачили."], "note": "Головна думка: природа беззахисна перед жадібністю; милосердя дітей проти жорстокості дорослого."}, {"h": "Оповідання", "p": ["<span class='term'>Оповідання</span> — невеликий епічний твір про одну подію з життя героя, з небагатьма персонажами, коротким часом дії. «Лось» — оповідання: одна подія (порятунок і загибель лося), троє людей."]}, {"h": "Вірші Гуцала", "p": ["<b>«Зірка»</b> — про зірку, що впала в саду; ліричний герой шукає її; образ дива в буденному.", "<b>«Журавлі високі пролітають»</b> — осінь, журавлі летять, лишають смуток; ліричний герой проводжає їх поглядом; єдність людини й природи."]}], "remember": "«Лось»: лось провалився в ополонку, два брати врятували, браконьєр Шпичак застрелив. Оповідання — одна подія, мало героїв. Вірші Гуцала: «Зірка», «Журавлі високі пролітають».", "cards": [{"f": "Хто врятував лося з ополонки?", "b": "Двоє братів — старший і менший."}, {"f": "Хто вбив лося?", "b": "Браконьєр Шпичак."}, {"f": "Оповідання", "b": "Невеликий епічний твір про одну подію з небагатьма героями."}, {"f": "Головна думка «Лося»", "b": "Природа беззахисна перед жадібністю людини; дитяче милосердя проти жорстокості."}, {"f": "Автор «Лося»", "b": "Євген Гуцало."}, {"f": "Вірші Гуцала у 5 класі", "b": "«Зірка», «Журавлі високі пролітають»."}], "quiz": [{"t": "choice", "q": "Що сталося з лосем на річці?", "o": ["Провалився в ополонку", "Втік у ліс", "Заснув"], "a": 0, "e": "Крига не витримала."}, {"t": "choice", "q": "Хто витяг лося?", "o": ["Лісник", "Двоє братів", "Шпичак"], "a": 1, "e": "Хлопці подали жердину."}, {"t": "choice", "q": "Хто такий Шпичак?", "o": ["Лісник", "Браконьєр, що вбив лося", "Учитель"], "a": 1, "e": "Застрелив лося заради м'яса й рогів."}, {"t": "choice", "q": "Як хлопці поставились до вчинку Шпичака?", "o": ["Зраділи", "Плакали й не пробачили", "Забули"], "a": 1, "e": "Дитяче серце не змирилось із жорстокістю."}, {"t": "choice", "q": "«Лось» — це…", "o": ["повість", "оповідання", "казка"], "a": 1, "e": "Одна подія, мало героїв."}, {"t": "choice", "q": "Ознака оповідання:", "o": ["Багато розділів і років дії", "Одна подія й небагато героїв", "Пишеться віршами"], "a": 1, "e": "Оповідання коротке."}, {"t": "choice", "q": "Звідки прийшов лось?", "o": ["Із заповідника", "З цирку", "Із села"], "a": 0, "e": "Лось із заповідника."}, {"t": "choice", "q": "Який вірш написав Гуцало?", "o": ["«Журавлі високі пролітають»", "«Гаї шумлять»", "«Дощ»"], "a": 0, "e": "«Гаї шумлять» — Тичина, «Дощ» — Рильський."}, {"t": "tf", "q": "Головна думка «Лося» — люди мають захищати природу.", "a": true, "e": "Так."}]}, {"id": "pryr-vinhranovskyi", "sec": "Рідна Україна. Світ природи", "title": "Микола Вінграновський. «Сіроманець». Вірші", "goal": "Ти пам'ятаєш героїв і сюжет повісті «Сіроманець» та вірші Вінграновського.", "learn": [{"h": "Микола Вінграновський (1936–2004)", "p": ["Поет, прозаїк, кіноактор і режисер з Миколаївщини (Богопіль/Первомайськ). Писав про природу, дитинство, Україну; для дітей — повість «Сіроманець», вірші «Перша колискова», «Сама собою річка ця тече»."]}, {"h": "«Сіроманець»", "p": ["<b>Сіроманець</b> — старий мудрий вовк, «найхитріший вовк у світі», якого не можуть уполювати. Хлопчик <b>Сашко</b> із села знаходить у степу вовка — той старий і <b>сліпий</b> — і заприязнюється з ним: вовк відчуває добру людину. Мисливець <b>Василь Чепіжний</b> ненавидить вовка й хоче його вбити (мріє про славу, дає інтерв'ю для районного радіо). Сашко ховає Сіроманця, мріє відвезти його до <b>Одеси</b>, в очну лікарню Філатова, щоб вилікували. Друг Сашка — <b>Андрійко</b>, у селі — Петро Лях, Галя Грушецька. Вовк тікає в солоні степи, ховається на військовому <b>полігоні</b>. Кінець — Сіроманець повертається до Сашка; дружба хлопчика й дикого звіра."], "note": "Головна думка: тварини відчувають добро і зло; людина має бути милосердною до природи."}, {"h": "Пейзаж", "p": ["<span class='term'>Пейзаж</span> — опис природи в художньому творі; передає настрій. У «Сіроманці» багато степових пейзажів: сніги, вітри, лиман — з порівняннями, епітетами, персоніфікаціями (<i>вітри навивали пісні</i>)."]}, {"h": "Вірші", "p": ["<b>«Перша колискова»</b> — ніжна пісня матері дитині: «спи, моя дитино золота»; образ рідної землі, яка теж колише дитину.", "<b>«Сама собою річка ця тече»</b> — ліричний герой іде вздовж річки, спокій, злиття з природою; повтори «сама собою»."]}], "remember": "Сіроманець — старий сліпий вовк; Сашко дружить із ним, ховає від мисливця Василя Чепіжного, хоче везти в Одесу до лікаря Філатова; вовк ховається на полігоні. Пейзаж — опис природи. Вірші: «Перша колискова», «Сама собою річка ця тече».", "cards": [{"f": "Хто такий Сіроманець?", "b": "Старий сліпий вовк, «найхитріший у світі»."}, {"f": "Як звали хлопчика, що дружив із вовком?", "b": "Сашко."}, {"f": "Хто хотів убити Сіроманця?", "b": "Мисливець Василь Чепіжний."}, {"f": "Куди Сашко мріяв відвезти вовка?", "b": "До Одеси, у лікарню Філатова — вилікувати очі."}, {"f": "Де ховався Сіроманець від мисливців?", "b": "На військовому полігоні в солоних степах."}, {"f": "Пейзаж", "b": "Опис природи в художньому творі."}, {"f": "Вірші Вінграновського", "b": "«Перша колискова», «Сама собою річка ця тече»."}], "quiz": [{"t": "choice", "q": "Хто такий Сіроманець?", "o": ["Пес", "Старий вовк", "Кінь"], "a": 1, "e": "Найхитріший вовк у світі."}, {"t": "choice", "q": "Яка вада була у Сіроманця?", "o": ["Він був сліпий", "Кульгав", "Був глухий"], "a": 0, "e": "Сліпий старий вовк."}, {"t": "input", "q": "Як звали хлопчика, друга Сіроманця?", "a": ["сашко", "саша", "олександр"], "e": "Сашко."}, {"t": "choice", "q": "Хто такий Василь Чепіжний?", "o": ["Лікар", "Мисливець, що хотів убити вовка", "Учитель Сашка"], "a": 1, "e": "Мріяв про славу переможця вовка."}, {"t": "choice", "q": "Куди Сашко хотів везти вовка?", "o": ["У Київ", "В Одесу, до лікарні Філатова", "У заповідник"], "a": 1, "e": "Щоб вилікувати очі."}, {"t": "choice", "q": "Де сховався Сіроманець від людей?", "o": ["На полігоні", "У селі", "У Дніпрі"], "a": 0, "e": "На військовому полігоні в степу."}, {"t": "choice", "q": "Опис природи у творі називається…", "o": ["портрет", "пейзаж", "ремарка"], "a": 1, "e": "Пейзаж."}, {"t": "choice", "q": "«Перша колискова» — це вірш…", "o": ["Вінграновського", "Тичини", "Гуцала"], "a": 0, "e": "Микола Вінграновський."}, {"t": "choice", "q": "Чого вчить «Сіроманець»?", "o": ["Полювати на вовків", "Милосердя до тварин; звірі відчувають добро", "Боятися степу"], "a": 1, "e": "Дружба хлопчика й вовка."}, {"t": "tf", "q": "Вінграновський був також кіноактором і режисером.", "a": true, "e": "Так, знімався в фільмах Довженка."}]}, {"id": "pryr-tiutiunnyk-dyvak", "sec": "Рідна Україна. Світ природи", "title": "Григір Тютюнник. «Дивак»", "goal": "Ти пам'ятаєш героїв оповідання й розумієш, чому Олеся називають диваком.", "learn": [{"h": "Григір Тютюнник (1931–1980)", "p": ["Прозаїк із Полтавщини (Шилівка). Писав про село, дітей, людську доброту: «Дивак», «Климко», «Вогник далеко в степу». Мова його творів багата, з діалектними словами."]}, {"h": "«Дивак»", "p": ["<b>Олесь</b> — сільський хлопчик, першокласник, який бачить світ інакше: розглядає під кригою рибу і не дає щуці з'їсти пліточку, шкодує дерева, малює на уроці не так, як усі (дятла, а не горщик), не хоче бити хлопця у відповідь. Однокласник <b>Федько Тойкало</b> б'є його — Олесь не мститься. Учителька <b>Матильда Петрівна</b> не розуміє його. <b>Дід Прокіп</b> любить Олеся, але вчить: «Тебе ж усі за дивака вважатимуть… Тобі ж жити треба», «у людей звірячий закон». Олесь плаче — не хоче бути жорстоким."], "note": "Головна думка: доброта й чуйність — не дивацтво, а справжня людяність; шкода, коли світ вважає їх слабкістю."}, {"h": "Характеристика героя", "p": ["Через <b>учинки</b> (рятує рибку, не б'ється), <b>мову</b> (тихий, лагідний), <b>ставлення інших</b> (Федько зневажає, дід жаліє). Олесь — спостережливий, добрий, мрійливий, ранимий."]}], "remember": "Олесь — добрий хлопчик-«дивак»: шкодує рибу й дерева, малює дятла, не б'ється. Федько Тойкало — забіяка, Матильда Петрівна — вчителька, дід Прокіп — любить, але вчить «звірячого закону». Ідея: доброта — не слабкість.", "cards": [{"f": "Хто головний герой «Дивака»?", "b": "Олесь, сільський першокласник."}, {"f": "Чому Олеся вважають диваком?", "b": "Він добрий і чуйний: шкодує рибу, дерева, не б'ється, малює не як усі."}, {"f": "Хто бив Олеся?", "b": "Федько Тойкало."}, {"f": "Хто дід Прокіп?", "b": "Дід Олеся; любить його, але вчить, що «у людей звірячий закон»."}, {"f": "Учителька Олеся", "b": "Матильда Петрівна."}, {"f": "Автор «Дивака»", "b": "Григір Тютюнник."}], "quiz": [{"t": "choice", "q": "Хто автор оповідання «Дивак»?", "o": ["Гуцало", "Тютюнник", "Вінграновський"], "a": 1, "e": "Григір Тютюнник."}, {"t": "choice", "q": "Як звали головного героя?", "o": ["Сашко", "Олесь", "Павлусь"], "a": 1, "e": "Олесь."}, {"t": "choice", "q": "Кого Олесь не дав з'їсти щуці?", "o": ["Пліточку", "Рака", "Жабу"], "a": 0, "e": "Стукав по кризі, щоб відігнати щуку."}, {"t": "choice", "q": "Що намалював Олесь на уроці замість горщика?", "o": ["Дятла", "Танк", "Дім"], "a": 0, "e": "Дятла — за що вчителька його не зрозуміла."}, {"t": "choice", "q": "Хто бив Олеся?", "o": ["Дід Прокіп", "Федько Тойкало", "Старший брат"], "a": 1, "e": "Федько Тойкало."}, {"t": "choice", "q": "Чому Олесь не б'ється у відповідь?", "o": ["Боїться", "Не хоче бути жорстоким", "Не вміє"], "a": 1, "e": "Доброта — його природа."}, {"t": "choice", "q": "Чого вчить Олеся дід Прокіп?", "o": ["Бути ще добрішим", "Що «у людей звірячий закон», треба вміти постояти за себе", "Малювати"], "a": 1, "e": "Дід жаліє, але хоче, щоб Олесь вижив у жорсткому світі."}, {"t": "input", "q": "Як звали вчительку Олеся? … Петрівна", "a": ["матильда", "матильда петрівна"], "e": "Матильда Петрівна."}, {"t": "choice", "q": "Головна думка оповідання:", "o": ["Диваків треба виправляти", "Доброта — не слабкість, а людяність", "Треба вміти битися"], "a": 1, "e": "Автор на боці Олеся."}]}, {"id": "pryr-vynnychenko-fedko", "sec": "Рідна Україна. Світ природи", "title": "Володимир Винниченко. «Федько-халамидник»", "goal": "Ти пам'ятаєш сюжет оповідання і протиставлення Федька й Толі.", "learn": [{"h": "Володимир Винниченко (1880–1951)", "p": ["Письменник і політик з Єлисаветграда (Кропивницький), голова уряду УНР 1917–1918. Автор оповідань про дітей: «Федько-халамидник», «Кумедія з Костем». Помер у Франції."]}, {"h": "Сюжет", "p": ["<b>Федько</b> — син бідного робітника, <b>халамидник</b> (шибеник, заводій): ламає чужі змії, б'ється, але <b>чесний</b> — ніколи не бреше і не боїться зізнатися. <b>Толя</b> — син багатого хазяїна дому, тихий, слабкий, боязкий і <b>брехливий</b>. Навесні хлопці катаються на кризі на річці. Толя, наслідуючи Федька, опиняється на крижині, що відірвалась; Федько <b>рятує</b> його, сам падає в холодну воду. Толя каже батькам, що то Федько його штовхнув і підбивав. Батько б'є Федька; той захворів на запалення легень і <b>помирає</b>. Толя ж просить віддати йому Федькового чижика."], "note": "Головна думка: справжня шляхетність — у вчинках, а не в багатстві; брехня і боягузтво гірші за пустощі."}, {"h": "Протиставлення (антитеза)", "p": ["Автор ставить героїв поруч: бідний — багатий, сміливий — боязкий, чесний — брехливий. Так яскравіше видно, хто справді добрий."]}], "remember": "Федько — бідний, халамидник, але чесний і сміливий; Толя — багатий, боязкий, брехливий. Федько врятував Толю з крижини, Толя оббрехав його, Федько захворів і помер; Толя забрав чижика. Антитеза — протиставлення героїв.", "cards": [{"f": "Що означає «халамидник»?", "b": "Шибеник, заводій, пустун."}, {"f": "Головні риси Федька", "b": "Пустун, але чесний, сміливий, ніколи не бреше."}, {"f": "Головні риси Толі", "b": "Тихий, боязкий, брехливий, син багатих."}, {"f": "Як Федько врятував Толю?", "b": "Зняв з крижини, що відірвалась, сам упав у холодну воду."}, {"f": "Чому помер Федько?", "b": "Толя оббрехав його, батько побив, Федько застудився й помер від запалення легень."}, {"f": "Антитеза", "b": "Протиставлення (героїв, понять) для яскравішого зображення."}], "quiz": [{"t": "choice", "q": "Хто автор «Федька-халамидника»?", "o": ["Винниченко", "Тютюнник", "Нечуй-Левицький"], "a": 0, "e": "Володимир Винниченко."}, {"t": "choice", "q": "Що означає слово «халамидник»?", "o": ["Відмінник", "Шибеник, пустун", "Багатій"], "a": 1, "e": "Заводій, пустун."}, {"t": "choice", "q": "Яка головна риса Федька попри пустощі?", "o": ["Чесність", "Жадібність", "Боягузтво"], "a": 0, "e": "Федько ніколи не бреше."}, {"t": "choice", "q": "Ким був Толя?", "o": ["Сином багатого хазяїна дому", "Братом Федька", "Учителем"], "a": 0, "e": "Син багатих сусідів."}, {"t": "choice", "q": "Що зробив Федько на річці?", "o": ["Утік", "Урятував Толю з крижини", "Штовхнув Толю"], "a": 1, "e": "Сам упав у воду, але врятував."}, {"t": "choice", "q": "Що сказав Толя батькам?", "o": ["Правду", "Що Федько його штовхнув", "Нічого"], "a": 1, "e": "Оббрехав рятівника."}, {"t": "choice", "q": "Чим закінчилось оповідання?", "o": ["Федько одужав", "Федько помер, а Толя забрав його чижика", "Хлопці подружились"], "a": 1, "e": "Трагічна кінцівка."}, {"t": "choice", "q": "Протиставлення героїв у творі називається…", "o": ["антитеза", "метафора", "портрет"], "a": 0, "e": "Антитеза."}, {"t": "tf", "q": "Толя виявився сміливішим за Федька.", "a": false, "e": "Навпаки, Толя — боязкий і брехливий."}, {"t": "choice", "q": "Головна думка:", "o": ["Бідні завжди погані", "Шляхетність — у вчинках, а не в багатстві", "Не катайся на кризі"], "a": 1, "e": "Автор показує справжню доброту бідного хлопця."}]}, {"id": "pryh-nestaiko", "sec": "Пригоди та фантастика", "title": "Всеволод Нестайко. «Чарівний талісман»", "goal": "Ти пам'ятаєш героїв і сюжет повісті Нестайка.", "learn": [{"h": "Всеволод Нестайко (1930–2014)", "p": ["Найпопулярніший український дитячий письменник, з Бердичева, жив у Києві. Автор «Тореадорів з Васюківки», «В Країні Сонячних Зайчиків», «Чарівного талісмана». Його книжки веселі, з пригодами й гумором."]}, {"h": "Сюжет", "p": ["Троє друзів із села: <b>Сашко Марусик</b> — нерішучий, боязкий, соромливий; <b>Сашко Циган</b> — сміливий, рішучий; <b>Журавель</b>. Марусик мріє стати сміливим — друзі дарують йому «чарівний талісман» — <b>жаб'ячу лапку</b>, щоб додати хоробрості. Батьки Цигана й Марусика сваряться через <b>лотерейний білет</b>, який нібито виграв. Хлопці тікають з дому в ліс, будують курінь (на <b>Бамбурах</b>), щоб батьки помирилися. Уночі таємничий незнайомець зазирає до куреня. Батьки хвилюються, шукають. Зрештою виявляється, що в газеті була <b>помилка</b> — білет не виграшний, і всі дружно сміються. Хлопці розуміють, які «складні люди» дорослі. Марусик стає впевненішим — сміливість не в талісмані, а в собі."], "note": "Головна думка: справжня сміливість — усередині людини; дружба й сім'я важливіші за гроші."}], "remember": "Сашко Марусик (боязкий), Сашко Циган (сміливий), Журавель. Талісман — жаб'яча лапка. Сварка батьків через лотерейний білет → втеча в ліс (Бамбури) → помилка в газеті → усі помирились.", "cards": [{"f": "Хто головні герої «Чарівного талісмана»?", "b": "Сашко Марусик, Сашко Циган, Журавель."}, {"f": "Що таке «чарівний талісман»?", "b": "Жаб'яча лапка, що мала зробити Марусика сміливим."}, {"f": "Через що посварились батьки?", "b": "Через лотерейний білет, який нібито виграв."}, {"f": "Чому хлопці втекли з дому?", "b": "Щоб батьки помирились."}, {"f": "Чим усе закінчилось?", "b": "У газеті була помилка — білет не виграв; усі засміялись і помирились."}, {"f": "Автор «Тореадорів з Васюківки»", "b": "Всеволод Нестайко."}], "quiz": [{"t": "choice", "q": "Хто з героїв боязкий і нерішучий?", "o": ["Сашко Циган", "Сашко Марусик", "Журавель"], "a": 1, "e": "Марусик мріяв стати сміливим."}, {"t": "choice", "q": "Що було «чарівним талісманом»?", "o": ["Перстень", "Жаб'яча лапка", "Монета"], "a": 1, "e": "Жаб'яча лапка."}, {"t": "choice", "q": "Через що сварились батьки?", "o": ["Через город", "Через лотерейний білет", "Через собаку"], "a": 1, "e": "Через «виграшний» білет."}, {"t": "choice", "q": "Навіщо хлопці втекли в ліс?", "o": ["Шукати скарб", "Щоб батьки помирились", "Полювати"], "a": 1, "e": "Хотіли примирити батьків."}, {"t": "choice", "q": "Що з'ясувалося наприкінці?", "o": ["Білет виграв мільйон", "У газеті була помилка, білет не виграшний", "Білет украли"], "a": 1, "e": "Поштар приніс газету з поправкою."}, {"t": "choice", "q": "Автор «Чарівного талісмана» —", "o": ["Нестайко", "Малик", "Мензатюк"], "a": 0, "e": "Всеволод Нестайко."}, {"t": "choice", "q": "Головна думка повісті:", "o": ["Талісмани допомагають", "Сміливість — усередині людини; дружба й сім'я важливіші за гроші", "Треба вигравати в лотерею"], "a": 1, "e": "Марусик став сміливим сам."}, {"t": "tf", "q": "Батьки раділи, що хлопці втекли.", "a": false, "e": "Ні, вони хвилювалися й шукали їх."}]}, {"id": "pryh-vdovychenko-koty", "sec": "Пригоди та фантастика", "title": "Галина Вдовиченко. «36 і 6 котів»", "goal": "Ти пам'ятаєш, як 36 котів і 6 кошенят оселилися в пані Крепової, і головних героїв-котів.", "learn": [{"h": "Галина Вдовиченко", "p": ["Сучасна письменниця зі Львова, журналістка. «36 і 6 котів» — весела повість-казка, що має продовження («36 і 6 котів-детективів», «…компаньйонів»)."]}, {"h": "Сюжет", "p": ["Дощового вечора до квартири <b>пані Крепової</b>, яка живе з племінником <b>Стасом</b>, попросилися перебути негоду <b>36 дорослих котів і 6 кошенят</b> — підвальні коти. Серед них: розважлива <b>Пушинка</b>, ватажок <b>Кутузов</b>, породиста <b>Баронеса</b>, дотепний <b>Голота</b>, <b>Коментатор — Чорний кіт</b>, <b>Альбінос</b>, <b>Бубуляк</b>, вухастий малюк <b>Клаповух</b>, <b>Хвостуля</b>, вісім кішечок-<b>жоржинок</b>, мсьє <b>Ля Сосис</b>. Коти обжилися, влаштовують конкурси («Вуса сезону»), розповідають життєві історії. Вони дізнаються, що Стас має <b>кав'ярню</b>, у якій справи кепські, — і коти беруться допомогти. Коти совісні: помічають, що господиня варить кашу на воді, бо вони її об'їдають."], "note": "Головна думка: доброта, взаємодопомога, дружба; кожен, навіть «безпородний», цінний."}, {"h": "Гумор у творі", "p": ["Коти поводяться як люди: сваряться, влаштовують репортажі, згадують минуле. Смішні імена й ситуації — це <b>гумор</b>, добрий сміх."]}], "remember": "Пані Крепова, племінник Стас (кав'ярня). 36 котів і 6 кошенят: Пушинка, Кутузов, Баронеса, Голота, Коментатор — Чорний кіт, Альбінос, Клаповух, жоржинки. Конкурс «Вуса сезону». Ідея: доброта й взаємодопомога.", "cards": [{"f": "До кого прийшли 36 і 6 котів?", "b": "До пані Крепової та її племінника Стаса."}, {"f": "Скільки було дорослих котів і кошенят?", "b": "36 дорослих і 6 кошенят."}, {"f": "Хто такий Стас?", "b": "Племінник пані Крепової, має кав'ярню зі скрутними справами."}, {"f": "Хто така Баронеса?", "b": "Породиста кішка, яку колись врятували підвальні коти."}, {"f": "Який конкурс влаштували коти?", "b": "«Вуса сезону» — на найдовші вуса."}, {"f": "Хто вів репортаж про конкурс?", "b": "Коментатор — Чорний кіт."}], "quiz": [{"t": "choice", "q": "Скільки котів прийшло до пані Крепової?", "o": ["36 дорослих і 6 кошенят", "6 дорослих і 36 кошенят", "42 кошенят"], "a": 0, "e": "Разом 42."}, {"t": "choice", "q": "Чому коти попросилися в квартиру?", "o": ["Щоб з'їсти рибу", "Перебути дощ і негоду", "Шукали Стаса"], "a": 1, "e": "Був дощовий вечір."}, {"t": "choice", "q": "Хто такий Стас?", "o": ["Кіт", "Племінник пані Крепової", "Сусід"], "a": 1, "e": "Має кав'ярню."}, {"t": "choice", "q": "Який конкурс влаштували коти?", "o": ["На найдовші вуса", "На найгучніше мурчання", "На швидкість"], "a": 0, "e": "«Вуса сезону»."}, {"t": "choice", "q": "Хто вів репортаж?", "o": ["Пушинка", "Коментатор — Чорний кіт", "Стас"], "a": 1, "e": "Коментатор."}, {"t": "choice", "q": "Що помітила Пушинка про господиню?", "o": ["Вона варить кашу на воді, бо коти її об'їдають", "Вона не любить котів", "Вона багата"], "a": 0, "e": "Коти відчули провину."}, {"t": "choice", "q": "Хто така Баронеса?", "o": ["Породиста кішка, яку врятували підвальні коти", "Господиня", "Кошеня"], "a": 0, "e": "Голота вилікував її травою."}, {"t": "choice", "q": "Головна думка твору:", "o": ["Коти шкідливі", "Доброта, дружба, взаємодопомога", "Не пускай котів у дім"], "a": 1, "e": "Коти й люди допомагають одні одним."}, {"t": "tf", "q": "«36 і 6 котів» — сучасна повість-казка.", "a": true, "e": "Так, Галина Вдовиченко."}]}, {"id": "pryh-malyk-horchyk", "sec": "Пригоди та фантастика", "title": "Галина Малик. «Мандри та подвиги лицаря Горчика»", "goal": "Ти пам'ятаєш героїв гумористичної казки про лицаря Горчика.", "learn": [{"h": "Сюжет", "p": ["У давній Україні жили лицарі, які билися зі зміями, що вимагали красунь. З'явився багатоголовий <b>Змій Горинич</b> на північних землях, і <b>князь Галицький</b> скликав усіх лицарів на нараду. Юний лицар <b>Горчик</b>, ласун до цукерок, вирушає на своїй вередливій конячці <b>Кобурці</b> (підкував за дві гривні, прикрасив трилисниками із золотого скотчу). Дорогою зустрічає <b>Того-Що-В-Дуплі-Сидить</b>, <b>Греця</b> (з'являється, коли кажуть «грець із тобою!»), маленьку <b>русалоньку</b> в трилітровій банці; його рятує від Того-Що-Печери-Риє. У родині Зайвих знаходить банконосця <b>Третього Зайвого</b>. Разом із красунею <b>Каролею</b> здолають Змія."], "note": "Головна думка: сміливість, дружба й кмітливість перемагають; гумор робить казку сучасною (г const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}

function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/[^a-z0-9а-яіїєґ' \-]/gi,"").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
