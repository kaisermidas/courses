<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Українська література · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>

const COURSE = {"id": "ukrlit5", "title": "Українська література", "subtitle": "5 клас · 34 уроків за підручниками Авраменка, Заболотного, Коваленко", "lessons": [{"id": "lit-vstup", "sec": "Вступ", "title": "Слово в житті людини. Художня література як мистецтво слова", "goal": "Ти знаєш, що таке художня література, чим вона відрізняється від інших мистецтв, і які є роди літератури.", "learn": [{"h": "Образне слово", "p": ["Слово може просто називати (<i>дощ</i>), а може малювати картину й викликати почуття (<i>дощ шепоче, сльози неба</i>). <span class='term'>Образне слово</span> — першоелемент літератури: письменник створює світ за допомогою слів, як художник — фарбами, композитор — звуками."]}, {"h": "Художня література", "p": ["<span class='term'>Художня література</span> — мистецтво слова. Вона не лише передає інформацію, а зображує життя в образах і викликає переживання. <span class='term'>Художній образ</span> — картина життя, створена уявою автора (образ героя, природи, події)."]}, {"h": "Три роди літератури", "p": ["<b>Епос</b> — розповідь про події та героїв (казка, оповідання, повість, роман, міф, легенда).", "<b>Лірика</b> — вірші, що передають почуття й думки (вірш, пісня).", "<b>Драма</b> — твори для сцени, побудовані на діалогах (п'єса, драматична поема)."]}, {"h": "Фольклор", "p": ["<span class='term'>Фольклор</span> (усна народна творчість) — твори, які створив народ і передавав з уст в уста: міфи, легенди, казки, перекази, загадки, прислів'я, пісні. Автора немає. <span class='term'>Літературний твір</span> має конкретного автора."]}], "remember": "Художня література — мистецтво слова, зображує життя в образах. Три роди: епос (розповідь), лірика (почуття у віршах), драма (для сцени). Фольклор — народна творчість без автора.", "cards": [{"f": "Художня література", "b": "Мистецтво слова; зображує життя в художніх образах."}, {"f": "Художній образ", "b": "Картина життя (герой, природа, подія), створена уявою автора."}, {"f": "Три роди літератури", "b": "Епос, лірика, драма."}, {"f": "Епос", "b": "Розповідь про події та героїв: казка, оповідання, повість."}, {"f": "Лірика", "b": "Вірші, що передають почуття й думки."}, {"f": "Драма", "b": "Твори для постановки на сцені, побудовані на діалогах."}, {"f": "Фольклор", "b": "Усна народна творчість: міфи, казки, легенди, прислів'я. Автора немає."}], "quiz": [{"t": "choice", "q": "Художня література — це мистецтво…", "o": ["звуку", "слова", "кольору"], "a": 1, "e": "Письменник творить образи словами."}, {"t": "choice", "q": "Скільки родів літератури?", "o": ["Два", "Три", "П'ять"], "a": 1, "e": "Епос, лірика, драма."}, {"t": "choice", "q": "Казка, оповідання, повість належать до…", "o": ["епосу", "лірики", "драми"], "a": 0, "e": "Це розповідні твори — епос."}, {"t": "choice", "q": "Вірш про почуття ліричного героя — це…", "o": ["епос", "лірика", "драма"], "a": 1, "e": "Лірика передає почуття й думки."}, {"t": "choice", "q": "П'єса для театру — це…", "o": ["епос", "лірика", "драма"], "a": 2, "e": "Драма — для сцени, побудована на діалогах."}, {"t": "choice", "q": "Що таке фольклор?", "o": ["Твори одного письменника", "Усна народна творчість", "Наукові книжки"], "a": 1, "e": "Фольклор створив народ, автора немає."}, {"t": "tf", "q": "У фольклорного твору є конкретний автор.", "a": false, "e": "Ні, фольклор — колективна народна творчість."}, {"t": "input", "q": "Як називається картина життя (герой, подія, природа), створена уявою автора?", "a": ["художній образ", "образ"], "e": "Художній образ."}, {"t": "choice", "q": "Що НЕ є фольклором?", "o": ["Народна казка", "Прислів'я", "Оповідання Гуцала"], "a": 2, "e": "Оповідання має автора — це літературний твір."}]}, {"id": "lit-mify", "sec": "Міфи і легенди", "title": "Міфи давніх українців: «Про зоряний Віз», «Дажбог», «Берегиня»", "goal": "Ти знаєш, що таке міф, і пам'ятаєш зміст міфів про зоряний Віз, Дажбога і Берегиню.", "learn": [{"h": "Міф", "p": ["<span class='term'>Міф</span> — давня розповідь про виникнення світу, богів, природних явищ. Давні люди вірили, що міфи — правда. Міфи пояснювали, чому є день і ніч, звідки зорі, гроза."], "note": "Давні українці шанували богів: <b>Дажбог</b> (сонце, добро), <b>Перун</b> (грім і блискавка), <b>Велес</b> (худоба, багатство), <b>Стрибог</b> (вітер), <b>Ярило</b> (весна), <b>Берегиня</b> (захисниця роду й дому)."}, {"h": "«Про зоряний Віз»", "p": ["Настала посуха, люди помирали від спраги. Дівчинка пішла шукати воду для хворої матері, знайшла джерело, набрала води у відерця. Дорогою напоїла цуценя й старого діда, а сама не пила. За доброту вода піднялася на небо і стала сузір'ям — Великим Возом (Великою Ведмедицею), а на Землі пішов дощ."], "note": "Головна думка: доброта й самопожертва винагороджуються."}, {"h": "«Дажбог»", "p": ["Дажбог — бог сонця, син Сварога. Він дає людям світло, тепло, врожай, «дає добро». Люди вважали себе «Дажбожими онуками». Міф пояснює, чому сонце сходить і заходить, чому змінюються пори року."]}, {"h": "«Берегиня»", "p": ["Берегиня — богиня-захисниця, мати всього живого. Вона навчила людей будувати хати, вирощувати хліб, ткати, вишивати; оберігає рід, дім і родину. Її образ — жінка з піднятими руками — зберігся на рушниках і писанках."]}], "remember": "Міф — давня розповідь про богів і створення світу, у яку вірили. Зоряний Віз — сузір'я з відерець доброї дівчинки. Дажбог — бог сонця. Берегиня — захисниця роду й дому, навчила людей ремесел.", "cards": [{"f": "Міф", "b": "Давня розповідь про богів, створення світу і природних явищ, у яку вірили як у правду."}, {"f": "Дажбог", "b": "Бог сонця, добра, врожаю; люди — «Дажбожі онуки»."}, {"f": "Берегиня", "b": "Богиня-захисниця роду й дому; навчила будувати хати, ткати, вишивати."}, {"f": "Перун", "b": "Бог грому й блискавки."}, {"f": "«Про зоряний Віз»: за що дівчинку нагороджено?", "b": "За доброту: напоїла цуценя й діда, а сама не пила; відерця стали сузір'ям."}, {"f": "Яке сузір'я в міфі «Про зоряний Віз»?", "b": "Великий Віз (Велика Ведмедиця)."}], "quiz": [{"t": "choice", "q": "Що таке міф?", "o": ["Смішна історія", "Давня розповідь про богів і створення світу", "Вірш про природу"], "a": 1, "e": "Міф пояснював світ, у нього вірили."}, {"t": "choice", "q": "Хто такий Дажбог?", "o": ["Бог грому", "Бог сонця", "Бог вітру"], "a": 1, "e": "Дажбог — сонце, світло, добро. Грім — Перун, вітер — Стрибог."}, {"t": "choice", "q": "Чому дівчинка в міфі «Про зоряний Віз» пішла по воду?", "o": ["Щоб полити квіти", "Щоб напоїти хвору матір", "Щоб помити посуд"], "a": 1, "e": "Вона рятувала матір від спраги."}, {"t": "choice", "q": "Кого напоїла дівчинка дорогою?", "o": ["Цуценя і старого діда", "Кота і сусідку", "Коня і брата"], "a": 0, "e": "Цуценя і діда, а сама не пила."}, {"t": "choice", "q": "На що перетворилися відерця?", "o": ["На річку", "На сузір'я Великий Віз", "На хмару"], "a": 1, "e": "Вода піднялася на небо і стала сузір'ям."}, {"t": "choice", "q": "Чого навчила людей Берегиня?", "o": ["Воювати", "Будувати хати, вирощувати хліб, ткати", "Полювати"], "a": 1, "e": "Берегиня — покровителька дому й праці."}, {"t": "input", "q": "Як називали себе давні українці за міфом про бога сонця? «… онуки»", "a": ["дажбожі", "дажбожі онуки", "дажбога"], "e": "Дажбожі онуки."}, {"t": "choice", "q": "Хто бог грому й блискавки?", "o": ["Велес", "Перун", "Ярило"], "a": 1, "e": "Перун. Велес — бог худоби, Ярило — весни."}, {"t": "tf", "q": "Давні люди вважали міфи вигадкою.", "a": false, "e": "Ні, у міфи вірили як у правду."}, {"t": "choice", "q": "Головна думка міфу «Про зоряний Віз»:", "o": ["Не ходи вночі по воду", "Доброта й самопожертва винагороджуються", "Зорі далеко"], "a": 1, "e": "Дівчинку нагороджено за доброту."}]}, {"id": "lit-lehendy", "sec": "Міфи і легенди", "title": "Легенди: «Чому пес живе коло людини», «Неопалима купина», «Як виникли Карпати», «Чому в морі є перли і мушлі»", "goal": "Ти відрізняєш легенду від міфу і пам'ятаєш зміст чотирьох легенд.", "learn": [{"h": "Легенда", "p": ["<span class='term'>Легенда</span> — народна розповідь про незвичайну подію, героя, походження назв чи явищ, де правда поєднана з вигадкою. На відміну від міфу, легенда часто пояснює щось конкретне: назву гір, чому пес живе з людиною."]}, {"h": "«Чому пес живе коло людини»", "p": ["Пес шукав найсильнішого господаря: служив зайцю, та той злякався вовка; вовк злякався ведмедя; ведмідь злякався людини. Так пес зрозумів, що людина найсильніша, і залишився з нею."], "note": "Ланцюжок: заєць → вовк → ведмідь → людина."}, {"h": "«Неопалима купина»", "p": ["Вороги (турки) обступили місто (Ковель? — у легенді просто місто). Захисники не здалися: місто не згоріло, як кущ, що горить і не згоряє. Неопалима купина — символ незнищенності, стійкості народу."]}, {"h": "«Як виникли Карпати»", "p": ["Жив велетень Силун (пан), який гнобив людей. Наймит-хлопець (Карпо) зрозумів, що Силун — велетень, і побився з ним. Від їхньої боротьби здибилась земля — так виникли гори Карпати, названі від імені Карпа. Пояснення назви гір."]}, {"h": "«Чому в морі є перли і мушлі»", "p": ["Красуня-дівчина втекла від ненависного нареченого в море; сльози її стали перлами, а мушлі — це… (за легендою) — вона й підводні мешканці ховають скарби в мушлях. Легенда пояснює походження перлів і мушель."]}], "remember": "Легенда — розповідь про незвичайну подію, де правда з вигадкою; часто пояснює назву або явище. Пес обрав найсильнішого — людину (заєць → вовк → ведмідь → людина). Карпати — від імені Карпа, що поборов велетня Силуна.", "cards": [{"f": "Легенда", "b": "Народна розповідь про незвичайну подію чи походження явища, де правда поєднана з вигадкою."}, {"f": "Чим легенда відрізняється від міфу?", "b": "Міф — про богів і створення світу; легенда — про конкретну подію, героя, назву."}, {"f": "«Чому пес живе коло людини»: у кого служив пес?", "b": "Заєць → вовк → ведмідь → людина (найсильніша)."}, {"f": "«Як виникли Карпати»: хто герой?", "b": "Наймит Карпо, що поборов велетня Силуна; гори названо від його імені."}, {"f": "Неопалима купина", "b": "Кущ, що горить і не згоряє; символ незнищенності народу."}], "quiz": [{"t": "choice", "q": "Легенда — це…", "o": ["правдива історична розповідь", "народна розповідь, де правда поєднана з вигадкою", "вірш"], "a": 1, "e": "У легенді реальне переплітається з фантастичним."}, {"t": "choice", "q": "Кого пес визнав найсильнішим?", "o": ["Ведмедя", "Вовка", "Людину"], "a": 2, "e": "Ведмідь злякався людини — отже, вона найсильніша."}, {"t": "choice", "q": "У якому порядку пес міняв господарів?", "o": ["Заєць, вовк, ведмідь, людина", "Вовк, заєць, людина, ведмідь", "Ведмідь, вовк, заєць, людина"], "a": 0, "e": "Від слабшого до сильнішого."}, {"t": "choice", "q": "Від чийого імені названо Карпати за легендою?", "o": ["Силуна", "Карпа", "Карпатія"], "a": 1, "e": "Карпо — наймит, що переміг велетня Силуна."}, {"t": "choice", "q": "Ким був Силун?", "o": ["Велетнем, що гнобив людей", "Добрим королем", "Пастухом"], "a": 0, "e": "Силун — велетень-гнобитель."}, {"t": "choice", "q": "Що символізує неопалима купина?", "o": ["Багатство", "Незнищенність, стійкість", "Смуток"], "a": 1, "e": "Горить і не згоряє — як народ, якого не зламати."}, {"t": "tf", "q": "Легенда «Як виникли Карпати» пояснює походження назви гір.", "a": true, "e": "Так, це легенда про походження назви."}, {"t": "input", "q": "Хто злякався вовка в легенді про пса?", "a": ["заєць"], "e": "Заєць."}, {"t": "choice", "q": "Чим міф відрізняється від легенди?", "o": ["Міф — про богів і створення світу, легенда — про конкретні події й назви", "Нічим", "Легенда завжди віршована"], "a": 0, "e": "Міф пояснює світобудову, легенда — окремі явища й події."}]}, {"id": "lit-perekazy", "sec": "Міфи і легенди", "title": "Народні перекази: «Прийом у запорожці», «Як Сірко переміг татар»", "goal": "Ти знаєш, що таке народний переказ, і пам'ятаєш, як приймали в запорожці.", "learn": [{"h": "Народний переказ", "p": ["<span class='term'>Переказ</span> — усна розповідь про справжні історичні події й людей, яка передається з покоління в покоління. Вигадки тут менше, ніж у легенді."]}, {"h": "«Прийом у запорожці»", "p": ["Хто хотів стати запорожцем, мав пройти випробування: з'їсти страву дуже гострої каші, довести, що вміє тримати ложку і не боїться (жарти на нього, ходити на Січі). Головне випробування — переплисти Дніпрові пороги на човні: хто пройде — козак. Козаки перевіряли сміливість, витривалість, кмітливість."]}, {"h": "«Як Сірко переміг татар»", "p": ["Іван Сірко — кошовий отаман, якого татари боялися. За переказом, Сірко перехитрив татарське військо: козаки вдавали, що їх мало, заманили ворогів, а тоді напали. Сірко був хитрим, мудрим і невразливим — казали, що він характерник."]}, {"h": "Запорозька Січ", "p": ["Козацька фортеця за Дніпровими порогами, вільна козацька республіка. Керував <b>кошовий отаман</b>. Запорожці — вільні воїни, захисники землі."]}], "remember": "Переказ — усна розповідь про справжні події та людей. У запорожці приймали через випробування: гостра каша, жарти, переплисти пороги. Іван Сірко — кошовий отаман, переміг татар хитрістю.", "cards": [{"f": "Народний переказ", "b": "Усна розповідь про справжні історичні події й людей."}, {"f": "Чим переказ відрізняється від легенди?", "b": "У переказі більше правди й менше вигадки."}, {"f": "Головне випробування новачка на Січі", "b": "Переплисти Дніпрові пороги на човні."}, {"f": "Іван Сірко", "b": "Кошовий отаман Запорозької Січі; переміг татар хитрістю; вважали характерником."}, {"f": "Кошовий отаман", "b": "Голова Запорозької Січі."}], "quiz": [{"t": "choice", "q": "Переказ — це розповідь про…", "o": ["богів", "справжні історичні події й людей", "вигаданих звірів"], "a": 1, "e": "Переказ ближчий до правди, ніж легенда."}, {"t": "choice", "q": "Яке випробування було головним для новачка на Січі?", "o": ["З'їсти сто вареників", "Переплисти Дніпрові пороги", "Заспівати пісню"], "a": 1, "e": "Пороги перевіряли сміливість і вправність."}, {"t": "choice", "q": "Ким був Іван Сірко?", "o": ["Князем", "Кошовим отаманом", "Ковалем"], "a": 1, "e": "Кошовий отаман Запорозької Січі."}, {"t": "choice", "q": "Як Сірко переміг татар?", "o": ["Силою одного удару", "Хитрістю: заманив і напав", "Заплатив золотом"], "a": 1, "e": "Сірко славився хитрістю і кмітливістю."}, {"t": "choice", "q": "Які риси перевіряли козаки в новачка?", "o": ["Сміливість, витривалість, кмітливість", "Багатство", "Уміння читати"], "a": 0, "e": "Козак мав бути сміливим і кмітливим."}, {"t": "input", "q": "Як називали голову Запорозької Січі?", "a": ["кошовий отаман", "кошовий", "отаман"], "e": "Кошовий отаман."}, {"t": "tf", "q": "У переказі вигадки більше, ніж у легенді.", "a": false, "e": "Навпаки: переказ ближчий до правди."}, {"t": "choice", "q": "Кого називали характерником?", "o": ["Козака з надзвичайними здібностями", "Козацького кухаря", "Полоненого"], "a": 0, "e": "Характерник — козак-чарівник, невразливий у бою."}]}, {"id": "kazky-teoriia", "sec": "Народні казки", "title": "Народна казка. Види казок. Будова казки", "goal": "Ти знаєш ознаки казки, її види й будову.", "learn": [{"h": "Казка", "p": ["<span class='term'>Народна казка</span> — розповідь про вигадані події з фантастичними героями, де добро перемагає зло. Слухачі знають, що це вигадка (на відміну від міфу)."]}, {"h": "Види казок", "p": ["<b>Про тварин</b> — герої-звірі поводяться як люди: «Лисиця та Рак», «Вовк і Чапля».", "<b>Чарівні (фантастичні)</b> — чари, перетворення, чарівні предмети: «Яйце-райце», «Летючий корабель», «Ох».", "<b>Побутові (соціально-побутові)</b> — про життя людей, розум і кмітливість, без чар: «Мудра дівчина», «Про правду і кривду»."]}, {"h": "Будова казки", "p": ["<b>Зачин</b> — початок: <i>Жили собі дід та баба… Був собі…</i>", "<b>Основна частина</b> — події, випробування.", "<b>Кінцівка</b> — щасливий кінець: <i>І я там був, мед-вино пив… Стали вони жити-поживати.</i>"], "note": "Часті ознаки: троїстість (три сини, три завдання), чарівні помічники, повтори, сталі вислови (<i>довго чи коротко, за тридев'ять земель</i>)."}, {"h": "Гіпербола", "p": ["<span class='term'>Гіпербола</span> — художнє перебільшення: <i>з'їв дванадцять биків, випив сорок бочок вина</i>."]}], "remember": "Казка — вигадана розповідь, де добро перемагає зло. Види: про тварин, чарівні, побутові. Будова: зачин → основна частина → кінцівка. Троїстість, чарівні помічники. Гіпербола — перебільшення.", "cards": [{"f": "Народна казка", "b": "Вигадана розповідь із фантастичними героями, де добро перемагає зло."}, {"f": "Три види казок", "b": "Про тварин, чарівні, побутові."}, {"f": "Чарівна казка", "b": "Є чари, перетворення, чарівні предмети: «Летючий корабель»."}, {"f": "Побутова казка", "b": "Про життя людей, кмітливість, без чар: «Мудра дівчина»."}, {"f": "Будова казки", "b": "Зачин — основна частина — кінцівка."}, {"f": "Гіпербола", "b": "Художнє перебільшення: випив сорок бочок вина."}, {"f": "Троїстість у казці", "b": "Три сини, три завдання, три дороги."}], "quiz": [{"t": "choice", "q": "Чим казка відрізняється від міфу?", "o": ["Нічим", "У казку не вірять, це вигадка", "Казка завжди про богів"], "a": 1, "e": "Міф сприймали як правду, казку — як вигадку."}, {"t": "choice", "q": "«Летючий корабель» — це казка…", "o": ["про тварин", "чарівна", "побутова"], "a": 1, "e": "Є чарівні предмети й помічники."}, {"t": "choice", "q": "«Мудра дівчина» — це казка…", "o": ["про тварин", "чарівна", "побутова"], "a": 2, "e": "Без чар, про кмітливість."}, {"t": "choice", "q": "«Лисиця та Рак» — це казка…", "o": ["про тварин", "чарівна", "побутова"], "a": 0, "e": "Герої — звірі."}, {"t": "choice", "q": "«Жили собі дід та баба» — це…", "o": ["зачин", "кінцівка", "гіпербола"], "a": 0, "e": "Традиційний початок казки — зачин."}, {"t": "choice", "q": "«І я там був, мед-вино пив» — це…", "o": ["зачин", "кінцівка", "зав'язка"], "a": 1, "e": "Традиційна кінцівка."}, {"t": "input", "q": "Як називається художнє перебільшення («з'їв дванадцять биків»)?", "a": ["гіпербола"], "e": "Гіпербола."}, {"t": "choice", "q": "Що таке троїстість у казці?", "o": ["Три автори", "Повторення подій чи героїв тричі", "Три кінцівки"], "a": 1, "e": "Три сини, три завдання тощо."}, {"t": "tf", "q": "У народній казці зло зазвичай перемагає.", "a": false, "e": "Ні, в казці перемагає добро."}]}, {"id": "kazky-yaitse", "sec": "Народні казки", "title": "«Яйце-райце»", "goal": "Ти пам'ятаєш сюжет і героїв чарівної казки «Яйце-райце».", "learn": [{"h": "Сюжет", "p": ["Жайворонок і миша посварилися через зернину — почалася війна птахів і звірів. Орла поранили; чоловік узяв його додому й доглядав три роки, хоч жінка сварилася. Орел на подяку повіз чоловіка до своїх сестер і батька, і той дав <b>яйце-райце</b> з наказом не розбивати до дому. Чоловік не втерпів, розбив у дорозі — з яйця вийшло безліч худоби. Загнати назад допомогла <b>змія</b> за обіцянку віддати те, чого чоловік удома не знає (а вдома народився син)."]}, {"h": "Друга частина", "p": ["Син виріс і пішов до змії. Змія загадувала неможливі завдання (за ніч викорчувати ліс і посіяти пшеницю, побудувати міст…), їх виконувала <b>донька змії</b>, яка покохала хлопця. Молодята втекли, перетворюючись (на пшеницю і діда, на церкву і попа, на річку і рибу). Змія загинула. Далі — зрада, забуття, довгі поневіряння, але зрештою пара знову разом."]}, {"h": "Ознаки чарівної казки", "p": ["Чарівний предмет (яйце-райце), чарівний помічник (донька змії), перетворення, троїстість (три роки, три завдання), протиставлення добра і зла. Гіпербола: незліченна худоба з одного яйця."], "note": "Головна думка: за добро платять добром; жадібність і нетерплячість карають."}], "remember": "Війна птахів і звірів → чоловік вилікував орла → яйце-райце → розбив у дорозі → змія допомогла за сина → син у змії → донька змії виконує завдання → втеча з перетвореннями.", "cards": [{"f": "Через що почалася війна птахів і звірів?", "b": "Жайворонок і миша посварилися через зернину."}, {"f": "Кого і скільки доглядав чоловік?", "b": "Пораненого орла три роки."}, {"f": "Що таке яйце-райце?", "b": "Чарівне яйце з незліченною худобою всередині."}, {"f": "Чому чоловік потрапив у біду?", "b": "Розбив яйце в дорозі; змія допомогла за обіцянку віддати сина."}, {"f": "Хто допомагав синові виконати завдання змії?", "b": "Донька змії."}, {"f": "На що перетворювались утікачі?", "b": "На пшеницю і діда, церкву і попа, річку і рибу."}], "quiz": [{"t": "choice", "q": "Хто посварився через зернину?", "o": ["Орел і змія", "Жайворонок і миша", "Кіт і пес"], "a": 1, "e": "Це спричинило війну птахів і звірів."}, {"t": "choice", "q": "Скільки років чоловік доглядав орла?", "o": ["Один", "Три", "Сім"], "a": 1, "e": "Три роки — троїстість."}, {"t": "choice", "q": "Що вийшло з яйця-райця?", "o": ["Золото", "Незліченна худоба", "Птахи"], "a": 1, "e": "Худоба, яку чоловік не зміг загнати назад."}, {"t": "choice", "q": "Що пообіцяв чоловік змії?", "o": ["Половину худоби", "Те, чого вдома не знає (сина)", "Яйце"], "a": 1, "e": "Удома народився син."}, {"t": "choice", "q": "Хто виконував завдання змії за хлопця?", "o": ["Орел", "Донька змії", "Батько"], "a": 1, "e": "Донька змії покохала його й допомагала."}, {"t": "choice", "q": "Яка ознака чарівної казки є в «Яйці-райці»?", "o": ["Перетворення героїв", "Відсутність чар", "Герої — тільки тварини"], "a": 0, "e": "Утікачі перетворювались на пшеницю, церкву, річку."}, {"t": "tf", "q": "Чоловік розбив яйце-райце вдома, як наказав орлів батько.", "a": false, "e": "Ні, розбив у дорозі — і потрапив у біду."}, {"t": "input", "q": "Як називається чарівний предмет у казці, з якого вийшла худоба? (яйце-…)", "a": ["яйце-райце", "райце"], "e": "Яйце-райце."}, {"t": "choice", "q": "Чого вчить казка?", "o": ["Не довіряти птахам", "За добро платять добром, жадібність карається", "Треба тікати від змій"], "a": 1, "e": "Чоловіка нагороджено за доброту й покарано за нетерплячість."}]}, {"id": "kazky-mudra-divchyna", "sec": "Народні казки", "title": "«Мудра дівчина»", "goal": "Ти пам'ятаєш загадки пана й відповіді Марусі та розумієш, що таке тема твору.", "learn": [{"h": "Сюжет", "p": ["Два брати — багатий і бідний — посперечалися, чиє лоша. Пан загадав три загадки: <b>що найситніше, найпрудкіше, наймиліше?</b> Багатий брат відповів: свиня, хорт, жінка. Бідному підказала донька <b>Маруся</b>: найситніша — <b>земля</b>, найпрудкіша — <b>думка</b>, наймиліший — <b>сон</b>."]}, {"h": "Випробування Марусі", "p": ["Пан наказав прийти <b>ні пішки, ні верхи, ні гола, ні одягнена, ні з подарунком, ні без</b>. Маруся приїхала на козі, обгорнута сіткою, з двома птахами (горобцями), які випурхнули, коли пан простяг руку. Далі — вимити з десяти яєць курчат: Маруся попросила спершу виростити просо з вареного пшона. Пан здався й одружився з Марусею."]}, {"h": "Кінцівка", "p": ["Пан заборонив дружині втручатися в суди. Маруся допомогла бідняку (суперечка про лоша: пан присудив лоша возу — Маруся порадила ловити рибу на дорозі: «як віз може народити лоша, так і риба ловиться в пилюці»). Розгніваний пан вигнав її, дозволивши взяти найдорожче. Вона напоїла його, а сплячого забрала — бо він їй найдорожчий. Пан зрозумів свою помилку."]}, {"h": "Тема твору", "p": ["<span class='term'>Тема</span> — те, про що йдеться у творі (тут — розум і кмітливість простої дівчини). <span class='term'>Головна думка (ідея)</span> — що автор хотів сказати: мудрість важливіша за багатство."]}], "remember": "Загадки пана: найситніша — земля, найпрудкіша — думка, наймиліший — сон. Маруся приїхала на козі в сітці з птахами. Найдорожче для Марусі — чоловік. Тема — кмітливість, ідея — розум цінніший за багатство.", "cards": [{"f": "Що найситніше, найпрудкіше, наймиліше?", "b": "Земля, думка, сон."}, {"f": "Як Маруся прийшла «ні пішки, ні верхи»?", "b": "На козі."}, {"f": "Як Маруся прийшла «ні гола, ні одягнена»?", "b": "Обгорнута сіткою."}, {"f": "«Ні з подарунком, ні без» — що принесла?", "b": "Птахів, які випурхнули з рук."}, {"f": "Що найдорожче взяла Маруся, коли пан її вигнав?", "b": "Самого пана (чоловіка)."}, {"f": "Тема твору", "b": "Те, про що йдеться у творі."}, {"f": "Головна думка «Мудрої дівчини»", "b": "Мудрість і кмітливість важливіші за багатство."}], "quiz": [{"t": "choice", "q": "Що, за Марусею, найситніше?", "o": ["Свиня", "Земля", "Хліб"], "a": 1, "e": "Земля годує всіх."}, {"t": "choice", "q": "Що найпрудкіше?", "o": ["Кінь", "Хорт", "Думка"], "a": 2, "e": "Думка миттєво долає будь-яку відстань."}, {"t": "input", "q": "Що, за Марусею, наймиліше?", "a": ["сон"], "e": "Сон."}, {"t": "choice", "q": "На чому Маруся приїхала до пана?", "o": ["На коні", "На козі", "На возі"], "a": 1, "e": "Ні пішки, ні верхи — на козі."}, {"t": "choice", "q": "У що була вбрана Маруся?", "o": ["У сітку", "У кожух", "У сукню"], "a": 0, "e": "Ні гола, ні одягнена — у сітці."}, {"t": "choice", "q": "Що зробила Маруся, коли пан вигнав її?", "o": ["Забрала золото", "Забрала сплячого пана — найдорожче", "Забрала козу"], "a": 1, "e": "Пан дозволив узяти найдорожче — вона взяла його самого."}, {"t": "choice", "q": "«Мудра дівчина» — казка…", "o": ["чарівна", "побутова", "про тварин"], "a": 1, "e": "Без чар, про кмітливість."}, {"t": "choice", "q": "Тема твору — це…", "o": ["те, про що йдеться у творі", "кількість героїв", "назва"], "a": 0, "e": "Тема — про що твір."}, {"t": "choice", "q": "Хто підказав бідному братові відповіді?", "o": ["Пан", "Донька Маруся", "Сусід"], "a": 1, "e": "Маруся."}, {"t": "choice", "q": "Головна думка казки:", "o": ["Треба слухатись пана", "Розум цінніший за багатство", "Кози розумніші за коней"], "a": 1, "e": "Проста дівчина мудріша за пана."}]}, {"id": "kazky-letiuchyi-korabel", "sec": "Народні казки", "title": "«Летючий корабель»", "goal": "Ти пам'ятаєш героїв-помічників і завдання царя в казці «Летючий корабель».", "learn": [{"h": "Сюжет", "p": ["Цар оголосив: хто збудує летючий корабель — той одружиться з царівною. Два старші брати були розумні, а <b>дурень</b> (найменший) — ні, та мати дала йому тільки сухарі й воду. Дорогою він поділився з <b>дідусем</b> (чарівником), і сухарі стали булками, а вода — горілкою. Дід навчив: ударити сокирою по дереву, лягти спати — і буде корабель. Наказ: садити всіх, кого зустріне."]}, {"h": "Помічники", "p": ["<b>Слухало</b> (чує все), <b>Скороход</b> (бігає з відв'язаною ногою), <b>Стрілець</b> (влучає за сто верст), <b>Об'їдайло</b> (голодний), <b>Обпивайло</b> (спраглий), той, що з <b>соломою</b> (морозить), той, що з <b>дровами</b> (з'являється військо)."]}, {"h": "Завдання царя", "p": ["1. Принести живої і цілющої води, поки цар пообідає — Скороход (заснув, Слухало почув, Стрілець розбудив). 2. З'їсти 12 биків, 40 печей хліба — Об'їдайло. 3. Випити 40 бочок вина — Обпивайло. 4. Пропаритись у розжареній лазні — соломою заморозив. 5. Показати військо — дрова розкидав — військо з'явилось. Цар здався, дурень одружився з царівною."], "note": "Головна думка: доброта й дружба сильніші за силу й багатство; допомога один одному."}], "remember": "Дурень поділився з дідом → корабель. Помічники: Слухало, Скороход, Стрілець, Об'їдайло, Обпивайло, з соломою (мороз), з дровами (військо). Завдання: вода, їжа, вино, лазня, військо. Гіпербола: 12 биків, 40 бочок.", "cards": [{"f": "Хто головний герой «Летючого корабля»?", "b": "Дурень — найменший із трьох братів."}, {"f": "Хто допоміг дурню здобути корабель?", "b": "Дідусь-чарівник, з яким той поділився їжею."}, {"f": "Слухало", "b": "Чує все на світі."}, {"f": "Скороход", "b": "Ходить із прив'язаною ногою, бо інакше за крок обійде світ."}, {"f": "Об'їдайло і Обпивайло", "b": "З'їв 12 биків і 40 печей хліба; випив 40 бочок вина."}, {"f": "Хто приніс живу і цілющу воду?", "b": "Скороход (заснув, Слухало почув, Стрілець розбудив)."}, {"f": "Хто заморозив лазню?", "b": "Той, що ніс солому."}, {"f": "Хто показав військо?", "b": "Той, що ніс дрова."}], "quiz": [{"t": "choice", "q": "Хто з братів збудував летючий корабель?", "o": ["Старший", "Середній", "Дурень — найменший"], "a": 2, "e": "Дурень, бо був добрий і поділився з дідом."}, {"t": "choice", "q": "Що стало з сухарями після зустрічі з дідом?", "o": ["Зникли", "Стали булками", "Стали каменем"], "a": 1, "e": "Сухарі — булки, вода — горілка."}, {"t": "choice", "q": "Хто чує все на світі?", "o": ["Стрілець", "Слухало", "Скороход"], "a": 1, "e": "Слухало."}, {"t": "choice", "q": "Хто з'їв дванадцять биків?", "o": ["Об'їдайло", "Обпивайло", "Скороход"], "a": 0, "e": "Об'їдайло."}, {"t": "choice", "q": "Чому Скороход ходив із прив'язаною ногою?", "o": ["Був поранений", "Інакше за крок обійшов би світ", "Так модно"], "a": 1, "e": "Він надто швидкий."}, {"t": "choice", "q": "Як герої пережили розжарену лазню?", "o": ["Розкидали солому — стало морозно", "Втекли", "Вилили воду"], "a": 0, "e": "Той, що з соломою, заморозив лазню."}, {"t": "choice", "q": "Що дав царю останнє завдання показати?", "o": ["Золото", "Військо", "Корабель"], "a": 1, "e": "Той, що з дровами, викликав військо."}, {"t": "choice", "q": "«Випив сорок бочок вина» — це…", "o": ["гіпербола", "порівняння", "зачин"], "a": 0, "e": "Перебільшення — гіпербола."}, {"t": "tf", "q": "Цар охоче віддав царівну за дурня одразу після побудови корабля.", "a": false, "e": "Ні, він придумував нові завдання, щоб не віддавати."}, {"t": "choice", "q": "Головна думка казки:", "o": ["Не треба ділитись їжею", "Доброта й дружба перемагають", "Царі завжди справедливі"], "a": 1, "e": "Дурень переміг завдяки доброті й друзям."}]}, {"id": "kazky-pravda-kryvda-okh", "sec": "Народні казки", "title": "«Про правду і кривду», «Ох»", "goal": "Ти пам'ятаєш зміст двох казок і розумієш їх головну думку.", "learn": [{"h": "«Про правду і кривду» (побутова)", "p": ["Два брати сперечалися, чим краще жити — правдою чи кривдою. Питали людей — усі казали: кривдою. Кривдник виколов братові очі. Сліпий під деревом (дубом) підслухав розмову чортів (нечистих) і дізнався: роса зцілює очі, а ще як вилікувати царівну й дати місту воду. Правдивий брат прозрів, вилікував царівну, одружився з нею й став царем. Кривдник захотів того ж, пішов під дуб — і його нечисті розірвали."], "note": "Головна думка: правда завжди перемагає, кривда карає себе сама."}, {"h": "«Ох» (чарівна)", "p": ["У бідного чоловіка був ледачий син. Повів батько його в найми; сів на пеньок: «Ох!» — і з'явився лісовий цар <b>Ох</b>, зелений, з зеленою бородою. Взяв хлопця на три роки: спалював його й оживляв, поки той не став кращим і сильнішим. Батько впізнав сина серед голубів (курей, коней) — забрав. Син перетворювався на хорта, сокола, коня, щоб батько продавав його й багатів; Ох викупив коня, та син утік: перетворювався на окуня — Ох на щуку; на перстень — царівна; на просо — Ох на півня; хлопець став яструбом і з'їв півня. Одружився з царівною."], "note": "Ох — казковий персонаж-чарівник. Головна думка: праця й випробування роблять людину сильнішою; ледар став богатирем."}], "remember": "«Про правду і кривду»: сліпий брат під дубом чує нечистих, зцілюється росою, стає царем; кривдника розірвали. «Ох»: зелений лісовий цар перетворює ледачого сина на богатиря; погоня з перетвореннями (окунь — щука, просо — півень, яструб).", "cards": [{"f": "Хто переміг у казці «Про правду і кривду»?", "b": "Правдивий брат — прозрів, вилікував царівну, став царем."}, {"f": "Де сліпий брат підслухав нечистих?", "b": "Під дубом."}, {"f": "Чим зцілив очі правдивий брат?", "b": "Росою."}, {"f": "Хто такий Ох?", "b": "Лісовий цар-чарівник, зелений, з зеленою бородою."}, {"f": "Як Ох змінив ледачого сина?", "b": "Спалював і оживляв, поки той не став гарним, сильним і розумним."}, {"f": "На що перетворювався хлопець, тікаючи від Оха?", "b": "Окунь, перстень, просо, яструб (Ох — щука, півень)."}], "quiz": [{"t": "choice", "q": "Чим краще жити — питали брати. Що казали люди?", "o": ["Правдою", "Кривдою", "Мовчали"], "a": 1, "e": "Усі казали «кривдою», але казка доводить протилежне."}, {"t": "choice", "q": "Що зробив кривдник із братом?", "o": ["Виколов очі", "Продав у рабство", "Обдурив у картах"], "a": 0, "e": "Виколов очі й покинув."}, {"t": "choice", "q": "Чим сліпий брат вилікував очі?", "o": ["Ліками", "Росою", "Водою з криниці"], "a": 1, "e": "Роса — за підслуханою розмовою нечистих."}, {"t": "choice", "q": "Що сталося з кривдником у кінці?", "o": ["Став царем", "Його розірвали нечисті", "Попросив вибачення"], "a": 1, "e": "Кривда покарана."}, {"t": "choice", "q": "Як з'явився Ох?", "o": ["Батько сів на пень і сказав «Ох!»", "Прилетів", "Син покликав"], "a": 0, "e": "На зітхання «Ох!» вийшов лісовий цар."}, {"t": "choice", "q": "Якого кольору Ох?", "o": ["Червоного", "Зеленого", "Синього"], "a": 1, "e": "Зелений, з зеленою бородою."}, {"t": "choice", "q": "Скільки років служив хлопець в Оха?", "o": ["Один", "Три", "Десять"], "a": 1, "e": "Три роки."}, {"t": "choice", "q": "На кого перетворився хлопець, щоб з'їсти півня-Оха?", "o": ["На вовка", "На яструба", "На кота"], "a": 1, "e": "Яструб з'їв півня — Ох загинув."}, {"t": "choice", "q": "«Про правду і кривду» — казка…", "o": ["чарівна", "побутова", "про тварин"], "a": 1, "e": "Побутова (хоч є фантастичні елементи, головне — моральний вибір)."}, {"t": "tf", "q": "Головна думка казки «Ох»: праця й випробування роблять людину кращою.", "a": true, "e": "Ледар став богатирем."}]}, {"id": "kazky-tvaryny", "sec": "Народні казки", "title": "Казки про тварин: «Лисиця та Рак», «Вовк і Чапля». Алегорія", "goal": "Ти знаєш, що таке алегорія, і пам'ятаєш зміст двох коротких казок.", "learn": [{"h": "«Лисиця та Рак»", "p": ["Лисиця запропонувала Ракові бігти наввипередки. Рак учепився клешнями за лисячий хвіст. Лисиця добігла, обернулась — а Рак уже позаду неї: «Я давно тут чекаю!» Хитрість перемогла швидкість."]}, {"h": "«Вовк і Чапля»", "p": ["Вовк подавився кісткою і попросив Чаплю витягти її своїм довгим дзьобом, обіцяючи нагороду. Чапля витягла, а Вовк сказав: нагорода — те, що він не відкусив їй голови. Невдячність і підступність сильного."]}, {"h": "Алегорія", "p": ["<span class='term'>Алегорія</span> — зображення людських рис через образи тварин, рослин, предметів. У казках про тварин звірі — це люди: <b>лисиця</b> — хитрість, <b>вовк</b> — жадібність і невдячність, <b>заєць</b> — боягузтво, <b>ведмідь</b> — сила й незграбність, <b>осел</b> — впертість."]}], "remember": "Алегорія — людські риси через образи тварин: лисиця — хитрість, вовк — жадібність. «Лисиця та Рак»: рак учепився за хвіст і «переміг». «Вовк і Чапля»: вовк «нагородив» тим, що не з'їв.", "cards": [{"f": "Алегорія", "b": "Зображення людських рис через образи тварин, рослин, предметів."}, {"f": "Лисиця в казках — це…", "b": "Хитрість."}, {"f": "Вовк у казках — це…", "b": "Жадібність, невдячність, сила без розуму."}, {"f": "Як Рак переміг Лисицю?", "b": "Учепився за хвіст і опинився попереду."}, {"f": "Яку «нагороду» дав Вовк Чаплі?", "b": "Не відкусив їй голови."}], "quiz": [{"t": "choice", "q": "Що таке алегорія?", "o": ["Перебільшення", "Людські риси через образи тварин чи предметів", "Повторення слів"], "a": 1, "e": "Звірі в казках — це люди з їхніми рисами."}, {"t": "choice", "q": "Яку рису уособлює лисиця?", "o": ["Боягузтво", "Хитрість", "Доброту"], "a": 1, "e": "Лисиця — хитра."}, {"t": "choice", "q": "Як Рак обігнав Лисицю?", "o": ["Біг швидше", "Учепився за її хвіст", "Пішов навпростець"], "a": 1, "e": "Клешнями за хвіст."}, {"t": "choice", "q": "Що просив Вовк у Чаплі?", "o": ["Витягти кістку з горла", "Принести рибу", "Заспівати"], "a": 0, "e": "Подавився кісткою."}, {"t": "choice", "q": "Яку нагороду отримала Чапля?", "o": ["Золото", "Те, що Вовк не з'їв її", "Рибу"], "a": 1, "e": "Вовк невдячний."}, {"t": "choice", "q": "Яку рису уособлює заєць?", "o": ["Хитрість", "Боягузтво", "Мудрість"], "a": 1, "e": "Заєць — боягуз."}, {"t": "tf", "q": "У казках про тварин звірі поводяться як люди.", "a": true, "e": "Так, це алегорія."}, {"t": "choice", "q": "Чого вчить «Вовк і Чапля»?", "o": ["Не допомагати нікому", "Не чекати вдячності від підступних", "Їсти обережно"], "a": 1, "e": "Невдячність сильного і підступного."}]}, {"id": "litkazka-franko", "sec": "Літературні казки", "title": "Іван Франко. «Фарбований Лис»", "goal": "Ти знаєш, що таке літературна казка, пам'ятаєш сюжет «Фарбованого Лиса» і поняття «мова автора та персонажів».", "learn": [{"h": "Літературна казка", "p": ["<span class='term'>Літературна казка</span> — казка, яку написав конкретний автор (на відміну від народної). Автор може використовувати народні мотиви, але сюжет і мова — його."]}, {"h": "Іван Франко (1856–1916)", "p": ["Народився в селі <b>Нагуєвичі</b> на Львівщині в родині коваля. Письменник, учений, громадський діяч. Для дітей написав збірку казок <b>«Коли ще звірі говорили»</b>, куди ввійшов і «Фарбований Лис». Також поема «Лис Микита»."]}, {"h": "Сюжет", "p": ["<b>Лис Микита</b> — хитрий і самовпевнений, хвалився, що вдень пройде через село. Собаки погнались за ним, і він, тікаючи, упав у бочку <b>синьої фарби</b> в дворі маляра. Синього звіра злякались усі. Микита назвався звіром <b>Остромислом</b>, посланим із неба, щоб бути царем звірів. Звірі служили йому, він жив у розкошах. На святі, почувши лисячий спів, він <b>завив по-лисячому</b> — і видав себе. Звірі розірвали ошуканця."], "note": "Головна думка: брехня і зарозумілість рано чи пізно викриваються; «як не крути, а правда вийде»."}, {"h": "Мова автора та персонажів", "p": ["<span class='term'>Мова автора</span> — розповідь від оповідача (описи, події). <span class='term'>Мова персонажів</span> — їхні слова: діалоги, монологи. Через мову розкривається характер: Микита говорить самовпевнено, пишномовно."]}], "remember": "Літературна казка має автора. Франко — Нагуєвичі, збірка «Коли ще звірі говорили». Лис Микита впав у синю фарбу, назвався Остромислом, став царем, видав себе лисячим виттям. Мова автора — розповідь, мова персонажів — діалоги.", "cards": [{"f": "Літературна казка", "b": "Казка, написана конкретним автором."}, {"f": "Де народився Іван Франко?", "b": "У селі Нагуєвичі на Львівщині, у родині коваля."}, {"f": "До якої збірки Франка входить «Фарбований Лис»?", "b": "«Коли ще звірі говорили»."}, {"f": "У що впав Лис Микита?", "b": "У бочку синьої фарби."}, {"f": "Яке ім'я взяв фарбований Лис?", "b": "Остромисл — звір, посланий з неба."}, {"f": "Як Микита видав себе?", "b": "Завив по-лисячому на святі."}, {"f": "Мова автора / мова персонажів", "b": "Розповідь оповідача / слова героїв у діалогах."}], "quiz": [{"t": "choice", "q": "Чим літературна казка відрізняється від народної?", "o": ["Довша", "Має конкретного автора", "Завжди про звірів"], "a": 1, "e": "У літературної казки є автор."}, {"t": "choice", "q": "Де народився Іван Франко?", "o": ["У Києві", "У Нагуєвичах", "У Полтаві"], "a": 1, "e": "Село Нагуєвичі на Львівщині."}, {"t": "choice", "q": "Ким був батько Франка?", "o": ["Ковалем", "Учителем", "Священником"], "a": 0, "e": "Ковалем."}, {"t": "choice", "q": "Чому Лис Микита опинився в селі вдень?", "o": ["Шукав їжу", "Хвалився, що не боїться", "Заблукав"], "a": 1, "e": "Із самовпевненості."}, {"t": "choice", "q": "Якого кольору стала шерсть Микити?", "o": ["Червоного", "Синього", "Зеленого"], "a": 1, "e": "Синя фарба."}, {"t": "input", "q": "Яким ім'ям назвався фарбований Лис?", "a": ["остромисл", "остромислом"], "e": "Остромисл."}, {"t": "choice", "q": "Як звірі викрили Микиту?", "o": ["Дощ змив фарбу", "Він завив по-лисячому", "Побачили хвіст"], "a": 1, "e": "Лисяча натура взяла своє."}, {"t": "choice", "q": "«Собаки погналися за ним» — це…", "o": ["мова автора", "мова персонажа"], "a": 0, "e": "Розповідь оповідача — мова автора."}, {"t": "choice", "q": "Головна думка казки:", "o": ["Треба обирати правильну фарбу", "Брехня і зарозумілість викриваються", "Звірі люблять царів"], "a": 1, "e": "Обман завжди виходить назовні."}, {"t": "tf", "q": "«Фарбований Лис» — народна казка.", "a": false, "e": "Це літературна казка Івана Франка."}]}, {"id": "litkazka-koroliv-staryi", "sec": "Літературні казки", "title": "Василь Королів-Старий. «Хуха-Моховинка», «Мавка Вербинка»", "goal": "Ти пам'ятаєш сюжети двох казок Короліва-Старого і знаєш, що таке портрет у літературі.", "learn": [{"h": "Василь Королів-Старий (1879–1943)", "p": ["Письменник, художник, ветеринар. Написав збірку «Нечиста сила», де добрими є ті істоти, яких люди вважали злими: хухи, мавки, домовики. Хотів показати, що не варто боятися незнайомого і судити за виглядом."]}, {"h": "«Хуха-Моховинка»", "p": ["<b>Хухи</b> — добрі лісові духи, пухнасті, змінюють колір шерсті під довкілля; побачити їх можуть тільки добрі люди. <b>Моховинка</b> — найменша й найдобріша лісова хуха, жила під сосною з трьома стовбурами. <b>Дід</b>-дроворуб зрубав її сосну, зруйнував хатку; Моховинка перебралася до хліва, гріла <b>козенятко</b>, а злий дід її бив і кинув у сніг. Коли дід, рубаючи дерево, поранив ногу й замерзав у лісі, саме Моховинка врятувала його (стала видимою, привела допомогу). Дід зрозумів свою жорстокість і покаявся."], "note": "Головна думка: добро відповідає добром навіть на зло; не судити по зовнішності."}, {"h": "«Мавка Вербинка»", "p": ["<b>Мавка Вербинка</b> — лісова дівчина, удень ховалась у дуплі старої верби. Коли прийшли мисливці з собаками, вона рятувала звірів, а <b>Кізочку</b> — свою улюбленицю — захистив добрий <b>лісник</b>, який не продав її багатому паничу. Пізніше лісник упав у вовчу яму, яку сам викопав, разом із вовком. Вербинка з батьком-Лісовиком урятували його: Лісовик повалив дерево в яму. Лісник на подяку наварив каші з корицею для лісових духів."]}, {"h": "Портрет", "p": ["<span class='term'>Портрет</span> — опис зовнішності персонажа (обличчя, постава, одяг), який допомагає уявити героя і зрозуміти його характер. Моховинка: пухка, як мох, з мордочкою, схожою на квітку братки, з рожевими лапками."]}], "remember": "Королів-Старий показує «нечисту силу» доброю. Моховинка — хуха, врятувала злого діда, що зруйнував її дім. Вербинка — мавка, з батьком Лісовиком врятувала лісника з вовчої ями. Портрет — опис зовнішності героя.", "cards": [{"f": "Хто такі хухи?", "b": "Добрі лісові духи, пухнасті, змінюють колір шерсті; бачать їх тільки добрі люди."}, {"f": "Чому Моховинка — «мізинчик»?", "b": "Народилася останньою, влітку, найменша в родині."}, {"f": "Хто зруйнував хатку Моховинки?", "b": "Дід-дроворуб зрубав її сосну."}, {"f": "Як Моховинка помстилася дідові?", "b": "Не помстилася — врятувала його, коли він замерзав у лісі."}, {"f": "Де ховалася Мавка Вербинка вдень?", "b": "У дуплі старої верби."}, {"f": "Хто витяг лісника з вовчої ями?", "b": "Лісовик (батько Вербинки) повалив дерево в яму."}, {"f": "Портрет у літературі", "b": "Опис зовнішності персонажа."}], "quiz": [{"t": "choice", "q": "Хухи — це…", "o": ["злі лісові духи", "добрі лісові духи", "птахи"], "a": 1, "e": "Добрі, пухнасті, безпечні."}, {"t": "choice", "q": "Хто може побачити хуху?", "o": ["Кожен", "Тільки добрі люди", "Тільки мисливці"], "a": 1, "e": "Люди з добрим серцем."}, {"t": "choice", "q": "Де жила Моховинка?", "o": ["Під сосною з трьома стовбурами", "У печері", "У річці"], "a": 0, "e": "Хатка між корінням сосни."}, {"t": "choice", "q": "Кого гріла Моховинка у хліві?", "o": ["Козенятко", "Собаку", "Курча"], "a": 0, "e": "Козенятко."}, {"t": "choice", "q": "Як Моховинка вчинила з дідом, який її бив?", "o": ["Помстилася", "Урятувала його від смерті", "Утекла назавжди"], "a": 1, "e": "Добро у відповідь на зло."}, {"t": "choice", "q": "Де вдень ховалась Мавка Вербинка?", "o": ["У дуплі верби", "У хаті лісника", "Під мостом"], "a": 0, "e": "У дуплі старої верби."}, {"t": "choice", "q": "Чому лісові мешканці полюбили лісника?", "o": ["Він годував вовків", "Він не продав Кізочку багатому паничу", "Він зрубав вербу"], "a": 1, "e": "Захистив Кізочку."}, {"t": "choice", "q": "Хто врятував лісника з ями?", "o": ["Вовк", "Лісовик, батько Вербинки", "Мисливці"], "a": 1, "e": "Повалив дерево в яму — лісник вибрався."}, {"t": "input", "q": "Як називається опис зовнішності персонажа?", "a": ["портрет"], "e": "Портрет."}, {"t": "choice", "q": "Чого вчать казки Короліва-Старого?", "o": ["Боятися лісу", "Не судити за виглядом, відповідати добром", "Полювати"], "a": 1, "e": "«Нечиста сила» виявляється доброю."}]}, {"id": "litkazka-symonenko", "sec": "Літературні казки", "title": "Василь Симоненко. «Цар Плаксій та Лоскотон». Віршована мова", "goal": "Ти пам'ятаєш героїв віршованої казки і знаєш, що таке рима, ритм, строфа.", "learn": [{"h": "Василь Симоненко (1935–1963)", "p": ["Поет із Черкащини (село Біївці на Полтавщині), прожив лише 28 років. Автор віршів про Україну («Лебеді материнства») і казок для дітей: «Цар Плаксій та Лоскотон», «Подорож в країну Навпаки»."]}, {"h": "Сюжет", "p": ["У царстві <b>Сльозолий</b> правив цар <b>Плаксій</b>, який любив, щоб усі плакали. Його діти: дочки <b>Нудота, Вай-Вай, Плакота</b> і син <b>Плаксун</b>. А по країні ходив добрий дядько <b>Лоскотон</b> — лоскотав дітей, і вони сміялися. Цар наказав капітанові <b>Макаці</b> схопити Лоскотона й ув'язнити. Діти-плакуни звільнили його, Лоскотон розлоскотав царя, і той <b>луснув від сміху</b>. Сльозолий став веселою країною."], "note": "Головна думка: сміх і радість перемагають злість і смуток."}, {"h": "Віршована мова", "p": ["<span class='term'>Віршована мова</span> — мова, організована ритмом і римою, поділена на рядки.", "<span class='term'>Рима</span> — співзвучні закінчення рядків (<i>сміх — гріх</i>).", "<span class='term'>Ритм</span> — рівномірне чергування наголошених і ненаголошених складів.", "<span class='term'>Строфа</span> — група рядків, об'єднаних змістом і римою (як абзац у прозі)."], "note": "Прозова мова — звичайна, без рими й ритму, суцільним текстом."}, {"h": "Порівняння. Епітет", "p": ["<span class='term'>Епітет</span> — художнє означення: <i>сумний цар, золотий сміх</i>.", "<span class='term'>Порівняння</span> — зіставлення двох предметів за схожістю за допомогою слів <i>як, мов, наче, ніби</i>: <i>сльози, як град</i>."]}], "remember": "Цар Плаксій, царство Сльозолий, діти Нудота, Вай-Вай, Плакота, Плаксун; капітан Макака; Лоскотон переміг — цар луснув від сміху. Віршована мова: рима, ритм, строфа. Епітет — художнє означення, порівняння — як, мов, наче.", "cards": [{"f": "Як називалося царство Плаксія?", "b": "Сльозолий."}, {"f": "Діти царя Плаксія", "b": "Нудота, Вай-Вай, Плакота і Плаксун."}, {"f": "Хто такий Лоскотон?", "b": "Добрий дядько, що лоскотав дітей і дарував сміх."}, {"f": "Хто схопив Лоскотона?", "b": "Капітан Макака."}, {"f": "Як загинув цар Плаксій?", "b": "Луснув від сміху."}, {"f": "Рима", "b": "Співзвучні закінчення рядків."}, {"f": "Строфа", "b": "Група рядків вірша, об'єднаних змістом і римою."}, {"f": "Епітет / Порівняння", "b": "Художнє означення (золотий сміх) / зіставлення через як, мов, наче (сльози, як град)."}], "quiz": [{"t": "choice", "q": "Як називалась країна царя Плаксія?", "o": ["Сльозолий", "Плаксилія", "Недоладія"], "a": 0, "e": "Сльозолий — країна сліз."}, {"t": "choice", "q": "Хто з цих героїв — син Плаксія?", "o": ["Нудота", "Плаксун", "Вай-Вай"], "a": 1, "e": "Плаксун — син; Нудота, Вай-Вай, Плакота — дочки."}, {"t": "choice", "q": "Що робив Лоскотон?", "o": ["Плакав із царем", "Лоскотав дітей, щоб сміялися", "Збирав податки"], "a": 1, "e": "Дарував сміх."}, {"t": "input", "q": "Хто за наказом царя схопив Лоскотона?", "a": ["макака", "капітан макака"], "e": "Капітан Макака."}, {"t": "choice", "q": "Чим закінчилась казка?", "o": ["Цар луснув від сміху", "Лоскотона вигнали", "Діти заплакали"], "a": 0, "e": "Сміх переміг."}, {"t": "choice", "q": "Чим віршована мова відрізняється від прозової?", "o": ["Довжиною", "Ритмом, римою, поділом на рядки", "Темою"], "a": 1, "e": "Вірш має ритм і риму."}, {"t": "choice", "q": "«Сльози, як град» — це…", "o": ["епітет", "порівняння", "рима"], "a": 1, "e": "Слово «як» — порівняння."}, {"t": "choice", "q": "«Золотий сміх» — це…", "o": ["епітет", "порівняння", "гіпербола"], "a": 0, "e": "Художнє означення — епітет."}, {"t": "input", "q": "Як називається група рядків вірша, об'єднаних змістом і римою?", "a": ["строфа"], "e": "Строфа."}, {"t": "choice", "q": "Скільки років прожив Василь Симоненко?", "o": ["28", "50", "75"], "a": 0, "e": "Лише 28."}]}, {"id": "litkazka-malyk-alia", "sec": "Літературні казки", "title": "Галина Малик. «Незвичайні пригоди Алі в країні Недоладії». Повість", "goal": "Ти пам'ятаєш сюжет і героїв повісті-казки та знаєш, що таке повість.", "learn": [{"h": "Галина Малик", "p": ["Сучасна письменниця із Закарпаття (Ужгород). Пише казки й повісті для дітей: «Незвичайні пригоди Алі в країні Недоладії», «Подорож Алі до країни сяк-таків», «Злочинці з паралельного світу»."]}, {"h": "Сюжет", "p": ["Дівчинка <b>Аля</b> нічого не доводила до кінця: не дошила бабусі рушничок і зганьбилася на дні народження. До неї з'явився <b>Недочеревик</b> і забрав у країну <b>Недоладію</b>, де все недороблене: недобудовані будинки, недомальовані картини, недоспечені пироги. Правив там король <b>Недороль</b>, а справами крутив підступний <b>Перший Недорадник</b>. Аля потоваришувала з хлопчиком <b>Недоладьком</b>, якого недомалював художник, і з <b>Недопопелюшкою</b>. Щоб повернутися додому, Аля мусила <b>дороблювати все недороблене</b>. Вона змінилася: стала відповідальною і дошила рушничок."], "note": "Головна думка: незакінчені справи повертаються; відповідальність і наполегливість — шлях до успіху. «Усе на світі залежить від нас»."}, {"h": "Повість", "p": ["<span class='term'>Повість</span> — епічний твір, більший за оповідання: багато подій, кілька героїв, час дії тривалий, часто поділ на розділи. Оповідання — одна подія, мало героїв."], "note": "«Пригоди Алі» — повість-казка: є риси повісті (розділи, багато подій) і казки (чарівна країна)."}], "remember": "Аля не доробляла справ → потрапила в Недоладію, країну недороблених речей (Недочеревик, Недоладько, Недопопелюшка) → мусила все доробити → стала відповідальною. Повість — великий епічний твір з багатьма подіями й героями, розділами.", "cards": [{"f": "Чому Аля потрапила в Недоладію?", "b": "Не доводила справ до кінця (не дошила рушничок бабусі)."}, {"f": "Що таке Недоладія?", "b": "Країна, де все недороблене: недобудоване, недомальоване."}, {"f": "Хто правив Недоладією?", "b": "Король Недороль; підступний Перший Недорадник крутив справами."}, {"f": "Друзі Алі в Недоладії", "b": "Недоладько (недомальований хлопчик) і Недопопелюшка."}, {"f": "Як Аля повернулася додому?", "b": "Доробила все недороблене; стала відповідальною."}, {"f": "Повість", "b": "Епічний твір, більший за оповідання: багато подій і героїв, розділи."}, {"f": "Чим оповідання відрізняється від повісті?", "b": "Оповідання — одна подія й мало героїв; повість — багато подій, кілька героїв."}], "quiz": [{"t": "choice", "q": "Що Аля не доробила для бабусі?", "o": ["Малюнок", "Вишиваний рушничок", "Торт"], "a": 1, "e": "Зробила лиш один хрестик."}, {"t": "choice", "q": "Хто з'явився до Алі в кімнаті?", "o": ["Недочеревик", "Лоскотон", "Ох"], "a": 0, "e": "Маленький чоловічок у величезних зелених черевиках — Недочеревик."}, {"t": "choice", "q": "Що особливого в Недоладії?", "o": ["Там усе золоте", "Там усе недороблене", "Там усі плачуть"], "a": 1, "e": "Країна незакінчених справ."}, {"t": "choice", "q": "Як Аля змогла повернутись додому?", "o": ["Заплатила", "Доробила всі недороблені справи", "Втекла"], "a": 1, "e": "Довелося довести все до кінця."}, {"t": "choice", "q": "Як змінилась Аля?", "o": ["Стала лінивішою", "Стала відповідальною", "Не змінилась"], "a": 1, "e": "Навчилася доводити справи до кінця."}, {"t": "choice", "q": "Повість — це…", "o": ["короткий твір про одну подію", "великий епічний твір із багатьма подіями й героями", "вірш"], "a": 1, "e": "Повість більша за оповідання."}, {"t": "tf", "q": "«Незвичайні пригоди Алі» — це оповідання.", "a": false, "e": "Це повість-казка: багато розділів і подій."}, {"t": "choice", "q": "Головна думка твору:", "o": ["Не треба вишивати", "Незакінчені справи повертаються; будь відповідальним", "Бабусі не люблять подарунків"], "a": 1, "e": "«Усе на світі залежить від нас»."}, {"t": "choice", "q": "Звідки письменниця Галина Малик?", "o": ["З Закарпаття", "З Криму", "З Одеси"], "a": 0, "e": "Живе в Ужгороді."}, {"t": "choice", "q": "Хто був королем Недоладії?", "o": ["Недороль", "Недоладько", "Недочеревик"], "a": 0, "e": "Недороль. Недоладько — хлопчик, друг Алі."}]}, {"id": "litkazka-oles-kozhumiaka", "sec": "Літературні казки", "title": "Олександр Олесь. «Микита Кожум'яка». Драматичний твір", "goal": "Ти пам'ятаєш сюжет драматичної казки та знаєш будову драматичного твору.", "learn": [{"h": "Олександр Олесь (1878–1944)", "p": ["Справжнє ім'я — Олександр <b>Кандиба</b>. Народився на Сумщині (Білопілля). Поет, автор віршів про природу й Україну, поетичних оповідей «Княжа Україна». Помер в еміграції в Празі. Його син — поет Олег Ольжич."]}, {"h": "Сюжет", "p": ["У Києві <b>Змій</b> вимагає щороку дівчину; черга дійшла до <b>княжни</b> — дочки Князя. Голуб приносить звістку: змія може здолати лише <b>Микита Кожум'яка</b> — силач, що м'яв шкури. Князь посилає до нього дідів, та Микита відмовляється, поки не приходять <b>діти</b> й не благають зі сльозами. Микита обмотався смолою й коноплями, поборов Змія й звільнив княжну. Слави й нагороди не хоче — повертається до праці."], "note": "Головна думка: справжня сила — у любові до людей і скромності; за народним переказом, звідси назва урочища Кожум'яки в Києві."}, {"h": "Драматичний твір", "p": ["<span class='term'>Драматичний твір</span> призначений для сцени. Будова: <b>дійові особи</b> (список на початку), <b>дії</b> (частини), <b>картини/сцени</b>, <b>діалоги й монологи</b> героїв, <b>ремарки</b> — авторські пояснення в дужках (<i>входить, зітхає, за сценою</i>). Розповіді автора немає — усе через мову персонажів."], "note": "«Микита Кожум'яка» — драматична казка (драма-казка) у віршах."}], "remember": "Олесь = Кандиба, Сумщина. Змій вимагає княжну → тільки Микита Кожум'яка може перемогти → діти умовили → Микита переміг. Драматичний твір: дійові особи, дії, діалоги, ремарки в дужках, без розповіді автора.", "cards": [{"f": "Справжнє прізвище Олександра Олеся", "b": "Кандиба."}, {"f": "Кого вимагав Змій у Києві?", "b": "Дівчат; черга дійшла до княжни."}, {"f": "Хто вмовив Микиту битися зі Змієм?", "b": "Діти зі сльозами (діди не змогли)."}, {"f": "Чим займався Микита Кожум'яка?", "b": "М'яв шкури (кожум'яка), був дуже сильний."}, {"f": "Ремарка", "b": "Авторське пояснення в дужках у драматичному творі: (входить), (зітхає)."}, {"f": "Будова драматичного твору", "b": "Дійові особи, дії, картини, діалоги й монологи, ремарки."}, {"f": "Чого немає в драматичному творі?", "b": "Розповіді автора — усе через мову персонажів."}], "quiz": [{"t": "choice", "q": "Справжнє прізвище Олександра Олеся:", "o": ["Кандиба", "Тичина", "Гуцало"], "a": 0, "e": "Олександр Кандиба."}, {"t": "choice", "q": "Чого вимагав Змій від киян?", "o": ["Золота", "Дівчат", "Худоби"], "a": 1, "e": "Щороку дівчину; настала черга княжни."}, {"t": "choice", "q": "Хто зміг умовити Микиту?", "o": ["Князь", "Діди", "Діти"], "a": 2, "e": "Дитячі сльози зворушили силача."}, {"t": "choice", "q": "Чому Микиту звали Кожум'якою?", "o": ["Бо носив кожуха", "Бо м'яв шкури", "Бо жив у Кожум'яках"], "a": 1, "e": "Його ремесло — м'яти шкури."}, {"t": "choice", "q": "Що зробив Микита після перемоги?", "o": ["Став князем", "Повернувся до праці, відмовився від нагород", "Одружився з княжною"], "a": 1, "e": "Скромність героя."}, {"t": "choice", "q": "«Микита Кожум'яка» за родом літератури — це…", "o": ["епос", "лірика", "драма"], "a": 2, "e": "Драматична казка для сцени."}, {"t": "choice", "q": "Що таке ремарка?", "o": ["Слова героя", "Авторське пояснення в дужках", "Назва дії"], "a": 1, "e": "(Входить Князь) — ремарка."}, {"t": "tf", "q": "У драматичному творі є розповідь автора, як в оповіданні.", "a": false, "e": "Ні, все розкривається через діалоги й ремарки."}, {"t": "input", "q": "Як називається список персонажів на початку п'єси? «… особи»", "a": ["дійові", "дійові особи"], "e": "Дійові особи."}, {"t": "choice", "q": "Де помер Олександр Олесь?", "o": ["У Києві", "У Празі", "У Львові"], "a": 1, "e": "В еміграції, у Празі."}]}, {"id": "mudrist-zahadky", "sec": "Народна мудрість", "title": "Загадки. Метафора", "goal": "Ти знаєш, що таке загадка, як вона будується, і що таке метафора.", "learn": [{"h": "Загадка", "p": ["<span class='term'>Загадка</span> — короткий влучний опис предмета чи явища, який треба відгадати. Виникла в давнину, коли не можна було називати речі прямо. Загадки розвивають уяву й кмітливість."], "ex": ["<i>Без рук, без ніг, а ворота відчиняє.</i> (Вітер)", "<i>Сидить дівчина в коморі, а коса її надворі.</i> (Морква)", "<i>Сімсот соколят на одній подушці сплять.</i> (Соняшник)"]}, {"h": "Як будується загадка", "p": ["Предмет не називають, а описують за ознаками, діями чи через порівняння з іншим предметом. Часто загадки римовані. Бувають загадки-запитання: <i>Що в світі найшвидше?</i> (Думка)."]}, {"h": "Метафора", "p": ["<span class='term'>Метафора</span> — приховане порівняння: ознаки одного предмета переносяться на інший без слів <i>як, мов</i>: <i>золоте волосся, сонце сміється, море сліз</i>. У загадках метафора головна: <i>дівчина в коморі</i> = морква в землі."], "note": "Порівняння: коса, <b>як</b> золото. Метафора: <b>золота</b> коса."}], "remember": "Загадка — влучний опис предмета, який треба відгадати; будується на ознаках і метафорах. Метафора — приховане порівняння без як, мов: сонце сміється.", "cards": [{"f": "Загадка", "b": "Короткий образний опис предмета, який треба відгадати."}, {"f": "Метафора", "b": "Приховане порівняння: ознаки одного предмета перенесено на інший без «як», «мов». Сонце сміється."}, {"f": "Чим метафора відрізняється від порівняння?", "b": "У порівнянні є слова як, мов, наче; у метафорі — немає."}, {"f": "«Сидить дівчина в коморі, а коса її надворі»", "b": "Морква."}, {"f": "«Без рук, без ніг, а ворота відчиняє»", "b": "Вітер."}], "quiz": [{"t": "choice", "q": "Загадка — це…", "o": ["смішна історія", "образний опис предмета, який треба відгадати", "повчальне речення"], "a": 1, "e": "Предмет не називають, а описують."}, {"t": "choice", "q": "«Сонце сміється» — це…", "o": ["метафора", "порівняння", "гіпербола"], "a": 0, "e": "Приховане порівняння без «як»."}, {"t": "choice", "q": "«Місяць, як срібний човник» — це…", "o": ["метафора", "порівняння", "епітет"], "a": 1, "e": "Є слово «як» — порівняння."}, {"t": "input", "q": "Відгадай: «Сидить дівчина в коморі, а коса її надворі».", "a": ["морква", "морквина"], "e": "Морква."}, {"t": "input", "q": "Відгадай: «Без рук, без ніг, а ворота відчиняє».", "a": ["вітер"], "e": "Вітер."}, {"t": "choice", "q": "Навіщо виникли загадки в давнину?", "o": ["Щоб не називати речі прямо, боячись магії слова", "Для реклами", "Щоб рахувати"], "a": 0, "e": "Вірили в магію слова."}, {"t": "tf", "q": "У загадках часто використовують метафору.", "a": true, "e": "Так, предмет ховається за образом."}, {"t": "choice", "q": "Що розвивають загадки?", "o": ["Силу", "Уяву й кмітливість", "Швидкість бігу"], "a": 1, "e": "Кмітливість і образне мислення."}]}, {"id": "mudrist-pryslivia-hlibov", "sec": "Народна мудрість", "title": "Прислів'я та приказки. Леонід Глібов. Акровірш", "goal": "Ти розрізняєш прислів'я і приказку та знаєш, що таке акровірш.", "learn": [{"h": "Прислів'я та приказки", "p": ["<span class='term'>Прислів'я</span> — короткий влучний вислів із повчальним змістом, завершене речення: <i>Без труда нема плода. Друзі пізнаються в біді.</i>", "<span class='term'>Приказка</span> — влучний образний вислів без повчання, часто частина речення: <i>як сніг на голову; ні риба ні м'ясо; сім п'ятниць на тиждень.</i>"], "note": "Теми прислів'їв: праця, навчання, дружба, батьківщина, честь."}, {"h": "Леонід Глібов (1827–1893)", "p": ["Байкар і поет з Полтавщини, жив у Чернігові. Писав байки («Вовк та Ягня», «Щука») і твори для дітей під псевдонімом <b>Дідусь Кенир</b> (так називали його батька, який купив канарку). Друкувався в дитячому журналі <b>«Дзвінок»</b>. Загадка «Химерний, маленький…» — про <b>вареник</b>; акровірші-загадки: «Хто розмовляє?» — <b>осока</b> (і калина), «Що за птиця?» — <b>муха</b>, «Хто сестра і брат?» — <b>гречка і просо</b>, «Хто вона?» — <b>весна</b>."]}, {"h": "Акровірш", "p": ["<span class='term'>Акровірш</span> — вірш, у якому перші букви рядків, прочитані зверху вниз, утворюють слово — відгадку або ім'я. Глібов писав акровірші-загадки: читаєш першу букву кожного рядка — і маєш відповідь."]}], "remember": "Прислів'я — повчальне завершене речення; приказка — образний вислів без повчання. Глібов — байкар, дідусь Кенир, писав акровірші. Акровірш — перші букви рядків утворюють слово.", "cards": [{"f": "Прислів'я", "b": "Короткий повчальний вислів, завершене речення: Без труда нема плода."}, {"f": "Приказка", "b": "Образний вислів без повчання: як сніг на голову."}, {"f": "Акровірш", "b": "Вірш, у якому перші букви рядків утворюють слово."}, {"f": "Леонід Глібов", "b": "Байкар, писав для дітей загадки й акровірші під псевдонімом дідусь Кенир."}, {"f": "Псевдонім Глібова", "b": "Дідусь Кенир."}, {"f": "«Химерний, маленький…» — про що загадка?", "b": "Про вареник."}, {"f": "Відгадки акровіршів Глібова", "b": "«Що за птиця?» — муха; «Хто сестра і брат?» — гречка і просо; «Хто вона?» — весна; «Хто розмовляє?» — осока."}], "quiz": [{"t": "choice", "q": "«Хто рано встає, тому Бог дає» — це…", "o": ["прислів'я", "приказка", "загадка"], "a": 0, "e": "Завершене повчальне речення."}, {"t": "choice", "q": "«Ні риба ні м'ясо» — це…", "o": ["прислів'я", "приказка", "акровірш"], "a": 1, "e": "Образний вислів без повчання."}, {"t": "choice", "q": "Що таке акровірш?", "o": ["Вірш без рими", "Вірш, у якому перші букви рядків утворюють слово", "Дуже довгий вірш"], "a": 1, "e": "Читаємо перші букви зверху вниз."}, {"t": "choice", "q": "Як розгадати акровірш-загадку Глібова?", "o": ["Прочитати останні слова", "Прочитати перші букви кожного рядка", "Порахувати рядки"], "a": 1, "e": "Перші букви складають відгадку."}, {"t": "input", "q": "Під яким псевдонімом Глібов писав для дітей? Дідусь …", "a": ["кенир", "дідусь кенир"], "e": "Дідусь Кенир."}, {"t": "choice", "q": "Чим прислів'я відрізняється від приказки?", "o": ["Прислів'я — повчальна закінчена думка, приказка — лише образ", "Нічим", "Приказка довша"], "a": 0, "e": "У прислів'ї є висновок-повчання."}, {"t": "choice", "q": "Ким був Леонід Глібов насамперед?", "o": ["Байкарем", "Драматургом", "Істориком"], "a": 0, "e": "Найвідоміший український байкар."}, {"t": "tf", "q": "Приказка — це завершене речення з повчанням.", "a": false, "e": "Це визначення прислів'я."}, {"t": "input", "q": "Про яку страву загадка Глібова «Химерний, маленький, бокастий, товстенький…»?", "a": ["вареник", "вареники"], "e": "Вареник гречаний."}, {"t": "choice", "q": "Хто «сестра і брат» в акровірші Глібова?", "o": ["Гречка і просо", "Осока й калина", "Галушка й вареник"], "a": 0, "e": "Гречка і просо."}, {"t": "choice", "q": "«Що за птиця?» — про кого акровірш?", "o": ["Про сороку", "Про муху", "Про горобця"], "a": 1, "e": "Муха «між людьми, як пташка, в'ється»."}]}, {"id": "ist-litopys", "sec": "Історичне минуле", "title": "Літопис. «Повість минулих літ»", "goal": "Ти знаєш, що таке літопис, хто його автор, і пам'ятаєш літописні оповіді про заснування Києва, Кия, Ольгу, Святослава.", "learn": [{"h": "Літопис", "p": ["<span class='term'>Літопис</span> — історичний твір, у якому події записані за роками («літами»). Найдавніший український літопис — <b>«Повість минулих літ»</b>, укладений ченцем Києво-Печерського монастиря <b>Нестором</b> на початку XII століття (близько 1113 р.)."]}, {"h": "Оповіді з літопису", "p": ["<b>Заснування Києва</b>: три брати — <b>Кий, Щек, Хорив</b> — і сестра <b>Либідь</b>; місто назвали на честь старшого — Київ; гори Щекавиця і Хоривиця, річка Либідь.", "<b>Про князя Олега</b>: волхви передбачили смерть від коня; князь відіслав коня, а через роки, ставши на його череп, загинув від змії.", "<b>Про княгиню Ольгу</b>: помстилася древлянам за смерть чоловіка Ігоря; спалила Іскоростень за допомогою голубів і горобців із запаленими трутами; перша прийняла християнство.", "<b>Про Святослава</b>: хоробрий князь-воїн, «іду на ви!», спав на землі із сідлом під головою; загинув від печенігів на Дніпрових порогах.", "<b>Про хрещення Русі</b> Володимиром (988 р.) і про <b>Ярослава Мудрого</b>, який любив книги."]}, {"h": "Мова літопису", "p": ["Літопис написаний давньою мовою; у підручнику — у перекладі сучасною українською. Оповіді короткі, без зайвих описів, з прямою мовою героїв."]}], "remember": "Літопис — записи подій за роками. «Повість минулих літ» — Нестор, XII ст. Київ заснували Кий, Щек, Хорив, сестра Либідь. Олег — смерть від коня. Ольга — помста древлянам, перша християнка. Святослав — «іду на ви».", "cards": [{"f": "Літопис", "b": "Історичний твір із записами подій за роками."}, {"f": "Хто уклав «Повість минулих літ» і коли?", "b": "Нестор Літописець, чернець Києво-Печерського монастиря, початок XII ст."}, {"f": "Хто заснував Київ за літописом?", "b": "Брати Кий, Щек, Хорив і сестра Либідь."}, {"f": "Як загинув князь Олег?", "b": "Від змії, що виповзла з черепа його коня."}, {"f": "Чим відома княгиня Ольга?", "b": "Помстилася древлянам за Ігоря, перша прийняла християнство."}, {"f": "Чим відомий Святослав?", "b": "Князь-воїн: «іду на ви», загинув від печенігів."}], "quiz": [{"t": "choice", "q": "Літопис — це…", "o": ["збірка казок", "записи історичних подій за роками", "вірш про історію"], "a": 1, "e": "Від «літо» — рік."}, {"t": "choice", "q": "Хто уклав «Повість минулих літ»?", "o": ["Нестор", "Кий", "Ярослав Мудрий"], "a": 0, "e": "Чернець Нестор."}, {"t": "choice", "q": "Коли створено «Повість минулих літ»?", "o": ["У IX ст.", "На початку XII ст.", "У XIX ст."], "a": 1, "e": "Близько 1113 року."}, {"t": "choice", "q": "Хто з братів дав ім'я Києву?", "o": ["Щек", "Хорив", "Кий"], "a": 2, "e": "Старший брат Кий."}, {"t": "input", "q": "Як звали сестру засновників Києва?", "a": ["либідь"], "e": "Либідь."}, {"t": "choice", "q": "Від чого загинув князь Олег?", "o": ["У бою", "Від змії з черепа коня", "Від хвороби"], "a": 1, "e": "Пророцтво волхвів здійснилося."}, {"t": "choice", "q": "Кому помстилася княгиня Ольга?", "o": ["Печенігам", "Древлянам", "Грекам"], "a": 1, "e": "За вбитого чоловіка Ігоря."}, {"t": "choice", "q": "Чий вислів «Іду на ви!»?", "o": ["Святослава", "Володимира", "Кия"], "a": 0, "e": "Князь Святослав попереджав ворогів."}, {"t": "choice", "q": "Хто хрестив Русь?", "o": ["Ольга", "Володимир", "Ярослав"], "a": 1, "e": "Володимир, 988 рік."}, {"t": "tf", "q": "«Повість минулих літ» написана сучасною українською мовою.", "a": false, "e": "Давньою мовою; ми читаємо переклад."}]}, {"id": "ist-oles-kniazha", "sec": "Історичне минуле", "title": "Олександр Олесь. «Заспів», «Ярослав Мудрий», «Княжа Україна»", "goal": "Ти пам'ятаєш зміст поетичних оповідей Олеся про княжу добу.", "learn": [{"h": "«Княжа Україна»", "p": ["Цикл віршованих оповідей Олександра Олеся про історію Русі-України за мотивами літописів: Аскольд і Дір, Олег, Ольга, Святослав, Володимир, Ярослав. Написані, щоб діти любили й знали свою історію."]}, {"h": "«Заспів»", "p": ["Вступ до «Княжої України». Поет закликає слухати про давнину, «як жили колись», порівнює минуле з казкою; згадує <b>Бояна</b> — легендарного співця. Створює настрій урочистості й гордості за рідну землю."]}, {"h": "«Ярослав Мудрий»", "p": ["Син Володимира, здолав брата <b>Святополка</b>, об'єднав землі. За нього Київ розквітнув: побудовано <b>Софійський собор</b>, <b>Золоті ворота</b>; зібрано першу <b>бібліотеку</b>; укладено збірку законів <b>«Руська правда»</b>; засновано школи. Дочки Ярослава стали королевами європейських країн — Київ породичався з Європою. За мудрість і любов до книг князя названо Мудрим."]}, {"h": "Тема й ідея", "p": ["Тема — славне минуле України княжої доби. Ідея — гордість за предків, любов до рідної землі, знання історії."]}], "remember": "«Княжа Україна» — віршовані оповіді Олеся за літописами. «Заспів» — вступ, Боян. Ярослав Мудрий: Софійський собор, Золоті ворота, бібліотека, «Руська правда», школи, до
