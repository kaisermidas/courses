<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Blender · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>
// ============================================================
//  ДАНІ КУРСУ. Один об'єкт на предмет; генерується з підручника.

const COURSE = {"id": "blender5", "title": "Blender", "subtitle": "5 клас · 16 уроків за програмою курсу (35 тижнів)", "lessons": [{"id": "bl-3d-svit", "sec": "Використання 3D графіки", "title": "Використання 3D у сучасному світі. 3D-друк", "goal": "Ти знаєш, де застосовують 3D-графіку і що таке 3D-друк.", "learn": [{"h": "Де використовують 3D", "p": ["<b>Кіно й мультфільми</b> — персонажі, ефекти, цілі світи. <b>Ігри</b> — моделі, локації. <b>Архітектура</b> — візуалізація будинків до будівництва. <b>Дизайн</b> — вигляд речей до виробництва. <b>Медицина</b> — моделі органів, протези. <b>Освіта</b> — тренажери, віртуальні музеї. <b>Реклама</b>, <b>віртуальна (VR)</b> і <b>доповнена (AR)</b> реальність."]}, {"h": "2D і 3D", "p": ["<b>2D</b> — плоске зображення: ширина й висота. <b>3D</b> — три виміри: ширина, висота, <b>глибина</b>; модель можна обертати й дивитись з різних боків. 3D-сцена існує в комп'ютері, а на екран потрапляє після <b>рендеру</b> — обчислення картинки."]}, {"h": "3D-друк", "p": ["<span class='term'>3D-принтер</span> будує предмет шар за шаром (найчастіше з пластику, який плавиться). Винайшов технологію <b>Чак Халл</b> у 1980-х. Спершу створюють <b>3D-модель</b>, потім програма-<b>слайсер</b> ріже її на шари й перетворює на команди принтера. Друкують: деталі, протези, іграшки, макети будинків, навіть їжу й житло."], "note": "Формати файлів для друку — <b>STL</b>, <b>OBJ</b>."}], "remember": "3D використовують у кіно, іграх, архітектурі, дизайні, медицині, VR/AR. 3D має три виміри, включно з глибиною. 3D-принтер друкує шар за шаром; слайсер ріже модель на шари; формати STL, OBJ.", "cards": [{"f": "Чим 3D відрізняється від 2D?", "b": "Є третій вимір — глибина; модель можна обертати й дивитись з різних боків."}, {"f": "Де застосовують 3D-графіку?", "b": "Кіно, ігри, архітектура, дизайн, медицина, освіта, реклама, VR/AR."}, {"f": "Як працює 3D-принтер?", "b": "Наносить матеріал шар за шаром за 3D-моделлю."}, {"f": "Слайсер", "b": "Програма, що ріже 3D-модель на шари й готує команди для принтера."}, {"f": "Формати файлів для 3D-друку", "b": "STL, OBJ."}, {"f": "Хто винайшов 3D-друк?", "b": "Чак Халл у 1980-х роках."}], "quiz": [{"t": "choice", "q": "Який вимір є в 3D, але немає в 2D?", "o": ["Ширина", "Висота", "Глибина"], "a": 2, "e": "Третій вимір — глибина."}, {"t": "choice", "q": "Де НЕ використовують 3D-графіку?", "o": ["У кіно", "В архітектурі", "Ніде не використовують"], "a": 2, "e": "3D всюди: кіно, ігри, медицина, дизайн."}, {"t": "choice", "q": "Як 3D-принтер створює предмет?", "o": ["Вирізає з бруска", "Наносить матеріал шар за шаром", "Відливає у форму"], "a": 1, "e": "Пошарове нанесення."}, {"t": "choice", "q": "Що робить слайсер?", "o": ["Малює модель", "Ріже модель на шари для принтера", "Рендерить картинку"], "a": 1, "e": "Готує команди для принтера."}, {"t": "input", "q": "Найпоширеніший формат файлу для 3D-друку (три букви):", "a": ["stl"], "e": "STL."}, {"t": "choice", "q": "VR — це…", "o": ["віртуальна реальність", "векторний рендер", "відеорядок"], "a": 0, "e": "Virtual Reality."}, {"t": "tf", "q": "3D-моделі використовують у медицині для протезів.", "a": true, "e": "Так, друкують протези й моделі органів."}]}, {"id": "bl-modeliuvannia-poniattia", "sec": "Використання 3D графіки", "title": "3D-моделювання. Загальні поняття", "goal": "Ти знаєш види 3D-моделювання і головні поняття: полігон, меш, вершина, ребро.", "learn": [{"h": "3D-моделювання", "p": ["<span class='term'>3D-моделювання</span> — створення тривимірного об'єкта в програмі. Види: <b>полігональне</b> (з багатокутників — найпоширеніше, ігри й кіно), <b>скульптинг</b> (ліплення, як із глини), <b>сплайнове</b> (криві), <b>процедурне</b> (за правилами й алгоритмами), <b>3D-сканування</b> реального предмета."]}, {"h": "З чого складається модель", "p": ["<span class='term'>Вершина (vertex)</span> — точка в просторі. <span class='term'>Ребро (edge)</span> — відрізок між двома вершинами. <span class='term'>Полігон (грань, face)</span> — плоска фігура, обмежена ребрами; найчастіше <b>чотирикутник (quad)</b> або трикутник. Разом вони утворюють <span class='term'>меш (mesh)</span> — сітку моделі."], "note": "Правило: у моделюванні прагнуть quad'ів — з ними легше згладжувати й анімувати. Трикутники — для готових ігрових моделей."}, {"h": "Полігональність", "p": ["<b>High poly</b> — багато полігонів, багато деталей, важко для комп'ютера (кіно, реклама). <b>Low poly</b> — мало полігонів, швидко (ігри, мобільні). <b>Топологія</b> — те, як розташовані полігони; хороша топологія — рівномірна сітка з quad'ів."]}, {"h": "Етапи створення 3D-роботи", "p": ["1) ідея й референси → 2) <b>моделювання</b> → 3) <b>UV-розгортка</b> й <b>текстурування/матеріали</b> → 4) <b>рігінг</b> (скелет) → 5) <b>анімація</b> → 6) <b>світло й камера</b> → 7) <b>рендер</b> → 8) постобробка."]}], "remember": "Види моделювання: полігональне, скульптинг, сплайнове, процедурне, сканування. Меш = вершини + ребра + полігони. Quad — чотирикутник, tri — трикутник. Low poly / high poly. Етапи: моделювання → матеріали → рігінг → анімація → світло → рендер.", "cards": [{"f": "Вершина, ребро, полігон", "b": "Точка / відрізок між вершинами / плоска грань між ребрами."}, {"f": "Меш (mesh)", "b": "Сітка моделі з вершин, ребер і полігонів."}, {"f": "Quad і tri", "b": "Чотирикутний і трикутний полігон."}, {"f": "Low poly / high poly", "b": "Мало полігонів (ігри) / багато полігонів (кіно, деталізація)."}, {"f": "Топологія", "b": "Те, як розташовані полігони на моделі."}, {"f": "Види 3D-моделювання", "b": "Полігональне, скульптинг, сплайнове, процедурне, 3D-сканування."}, {"f": "Етапи створення 3D-роботи", "b": "Моделювання → матеріали → рігінг → анімація → світло і камера → рендер."}], "quiz": [{"t": "choice", "q": "Точка в 3D-просторі — це…", "o": ["вершина", "ребро", "полігон"], "a": 0, "e": "Vertex."}, {"t": "choice", "q": "Відрізок між двома вершинами —", "o": ["полігон", "ребро", "меш"], "a": 1, "e": "Edge."}, {"t": "input", "q": "Як називається сітка моделі з вершин, ребер і граней?", "a": ["меш", "mesh"], "e": "Меш."}, {"t": "choice", "q": "Quad — це полігон із…", "o": ["3 сторонами", "4 сторонами", "5 сторонами"], "a": 1, "e": "Чотирикутник."}, {"t": "choice", "q": "Для ігор частіше роблять моделі…", "o": ["low poly", "high poly"], "a": 0, "e": "Швидше працюють."}, {"t": "choice", "q": "Ліплення моделі, як із глини, —", "o": ["скульптинг", "сплайнове моделювання", "сканування"], "a": 0, "e": "Sculpting."}, {"t": "choice", "q": "Що йде одразу після моделювання?", "o": ["Рендер", "Матеріали й текстури", "Анімація"], "a": 1, "e": "Спочатку матеріали, потім рігінг і анімація."}, {"t": "input", "q": "Як називається розташування полігонів на моделі?", "a": ["топологія"], "e": "Топологія."}]}, {"id": "bl-blender-vstanovlennia", "sec": "Основи роботи у Blender", "title": "Blender та його переваги. Встановлення й налаштування", "goal": "Ти знаєш, що таке Blender, його переваги, і як його встановити та налаштувати.", "learn": [{"h": "Що таке Blender", "p": ["<span class='term'>Blender</span> — безкоштовна програма для 3D: моделювання, скульптинг, текстурування, анімація, рігінг, симуляції, відеомонтаж, навіть ігровий рушій і 2D-анімація (Grease Pencil). Розробляє <b>Blender Foundation</b> (Нідерланди), програма з <b>відкритим кодом</b>."]}, {"h": "Переваги", "p": ["<b>Безкоштовний</b> і для комерційних робіт; працює на <b>Windows, macOS, Linux</b>; усе в одній програмі; величезна спільнота й багато уроків; регулярні оновлення; підтримує аддони; невеликий розмір. Конкуренти: 3ds Max, Maya, Cinema 4D, ZBrush — платні."]}, {"h": "Встановлення", "p": ["Завантажити з <b>офіційного сайту blender.org</b> (не з випадкових сайтів — там віруси). Обрати версію для своєї системи. Є звичайна версія й <b>LTS</b> (довга підтримка, стабільніша). Перевірити, чи оновлені драйвери відеокарти."]}, {"h": "Перше налаштування", "p": ["Splash screen при запуску: вибір теми, розкладки. У <b>Edit → Preferences</b>: <b>Interface</b> (мова, розмір шрифту), <b>Themes</b>, <b>Input</b> (емуляція цифрового блока й 3-кнопкової миші — корисно для ноутбука), <b>Add-ons</b> (розширення), <b>System</b> (вибір відеокарти для рендеру), <b>Save & Load</b> (автозбереження). Файли Blender мають розширення <b>.blend</b>."]}], "remember": "Blender — безкоштовна програма з відкритим кодом для 3D (Blender Foundation), працює на Windows, macOS, Linux. Качати тільки з blender.org. Налаштування — Edit → Preferences (Interface, Input, Add-ons, System). Файл проєкту — .blend.", "cards": [{"f": "Blender", "b": "Безкоштовна програма з відкритим кодом для 3D-графіки й анімації."}, {"f": "Хто розробляє Blender?", "b": "Blender Foundation (Нідерланди)."}, {"f": "Розширення файлу проєкту Blender", "b": ".blend."}, {"f": "Звідки завантажувати Blender?", "b": "Тільки з офіційного сайту blender.org."}, {"f": "Де налаштування програми?", "b": "Edit → Preferences."}, {"f": "Що таке LTS-версія?", "b": "Версія з довгою підтримкою — стабільніша."}, {"f": "Приклади платних конкурентів Blender", "b": "3ds Max, Maya, Cinema 4D, ZBrush."}], "quiz": [{"t": "choice", "q": "Скільки коштує Blender?", "o": ["Безкоштовний", "Дешевий, але платний", "Дорога підписка"], "a": 0, "e": "Безкоштовний, з відкритим кодом."}, {"t": "input", "q": "Яке розширення у файлу проєкту Blender?", "a": ["blend", ".blend"], "e": ".blend."}, {"t": "choice", "q": "Звідки безпечно завантажити Blender?", "o": ["З торента", "З blender.org", "З реклами в грі"], "a": 1, "e": "Тільки офіційний сайт."}, {"t": "choice", "q": "Де змінюють налаштування Blender?", "o": ["File → New", "Edit → Preferences", "Render → Settings"], "a": 1, "e": "Preferences."}, {"t": "choice", "q": "На яких системах працює Blender?", "o": ["Тільки Windows", "Windows, macOS, Linux", "Тільки Linux"], "a": 1, "e": "На всіх трьох."}, {"t": "choice", "q": "Що означає LTS?", "o": ["Версія з довгою підтримкою", "Легка версія", "Тестова версія"], "a": 0, "e": "Long Term Support."}, {"t": "choice", "q": "Навіщо в Preferences емуляція 3-кнопкової миші?", "o": ["Для роботи на ноутбуці без середньої кнопки", "Щоб миша була швидшою", "Для рендеру"], "a": 0, "e": "Alt замінює середню кнопку."}]}, {"id": "bl-interfeis", "sec": "Основи роботи у Blender", "title": "Інтерфейс та базові інструменти. Навігація у в'юпорті", "goal": "Ти знаєш елементи вікна Blender і вмієш обертати, наближати й рухати вид.", "learn": [{"h": "Елементи вікна", "p": ["<b>3D Viewport (в'юпорт)</b> — головна робоча область зі сценою. <b>Topbar</b> — меню File, Edit, Render, Window, Help і вкладки <b>Workspaces</b> (Layout, Modeling, Sculpting, UV Editing, Shading, Animation, Rendering, Compositing). <b>Outliner</b> (праворуч угорі) — список усіх об'єктів сцени. <b>Properties</b> (праворуч унизу) — властивості: рендер, вихід, сцена, об'єкт, модифікатори (ключ), фізика, матеріал (кулька). <b>Timeline</b> (унизу) — шкала кадрів. <b>Header</b> кожної області, <b>N-панель</b> (клавіша N) — трансформації об'єкта, <b>T-панель</b> — інструменти."]}, {"h": "Стартова сцена", "p": ["Куб, <b>камера</b> й <b>лампа (light)</b>. <b>3D-курсор</b> — червоно-біле кільце; показує, де з'явиться новий об'єкт; повернути в центр — <b>Shift+C</b>."]}, {"h": "Навігація", "p": ["<b>Обертати вид</b> — середня кнопка миші (СКМ) або Alt+ЛКМ. <b>Панорамувати</b> — Shift+СКМ. <b>Наближати</b> — колесо миші. <b>Гізмо осей</b> у правому верхньому куті. Клавіші цифрового блока: <b>1</b> — вид спереду, <b>3</b> — справа, <b>7</b> — зверху, <b>Ctrl</b>+ці цифри — з протилежного боку, <b>0</b> — вид з камери, <b>5</b> — перемикання перспектива/ортогональна, <b>.</b> (крапка) — наблизити до виділеного, <b>Home</b> — показати все."]}, {"h": "Режими відображення", "p": ["У правому верхньому куті в'юпорта: <b>Wireframe</b> (каркас), <b>Solid</b> (суцільний, робочий), <b>Material Preview</b> (з матеріалами), <b>Rendered</b> (як буде на рендері)."]}], "remember": "Вікно: 3D Viewport, Topbar із Workspaces, Outliner (список об'єктів), Properties, Timeline, N-панель. Навігація: СКМ — обертати, Shift+СКМ — рухати, колесо — зум; 1 спереду, 3 збоку, 7 зверху, 0 — камера, 5 — перспектива. Режими: Wireframe, Solid, Material Preview, Rendered.", "cards": [{"f": "3D Viewport", "b": "Головна робоча область, де видно сцену."}, {"f": "Outliner", "b": "Панель зі списком усіх об'єктів сцени."}, {"f": "Properties", "b": "Панель властивостей: рендер, об'єкт, модифікатори, матеріали."}, {"f": "3D-курсор", "b": "Точка, де з'являються нові об'єкти; повернути в центр — Shift+C."}, {"f": "Як обертати вид?", "b": "Середня кнопка миші (або Alt+ЛКМ)."}, {"f": "Як панорамувати й наближати?", "b": "Shift+СКМ; колесо миші."}, {"f": "Клавіші 1, 3, 7, 0 на цифровому блоці", "b": "Вид спереду, справа, зверху, з камери."}, {"f": "Клавіша 5 на цифровому блоці", "b": "Перемикає перспективу й ортогональний вид."}, {"f": "Чотири режими відображення", "b": "Wireframe, Solid, Material Preview, Rendered."}, {"f": "Що показує N-панель?", "b": "Трансформації об'єкта: положення, поворот, масштаб."}], "quiz": [{"t": "choice", "q": "Де знаходиться список усіх об'єктів сцени?", "o": ["В Outliner", "У Timeline", "У Properties"], "a": 0, "e": "Outliner."}, {"t": "choice", "q": "Якою кнопкою миші обертають вид?", "o": ["Лівою", "Середньою", "Правою"], "a": 1, "e": "СКМ."}, {"t": "choice", "q": "Як панорамувати (рухати) вид?", "o": ["Shift+СКМ", "Ctrl+ЛКМ", "Alt+A"], "a": 0, "e": "Shift + середня кнопка."}, {"t": "choice", "q": "Яка клавіша дає вид зверху?", "o": ["1", "3", "7"], "a": 2, "e": "Numpad 7."}, {"t": "choice", "q": "Яка клавіша показує вид з камери?", "o": ["0", "5", "9"], "a": 0, "e": "Numpad 0."}, {"t": "choice", "q": "Що робить клавіша 5 на цифровому блоці?", "o": ["Вмикає рендер", "Перемикає перспективу й ортогональний вид", "Виділяє все"], "a": 1, "e": "Perspective / Orthographic."}, {"t": "choice", "q": "Що визначає 3D-курсор?", "o": ["Місце появи нових об'єктів", "Позицію камери", "Центр рендеру"], "a": 0, "e": "Точка створення."}, {"t": "choice", "q": "Який режим показує лише каркас моделі?", "o": ["Solid", "Wireframe", "Rendered"], "a": 1, "e": "Wireframe."}, {"t": "input", "q": "Яка клавіша відкриває бічну панель з трансформаціями?", "a": ["n"], "e": "N."}, {"t": "choice", "q": "Що є у стартовій сцені Blender?", "o": ["Куб, камера, лампа", "Сфера і площина", "Порожня сцена"], "a": 0, "e": "Куб, камера, світло."}]}, {"id": "bl-mesh-obiekt", "sec": "Основи роботи у Blender", "title": "Структура меша. Складові та дані об'єкта", "goal": "Ти розрізняєш Object Mode і Edit Mode, режими виділення й дані об'єкта.", "learn": [{"h": "Режими", "p": ["<b>Object Mode</b> — робота з об'єктом цілком (переміщення, обертання, масштаб). <b>Edit Mode</b> (клавіша <b>Tab</b>) — робота зі складовими меша: вершинами, ребрами, гранями. Ще є Sculpt Mode, Vertex Paint, Weight Paint."]}, {"h": "Режими виділення в Edit Mode", "p": ["<b>1</b> — вершини (Vertex), <b>2</b> — ребра (Edge), <b>3</b> — грані (Face) — цифри над буквами, не на цифровому блоці. Виділення: <b>A</b> — усе, <b>Alt+A</b> — зняти, <b>B</b> — рамкою, <b>C</b> — пензлем, <b>Alt+ЛКМ</b> по ребру — петля (loop), <b>Ctrl+ЛКМ</b> — шлях, <b>L</b> — зв'язана частина, <b>H</b> — сховати, <b>Alt+H</b> — показати."]}, {"h": "Дані об'єкта", "p": ["Об'єкт має <b>ім'я</b>, <b>дані меша</b>, <b>трансформації</b> (Location, Rotation, Scale), <b>origin</b> — оранжева точка початку об'єкта, від якої йде обертання й масштаб. <b>Object → Set Origin</b> — змінити її. <b>Ctrl+A → Apply</b> — застосувати трансформації (обнулити поворот/масштаб). <b>Колекції</b> (Collections, <b>M</b>) — папки для об'єктів."]}, {"h": "Основні дії", "p": ["<b>Shift+D</b> — дублювати, <b>Alt+D</b> — зв'язана копія, <b>X</b> або Delete — видалити, <b>Ctrl+Z</b> — скасувати, <b>Ctrl+S</b> — зберегти, <b>F9</b> — панель останньої операції, <b>F3</b> — пошук команди, <b>Shift+A</b> — додати об'єкт."]}], "remember": "Tab — перехід Object ↔ Edit Mode. В Edit Mode: 1 — вершини, 2 — ребра, 3 — грані. A Apply Transform."}]}, {"id": "bl-prymityvy", "sec": "Основи роботи у Blender", "title": "Меш-примітиви. Орієнтація у просторі та прив'язки", "goal": "Ти знаєш меш-примітиви, осі координат, інструменти G/R/S і прив'язки.", "learn": [{"h": "Меш-примітиви", "p": ["<b>Shift+A → Mesh</b>: <b>Plane</b> (площина), <b>Cube</b> (куб), <b>Circle</b> (коло), <b>UV Sphere</b> (сфера з сегментів), <b>Ico Sphere</b> (з трикутників), <b>Cylinder</b> (циліндр), <b>Cone</b> (конус), <b>Torus</b> (бублик), <b>Grid</b> (сітка), <b>Monkey</b> (мавпочка Suzanne — талісман Blender). Після додавання внизу ліворуч (F9) можна змінити параметри: розмір, кількість сегментів (Vertices), розташування."]}, {"h": "Осі й трансформації", "p": ["<b>X</b> — червона (ліворуч-праворуч), <b>Y</b> — зелена (вперед-назад), <b>Z</b> — синя (вгору-вниз). <b>G</b> (Grab) — перемістити, <b>R</b> (Rotate) — обернути, <b>S</b> (Scale) — масштабувати. Після клавіші можна натиснути вісь: <b>G+X</b> — рух лише по X; <b>Shift+Z</b> — по всіх, крім Z. Можна ввести число: <b>G+X+2 → Enter</b> — на 2 метри. <b>ЛКМ/Enter</b> — підтвердити, <b>ПКМ/Esc</b> — скасувати."]}, {"h": "Прив'язки й точність", "p": ["<b>Snap (магніт)</b> — прив'язка до сітки, вершин, ребер, граней; тимчасово — затиснути <b>Ctrl</b> під час руху. <b>Pivot Point</b> (крапка, навколо якої обертаємо): Median Point, 3D Cursor, Individual Origins. <b>Transform Orientation</b>: Global (світові осі) чи Local (осі об'єкта). <b>Shift+S</b> — меню Snap (курсор до виділеного, виділене до курсора). Одиниці — метри."]}], "remember": "Shift+A → Mesh: Plane, Cube, Sphere, Cylinder, Cone, Torus, Monkey. Осі: X червона, Y зелена, Z синя. G — рух, R — поворот, S — масштаб; далі вісь і число. Ctrl — прив'язка, Shift+S — меню Snap, Pivot Point — центр обертання.", "cards": [{"f": "Як додати примітив?", "b": "Shift+A → Mesh."}, {"f": "Мавпочка Suzanne", "b": "Тестова модель-талісман Blender."}, {"f": "Кольори осей", "b": "X — червона, Y — зелена, Z — синя."}, {"f": "  ноутбук = два сплющені куби."]}, {"h": "Головні інструменти", "p": ["<b>E (Extrude)</b> — витягнути грань/ребро/вершину, створюючи нову геометрію. <b>I (Inset)</b> — вставити грань усередину. <b>Ctrl+B (Bevel)</b> — фаска, скруглення ребра (колесо миші — кількість сегментів). <b>Ctrl+R (Loop Cut)</b> — додати петлю розрізу; колесо — кількість. <b>K (Knife)</b> — ніж, різати вручну. <b>M (Merge)</b> — злити вершини (By Distance прибирає дублікати). <b>F</b> — створити грань між виділеними вершинами. <b>P</b> — відділити частину в окремий об'єкт. <b>Ctrl+J</b> — об'єднати об'єкти."]}, {"h": "Згладжування", "p": ["<b>Shade Smooth</b> (ПКМ у Object Mode) — плавні переходи; <b>Shade Flat</b> — грановане. Плавність — це відображення, а не зміна геометрії; для справжнього згладжування — модифікатор <b>Subdivision Surface</b> (Ctrl+1…5)."]}, {"h": "Поради", "p": ["Працюй у quad'ах; не масштабуй у Object Mode без Apply; вмикай <b>Statistics</b>, щоб бачити кількість полігонів; використовуй <b>референси</b> (фото предмета) як фон."]}], "remember": "E — Extrude (витягнути), I — Inset (вставка), Ctrl+B — Bevel (фаска), Ctrl+R — Loop Cut, K — Knife, M — Merge, F — створити грань, P — відділити, Ctrl+J — об'єднати. Shade Smooth — гладке відображення; Subdivision Surface — справжнє згладження.", "cards": [{"f": "E (Extrude)", "b": "Витягує нову геометрію з виділеної грані, ребра чи вершини."}, {"f": "I (Inset)", "b": "Створює меншу грань усередині виділеної."}, {"f": "Ctrl+B (Bevel)", "b": "Робить фаску/скруглення ребра; колесо змінює кількість сегментів."}, {"f": "Ctrl+R (Loop Cut)", "b": "Додає петлю розрізу навколо моделі."}, {"f": "K (Knife)", "b": "Ніж — різати меш вручну."}, {"f": "F", "b": "Створити грань або ребро між виділеними вершинами."}, {"f": "P / Ctrl+J", "b": "Відділити частину в окремий об'єкт / об'єднати об'єкти."}, {"f": "Shade Smooth", "b": "Гладке відображення поверхні (геометрія не змінюється)."}], "quiz": [{"t": "choice", "q": "Яка клавіша витягує нову геометрію?", "o": ["E", "I", "K"], "a": 0, "e": "Extrude."}, {"t": "choice", "q": "Що робить Inset (I)?", "o": ["Створює меншу грань усередині", "Видаляє грань", "Обертає"], "a": 0, "e": "Вставка всередину."}, {"t": "choice", "q": "Чим зробити скруглене ребро?", "o": ["Ctrl+R", "Ctrl+B", "Ctrl+J"], "a": 1, "e": "Bevel."}, {"t": "choice", "q": "Ctrl+R — це…", "o": ["Loop Cut", "Rotate", "Render"], "a": 0, "e": "Петля розрізу."}, {"t": "choice", "q": "Як створити грань між чотирма виділеними вершинами?", "o": ["F", "M", "P"], "a": 0, "e": "Клавіша F."}, {"t": "choice", "q": "Як об'єднати два об'єкти в один?", "o": ["Ctrl+J", "Ctrl+P", "Alt+J"], "a": 0, "e": "Join."}, {"t": "choice", "q": "Shade Smooth…", "o": ["додає полігони", "змінює лише відображення", "видаляє ребра"], "a": 1, "e": "Геометрія та сама."}, {"t": "choice", "q": "З яких примітивів найпростіше зробити чашку?", "o": ["Циліндр + тор", "Куб + конус", "Сфера + площина"], "a": 0, "e": "Циліндр і ручка-тор."}, {"t": "input", "q": "Яка клавіша зливає виділені вершини? (Merge)", "a": ["m"], "e": "M."}]}, {"id": "bl-modyfikatory", "sec": "Основи полігонального моделювання", "title": "Модифікатори: Generate, Deform, Physics. Ландшафт і low poly", "goal": "Ти знаєш, що таке модифікатори, і головні модифікатори класів Generate й Deform.", "learn": [{"h": "Що таке модифікатор", "p": ["<span class='term'>Модифікатор</span> — «інструкція», що змінює вигляд об'єкта, не змінюючи самої сітки: його можна вимкнути, налаштувати чи видалити. Панель — іконка <b>гайкового ключа</b> в Properties. Порядок модифікаторів у стеку важливий. <b>Apply</b> — застосувати назавжди (тільки в Object Mode)."]}, {"h": "Generate — створюють геометрію", "p": ["<b>Subdivision Surface</b> — згладжує, збільшуючи кількість полігонів (Ctrl+1…5). <b>Mirror</b> — дзеркалить половину (робимо пів персонажа — отримуємо цілого); Clipping не дає роз'їхатись по центру. <b>Array</b> — масив копій (сходи, паркан). <b>Solidify</b> — надає товщину площині. <b>Bevel</b> — фаска всіх ребер. <b>Boolean</b> — вирізає/об'єднує одну форму іншою (отвори). <b>Screw</b> — обертає профіль (пляшка, гвинт). <b>Remesh</b>, <b>Decimate</b> (зменшує кількість полігонів)."]}, {"h": "Deform — деформують", "p": ["<b>Simple Deform</b> — скрутити, зігнути, розтягнути. <b>Lattice</b> — деформація кліткою. <b>Shrinkwrap</b> — «обтягує» іншу поверхню. <b>Wave</b> — хвиля. <b>Displace</b> — зміщує вершини за текстурою — так роблять <b>ландшафт</b>: площина + багато підрозділів + Displace з текстурою Clouds. <b>Curve</b> — гне об'єкт по кривій. <b>Armature</b> — деформація скелетом (рігінг)."]}, {"h": "Physics і low poly", "p": ["Клас <b>Physics</b>: <b>Cloth</b> (тканина), <b>Soft Body</b>, <b>Collision</b>, <b>Fluid</b>, <b>Particle System</b>, <b>Explode</b>, <b>Ocean</b> — для симуляцій. <b>Low poly</b>-стиль: мало полігонів, Shade Flat, прості кольори — швидкий рендер і модна стилістика для ігор."]}], "remember": "Модифікатор змінює вигляд, не чіпаючи сітку; іконка ключа; Apply — назавжди. Generate: Subdivision, Mirror, Array, Solidify, Boolean, Screw. Deform: Simple Deform, Displace (ландшафт), Curve, Lattice, Armature. Physics: Cloth, Fluid, Collision, Particles.", "cards": [{"f": "Модифікатор", "b": "Інструкція, що змінює вигляд об'єкта без зміни самої сітки; можна вимкнути й видалити."}, {"f": "Де панель модифікаторів?", "b": "Properties, іконка гайкового ключа."}, {"f": "Subdivision Surface", "b": "Згладжує модель, додаючи полігони (Ctrl+1…5)."}, {"f": "Mirror", "b": "Дзеркалить геометрію — моделюєш половину, отримуєш цілу."}, {"f": "Array", "b": "Створює масив копій об'єкта."}, {"f": "Solidify", "b": "Надає товщину площині."}, {"f": "Boolean", "b": "Вирізає або об'єднує форму іншою формою."}, {"f": "Displace", "b": "Зміщує вершини за текстурою; так роблять ландшафт."}, {"f": "Armature", "b": "Модифікатор деформації скелетом (рігінг)."}, {"f": "Модифікатори класу Physics", "b": "Cloth, Soft Body, Collision, Fluid, Particle System, Ocean."}], "quiz": [{"t": "choice", "q": "Модифікатор…", "o": ["назавжди змінює сітку", "змінює вигляд, і його можна вимкнути", "видаляє об'єкт"], "a": 1, "e": "Неруйнівне редагування."}, {"t": "choice", "q": "Яка іконка відкриває модифікатори?", "o": ["Кулька", "Гайковий ключ", "Камера"], "a": 1, "e": "Wrench."}, {"t": "choice", "q": "Який модифікатор згладжує модель?", "o": ["Subdivision Surface", "Array", "Boolean"], "a": 0, "e": "Підрозділення."}, {"t": "choice", "q": "Ти моделюєш половину персонажа. Який модифікатор потрібен?", "o": ["Mirror", "Solidify", "Wave"], "a": 0, "e": "Дзеркало."}, {"t": "choice", "q": "Чим зробити паркан із багатьох однакових дощок?", "o": ["Array", "Bevel", "Screw"], "a": 0, "e": "Масив."}, {"t": "choice", "q": "Який модифікатор вирізає отвір однією формою в іншій?", "o": ["Boolean", "Lattice", "Displace"], "a": 0, "e": "Boolean."}, {"t": "choice", "q": "Чим зробити ландшафт із площини?", "o": ["Displace з текстурою", "Solidify", "Decimate"], "a": 0, "e": "Зміщення вершин за текстурою."}, {"t": "choice", "q": "Cloth і Fluid належать до класу…", "o": ["Generate", "Deform", "Physics"], "a": 2, "e": "Симуляції."}, {"t": "choice", "q": "Що робить Solidify?", "o": ["Надає товщину", "Зменшує полігони", "Гне по кривій"], "a": 0, "e": "Товщина площини."}, {"t": "choice", "q": "Decimate потрібен, щоб…", "o": ["збільшити кількість полігонів", "зменшити кількість полігонів", "додати колір"], "a": 1, "e": "Спрощення сітки."}]}, {"id": "bl-personazh", "sec": "Створюємо персонажа", "title": "Створення персонажа: тіло, руки, долоні, голова, обличчя, волосся, ноги, одяг", "goal": "Ти знаєш порядок і прийоми моделювання персонажа в Blender.", "learn": [{"h": "З чого почати", "p": ["<b>Ідея й референси</b>: малюнок або фото персонажа спереду й збоку; додають як <b>Background Image</b> (Shift+A → Image → Reference). Обирають стиль: реалістичний чи мультяшний (великі очі й голова, спрощені форми). Пропорції: у мультяшних персонажів 3–5 «голів» на зріст, у реалістичних — 7–8."]}, {"h": "Тіло і руки", "p": ["Починають із простої форми (куб або циліндр) + модифікатори <b>Mirror</b> і <b>Subdivision Surface</b> — так робиться лише половина. Тулуб витягують інструментом <b>E</b>; руки — витягуванням граней з плеча; за допомогою <b>Loop Cut</b> додають петлі там, де буде згин (лікоть, коліно) — це потрібно для майбутньої анімації."]}, {"h": "Долоні, голова, обличчя", "p": ["<b>Долоня</b>: пласка форма-куб, з якої витягують чотири пальці й великий палець; кожен палець — 3 сегменти. Спрощений варіант — рукавичка з великим пальцем. <b>Голова</b>: із сфери або куба з підрозділами; форма черепа, потім щелепа. <b>Обличчя</b>: очниці й рот роблять <b>петлями по колу</b> (loop) — так міміка виглядатиме природно; очі — окремі сфери; ніс і вуха — витягуванням."]}, {"h": "Волосся, ноги, одяг", "p": ["<b>Волосся</b>: суцільна «шапка» з меша (стилізовано), або пасма з площин, або частинки (Particle System / Hair Curves). <b>Ноги</b>: витягуванням з таза, петлі на коліні й щиколотці, ступня — окремими витягуваннями. <b>Одяг і взуття</b>: дублювати частину тіла (Shift+D → P), додати <b>Solidify</b> для товщини; або симуляція <b>Cloth</b>."], "note": "Практика: збережи файл (Ctrl+S) на кожному етапі — і не бійся починати заново, це нормально."}], "remember": "Порядок: референси → тіло (Mirror + Subdivision) → руки → долоні (пальці по 3 сегменти) → голова → обличчя (петлі навколо очей і рота) → волосся → ноги → одяг (Solidify або Cloth). Loop Cut на згинах — для анімації.", "cards": [{"f": "Референс", "b": "Малюнок або фото, за яким моделюють; додають як Background/Reference Image."}, {"f": "Які модифікатори головні для персонажа?", "b": "Mirror (симетрія) і Subdivision Surface (згладження)."}, {"f": "Навіщо петлі (Loop Cut) на ліктях і колінах?", "b": "Щоб модель гарно згиналась під час анімації."}, {"f": "Скільки сегментів роблять на пальці?", "b": "Приблизно три — за фалангами."}, {"f": "Як моделюють очі й рот?", "b": "Петлями по колу (loop), щоб міміка виглядала природно."}, {"f": "Способи зробити волосся", "b": "Суцільна форма з меша, пасма з площин, частинки (Hair)."}, {"f": "Як зробити одяг із тіла персонажа?", "b": "Дублювати частину (Shift+D), відділити (P), додати Solidify."}, {"f": "Пропорції мультяшного персонажа", "b": "3–5 «голів» на зріст (у реалістичного — 7–8)."}], "quiz": [{"t": "choice", "q": "З чого починають створення персонажа?", "o": ["З рендеру", "З референсів та ідеї", "З анімації"], "a": 1, "e": "Спочатку задум і зображення."}, {"t": "choice", "q": "Який модифікатор дозволяє моделювати лише половину персонажа?", "o": ["Mirror", "Array", "Boolean"], "a": 0, "e": "Дзеркало."}, {"t": "choice", "q": "Навіщо додавати петлі на коліні?", "o": ["Щоб було красиво", "Щоб модель правильно згиналась при анімації", "Щоб зменшити вагу файлу"], "a": 1, "e": "Геометрія для згину."}, {"t": "choice", "q": "Скільки сегментів зазвичай у пальця?", "o": ["Один", "Три", "Десять"], "a": 1, "e": "За фалангами."}, {"t": "choice", "q": "Як краще будувати геометрію навколо очей і рота?", "o": ["Прямими рядами", "Петлями по колу", "Випадково"], "a": 1, "e": "Кільцеві петлі."}, {"t": "choice", "q": "Чим надати товщину одягу, зробленому з поверхні тіла?", "o": ["Solidify", "Decimate", "Screw"], "a": 0, "e": "Товщина."}, {"t": "choice", "q": "У мультяшного персонажа зріст приблизно…", "o": ["3–5 голів", "7–8 голів", "12 голів"], "a": 0, "e": "Стилізовані пропорції."}, {"t": "input", "q": "Яке сполучення зберігає файл?", "a": ["ctrl+s", "ctrls", "ctrl s"], "e": "Ctrl+S."}]}, {"id": "bl-splainy-text", "sec": "Сплайни", "title": "Сплайни. Криві Безьє. Робота з текстом. Додаємо фон", "goal": "Ти знаєш, що таке сплайн і крива Безьє, і вмієш працювати з текстом та фоном сцени.", "learn": [{"h": "Сплайни (криві)", "p": ["<span class='term'>Сплайн (крива)</span> — лінія, задана <b>контрольними точками</b>, а не полігонами. Shift+A → <b>Curve</b>: <b>Bezier</b>, <b>Circle</b>, <b>NURBS</b>, <b>Path</b>. Криві зручні для труб, доріг, тросів, логотипів, а також як траєкторії руху."]}, {"h": "Крива Безьє", "p": ["<span class='term'>Крива Безьє</span> має контрольні точки з <b>ручками (handles)</b>, які задають вигин. Типи ручок (клавіша <b>V</b>): <b>Vector</b> (гострий кут), <b>Auto</b>, <b>Aligned</b> (плавно), <b>Free</b>. У Object Data (іконка кривої) є <b>Geometry → Bevel</b>: Depth робить криву об'ємною трубкою; <b>Extrude</b> — товщина; <b>Fill Caps</b> — закрити торці. <b>Alt+C</b> / Object → Convert — перетворити криву на меш."], "note": "Криві Безьє винайшли для проєктування автомобілів; тепер вони всюди — від шрифтів до анімації."}, {"h": "Текст", "p": ["Shift+A → <b>Text</b>. Tab — режим редагування, стерти «Text» і написати своє. У Object Data: <b>Font</b> (завантажити свій шрифт), <b>Size</b>, <b>Extrude</b> (об'єм), <b>Bevel</b> (скруглення країв), <b>Align</b>, <b>Paragraph</b>. Текст теж можна перетворити на меш (Convert to Mesh) і далі редагувати як звичайну модель."]}, {"h": "Фон сцени", "p": ["Варіанти фону: 1) <b>World</b> (іконка глобуса в Properties) — колір або <b>HDRI</b>-зображення, яке ще й освітлює сцену; 2) велика <b>площина/циклорама</b> — площина, зігнута вгору (Loop Cut + Bevel), щоб не було кута між підлогою і стіною; 3) <b>Background Image</b> лише для орієнтиру. Для рендеру фон видно тільки з камери — перевіряй клавішею 0."]}], "remember": "Сплайн — крива з контрольних точок. Безьє має ручки (V — тип ручки); Bevel Depth робить трубку; Convert — у меш. Текст: Shift+A → Text, Tab для редагування, Extrude — об'єм. Фон: World/HDRI, циклорама, Background Image.", "cards": [{"f": "Сплайн (крива)", "b": "Лінія, задана контрольними точками, а не полігонами."}, {"f": "Крива Безьє", "b": "Крива з контрольними точками й ручками, що задають вигин."}, {"f": "Клавіша V на кривій", "b": "Змінює тип ручки: Vector, Auto, Aligned, Free."}, {"f": "Як зробити криву об'ємною трубкою?", "b": "Object Data → Geometry → Bevel → Depth."}, {"f": "Як перетворити криву або текст на меш?", "b": "Object → Convert → Mesh."}, {"f": "Як додати текст?", "b": "Shift+A → Text, потім Tab і редагування."}, {"f": "Extrude для тексту", "b": "Надає буквам об'єм (товщину)."}, {"f": "HDRI", "b": "Панорамне зображення, яке слугує фоном і освітлює сцену."}, {"f": "Циклорама", "b": "Площина, плавно зігнута вгору, щоб не було кута між підлогою і стіною."}], "quiz": [{"t": "choice", "q": "Сплайн задається…", "o": ["полігонами", "контрольними точками", "пікселями"], "a": 1, "e": "Крива з точок."}, {"t": "choice", "q": "Що задають ручки кривої Безьє?", "o": ["Колір", "Вигин лінії", "Товщину"], "a": 1, "e": "Handles керують вигином."}, {"t": "choice", "q": "Як зробити з кривої трубу?", "o": ["Bevel Depth у налаштуваннях кривої", "Solidify", "Array"], "a": 0, "e": "Geometry → Bevel."}, {"t": "choice", "q": "Як додати текст у сцену?", "o": ["Shift+A → Text", "Ctrl+T", "F2"], "a": 0, "e": "Add → Text."}, {"t": "choice", "q": "Як редагувати сам напис?", "o": ["Двічі клацнути", "Tab (Edit Mode) і друкувати", "Через Properties"], "a": 1, "e": "Edit Mode."}, {"t": "choice", "q": "Extrude у тексті робить…", "o": ["колір", "об'єм букв", "тінь"], "a": 1, "e": "Товщина."}, {"t": "choice", "q": "HDRI використовують, щоб…", "o": ["зменшити полігони", "задати фон і освітлення", "зробити анімацію"], "a": 1, "e": "Панорама освітлює сцену."}, {"t": "choice", "q": "Навіщо циклорама?", "o": ["Щоб не було видно кута між підлогою і стіною", "Щоб додати текст", "Щоб пришвидшити рендер"], "a": 0, "e": "Безшовний фон."}, {"t": "input", "q": "Яка клавіша змінює тип ручки на кривій?", "a": ["v"], "e": "V."}]}, {"id": "bl-materialy", "sec": "Матеріали в Blender", "title": "Матеріали. Поняття нод. Розфарбовуємо персонажа", "goal": "Ти знаєш, що таке матеріал і ноди, і вмієш призначати кольори частинам моделі.", "learn": [{"h": "Матеріал", "p": ["<span class='term'>Матеріал</span> визначає, як поверхня виглядає: колір, блиск, прозорість, металевість. Панель — іконка <b>кулі</b> в Properties → New. Базовий шейдер — <b>Principled BSDF</b>: <b>Base Color</b> (колір), <b>Metallic</b> (метал 0–1), <b>Roughness</b> (шорсткість: 0 — дзеркало, 1 — матовий), <b>Transmission</b> (прозорість, скло), <b>Emission</b> (світіння), <b>Alpha</b>, <b>Normal</b>."]}, {"h": "Ноди", "p": ["<span class='term'>Нода (node)</span> — блок, що виконує одну дію; ноди з'єднують «дротиками» у <b>Shader Editor</b> (вкладка Shading). Вихід матеріалу — нода <b>Material Output</b>. Ноди бувають: шейдери (Principled, Emission, Glass), текстури (Image Texture, Noise, Wave, Voronoi, Checker), колір (ColorRamp, Mix), координати (Texture Coordinate, Mapping). Перевага нод — можна комбінувати й отримувати складні матеріали без малювання."]}, {"h": "Кілька матеріалів на одній моделі", "p": ["У Properties → Material → «+» додати <b>слоти</b>. У <b>Edit Mode</b> виділити потрібні грані → обрати слот → <b>Assign</b>. Так фарбують персонажа: шкіра, очі, волосся, одяг, взуття — окремі матеріали. Дивитись результат — режим <b>Material Preview</b> (або клавіша Z → меню)."]}, {"h": "Текстури й матеріали", "p": ["<b>Матеріал</b> — набір властивостей поверхні; <b>текстура</b> — зображення або процедурний візерунок, що підключається до матеріалу (наприклад, у Base Color). <b>UV-розгортка</b> — «викрійка» моделі на площині, щоб зображення лягло правильно (U — розгорнути, вкладка UV Editing, шви — Ctrl+E → Mark Seam). <b>Процедурний шейдинг</b> — візерунок обчислюється формулами (Noise, Voronoi), не потребує зображення й не має швів."]}], "remember": "Матеріал — вигляд поверхні (іконка кулі); Principled BSDF: Base Color, Metallic, Roughness, Transmission, Emission. Ноди з'єднуються в Shader Editor, вихід — Material Output. Кілька матеріалів: слоти + Assign в Edit Mode. Текстура — зображення/візерунок у матеріалі; UV — викрійка; процедурні текстури без зображень.", "cards": [{"f": "Матеріал", "b": "Опис поверхні: колір, блиск, прозорість, металевість."}, {"f": "Principled BSDF", "b": "Основний універсальний шейдер Blender."}, {"f": "Roughness", "b": "Шорсткість: 0 — дзеркальна поверхня, 1 — матова."}, {"f": "Metallic", "b": "Наскільки поверхня металева (0–1)."}, {"f": "Emission", "b": "Світіння матеріалу — поверхня сама випромінює світло."}, {"f": "Нода", "b": "Блок у Shader Editor, що виконує одну дію; ноди з'єднують дротиками."}, {"f": "Material Output", "b": "Кінцева нода, до якої підключають шейдер."}, {"f": "Як призначити другий матеріал частині моделі?", "b": "Додати слот, в Edit Mode виділити грані, натиснути Assign."}, {"f": "Чим текстура відрізняється від матеріалу?", "b": "Матеріал — властивості поверхні; текстура — зображення чи візерунок, що підключається до матеріалу."}, {"f": "UV-розгортка", "b": "«Викрійка» моделі на площині, щоб зображення лягло правильно."}, {"f": "Процедурна текстура", "b": "Візерунок, обчислений формулами (Noise, Voronoi), без зображення і швів."}], "quiz": [{"t": "choice", "q": "Яка іконка відкриває матеріали?", "o": ["Куля", "Ключ", "Камера"], "a": 0, "e": "Material Properties."}, {"t": "choice", "q": "Основний шейдер Blender —", "o": ["Principled BSDF", "Emission", "Glass"], "a": 0, "e": "Універсальний."}, {"t": "choice", "q": "Roughness = 0 означає…", "o": ["дзеркальну поверхню", "матову поверхню", "прозору"], "a": 0, "e": "Гладко — дзеркало."}, {"t": "choice", "q": "Який параметр робить поверхню світною?", "o": ["Metallic", "Emission", "Alpha"], "a": 1, "e": "Emission."}, {"t": "choice", "q": "Ноди з'єднують у…", "o": ["Shader Editor", "Outliner", "Timeline"], "a": 0, "e": "Вкладка Shading."}, {"t": "choice", "q": "Щоб пофарбувати лише волосся персонажа, треба…", "o": ["створити слот матеріалу, виділити грані й натиснути Assign", "перефарбувати весь об'єкт", "додати новий об'єкт"], "a": 0, "e": "Слоти матеріалів."}, {"t": "choice", "q": "Що таке UV-розгортка?", "o": ["Формат файлу", "Викрійка моделі на площині для текстури", "Вид світла"], "a": 1, "e": "UV unwrap."}, {"t": "choice", "q": "Перевага процедурних текстур:", "o": ["не потребують зображення й не мають швів", "швидше рендеряться завжди", "їх можна друкувати"], "a": 0, "e": "Обчислюються формулами."}, {"t": "choice", "q": "Чим переглянути матеріали прямо у в'юпорті?", "o": ["Wireframe", "Material Preview", "Ortho"], "a": 1, "e": "Режим відображення."}, {"t": "input", "q": "Як називається кінцева нода матеріалу? Material …", "a": ["output", "material output"], "e": "Material Output."}]}, {"id": "bl-fon-rechi", "sec": "Працюємо над фоном", "title": "Предмети для фону: стіл, стілець, ноутбук, чашка, горщик, вентилятор", "goal": "Ти вмієш розкладати побутові предмети на прості форми і знаєш прийоми для кожного.", "learn": [{"h": "Принцип", "p": ["Будь-який предмет — це набір простих форм. Спершу знайди <b>референс</b>, потім визнач основні об'єми, і лише тоді деталі. Дотримуйся <b>масштабу</b> (стіл ≈ 0,75 м заввишки, чашка ≈ 9 см) — інакше сцена виглядатиме дивно."]}, {"h": "Меблі", "p": ["<b>Стіл</b>: куб (стільниця, сплющити по Z) + ніжка з куба, розмножена <b>Mirror</b> або <b>Array</b>; ребра — <b>Bevel</b>. <b>Стілець</b>: сидіння-куб, спинка-куб, чотири ніжки; вигини спинки — Loop Cut + переміщення петель або Simple Deform."]}, {"h": "Техніка", "p": ["<b>Ноутбук</b>: два сплющені куби (база й екран), з'єднані під кутом; екран — окрема грань з іншим матеріалом (Emission — світиться); клавіші — маленький куб + Array по двох осях. <b>Вентилятор</b>: циліндр-основа, стійка-циліндр, кільце (Torus), лопаті — площина, зігнута й розмножена <b>Array + порожній об'єкт (Empty)</b> з поворотом, решітка — тонкі кільця або Boolean."]}, {"h": "Дрібні предмети", "p": ["<b>Чашка</b>: циліндр → Inset верхньої грані → Extrude всередину (порожнина) → Solidify для стінок; ручка — тор або крива з Bevel. <b>Склянка</b>: те саме без ручки, матеріал зі Transmission (скло). <b>Горщик з рослиною</b>: конус/циліндр звужений донизу; земля — площина; листя — площини з текстурою прозорості або прості меші. <b>Блокнот</b>: куб + Bevel, сторінки — Array тонких площин."], "note": "Практика: збери зі своїх предметів невелику сцену «робочий стіл» і додай персонажа."}], "remember": "Спочатку референс і основні об'єми, потім деталі, і дотримуйся реального масштабу. Стіл і стілець — куби + Mirror/Array + Bevel. Ноутбук — два сплющені куби, екран з Emission, клавіші через Array. Чашка — циліндр + Inset + Extrude + Solidify, ручка з тора. Скло — матеріал із Transmission.", "cards": [{"f": "З чого починати моделювання предмета?", "b": "З референсу й основних об'ємів, деталі — в кінці."}, {"f": "Чому важливий масштаб?", "b": "Предмети різного розміру псують сцену; стіл ≈ 0,75 м, чашка ≈ 9 см."}, {"f": "Як зробити чотири ніжки столу?", "b": "Mirror по двох осях або Array."}, {"f": "Як зробити порожнину чашки?", "b": "Inset верхньої грані, потім Extrude всередину."}, {"f": "Як зробити ручку чашки?", "b": "Тор або крива Безьє з Bevel Depth."}, {"f": "Як зробити клавіші ноутбука?", "b": "Один куб + Array по двох осях."}, {"f": "Як показати, що екран світиться?", "b": "Матеріал із Emission."}, {"f": "Як розмножити лопаті вентилятора по колу?", "b": "Array з об'єктом-зміщенням (Empty), повернутим на потрібний кут."}, {"f": "Який матеріал у склянки?", "b": "Прозорий — Transmission (скло)."}], "quiz": [{"t": "choice", "q": "З чого починають моделювати предмет?", "o": ["З дрібних деталей", "З референсу й основних форм", "З матеріалів"], "a": 1, "e": "Від великого до дрібного."}, {"t": "choice", "q": "Яка приблизна висота столу?", "o": ["0,4 м", "0,75 м", "1,5 м"], "a": 1, "e": "≈75 см."}, {"t": "choice", "q": "Чим зробити порожнину всередині чашки?", "o": ["Inset + Extrude всередину", "Bevel", "Decimate"], "a": 0, "e": "Вставка і витягування."}, {"t": "choice", "q": "Чим швидко зробити багато однакових клавіш?", "o": ["Array", "Boolean", "Mirror"], "a": 0, "e": "Масив."}, {"t": "choice", "q": "Який параметр матеріалу робить скло?", "o": ["Metallic", "Transmission", "Emission"], "a": 1, "e": "Прозорість."}, {"t": "choice", "q": "Екран ноутбука, що світиться, — це матеріал з…", "o": ["Emission", "Roughness 1", "Alpha 0"], "a": 0, "e": "Світіння."}, {"t": "choice", "q": "Ручку чашки найзручніше зробити з…", "o": ["куба", "тора або кривої", "конуса"], "a": 1, "e": "Тор або крива з Bevel."}, {"t": "choice", "q": "Чим скруглити гострі ребра столу?", "o": ["Bevel", "Subdivision", "Knife"], "a": 0, "e": "Фаска."}, {"t": "tf", "q": "Деталі краще робити раніше за основні форми.", "a": false, "e": "Навпаки: спочатку великі об'єми."}]}, {"id": "bl-riginh", "sec": "Знайомство з рігінгом", "title": "Що таке рігінг. Додаємо кістки персонажу", "goal": "Ти знаєш, що таке рігінг, арматура, кістка, і як прив'язати модель до скелета.", "learn": [{"h": "Рігінг", "p": ["<span class='term'>Рігінг</span> — створення «скелета» для 3D-моделі, щоб її можна було рухати й анімувати. Без ріга модель нерухома. Слово від rig — оснастка. Персонажів, тварин, механізми — усе, що рухається, ріггають."]}, {"h": "Арматура і кістки", "p": ["<span class='term'>Арматура (Armature)</span> — об'єкт-скелет: Shift+A → Armature. <span class='term'>Кістка (bone)</span> має <b>Head</b> (початок), <b>Body</b>, <b>Tail</b> (кінець). Кістки з'єднують у ланцюг — <b>parent</b> (батьківська) і <b>child</b>: рухаєш плече — рухається вся рука. Режими арматури: <b>Object</b>, <b>Edit</b> (будуємо скелет, <b>E</b> — витягнути наступну кістку), <b>Pose Mode</b> (позуємо: <b>R</b> — обертати кістку). Симетрію дає ім'я з суфіксами <b>.L</b> і <b>.R</b> та <b>Symmetrize</b>."]}, {"h": "Прив'язка (skinning)", "p": ["Виділити спершу <b>меш</b>, потім із Shift — <b>арматуру</b>, натиснути <b>Ctrl+P → With Automatic Weights</b>. Blender сам розрахує, які вершини слухаються якої кістки — це <b>ваги (weights)</b>. У моделі з'явиться модифікатор <b>Armature</b>. Помилки виправляють у <b>Weight Paint</b>: червоне — сильний вплив, синє — нема."]}, {"h": "Основи анімації", "p": ["У <b>Pose Mode</b> ставимо позу → <b>I</b> (Insert Keyframe) → створюється <b>ключовий кадр</b> на Timeline. Кілька ключів у різних кадрах — і Blender сам добудовує проміжні (<b>інтерполяція</b>). <b>IK (Inverse Kinematics)</b> — коли тягнеш за кисть, а вся рука підлаштовується."]}], "remember": "Рігінг — створення скелета для анімації. Армaтура (Shift+A → Armature) з кісток: Head, Body, Tail; батьківські й дочірні. Edit Mode — будуємо, Pose Mode — позуємо. Прив'язка: меш → Shift + арматура → Ctrl+P → With Automatic Weights; ваги правлять у Weight Paint. I — ключовий кадр.", "cards": [{"f": "Рігінг", "b": "Створення скелета для 3D-моделі, щоб її можна було анімувати."}, {"f": "Арматура", "b": "Об'єкт-скелет, що складається з кісток."}, {"f": "Частини кістки", "b": "Head (початок), Body, Tail (кінець)."}, {"f": "Режими арматури", "b": "Object, Edit (будувати кістки), Pose (позувати)."}, {"f": "Як прив'язати модель до скелета?", "b": "Виділити меш, потім із Shift арматуру, Ctrl+P → With Automatic Weights."}, {"f": "Ваги (weights)", "b": "Наскільки кожна вершина підпорядкована певній кістці; правлять у Weight Paint."}, {"f": "Суфікси .L і .R", "b": "Позначають ліві й праві кістки для симетрії."}, {"f": "Ключовий кадр", "b": "Збережена поза в певному кадрі; ставиться клавішею I."}, {"f": "IK (Inverse Kinematics)", "b": "Коли тягнеш за кисть чи стопу, а решта кінцівки підлаштовується."}], "quiz": [{"t": "choice", "q": "Рігінг — це…", "o": ["створення скелета для анімації", "розфарбовування моделі", "налаштування камери"], "a": 0, "e": "Скелет."}, {"t": "input", "q": "Як називається об'єкт-скелет у Blender?", "a": ["арматура", "armature"], "e": "Armature."}, {"t": "choice", "q": "У якому режимі будують кістки?", "o": ["Object Mode", "Edit Mode", "Pose Mode"], "a": 1, "e": "Edit Mode арматури."}, {"t": "choice", "q": "У якому режимі позують персонажа?", "o": ["Pose Mode", "Sculpt Mode", "Weight Paint"], "a": 0, "e": "Pose Mode."}, {"t": "choice", "q": "Який порядок виділення перед Ctrl+P?", "o": ["Спочатку арматура, потім меш", "Спочатку меш, потім арматура", "Порядок не важливий"], "a": 1, "e": "Батьком стає той, кого виділили останнім."}, {"t": "choice", "q": "Що таке ваги (weights)?", "o": ["Маса об'єкта", "Наскільки вершина слухається кістки", "Розмір файлу"], "a": 1, "e": "Вплив кістки."}, {"t": "choice", "q": "Який колір у Weight Paint означає найсильніший вплив?", "o": ["Синій", "Червоний", "Чорний"], "a": 1, "e": "Червоний — 1."}, {"t": "input", "q": "Яка клавіша ставить ключовий кадр?", "a": ["i"], "e": "I — Insert Keyframe."}, {"t": "choice", "q": "Що робить IK?", "o": ["Прискорює рендер", "Дозволяє тягнути за кисть, а рука підлаштовується", "Додає матеріал"], "a": 1, "e": "Inverse Kinematics."}]}, {"id": "bl-stsena-render", "sec": "Світло, камера, рендер", "title": "Розстановка об'єктів у сцені. Поняття рендеру. Рушії Blender", "goal": "Ти знаєш правила композиції сцени, що таке рендер і чим Eevee відрізняється від Cycles.", "learn": [{"h": "Розстановка об'єктів", "p": ["<b>Композиція</b>: головний об'єкт — у центрі уваги, решта — підтримує. Правило <b>третин</b>: важливе на перетині ліній, що ділять кадр на 3×3 (сітку вмикають у налаштуваннях камери: Composition Guides). Не ставити предмети рівно в ряд; групувати; лишати «повітря»; враховувати <b>плани</b> — передній, середній, задній. Уся сцена — у реальному масштабі, предмети стоять на підлозі (не провалюються й не висять)."]}, {"h": "Що таке рендер", "p": ["<span class='term'>Рендер</span> — обчислення фінального зображення сцени з урахуванням геометрії, матеріалів, світла й камери. Результат — картинка (<b>F12</b>) або відео (Ctrl+F12). <b>Рендер-рушій</b> — програма, яка це обчислює."]}, {"h": "Рушії Blender", "p": ["<b>Eevee</b> — швидкий рушій реального часу (як в іграх): рендер за секунди, але відображення тіней, відбиття й прозорості наближене; треба вмикати опції вручну. <b>Cycles</b> — <b>трасування променів</b> (ray tracing): рахує шлях кожного променя світла — фотореалістично, але повільно; є шум, який прибирають <b>Denoise</b> і збільшенням <b>Samples</b>. <b>Workbench</b> — технічний, для попереднього перегляду."]}, {"h": "Налаштування виводу", "p": ["Output Properties: <b>роздільна здатність</b> (1920×1080), <b>%</b> для чернетки, <b>частота кадрів</b> (24 fps), формат (<b>PNG</b> для картинки з прозорістю, <b>JPEG</b>, для відео — <b>FFmpeg</b>), шлях збереження. Render Properties: Samples, Denoise, тінь, відбиття."]}], "remember": "Композиція: правило третин, плани, головний об'єкт у фокусі. Рендер — обчислення фінального зображення (F12). Eevee — швидкий, наближений; Cycles — трасування променів, реалістичний, повільний, потрібні Samples і Denoise. Вивід: 1920×1080, 24 fps, PNG/JPEG/FFmpeg.", "cards": [{"f": "Рендер", "b": "Обчислення фінального зображення сцени зі світлом, матеріалами й камерою."}, {"f": "Клавіша рендеру кадру", "b": "F12."}, {"f": "Eevee", "b": "Швидкий рушій реального часу; менш точні тіні й відбиття."}, {"f": "Cycles", "b": "Рушій трасування променів: реалістичний, але повільний."}, {"f": "Samples", "b": "Кількість прорахунків на піксель: більше — менше шуму, довше рендер."}, {"f": "Denoise", "b": "Прибирання шуму з рендеру."}, {"f": "Правило третин", "b": "Кадр ділять на 3×3, важливе розміщують на лініях і перетинах."}, {"f": "Формат для картинки з прозорим фоном", "b": "PNG."}, {"f": "Стандартна частота кадрів", "b": "24 fps."}], "quiz": [{"t": "input", "q": "Яка клавіша запускає рендер кадру?", "a": ["f12"], "e": "F12."}, {"t": "choice", "q": "Який рушій швидший?", "o": ["Eevee", "Cycles"], "a": 0, "e": "Реального часу."}, {"t": "choice", "q": "Який рушій дає фотореалістичний результат?", "o": ["Eevee", "Cycles", "Workbench"], "a": 1, "e": "Трасування променів."}, {"t": "choice", "q": "Що зменшує шум на рендері в Cycles?", "o": ["Більше Samples і Denoise", "Менша роздільність", "Вимкнення світла"], "a": 0, "e": "Семпли й шумозаглушення."}, {"t": "choice", "q": "Правило третин — це…", "o": ["ділити кадр на 3×3 і ставити важливе на лініях", "робити три копії об'єкта", "три джерела світла"], "a": 0, "e": "Композиція."}, {"t": "choice", "q": "Який формат зберігає прозорий фон?", "o": ["JPEG", "PNG", "BMP"], "a": 1, "e": "PNG з альфа-каналом."}, {"t": "choice", "q": "Скільки кадрів на секунду стандартно для відео?", "o": ["12", "24", "100"], "a": 1, "e": "24 fps."}, {"t": "choice", "q": "Навіщо зменшувати % роздільності?", "o": ["Для швидкої чернетки", "Для кращої якості", "Для звуку"], "a": 0, "e": "Тестовий рендер."}, {"t": "choice", "q": "Що НЕ впливає на рендер?", "o": ["Матеріали", "Світло", "Назва файлу"], "a": 2, "e": "Назва не впливає."}]}, {"id": "bl-svitlo", "sec": "Світло, камера, рендер", "title": "Джерела освітлення в Blender. Триточкова схема. Виставляємо світло", "goal": "Ти знаєш типи ламп у Blender і вмієш поставити триточкове світло.", "learn": [{"h": "Типи джерел світла", "p": ["Shift+A → Light: <b>Point</b> — точкове, світить у всі боки (лампочка); <b>Sun</b> — сонце, паралельні промені, важливий лише напрямок, не відстань; <b>Spot</b> — прожектор, конус із регульованим кутом; <b>Area</b> — площинне, м'яке світло (вікно, софтбокс) — найкраще для предметної зйомки. Ще світлом може бути <b>World/HDRI</b> та будь-який об'єкт із матеріалом <b>Emission</b>."]}, {"h": "Параметри", "p": ["<b>Power</b> (Вт) — яскравість; <b>Color</b> — колір (теплий/холодний); <b>Size / Radius</b> — розмір джерела: чим більший, тим м'якші тіні; <b>Spread</b>, <b>Angle</b> у Sun — м'якість тіней. Далеке маленьке джерело дає різкі тіні, велике близьке — м'які."]}, {"h": "Триточкова схема", "p": ["Класика фото й кіно: <b>Key light</b> (головне) — найяскравіше, під кутом ~45° збоку спереду; <b>Fill light</b> (заповнювальне) — з іншого боку, слабше, підсвічує тіні; <b>Back / Rim light</b> (контрове) — позаду об'єкта, відділяє його від фону світлим контуром."], "note": "Плюс — <b>фон</b> можна підсвітити окремо. Так само освітлюють персонажа в мультфільмі."}, {"h": "Практичні поради", "p": ["Дивись результат у режимі <b>Rendered</b>. Не роби все однако // ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/,/g,".").replace(/[^a-z0-9а-яіїєґ' \-\/.:%°]/gi,"").replace(/\s*([\/.:%°-])\s*/g,"$1").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
