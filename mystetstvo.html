<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Мистецтво · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>

Синтетичні — поєднують кілька. Музика — звук, живопис — колір і лінія, танець — рух.", "cards": [{"f": "Мистецтво", "b": "Творче відображення світу в художніх образах."}, {"f": "Художній образ", "b": "Картина світу, думка чи почуття, виражені засобами мистецтва."}, {"f": "Види образотворчого мистецтва", "b": "Живопис, графіка, скульптура."}, {"f": "Синтетичні мистецтва", "b": "Поєднують кілька видів: театр, кіно, анімація, цирк."}, {"f": "Просторові / часові мистецтва", "b": "Живопис, скульптура, архітектура / музика, література."}, {"f": "Чим «говорить» музика?", "b": "Мелодією, ритмом, темпом, динамікою, тембром."}, {"f": "Чим «говорить» живопис?", "b": "Кольором, лінією, композицією, світлотінню."}, {"f": "Декоративно-ужиткове мистецтво", "b": "Художньо оздоблені речі для побуту: посуд, вишивка, іграшки."}], "quiz": [{"t": "choice", "q": "Мистецтво звуків — це…", "o": ["живопис", "музика", "скульптура"], "a": 1, "e": "Музика."}, {"t": "choice", "q": "Що НЕ належить до образотворчого мистецтва?", "o": ["Графіка", "Скульптура", "Музика"], "a": 2, "e": "Музика — окремий вид."}, {"t": "choice", "q": "Театр — мистецтво…", "o": ["синтетичне", "просторове", "часове"], "a": 0, "e": "Поєднує слово, музику, живопис, рух."}, {"t": "choice", "q": "Чим передає образ танець?", "o": ["Рухом і пластикою", "Кольором", "Словом"], "a": 0, "e": "Хореографія."}, {"t": "choice", "q": "Вишитий рушник — це мистецтво…", "o": ["декоративно-ужиткове", "архітектура", "графіка"], "a": 0, "e": "Прикрашена річ побуту."}, {"t": "choice", "q": "Яке мистецтво «просторове»?", "o": ["Музика", "Скульптура", "Література"], "a": 1, "e": "Існує в просторі."}, {"t": "input", "q": "Як називається картина світу або почуття, виражені засобами мистецтва? Художній …", "a": ["образ", "художній образ"], "e": "Художній образ."}, {"t": "choice", "q": "Як поводитись у театрі?", "o": ["Розмовляти по телефону", "Сидіти тихо, аплодувати наприкінці", "Виходити під час дії"], "a": 1, "e": "Повага до акторів."}, {"t": р, оркестр, диригент, композитор.", "cards": [{"f": "Мелодія", "b": "Головна музична думка твору."}, {"f": "Ритм", "b": "Чергування довгих і коротких звуків."}, {"f": "Темп: allegro / moderato / adagio", "b": "Швидко / помірно / повільно."}, {"f": "Динаміка: forte / piano", "b": "Гучно / тихо."}, {"f": "Мажор / мінор", "b": "Світлий, радісний лад / сумний, м'який лад."}, {"f": "Тембр", "b": "Забарвлення звуку, за яким розрізняємо голоси й інструменти."}, {"f": "Скільки нот і лінійок у нотному стані?", "b": "7 нот; 5 лінійок."}, {"f": "Сопрано / альт / тенор / бас", "b": "Високий жіночий / низький жіночий / високий чоловічий / низький чоловічий."}, {"f": "Хор / оркестр / диригент", "b": "Колектив співаків / колектив музикантів / керівник виконання."}, {"f": "A cappella", "b": "Спів без інструментального супроводу."}], "quiz": [{"t": "choice", "q": "«Душа» музичного твору, головна думка —", "o": ["ритм", "мелодія", "темп"], "a": 1, "e": "Мелодія."}, {"t": "choice", "q": "Allegro означає…", "o": ["повільно", "швидко", "тихо"], "a": 1, "e": "Швидкий темп."}, {"t": "choice", "q": "Forte означає…", "o": ["гучно", "тихо", "швидко"], "a": 0, "e": "Гучно; piano — тихо."}, {"t": "choice", "q": "Сумна, м'яка музика — це лад…", "o": ["мажор", "мінор"], "a": 1, "e": "Мінор."}, {"t": "choice", "q": "Забарвлення звуку, за яким ми впізнаємо скрипку чи флейту, —", "o": ["тембр", "ритм", "динаміка"], "a": 0, "e": "Тембр."}, {"t": "input", "q": "Скільки нот у музиці?", "a": ["7", "сім"], "e": "До ре мі фа соль ля сі."}, {"t": "input", "q": "Скільки лінійок у нотному стані?", "a": ["5", "п'ять"], "e": "П'ять."}, {"t": "choice", "q": "Найнижчий чоловічий голос —", "o": ["тенор", "баритон", "бас"], "a": 2, "e": "Бас."}, {"t": "choice", "q": "Найвищий жіночий голос —", "o": ["сопрано", "альт", "бас"], "a": 0, "e": "Сопрано."}, {"t": "choice", "q": "Хто керує оркестром?", "o": ["Композитор", "Диригент", "Соліст"], "a": 1, "e": "Диригент."}, {"t": "choice", "q": "Спів без інструментів називають…", "o": ["соло", "a cappella", "дует"], "a": 1, "e": "A cappella."}, {"t": "choice", "q": "Розмір вальсу —", "o": ["2/4", "3/4", "4/4"], "a": 1, "e": "Три чверті."}]}, {"id": "my-instrumenty-zhanry", "sec": "Мистецька азбука", "title": "Музичні інструменти. Оркестр. Жанри музики", "goal": "Ти знаєш групи інструментів, види оркестрів і музичні жанри.", "learn": [{"h": "Групи інструментів", "p": ["<b>Струнні смичкові</b>: скрипка, альт, віолончель, контрабас. <b>Струнні щипкові</b>: гітара, арфа, бандура, домра. <b>Духові дерев'яні</b>: флейта, кларнет, гобой, фагот; <b>духові мідні</b>: труба, валторна, тромбон, туба. <b>Ударні</b>: барабан, литаври, тарілки, бубон, ксилофон. <b>Клавішні</b>: фортепіано (рояль, піаніно), орган, клавесин, акордеон."]}, {"h": "Українські народні інструменти", "p": ["<b>Бандура</b> (символ України, кобзарі), <b>кобза</b>, <b>цимбали</b>, <b>сопілка</b>, <b>трембіта</b> (гуцульська, до 4 м), <b>бубон</b>, <b>ліра</b>, <b>дримба</b>, <b>скрипка</b>. Троїсті музики — скрипка, цимбали (або бас), бубон."]}, {"h": "Оркестри", "p": ["<b>Симфонічний</b> — усі групи (до 100 музикантів); <b>камерний</b> — малий; <b>духовий</b>; <b>народних інструментів</b>; <b>естрадний / джазовий</b>. Керує <b>диригент</b>."]}, {"h": "Жанри", "p": ["<b>Три «кити»</b>: <b>пісня</b> (мелодія + слова), <b>танець</b> (вальс, полька, гопак, козачок), <b>марш</b> (чіткий крок, 2/4 або 4/4). <b>Вокальна</b> музика — з голосом (пісня, романс, хор); <b>інструментальна</b> — без слів. Великі жанри: <b>опера</b> (вистава, де співають; арія, хор, увертюра), <b>балет</b> (танцювальна вистава), <b>симфонія</b> (великий твір для оркестру), <b>концерт</b> (соліст + оркестр), <b>сюїта</b>, <b>мюзикл</b>. <b>Програмна музика</b> — має назву-«програму» («Пори року»)."]}], "remember": "Групи: струнні (скрипка, гітара), духові дерев'яні (флейта) і мідні (труба), ударні (барабан), клавішні (фортепіано). Українські: бандура, цимбали, сопілка, трембіта. Симфонічний оркестр. Три кити: пісня, танець, марш. Опера — співають, балет — танцюють, симфонія — оркестр.", "cards": [{"f": "Струнні смичкові інструменти", "b": "Скрипка, альт, віолончель, контрабас."}, {"f": "Духові дерев'яні / мідні", "b": "Флейта, кларнет, гобой / труба, валторна, тромбон."}, {"f": "Ударні інструменти", "b": "Барабан, литаври, тарілки, бубон, ксилофон."}, {"f": "Бандура", "b": "Український народний струнний інструмент, символ України; грали кобзарі."}, {"f": "Трембіта", "b": "Гуцульська дерев'яна труба до 4 м довжиною."}, {"f": "Троїсті музики", "b": "Народний ансамбль: скрипка, цимбали (бас), бубон."}, {"f": "Три «кити» музики", "b": "Пісня, танець, марш."}, {"f": "Опера / балет / симфонія", "b": "Вистава зі співом / танцювальна вистава / великий твір для оркестру."}, {"f": "Вокальна / інструментальна музика", "b": "З голосом / без слів."}], "quiz": [{"t": "choice", "q": "Скрипка — інструмент…", "o": ["духовий", "струнний", "ударний"], "a": 1, "e": "Струнний смичковий."}, {"t": "choice", "q": "Флейта — інструмент…", "o": ["духовий", "струнний", "клавішний"], "a": 0, "e": "Духовий дерев'яний."}, {"t": "choice", "q": "Барабан — інструмент…", "o": ["ударний", "духовий", "струнний"], "a": 0, "e": "Ударний."}, {"t": "choice", "q": "Символ України серед інструментів —", "o": ["гітара", "бандура", "арфа"], "a": 1, "e": "Бандура."}, {"t": "choice", "q": "Трембіта — інструмент…", "o": ["гуцулів", "поліщуків", "степовиків"], "a": 0, "e": "Карпати."}, {"t": "choice", "q": "Хто такі троїсті музики?", "o": ["Три співаки", "Народний ансамбль зі скрипки, цимбалів і бубна", "Три диригенти"], "a": 1, "e": "Троїсті музики."}, {"t": "choice", "q": "Три «кити» музики —", "o": ["опера, балет, симфонія", "пісня, танець, марш", "мажор, мінор, ритм"], "a": 1, "e": "Первинні жанри."}, {"t": "choice", "q": "Вистава, де герої співають, —", "o": ["балет", "опера", "симфонія"], "a": 1, "e": "Опера."}, {"t": "choice", "q": "Вистава, де герої танцюють, —", "o": ["опера", "балет", "мюзикл"], "a": 1, "e": "Балет."}, {"t": "choice", "q": "Великий твір для оркестру —", "o": ["романс", "симфонія", "пісня"], "a": 1, "e": "Симфонія."}, {"t": "input", "q": "Як називається найбільший оркестр з усіма групами інструментів? … оркестр", "a": ["симфонічний", "симфонічний оркестр"], "e": "Симфонічний."}]}, {"id": "my-kolir-liniia", "sec": "Мистецька азбука", "title": "Образотворча азбука: колір, лінія, форма, композиція", "goal": "Ти знаєш основні й похідні кольори, теплі й холодні, і засади композиції.", "learn": [{"h": "Колір", "p": ["<b>Основні</b> кольори: <b>червоний, жовтий, синій</b> — їх не отримати змішуванням. <b>Похідні</b>: червоний + жовтий = <b>оранжевий</b>; жовтий + синій = <b>зелений</b>; синій + червоний = <b>фіолетовий</b>. <b>Теплі</b>: червоний, оранжевий, жовтий (вогонь, сонце). <b>Холодні</b>: синій, блакитний, фіолетовий, зелений (вода, лід). <b>Ахроматичні</b> (безбарвні): білий, чорний, сірий. <b>Колірне коло</b>. <b>Контраст</b> — протилежні кольори (червоний — зелений); <b>нюанс</b> — близькі відтінки. <b>Колорит</b> — загальне колірне враження картини."]}, {"h": "Лінія, пляма, форма", "p": ["<b>Лінія</b> — прямі, хвилясті, ламані; тонкі й товсті; передають рух і настрій. <b>Пляма</b>, <b>штрих</b>, <b>крапка</b> — засоби графіки. <b>Форма</b>: геометричні (коло, квадрат) і природні. <b>Об'єм</b> передають <b>світлотінню</b>: світло, тінь, півтінь, відблиск, падаюча тінь. <b>Силует</b> — обрис."]}, {"h": "Композиція", "p": ["<span class='term'>Композиція</span> — розташування елементів у творі. <b>Композиційний центр</b> — головне. <b>Симетрія</b> — дзеркальна однаковість (спокій); <b>асиметрія</b> — рух. <b>Ритм</b> у зображенні — повтор елементів (орнамент). <b>Статика</b> (спокій) і <b>динаміка</b> (рух). <b>Формат</b>: вертикальний, горизонтальний, квадратний. <b>Перспектива</b>: далекі предмети менші й блідіші; <b>лінія горизонту</b>; <b>плани</b> — передній, середній, задній."]}], "remember": "Основні: червоний, жовтий, синій. Похідні: оранжевий, зелений, фіолетовий. Теплі — червоний/жовтий/оранжевий; холодні — синій/блакитний/фіолетовий. Ахроматичні — білий, чорний, сірий. Композиція — розташування; центр, симетрія, ритм, статика/динаміка, перспектива, плани.", "cards": [{"f": "Основні кольори", "b": "Червоний, жовтий, синій."}, {"f": "Похідні кольори", "b": "Оранжевий (ч+ж), зелений (ж+с), фіолетовий (с+ч)."}, {"f": "Теплі / холодні кольори", "b": "Червоний, оранжевий, жовтий / синій, блакитний, фіолетовий."}, {"f": "Ахроматичні кольори", "b": "Білий, чорний, сірий."}, {"f": "Контраст / нюанс", "b": "Протилежні кольори / близькі відтінки."}, {"f": "Композиція", "b": "Розташування елементів у художньому творі."}, {"f": "Симетрія / асиметрія", "b": "Дзеркальна однаковість (спокій) / нерівність (рух)."}, {"f": "Світлотінь", "b": "Передача об'єму: світло, півтінь, тінь, відблиск, падаюча тінь."}, {"f": "Плани в картині", "b": "Передній, середній, задній; далеке — менше й блідіше."}], "quiz": [{"t": "choice", "q": "Який колір основний?", "o": ["Зелений", "Синій", "Оранжевий"], "a": 1, "e": "Червоний, жовтий, синій."}, {"t": "choice", "q": "Жовтий + синій =", "o": ["оранжевий", "зелений", "фіолетовий"], "a": 1, "e": "Зелений."}, {"t": "choice", "q": "Червоний + синій =", "o": ["фіолетовий", "зелений", "коричневий"], "a": 0, "e": "Фіолетовий."}, {"t": "choice", "q": "Який колір холодний?", "o": ["Червоний", "Блакитний", "Жовтий"], "a": 1, "e": "Блакитний."}, {"t": "choice", "q": "Білий, чорний, сірий — кольори…", "o": ["теплі", "холодні", "ахроматичні"], "a": 2, "e": "Безбарвні."}, {"t": "choice", "q": "Червоний і зелений — це…", "o": ["нюанс", "контраст", "нюанс і контраст"], "a": 1, "e": "Протилежні на колі."}, {"t": "input", "q": "Як називається розташування елементів у творі?", "a": ["композиція"], "e": "Композиція."}, {"t": "choice", "q": "Дзеркальна однаковість частин —", "o": ["симетрія", "асиметрія", "динаміка"], "a": 0, "e": "Симетрія."}, {"t": "choice", "q": "Далекі предмети на картині зображують…", "o": ["більшими й яскравішими", "меншими й блідішими", "такими ж"], "a": 1, "e": "Перспектива."}, {"t": "choice", "q": "Об'єм предмета на малюнку передає…", "o": ["світлотінь", "контур", "формат"], "a": 0, "e": "Світло і тінь."}, {"t": "choice", "q": "Повтор елементів у зображенні (орнамент) — це…", "o": ["ритм", "колорит", "силует"], "a": 0, "e": "Ритм у живописі."}]}, {"id": "my-vydy-zhanry-obrazotvorche", "sec": "Мистецька азбука", "title": "Живопис, графіка, скульптура, архітектура. Жанри", "goal": "Ти розрізняєш види образотворчого мистецтва, їх матеріали й жанри.", "learn": [{"h": "Види", "p": ["<b>Живопис</b> — фарбами на площині: <b>олія</b>, <b>акварель</b> (прозора, водою), <b>гуаш</b> (щільна), <b>темпера</b>, <b>акрил</b>; <b>фреска</b> (по сирій штукатурці), <b>мозаїка</b> (з камінців, смальти), <b>вітраж</b> (кольорове скло). <b>Графіка</b> — лінія, штрих, пляма; олівець, туш, вугіль, пастель; <b>гравюра</b> (відбиток); <b>плакат</b>, <b>ілюстрація</b>, <b>карикатура</b>. <b>Скульптура</b> — об'ємні твори: <b>кругла</b> (статуя, бюст) і <b>рельєф</b>; матеріали — глина, гіпс, камінь (мармур), бронза, дерево. <b>Архітектура</b> — мистецтво будувати: житлова, громадська, храмова; Софія Київська, замки, сучасні хмарочоси."]}, {"h": "Жанри живопису", "p": ["<b>Портрет</b> — зображення людини (автопортрет — самого себе). <b>Пейзаж</b> — природа (морський — марина, міський). <b>Натюрморт</b> — «мертва натура»: речі, квіти, плоди. <b>Анімалістичний</b> — тварини. <b>Побутовий</b> — сцени життя. <b>Історичний</b>, <b>батальний</b> (битви), <b>казковий (міфологічний)</b>."]}, {"h": "Що робить художник", "p": ["<b>Ескіз</b> — попередній начерк; <b>етюд</b> — з натури; <b>палітра</b> — дошка для змішування фарб; <b>мольберт</b> — підставка; <b>полотно</b>; <b>репродукція</b> — копія картини в друку. <b>Дизайн</b> — художнє проєктування речей."]}], "remember": "Живопис — фарби (олія, акварель, гуаш; фреска, мозаїка, вітраж). Графіка — лінія, олівець, туш, гравюра. Скульптура — об'єм (кругла, рельєф; глина, мармур, бронза). Архітектура — будівлі. Жанри: портрет, пейзаж, натюрморт, анімалістичний, побутовий, історичний, батальний.", "cards": [{"f": "Живопис", "b": "Мистецтво фарб на площині: олія, акварель, гуаш."}, {"f": "Графіка", "b": "Мистецтво лінії, штриха, плями: олівець, туш, гравюра."}, {"f": "Скульптура", "b": "Об'ємні твори: кругла (статуя, бюст) і рельєф."}, {"f": "Фреска / мозаїка / вітраж", "b": "Живопис по сирій штукатурці / зображення з камінців / з кольорового скла."}, {"f": "Портрет / пейзаж / натюрморт", "b": "Людина / природа / речі, квіти, плоди."}, {"f": "Анімалістичний жанр", "b": "Зображення тварин."}, {"f": "Батальний жанр", "b": "Зображення битв."}, {"f": "Автопортрет", "b": "Художник малює сам себе."}, {"f": "Палітра / мольберт / ескіз", "b": "Дошка для фарб / підставка для полотна / попередній начерк."}], "quiz": [{"t": "choice", "q": "Малюнок олівцем — це…", "o": ["живопис", "графіка", "скульптура"], "a": 1, "e": "Графіка."}, {"t": "choice", "q": "Статуя з мармуру — це…", "o": ["живопис", "скульптура", "архітектура"], "a": 1, "e": "Об'ємний твір."}, {"t": "choice", "q": "Картина з кольорового скла у вікні —", "o": ["мозаїка", "вітраж", "фреска"], "a": 1, "e": "Вітраж."}, {"t": "choice", "q": "Зображення з дрібних камінців —", "o": ["мозаїка", "гравюра", "акварель"], "a": 0, "e": "Мозаїка — як у Софії Київській."}, {"t": "choice", "q": "Картина з фруктами й вазою — жанр…", "o": ["пейзаж", "натюрморт", "портрет"], "a": 1, "e": "Натюрморт."}, {"t": "choice", "q": "Картина з морем і кораблями —", "o": ["марина (пейзаж)", "натюрморт", "портрет"], "a": 0, "e": "Морський пейзаж."}, {"t": "choice", "q": "Картина битви — жанр…", "o": ["побутовий", "батальний", "анімалістичний"], "a": 1, "e": "Батальний."}, {"t": "input", "q": "Як називається зображення самого себе художником?", "a": ["автопортрет"], "e": "Автопортрет."}, {"t": "choice", "q": "Дошка, на якій змішують фарби, —", "o": ["мольберт", "палітра", "полотно"], "a": 1, "e": "Палітра."}, {"t": "choice", "q": "Акварель — фарба…", "o": ["прозора, на воді", "щільна олійна", "для скла"], "a": 0, "e": "Аква — вода."}, {"t": "choice", "q": "Софійський собор — твір…", "o": ["архітектури", "графіки", "живопису"], "a": 0, "e": "Архітектура (а всередині мозаїки й фрески)."}]}, {"id": "my-narodne", "sec": "Народне мистецтво", "title": "Народне декоративне мистецтво України. Обереги й символи", "goal": "Ти знаєш головні види українського народного мистецтва, їх осередки й символи.", "learn": [{"h": "Види", "p": ["<b>Петриківський розпис</b> (Дніпропетровщина) — квіти, «цибульки», ягоди, птахи; пензлик з котячої шерсті; у ЮНЕСКО. <b>Косівська кераміка</b> (Гуцульщина) — зелено-жовто-коричнева, у ЮНЕСКО. <b>Опішнянська кераміка</b> (Полтавщина) — глечики, барині, леви. <b>Писанкарство</b> — воскова техніка; <b>крашанка</b> (одноколірна), <b>крапанка</b>, <b>дряпанка</b>, <b>мальованка</b>. <b>Вишивка</b> — хрестиком, гладдю; вишиванка, рушник. <b>Ткацтво</b>, <b>килимарство</b>, <b>лозоплетіння</b>, <b>різьблення по дереву</b>, <b>витинанка</b> (ажурне вирізання з паперу), <b>лялька-мотанка</b> (без обличчя, без голки), <b>гутне скло</b>, <b>ковальство</b>, <b>яворівська іграшка</b>."]}, {"h": "Символи й обереги", "p": ["<b>Рушник</b> — оберіг дому; <b>дерево життя</b>, <b>берегиня</b>, <b>сонце</b>, <b>зірки</b>, <b>ромб</b> — поле, <b>хвиля</b> — вода; <b>калина</b> — краса, рід; <b>дуб</b> — сила; <b>соняшник</b>; <b>червоний</b> — любов, життя, <b>чорний</b> — земля, сум. <b>Орнамент</b> — візерунок із повторюваних елементів: геометричний, рослинний, зооморфний. <b>Символ</b> — знак зі значенням. <b>Стилізація</b> — спрощення форми до узору."]}, {"h": "Народні майстри", "p": ["<b>Марія Примаченко</b> — фантастичні звірі, наївне мистецтво (Полісся). <b>Катерина Білокур</b> — квіти олією, самоучка (Полтавщина). <b>Тетяна Пата</b>, <b>Надія Білокінь</b> — петриківка. <b>Іван Гончар</b> — етнограф, музей. Народне мистецтво — <b>фольклорне</b> (анонімне, традиційне), <b>професійне</b> — має автора й освіту."]}], "remember": "Петриківський розпис і косівська кераміка — ЮНЕСКО. Опішня — кераміка. Писанка (воскова), крашанка, дряпанка. Вишивка, рушник, витинанка, мотанка. Символи: дерево життя, ромб — поле, хвиля — вода, калина — рід, дуб — сила. Примаченко — фантастичні звірі, Білокур — квіти.", "cards": [{"f": "Петриківський розпис", "b": "Дніпропетровщина; квіти, ягоди, птахи; пензлик з котячої шерсті; ЮНЕСКО."}, {"f": "Косівська кераміка", "b": "Гуцульщина; зелено-жовто-коричнева; ЮНЕСКО."}, {"f": "Опішня", "b": "Осередок кераміки на Полтавщині."}, {"f": "Писанка / крашанка / дряпанка", "b": "Розпис воском / одноколірна / вишкрябаний узор."}, {"f": "Витинанка", "b": "Ажурне вирізання з паперу."}, {"f": "Лялька-мотанка", "b": "Народна лялька-оберіг без обличчя, без голки."}, {"f": "Орнамент", "b": "Візерунок із повторюваних елементів: геометричний, рослинний, зооморфний."}, {"f": "Символи: ромб / хвиля / калина / дуб", "b": "Поле / вода / рід, краса / сила."}, {"f": "Марія Примаченко", "b": "Народна художниця; фантастичні звірі, наївне мистецтво."}, {"f": "Катерина Білокур", "b": "Народна художниця-самоучка; квіти."}], "quiz": [{"t": "choice", "q": "Петриківський розпис походить із…", "o": ["Дніпропетровщини", "Гуцульщини", "Полісся"], "a": 0, "e": "Село Петриківка."}, {"t": "choice", "q": "Косівська кераміка — з…", "o": ["Полтавщини", "Гуцульщини", "Слобожанщини"], "a": 1, "e": "Косів, Карпати."}, {"t": "choice", "q": "Яйце, розписане воском кількома кольорами, —", "o": ["крашанка", "писанка", "дряпанка"], "a": 1, "e": "Писанка."}, {"t": "choice", "q": "Одноколірне пофарбоване яйце —", "o": ["писанка", "крашанка", "мальованка"], "a": 1, "e": "Крашанка."}, {"t": "choice", "q": "Витинанка — це…", "o": ["вирізання з паперу", "плетіння з лози", "розпис по дереву"], "a": 0, "e": "Ажурне вирізання."}, {"t": "choice", "q": "Лялька-мотанка не має…", "o": ["рук", "обличчя", "сукні"], "a": 1, "e": "Без обличчя і без голки."}, {"t": "choice", "q": "Ромб у народному орнаменті означає…", "o": ["воду", "поле, землю", "сонце"], "a": 1, "e": "Засіяне поле."}, {"t": "choice", "q": "Хто малював фантастичних звірів?", "o": ["Катерина Білокур", "Марія Примаченко", "Тарас Шевченко"], "a": 1, "e": "Примаченко."}, {"t": "choice", "q": "Хто малював квіти, самоучка з Полтавщини?", "o": ["Марія Примаченко", "Катерина Білокур", "Тетяна Пата"], "a": 1, "e": "Білокур."}, {"t": "input", "q": "Як називається візерунок із повторюваних елементів?", "a": ["орнамент"], "e": "Орнамент."}, {"t": "choice", "q": "Чим малюють петриківський розпис?", "o": ["Пензликом з котячої шерсті", "Пір'ям", "Ножем"], "a": 0, "e": "«Кошачка»."}]}, {"id": "my-obriady-tanets", "sec": "Народне мистецтво", "title": "Народні обряди в мистецтві. Пісня і танець", "goal": "Ти знаєш народні обрядові пісні, українські танці та їх особливості.", "learn": [{"h": "Календарно-обрядові пісні", "p": ["<b>Колядки</b> (Різдво) і <b>щедрівки</b> (Щедрий вечір) — «Щедрик» Леонтовича, «Нова радість стала». <b>Веснянки, гаївки</b> — хороводи (Подоляночка, Кривий танець). <b>Купальські</b> — Івана Купала (вінки, вогнище). <b>Жниварські</b> — обжинки. <b>Родинно-обрядові</b>: колискові, весільні, хрестильні. <b>Вертеп</b> — народний різдвяний театр (ляльковий або живий). <b>Колискова</b> — тиха, повільна, мінор/мажор, гойдання ритму («Ой ходить сон коло вікон»)."]}, {"h": "Українські народні танці", "p": ["<b>Гопак</b> — швидкий, чоловічі стрибки й присядки; <b>козачок</b>; <b>метелиця</b> — швидкий, зимовий; <b>аркан</b> — гуцульський чоловічий танець по колу з топірцями; <b>коломийка</b> — гуцульська пісня-танець; <b>полька</b>; хороводи. Ансамбль <b>Павла Вірського</b> — світова слава українського танцю."]}, {"h": "Танець у мистецтві", "p": ["<b>Хореографія</b> — мистецтво танцю; <b>балетмейстер</b> — постановник. <b>Народний</b>, <b>класичний (балет)</b>, <b>бальний</b> (вальс, танго), <b>сучасний</b> (хіп-хоп, брейк). <b>Балет</b>: <b>пуанти</b>, <b>пачка</b>, <b>па</b>, <b>пантоміма</b>. Відомі балети: «Лускунчик», «Лебедине озеро» Чайковського, «Лісова пісня» Скорульського (за Лесею Українкою)."]}], "remember": "Колядки — Різдво, щедрівки — Щедрий вечір, веснянки — весна, купальські — Івана Купала, жниварські — обжинки. Вертеп — різдвяний театр. Танці: гопак (стрибки, присядки), козачок, метелиця, аркан (гуцули, по колу), коломийка. Вірський. Балет — пуанти, пачка; «Лускунчик».", "cards": [{"f": "Колядки / щедрівки", "b": "Різдвяні пісні / пісні Щедрого вечора («Щедрик»)."}, {"f": "Веснянки, гаївки", "b": "Весняні пісні-хороводи: Подоляночка, Кривий танець."}, {"f": "Купальські / жниварські пісні", "b": "На Івана Купала / на обжинки."}, {"f": "Вертеп", "b": "Народний різдвяний театр, ляльковий або живий."}, {"f": "Колискова", "b": "Тиха повільна пісня для дитини з гойданням ритму."}, {"f": "Гопак", "b": "Швидкий український танець зі стрибками й присядками."}, {"f": "Аркан", "b": "Гуцульський чоловічий танець по колу з топірцями."}, {"f": "Павло Вірський", "b": "Засновник ансамблю народного танцю України."}, {"f": "Хореографія / балетмейстер", "b": "Мистецтво танцю / постановник танців."}, {"f": "Пуанти / пачка", "b": "Балетне взуття на носках / коротка балетна спідниця."}], "quiz": [{"t": "choice", "q": "Пісні, які співають на Різдво, —", "o": ["веснянки", "колядки", "купальські"], "a": 1, "e": "Колядки."}, {"t": "choice", "q": "«Подоляночка» — це…", "o": ["колядка", "веснянка", "колискова"], "a": 1, "e": "Весняний хоровод."}, {"t": "choice", "q": "Вертеп — це…", "o": ["народний різдвяний театр", "весняний танець", "музичний інструмент"], "a": 0, "e": "Різдвяна вистава."}, {"t": "choice", "q": "Швидкий танець зі стрибками й присядками —", "o": ["полька", "гопак", "вальс"], "a": 1, "e": "Гопак."}, {"t": "choice", "q": "Аркан танцюють…", "o": ["гуцули", "поліщуки", "слобожани"], "a": 0, "e": "Карпати."}, {"t": "choice", "q": "Хто заснував ансамбль народного танцю України?", "o" const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;

  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");

    h += `</div>`;
  });

function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){

  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;

  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);

}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/,/g,".").replace(/[^a-z0-9а-яіїєґ' \-\/.:%°]/gi,"").replace(/\s*([\/.:%°-])\s*/g,"$1").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
