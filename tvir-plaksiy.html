<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Цар Плаксій та Лоскотон — розбір твору</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#131A24; --card:#1C2532;
  --ink:#EEF1F5; --dim:#93A3B5;
  --tear:#6FA8D6; --joy:#F2C14E; --rose:#E0756E;
  --line:rgba(238,241,245,.14);
  --ok:#6FC49A; --no:#E0756E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{padding:0 0 40px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.scr{display:none}.scr.on{display:block}

.hero{position:relative;padding:26px 16px 22px;overflow:hidden;
  background:linear-gradient(120deg,#1B2A3A 0%,var(--bg) 58%,#2A2418 100%)}
.drops{position:absolute;inset:0;pointer-events:none}
.drops i{position:absolute;width:7px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:rgba(111,168,214,.28);transform:rotate(180deg)}
.sun{position:absolute;top:20px;right:18px;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 42% 40%,rgba(242,193,78,.34),transparent 68%);filter:blur(3px)}
.hero h1{margin:0;font-size:29px;line-height:1.1;letter-spacing:-.4px;max-width:80%}
.hero .by{margin:8px 0 0;color:var(--dim);font-size:14px}
.hero .meta{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}
.bar{margin-top:16px;height:5px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tear),var(--joy));transition:width .5s}
.barlab{margin-top:7px;font-size:12px;color:var(--dim)}

.gh{margin:26px 0 10px;font-size:12px;color:var(--dim);letter-spacing:.5px}
.mod{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;color:var(--ink);font-size:15px;cursor:pointer}
.mod:active{transform:scale(.985)}
.mod .ic{font-size:22px;width:28px;text-align:center;flex:none}
.mod b{display:block;font-weight:600}
.mod small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.mod .dot{margin-left:auto;flex:none;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15)}
.mod.done .dot{background:var(--ok)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{background:none;border:none;color:var(--tear);font-size:15px;padding:4px 0;cursor:pointer}
.top h2{margin:0;font-size:16px;flex:1}
#t-body{padding:16px}

.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.blk h3{margin:0 0 8px;font-size:17px;color:var(--joy)}
.blk p{margin:0 0 9px}.blk p:last-child{margin-bottom:0}
.blk ul{margin:6px 0 0;padding-left:19px}.blk li{margin-bottom:5px}
.lead{color:var(--dim);font-size:14px;margin:0 0 14px}
.q{border-left:3px solid var(--tear);padding:2px 0 2px 12px;margin:10px 0;
  font-family:Georgia,serif;font-style:italic;white-space:pre-line}
.note{background:rgba(242,193,78,.11);border:1px solid rgba(242,193,78,.3);
  border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:10px}

.facts{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{background:var(--card);padding:11px 14px;display:flex;gap:12px}
.facts span{color:var(--dim);font-size:13px;flex:none;width:104px;padding-top:1px}
.facts b{font-weight:600;font-size:14.5px}

.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--tear),var(--joy))}
.tl div{position:relative;margin-bottom:15px}
.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;
  border-radius:50%;background:var(--joy);box-shadow:0 0 0 3px var(--bg)}
.tl b{color:var(--joy);font-size:13px;display:block}

.ch{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}
.ch>button{width:100%;display:flex;gap:11px;align-items:center;background:none;border:none;
  color:var(--ink);padding:12px 14px;text-align:left;font-size:14.5px;cursor:pointer;font-family:inherit}
.ch .n{font-family:Georgia,serif;color:var(--tear);font-size:18px;width:26px;flex:none}
.ch .body{display:none;padding:0 14px 14px;font-size:14.5px}
.ch.open .body{display:block}
.ch .body .key{margin-top:9px;color:var(--ok);font-size:13.5px}

.per{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.per h4{margin:0;font-size:16px;font-family:Georgia,serif}
.per .role{color:var(--dim);font-size:12.5px;margin:2px 0 8px}
.per .tr{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.per .tr i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:20px;
  background:rgba(111,168,214,.16);color:var(--tear)}
.per .said{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--joy)}

.btn{background:var(--tear);color:#0F1720;border:none;border-radius:11px;padding:12px 18px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.g{background:rgba(255,255,255,.09);color:var(--ink);font-weight:600}
.btn:active{opacity:.85}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;
  font-size:15px;cursor:pointer;font-family:inherit}
.opt.ok{border-color:var(--ok);background:rgba(111,196,154,.15)}
.opt.no{border-color:var(--no);background:rgba(224,117,110,.13)}
.opt:disabled{opacity:.75}
.say{margin:10px 0;padding:10px 12px;border-radius:11px;font-size:14.5px;display:none}
.say.on{display:block}
.say.y{background:rgba(111,196,154,.15);border:1px solid var(--ok)}
.say.n{background:rgba(224,117,110,.13);border:1px solid var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.used{opacity:.3;pointer-events:none}
.chip.ok{border-color:var(--ok)}.chip.no{border-color:var(--no)}
.slot{min-height:44px;border:1px dashed var(--line);border-radius:11px;padding:8px;
  margin:10px 0;font-size:14px;color:var(--dim)}
.prog{font-size:13px;color:var(--dim);margin-bottom:10px}
.rhy{font-family:Georgia,serif;font-size:15.5px;line-height:1.7;margin-bottom:8px;white-space:pre-line}
.rhy b{color:var(--joy);font-style:italic}

.sp{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.sp b{display:block;font-size:15px;margin-bottom:8px}
.sp .ans{display:none;font-size:14.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.sp.open .ans{display:block}
.sp button{background:rgba(255,255,255,.08);border:none;color:var(--tear);
  border-radius:9px;padding:8px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}

.lvl{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
  color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}
.lvl .ic{font-size:24px}
.lvl b{display:block;font-size:15px}
.lvl small{color:var(--dim);font-size:12.5px}
.lvl .sc{margin-left:auto;color:var(--joy);font-size:13px;font-family:Georgia,serif}
.res{text-align:center;padding:20px 0}
.res .big{font-size:46px;font-family:Georgia,serif;color:var(--joy)}
.res .st{font-size:26px;letter-spacing:4px;margin:6px 0 12px}
.wrongs{text-align:left;margin-top:18px}
.wrongs .w{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:9px;font-size:14px}
.wrongs .w em{color:var(--no);font-style:normal}
.wrongs .w s{color:var(--dim)}
</style>
</head>
<body>

<div id="s-home" class="scr on">
  <div class="hero">
    <div class="sun"></div>
    <div class="drops">
      <i style="top:34px;left:22px"></i><i style="top:66px;left:52px"></i>
      <i style="top:22px;left:88px"></i><i style="top:92px;left:16px"></i>
    </div>
    <h1>Цар Плаксій<br>та Лоскотон</h1>
    <p class="by">Василь Симоненко · віршована казка</p>
    <div class="meta">
      <span class="tag">літературна казка</span>
      <span class="tag">віршована</span>
      <span class="tag">сатира</span>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="barlab" id="plab">Пройдено 0 з 13</div>
  </div>
  <div class="wrap" id="menu"></div>
</div>

<div id="s-tool" class="scr">
  <div class="top">
    <button class="back" onclick="home()">‹ Назад</button>
    <h2 id="t-title"></h2>
  </div>
  <div class="wrap"><div id="t-body"></div></div>
</div>

<script>
/* ============ ядро ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
let TIMERS=[];
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id}
function stopAll(){TIMERS.forEach(clearInterval);TIMERS=[]}
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG){TG.ready();TG.expand();try{TG.setHeaderColor('#131A24')}catch(e){}}

const KEY='plaksiy-tvir-v1';
let PR={done:{},best:{}};
function load(cb){
  try{const l=localStorage.getItem(KEY);if(l)PR=Object.assign(PR,JSON.parse(l))}catch(e){}
  if(TG&&TG.CloudStorage){
    TG.CloudStorage.getItem(KEY,(err,val)=>{
      if(!err&&val){try{PR=Object.assign(PR,JSON.parse(val))}catch(e){}}
      cb();
    });
  } else cb();
}
function save(){
  const s=JSON.stringify(PR);
  try{localStorage.setItem(KEY,s)}catch(e){}
  if(TG&&TG.CloudStorage){try{TG.CloudStorage.setItem(KEY,s)}catch(e){}}
}
function mark(k){if(!PR.done[k]){PR.done[k]=1;save()}paint()}
function buzz(t){try{TG.HapticFeedback.notificationOccurred(t)}catch(e){}}
function say(sel,txt,ok){const e=$(sel);if(!e)return;e.className='say on '+(ok?'y':'n');e.innerHTML=txt}
function hide(sel){const e=$(sel);if(e)e.className='say'}

const GROUPS=['Про твір','Розібратися','Перевірити себе'];
const M={},ORDER=[];
function T(k,o){M[k]=o;ORDER.push(k)}

function paint(){
  $('#menu').innerHTML=GROUPS.map((g,gi)=>{
    const items=ORDER.filter(k=>M[k].g===gi).map(k=>{
      const m=M[k];
      return `<button class="mod ${PR.done[k]?'done':''}" onclick="open_('${k}')">
        <span class="ic">${m.ic}</span>
        <span><b>${m.t}</b><small>${m.s}</small></span>
        <span class="dot"></span></button>`;
    }).join('');
    return `<div class="gh">${g}</div>${items}`;
  }).join('');
  const n=ORDER.filter(k=>PR.done[k]).length;
  $('#pbar').style.width=Math.round(n/ORDER.length*100)+'%';
  $('#plab').textContent=`Пройдено ${n} з ${ORDER.length}`;
}
function open_(k){
  stopAll();
  const m=M[k];
  $('#t-title').textContent=m.t;
  $('#t-body').innerHTML=m.html;
  $('#s-home').classList.remove('on');
  $('#s-tool').classList.add('on');
  window.scrollTo(0,0);
  if(m.init)m.init();
  if(TG&&TG.BackButton){TG.BackButton.show();TG.BackButton.onClick(home)}
}
function home(){
  stopAll();
  $('#s-tool').classList.remove('on');
  $('#s-home').classList.add('on');
  window.scrollTo(0,0);
  if(TG&&TG.BackButton)TG.BackButton.hide();
  paint();
}
function done(k){mark(k);home()}
function fin(k){return `<button class="btn" style="width:100%;margin-top:6px" onclick="done('${k}')">Готово, зрозумів</button>`}
function toggle(el){el.parentNode.classList.toggle('open')}

/* ================= 1. ПАСПОРТ ================= */
T('passport',{g:0,ic:'📋',t:'Паспорт твору',s:'Те, що просять назвати першим',html:`
<p class="lead">Відповіді, з яких починається будь-яка усна відповідь на уроці.</p>
<div class="facts">
  <div><span>Автор</span><b>Василь Андрійович Симоненко</b></div>
  <div><span>Роки життя</span><b>1935–1963</b></div>
  <div><span>Назва</span><b>«Цар Плаксій та Лоскотон»</b></div>
  <div><span>Жанр</span><b>літературна казка, віршована</b></div>
  <div><span>Кому написано</span><b>синові письменника Лесикові</b></div>
  <div><span>Будова</span><b>шість частин із власними назвами</b></div>
  <div><span>Місце дії</span><b>країна Сльозолий, столиця Плаксоград</b></div>
  <div><span>Тема</span><b>боротьба доброго дядька Лоскотона проти царя Плаксія, який заборонив у своїй країні сміх і пив дитячі сльози</b></div>
  <div><span>Головна думка</span><b>сміх, доброта й людська згуртованість сильніші за будь-яку злу владу — а тримається вона рівно доти, доки люди бояться сміятися</b></div>
  <div><span>Головні герої</span><b>цар Плаксій, дядько Лоскотон, капітан Макака</b></div>
  <div><span>Головні засоби</span><b>промовисті імена, гумор і сатира, гіпербола, порівняння</b></div>
  <div><span>Ще одна казка автора</span><b>«Подорож у Країну Навпаки»</b></div>
</div>
<div class="note"><b>Корисно знати наперед.</b> Підручник вводить тут два слова: <b>оптиміст</b> — людина, яка вірить у свої сили й сподівається на хороше, і <b>песиміст</b> — та, що не вірить і нічого доброго не чекає. Плаксій і Лоскотон — це вони й є.</div>
${fin('passport')}`});

/* ================= 2. АВТОР ================= */
T('author',{g:0,ic:'👤',t:'Автор',s:'Поет, який писав казки синові',html:`
<p class="lead">Василь Симоненко прожив лише двадцять вісім років, але в українській літературі його знають як тонкого лірика й дуже світлу людину.</p>

<div class="blk"><h3>Полтавщина</h3>
<p>Народився 1935 року в селі Біївці на Полтавщині. Дитинство і юність припали на роки війни й повоєнного лихоліття. Ріс без батька — його замінив хлопцеві дід Федір, який майстерно співав пісні про сиву давнину. Мама працювала вчителькою й, за словами самого поета, навчила його жити по совісті.</p></div>

<div class="blk"><h3>Дев’ять кілометрів до школи</h3>
<p>П’ять класів Василь провчився в рідному селі, а далі школа була аж за дев’ять кілометрів. Узимку він долав цей шлях по глибочезних снігах — і казав друзям, що дороги не боїться, бо використовує її з користю: доки дійде, або всі уроки повторить, або всі пісні переспіває. Одного дня в несусвітню завію, коли учні із сусідніх сіл не прийшли зовсім, він до школи таки дійшов.</p>
<div class="note">Учителі згадують, що він майже не вчив уроків удома — усе ловив на льоту. Школу закінчив із золотою медаллю, а в шкільному журналі майже самі п’ятірки.</div></div>

<div class="blk"><h3>Одна двійка</h3>
<p>Серед тих п’ятірок є одна двійка. Учителька дала написати твір на тему «Моє щасливе дитинство». Робота Василя мала один рядок: «У мене щасливого дитинства не було…»</p></div>

<div class="blk"><h3>Поет</h3>
<p>Вірші почав писати ще в середніх класах і дуже багато читав. Стара вчителька хвалила його словами, що він за духом рідний синочок Тараса Шевченка. Після школи навчався на факультеті журналістики Київського університету імені Тараса Шевченка. У віршах відверто висловлював синівську любов до України.</p></div>

<div class="blk"><h3>Казки для сина</h3>
<p>Для свого єдиного сина Лесика Симоненко написав дві віршовані казки — «Цар Плаксій та Лоскотон» і «Подорож у Країну Навпаки». Тобто ця історія теж народилася вдома, для однієї конкретної дитини.</p></div>
${fin('author')}`});

/* ================= 3. ІСТОРІЯ ================= */
T('history',{g:0,ic:'📜',t:'Як побудована казка',s:'Шість частин і віршована мова',html:`
<p class="lead">Ця казка написана віршами, тому в ній є те, чого немає в прозі: рядки, рими, ритм і поділ на строфи.</p>

<div class="blk"><h3>Шість частин</h3>
<p>Автор сам поділив казку й дав кожній частині назву: «Цареве сімейство», «Дядько Лоскотон», «Арешт Лоскотона», «Весілля в палаці», «Звільнення Лоскотона», «Продовження весілля». За цими назвами зручно переказувати весь твір.</p></div>

<div class="blk"><h3>Чим віршована мова відрізняється від прозової</h3>
<ul>
<li>Текст поділено на <b>віршові рядки</b>, а не на речення в суцільному тексті.</li>
<li>Рядки об’єднані в <b>строфи</b> — групи, пов’язані змістом і римуванням.</li>
<li>Є <b>ритм</b> — рівномірне чергування наголошених і ненаголошених складів.</li>
<li>Є <b>рима</b> — співзвуччя закінчень рядків: Плаксій — Сльозолий, бочка — дочки, Лоскотон — трон.</li>
</ul>
<div class="note">Саме через риму цю казку так легко вчити напам’ять: наступне слово ніби саме підказується.</div></div>

<div class="blk"><h3>Куди веде остання строфа</h3>
<p>Наприкінці автор жартома пояснює маршрут у цю країну: спершу прямо, потім вправо, тоді поміж дубами наліво, а далі чимчикуй куди попало — як від утоми не впадеш, то й потрапиш. Це кінцівка-жарт, дуже схожа на народні казкові кінцівки.</p></div>
${fin('history')}`});

/* ================= 4. СЮЖЕТ ================= */

const COMP=[
 ['У країні Сльозолий царює Плаксій і забороняє сміх','експозиція'],
 ['З’являється дядько Лоскотон, який приносить дітям сміх','зав’язка'],
 ['Полювання на Лоскотона, зрада Макаки, арешт і весілля','розвиток дії'],
 ['Лоскотон лоскоче царя, і той помирає від сміху','кульмінація'],
 ['Царська родина розбігається, а Лоскотон живе й понині','розв’язка']
];
const CNAMES=['експозиція','зав’язка','розвиток дії','кульмінація','розв’язка'];
function buildComp(){
  const box=$('#comp');if(!box)return;
  box.innerHTML=COMP.map((c,i)=>`<div style="margin:12px 0 16px">
    <div style="font-size:14.5px;margin-bottom:7px">${c[0]}</div>
    <div class="row" id="cr${i}">${CNAMES.map(n=>
      `<button class="chip" onclick="pickComp(${i},'${n}',this)">${n}</button>`).join('')}</div></div>`).join('');
}
function pickComp(i,n,el){
  const ok=COMP[i][1]===n;
  $$('#cr'+i+' .chip').forEach(b=>b.disabled=true);
  el.classList.add(ok?'ok':'no');
  if(!ok){$$('#cr'+i+' .chip').forEach(b=>{if(b.textContent===COMP[i][1])b.classList.add('ok')})}
  buzz(ok?'success':'error');
  if($$('#comp .chip.ok').length>=5)
    say('#cs','Зверни увагу: звільнення з в’язниці — ще не кульмінація. Головне стається на троні.',true);
}

T('legacy',{g:1,ic:'🌍',t:'Слід у культурі',s:'Казка, написана для одного хлопчика',html:`
<div class="blk"><h3>Для сина</h3>
<p>Обидві віршовані казки Симоненка — «Цар Плаксій та Лоскотон» і «Подорож у Країну Навпаки» — написані для його єдиного сина Лесика. Тобто читач, для якого все це складалося, був один.</p></div>

<div class="blk"><h3>Прислів’я про сміх</h3>
<p>Підручник пропонує добирати до казки народні приказки — і вони лягають напрочуд точно: «Сміх — найкращі ліки», «Краще сміятися, ніж плакати», «Тобі сміх, а мені плач», «Буває сміх і крізь сльози».</p></div>

<div class="blk"><h3>Вистави й читання</h3>
<p>Казку часто інсценізують у школах: у ній багато дійових осіб, короткі репліки й дуже виразні характери. А ще її традиційно вчать напам’ять уривками — завдяки ритму й римі це виходить швидко.</p></div>

<div class="blk"><h3>Чому вона не старіє</h3>
<p>Симоненко помер у двадцять вісім років, і в українській літературі його знають як тонкого лірика й патріота. Казка про царя, який заборонив сміх, читається сьогодні так само гостро, як і тоді, — бо влада, яка боїться сміху, з’являється в кожному поколінні.</p></div>
${fin('legacy')}`});

T('train',{g:2,ic:'😄',t:'Тренажери',s:'Чотири вправи на пам’ять і розуміння',html:`

const WHO=[

 ['Гей, веселий Лоскотоне, це прийшли твої брати!','батраки й робітники',['царівни','батраки й робітники','сльозівці']],

];
let wi=0,wok=0;
function initWho(){wi=0;wok=0;drawWho()}
function drawWho(){
  const b=$('#ws');if(!b)return;
  if(wi>=WHO.length){
    b.innerHTML='';$('#wsp').textContent='';
    say('#wss',`Правильних: ${wok} з ${WHO.length}. <button class="btn g" style="margin-top:8px" onclick="initWho();hide('#wss')">Ще раз</button>`,wok>=6);
    return;
  }
  hide('#wss');
  $('#wsp').textContent=`Пункт ${wi+1} з ${WHO.length}`;
  const w=WHO[wi];
  b.innerHTML=`<div class="q">${w[0]}</div>`+
    w[2].map(o=>`<button class="opt" onclick="ansWho(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('');
}
function ansWho(el,o){
  const w=WHO[wi];const ok=(o===w[1]);
  $$('#ws .opt').forEach(b=>{b.disabled=true;if(b.textContent===w[1])b.classList.add('ok')});
  if(!ok)el.classList.add('no');else wok++;
  buzz(ok?'success':'error');
  setTimeout(()=>{wi++;drawWho()},900);
}

const ORD=[
 'Цар Плаксій забороняє сміх у своїй країні',
 'Лоскотон щовечора приносить дітям сміх',

let opick=[];
function initOrder(){
  opick=[];
  const box=$('#ord');if(!box)return;
  const sh=ORD.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  box.innerHTML=sh.map(o=>`<button class="chip" data-i="${o.i}" onclick="pickOrd(this)">${o.t}</button>`).join('');
  $('#oslot').textContent='поки порожньо';hide('#os');
}
function pickOrd(el){
  const i=+el.dataset.i,ok=(i===opick.length);
  if(ok){
    opick.push(i);el.classList.add('used');
    $('#oslot').innerHTML=opick.map((n,k)=>`${k+1}. ${ORD[n]}`).join('<br>');
    buzz('success');

  }else{
    el.classList.add('no');buzz('error');

const LV=[
 ['quiz','🙂','Легкий','Хто, що, де — факти твору',Q1],
 ['quiz2','🔥','Складний','Чому саме так — розуміння',Q2],

T('test',{g:2,ic:'🧠',t:'Тести',s:'Три рівні складності',html:`
<p class="lead">Легкий пояснює після кожної відповіді. Дуже складний мовчить до кінця, а тоді показує розбір помилок.</p>
<div id="lvls"></div>`,
init(){drawLv()}});

function drawLv(){
  const b=$('#lvls');if(!b)return;
  b.innerHTML=LV.map((l,i)=>{
    const s=PR.best[l[0]];
    return `<button class="lvl" onclick="startQ(${i})">
      <span class="ic">${l[1]}</span>
      <span><b>${l[2]}</b><small>${l[3]} · ${l[4].length} питань</small></span>
      <span class="sc">${s!=null?s+'%':''}</span></button>`;
  }).join('');
}
let QL=0,QI=0,QOK=0,QW=[];
function startQ(l){QL=l;QI=0;QOK=0;QW=[];drawQ()}
function drawQ(){
  const L=LV[QL],qs=L[4],b=$('#t-body');
  if(QI>=qs.length)return resQ();
  const q=qs[QI];
  const opts=(q[1]==='tf')
    ? ['Так','Ні'].map((o,i)=>`<button class="opt" onclick="ansQ(${i===0?1:0})">${o}</button>`).join('')
    : q[2].map((o,i)=>`<button class="opt" onclick="ansQ(${i})">${o}</button>`).join('');
  b.innerHTML=`<div class="prog">${L[1]} ${L[2]} · питання ${QI+1} з ${qs.length}</div>
    <div class="blk"><p style="font-size:16px;margin:0">${q[0]}</p></div>
    <div id="qo">${opts}</div><div class="say" id="qs"></div>`;
  window.scrollTo(0,0);
}
function ansQ(v){
  const q=LV[QL][4][QI];
  const right=q[3];
  const ok=(q[1]==='tf')?((v===1)===right):(v===right);
  const btns=$$('#qo .opt');
  btns.forEach(b=>b.disabled=true);
  if(q[1]==='tf'){
    btns[right?0:1].classList.add('ok');
    if(!ok)btns[v===1?0:1].classList.add('no');
  }else{
    btns[right].classList.add('ok');
    if(!ok)btns[v].classList.add('no');
  }
  if(ok)QOK++;else QW.push(q);
  buzz(ok?'success':'error');
  const last=QL===2;
  if(!last)say('#qs',(ok?'✔ ':'✘ ')+q[4],ok);
  setTimeout(()=>{QI++;drawQ()},last?450:1500);
}
function resQ(){
  const L=LV[QL],n=L[4].length;
  const pc=Math.round(QOK/n*100);
  const st=pc>=95?3:pc>=75?2:pc>=50?1:0;
  if(PR.best[L[0]]==null||pc>PR.best[L[0]]){PR.best[L[0]]=pc;save()}
  if(pc>=75)mark('test');
  let w='';
  if(QW.length&&QL===2){
    w='<div class="wrongs"><h3 style="font-family:Georgia,serif;color:var(--joy)">Розбір помилок</h3>'+
      QW.map(q=>{const cor=(q[1]==='tf')?(q[3]?'Так':'Ні'):q[2][q[3]];
      return `<div class="w"><s>${q[0]}</s><br><em>Правильно: ${cor}</em><br>${q[4]}</div>`}).join('')+'</div>';
  }
  $('#t-body').innerHTML=`<div class="res">
    <div class="big">${pc}%</div>
    <div class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <div style="color:var(--dim)">Правильних ${QOK} з ${n}</div>
    <div style="margin-top:18px" class="row">
      <button class="btn" onclick="startQ(${QL})">Ще раз</button>
      <button class="btn g" onclick="open_('test')">До рівнів</button>
    </div>${w}</div>`;
  window.scrollTo(0,0);
  buzz(pc>=75?'success':'warning');
}
