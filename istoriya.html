<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Історія · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>

ї ери (до н. е.)</b>. До н. е. роки рахують <b>у зворотному порядку</b>: 100 р. до н. е. був раніше за 50 р. до н. е. Нульового року немає: після 1 р. до н. е. одразу 1 р. н. е."]}, {"h": "Як визначити століття за роком", "p": ["Відкинь дві останні цифри року і додай 1: <b>1991</b> → 19 + 1 = <b>XX</b> ст.; <b>988</b> → 9 + 1 = <b>X</b> ст. Якщо рік закінчується на 00 — не додаємо: <b>1900</b> → <b>XIX</b> ст., <b>2000</b> → XX ст."], "ex": ["2022 → XXI ст.; 1648 → XVII ст.; 1240 → XIII ст.; 500 → V ст.; 1800 → XVIII ст."], "note": "Початок століття — це рік ...01, кінець — ...00. XXI ст. — з 2001 до 2100 року."}, {"h": "Хронологія", "p": ["<span class='term'>Хронологія</span> — наука про вимір часу і послідовність подій. <b>Дата</b> — час події. <b>Хронологічна таблиця</b> — події по порядку з датами. <b>Шкала (лінія) часу</b> — відрізок, на якому позначають дати: ліворуч — раніше, праворуч — пізніше."]}], "remember": "Століття = 100 років, тисячоліття = 1000. Римські: I V X L C. Наша ера — від Різдва Христового; до н. е. рахують у зворотному порядку; нульового року немає. Століття = перші цифри року + 1 (1991 → XX), якщо рік на 00 — без +1 (1900 → XIX).", "cards": [{"f": "Скільки років у столітті? у тисячолітті?", "b": "100 і 1000."}, {"f": "Римські цифри I, V, X, L, C", "b": "1, 5, 10, 50, 100."}, {"f": "Від якої події рахують нашу еру?", "b": "Від Різдва Христового."}, {"f": "Як рахують роки до нашої ери?", "b": "У зворотному порядку: 100 р. до н. е. раніше за 50 р. до н. е."}, {"f": "Як визначити століття за роком?", "b": "Відкинь дві останні цифри і додай 1; якщо рік на 00 — не додавай. 1991 → XX."}, {"f": "Яке століття 988 рік? 1648 рік?", "b": "X століття; XVII століття."}, {"f": "Хронологія", "b": "Наука про вимір часу і послідовність подій."}, {"f": "Чи є нульовий рік?", "b": "Ні: після 1 р. до н. е. одразу 1 р. н. е."}], "quiz": [{"t": "choice", "q": "Скільки років у столітті?", "o": ["10", "100", "1000"], "a": 1, "e": "Століття = вік = 100 років."}, {"t": "choice", "q": "Яке це число: XIV?", "o": ["16", "14", "19"], "a": 1, "e": "X + IV = 14."}, {"t": "choice", "q": "Яке століття 1991 рік?", "o": ["XIX", "XX", "XXI"], "a": 1, "e": "19 + 1 = 20 → XX."}, {"t": "choice", "q": "Яке століття 988 рік?", "o": ["IX", "X", "XI"], "a": 1, "e": "9 + 1 = 10 → X ст."}, {"t": "choice", "q": "Яке століття 1900 рік?", "o": ["XIX", "XX", "XVIII"], "a": 0, "e": "Рік на 00 — останній рік XIX ст."}, {"t": "choice", "q": "Яке століття 2022 рік?", "o": ["XX", "XXI", "XXII"], "a": 1, "e": "20 + 1 = 21."}, {"t": "choice", "q": "Що було раніше: 300 р. до н. е. чи 200 р. до н. е.?", "o": ["300 р. до н. е.", "200 р. до н. е."], "a": 0, "e": "До н. е. чим більше число — тим раніше."}, {"t": "input", "q": "Запиши римськими цифрами число 20.", "a": ["xx", "хх"], "e": "XX."}, {"t": "choice", "q": "Від якої події рахують нашу еру?", "o": ["Від заснування Києва", "Від Різдва Христового", "Від Олімпійських ігор"], "a": 1, "e": "Різдво Христове."}, {"t": "tf", "q": "Між 1 р. до н. е. і 1 р. н. е. був нульовий рік.", "a": false, "e": "Нульового року немає."}, {"t": "input", "q": "Яке століття 1648 рік? Напиши римськими цифрами.", "a": ["xvii", "хvіі", "хvii", "17"], "e": "XVII."}]}, {"id": "hi-periodyzatsiia", "sec": "Як пізнають історію: час", "title": "Періодизація історії. Хронологічні задачі", "goal": "Ти знаєш періоди всесвітньої історії та розв'язуєш прості задачі на час.", "learn": [{"h": "Періодизація", "p": ["<span class='term'>Періодизація</span> — поділ історії на відрізки (періоди, епохи) за важливими змінами."], "ex": ["<b>Первісна доба</b> (кам'яний, бронзовий, залізний віки) — до появи писемності й держав.", "<b>Стародавній світ</b> (Античність) — Єгипет, Греція, Рим — до V ст. н. е. (476 р. — падіння Риму).", "<b>Середні віки</b> — V–XV ст. (Київська Русь — це Середньовіччя).", "<b>Новий час</b> — XVI–XIX ст. (козацька доба).", "<b>Новітній час</b> — XX–XXI ст. (сучасність)."]}, {"h": "Періоди історії України", "p": ["Найдавніші часи (трипільці, скіфи, греки-колоністи) → <b>Київська Русь</b> (IX–XIII ст.) → Галицько-Волинська держава → литовсько-польська доба → <b>козацька доба</b> (XVI–XVIII ст.) → під владою імперій (XIX ст.) → XX ст.: боротьба за незалежність, УНР 1917–1921, радянська доба → <b>незалежна Україна</b> з 1991 р."]}, {"h": "Хронологічні задачі", "p": ["<b>Скільки років минуло?</b> Від дати до сьогодні: 2026 − 1991 = 35 років незалежності.", "<b>Скільки років між подіями?</b> Більшу дату мінус меншу: 1648 − 988 = 660.", "<b>Через до н. е. й н. е.</b>: додати роки: подія 50 р. до н. е. і 100 р. н. е. → 50 + 100 = 150 років між ними."], "note": "Пам'ятай: 2026 — поточний рік; 1991 — Незалежність України; 988 — хрещення Русі; 1240 — руйнування Києва монголами; 1648 — початок повстання Хмельницького; 1917 — початок Української революції."}], "remember": "Періоди: первісна доба → Стародавній світ → Середні віки (V–XV) → Новий час (XVI–XIX) → Новітній (XX–XXI). Київська Русь — Середньовіччя; козацька доба — Новий час. Різниця дат — відняти; через еру — додати.", "cards": [{"f": "Періодизація", "b": "Поділ історії на періоди за важливими змінами."}, {"f": "П'ять періодів всесвітньої історії", "b": "Первісна доба, Стародавній світ, Середні віки, Новий час, Новітній час."}, {"f": "Середні віки — які століття?", "b": "V–XV століття."}, {"f": "До якого періоду належить Київська Русь?", "b": "До Середньовіччя (IX–XIII ст.)."}, {"f": "Козацька доба — який період?", "b": "Новий час (XVI–XVIII ст.)."}, {"f": "Скільки років між 988 і 1648?", "b": "1648 − 988 = 660."}, {"f": "Скільки років між 50 р. до н. е. і 100 р. н. е.?", "b": "50 + 100 = 150 років."}, {"f": "Рік незалежності України", "b": "1991."}], "quiz": [{"t": "choice", "q": "Що таке періодизація?", "o": ["Список дат", "Поділ історії на періоди", "Карта"], "a": 1, "e": "Поділ за важливими змінами."}, {"t": "choice", "q": "До якого періоду належить Київська Русь?", "o": ["Стародавній світ", "Середні віки", "Новий час"], "a": 1, "e": "IX–XIII ст. — Середньовіччя."}, {"t": "choice", "q": "Козацька доба — це…", "o": ["Середні віки", "Новий час", "Новітній час"], "a": 1, "e": "XVI–XVIII ст."}, {"t": "choice", "q": "Який період ми живемо?", "o": ["Новий час", "Новітній час", "Середні віки"], "a": 1, "e": "XX–XXI ст. — Новітній час."}, {"t": "input", "q": "Скільки років між 988 і 1991? Напиши число.", "a": ["1003"], "e": "1991 − 988 = 1003."}, {"t": "input", "q": "Скільки років між 100 р. до н. е. і 100 р. н. е.?", "a": ["200"], "e": "100 + 100 = 200."}, {"t": "input", "q": "Скільки років незалежності України у 2026 році?", "a": ["35"], "e": "2026 − 1991 = 35."}, {"t": "choice", "q": "Що було раніше?", "o": ["Хрещення Русі (988)", "Повстання Хмельницького (1648)"], "a": 0, "e": "988 менше за 1648."}, {"t": "choice", "q": "Якою подією закінчується Стародавній світ?", "o": ["Падінням Риму 476 р.", "Хрещенням Русі", "Відкриттям Америки"], "a": 0, "e": "476 рік."}, {"t": "choice", "q": "Який період найдавніший?", "o": ["Первісна доба", "Середні віки", "Новий час"], "a": 0, "e": "До писемності й держав."}]}, {"id": "hi-prostir-karta", "sec": "Як пізнають історію: простір", "title": "Історичний простір. Історична карта", "goal": "Ти читаєш історичну карту, знаєш її умовні знаки й розумієш, як довкілля впливає на людей.", "learn": [{"h": "Простір і людина", "p": ["<span class='term'>Географічний простір</span> — місце, де живуть люди: рівнини, гори, річки, моря, клімат. Він впливає на заняття: біля річок — рибальство й торгівля, у степу — скотарство, на чорноземах — землеробство. Дніпро — головна річка України, «шлях із варягів у греки»."]}, {"h": "Історична карта", "p": ["<span class='term'>Історична карта</span> показує, як виглядав простір у певний час: кордони держав, міста, битви, походи, торгові шляхи. Відрізняється від географічної: показує минуле і зміни. <b>Легенда карти</b> — пояснення умовних знаків (кольори — держави; стрілки — походи; схрещені мечі — битви; крапки — міста)."], "note": "Читай карту так: назва → період → легенда → знайди територію."}, {"h": "Контурна карта", "p": ["<span class='term'>Контурна карта</span> — карта лише з контурами (обрисами), яку заповнюють самостійно: підписують міста, зафарбовують території, малюють стрілки."]}, {"h": "Як змінювались карти", "p": ["Давні карти були неточними: люди знали лише свій край; Америку і Австралію не знали до XV–XVII ст. Карти уточнювались із подорожами й відкриттями. Кордони держав змінюються — тому одна й та сама земля на різних картах різного кольору."]}], "remember": "Довкілля впливає на заняття людей (річки — торгівля, степ — скотарство, чорнозем — землеробство). Історична карта показує минуле: кордони, походи, битви. Легенда — пояснення знаків. Контурна карта — заповнюється самостійно.", "cards": [{"f": "Історична карта", "b": "Карта, що показує простір у певний період: кордони, міста, битви, походи."}, {"f": "Легенда карти", "b": "Пояснення умовних знаків карти."}, {"f": "Контурна карта", "b": "Карта з контурами, яку заповнюють самостійно."}, {"f": "Що означають схрещені мечі на карті?", "b": "Місце битви."}, {"f": "Що означають стрілки на історичній карті?", "b": "Напрямок походів, переселень."}, {"f": "Головна річка України", "b": "Дніпро."}, {"f": "Як довкілля впливає на заняття людей?", "b": "Річки — рибальство й торгівля; степ — скотарство; чорнозем — землеробство."}], "quiz": [{"t": "choice", "q": "Чим історична карта відрізняється від географічної?", "o": ["Вона кольорова", "Показує минуле і зміни: кордони, битви, походи", "Вона більша"], "a": 1, "e": "Історична карта — про певний період."}, {"t": "choice", "q": "Що таке легенда карти?", "o": ["Казка про місто", "Пояснення умовних знаків", "Назва карти"], "a": 1, "e": "Розшифровка знаків."}, {"t": "choice", "q": "Що означають схрещені мечі на карті?", "o": ["Столицю", "Битву", "Кордон"], "a": 1, "e": "Місце битви."}, {"t": "choice", "q": "Що показують стрілки на історичній карті?", "o": ["Річки", "Походи, переселення", "Гори"], "a": 1, "e": "Напрямок руху."}, {"t": "choice", "q": "Яку карту заповнюють самостійно?", "o": ["Фізичну", "Контурну", "Політичну"], "a": 1, "e": "Контурна карта."}, {"t": "choice", "q": "Чим займались люди на родючих чорноземах?", "o": ["Рибальством", "Землеробством", "Мореплавством"], "a": 1, "e": "Чорнозем — землеробство."}, {"t": "input", "q": "Яка головна річка України?", "a": ["дніпро"], "e": "Дніпро."}, {"t": "choice", "q": "Чому давні карти неточні?", "o": ["Люди погано малювали", "Люди знали лише свій край і не бачили далеких земель", "Не було паперу"], "a": 1, "e": "Карти уточнювались з відкриттями."}, {"t": "choice", "q": "З чого починати читати карту?", "o": ["З назви й періоду, потім легенда", "З кольорів", "З кутка"], "a": 0, "e": "Назва → період → легенда."}]}, {"id": "hi-rehiony", "sec": "Як пізнають історію: простір", "title": "Історико-географічні регіони України. Назва «Україна»", "goal": "Ти знаєш головні історичні регіони України і звідки походить назва «Україна».", "learn": [{"h": "Історико-географічний регіон", "p": ["<span class='term'>Регіон</span> — частина країни з спільною історією, природою, традиціями. Регіони України склались історично."], "ex": ["<b>Наддніпрянщина</b> (Київщина, Полтавщина, Черкащина) — серце Русі й козацтва.", "<b>Слобожанщина</b> (Харківщина, Сумщина) — слободи XVII ст.", "<b>Поділля</b> (Вінниччина, Хмельниччина), <b>Волинь</b> (Волинська, Рівненська), <b>Полісся</b> (північ, ліси й болота).", "<b>Галичина</b> (Львівщина, Івано-Франківщина, Тернопільщина), <b>Буковина</b> (Чернівеччина), <b>Закарпаття</b>.", "<b>Запоріжжя</b> і <b>Таврія</b> (південний степ), <b>Причорномор'я</b>, <b>Крим</b>, <b>Донбас</b> (Донеччина, Луганщина), <b>Бессарабія</b> (південь Одещини — там Кілія)."]}, {"h": "Назва «Україна»", "p": ["Уперше згадана в <b>Київському літописі 1187 року</b> (про смерть переяславського князя Володимира Глібовича: «за ним же Україна багато потужила»). Означала «край, земля, рідна сторона». Поступово стала назвою всієї землі й народу. У XVII ст. — козацька Україна; 1917 — Українська Народна Республіка; <b>24 серпня 1991</b> — незалежна Україна."]}, {"h": "«Велика» і «мала» Батьківщина", "p": ["<b>Мала Батьківщина</b> — рідне місто чи село, свій край. <b>Велика Батьківщина</b> — уся Україна. <b>Українці за межами України</b> — <span class='term'>діаспора</span> (Канада, США, Польща, Італія та ін.), зберігають мову й традиції."]}], "remember": "Регіони: Наддніпрянщина, Слобожанщина, Поділля, Волинь, Полісся, Галичина, Буковина, Закарпаття, Запоріжжя, Таврія, Крим, Донбас, Бессарабія. «Україна» — Київський літопис 1187 р., означало «край, земля». Діаспора — українці за кордоном.", "cards": [{"f": "Історико-географічний регіон", "b": "Частина країни зі спільною історією, природою, традиціями."}, {"f": "Галичина — які області?", "b": "Львівська, Івано-Франківська, Тернопільська."}, {"f": "Слобожанщина", "b": "Харківщина, Сумщина; від слобід XVII ст."}, {"f": "Наддніпрянщина", "b": "Землі вздовж Дніпра: Київщина, Черкащина, Полтавщина."}, {"f": "Коли й де вперше згадано назву «Україна»?", "b": "1187 рік, Київський літопис."}, {"f": "Що означала назва «Україна»?", "b": "Край, земля, рідна сторона."}, {"f": "Діаспора", "b": "Українці, які живуть за межами України."}, {"f": "Мала і велика Батьківщина", "b": "Мала — рідне місто чи край; велика — уся Україна."}], "quiz": [{"t": "choice", "q": "Львівська область належить до…", "o": ["Слобожанщини", "Галичини", "Поділля"], "a": 1, "e": "Галичина."}, {"t": "choice", "q": "Харківщина й Сумщина — це…", "o": ["Слобожанщина", "Волинь", "Буковина"], "a": 0, "e": "Слобожанщина — від слобід."}, {"t": "choice", "q": "Чернівецька область — це…", "o": ["Закарпаття", "Буковина", "Полісся"], "a": 1, "e": "Буковина."}, {"t": "choice", "q": "Коли вперше згадано назву «Україна»?", "o": ["988", "1187", "1648"], "a": 1, "e": "Київський літопис 1187 р."}, {"t": "choice", "q": "Що означало слово «Україна»?", "o": ["Окраїна", "Край, земля, рідна сторона", "Місто"], "a": 1, "e": "Рідний край."}, {"t": "choice", "q": "Хто такі діаспора?", "o": ["Іноземці в Україні", "Українці за кордоном", "Жителі столиці"], "a": 1, "e": "Українці за межами України."}, {"t": "choice", "q": "Що таке мала Батьківщина?", "o": ["Уся Україна", "Рідне місто чи край", "Європа"], "a": 1, "e": "Свій рідний край."}, {"t": "input", "q": "Коли Україна проголосила незалежність? Напиши рік.", "a": ["1991"], "e": "24 серпня 1991."}, {"t": "choice", "q": "До якого регіону належить південь Одещини (Кілія, Ізмаїл)?", "o": ["Бессарабія", "Слобожанщина", "Полісся"], "a": 0, "e": "Бессарабія."}]}, {"id": "hi-dzherela", "sec": "Джерела пізнання минулого", "title": "Історичні джерела: речові, писемні, усні, аудіовізуальні, етнографічні", "goal": "Ти розрізняєш види історичних джерел і знаєш, що дає кожен.", "learn": [{"h": "Історичне джерело", "p": ["<span class='term'>Історичне джерело</span> — усе, що створили люди в минулому і що несе інформацію про нього. Джерела бувають <b>первинні</b> (створені в той час) і <b>вторинні</b> (пізніші розповіді про подію)."]}, {"h": "Види джерел", "p": ["<b>Речові</b> — предмети: знаряддя, посуд, зброя, монети, будівлі, прикраси. Їх вивчає <span class='term'>археологія</span>, здобуває розкопками. Наука про монети — нумізматика.", "<b>Писемні</b> — тексти: літописи, грамоти, листи, книжки, написи на камені (епіграфіка), берестяні грамоти. З появою писемності починається писана історія.", "<b>Усні</b> — легенди, перекази, пісні, думи, спогади очевидців (усна історія).", "<b>Аудіовізуальні</b> — фото, кіно, звукозаписи, відео.", "<b>Етнографічні</b> — народний одяг, звичаї, обряди, житло, ремесла; вивчає <span class='term'>етнографія</span> — наука про народи й їхню культуру."]}, {"h": "Критика джерела", "p": ["Джерело може помилятись або брехати. Історик ставить питання: хто створив? коли? навіщо? чи підтверджують інші джерела? Один документ — ще не доказ."]}], "remember": "Джерело — усе створене людьми в минулому. Види: речові (археологія, розкопки), писемні (літописи, грамоти), усні (легенди, спогади), аудіовізуальні (фото, кіно), етнографічні (одяг, звичаї). Джерела перевіряють.", "cards": [{"f": "Історичне джерело", "b": "Усе, що створили люди в минулому і що несе інформацію про нього."}, {"f": "Речові джерела", "b": "Предмети: знаряддя, посуд, монети, зброя, будівлі. Вивчає археологія."}, {"f": "Писемні джерела", "b": "Тексти: літописи, грамоти, листи, написи."}, {"f": "Усні джерела", "b": "Легенди, перекази, пісні, думи, спогади очевидців."}, {"f": "Аудіовізуальні джерела", "b": "Фото, кіно, відео, звукозаписи."}, {"f": "Етнографічні джерела", "b": "Народний одяг, звичаї, обряди, житло, ремесла."}, {"f": "Археологія", "b": "Наука, що вивчає минуле за речовими знахідками, здобутими розкопками."}, {"f": "Первинне і вторинне джерело", "b": "Первинне — створене в той час; вторинне — пізніша розповідь."}], "quiz": [{"t": "choice", "q": "Давня монета — це джерело…", "o": ["речове", "писемне", "усне"], "a": 0, "e": "Предмет — речове."}, {"t": "choice", "q": "«Повість минулих літ» — це джерело…", "o": ["речове", "писемне", "аудіовізуальне"], "a": 1, "e": "Літопис — текст."}, {"t": "choice", "q": "Легенда про заснування Києва — це джерело…", "o": ["усне", "речове", "етнографічне"], "a": 0, "e": "Передавалась усно."}, {"t": "choice", "q": "Кінохроніка 1941 року — це джерело…", "o": ["писемне", "аудіовізуальне", "речове"], "a": 1, "e": "Кіно — аудіовізуальне."}, {"t": "choice", "q": "Вишиванка й весільний обряд — джерела…", "o": ["етнографічні", "писемні", "усні"], "a": 0, "e": "Народна культура — етнографія."}, {"t": "choice", "q": "Яка наука здобуває джерела розкопками?", "o": ["Археологія", "Етнографія", "Нумізматика"], "a": 0, "e": "Археологія."}, {"t": "input", "q": "Як називається наука про народи, їх побут і культуру?", "a": ["етнографія"], "e": "Етнографія."}, {"t": "choice", "q": "Чому джерела треба перевіряти?", "o": ["Бо вони старі", "Бо автор міг помилятись або брехати", "Не треба"], "a": 1, "e": "Один документ — не доказ."}, {"t": "choice", "q": "Лист учасника події, написаний того ж дня, — джерело…", "o": ["первинне", "вторинне"], "a": 0, "e": "Створене в той час."}, {"t": "choice", "q": "Наука про монети —", "o": ["нумізматика", "епіграфіка", "геральдика"], "a": 0, "e": "Нумізматика; епіграфіка — написи; геральдика — герби."}]}, {"id": "hi-de-zberihaiut", "sec": "Джерела пізнання минулого", "title": "Де зберігають джерела: музеї, архіви, бібліотеки. Історики та їх професії", "goal": "Ти знаєш, де зберігають історичні джерела, і які професії досліджують минуле.", "learn": [{"h": "Де зберігають", "p": ["<b>Музей</b> — зберігає й показує речові пам'ятки (експонати); бувають історичні, краєзнавчі, художні, музеї під відкритим небом (Пирогів). <b>Архів</b> — зберігає документи (грамоти, листи, справи). <b>Бібліотека</b> — книжки й рукописи; найбільша в Україні — Національна бібліотека ім. Вернадського. <b>Заповідник</b> — охоронна територія з пам'ятками (Софія Київська, Хортиця)."]}, {"h": "Хто досліджує минуле", "p": ["<b>Історик</b> — вивчає й пояснює минуле. <b>Археолог</b> — шукає речові джерела розкопками. <b>Етнограф</b> — вивчає культуру й побут народів. <b>Архівіст</b> — зберігає документи. <b>Музейник</b> — зберігає й показує експонати; <b>екскурсовод</b> розповідає відвідувачам. <b>Реставратор</b> — відновлює пам'ятки. <b>Краєзнавець</b> — досліджує історію свого краю. <b>Генеалог</b> — досліджує родоводи."]}, {"h": "Як працює історик", "p": ["1) Ставить питання. 2) Шукає джерела. 3) Перевіряє їх (критика). 4) Порівнює. 5) Робить висновок і пише дослідження. Історик має бути чесним і не підганяти факти під бажану відповідь."]}], "remember": "Музей — речі (експонати); архів — документи; бібліотека — книжки; заповідник — територія з пам'ятками. Професії: історик, археолог, етнограф, архівіст, музейник, екскурсовод, реставратор, краєзнавець, генеалог.", "cards": [{"f": "Музей", "b": "Заклад, де зберігають і показують пам'ятки — експонати."}, {"f": "Архів", "b": "Заклад, де зберігають документи."}, {"f": "Найбільша бібліотека України", "b": "Національна бібліотека ім. Вернадського (Київ)."}, {"f": "Археолог", "b": "Шукає речові джерела розкопками."}, {"f": "Реставратор", "b": "Відновлює пошкоджені пам'ятки."}, {"f": "Краєзнавець", "b": "Досліджує історію свого краю."}, {"f": "Генеалог", "b": "Досліджує родоводи."}, {"f": "Експонат", "b": "Предмет, виставлений у музеї."}], "quiz": [{"t": "choice", "q": "Де зберігають старовинні документи?", "o": ["У музеї", "В архіві", "У спортзалі"], "a": 1, "e": "Архів — для документів."}, {"t": "choice", "q": "Предмет, виставлений у музеї, — це…", "o": ["експонат", "експеримент", "екскурсія"], "a": 0, "e": "Експонат."}, {"t": "choice", "q": "Хто проводить розкопки?", "o": ["Архівіст", "Археолог", "Екскурсовод"], "a": 1, "e": "Археолог."}, {"t": "choice", "q": "Хто відновлює пошкоджені ікони й будівлі?", "o": ["Реставратор", "Генеалог", "Етнограф"], "a": 0, "e": "Реставратор."}, {"t": "choice", "q": "Хто досліджує історію свого міста чи села?", "o": ["Краєзнавець", "Нумізмат", "Архівіст"], "a": 0, "e": "Краєзнавець."}, {"t": "choice", "q": "Хто розповідає відвідувачам музею про експонати?", "o": ["Реставратор", "Екскурсовод", "Архівіст"], "a": 1, "e": "Екскурсовод."}, {"t": "input", "q": "Хто досліджує родоводи?", "a": ["генеалог"], "e": "Генеалог."}, {"t": "choice", "q": "Що робить історик спочатку?", "o": ["Пише висновок", "Ставить питання і шукає джерела", "Вигадує"], "a": 1, "e": "Питання → джерела → перевірка → висновок."}, {"t": "choice", "q": "Софія Київська, Хортиця — це…", "o": ["заповідники", "архіви", "бібліотеки"], "a": 0, "e": "Історико-культурні заповідники."}]}, {"id": "hi-pamiatky", "sec": "Історія навколо мене", "title": "Історична пам'ять і пам'ятки. Архітектура й мистецтво", "goal": "Ти розрізняєш пам'ятку і пам'ятник, знаєш головні архітектурні пам'ятки України.", "learn": [{"h": "Пам'ятка і пам'ятник", "p": ["<span class='term'>Історична пам'ятка</span> — те, що збереглось із минулого і має цінність: будівля, храм, замок, рукопис, картина. <span class='term'>Пам'ятник</span> — споруда, створена <b>спеціально на честь</b> події чи людини (монумент, статуя, меморіал). Пам'ятка — сама історія; пам'ятник — пам'ять про неї."]}, {"h": "Пам'ятки архітектури України", "p": ["<b>Софійський собор</b> (Київ, XI ст., Ярослав Мудрий) і <b>Києво-Печерська лавра</b> — у списку <b>ЮНЕСКО</b>. <b>Золоті ворота</b> (Київ). <b>Замки</b>: Кам'янець-Подільський, Хотин, Луцький (Любарта), Олеський, Мукачівський (Паланок). <b>Львів</b> — історичний центр у ЮНЕСКО. <b>Хортиця</b> — острів Січі. <b>Херсонес</b> (Крим) — давньогрецьке місто. <b>Дерев'яні церкви Карпат</b> — ЮНЕСКО."], "note": "<b>ЮНЕСКО</b> — організація ООН з питань освіти, науки й культури; веде Список всесвітньої спадщини."}, {"h": "Пам'ятки мистецтва", "p": ["Мозаїки і фрески Софії Київської; ікони (Богородиця Оранта — «Нерушима стіна»); <b>Пересопницьке Євангеліє</b> (XVI ст., на ньому присягають президенти); народні картини, вишивка, писанки. <b>Нематеріальна спадщина</b> — традиції: петриківський розпис, косівська кераміка, борщ, писанкарство — теж у ЮНЕСКО."]}, {"h": "Історична пам'ять", "p": ["<span class='term'>Історична пам'ять</span> — те, як народ пам'ятає своє минуле: свята, дні пам'яті, музеї, назви вулиць. Пам'ять зберігають, щоб не забути героїв і трагедії (Голодомор — четверта субота листопада; День пам'яті захисників — 29 серпня)."]}], "remember": "Пам'ятка — збережене з минулого; пам'ятник — створене на честь. ЮНЕСКО: Софія Київська, Лавра, центр Львова, дерев'яні церкви Карпат. Пересопницьке Євангеліє — присяга президентів. Історична пам'ять — як народ пам'ятає минуле.", "cards": [{"f": "Пам'ятка", "b": "Збережене з минулого, що має цінність: храм, замок, рукопис."}, {"f": "Пам'ятник", "b": "Споруда, створена спеціально на честь події чи людини."}, {"f": "ЮНЕСКО", "b": "Організація ООН з освіти, науки, культури; веде Список всесвітньої спадщини."}, {"f": "Українські пам'ятки в ЮНЕСКО", "b": "Софійський собор, Києво-Печерська лавра, центр Львова, дерев'яні церкви Карпат."}, {"f": "Пересопницьке Євангеліє", "b": "Рукописна книга XVI ст.; на ній присягають президенти України."}, {"f": "Хто збудував Софійський собор і коли?", "b": "Ярослав Мудрий, XI століття."}, {"f": "Нематеріальна спадщина", "b": "Традиції й уміння: петриківський розпис, косівська кераміка, борщ."}, {"f": "Історична пам'ять", "b": "Те, як народ пам'ятає своє минуле: свята, дні пам'яті, назви вулиць."}], "quiz": [{"t": "choice", "q": "Софійський собор — це…", "o": ["пам'ятка", "пам'ятник"], "a": 0, "e": "Збереглось із XI ст. — пам'ятка."}, {"t": "choice", "q": "Статуя на честь поета на площі — це…", "o": ["пам'ятка", "пам'ятник"], "a": 1, "e": "Створена спеціально на честь."}, {"t": "choice", "q": "Що таке ЮНЕСКО?", "o": ["Спортивна ліга", "Організація ООН з освіти, науки і культури", "Музей"], "a": 1, "e": "Веде Список всесвітньої спадщини."}, {"t": "choice", "q": "Яка пам'ятка Києва в списку ЮНЕСКО?", "o": ["Софійський собор", "Стадіон", "Вокзал"], "a": 0, "e": "Разом із Лаврою."}, {"t": "choice", "q": "На чому присягають президенти України?", "o": ["На Конституції та Пересопницькому Євангелії", "На Кобзарі", "На літописі"], "a": 0, "e": "Пересопницьке Євангеліє XVI ст."}, {"t": "choice", "q": "Хто збудував Софійський собор?", "o": ["Володимир Великий", "Ярослав Мудрий", "Богдан Хмельницький"], "a": 1, "e": "XI століття."}, {"t": "choice", "q": "Петриківський розпис — це…", "o": ["матеріальна пам'ятка", "нематеріальна спадщина", "архів"], "a": 1, "e": "Традиція, уміння."}, {"t": "input", "q": "На якому острові була Запорозька Січ?", "a": ["хортиця", "хортиці"], "e": "Хортиця."}, {"t": "choice", "q": "Навіщо зберігати історичну пам'ять?", "o": ["Щоб не забути героїв і трагедії", "Щоб було більше свят", "Не потрібно"], "a": 0, "e": "Пам'ять — основа народу."}]}, {"id": "hi-toponimika", "sec": "Історія навколо мене", "title": "Історія в назвах: топоніміка. Краєзнавство", "goal": "Ти знаєш, що таке топоніміка, як назви зберігають історію, і що таке краєзнавство.", "learn": [{"h": "Топоніміка", "p": ["<span class='term'>Топоніміка</span> — наука про географічні назви (<b>топоніми</b>). Назви розповідають історію: <b>Київ</b> — від Кия; <b>Львів</b> — від Лева, сина Данила Галицького; <b>Запоріжжя</b> — за порогами Дніпра; <b>Слобожанщина</b> — від слобід; <b>Кілія</b> — назва давня, ймовірно від грецького «келія» (кімната, притулок) або тюркського «глина»."], "ex": ["Види топонімів: назви міст і сіл (ойконіми), річок (гідроніми: Дніпро, Дунай, Дністер), гір (ороніми: Карпати, Говерла), вулиць."]}, {"h": "Історія вулиць", "p": ["Вулиці називають на честь людей, подій, ремесел, місцевості (Гончарна — гончарі, Кожум'яки — шкіряники). <span class='term'>Декомунізація</span> — перейменування вулиць із радянських назв на українські. Назва вулиці — це теж джерело."]}, {"h": "Краєзнавство", "p": ["<span class='term'>Краєзнавство</span> — вивчення історії, природи, культури свого краю (міста, села, області). <b>Краєзнавчий музей</b> є в кожній області. <b>Екскурсійний маршрут</b> — план подорожі по пам'ятних місцях: обираєш тему → об'єкти → порядок → розповідь про кожен."]}, {"h": "Де «побачити» й «почути» історію", "p": ["Побачити: у музеях, на вулицях старого міста, на старих фото, у замках. Почути: у спогадах старших родичів, піснях і думах, екскурсіях, подкастах. <b>Усна історія</b> — записані спогади свідків; кожна родина — джерело."]}], "remember": "Топоніміка — наука про географічні назви; Київ — від Кия, Львів — від Лева, Запоріжжя — за порогами. Гідроніми — річки. Краєзнавство — вивчення свого краю. Усна історія — спогади свідків.", "cards": [{"f": "Топоніміка", "b": "Наука про географічні назви."}, {"f": "Гідроніми / ороніми", "b": "Назви річок / назви гір."}, {"f": "Звідки назва Львів?", "b": "Від князя Лева, сина Данила Галицького."}, {"f": "Звідки назва Запоріжжя?", "b": "Землі за порогами Дніпра."}, {"f": "Краєзнавство", "b": "Вивчення історії, природи й культури свого краю."}, {"f": "Усна історія", "b": "Записані спогади свідків подій."}, {"f": "Декомунізація назв", "b": "Перейменування вулиць з радянських назв на українські."}], "quiz": [{"t": "choice", "q": "Топоніміка вивчає…", "o": ["тварин", "географічні назви", "монети"], "a": 1, "e": "Назви міст, річок, гір."}, {"t": "choice", "q": "Від чийого імені назва Львів?", "o": ["Лева Толстого", "Князя Лева Даниловича", "Лев'ячого зоопарку"], "a": 1, "e": "Син Данила Галицького."}, {"t": "choice", "q": "Чому Запоріжжя так називається?", "o": ["Багато порогів у хатах", "За порогами Дніпра", "Від слова «запор»"], "a": 1, "e": "Дніпрові пороги."}, {"t": "choice", "q": "Дніпро, Дунай, Дністер — це…", "o": ["ороніми", "гідроніми", "ойконіми"], "a": 1, "e": "Назви річок."}, {"t": "choice", "q": "Вулиця Гончарна отримала назву від…", "o": ["ремесла гончарів", "річки", "князя"], "a": 0, "e": "Ремісничі квартали."}, {"t": "choice", "q": "Краєзнавство — це…", "o": ["вивчення інших країн", "вивчення свого краю", "вивчення краєвидів"], "a": 1, "e": "Свого міста, села, області."}, {"t": "input", "q": "Як називаються записані спогади свідків подій? … історія", "a": ["усна", "усна історія"], "e": "Усна історія."}, {"t": "choice", "q": "З чого починається екскурсійний маршрут?", "o": ["З вибору теми", "З покупки квитків", "З фото"], "a": 0, "e": "Тема → об'єкти → порядок → розповідь."}, {"t": "choice", "q": "Хто може бути джерелом усної історії твоєї родини?", "o": ["Бабуся і дідусь", "Тільки історики", "Ніхто"], "a": 0, "e": "Кожна родина — джерело."}]}, {"id": "hi-spilnoty", "sec": "Людина і спільноти", "title": "Перші людські спільноти. Родина і громада. Села й міста", "goal": "Ти знаєш, як жили перші люди, що таке рід, плем'я, громада, і чим село відрізняється від міста.", "learn": [{"h": "Перші люди", "p": ["Первісні люди жили в <b>кам'яному віці</b>: полювали, збирали плоди, робили знаряддя з каменю, жили в печерах, користувались вогнем. Об'єднувались у <b>рід</b> (родичі зі спільним предком) і <b>плем'я</b> (кілька родів). Пізніше навчились землеробства й скотарства, будувати житла — з'явились поселення. На землях України 7 тисяч років тому жили <b>трипільці</b> — землероби, майстри розписної кераміки."]}, {"h": "Родина і громада", "p": ["<span class='term'>Родина</span> — найменша спільнота: батьки, діти, бабусі й дідусі. <span class='term'>Громада</span> — люди, що живуть разом на одній території й вирішують спільні справи (сільська, міська, територіальна громада). У громаді є спільні правила, обов'язки, взаємодопомога — <b>толока</b> (спільна праця)."]}, {"h": "Села і міста", "p": ["<b>Село</b> — невелике поселення, жителі займались землеробством і скотарством. <b>Місто</b> — велике поселення: ремесло, торгівля, влада, укріплення (дитинець, вали, стіни). Давні міста: Київ, Чернігів, Львів, Кам'янець. Сьогодні місто — центр промисловості, освіти, культури; село — сільське господарство. У містах були <b>ринкова площа</b>, <b>ратуша</b>, <b>цехи</b> ремісників."]}, {"h": "Приватний і публічний простір", "p": ["<b>Приватний простір</b> — особистий: дім, кімната, речі, листування; його не можна порушувати без дозволу. <b>Публічний простір</b> — спільний: вулиця, площа, парк, школа, транспорт; там діють спільні правила. Колись публічним центром був майдан (віче, ринок), тепер — ще й інтернет."]}], "remember": "Первісні люди: кам'яний вік, рід → плем'я; трипільці — землероби. Родина — найменша спільнота; громада — люди однієї території зі спільними справами. Місто — ремесло, торгівля, влада; село — землеробство. Приватний простір — особистий; публічний — спільний.", "cards": [{"f": "Рід і плем'я", "b": "Рід — родичі зі спільним предком; плем'я — кілька родів."}, {"f": "Трипільці", "b": "Землероби на землях України 7 тис. років тому; розписна кераміка."}, {"f": "Громада", "b": "Люди, що живуть на одній території й вирішують спільні справи."}, {"f": "Толока", "b": "Спільна праця громади для допомоги."}, {"f": "Чим місто відрізнялось від села?", "b": "Ремесло, торгівля, влада, укріплення — у місті; землеробство — у селі."}, {"f": "Приватний простір", "b": "Особистий: дім, речі, листування; недоторканний без дозволу."}, {"f": "Публічний простір", "b": "Спільний: вулиця, площа, школа; діють спільні правила."}], "quiz": [{"t": "choice", "q": "З чого робили знаряддя перші люди?", "o": ["З каменю", "З заліза", "З пластику"], "a": 0, "e": "Кам'яний вік."}, {"t": "choice", "q": "Кілька родів разом — це…", "o": ["громада", "плем'я", "держава"], "a": 1, "e": "Плем'я."}, {"t": "choice", "q": "Хто такі трипільці?", "o": ["Давні землероби на землях України", "Козаки", "Мисливці Африки"], "a": 0, "e": "Відомі розписною керамікою."}, {"t": "choice", "q": "Громада — це…", "o": ["сім'я", "люди однієї території зі спільними справами", "армія"], "a": 1, "e": "Сільська, міська громада."}, {"t": "choice", "q": "Що таке толока?", "o": ["Свято", "Спільна праця громади", "Податок"], "a": 1, "e": "Взаємодопомога."}, {"t": "choice", "q": "Чим займались у давньому місті?", "o": ["Лише землеробством", "Ремеслом і торгівлею", "Нічим"], "a": 1, "e": "Місто — ремесло, торгівля, влада."}, {"t": "choice", "q": "Твоя кімната і листування — це…", "o": ["публічний простір", "приватний простір"], "a": 1, "e": "Особисте, недоторканне."}, {"t": "choice", "q": "Шкільний коридор — це…", "o": ["приватний простір", "публічний простір"], "a": 1, "e": "Спільний, зі спільними правилами."}, {"t": "input", "q": "Як називалась укріплена центральна частина давньоруського міста?", "a": ["дитинець", "кремль", "дитинец"], "e": "Дитинець."}]}, {"id": "hi-vlada-pravyla", "sec": "Людина і спільноти", "title": "Правила співжиття. Влада та її види. Держава", "goal": "Ти знаєш, навіщо правила і закони, що таке влада, держава і які є її види.", "learn": [{"h": "Правила співжиття", "p": ["Люди завжди мали правила: звичаї, заповіді, закони. Перші писані закони — <b>закони Хаммурапі</b> (Вавилон). На Русі — <b>«Руська правда»</b> Ярослава Мудрого (XI ст.). Сучасний головний закон — <b>Конституція України</b> (28 червня 1996). Закони обов'язкові для всіх — це <b>верховенство права</b>."]}, {"h": "Влада", "p": ["<span class='term'>Влада</span> — право й можливість керувати, ухвалювати рішення для всіх. Види: у родині — батьківська; у громаді — старійшини, віче (народні збори), рада; у державі — князь, король, гетьман, президент, парламент. Влада буває <b>одноосібна</b> (монархія — король, князь) і <b>народна</b> (демократія — обирають)."]}, {"h": "Держава", "p": ["<span class='term'>Держава</span> — організація влади на певній території з населенням, законами, кордонами, символами. Ознаки: територія, населення, влада, закони, символи (прапор, герб, гімн), армія, гроші. Україна — незалежна <b>демократична республіка</b>: главу держави (<b>Президента</b>) і парламент (<b>Верховну Раду</b>) обирає народ; уряд — <b>Кабінет Міністрів</b>; суди."]}, {"h": "Людина і держава", "p": ["Держава захищає громадян (безпека, школа, лікарня, суд), громадяни виконують обов'язки (закони, податки, захист країни). <span class='term'>Громадянин</span> — людина, що належить до держави, має права й обов'язки."]}], "remember": "Перші писані закони — Хаммурапі; на Русі — «Руська правда»; в Україні — Конституція 28 червня 1996. Влада — право керувати: монархія (один) або демократія (народ). Держава: територія, населення, влада, закони, символи. Україна — демократична республіка: Президент, Верховна Рада, Кабінет Міністрів.", "cards": [{"f": "Влада", "b": "Право й можливість керувати, ухвалювати рішення для всіх."}, {"f": "Держава", "b": "Організація влади на території з населенням, законами, кордонами, символами."}, {"f": "Ознаки держави", "b": "Територія, населення, влада, закони, символи, армія, гроші."}, {"f": "Головний закон України", "b": "Конституція, ухвалена 28 червня 1996 року."}, {"f": "Монархія / демократія", "b": "Влада одного (король, князь) / влада народу через вибори."}, {"f": "Хто ухвалює закони в Україні?", "b": "Верховна Рада (парламент)."}, {"f": "Хто глава держави в Україні?", "b": "Президент, обраний народом."}, {"f": "Перший збірник законів Русі", "b": "«Руська правда» Ярослава Мудрого."}], "quiz": [{"t": "choice", "q": "Коли ухвалено Конституцію України?", "o": ["24 серпня 1991", "28 червня 1996", "1 грудня 1991"], "a": 1, "e": "28 червня — День Конституції."}, {"t": "choice", "q": "Хто ухвалює закони в Україні?", "o": ["Президент", "Верховна Рада", "Суд"], "a": 1, "e": "Парламент."}, {"t": "choice", "q": "Влада одного правителя, що передається у спадок, — це…", "o": ["демократія", "монархія", "республіка"], "a": 1, "e": "Монархія."}, {"t": "choice", "q": "Що НЕ є ознакою держави?", "o": ["Територія", "Закони", "Улюблена страва"], "a": 2, "e": "Ознаки: територія, населення, влада, закони, символи."}, {"t": "choice", "q": "Хто такий громадянин?", "o": ["Мешканець міста", "Людина, що належить до держави й має права та обов'язки", "Турист"], "a": 1, "e": "Громадянство — зв'язок з державою."}, {"t": "choice", "q": "«Руська правда» — це…", "o": ["газета", "збірник законів Ярослава Мудрого", "літопис"], "a": 1, "e": "XI століття."}, {"t": "choice", "q": "Верховенство права означає…", "o": ["правда завжди перемагає", "закони обов'язкові для всіх, і для влади теж", "праві завжди мають рацію"], "a": 1, "e": "Ніхто не вище закону."}, {"t": "input", "q": "Як називається уряд України? Кабінет …", "a": ["міністрів", "кабінет міністрів"], "e": "Кабінет Міністрів."}, {"t": "choice", "q": "Народні збори в давніх містах Русі —", "o": ["віче", "дума", "січ"], "a": 0, "e": "Віче."}]}, {"id": "hi-prava-demokratiia", "sec": "Людина і спільноти", "title": "Гідність і рівність. Права людини і дитини. Демократія", "goal": "Ти знаєш основні права людини й дитини і розумієш, що таке демократія.", "learn": [{"h": "Гідність і рівність", "p": ["<span class='term'>Гідність</span> — цінність кожної людини від народження. <span class='term'>Рівність</span> — усі люди мають однакові права незалежно від статі, віку, національності, віри, статків. У минулому рівності не було: раби, кріпаки, жінки без права голосу. Ці права здобуто в боротьбі."]}, {"h": "Права людини", "p": ["<b>Загальна декларація прав людини</b> — ООН, <b>10 грудня 1948</b> (День прав людини). Права: на життя, свободу, гідність, рівність перед законом, свободу думки й слова, освіту, працю, відпочинок. Права записані в Конституції України (розділ II)."]}, {"h": "Права дитини", "p": ["<b>Конвенція ООН про права дитини</b> (1989). Дитина — до 18 років. Права: на життя, ім'я і громадянство, сім'ю, здоров'я, освіту, відпочинок і гру, захист від насильства й експлуатації, власну думку. Обов'язки: навчатись, поважати права інших, слухатись батьків у законному, берегти природу. <b>1 червня</b> — День захисту дітей."]}, {"h": "Демократія", "p": ["<span class='term'>Демократія</span> (грец. «влада народу») — устрій, за якого народ обирає владу й контролює її. Ознаки: вибори, рівність, свобода слова, верховенство права, захист меншості. Народилась у Давніх Афінах. Україна — демократична держава. Демократія в класі: вибори старости, обговорення рішень, право кожного висловитись."]}], "remember": "Гідність — цінність кожного; рівність — однакові права для всіх. Декларація прав людини — 10 грудня 1948. Конвенція про права дитини — 1989; дитина — до 18. Демократія — влада народу: вибори, свобода слова, верховенство права; Афіни.", "cards": [{"f": "Рівність", "b": "Однакові права для всіх незалежно від статі, віку, національності, віри."}, {"f": "Загальна декларація прав людини", "b": "ООН, 10 грудня 1948 року."}, {"f": "Конвенція ООН про права дитини", "b": "1989 рік; дитина — особа до 18 років."}, {"f": "Три права дитини", "b": "На життя, освіту, захист від насильства (також ім'я, сім'я, гра, думка)."}, {"f": "Обов'язки дитини", "b": "Навчатись, поважати права інших, берегти природу."}, {"f": "Демократія", "b": "Влада народу: народ обирає владу через вибори й контролює її."}, {"f": "Де народилась демократія?", "b": "У Давніх Афінах (Греція)."}, {"f": "День захисту дітей", "b": "1 червня."}], "quiz": [{"t": "choice", "q": "Що означає слово «демократія»?", "o": ["Влада багатих", "Влада народу", "Влада одного"], "a": 1, "e": "З грецької — влада народу."}, {"t": "choice", "q": "Де виникла демократія?", "o": ["У Римі", "В Афінах", "У Києві"], "a": 1, "e": "Давня Греція."}, {"t": "choice", "q": "Коли ухвалено Загальну декларацію прав людини?", "o": ["1948", "1989", "1996"], "a": 0, "e": "10 грудня 1948."}, {"t": "choice", "q": "До якого віку людина вважається дитиною за Конвенцією?", "o": ["До 14", "До 16", "До 18"], "a": 2, "e": "До 18 років."}, {"t": "choice", "q": "Що з цього — право дитини?", "o": ["На освіту", "На керування авто", "На роботу вночі"], "a": 0, "e": "Освіта — право."}, {"t": "choice", "q": "Що з цього — обов'язок дитини?", "o": ["Навчатись", "Мати смартфон", "Вибирати президента"], "a": 0, "e": "Навчання — обов'язок."}, {"t": "choice", "q": "Ознака демократії:", "o": ["Вільні вибори", "Влада у спадок", "Заборона критики"], "a": 0, "e": "Народ обирає владу."}, {"t": "choice", "q": "Рівність означає…", "o": ["усі однакові за зростом", "однакові права для всіх", "усі багаті"], "a": 1, "e": "Незалежно від відмінностей."}, {"t": "input", "q": "Коли День захисту дітей? Напиши число і місяць.", "a": ["1 червня", "першого червня"], "e": "1 червня."}, {"t": "choice", "q": "Як виявляється демократія в класі?", "o": ["Староста призначений назавжди", "Вибори старости, обговорення рішень", "Рішення ухвалює найсильніший"], "a": 1, "e": "Кожен має голос."}]}, {"id": "hi-etnohrafiia-tradytsii", "sec": "Україна і світ", "title": "Етнографія. Заняття українців. Традиції", "goal": "Ти знаєш, що вивчає етнографія, які були традиційні заняття українців і що таке традиція.", "learn": [{"h": "Етнографія", "p": ["<span class='term'>Етнографія</span> — наука про народи (<b>етноси</b>), їх побут, звичаї, культуру. <span class='term'>Етнос</span> (народ) — спільнота зі спільними мовою, культурою, історією, самоназвою. Українці — етнос; <b>етнографічні групи</b> українців: гуцули, бойки, лемки (Карпати), поліщуки (Полісся), слобожани, подоляни."]}, {"h": "Регіональні особливості", "p": ["Гуцули — вівчарство, трембіта, вишивка, ліжники; бойки — дерев'яні церкви; поліщуки — рибальство, ліс; Наддніпрянщина — хліборобство, білені хати. Різні вишивки, говірки, страви: борщ — усюди, але різний."]}, {"h": "Заняття українців у часі", "p": ["Давнина: полювання, збиральництво → землеробство й скотарство (трипільці) → ремесла (гончарство, ковальство, ткацтво, кожум'яцтво), торгівля → чумацтво (сіль і риба), козацтво → XIX ст.: заводи, шахти → сьогодні: ІТ, промисловість, агросектор. <b>Хліборобство</b> — головне заняття українців століттями."]}, {"h": "Традиція і багатокультурність", "p": ["<span class='term'>Традиція</span> — звичай, що передається з покоління в покоління: колядки, писанки, вишиванка, весільний обряд, обжинки. Традиції об'єднують і зберігають пам'ять. <span class='term'>Багатокультурність</span> — в Україні живуть різні народи: українці, кримські татари, євреї, поляки, угорці, румуни, болгари, гагаузи (Бессарабія!) та ін. Їхні культури взаємно збагачуються. Повага до інших культур — ознака сучасної держави."]}], "remember": "Етнографія — наука про народи. Етнографічні групи: гуцули, бойки, лемки, поліщуки. Головне заняття українців — хліборобство; ремесла, чумацтво, козацтво. Традиція — звичай із покоління в покоління. Багатокультурність — багато народів в Україні.", "cards": [{"f": "Етнос", "b": "Народ: спільнота зі спільними мовою, культурою, історією."}, {"f": "Етнографічні групи українців Карпат", "b": "Гуцули, бойки, лемки."}, {"f": "Поліщуки", "b": "Українці Полісся — лісового й болотистого півночі."}, {"f": "Головне заняття українців століттями", "b": "Хліборобство."}, {"f": "Чумаки", "b": "Торговці, що возили сіль і рибу з Криму й Причорномор'я."}, {"f": "Традиція", "b": "Звичай, що передається з покоління в покоління."}, {"f": "Багатокультурність", "b": "Співжиття різних народів і культур в одній країні."}, {"f": "Народи Бессарабії (півдня Одещини)", "b": "Українці, болгари, гагаузи, молдовани, росіяни, албанці та ін."}], "quiz": [{"t": "choice", "q": "Етнографія вивчає…", "o": ["народи, їх побут і культуру", "монети", "карти"], "a": 0, "e": "Наука про народи."}, {"t": "choice", "q": "Гуцули живуть…", "o": ["на Поліссі", "у Карпатах", "у степу"], "a": 1, "e": "Карпатські горяни."}, {"t": "choice", "q": "Трембіта — музичний інструмент…", "o": ["гуцулів", "поліщуків", "слобожан"], "a": 0, "e": "Довга гуцульська труба."}, {"t": "choice", "q": "Головне заняття українців століттями —", "o": ["мореплавство", "хліборобство", "гірництво"], "a": 1, "e": "Чорноземи."}, {"t": "choice", "q": "Хто такі чумаки?", "o": ["Козацькі старшини", "Торговці сіллю й рибою", "Ковалі"], "a": 1, "e": "Возили сіль з Криму."}, {"t": "choice", "q": "Традиція — це…", "o": ["мода", "звичай, що передається поколіннями", "закон"], "a": 1, "e": "Колядки, писанки, вишиванка."}, {"t": "choice", "q": "Що таке багатокультурність?", "o": ["Багато музеїв", "Співжиття різних народів і культур", "Багато мов у школі"], "a": 1, "e": "Україна — багатокультурна."}, {"t": "choice", "q": "Який народ живе в Криму поряд з українцями і має свою мову й культуру?", "o": ["Кримські татари", "Гуцули", "Бойки"], "a": 0, "e": "Кримські татари — корінний народ."}, {"t": "input", "q": "Як називають українців Полісся?", "a": ["поліщуки"], "e": "Поліщуки."}]}, {"id": "hi-ukraina-svit", "sec": "Україна і світ", "title": "Україна, Європа і світ. Шлях до незалежності", "goal": "Ти знаєш головні дати історії України та зв'язки України з Європою і світом.", "learn": [{"h": "Головні дати", "p": ["<b>988</b> — хрещення Русі Володимиром. <b>XI ст.</b> — Ярослав Мудрий, Софія Київська. <b>1187</b> — перша згадка «Україна». <b>1240</b> — монголи зруйнували Київ. <b>1648</b> — повстання Богдана Хмельницького, козацька держава. <b>1775</b> — знищення Запорозької Січі. <b>1840</b> — «Кобзар» Шевченка. <b>1917–1921</b> — Українська революція, УНР (Михайло Грушевський). <b>1932–1933</b> — Голодомор. <b>24 серпня 1991</b> — Незалежність; <b>1 грудня 1991</b> — референдум. <b>1996</b> — Конституція. <b>2014</b> — Революція Гідності, початок російської агресії. <b>24 лютого 2022</b> — повномасштабне вторгнення."]}, {"h": "Україна і Європа", "p": ["Україна завжди була частиною Європи: торгові шляхи через Київ, шлюби князівен із королями (Анна Ярославна — королева Франції), Магдебурзьке право в містах, університети (Острозька академія 1576, Києво-Могилянська 1615). Сьогодні Україна прагне до <b>Європейського Союзу</b> (кандидат з 2022) і <b>НАТО</b>. Синьо-жовтий прапор і європейський прапор — символи вибору."]}, {"h": "Україна і світ", "p": ["Україна — член <b>ООН</b> з 1945 (одна із засновниць). Українці відомі світу: Шевченко, Леся Українка, Сікорський (вертольоти), Корольов (космос), Малевич, Лисенко, Леонтович («Щедрик»). Українська діаспора — понад 20 млн людей. Світ підтримує Україну у війні проти Росії."]}, {"h": "Громадянин і Батьківщина", "p": ["Патріотизм — любов і праця для країни; громадянська відповідальність — участь у житті громади, повага до закону, захист прав інших. Історію творять не лише правителі, а й звичайні люди — і кожен із нас."]}], "remember": "988 — хрещення; 1187 — «Україна»; 1240 — монголи; 1648 — Хмельницький; 1917 — УНР; 1991 — Незалежність; 1996 — Конституція; 2014 — Революція Гідності; 2022 — вторгнення. Україна — засновниця ООН (1945), кандидат в ЄС (2022). Анна Ярославна — королева Франції.", "cards": [{"f": "988", "b": "Хрещення Русі князем Володимиром."}, {"f": "1240", "b": "Монголи зруйнували Київ."}, {"f": "1648", "b": "Початок повстання Богдана Хмельницького."}, {"f": "1917–1921", "b": "Українська революція, УНР; Михайло Грушевський."}, {"f": "1932–1933", "b": "Голодомор."}, {"f": "24 серпня 1991", "b": "Проголошення незалежності України."}, {"f": "2014", "b": "Революція Гідності; початок російської агресії."}, {"f": "24 лютого 2022", "b": "Повномасштабне вторгнення Росії."}, {"f": "Анна Ярославна", "b": "Дочка Ярослава Мудрого, королева Франції."}, {"f": "Коли Україна стала членом ООН?", "b": "1945 — одна із засновниць."}], "quiz": [{"t": "choice", "q": "Коли Володимир хрестив Русь?", "o": ["988", "1187", "1240"], "a": 0, "e": "988 рік."}, {"t": "choice", "q": "Що сталось 1240 року?", "o": ["Хрещення Русі", "Монголи зруйнували Київ", "Незалежність"], "a": 1, "e": "Монгольська навала."}, {"t": "choice", "q": "Хто очолив повстання 1648 року?", "o": ["Іван Мазепа", "Богдан Хмельницький", "Іван Сірко"], "a": 1, "e": "Козацька держава."}, {"t": "choice", "q": "Хто був головою Центральної Ради УНР?", "o": ["Михайло Грушевський", "Тарас Шевченко", "Іван Франко"], "a": 0, "e": "Грушевський — історик і політик."}, {"t": "input", "q": "Коли проголошено незалежність України? Напиши дату (число, місяць, рік).", "a": ["24 серпня 1991", "24 серпня 1991 року", "24.08.1991"], "e": "24 серпня 1991."}, {"t": "choice", "q": "Що таке Голодомор?", "o": ["Штучний голод 1932–1933", "Битва", "Свято врожаю"], "a": 0, "e": "Геноцид українського народу."}, {"t": "choice", "q": "Коли почалось повномасштабне вторгнення Росії?", "o": ["24 лютого 2022", "24 серпня 1991", "1 грудня 2014"], "a": 0, "e": "24 лютого 2022."}, {"t": "choice", "q": "Ким стала Анна Ярославна?", "o": ["Королевою Франції", "Княгинею Києва", "Царицею"], "a": 0, "e": "Дочка Ярослава Мудрого."}, {"t": "choice", "q": "Україна — засновниця…", "o": ["ООН", "ЄС", "НАТО"], "a": 0, "e": "Член ООН з 1945 р."}, {"t": "choice", "q": "Що сталось 2014 року?", "o": ["Конституція", "Революція Гідності і початок агресії Росії", "Незалежність"], "a": 1, "e": "Революція Гідності."}, {"t": "choice", "q": "Хто творить історію?", "o": ["Тільки правителі", "Правителі і звичайні люди", "Ніхто"], "a": 1, "e": "Кожен із нас."}]}]};

// ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/[^a-z0-9а-яіїєґ' \-]/gi,"").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
