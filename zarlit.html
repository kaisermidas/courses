<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Зарубіжна література · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}.mode .ic.d{background:#FFE8D6}.mode .ic.e{background:#F0E4FF}
  .lvl-title{color:var(--ink-2);font-size:14px;margin:22px 0 8px;padding-left:2px}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
  .rev{margin-top:10px;font-size:15px;color:var(--ink-2)}.rev i{color:var(--ink);font-style:normal;font-weight:600}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <div class="lvl-title">Перевірити себе</div>
    <button class="mode" onclick="openQuiz(1)"><div class="ic c">🙂</div><div><b>Легкий</b><span id="q1-count"></span></div><div class="st" id="st-q1"></div></button>
    <button class="mode" onclick="openQuiz(2)"><div class="ic d">🔥</div><div><b>Складний</b><span id="q2-count"></span></div><div class="st" id="st-q2"></div></button>
    <button class="mode" onclick="openQuiz(3)"><div class="ic e">💀</div><div><b>Дуже складний</b><span id="q3-count"></span></div><div class="st" id="st-q3"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <div id="r-review" style="display:none;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px"></div>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz(LEVEL)">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

const COURSE = {"id": "zarlit5", "title": "Зарубіжна література", "subtitle": "5 клас · 16 уроків за підручниками Ніколенко і Ковбасенка", "lessons": [{"id": "zl-vstup", "sec": "Вступ", "title": "Роль книжки в житті людини. Оригінал і переклад", "goal": "Ти знаєш, як з'явилася книжка, що таке зарубіжна література, оригінал і переклад.", "learn": [{"h": "Історія книжки", "p": ["Спочатку знання передавали <b>усно</b>. Потім — <b>глиняні таблички</b> (Вавилон), <b>папірусні сувої</b> (Єгипет), <b>пергамент</b> із телячої шкіри (місто Пергам), <b>паперові</b> рукописні книжки, і з XV ст. — <b>друковані</b> (Йоганн Гутенберг). Сьогодні є ще <b>електронні</b> та <b>аудіокниги</b>."]}, {"h": "Зарубіжна література", "p": ["<span class='term'>Зарубіжна література</span> — художні твори, створені за межами України мовами інших народів: англійська, німецька, японська література тощо."]}, {"h": "Оригінал і переклад", "p": ["<span class='term'>Оригінал</span> — текст тією мовою, якою його написав автор. <span class='term'>Переклад</span> — той самий твір іншою мовою. <span class='term'>Перекладач</span> має передати не лише зміст, а й стиль, настрій, гумор. Відомі українські перекладачі: Максим Рильський, Микола Лукаш, Григорій Кочур, Євген Попович."], "note": "Читаючи «Мауглі» українською, ми читаємо переклад; оригінал Кіплінг написав англійською."}], "remember": "Книжка: усне слово → глина → папірус → пергамент → папір → друк (Гутенберг) → електронна. Зарубіжна література — твори інших народів. Оригінал — мова автора, переклад — інша мова.", "cards": [{"f": "Зарубіжна література", "b": "Художні твори, створені поза межами України мовами інших народів."}, {"f": "Оригінал", "b": "Текст тією мовою, якою його написав автор."}, {"f": "Переклад", "b": "Твір, переданий іншою мовою."}, {"f": "Хто винайшов друкарський верстат у Європі?", "b": "Йоганн Гутенберг, XV століття."}, {"f": "Пергамент", "b": "Матеріал для письма з телячої шкіри; від назви міста Пергам."}, {"f": "Відомі українські перекладачі", "b": "Максим Рильський, Микола Лукаш, Григорій Кочур."}], "quiz": [{"t": "choice", "q": "З чого робили перші «книги» у Вавилоні?", "o": ["З паперу", "З глини", "З пергаменту"], "a": 1, "e": "Глиняні таблички."}, {"t": "choice", "q": "Папірус виготовляли…", "o": ["у Єгипті", "у Китаї", "у Греції"], "a": 0, "e": "З рослини папірус у Давньому Єгипті."}, {"t": "choice", "q": "Від чого походить назва «пергамент»?", "o": ["Від імені майстра", "Від назви міста Пергам", "Від слова «перо»"], "a": 1, "e": "Місто Пергам."}, {"t": "choice", "q": "Що таке оригінал?", "o": ["Найстаріша книжка", "Текст мовою, якою його написав автор", "Ілюстрована книжка"], "a": 1, "e": "Оригінал — авторська мова твору."}, {"t": "choice", "q": "«Мауглі» українською — це…", "o": ["оригінал", "переклад"], "a": 1, "e": "Кіплінг писав англійською."}, {"t": "input", "q": "Хто винайшов друкарський верстат у Європі? Напиши прізвище.", "a": ["гутенберг", "ґутенберг"], "e": "Йоганн Гутенберг."}, {"t": "choice", "q": "Що має передати гарний перекладач?", "o": ["Тільки зміст", "Зміст, стиль, настрій твору", "Тільки імена героїв"], "a": 1, "e": "Переклад — теж мистецтво."}, {"t": "tf", "q": "Зарубіжна література — це твори, написані в Україні іноземними мовами.", "a": false, "e": "Ні, це твори інших народів, створені за межами України."}], "quiz2": [{"t": "choice", "q": "Чому переклад — теж мистецтво?", "o": ["Треба передати стиль, гумор і настрій, а не лише слова", "Бо це складно", "Бо перекладач відомий"], "a": 0, "e": "Художній переклад."}, {"t": "choice", "q": "Що НЕ належить до зарубіжної літератури?", "o": ["«Мауглі» Кіплінга", "«Лось» Гуцала", "«Полліанна» Портер"], "a": 1, "e": "Українська література."}, {"t": "choice", "q": "Пергамент отримав назву від…", "o": ["міста Пергам", "імені майстра", "назви тварини"], "a": 0, "e": "Місто в Малій Азії."}, {"t": "input", "q": "Хто винайшов друкарський верстат у Європі?", "a": ["гутенберг", "йоганн гутенберг", "ґутенберг"], "e": "Гутенберг."}], "quiz3": [{"t": "choice", "q": "Чому один твір може мати кілька різних перекладів?", "o": ["Кожен перекладач по-своєму передає стиль оригіналу", "Перекладачі помиляються", "Так вимагає закон"], "a": 0, "e": "Художня інтерпретація."}, {"t": "choice", "q": "Чим друкована книжка змінила світ?", "o": ["Знання стали доступними багатьом, а не лише обраним", "Стала дорожчою", "Зникли бібліотеки"], "a": 0, "e": "Революція Гутенберга."}, {"t": "choice", "q": "Що втрачається найчастіше в перекладі?", "o": ["Гра слів і звучання", "Сюжет", "Імена героїв"], "a": 0, "e": "Каламбури важко передати."}, {"t": "input", "q": "Назви одного відомого українського перекладача.", "a": ["рильський", "лукаш", "кочур", "максим рильський", "микола лукаш", "григорій кочур"], "e": "Рильський, Лукаш, Кочур."}]}, {"id": "zl-kazky-narodiv", "sec": "Народні казки світу", "title": "Народні казки світу. Мандрівні сюжети. Японська казка «Момотаро»", "goal": "Ти знаєш ознаки народної казки, що таке мандрівний сюжет, і пам'ятаєш казку про Хлопчика-Персика.", "learn": [{"h": "Народна казка", "p": ["<span class='term'>Народна казка</span> — фольклорний твір про вигадані події, у якому добро перемагає зло. Види: про тварин, чарівні, побутові. У казках усіх народів схожі герої: молодший син, мачуха, дракон; але національний колорит різний."]}, {"h": "Мандрівний сюжет", "p": ["<span class='term'>Мандрівний сюжет</span> — сюжет, що повторюється в казках різних народів зі змінами: історія Попелюшки є в Європі, Китаї, Єгипті; «Пані Метелиця» схожа на українську «Про дідову й бабину дочку»."]}, {"h": "«Момотаро, або Хлопчик-Персик» (Японія)", "p": ["Бездітні дідусь і бабуся знайшли в річці великий <b>персик</b>, з якого вийшов хлопчик <b>Момотаро</b> («момо» — персик). Він виріс сильним і пішов на <b>Острів Чудовиськ</b> визволяти людей від злих <b>чортів (оні)</b>. Бабуся дала йому <b>просяні коржики</b>; дорогою за коржики до нього приєднались <b>собака, фазан і мавпа</b>. Разом вони перемогли чудовиськ, повернули награбовані скарби людям, і Момотаро повернувся до старих."], "note": "Національний колорит: персик, просяні коржики, фазан, чорти оні. Ідея: сміливість, доброта, дружба перемагають зло."}], "remember": "Мандрівний сюжет — повторюється в казках різних народів. Момотаро — хлопчик із персика; друзі: собака, фазан, мавпа; переміг чортів на Острові Чудовиськ; просяні коржики.", "cards": [{"f": "Народна казка", "b": "Фольклорний твір про вигадані події, де добро перемагає зло."}, {"f": "Мандрівний сюжет", "b": "Сюжет, що повторюється в казках різних народів зі змінами (Попелюшка)."}, {"f": "Звідки з'явився Момотаро?", "b": "З великого персика, який знайшли дідусь і бабуся."}, {"f": "Друзі Момотаро", "b": "Собака, фазан і мавпа."}, {"f": "Куди вирушив Момотаро?", "b": "На Острів Чудовиськ битися з чортами (оні)."}, {"f": "Що дала бабуся в дорогу?", "b": "Просяні коржики."}], "quiz": [{"t": "choice", "q": "Що таке мандрівний сюжет?", "o": ["Казка про подорож", "Сюжет, що повторюється в казках різних народів", "Довга казка"], "a": 1, "e": "Той самий сюжет у різних народів."}, {"t": "choice", "q": "З чого народився Момотаро?", "o": ["З яйця", "З персика", "З квітки"], "a": 1, "e": "«Момо» — персик."}, {"t": "choice", "q": "Хто НЕ був супутником Момотаро?", "o": ["Собака", "Кіт", "Фазан"], "a": 1, "e": "Собака, фазан і мавпа."}, {"t": "choice", "q": "Куди пішов Момотаро?", "o": ["На Острів Чудовиськ", "У столицю", "На гору Фудзі"], "a": 0, "e": "Визволяти людей від чортів."}, {"t": "choice", "q": "Що дала бабуся Момотаро в дорогу?", "o": ["Рисові кульки", "Просяні коржики", "Меч"], "a": 1, "e": "За коржики він здобув друзів."}, {"t": "choice", "q": "Із якої країни казка про Момотаро?", "o": ["Китай", "Японія", "Індія"], "a": 1, "e": "Японська народна казка."}, {"t": "input", "q": "Як називають злих чортів у японській казці?", "a": ["оні"], "e": "Оні."}, {"t": "choice", "q": "Чого вчить казка?", "o": ["Не ходити до річки", "Сміливість, доброта й дружба перемагають зло", "Персики корисні"], "a": 1, "e": "Момотаро переміг завдяки друзям і сміливості."}], "quiz2": [{"t": "choice", "q": "Що доводить існування мандрівних сюжетів?", "o": ["Народи мають схожі казки, хоч жили далеко", "Що казки вигадали пізно", "Що всі казки однакові"], "a": 0, "e": "Спільні мотиви."}, {"t": "choice", "q": "Які деталі надають «Момотаро» японського колориту?", "o": ["Персик, просяні коржики, фазан, чорти оні", "Королі й замки", "Сніг і ведмеді"], "a": 0, "e": "Національні реалії."}, {"t": "choice", "q": "Чому супутники пішли за Момотаро?", "o": ["Він поділився з ними коржиками", "Вони боялись", "Їх покликав дідусь"], "a": 0, "e": "Доброта."}, {"t": "input", "q": "Що означає «момо» японською?", "a": ["персик"], "e": "Персик."}], "quiz3": [{"t": "choice", "q": "Чому чудесне народження героя — типовий казковий мотив?", "o": ["Показує обраність героя з самого початку", "Це японська вигадка", "Так простіше"], "a": 0, "e": "Є в багатьох народів."}, {"t": "choice", "q": "Що спільного між Момотаро й українським Котигорошком?", "o": ["Незвичайне народження й перемога над злом", "Обидва з персика", "Обидва японці"], "a": 0, "e": "Мандрівний мотив."}, {"t": "choice", "q": "Чому в казках різних народів різні тварини-помічники?", "o": ["Кожен народ описує тварин свого краю", "Випадково", "Так вирішили перекладачі"], "a": 0, "e": "Національний колорит."}, {"t": "input", "q": "Куди вирушив Момотаро?", "a": ["на острів чудовиськ", "острів чудовиськ", "до чортів"], "e": "На Острів Чудовиськ."}]}, {"id": "zl-shakal-metelytsia", "sec": "Народні казки світу", "title": "Індійська казка «Фарбований шакал». Брати Ґрімм «Пані Метелиця»", "goal": "Ти пам'ятаєш дві казки, знаєш, хто такі брати Ґрімм, і бачиш схожість з українськими казками.", "learn": [{"h": "«Фарбований шакал» (Індія, «Панчатантра»)", "p": ["Шакал <b>Чандарава</b>, тікаючи від собак, упав у чан із <b>синьою фарбою</b>. Звірі злякались невідомого синього звіра; він сказав, що його послав сам Індра правити лісом, і став царем. Вигнав шакалів, наблизив левів і тигрів. Одної ночі почув шакалів вий і <b>завив сам</b> — його впізнали й розірвали."], "note": "Той самий мандрівний сюжет, що й у «Фарбованому Лисі» Франка! Ідея: обман і зневага до своїх караються."}, {"h": "Брати Ґрімм", "p": ["<b>Якоб і Вільгельм Ґрімм</b> — німецькі вчені-мовознавці XIX ст. Збирали й записували народні казки Німеччини: «Пані Метелиця», «Попелюшка», «Бременські музиканти», «Білосніжка», «Гензель і Ґретель»."]}, {"h": "«Пані Метелиця»", "p": ["У вдови було дві дочки: рідна — <b>ледача й негарна</b>, і пасербиця — <b>працьовита й гарна</b>. Пасербиця впустила веретено в колодязь, стрибнула за ним і потрапила до <b>пані Метелиці</b>. Дорогою вийняла хліб з печі, обтрусила яблуню; у Метелиці старанно збивала перину (тоді на землі йде сніг). За працю її обсипало <b>золотом</b>. Ледача дочка все зробила навпаки — і її облило <b>смолою</b>, що не відмивалася."], "note": "Схоже з українською «Про дідову й бабину дочку». Ідея: працьовитість винагороджується, лінь карається. Антитеза: дві дочки."}], "remember": "«Фарбований шакал» — індійська казка (Панчатантра), той самий сюжет, що «Фарбований Лис». Брати Якоб і Вільгельм Ґрімм — німецькі збирачі казок. «Пані Метелиця»: пасербиця — золото, ледача дочка — смола.", "cards": [{"f": "Хто такі брати Ґрімм?", "b": "Якоб і Вільгельм — німецькі вчені, що записували народні казки."}, {"f": "«Фарбований шакал» — звідки?", "b": "Індійська казка зі збірки «Панчатантра»."}, {"f": "Який український твір схожий на «Фарбованого шакала»?", "b": "«Фарбований Лис» Івана Франка."}, {"f": "Чим нагороджено пасербицю в «Пані Метелиці»?", "b": "Обсипано золотом."}, {"f": "Чим покарано ледачу дочку?", "b": "Облито смолою."}, {"f": "Що відбувається, коли Метелиця збиває перину?", "b": "На землі йде сніг."}, {"f": "Українська казка, схожа на «Пані Метелицю»", "b": "«Про дідову й бабину дочку»."}], "quiz": [{"t": "choice", "q": "У що впав шакал Чандарава?", "o": ["У річку", "У чан із синьою фарбою", "У яму"], "a": 1, "e": "Став синім невідомим звіром."}, {"t": "choice", "q": "Як викрили шакала?", "o": ["Дощ змив фарбу", "Він завив, почувши шакалів", "Його впізнала мати"], "a": 1, "e": "Природа взяла своє — як у Франка."}, {"t": "choice", "q": "Який твір Франка має той самий сюжет?", "o": ["«Лис Микита»", "«Фарбований Лис»", "«Захар Беркут»"], "a": 1, "e": "Мандрівний сюжет."}, {"t": "choice", "q": "Хто такі брати Ґрімм?", "o": ["Німецькі збирачі казок", "Англійські поети", "Датські письменники"], "a": 0, "e": "Якоб і Вільгельм Ґрімм, Німеччина."}, {"t": "choice", "q": "Як пасербиця потрапила до пані Метелиці?", "o": ["Через ліс", "Стрибнула в колодязь за веретеном", "Її відвела мачуха"], "a": 1, "e": "Через колодязь."}, {"t": "choice", "q": "Що робила пасербиця у пані Метелиці?", "o": ["Збивала перину, і на землі йшов сніг", "Варила їжу", "Пряла"], "a": 0, "e": "Пір'я з перини — сніг."}, {"t": "choice", "q": "Чим обсипало пасербицю?", "o": ["Золотом", "Сріблом", "Квітами"], "a": 0, "e": "За працьовитість."}, {"t": "choice", "q": "Чим облило ледачу дочку?", "o": ["Водою", "Смолою", "Молоком"], "a": 1, "e": "Смола не відмивалась до кінця життя."}, {"t": "tf", "q": "«Пані Метелиця» схожа на українську казку «Про дідову й бабину дочку».", "a": true, "e": "Так, це мандрівний сюжет."}, {"t": "input", "q": "Як називається протиставлення двох героїв (працьовита — ледача)?", "a": ["антитеза"], "e": "Антитеза."}], "quiz2": [{"t": "choice", "q": "Що спільного у «Фарбованого шакала» і «Фарбованого Лиса»?", "o": ["Той самий мандрівний сюжет", "Той самий автор", "Обидва японські"], "a": 0, "e": "Панчатантра й Франко."}, {"t": "choice", "q": "Чому пасербицю нагороджено золотом?", "o": ["Вона працювала старанно й допомагала", "Вона гарна", "Їй пощастило"], "a": 0, "e": "Праця винагороджена."}, {"t": "choice", "q": "Що символізує перина пані Метелиці?", "o": ["Сніг на землі", "Хмари", "Багатство"], "a": 0, "e": "Пояснення природного явища."}, {"t": "input", "q": "Хто збирав німецькі народні казки?", "a": ["брати грімм", "грімм", "якоб і вільгельм грімм"], "e": "Брати Ґрімм."}], "quiz3": [{"t": "choice", "q": "Чому шакал загинув саме через виття?", "o": ["Природу неможливо приховати обманом", "Він розлютив звірів", "Він захрип"], "a": 0, "e": "Ідея твору."}, {"t": "choice", "q": "Яка українська казка має сюжет, схожий на «Пані Метелицю»?", "o": ["«Про дідову й бабину дочку»", "«Яйце-райце»", "«Летючий корабель»"], "a": 0, "e": "Мандрівний сюжет."}, {"t": "choice", "q": "Чим казки «Панчатантри» відрізняються від європейських про тварин?", "o": ["Вони об'єднані в збірку з повчальною метою навчати правителів", "Вони без моралі", "У них немає тварин"], "a": 0, "e": "Дидактична збірка."}, {"t": "input", "q": "Як звали шакала в індійській казці?", "a": ["чандарава"], "e": "Чандарава."}]}, {"id": "zl-andersen", "sec": "Літературні казки світу", "title": "Ганс Крістіан Андерсен. «Снігова королева»", "goal": "Ти знаєш, що таке літературна казка, і пам'ятаєш сюжет і героїв «Снігової королеви».", "learn": [{"h": "Літературна казка", "p": ["<span class='term'>Літературна казка</span> — казка з конкретним автором; виникла під впливом народної, але має авторський стиль, глибші характери, часто сумний або філософський зміст."]}, {"h": "Андерсен (1805–1875)", "p": ["Данський казкар із міста <b>Оденсе</b>, син чоботаря. Написав понад 150 казок: «Снігова королева», «Русалонька», «Гидке каченя», «Дюймовочка», «Принцеса на горошині», «Стійкий олов'яний солдатик». Його день народження, <b>2 квітня</b>, — Міжнародний день дитячої книги."]}, {"h": "Сюжет «Снігової королеви»", "p": ["Казка з <b>семи оповідань</b>. Злий троль зробив <b>дзеркало</b>, що все добре показувало потворним; воно розбилось, і скалки потрапляли людям в очі та серце. <b>Кай</b> і <b>Герда</b> — друзі, що вирощували троянди. Скалка потрапила Каю в серце й око — він став злим, а тоді <b>Снігова королева</b> забрала його у свій палац. Герда вирушила на пошуки: <b>жінка-чарівниця</b> з садом, <b>ворон</b>, <b>принц і принцеса</b> (дали карету), <b>маленька розбійниця</b> (дала північного оленя), <b>лапландка</b> і <b>фінка</b>. У палаці Кай складав із крижин слово «вічність». Герда обняла його і заплакала — гарячі сльози розтопили крижину в серці, Кай заплакав, і скалка вийшла. Вони повернулись додому — уже дорослі."], "note": "Ідея: любов і вірне серце сильніші за холодний розум і зло. Герда — щира, віддана, смілива."}], "remember": "Андерсен — Данія, Оденсе, 2 квітня. «Снігова королева» — 7 оповідань: дзеркало троля → скалка в серці Кая → Снігова королева забирає Кая → Герда шукає (чарівниця, ворон, принц і принцеса, маленька розбійниця, лапландка, фінка) → сльози Герди рятують Кая.", "cards": [{"f": "Літературна казка", "b": "Казка з конкретним автором; авторський стиль, глибші характери."}, {"f": "Андерсен — країна, місто", "b": "Данія, Оденсе."}, {"f": "2 квітня — який день?", "b": "Міжнародний день дитячої книги — день народження Андерсена."}, {"f": "Скільки оповідань у «Сніговій королеві»?", "b": "Сім."}, {"f": "Чому Кай став злим?", "b": "Скалки дзеркала троля потрапили йому в око і серце."}, {"f": "Кого зустріла Герда дорогою?", "b": "Жінку-чарівницю, ворона, принца і принцесу, маленьку розбійницю, лапландку, фінку."}, {"f": "Хто дав Герді північного оленя?", "b": "Маленька розбійниця."}, {"f": "Як Герда врятувала Кая?", "b": "Обняла й заплакала — гарячі сльози розтопили крижину в серці."}, {"f": "Яке слово Кай складав із крижин?", "b": "«Вічність»."}], "quiz": [{"t": "choice", "q": "З якої країни Андерсен?", "o": ["Данія", "Німеччина", "Норвегія"], "a": 0, "e": "Данський казкар з Оденсе."}, {"t": "choice", "q": "Чому 2 квітня — Міжнародний день дитячої книги?", "o": ["Це день народження Андерсена", "Це день першої казки", "Так вирішила ООН випадково"], "a": 0, "e": "На честь Андерсена."}, {"t": "choice", "q": "Скільки оповідань у «Сніговій королеві»?", "o": ["Три", "Сім", "Дванадцять"], "a": 1, "e": "Сім."}, {"t": "choice", "q": "Що зробило Кая злим?", "o": ["Сніг", "Скалка чарівного дзеркала в оці й серці", "Сварка з Гердою"], "a": 1, "e": "Дзеркало троля."}, {"t": "choice", "q": "Хто дав Герді північного оленя?", "o": ["Принцеса", "Маленька розбійниця", "Фінка"], "a": 1, "e": "Маленька розбійниця."}, {"t": "choice", "q": "Хто дав Герді золоту карету?", "o": ["Ворон", "Принц і принцеса", "Чарівниця"], "a": 1, "e": "Принц і принцеса."}, {"t": "choice", "q": "Яке слово Кай складав із крижин?", "o": ["Любов", "Вічність", "Зима"], "a": 1, "e": "«Вічність» — за нього королева обіцяла весь світ і ковзани."}, {"t": "choice", "q": "Що розтопило крижину в серці Кая?", "o": ["Сонце", "Гарячі сльози Герди", "Вогонь"], "a": 1, "e": "Сила любові."}, {"t": "input", "q": "Як звали дівчинку, що врятувала Кая?", "a": ["герда"], "e": "Герда."}, {"t": "choice", "q": "Головна думка казки:", "o": ["Зима небезпечна", "Любов і вірне серце перемагають холод і зло", "Не грайся з дзеркалами"], "a": 1, "e": "Серце сильніше за холодний розум."}], "quiz2": [{"t": "choice", "q": "Що символізує крижане серце Кая?", "o": ["Втрату здатності любити й співчувати", "Хворобу", "Зиму"], "a": 0, "e": "Алегорія."}, {"t": "choice", "q": "Чому Герда перемогла без зброї й чарів?", "o": ["Її силою була любов і вірність", "Їй допомогла королева", "Вона була сильніша"], "a": 0, "e": "Ідея казки."}, {"t": "choice", "q": "Яку роль виконує маленька розбійниця?", "o": ["Помічниці, яка попри грубість має добре серце", "Головного ворога", "Оповідачки"], "a": 0, "e": "Неоднозначний персонаж."}, {"t": "input", "q": "Яке слово Кай складав із крижин?", "a": ["вічність"], "e": "«Вічність»."}], "quiz3": [{"t": "choice", "q": "Чому казка починається з розповіді про дзеркало троля?", "o": ["Пояснює причину всіх подій і задає тему спотвореного погляду", "Це прикраса", "Щоб було довше"], "a": 0, "e": "Композиційний зачин."}, {"t": "choice", "q": "Що означає, що Герда й Кай повернулись дорослими?", "o": ["Подорож змінила їх, дитинство минуло", "Минуло багато років дарма", "Це помилка перекладу"], "a": 0, "e": "Мотив дорослішання."}, {"t": "choice", "q": "Чому в казці стільки жіночих образів-помічниць?", "o": ["Кожна дає Герді щось потрібне для наступного кроку", "Випадково", "Автор не любив чоловіків"], "a": 0, "e": "Композиція мандрівки."}, {"t": "input", "q": "Скільки оповідань у «Сніговій королеві»?", "a": ["7", "сім"], "e": "Сім."}]}, {"id": "zl-wilde", "sec": "Літературні казки світу", "title": "Оскар Вайлд. «Хлопчик-зірка»", "goal": "Ти пам'ятаєш, як Хлопчик-зірка змінився від жорстокості до добра, і знаєш, хто такий Оскар Вайлд.", "learn": [{"h": "Оскар Вайлд (1854–1900)", "p": ["Англійський (ірландський) письменник, народився в <b>Дубліні</b>. Автор казок «Хлопчик-зірка», «Щасливий принц», «Соловей і троянда», роману «Портрет Доріана Ґрея». У казках — краса, милосердя й любов."]}, {"h": "Сюжет", "p": ["Двоє лісорубів узимку знайшли в лісі, де впала зірка, дитину в золотому плащі. Бідний лісоруб узяв її додому. <b>Хлопчик-зірка</b> виріс дуже <b>гарним, але гордим і жорстоким</b>: кидав каміння в жебраків, мучив тварин, зневажав інших дітей. Коли до села прийшла <b>жебрачка</b> й назвалась його матір'ю, він <b>відштовхнув її</b>. За це став <b>потворним</b>, як жаба, і всі його відвернулись. Три роки він шукав матір, страждав. Потрапив у рабство до злого <b>чаклуна</b>, який наказав приносити монети з білого, жовтого й червоного золота. Хлопчик знаходив їх із допомогою <b>зайця</b>, якого врятував, але щоразу віддавав монету <b>прокаженому</b>, хоч знав, що чаклун його битиме. За третім разом до нього повернулась краса; жебрачка і прокажений виявились <b>королевою і королем</b> — його батьками. Він став королем і правив справедливо, але недовго."], "note": "Ідея: справжня краса — у доброті й милосерді; жорстокість спотворює людину, а каяття й самопожертва очищають."}], "remember": "Вайлд — Дублін. Хлопчик-зірка: гарний, але жорстокий → відштовхнув матір-жебрачку → став потворним → шукав матір, три рази віддав золото прокаженому → повернулась краса → батьки — король і королева.", "cards": [{"f": "Оскар Вайлд — країна, місто", "b": "Ірландія, Дублін (писав англійською)."}, {"f": "Звідки взявся Хлопчик-зірка?", "b": "Лісоруби знайшли дитину в золотому плащі там, де впала зірка."}, {"f": "Який вчинок покарано потворністю?", "b": "Хлопчик відштовхнув жебрачку, яка назвалась його матір'ю."}, {"f": "Що наказував чаклун?", "b": "Приносити монети з білого, жовтого й червоного золота."}, {"f": "Кому Хлопчик віддавав золото?", "b": "Прокаженому — попри побої чаклуна."}, {"f": "Хто допомагав знаходити золото?", "b": "Заєць, якого хлопчик звільнив із пастки."}, {"f": "Ким виявились жебрачка й прокажений?", "b": "Королевою й королем — батьками Хлопчика-зірки."}], "quiz": [{"t": "choice", "q": "Де народився Оскар Вайлд?", "o": ["У Лондоні", "У Дубліні", "У Парижі"], "a": 1, "e": "Дублін, Ірландія."}, {"t": "choice", "q": "Хто знайшов Хлопчика-зірку?", "o": ["Мисливці", "Лісоруби", "Пастухи"], "a": 1, "e": "Двоє лісорубів узимку."}, {"t": "choice", "q": "Яким виріс Хлопчик-зірка?", "o": ["Гарним, але гордим і жорстоким", "Добрим і скромним", "Потворним і злим"], "a": 0, "e": "Краса без доброти."}, {"t": "choice", "q": "За що Хлопчик-зірка став потворним?", "o": ["За брехню", "За те, що відштовхнув матір-жебрачку", "За крадіжку"], "a": 1, "e": "Найбільший гріх — зневага до матері."}, {"t": "choice", "q": "Хто допомагав йому знаходити золото?", "o": ["Заєць", "Вовк", "Ворон"], "a": 0, "e": "Врятований заєць."}, {"t": "choice", "q": "Кому хлопчик віддавав знайдене золото?", "o": ["Чаклуну", "Прокаженому", "Матері"], "a": 1, "e": "Жертвував собою заради хворого."}, {"t": "choice", "q": "Ким виявилась жебрачка?", "o": ["Чаклункою", "Королевою, його матір'ю", "Сусідкою"], "a": 1, "e": "А прокажений — королем."}, {"t": "choice", "q": "Скільки років Хлопчик-зірка шукав матір?", "o": ["Один", "Три", "Десять"], "a": 1, "e": "Три роки."}, {"t": "choice", "q": "Головна думка казки:", "o": ["Краса — головне", "Справжня краса — у доброті й милосерді", "Не довіряй чаклунам"], "a": 1, "e": "Жорстокість спотворює, каяття очищає."}, {"t": "tf", "q": "Хлопчик-зірка правив довго й щасливо до старості.", "a": false, "e": "Ні, він правив справедливо, але помер через три роки."}], "quiz2": [{"t": "choice", "q": "Чому саме потворність стала покаранням Хлопчика-зірки?", "o": ["Зовнішня краса відображала внутрішню — і навпаки", "Це випадковість", "Так вирішив чаклун"], "a": 0, "e": "Символіка."}, {"t": "choice", "q": "Чому хлопчик віддавав золото прокаженому, ризикуючи побиттям?", "o": ["Він змінився й обрав співчуття замість власної вигоди", "Боявся чаклуна", "Золото було фальшиве"], "a": 0, "e": "Переродження героя."}, {"t": "choice", "q": "Ким виявились жебрачка й прокажений?", "o": ["Королевою і королем — батьками хлопчика", "Чаклунами", "Слугами"], "a": 0, "e": "Несподівана розв'язка."}, {"t": "input", "q": "Скільки років Хлопчик-зірка шукав матір?", "a": ["3", "три"], "e": "Три роки."}], "quiz3": [{"t": "choice", "q": "Чому казка закінчується смертю героя через три роки правління?", "o": ["Автор показує: спокута дорога, а добро — не нагорода, а вибір", "Це помилка", "Щоб було сумно"], "a": 0, "e": "Філософський фінал."}, {"t": "choice", "q": "Яку роль виконує заєць у сюжеті?", "o": ["Врятована тварина віддячує — доброта повертається", "Він чарівник", "Він ворог"], "a": 0, "e": "Мотив вдячності."}, {"t": "choice", "q": "Що спільного між «Хлопчиком-зіркою» і «Сніговою королевою»?", "o": ["Обидві про переродження серця", "Обидві про зиму", "Обидві про королів"], "a": 0, "e": "Спільна ідея."}, {"t": "input", "q": "У якому місті народився Оскар Вайлд?", "a": ["дублін", "у дубліні"], "e": "Дублін."}]}, {"id": "zl-dahl", "sec": "Літературні казки світу", "title": "Роальд Дал. «Чарлі і шоколадна фабрика»", "goal": "Ти пам'ятаєш героїв повісті-казки і розумієш, за що Чарлі отримав фабрику.", "learn": [{"h": "Роальд Дал (1916–1990)", "p": ["Британський письменник норвезького походження, народився в <b>Уельсі</b>. Був льотчиком. Книжки: «Чарлі і шоколадна фабрика», «Матильда», «Джеймс і гігантський персик», «ВДВ». Гумор, фантазія, іронія щодо поганих дорослих і зіпсованих дітей."]}, {"h": "Сюжет", "p": ["<b>Чарлі Бакет</b> живе в бідній родині (батьки, чотири бабусі й дідусі — <b>дідусь Джо</b>); шоколадку отримує лише раз на рік. Дивак-кондитер <b>Віллі Вонка</b> ховає <b>п'ять золотих квитків</b> у шоколадки — переможці побачать фабрику. Квитки знаходять: ненажера <b>Авґустус Ґлуп</b>, зіпсована <b>Верука Солт</b>, жуйколюбка <b>Вайолет Борегард</b>, телеманіяк <b>Майк Тіві</b> — і Чарлі. На фабриці працюють маленькі <b>умпа-лумпи</b>. Кожна зіпсована дитина через свій недолік вибуває: Авґустус падає в шоколадну річку, Вайолет стає чорницею, Веруку скидають білки в сміттєпровід, Майка зменшує телевізор. Чарлі, чесний і скромний, залишається останнім — і Вонка <b>дарує йому фабрику</b>."], "note": "Ідея: скромність, чесність і доброта варті більше за багатство; жадібність, розбещеність і залежності карають самі себе."}], "remember": "Дал — Уельс. Чарлі Бакет, дідусь Джо, Віллі Вонка, п'ять золотих квитків; Авґустус Ґлуп (ненажера), Верука Солт (зіпсована), Вайолет Борегард (жуйка), Майк Тіві (телевізор); умпа-лумпи; Чарлі отримує фабрику.", "cards": [{"f": "Хто написав «Чарлі і шоколадну фабрику»?", "b": "Роальд Дал, британський письменник норвезького походження."}, {"f": "Скільки золотих квитків сховав Вонка?", "b": "П'ять."}, {"f": "Хто пішов з Чарлі на фабрику?", "b": "Дідусь Джо."}, {"f": "Умпа-лумпи", "b": "Маленькі працівники фабрики Вонки."}, {"f": "Авґустус Ґлуп", "b": "Ненажера; впав у шоколадну річку."}, {"f": "Вайолет Борегард", "b": "Жувала жуйку і стала чорницею."}, {"f": "Верука Солт", "b": "Зіпсована дівчинка; білки скинули в сміттєпровід."}, {"f": "Майк Тіві", "b": "Телеманіяк; його зменшив телевізор."}, {"f": "Що отримав Чарлі?", "b": "Усю фабрику Вонки."}], "quiz": [{"t": "choice", "q": "Хто такий Віллі Вонка?", "o": ["Учитель Чарлі", "Власник шоколадної фабрики", "Дідусь Чарлі"], "a": 1, "e": "Дивак-кондитер."}, {"t": "choice", "q": "Скільки було золотих квитків?", "o": ["Три", "П'ять", "Десять"], "a": 1, "e": "П'ять."}, {"t": "choice", "q": "Хто супроводжував Чарлі на фабрику?", "o": ["Мама", "Дідусь Джо", "Бабуся Джорджина"], "a": 1, "e": "Дідусь Джо."}, {"t": "choice", "q": "Хто впав у шоколадну річку?", "o": ["Авґустус Ґлуп", "Майк Тіві", "Верука Солт"], "a": 0, "e": "Ненажера Авґустус."}, {"t": "choice", "q": "Хто перетворився на чорницю?", "o": ["Вайолет Борегард", "Верука Солт", "Чарлі"], "a": 0, "e": "Через експериментальну жуйку."}, {"t": "choice", "q": "Хто працює на фабриці Вонки?", "o": ["Роботи", "Умпа-лумпи", "Гноми"], "a": 1, "e": "Умпа-лумпи."}, {"t": "choice", "q": "Чому саме Чарлі отримав фабрику?", "o": ["Бо він найбідніший", "Бо він чесний, скромний і добрий", "Бо він виграв змагання"], "a": 1, "e": "Інші діти вибули через свої недоліки."}, {"t": "input", "q": "Прізвище Чарлі?", "a": ["бакет"], "e": "Чарлі Бакет."}, {"t": "choice", "q": "Який недолік у Майка Тіві?", "o": ["Ненажерливість", "Залежність від телевізора", "Жадібність"], "a": 1, "e": "Телеманіяк."}, {"t": "tf", "q": "Роальд Дал народився в Норвегії.", "a": false, "e": "В Уельсі, але родина — з Норвегії."}], "quiz2": [{"t": "choice", "q": "Чому кожна дитина вибуває саме через свій недолік?", "o": ["Автор показує наслідки вад через комічне покарання", "Випадково", "Так вирішив Вонка"], "a": 0, "e": "Сатиричний прийом."}, {"t": "choice", "q": "Чим Чарлі відрізняється від інших дітей?", "o": ["Скромністю, чесністю й турботою про рідних", "Багатством", "Силою"], "a": 0, "e": "Моральна перевага."}, {"t": "choice", "q": "Хто пішов із Чарлі на фабрику?", "o": ["Дідусь Джо", "Мама", "Учитель"], "a": 0, "e": "Дідусь Джо."}, {"t": "input", "q": "Скільки золотих квитків сховав Вонка?", "a": ["5", "п'ять"], "e": "П'ять."}], "quiz3": [{"t": "choice", "q": "Яку роль виконують пісні умпа-лумпів?", "o": ["Коментують події й підкреслюють мораль", "Заповнюють паузи", "Не мають значення"], "a": 0, "e": "Хор, як в античній драмі."}, {"t": "choice", "q": "Чому Дал робить дорослих смішними або нерозумними?", "o": ["Дивиться на світ очима дитини й підтримує її позицію", "Не любить дорослих", "Так простіше"], "a": 0, "e": "Особливість стилю."}, {"t": "choice", "q": "Чому фабрика — вдале місце дії?", "o": ["Це замкнений чарівний світ, де кожна кімната — випробування", "Там солодощі", "Там немає дорослих"], "a": 0, "e": "Композиція подорожі."}, {"t": "input", "q": "У якій країні народився Роальд Дал?", "a": ["уельс", "в уельсі", "велика британія", "британія"], "e": "В Уельсі."}]}, {"id": "zl-poety-pryroda", "sec": "Слухаємо голоси природи", "title": "Поети про природу: Джон Кітс, Ґете, Гейне", "goal": "Ти пам'ятаєш три вірші про природу і розумієш, що таке ліричний твір, пейзаж, ліричний герой.", "learn": [{"h": "Ліричний твір і пейзаж", "p": ["<span class='term'>Лірика</span> передає почуття й настрій. <span class='term'>Пейзаж</span> — опис природи; у ліриці природа відображає стан душі <span class='term'>ліричного героя</span>."]}, {"h": "Джон Кітс (1795–1821). «Про коника та цвіркуна»", "p": ["Англійський поет-романтик, прожив 25 років. Вірш: «Поезія землі не вмре ніколи». Влітку, коли птахи змовкли від спеки, співає <b>коник</b> у траві; узимку, коли все мовчить, за пічкою співає <b>цвіркун</b> — і здається, що це знову коник. Природа ніколи не мовчить, її пісня вічна."]}, {"h": "Йоганн Вольфґанґ Ґете (1749–1832). «Нічна пісня подорожнього»", "p": ["Найбільший німецький поет («Фауст»). Коротка мініатюра: спокій над гірськими вершинами, ані подиху вітру, птахи змовкли в лісі — «зажди лише, скоро й ти спочинеш». Спокій природи → спокій душі. Переклав українською Микола Бажан."]}, {"h": "Генріх Гейне (1797–1856). «Задзвени із глибини…»", "p": ["Німецький поет-романтик. Весняна пісенька: ліричний герой просить пісню задзвеніти, полинути до троянди й привітати її — «передай від мене вітання». Радість весни, ніжність, музичність. Українською перекладала Леся Українка."]}], "remember": "Кітс — коник (літо) і цвіркун (зима): поезія землі не вмре. Ґете — «Нічна пісня подорожнього»: спокій вершин, спокій душі. Гейне — «Задзвени із глибини»: весняна пісня до троянди. Пейзаж — опис природи.", "cards": [{"f": "Хто написав «Про коника та цвіркуна»?", "b": "Джон Кітс, англійський поет."}, {"f": "Хто співає влітку, а хто взимку у вірші Кітса?", "b": "Улітку — коник у траві, узимку — цвіркун за пічкою."}, {"f": "Головна думка вірша Кітса", "b": "«Поезія землі не вмре ніколи» — природа завжди співає."}, {"f": "Хто написав «Нічну пісню подорожнього»?", "b": "Йоганн Вольфґанґ Ґете, німецький поет."}, {"f": "Настрій «Нічної пісні подорожнього»", "b": "Спокій, тиша, умиротворення."}, {"f": "Хто написав «Задзвени із глибини…»?", "b": "Генріх Гейне; вірш про весну й троянду."}, {"f": "Пейзаж", "b": "Опис природи в художньому творі."}], "quiz": [{"t": "choice", "q": "Хто написав «Про коника та цвіркуна»?", "o": ["Кітс", "Ґете", "Гейне"], "a": 0, "e": "Джон Кітс."}, {"t": "choice", "q": "Хто співає взимку у вірші Кітса?", "o": ["Коник", "Цвіркун", "Соловей"], "a": 1, "e": "Цвіркун за пічкою."}, {"t": "choice", "q": "Головна думка вірша Кітса:", "o": ["Зима сумна", "Природа співає завжди, поезія землі вічна", "Коники шкідливі"], "a": 1, "e": "«Поезія землі не вмре ніколи»."}, {"t": "choice", "q": "Хто написав «Нічну пісню подорожнього»?", "o": ["Кітс", "Ґете", "Гейне"], "a": 1, "e": "Ґете."}, {"t": "choice", "q": "Який настрій у «Нічній пісні подорожнього»?", "o": ["Тривога", "Спокій і тиша", "Веселощі"], "a": 1, "e": "«Скоро й ти спочинеш»."}, {"t": "choice", "q": "Про яку пору року вірш Гейне «Задзвени із глибини…»?", "o": ["Зима", "Весна", "Осінь"], "a": 1, "e": "Весняна пісенька."}, {"t": "choice", "q": "Кому передає вітання пісня в Гейне?", "o": ["Троянді", "Місяцю", "Морю"], "a": 0, "e": "«До троянди полети»."}, {"t": "input", "q": "Як називається опис природи у творі?", "a": ["пейзаж"], "e": "Пейзаж."}, {"t": "choice", "q": "З якої країни Ґете і Гейне?", "o": ["Англія", "Німеччина", "Франція"], "a": 1, "e": "Обидва — німецькі поети."}], "quiz2": [{"t": "choice", "q": "Що об'єднує коника й цвіркуна у вірші Кітса?", "o": ["Обидва підтримують безперервну пісню природи", "Обидва живуть у домі", "Обидва сплять узимку"], "a": 0, "e": "Літо і зима."}, {"t": "choice", "q": "Який настрій створює «Нічна пісня подорожнього»?", "o": ["Спокій і примирення", "Тривогу", "Радість"], "a": 0, "e": "Тиша."}, {"t": "choice", "q": "Хто переклав Ґете українською?", "o": ["Микола Бажан", "Тарас Шевченко", "Іван Франко"], "a": 0, "e": "Бажан."}, {"t": "input", "q": "Кому передає вітання пісня у вірші Гейне?", "a": ["троянді"], "e": "Троянді."}], "quiz3": [{"t": "choice", "q": "«Поезія землі не вмре ніколи» — як ця думка розкрита в композиції вірша?", "o": ["Дві частини: літо з коником і зима з цвіркуном — пісня не уривається", "Через опис саду", "Через діалог"], "a": 0, "e": "Кільцева побудова."}, {"t": "choice", "q": "Чому вірш Ґете вважають шедевром попри малий обсяг?", "o": ["Кількома рядками передано весь стан природи й людини", "Він дуже давній", "Його важко перекласти"], "a": 0, "e": "Лаконізм."}, {"t": "choice", "q": "Що спільного в цих трьох поетів?", "o": ["Через природу говорять про стан душі людини", "Усі німці", "Усі писали про зиму"], "a": 0, "e": "Пейзажна лірика."}, {"t": "input", "q": "Скільки років прожив Джон Кітс?", "a": ["25"], "e": "Лише 25."}]}, {"id": "zl-kipling-mauhli", "sec": "Слухаємо голоси природи", "title": "Редьярд Кіплінг. «Мауглі» («Книга джунглів»)", "goal": "Ти пам'ятаєш героїв «Мауглі» і Закон Джунглів.", "learn": [{"h": "Редьярд Кіплінг (1865–1936)", "p": ["Англійський письменник, народився в <b>Бомбеї (Індія)</b>. Перший англійський лауреат <b>Нобелівської премії</b> з літератури (1907). «Книга джунглів» (1894) — оповідання про Мауглі; також «Ріккі-Тіккі-Таві», «Як і чому»."]}, {"h": "Герої", "p": ["<b>Мауглі</b> («жабеня») — людське дитя, яке виховали вовки. <b>Батько Вовк</b> і <b>Мати Вовчиця (Ракша)</b>. <b>Акела</b> — ватажок вовчої зграї. <b>Балу</b> — старий ведмідь, учитель Закону Джунглів. <b>Багіра</b> — чорна пантера, викупила Мауглі биком. <b>Каа</b> — мудрий пітон. <b>Шер-Хан</b> — кульгавий тигр, ворог Мауглі. <b>Табакі</b> — шакал-підлиза. <b>Бандар-логи</b> — дурне мавпяче плем'я. <b>Хатхі</b> — слон."]}, {"h": "Сюжет", "p": ["Шер-Хан полює на людське дитя; вовки приймають його в зграю за викуп Багіри й слово Балу. Мауглі росте, вчить Закон Джунглів. Мавпи викрадають його в Холодні Лігва — рятують Багіра, Балу й Каа. Шер-Хан підбурює молодих вовків проти Акели; Мауглі приносить <b>Червону Квітку</b> (вогонь) і проганяє тигра. Іде до людей, у село (жінка Мессуа), пасе буйволів і з їхньою допомогою вбиває Шер-Хана. Зрештою Мауглі — «ні вовк, ні людина» — повертається до людей."], "note": "Закон Джунглів: «Ми з тобою однієї крові, ти і я»; не вбивати заради розваги; сила зграї — у вовку, сила вовка — у зграї. Ідея: людина й природа, дружба, відповідальність, честь."}], "remember": "Кіплінг — Індія, Нобель 1907. Мауглі, Акела (ватажок), Балу (ведмідь-учитель), Багіра (пантера), Каа (пітон), Шер-Хан (тигр), Табакі (шакал), бандар-логи (мавпи). Червона Квітка — вогонь. «Ми з тобою однієї крові».", "cards": [{"f": "Де народився Кіплінг?", "b": "У Бомбеї, в Індії."}, {"f": "Яку премію отримав Кіплінг?", "b": "Нобелівську премію з літератури (1907)."}, {"f": "Акела", "b": "Ватажок вовчої зграї."}, {"f": "Балу", "b": "Старий ведмідь, учитель Закону Джунглів."}, {"f": "Багіра", "b": "Чорна пантера; викупила Мауглі биком."}, {"f": "Каа", "b": "Мудрий пітон; врятував Мауглі від мавп."}, {"f": "Шер-Хан і Табакі", "b": "Кульгавий тигр — ворог Мауглі; шакал-підлиза."}, {"f": "Червона Квітка", "b": "Вогонь, якого бояться звірі."}, {"f": "«Ми з тобою однієї крові, ти і я»", "b": "Заповітні слова Джунглів — знак дружби й миру."}, {"f": "Хто такі бандар-логи?", "b": "Мавпяче плем'я без закону."}], "quiz": [{"t": "choice", "q": "Де народився Кіплінг?", "o": ["У Лондоні", "У Бомбеї", "У Сіднеї"], "a": 1, "e": "В Індії."}, {"t": "choice", "q": "Хто виховав Мауглі?", "o": ["Мавпи", "Вовки", "Ведмеді"], "a": 1, "e": "Вовча зграя."}, {"t": "choice", "q": "Хто такий Балу?", "o": ["Ведмідь-учитель", "Тигр", "Пітон"], "a": 0, "e": "Учив Мауглі Закону Джунглів."}, {"t": "choice", "q": "Хто такий Шер-Хан?", "o": ["Слон", "Кульгавий тигр", "Ватажок вовків"], "a": 1, "e": "Головний ворог Мауглі."}, {"t": "choice", "q": "Хто викрав Мауглі в Холодні Лігва?", "o": ["Мавпи (бандар-логи)", "Шер-Хан", "Люди"], "a": 0, "e": "Бандар-логи."}, {"t": "choice", "q": "Що таке Червона Квітка?", "o": ["Троянда", "Вогонь", "Кров"], "a": 1, "e": "Вогонь, якого бояться звірі."}, {"t": "choice", "q": "Хто такий Каа?", "o": ["Пітон", "Шакал", "Вовк"], "a": 0, "e": "Мудрий пітон."}, {"t": "input", "q": "Як звали ватажка вовчої зграї?", "a": ["акела"], "e": "Акела."}, {"t": "choice", "q": "Чим Багіра викупила Мауглі?", "o": ["Золотом", "Щойно вбитим биком", "Своєю шкурою"], "a": 1, "e": "Биком — так вовки прийняли дитину."}, {"t": "choice", "q": "Заповітні слова Джунглів:", "o": ["«Джунглі — наш дім»", "«Ми з тобою однієї крові, ти і я»", "«Сила в зубах»"], "a": 1, "e": "Знак дружби."}, {"t": "tf", "q": "Кіплінг отримав Нобелівську премію з літератури.", "a": true, "e": "1907, перший англомовний лауреат."}], "quiz2": [{"t": "choice", "q": "Чому Мауглі зрештою мусить піти до людей?", "o": ["Він не вовк і не людина повністю — не належить жодному світу", "Його вигнав Акела", "Він захворів"], "a": 0, "e": "Трагізм героя."}, {"t": "choice", "q": "Чому бандар-логів зневажають у Джунглях?", "o": ["Вони не мають закону, слова й пам'яті", "Вони маленькі", "Вони живуть на деревах"], "a": 0, "e": "Протиставлення Закону."}, {"t": "choice", "q": "Що дає Мауглі перевагу над Шер-Ханом?", "o": ["Розум і вогонь — Червона Квітка", "Сила", "Швидкість"], "a": 0, "e": "Людські здібності."}, {"t": "input", "q": "Чим Багіра викупила Мауглі для зграї?", "a": ["биком", "бик", "убитим биком"], "e": "Щойно вбитим биком."}], "quiz3": [{"t": "choice", "q": "Що таке Закон Джунглів у творі?", "o": ["Система правил, що робить співжиття можливим", "Право сильного", "Заборона полювати"], "a": 0, "e": "Порядок замість хаосу."}, {"t": "choice", "q": "Чому Кіплінг зробив учителями саме ведмедя й пантеру?", "o": ["Вони уособлюють знання й силу-захист, потрібні для виховання", "Вони найкрасивіші", "Випадково"], "a": 0, "e": "Алегорія виховання."}, {"t": "choice", "q": "«Ми з тобою однієї крові» — яка функція цієї формули?", "o": ["Пароль єдності всіх мешканців джунглів", "Привітання людей", "Оголошення війни"], "a": 0, "e": "Знак спільноти."}, {"t": "input", "q": "У якому році Кіплінг отримав Нобелівську премію?", "a": ["1907"], "e": "1907."}]}, {"id": "zl-seton-lobo", "sec": "Слухаємо голоси природи", "title": "Ернест Сетон-Томпсон. «Лобо — володар Курумпо»", "goal": "Ти пам'ятаєш історію вовка Лобо і знаєш, що таке анімалістична література.", "learn": [{"h": "Ернест Сетон-Томпсон (1860–1946)", "p": ["Канадсько-американський письменник, художник, натураліст; народився в Англії. Засновник <span class='term'>анімалістичної літератури</span> — творів про тварин, де вони показані правдиво, як у природі, без казковості. Книга «Тварини, яких я знав»."]}, {"h": "Сюжет", "p": ["У долині <b>Курумпо</b> (Нью-Мексико) зграя вовків на чолі з велетенським сірим <b>Лобо</b> роками нищила худобу. Лобо був надзвичайно розумний: не чіпав отруєного м'яса, обминав капкани, знімав приманки. Автор приїхав його впіймати: отруєні приманки Лобо зібрав докупи й <b>загидив</b>; капкани викопав. Слабке місце Лобо — його подруга, біла вовчиця <b>Бланка</b>: вона потрапила в капкан, її вбили. Лобо, збожеволілий від горя, шукав її по слідах і сам потрапив у <b>чотири капкани</b>. Його не вбили, а зв'язали й привезли на ранчо; він відмовився від їжі, дивився на прерію і за ніч помер — від туги."], "note": "Автор захоплюється вовком і кається за вчинене. Ідея: тварини мають гідність, вірність і почуття; людина не має права їх бездумно знищувати."}], "remember": "Сетон-Томпсон — засновник анімалістичної літератури. Лобо — вожак вовків у Курумпо, надрозумний; Бланка — біла вовчиця; загинув через любов до Бланки — потрапив у капкани й помер від туги.", "cards": [{"f": "Анімалістична література", "b": "Твори про тварин, показаних правдиво, як у природі. Засновник — Сетон-Томпсон."}, {"f": "Хто такий Лобо?", "b": "Велетенський розумний вовк, вожак зграї в долині Курумпо."}, {"f": "Де відбуваються події?", "b": "У долині Курумпо, Нью-Мексико (США)."}, {"f": "Хто така Бланка?", "b": "Біла вовчиця, подруга Лобо."}, {"f": "Як Лобо ставився до отруєних приманок?", "b": "Зібрав їх докупи і загидив."}, {"f": "Як загинув Лобо?", "b": "Шукаючи Бланку, потрапив у капкани; у полоні відмовився від їжі й помер від туги."}], "quiz": [{"t": "choice", "q": "Хто заснував анімалістичну літературу?", "o": ["Кіплінг", "Сетон-Томпсон", "Твен"], "a": 1, "e": "Ернест Сетон-Томпсон."}, {"t": "choice", "q": "Чим анімалістична література відрізняється від казок про тварин?", "o": ["Тварини показані правдиво, як у природі", "Тварини розмовляють", "Завжди щасливий кінець"], "a": 0, "e": "Реальні спостереження натураліста."}, {"t": "choice", "q": "Хто такий Лобо?", "o": ["Собака", "Вовк-вожак", "Койот"], "a": 1, "e": "Володар Курумпо."}, {"t": "choice", "q": "Як Лобо вчинив з отруєними приманками?", "o": ["З'їв", "Зібрав докупи і загидив", "Проігнорував"], "a": 1, "e": "Показав зневагу до мисливців."}, {"t": "choice", "q": "Хто така Бланка?", "o": ["Дочка автора", "Біла вовчиця, подруга Лобо", "Корова"], "a": 1, "e": "Через неї Лобо загинув."}, {"t": "choice", "q": "Що стало слабким місцем Лобо?", "o": ["Голод", "Любов до Бланки", "Старість"], "a": 1, "e": "Він шукав її і попався."}, {"t": "choice", "q": "У скільки капканів потрапив Лобо?", "o": ["Один", "Чотири", "Десять"], "a": 1, "e": "Чотири — по всіх лапах."}, {"t": "choice", "q": "Від чого помер Лобо?", "o": ["Від пострілу", "Від туги, відмовившись від їжі", "Від отрути"], "a": 1, "e": "Помер вільним духом."}, {"t": "choice", "q": "Як автор ставиться до Лобо?", "o": ["Ненавидить", "Захоплюється й кається", "Байдуже"], "a": 1, "e": "Після цієї історії Сетон-Томпсон став захисником природи."}, {"t": "input", "q": "Як називається долина, де жив Лобо?", "a": ["курумпо"], "e": "Курумпо."}], "quiz2": [{"t": "choice", "q": "Що робить Лобо трагічним героєм, а не просто хижаком?", "o": ["Він має вірність, гідність і гине через любов", "Він великий", "Він розумний"], "a": 0, "e": "Олюднення без вигадки."}, {"t": "choice", "q": "Чому автор пише про свій програш морально?", "o": ["Він переміг вовка, але усвідомив жорстокість полювання", "Він програв гроші", "Він не впіймав вовка"], "a": 0, "e": "Каяття автора."}, {"t": "choice", "q": "Чому Лобо потрапив у пастку саме через Бланку?", "o": ["Шукав її по слідах, утративши обережність", "Вона його зрадила", "Він постарів"], "a": 0, "e": "Єдина слабкість."}, {"t": "input", "q": "Як називається література про тварин, зображених правдиво?", "a": ["анімалістична", "анімалістична література"], "e": "Анімалістична."}], "quiz3": [{"t": "choice", "q": "Чим оповідання Сетона-Томпсона відрізняється від казки про тварин?", "o": ["Тварини поводяться як реальні звірі, без мови й алегорії", "Тварини говорять", "Немає моралі"], "a": 0, "e": "Реалізм натураліста."}, {"t": "choice", "q": "Чому Лобо відмовився від їжі в полоні?", "o": ["Втратив волю й подругу — жити не хотів", "Їжа була отруєна", "Він не був голодний"], "a": 0, "e": "Смерть від туги."}, {"t": "choice", "q": "Як історія Лобо вплинула на самого автора?", "o": ["Він став захисником природи", "Він припинив писати", "Він став мисливцем"], "a": 0, "e": "Зміна поглядів."}, {"t": "input", "q": "Як називається долина, де жив Лобо?", "a": ["курумпо"], "e": "Курумпо."}]}, {"id": "zl-hoffmann", "sec": "Сила творчої уяви", "title": "Ернст Теодор Амадей Гофман. «Лускунчик і Мишачий король»", "goal": "Ти пам'ятаєш сюжет казки про Лускунчика і розрізняєш реальний і фантастичний світи в ній.", "learn": [{"h": "Гофман (1776–1822)", "p": ["Німецький письменник-романтик, композитор, художник, юрист. Казка «Лускунчик і Мишачий король» (1816) стала основою балету Чайковського. У творах Гофмана два світи: буденний і чарівний."]}, {"h": "Сюжет", "p": ["На Різдво <b>Марі</b> і <b>Фріц</b> Штальбаум отримують подарунки від хрещеного <b>Дроссельмеєра</b>. Марі впадає в око негарний <b>Лускунчик</b> — лялька для горіхів; Фріц ламає йому зуби. Уночі Марі бачить битву іграшок під проводом Лускунчика з мишами <b>Мишачого короля</b> (семиголового). Дроссельмеєр розповідає казку про <b>твердий горіх Кракатук</b>: принцесу Пірліпат зачарувала Мишильда, зняти чари міг юнак, розгризши горіх, — це був племінник Дроссельмеєра; після рятування він сам став потворним Лускунчиком, а принцеса його відштовхнула. Розчарувати може лише дівчина, яка полюбить його незважаючи на потворність. Марі віддає Лускунчику свої цукерки для миру, дає шаблю; він перемагає Мишачого короля й веде Марі в <b>Лялькове королівство</b>. Марі каже, що не відштовхнула б Лускунчика, — і чари спадають: він стає юнаком і одружується з нею."], "note": "Реальне: дім Штальбаумів, Різдво, іграшки. Фантастичне: битва, Лялькове королівство, ожилий Лускунчик. Ідея: вірність, доброта й любов рятують; краса душі важливіша за зовнішність."}], "remember": "Гофман — Німеччина. Марі, Фріц, хрещений Дроссельмеєр, Лускунчик, Мишачий король (7 голів), горіх Кракатук, принцеса Пірліпат, Мишильда, Лялькове королівство. Два світи: реальний і фантастичний.", "cards": [{"f": "Хто автор «Лускунчика»?", "b": "Ернст Теодор Амадей Гофман, німецький романтик."}, {"f": "Головна героїня казки", "b": "Марі Штальбаум."}, {"f": "Хто такий Дроссельмеєр?", "b": "Хрещений Марі і Фріца, годинникар і майстер іграшок."}, {"f": "Скільки голів у Мишачого короля?", "b": "Сім."}, {"f": "Горіх Кракатук", "b": "Твердий горіх, розгризши який, можна зняти чари з принцеси Пірліпат."}, {"f": "Хто зачарував принцесу і Лускунчика?", "b": "Мишильда — мишача королева."}, {"f": "Як спали чари з Лускунчика?", "b": "Марі полюбила його попри потворність."}, {"f": "Куди Лускунчик повів Марі?", "b": "У Лялькове королівство."}], "quiz": [{"t": "choice", "q": "З якої країни Гофман?", "o": ["Австрія", "Німеччина", "Данія"], "a": 1, "e": "Німецький романтик."}, {"t": "choice", "q": "Коли відбуваються події казки?", "o": ["На Різдво", "На Пасху", "Влітку"], "a": 0, "e": "Різдвяний вечір у Штальбаумів."}, {"t": "choice", "q": "Хто зламав Лускунчику зуби?", "o": ["Марі", "Фріц", "Мишачий король"], "a": 1, "e": "Брат Фріц."}, {"t": "choice", "q": "Скільки голів у Мишачого короля?", "o": ["Три", "Сім", "Дев'ять"], "a": 1, "e": "Семиголовий."}, {"t": "choice", "q": "Що таке Кракатук?", "o": ["Місто", "Твердий горіх", "Меч"], "a": 1, "e": "Чарівний горіх."}, {"t": "choice", "q": "Хто такий Дроссельмеєр?", "o": ["Хрещений дітей", "Батько Марі", "Мишачий король"], "a": 0, "e": "Годинникар, хрещений."}, {"t": "choice", "q": "Чому Лускунчик став потворним?", "o": ["Його зачарувала Мишильда", "Він упав", "Це його справжній вигляд"], "a": 0, "e": "Помста Мишильди."}, {"t": "choice", "q": "Що зняло чари з Лускунчика?", "o": ["Шабля", "Любов Марі попри потворність", "Горіх"], "a": 1, "e": "Марі не відштовхнула його."}, {"t": "choice", "q": "Що у казці фантастичне?", "o": ["Різдвяна ялинка", "Битва іграшок з мишами", "Подарунки"], "a": 1, "e": "Фантастичний світ ночі."}, {"t": "input", "q": "Як звали головну героїню?", "a": ["марі", "маріхен", "марія"], "e": "Марі."}], "quiz2": [{"t": "choice", "q": "Чому дорослі не вірять Марі?", "o": ["Вони бачать лише буденний світ, а вона — і чарівний", "Вона обманює", "Вона мала"], "a": 0, "e": "Два світи Гофмана."}, {"t": "choice", "q": "Що знімає чари з Лускунчика?", "o": ["Любов Марі попри його потворність", "Перемога над мишами", "Горіх Кракатук"], "a": 0, "e": "Умова зняття чарів."}, {"t": "choice", "q": "Хто зачарував принцесу Пірліпат?", "o": ["Мишильда", "Дроссельмеєр", "Мишачий король"], "a": 0, "e": "Мишача королева."}, {"t": "input", "q": "Як називався твердий горіх у казці?", "a": ["кракатук"], "e": "Кракатук."}], "quiz3": [{"t": "choice", "q": "Навіщо в казці історія про Пірліпат усередині основного сюжету?", "o": ["Це вставна оповідь, що пояснює походження Лускунчика", "Для обсягу", "Це помилка"], "a": 0, "e": "Казка в казці."}, {"t": "choice", "q": "Чому Марі — не пасивна героїня?", "o": ["Вона віддає свої цукерки, шаблю і врешті рятує Лускунчика словом", "Вона нічого не робить", "Її рятують інші"], "a": 0, "e": "Активний вибір."}, {"t": "choice", "q": "Що спільного між Пірліпат і Марі як персонажами?", "o": ["Обидві стикаються з потворністю, але роблять різний вибір", "Обидві принцеси", "Обидві злі"], "a": 0, "e": "Дзеркальні образи."}, {"t": "input", "q": "Скільки голів у Мишачого короля?", "a": ["7", "сім"], "e": "Сім."}]}, {"id": "zl-carroll", "sec": "Сила творчої уяви", "title": "Льюїс Керролл. «Аліса в Країні Див»", "goal": "Ти пам'ятаєш героїв Країни Див і знаєш, чим казка Керролла особлива.", "learn": [{"h": "Льюїс Керролл (1832–1898)", "p": ["Справжнє ім'я — <b>Чарльз Лютвідж Доджсон</b>, англійський математик, викладач Оксфорда. Казку вигадав для дівчинки <b>Аліси Лідделл</b> під час прогулянки на човні; видав 1865 р. Продовження — «Аліса в Задзеркаллі». Особливість: <b>гра слів, каламбури, абсурд (нонсенс)</b>, пародії на вірші."]}, {"h": "Сюжет і герої", "p": ["<b>Аліса</b> засинає на березі, бачить <b>Білого Кролика</b> з годинником і падає за ним у нору. Пляшечка «Випий мене» і пиріжок «З'їж мене» змінюють її зріст. Море сліз, <b>Миша</b>, біг по колу. <b>Гусінь</b> на грибі («Хто ти така?»). <b>Герцогиня</b>, кухарка й немовля, що стає поросям. <b>Чеширський Кіт</b> зі зникаючою усмішкою. <b>Божевільне чаювання</b>: <b>Капелюшник</b>, <b>Шалений Заєць</b>, <b>Сонько</b>  "Елеонор Портер. «Полліанна»", "goal": "Ти знаєш, що таке «гра в радість», і пам'ятаєш героїв повісті.", "learn": [{"h": "Елеонор Портер (1868–1920)", "p": ["Американська письменниця. «Полліанна» (1913) — одна з найпопулярніших дитячих книжок світу; слово «Полліанна» стало означати невиправного оптиміста."]}, {"h": "Сюжет", "p": ["Одинадцятирічна сирота <b>Полліанна Віттієр</b> після смерті батька-пастора приїздить до суворої тітки <b>Поллі Гаррінґтон</b> у містечко <b>Белдінгсвіль</b>. Тітка поселяє її на гарячому горищі, а дівчинка радіє краєвиду з вікна. Від батька Полліанна навчилась <b>«гри в радість»</b>: у будь-якій біді знайти, чому радіти (замість ляльки прислали милиці — радій, що вони тобі не потрібні). Вона змінює життя всіх навколо: служниці <b>Ненсі</b>, буркотливого <b>містера Пендлтона</b>, хворої <b>місіс Сноу</b>, самотнього <b>лікаря Чилтона</b>, хлопчика-сироти <b>Джиммі Біна</b>. Полліанну збиває автомобіль, вона не може ходити і сама втрачає здатність радіти — тоді все місто приходить розповісти, як гра їх змінила. Тітка Поллі мириться з лікарем Чилтоном, і Полліанну везуть на лікування; вона знову вчиться ходити."], "note": "Ідея: оптимізм і доброта змінюють світ; радість — це вибір. Ужиток: «полліанна» — оптиміст."}], "remember": "Портер — США, 1913. Полліанна, тітка Поллі, Ненсі, містер Пендлтон, місіс Сноу, лікар Чилтон, Джиммі Бін; Белдінгсвіль. «Гра в радість» — знайти, чому радіти в будь-якій біді.", "cards": [{"f": "Хто написала «Полліанну»?", "b": "Елеонор Портер, американська письменниця (1913)."}, {"f": "«Гра в радість»", "b": "У будь-якій біді знайти, чому радіти; навчив батько Полліанни."}, {"f": "До кого приїхала Полліанна?", "b": "До суворої тітки Поллі Гаррінґтон у Белдінгсвіль."}, {"f": "Приклад гри в радість з милицями", "b": "Замість ляльки прислали милиці — радій, що вони тобі не потрібні."}, {"f": "Хто такий Джиммі Бін?", "b": "Хлопчик-сирота, якому Полліанна шукала дім."}, {"f": "Що сталось з Полліанною?", "b": "Її збила машина; вона не могла ходити, але місто повернуло їй радість."}, {"f": "Лікар Чилтон", "b": "Самотній лікар, колишній наречений тітки Поллі; вони помирились."}], "quiz": [{"t": "choice", "q": "Що таке «гра в радість»?", "o": ["Настільна гра", "У будь-якій біді знайти, чому радіти", "Гра в м'яч"], "a": 1, "e": "Навчив батько Полліанни."}, {"t": "choice", "q": "Хто навчив Полліанну гри?", "o": ["Тітка Поллі", "Батько", "Ненсі"], "a": 1, "e": "Батько-пастор."}, {"t": "choice", "q": "Де поселила тітка Полліанну?", "o": ["У найкращій кімнаті", "На горищі", "У підвалі"], "a": 1, "e": "І дівчинка зраділа краєвиду з вікна."}, {"t": "choice", "q": "Чому радіти, якщо замість ляльки прислали милиці?", "o": ["Що вони не потрібні", "Що можна продати", "Що вони дерев'яні"], "a": 0, "e": "Класичний приклад гри."}, {"t": "choice", "q": "Хто така Ненсі?", "o": ["Служниця тітки Поллі", "Сестра Полліанни", "Учителька"], "a": 0, "e": "Служниця, перша подруга."}, {"t": "choice", "q": "Що сталось з Полліанною?", "o": ["Захворіла на грип", "Її збила машина", "Загубилась"], "a": 1, "e": "Вона не могла ходити."}, {"t": "choice", "q": "Хто повернув Полліанні радість, коли вона сама зневірилась?", "o": ["Лікар", "Усе місто, розповівши, як гра їх змінила", "Тітка"], "a": 1, "e": "Гра повернулась до неї."}, {"t": "input", "q": "Як звали тітку Полліанни?", "a": ["поллі", "тітка поллі", "поллі гаррінгтон", "поллі гаррінґтон"], "e": "Поллі Гаррінґтон."}, {"t": "choice", "q": "Що означає слово «полліанна» сьогодні?", "o": ["Плакса", "Невиправний оптиміст", "Сирота"], "a": 1, "e": "Оптиміст."}, {"t": "choice", "q": "Із якої країни Елеонор Портер?", "o": ["Англія", "США", "Канада"], "a": 1, "e": "Американська письменниця."}], "quiz2": [{"t": "choice", "q": "Чому гра в радість спрацьовує на дорослих?", "o": ["Вона змінює погляд на ситуацію, а не саму ситуацію", "Вона чарівна", "Вона проста"], "a": 0, "e": "Психологічний ефект."}, {"t": "choice", "q": "Чому Полліанна зраділа горищу?", "o": ["Знайшла в ньому краєвид із вікна", "Любить високо", "Не помітила"], "a": 0, "e": "Гра в радість."}, {"t": "choice", "q": "Що змінює тітку Поллі найбільше?", "o": ["Приклад племінниці й повернення почуттів", "Гроші", "Лікар"], "a": 0, "e": "Розвиток характеру."}, {"t": "input", "q": "Хто навчив Полліанну гри в радість?", "a": ["батько", "тато", "батько-пастор"], "e": "Батько."}], "quiz3": [{"t": "choice", "q": "Чому важливо, що Полліанна сама втрачає здатність радіти?", "o": ["Показує, що вона жива дитина, а не ідеал — і тоді допомагають їй", "Це помилка автора", "Щоб було сумно"], "a": 0, "e": "Кульмінація твору."}, {"t": "choice", "q": "Що означає слово «полліанна» сьогодні?", "o": ["Невиправний оптиміст", "Сирота", "Хвора дитина"], "a": 0, "e": "Стало загальною назвою."}, {"t": "choice", "q": "Чи означає гра в радість заперечення проблем?", "o": ["Ні, вона допомагає знайти опору, а не ігнорувати біду", "Так", "Це те саме"], "a": 0, "e": "Важлива різниця."}, {"t": "input", "q": "Хто такий Джиммі Бін?", "a": ["сирота", "хлопчик-сирота", "хлопчик"], "e": "Хлопчик-сирота."}]}, {"id": "zl-twain", "sec": "У вирі захопливих пригод", "title": "Марк Твен. «Пригоди Тома Соєра»", "goal": "Ти пам'ятаєш головні пригоди Тома Соєра і знаєш, хто такий Марк Твен.", "learn": [{"h": "Марк Твен (1835–1910)", "p": ["Справжнє ім'я — <b>Семюел Ленґгорн Клеменс</b>, американський письменник. Псевдонім «марк твен» — вигук лоцманів на Міссісіпі («мірка два» — безпечна глибина). Дитинство — у містечку <b>Ганнібал</b> на Міссісіпі, прототип Сент-Пітерсберга. Книжки: «Пригоди Тома Соєра» (1876), «Пригоди Гекльберрі Фінна», «Принц і злидар»."]}, {"h": "Герої", "p": ["<b>Том Соєр</b> — винахідливий пустун, мрійник, добрий. <b>Тітка Поллі</b> — виховує його. <b>Сід</b> — зразковий брат-донощик. <b>Гекльберрі Фінн</b> — безпритульний друг, вільний як вітер. <b>Беккі Тетчер</b> — кохання Тома. <b>Індіанець Джо</b> — злочинець. <b>Мафф Поттер</b> — невинно обвинувачений."]}, {"h": "Пригоди", "p": ["<b>Фарбування паркану</b>: Том так представив покарання розвагою, що хлопці платили за право фарбувати (принцип: «робота — те, що мусиш; гра — те, чого не мусиш»). <b>Дохлий кіт</b> і похід на цвинтар уночі з Геком — свідки вбивства лікаря Індіанцем Джо. <b>Утеча на острів Джексона</b> «в пірати» з Геком і Джо Гарпером; повернення на власний похорон. <b>Свідчення на суді</b> — Том сміливо рятує Маффа Поттера. <b>Печера</b>: Том і Беккі заблукали; Том знайшов вихід і врятував Беккі. <b>Скарб</b> Індіанця Джо, знайдений з Геком."], "note": "Ідея: дитинство, дружба, сміливість і чесність; іронія щодо нудних правил дорослих."}], "remember": "Марк Твен = Семюел Клеменс, «мірка два» — вигук лоцманів; Ганнібал на Міссісіпі. Том, тітка Поллі, Сід, Гек Фінн, Беккі Тетчер, Індіанець Джо, Мафф Поттер. Паркан, цвинтар, острів і власний похорон, суд, печера, скарб.", "cards": [{"f": "Справжнє ім'я Марка Твена", "b": "Семюел Ленґгорн Клеменс."}, {"f": "Що означає псевдонім «Марк Твен»?", "b": "Вигук лоцманів на Міссісіпі — «мірка два», безпечна глибина."}, {"f": "Хто такий Гекльберрі Фінн?", "b": "Безпритульний друг Тома, вільний і незалежний."}, {"f": "Хто така Беккі Тетчер?", "b": "Дівчинка, в яку закоханий Том; з нею він заблукав у печері."}, {"f": "Як Том перетворив фарбування паркану на гру?", "b": "Удав, що це велика честь, і хлопці платили за право фарбувати."}, {"f": "Що бачили Том і Гек на цвинтарі?", "b": "Як Індіанець Джо вбив лікаря."}, {"f": "Кого врятував Том свідченням на суді?", "b": "Маффа Поттера."}, {"f": "Куди втекли хлопці «в пірати»?", "b": "На острів Джексона; повернулись на власний похорон."}], "quiz": [{"t": "choice", "q": "Справжнє ім'я Марка Твена:", "o": ["Семюел Клеменс", "Джек Лондон", "Чарльз Доджсон"], "a": 0, "e": "Семюел Ленґгорн Клеменс."}, {"t": "choice", "q": "Звідки взято псевдонім «Марк Твен»?", "o": ["З імені діда", "З вигуку лоцманів на Міссісіпі", "З назви міста"], "a": 1, "e": "«Мірка два» — безпечна глибина."}, {"t": "choice", "q": "Хто виховував Тома?", "o": ["Мати", "Тітка Поллі", "Бабуся"], "a": 1, "e": "Тітка Поллі."}, {"t": "choice", "q": "Як Том змусив хлопців фарбувати паркан?", "o": ["Заплатив їм", "Удав, що це велика честь, і вони самі платили", "Попросив тітку"], "a": 1, "e": "Винахідливість Тома."}, {"t": "choice", "q": "Що Том і Гек побачили на цвинтарі?", "o": ["Привида", "Убивство лікаря Індіанцем Джо", "Скарб"], "a": 1, "e": "І присяглись мовчати."}, {"t": "choice", "q": "Куди втекли Том, Гек і Джо Гарпер?", "o": ["На острів Джексона", "У Нью-Йорк", "У печеру"], "a": 0, "e": "Грати в піратів."}, {"t": "choice", "q": "На яку подію повернулись хлопці з острова?", "o": ["На свято", "На власний похорон", "На суд"], "a": 1, "e": "Усі думали, що вони потонули."}, {"t": "choice", "q": "Кого врятував Том на суді?", "o": ["Гека", "Маффа Поттера", "Індіанця Джо"], "a": 1, "e": "Розповів правду попри страх."}, {"t": "choice", "q": "З ким Том заблукав у печері?", "o": ["З Геком", "З Беккі Тетчер", "Із Сідом"], "a": 1, "e": "І знайшов вихід."}, {"t": "input", "q": "Як звали безпритульного друга Тома? Гекльберрі …", "a": ["фінн", "фін"], "e": "Гекльберрі Фінн."}], "quiz2": [{"t": "choice", "q": "Чому епізод із парканом став класикою?", "o": ["Показує, як подача перетворює роботу на бажану гру", "Це смішно", "Паркан великий"], "a": 0, "e": "Психологія."}, {"t": "choice", "q": "Що робить Тома справжнім героєм, а не пустуном?", "o": ["Свідчення на суді попри страх помсти", "Утеча на острів", "Скарб"], "a": 0, "e": "Моральний вчинок."}, {"t": "choice", "q": "Що показує повернення хлопців на власний похорон?", "o": ["Дитячий егоїзм і водночас потребу бути важливим", "Що вони злі", "Що вони втопились"], "a": 0, "e": "Неоднозначність."}, {"t": "input", "q": "Що означає псевдонім «Марк Твен»?", "a": ["мірка два", "мітка два", "глибина два"], "e": "«Мірка два» — вигук лоцманів."}], "quiz3": [{"t": "choice", "q": "Чому Твен зробив Гека безпритульним?", "o": ["Щоб протиставити вільне життя умовностям містечка", "Щоб пожаліти", "Випадково"], "a": 0, "e": "Соціальний контраст."}, {"t": "choice", "q": "Що спільного між печерою і дорослішанням Тома?", "o": ["У печері він бере відповідальність і рятує іншого", "Обидва темні", "Нічого"], "a": 0, "e": "Випробування героя."}, {"t": "choice", "q": "Як автор ставиться до недільної школи й правил містечка?", "o": ["З іронією", "З повагою", "Байдуже"], "a": 0, "e": "Гумор і сатира."}, {"t": "input", "q": "На якій річці стоїть містечко з роману?", "a": ["міссісіпі"], "e": "Міссісіпі."}]}, {"id": "zl-jansson", "sec": "У вирі захопливих пригод", "title": "Туве Янсон. «Комета прилітає»", "goal": "Ти пам'ятаєш героїв Долини мумі-тролів і сюжет повісті про комету.", "learn": [{"h": "Туве Янсон (1914–2001)", "p": ["<b>Фінська</b> письменниця й художниця, писала шведською. Створила світ <b>мумі-тролів</b> — добрих білих істот, схожих на бегемотиків. Книжки: «Комета прилітає», «Капелюх Чарівника», «Зима-чарівниця». Сама ілюструвала."]}, {"h": "Герої", "p": ["<b>Мумі-троль</b> — добрий, допитливий. <b>Мумі-мама</b> (завжди із сумочкою) і <b>Мумі-тато</b> (пише мемуари). <b>Чмих</b> — маленький боязкий друг, любить речі. <b>Нюхмумрик</b> — мандрівник із люлькою і губною гармошкою, цінує волю. <b>Хропся</b> (Фрекен Снорк) і її брат <b>Хропусь</b>. <b>Ондатр</b> — філософ, читає книжку про марність усього. <b>Гемуль</b> — колекціонер марок і рослин."]}, {"h": "Сюжет", "p": ["У Долині мумі-тролів усе стає сірим — наближається <b>комета</b>. Мумі-троль і Чмих вирушають в <b>Обсерваторію</b> в Самотніх горах дізнатись, коли впаде комета. Дорогою зустрічають Нюхмумрика, рятують Хропсю від отруйного куща, дізнаються дату — <b>7 жовтня</b>. Повертаються через висохле море на ходулях, зустрічають Гемуля. Усі ховаються в <b>печері</b>; комета проноситься повз — Долина врятована."], "note": "Ідея: дружба й взаємодопомога сильніші за страх; дім і родина — головна цінність. Реальне (природа, друзі) поєднано з фантастичним (мумі-тролі, комета)."}], "remember": "Туве Янсон — Фінляндія, шведською. Мумі-троль, Мумі-мама, Мумі-тато, Чмих, Нюхмумрик, Хропся, Хропусь, Ондатр, Гемуль. Похід в Обсерваторію, комета 7 жовтня, порятунок у печері.", "cards": [{"f": "Хто така Туве Янсон?", "b": "Фінська письменниця й художниця, творець мумі-тролів; писала шведською."}, {"f": "Хто такі мумі-тролі?", "b": "Добрі білі істоти, схожі на бегемотиків, живуть у Долині мумі-тролів."}, {"f": "Чмих", "b": "Маленький боязкий друг Мумі-троля, любить речі."}, {"f": "Нюхмумрик", "b": "Вільний мандрівник з люлькою й губною гармошкою."}, {"f": "Хропся", "b": "Дівчинка-хропа, яку врятував Мумі-троль; змінює колір."}, {"f": "Куди пішли Мумі-троль і Чмих?", "b": "В Обсерваторію в Самотніх горах — дізнатись про комету."}, {"f": "Коли мала впасти комета?", "b": "7 жовтня."}, {"f": "Де сховались герої від комети?", "b": "У печері на березі."}], "quiz": [{"t": "choice", "q": "З якої країни Туве Янсон?", "o": ["Швеція", "Фінляндія", "Норвегія"], "a": 1, "e": "Фінська, писала шведською."}, {"t": "choice", "q": "На кого схожі мумі-тролі?", "o": ["На ведмедиків", "На бегемотиків", "На котів"], "a": 1, "e": "Білі бегемотики."}, {"t": "choice", "q": "Куди вирушили Мумі-троль і Чмих?", "o": ["До моря", "В Обсерваторію", "У місто"], "a": 1, "e": "Дізнатись, коли впаде комета."}, {"t": "choice", "q": "Хто такий Нюхмумрик?", "o": ["Вільний мандрівник", "Учений", "Брат Мумі-троля"], "a": 0, "e": "З люлькою й гармошкою."}, {"t": "choice", "q": "Кого врятував Мумі-троль від отруйного куща?", "o": ["Чмиха", "Хропсю", "Гемуля"], "a": 1, "e": "Хропсю."}, {"t": "choice", "q": "Хто читає книжку про марність усього?", "o": ["Ондатр", "Гемуль", "Мумі-тато"], "a": 0, "e": "Філософ Ондатр."}, {"t": "choice", "q": "Що колекціонує Гемуль?", "o": ["Марки й рослини", "Монети", "Камінці"], "a": 0, "e": "Гемуль-колекціонер."}, {"t": "choice", "q": "Де сховались усі від комети?", "o": ["У будинку", "У печері", "На горі"], "a": 1, "e": "У печері."}, {"t": "input", "q": "Якого числа мала впасти комета? Напиши число (день).", "a": ["7", "сьомого", "7 жовтня"], "e": "7 жовтня."}, {"t": "choice", "q": "Головна думка повісті:", "o": ["Треба боятися комет", "Дружба й взаємодопомога сильніші за страх", "Мандрувати небезпечно"], "a": 1, "e": "І дім — головна цінність."}], "quiz2": [{"t": "choice", "q": "Що робить мумі-тролів особливими попри небезпеку комети?", "o": ["Вони не панікують, а тримаються разом", "Вони чарівні", "Вони сильні"], "a": 0, "e": "Головна цінність."}, {"t": "choice", "q": "Хто такий Нюхмумрик?", "o": ["Мандрівник, що цінує волю понад речі", "Учений", "Брат Мумі-троля"], "a": 0, "e": "Персонаж-філософ."}, {"t": "choice", "q": "Чим Чмих відрізняється від Нюхмумрика?", "o": ["Чмих прив'язаний до речей і боїться, Нюхмумрик — вільний", "Нічим", "Чмих старший"], "a": 0, "e": "Контраст характерів."}, {"t": "input", "q": "Куди пішли Мумі-троль і Чмих по відповідь про комету?", "a": ["в обсерваторію", "обсерваторія", "до обсерваторії"], "e": "В Обсерваторію."}], "quiz3": [{"t": "choice", "q": "Чому Ондатр читає книжку «про марність усього»?", "o": ["Це іронічний образ песимізму серед доброзичливого світу", "Він мудрець", "Він сумний"], "a": 0, "e": "Гумор Янсон."}, {"t": "choice", "q": "Що символізує комета в повісті?", "o": ["Загрозу, яку не можна відвернути, але можна пережити разом", "Війну", "Кінець світу буквально"], "a": 0, "e": "Написано під час війни."}, {"t": "choice", "q": "Чому Мумі-дім у творі такий важливий?", "o": ["Це символ безпеки й родини", "Він великий", "Там багато речей"], "a": 0, "e": "Ідея дому."}, {"t": "input", "q": "З якої країни Туве Янсон?", "a": ["фінляндія", "з фінляндії", "фінляндії"], "e": "Фінляндія."}]}, {"id": "zl-teoriia", "sec": "Теорія літератури", "title": "Терміни 5 класу: сюжет, тема, ідея, портрет, пейзаж, антитеза", "goal": "Ти знаєш основні літературознавчі поняття із зарубіжної літератури.", "learn": [{"h": "Про твір", "p": ["<b>Тема</b> — про що твір. <b>Ідея</b> — головна думка. <b>Сюжет</b> — послі
