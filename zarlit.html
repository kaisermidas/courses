<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Зарубіжна література · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>
// ============================================================
//  ДАНІ КУРСУ. Один об'єкт на предмет; генерується з підручника.
// ============================================================
const COURSE = {"id": "zarlit5", "title": "Зарубіжна література", "subtitle": "5 клас · 15 уроків за підручниками Ніколенко і Ковбасенка", "lessons": [{"id": "zl-vstup", "sec": "Вступ", "title": "Роль книжки в житті людини. Оригінал і переклад", "goal": "Ти знаєш, як з'явилася книжка, що таке зарубіжна література, оригінал і переклад.", "learn": [{"h": "Історія книжки", "p": ["Спочатку знання передавали <b>усно</b>. Потім — <b>глиняні таблички</b> (Вавилон), <b>папірусні сувої</b> (Єгипет), <b>пергамент</b> із телячої шкіри (місто Пергам), <b>паперові</b> рукописні книжки, і з XV ст. — <b>друковані</b> (Йоганн Гутенберг). Сьогодні є ще <b>електронні</b> та <b>аудіокниги</b>."]}, {"h": "Зарубіжна література", "p": ["<span class='term'>Зарубіжна література</span> — художні твори, створені за межами України мовами інших народів: англійська, німецька, японська література тощо."]}, {"h": "Оригінал і переклад", "p": ["<span class='term'>Оригінал</span> — текст тією мовою, якою його написав автор. <span class='term'>Переклад</span> — той самий твір іншою мовою. <span class='term'>Перекладач</span> має передати не лише зміст, а й стиль, настрій, гумор. Відомі українські перекладачі: Максим Рильський, Микола Лукаш, Григорій Кочур, Євген Попович."], "note": "Читаючи «Мауглі» українською, ми читаємо переклад; оригінал Кіплінг написав англійською."}], "remember": "Книжка: усне слово → глина → папірус → пергамент → папір → друк (Гутенберг) → електронна. Зарубіжна література — твори інших народів. Оригінал — мова автора, переклад — інша мова.", "cards": [{"f": "Зарубіжна література", "b": "Художні твори, створені поза межами України мовами інших народів."}, {"f": "Оригінал", "b": "Текст тією мовою, якою його написав автор."}, {"f": "Переклад", "b": "Твір, переданий іншою мовою."}, {"f": "Хто винайшов друкарський верстат у Європі?", "b": "Йоганн Гутенберг, XV століття."}, {"f": "Пергамент", "b": "Матеріал для письма з телячої шкіри; від назви міста Пергам."}, {"f": "Відомі українські перекладачі", "b": "Максим Рильський, Микола Лукаш, Григорій Кочур."}], "quiz": [{"t": "choice", "q": "З чого робили перші «книги» у Вавилоні?", "o": ["З паперу", "З глини", "З пергаменту"], "a": 1, "e": "Глиняні таблички."}, {"t": "choice", "q": "Папірус виготовляли…", "o": ["у Єгипті", "у Китаї", "у Греції"], "a": 0, "e": "З рослини папірус у Давньому Єгипті."}, {"t": "choice", "q": "Від чого походить назва «пергамент»?", "o": ["Від імені майстра", "Від назви міста Пергам", "Від слова «перо»"], "a": 1, "e": "Місто Пергам."}, {"t": "choice", "q": "Що таке оригінал?", "o": ["Найстаріша книжка", "Текст мовою, якою його написав автор", "Ілюстрована книжка"], "a": 1, "e": "Оригінал — авторська мова твору."}, {"t": "choice", "q": "«Мауглі» українською — це…", "o": ["оригінал", "переклад"], "a": 1, "e": "Кіплінг писав англійською."}, {"t": "input", "q": "Хто винайшов друкарський верстат у Європі? Напиши прізвище.", "a": ["гутенберг", "ґутенберг"], "e": "Йоганн Гутенберг."}, {"t": "choice", "q": "Що має передати гарний перекладач?", "o": ["Тільки зміст", "Зміст, стиль, настрій твору", "Тільки імена героїв"], "a": 1, "e": "Переклад — теж мистецтво."}, {"t": "tf", "q": "Зарубіжна література — це твори, написані в Україні іноземними мовами.", "a": false, "e": "Ні, це твори інших народів, створені за межами України."}]}, {"id": "zl-kazky-narodiv", "sec": "Народні казки світу", "title": "Народні казки світу. Мандрівні сюжети. Японська казка «Момотаро»", "goal": "Ти знаєш ознаки народної казки, що таке мандрівний сюжет, і пам'ятаєш казку про Хлопчика-Персика.", "learn": [{"h": "Народна казка", "p": ["<span class='term'>Народна казка</span> — фольклорний твір про вигадані події, у якому добро перемагає зло. Види: про тварин, чарівні, побутові. У казках усіх народів схожі герої: молодший син, мачуха, дракон; але національний колорит різний."]}, {"h": "Мандрівний сюжет", "p": ["<span class='term'>Мандрівний сюжет</span> — сюжет, що повторюється в казках різних народів зі змінами: історія Попелюшки є в Європі, Китаї, Єгипті; «Пані Метелиця» схожа на українську «Про дідову й бабину дочку»."]}, {"h": "«Момотаро, або Хлопчик-Персик» (Японія)", "p": ["Бездітні дідусь і бабуся знайшли в річці великий <b>персик</b>, з якого вийшов хлопчик <b>Момотаро</b> («момо» — персик). Він виріс сильним і пішов на <b>Острів Чудовиськ</b> визволяти людей від злих <b>чортів (оні)</b>. Бабуся дала йому <b>просяні коржики</b>; дорогою за коржики до нього приєднались <b>собака, фазан і мавпа</b>. Разом вони перемогли чудовиськ, повернули награбовані скарби людям, і Момотаро повернувся до старих."], "note": "Національний колорит: персик, просяні коржики, фазан, чорти оні. Ідея: сміливість, доброта, дружба перемагають зло."}], "remember": "Мандрівний сюжет — повторюється в казках різних народів. Момотаро — хлопчик із персика; друзі: собака, фазан, мавпа; переміг чортів на Острові Чудовиськ; просяні коржики.", "cards": [{"f": "Народна казка", "b": "Фольклорний твір про вигадані події, де добро перемагає зло."}, {"f": "Мандрівний сюжет", "b": "Сюжет, що повторюється в казках різних народів зі змінами (Попелюшка)."}, {"f": "Звідки з'явився Момотаро?", "b": "З великого персика, який знайшли дідусь і бабуся."}, {"f": "Друзі Момотаро", "b": "Собака, фазан і мавпа."}, {"f": "Куди вирушив Момотаро?", "b": "На Острів Чудовиськ битися з чортами (оні)."}, {"f": "Що дала бабуся в дорогу?", "b": "Просяні коржики."}], "quiz": [{"t": "choice", "q": "Що таке мандрівний сюжет?", "o": ["Казка про подорож", "Сюжет, що повторюється в казках різних народів", "Довга казка"], "a": 1, "e": "Той самий сюжет у різних народів."}, {"t": "choice", "q": "З чого народився Момотаро?", "o": ["З яйця", "З персика", "З квітки"], "a": 1, "e": "«Момо» — персик."}, {"t": "choice", "q": "Хто НЕ був супутником Момотаро?", "o": ["Собака", "Кіт", "Фазан"], "a": 1, "e": "Собака, фазан і мавпа."}, {"t": "choice", "q": "Куди пішов Момотаро?", "o": ["На Острів Чудовиськ", "У столицю", "На гору Фудзі"], "a": 0, "e": "Визволяти людей від чортів."}, {"t": "choice", "q": "Що дала бабуся Момотаро в дорогу?", "o": ["Рисові кульки", "Просяні коржики", "Меч"], "a": 1, "e": "За коржики він здобув друзів."}, {"t": "choice", "q": "Із якої країни казка про Момотаро?", "o": ["Китай", "Японія", "Індія"], "a": 1, "e": "Японська народна казка."}, {"t": "input", "q": "Як називають злих чортів у японській казці?", "a": ["оні"], "e": "Оні."}, {"t": "choice", "q": "Чого вчить казка?", "o": ["Не ходити до річки", "Сміливість, доброта й дружба перемагають зло", "Персики корисні"], "a": 1, "e": "Момотаро переміг завдяки друзям і сміливості."}]}, {"id": "zl-shakal-metelytsia", "sec": "Народні казки світу", "title": "Індійська казка «Фарбований шакал». Брати Ґрімм «Пані Метелиця»", "goal": "Ти пам'ятаєш дві казки, знаєш, хто такі брати Ґрімм, і бачиш схожість з українськими казками.", "learn": [{"h": "«Фарбований шакал» (Індія, «Панчатантра»)", "p": ["Шакал <b>Чандарава</b>, тікаючи від собак, упав у чан із <b>синьою фарбою</b>. Звірі злякались невідомого синього звіра; він сказав, що його послав сам Індра правити лісом, і став царем. Вигнав шакалів, наблизив левів і тигрів. Одної ночі почув шакалів вий і <b>завив сам</b> — його впізнали й розірвали."], "note": "Той самий мандрівний сюжет, що й у «Фарбованому Лисі» Франка! Ідея: обман і зневага до своїх караються."}, {"h": "Брати Ґрімм", "p": ["<b>Якоб і Вільгельм Ґрімм</b> — німецькі вчені-мовознавці XIX ст. Збирали й записували народні казки Німеччини: «Пані Метелиця», «Попелюшка», «Бременські музиканти», «Білосніжка», «Гензель і Ґретель»."]}, {"h": "«Пані Метелиця»", "p": ["У вдови було дві дочки: рідна — <b>ледача й негарна</b>, і пасербиця — <b>працьовита й гарна</b>. Пасербиця впустила веретено в колодязь, стрибнула за ним і потрапила до <b>пані Метелиці</b>. Дорогою вийняла хліб з печі, обтрусила яблуню; у Метелиці старанно збивала перину (тоді на землі йде сніг). За працю її обсипало <b>золотом</b>. Ледача дочка все зробила навпаки — і її облило <b>смолою</b>, що не відмивалася."], "note": "Схоже з українською «Про дідову й бабину дочку». Ідея: працьовитість винагороджується, лінь карається. Антитеза: дві дочки."}], "remember": "«Фарбований шакал» — індійська казка (Панчатантра), той самий сюжет, що «Фарбований Лис». Брати Якоб і Вільгельм Ґрімм — німецькі збирачі казок. «Пані Метелиця»: пасербиця — золото, ледача дочка — смола.", "cards": [{"f": "Хто такі брати Ґрімм?", "b": "Якоб і Вільгельм — німецькі вчені, що записували народні казки."}, {"f": "«Фарбований шакал» — звідки?", "b": "Індійська казка зі збірки «Панчатантра»."}, {"f": "Який український твір схожий на «Фарбованого шакала»?", "b": "«Фарбований Лис» Івана Франка."}, {"f": "Чим нагороджено пасербицю в «Пані Метелиці»?", "b": "Обсипано золотом."}, {"f": "Чим покарано ледачу дочку?", "b": "Облито смолою."}, {"f": "Що відбувається, коли Метелиця збиває перину?", "b": "На землі йде сніг."}, {"f": "Українська казка, схожа на «Пані Метелицю»", "b": "«Про дідову й бабину дочку»."}], "quiz": [{"t": "choice", "q": "У що впав шакал Чандарава?", "o": ["У річку", "У чан із синьою фарбою", "У яму"], "a": 1, "e": "Став синім невідомим звіром."}, {"t": "choice", "q": "Як викрили шакала?", "o": ["Дощ змив фарбу", "Він завив, почувши шакалів", "Його впізнала мати"], "a": 1, "e": "Природа взяла своє — як у Франка."}, {"t": "choice", "q": "Який твір Франка має той самий сюжет?", "o": ["«Лис Микита»", "«Фарбований Лис»", "«Захар Беркут»"], "a": 1, "e": "Мандрівний сюжет."}, {"t": "choice", "q": "Хто такі брати Ґрімм?", "o": ["Німецькі збирачі казок", "Англійські поети", "Датські письменники"], "a": 0, "e": "Якоб і Вільгельм Ґрімм, Німеччина."}, {"t": "choice", "q": "Як пасербиця потрапила до пані Метелиці?", "o": ["Через ліс", "Стрибнула в колодязь за веретеном", "Її відвела мачуха"], "a": 1, "e": "Через колодязь."}, {"t": "choice", "q": "Що робила пасербиця у пані Метелиці?", "o": ["Збивала перину, і на землі йшов сніг", "Варила їжу", "Пряла"], "a": 0, "e": "Пір'я з перини — сніг."}, {"t": "choice", "q": "Чим обсипало пасербицю?", "o": ["Золотом", "Сріблом", "Квітами"], "a": 0, "e": "За працьовитість."}, {"t": "choice", "q": "Чим облило ледачу дочку?", "o": ["Водою", "Смолою", "Молоком"], "a": 1, "e": "Смола не відмивалась до кінця життя."}, {"t": "tf", "q": "«Пані Метелиця» схожа на українську казку «Про дідову й бабину дочку».", "a": true, "e": "Так, це мандрівний сюжет."}, {"t": "input", "q": "Як називається протиставлення двох героїв (працьовита — ледача)?", "a": ["антитеза"], "e": "Антитеза."}]}, {"id": "zl-andersen", "sec": "Літературні казки світу", "title": "Ганс Крістіан Андерсен. «Снігова королева»", "goal": "Ти знаєш, що таке літературна казка, і пам'ятаєш сюжет і героїв «Снігової королеви».", "learn": [{"h": "Літературна казка", "p": ["<span class='term'>Літературна казка</span> — казка з конкретним автором; виникла під впливом народної, але має авторський стиль, глибші характери, часто сумний або філософський зміст."]}, {"h": "Андерсен (1805–1875)", "p": ["Данський казкар із міста <b>Оденсе</b>, син чоботаря. Написав понад 150 казок: «Снігова королева», «Русалонька», «Гидке каченя», «Дюймовочка», «Принцеса на горошині», «Стійкий олов'яний солдатик». Його день народження, <b>2 квітня</b>, — Міжнародний день дитячої книги."]}, {"h": "Сюжет «Снігової королеви»", "p": ["Казка з <b>семи оповідань</b>. Злий троль зробив <b>дзеркало</b>, що все добре показувало потворним; воно розбилось, і скалки потрапляли людям в очі та серце. <b>Кай</b> і <b>Герда</b> — друзі, що вирощували троянди. Скалка потрапила Каю в серце й око — він став злим, а тоді <b>Снігова королева</b> забрала його у свій палац. Герда вирушила на пошуки: <b>жінка-чарівниця</b> з садом, <b>ворон</b>, <b>принц і принцеса</b> (дали карету), <b>маленька розбійниця</b> (дала північного оленя), <b>лапландка</b> і <b>фінка</b>. У палаці Кай складав із крижин слово «вічність». Герда обняла його і заплакала — гарячі сльози розтопили крижину в серці, Кай заплакав, і скалка вийшла. Вони повернулись додому — уже дорослі."], "note": "Ідея: любов і вірне серце сильніші за холодний розум і зло. Герда — щира, віддана, смілива."}], "remember": "Андерсен — Данія, Оденсе, 2 квітня. «Снігова королева» — 7 оповідань: дзеркало троля → скалка в серці Кая → Снігова королева забирає Кая → Герда шукає (чарівниця, ворон, принц і принцеса, маленька розбійниця, лапландка, фінка) → сльози Герди рятують Кая.", "cards": [{"f": "Літературна казка", "b": "Казка з конкретним автором; авторський стиль, глибші характери."}, {"f": "Андерсен — країна, місто", "b": "Данія, Оденсе."}, {"f": "2 квітня — який день?", "b": "Міжнародний день дитячої книги — день народження Андерсена."}, {"f": "Скільки оповідань у «Сніговій королеві»?", "b": "Сім."}, {"f": "Чому Кай став злим?", "b": "Скалки дзеркала троля потрапили йому в око і серце."}, {"f": "Кого зустріла Герда дорогою?", "b": "Жінку-чарівницю, ворона, принца і принцесу, маленьку розбійницю, лапландку, фінку."}, {"f": "Хто дав Герді північного оленя?", "b": "Маленька розбійниця."}, {"f": "Як Герда врятувала Кая?", "b": "Обняла й заплакала — гарячі сльози розтопили крижину в серці."}, {"f": "Яке слово Кай складав із крижин?", "b": "«Вічність»."}], "quiz": [{"t": "choice", "q": "З якої країни Андерсен?", "o": ["Данія", "Німеччина", "Норвегія"], "a": 0, "e": "Данський казкар з Оденсе."}, {"t": "choice", "q": "Чому 2 квітня — Міжнародний день дитячої книги?", "o": ["Це день народження Андерсена", "Це день першої казки", "Так вирішила ООН випадково"], "a": 0, "e": "На честь Андерсена."}, {"t": "choice", "q": "Скільки оповідань у «Сніговій королеві»?", "o": ["Три", "Сім", "Дванадцять"], "a": 1, "e": "Сім."}, {"t": "choice", "q": "Що зробило Кая злим?", "o": ["Сніг", "Скалка чарівного дзеркала в оці й серці", "Сварка з Гердою"], "a": 1, "e": "Дзеркало троля."}, {"t": "choice", "q": "Хто дав Герді північного оленя?", "o": ["Принцеса", "Маленька розбійниця", "Фінка"], "a": 1, "e": "Маленька розбійниця."}, {"t": "choice", "q": "Хто дав Герді золоту карету?", "o": ["Ворон", "Принц і принцеса", "Чарівниця"], "a": 1, "e": "Принц і принцеса."}, {"t": "choice", "q": "Яке слово Кай складав із крижин?", "o": ["Любов", "Вічність", "Зима"], "a": 1, "e": "«Вічність» — за нього королева обіцяла весь світ і ковзани."}, {"t": "choice", "q": "Що розтопило крижину в серці Кая?", "o": ["Сонце", "Гарячі сльози Герди", "Вогонь"], "a": 1, "e": "Сила любові."}, {"t": "input", "q": "Як звали дівчинку, що врятувала Кая?", "a": ["герда"], "e": "Герда."}, {"t": "choice", "q": "Головна думка казки:", "o": ["Зима небезпечна", "Любов і вірне серце перемагають холод і зло", "Не грайся з дзеркалами"], "a": 1, "e": "Серце сильніше за холодний розум."}]}, {"id": "zl-wilde", "sec": "Літературні казки світу", "title": "Оскар Вайлд. «Хлопчик-зірка»", "goal": "Ти пам'ятаєш, як Хлопчик-зірка змінився від жорстокості до добра, і знаєш, хто такий Оскар Вайлд.", "learn": [{"h": "Оскар Вайлд (1854–1900)", "p": ["Англійський (ірландський) письменник, народився в <b>Дубліні</b>. Автор казок «Хлопчик-зірка», «Щасливий принц», «Соловей і троянда», роману «Портрет Доріана Ґрея». У казках — краса, милосердя й любов."]}, {"h": "Сюжет", "p": ["Двоє лісорубів узимку знайшли в лісі, де впала зірка, дитину в золотому плащі. Бідний лісоруб узяв її додому. <b>Хлопчик-зірка</b> виріс дуже <b>гарним, але гордим і жорстоким</b>: кидав каміння в жебраків, мучив тварин, зневажав інших дітей. Коли до села прийшла <b>жебрачка</b> й назвалась його матір'ю, він <b>відштовхнув її</b>. За це став <b>потворним</b>, як жаба, і всі його відвернулись. Три роки він шукав матір, страждав. Потрапив у рабство до злого <b>чаклуна</b>, який наказав приносити монети з білого, жовтого й червоного золота. Хлопчик знаходив їх із допомогою <b>зайця</b>, якого врятував, але щоразу віддавав монету <b>прокаженому</b>, хоч знав, що чаклун його битиме. За третім разом до нього повернулась краса; жебрачка і прокажений виявились <b>королевою і королем</b> — його батьками. Він став королем і правив справедливо, але недовго."], "note": "Ідея: справжня краса — у доброті й милосерді; жорстокість спотворює людину, а каяття й самопожертва очищають."}], "remember": "Вайлд — Дублін. Хлопчик-зірка: гарний, але жорстокий → відштовхнув матір-жебрачку → став потворним → шукав матір, три рази віддав золото прокаженому → повернулась краса → батьки — король і королева.", "cards": [{"f": "Оскар Вайлд — країна, місто", "b": "Ірландія, Дублін (писав англійською)."}, {"f": "Звідки взявся Хлопчик-зірка?", "b": "Лісоруби знайшли дитину в золотому плащі там, де впала зірка."}, {"f": "Який вчинок покарано потворністю?", "b": "Хлопчик відштовхнув жебрачку, яка назвалась його матір'ю."}, {"f": "Що наказував чаклун?", "b": "Приносити монети з білого, жовтого й червоного золота."}, {"f": "Кому Хлопчик віддавав золото?", "b": "Прокаженому — попри побої чаклуна."}, {"f": "Хто допомагав знаходити золото?", "b": "Заєць, якого хлопчик звільнив із пастки."}, {"f": "Ким виявились жебрачка й прокажений?", "b": "Королевою й королем — батьками Хлопчика-зірки."}], "quiz": [{"t": "choice", "q": "Де народився Оскар Вайлд?", "o": ["У Лондоні", "У Дубліні", "У Парижі"], "a": 1, "e": "Дублін, Ірландія."}, {"t": "choice", "q": "Хто знайшов Хлопчика-зірку?", "o": ["Мисливці", "Лісоруби", "Пастухи"], "a": 1, "e": "Двоє лісорубів узимку."}, {"t": "choice", "q": "Яким виріс Хлопчик-зірка?", "o": ["Гарним, але гордим і жорстоким", "Добрим і скромним", "Потворним і злим"], "a": 0, "e": "Краса без доброти."}, {"t": "choice", "q": "За що Хлопчик-зірка став потворним?", "o": ["За брехню", "За те, що відштовхнув матір-жебрачку", "За крадіжку"], "a": 1, "e": "Найбільший гріх — зневага до матері."}, {"t": "choice", "q": "Хто допомагав йому знаходити золото?", "o": ["Заєць", "Вовк", "Ворон"], "a": 0, "e": "Врятований заєць."}, {"t": "choice", "q": "Кому хлопчик віддавав знайдене золото?", "o": ["Чаклуну", "Прокаженому", "Матері"], "a": 1, "e": "Жертвував собою заради хворого."}, {"t": "choice", "q": "Ким виявилась жебрачка?", "o": ["Чаклункою", "Королевою, його матір'ю", "Сусідкою"], "a": 1, "e": "А прокажений — королем."}, {"t": "choice", "q": "Скільки років Хлопчик-зірка шукав матір?", "o": ["Один", "Три", "Десять"], "a": 1, "e": "Три роки."}, {"t": "choice", "q": "Головна думка казки:", "o": ["Краса — головне", "Справжня краса — у доброті й милосерді", "Не довіряй чаклунам"], "a": 1, "e": "Жорстокість спотворює, каяття очищає."}, {"t": "tf", "q": "Хлопчик-зірка правив довго й щасливо до старості.", "a": false, "e": "Ні, він правив справедливо, але помер через три роки."}]}, {"id": "zl-dahl", "sec": "Літературні казки світу", "title": "Роальд Дал. «Чарлі і шоколадна фабрика»", "goal": "Ти пам'ятаєш героїв повісті-казки і розумієш, за що Чарлі отримав фабрику.", "learn": [{"h": "Роальд Дал (1916–1990)", "p": ["Британський письменник норвезького походження, народився в <b>Уельсі</b>. Був льотчиком. Книжки: «Чарлі і шоколадна фабрика», «Матильда», «Джеймс і гігантський персик», «ВДВ». Гумор, фантазія, іронія щодо поганих дорослих і зіпсованих дітей."]}, {"h": "Сюжет", "p": ["<b>Чарлі Бакет</b> живе в бідній родині (батьки, чотири бабусі й дідусі — <b>дідусь Джо</b>); шоколадку отримує лише раз на рік. Дивак-кондитер <b>Віллі Вонка</b> ховає <b>п'ять золотих квитків</b> у шоколадки — переможці побачать фабрику. Квитки знаходять: ненажера <b>Авґустус Ґлуп</b>, зіпсована <b>Верука Солт</b>, жуйколюбка <b>Вайолет Борегард</b>, телеманіяк <b>Майк Тіві</b> — і Чарлі. На фабриці працюють маленькі <b>умпа-лумпи</b>. Кожна зіпсована дитина через свій недолік вибуває: Авґустус падає в шоколадну річку, Вайолет стає чорницею, Веруку скидають білки в сміттєпровід, Майка зменшує телевізор. Чарлі, чесний і скромний, залишається останнім — і Вонка <b>дарує йому фабрику</b>."], "note": "Ідея: скромність, чесність і доброта варті більше за багатство; жадібність, розбещеність і залежності карають самі себе."}], "remember": "Дал — Уельс. Чарлі Бакет, дідусь Джо, Віллі Вонка, п'ять золотих квитків; Авґустус Ґлуп (ненажера), Верука Солт (зіпсована), Вайолет Борегард (жуйка), Майк Тіві (телевізор); умпа-лумпи; Чарлі отримує фабрику.", "cards": [{"f": "Хто написав «Чарлі і шоколадну фабрику»?", "b": "Роальд Дал, британський письменник норвезького походження."}, {"f": "Скільки золотих квитків сховав Вонка?", "b": "П'ять."}, {"f": "Хто пішов з Чарлі на фабрику?", "b": "Дідусь Джо."}, {"f": "Умпа-лумпи", "b": "Маленькі працівники фабрики Вонки."}, {"f": "Авґустус Ґлуп", "b": "Ненажера; впав у шоколадну річку."}, {"f": "Вайолет Борегард", "b": "Жувала жуйку і стала чорницею."}, {"f": "Верука Солт", "b": "Зіпсована дівчинка; білки скинули в сміттєпровід."}, {"f": "Майк Тіві", "b": "Телеманіяк; його зменшив телевізор."}, {"f": "Що отримав Чарлі?", "b": "Усю фабрику Вонки."}], "quiz": [{"t": "choice", "q": "Хто такий Віллі Вонка?", "o": ["Учитель Чарлі", "Власник шоколадної фабрики", "Дідусь Чарлі"], "a": 1, "e": "Дивак-кондитер."}, {"t": "choice", "q": "Скільки було золотих квитків?", "o": ["Три", "П'ять", "Десять"], "a": 1, "e": "П'ять."}, {"t": "choice", "q": "Хто супроводжував Чарлі на фабрику?", "o": ["Мама", "Дідусь Джо", "Бабуся Джорджина"], "a": 1, "e": "Дідусь Джо."}, {"t": "choice", "q": "Хто впав у шоколадну річку?", "o": ["Авґустус Ґлуп", "Майк Тіві", "Верука Солт"], "a": 0, "e": "Ненажера Авґустус."}, {"t": "choice", "q": "Хто перетворився на чорницю?", "o": ["Вайолет Борегард", "Верука Солт", "Чарлі"], "a": 0, "e": "Через експериментальну жуйку."}, {"t": "choice", "q": "Хто працює на фабриці Вонки?", "o": ["Роботи", "Умпа-лумпи", "Гноми"], "a": 1, "e": "Умпа-лумпи."}, {"t": "choice", "q": "Чому саме Чарлі отримав фабрику?", "o": ["Бо він найбідніший", "Бо він чесний, скромний і добрий", "Бо він виграв змагання"], "a": 1, "e": "Інші діти вибули через свої недоліки."}, {"t": "input", "q": "Прізвище Чарлі?", "a": ["бакет"], "e": "Чарлі Бакет."}, {"t": "choice", "q": "Який недолік у Майка Тіві?", "o": ["Ненажерливість", "Залежність від телевізора", "Жадібність"], "a": 1, "e": "Телеманіяк."}, {"t": "tf", "q": "Роальд Дал народився в Норвегії.", "a": false, "e": "В Уельсі, але родина — з Норвегії."}]}, {"id": "zl-poety-pryroda", "sec": "Слухаємо голоси природи", "title": "Поети про природу: Джон Кітс, Ґете, Гейне", "goal": "Ти пам'ятаєш три вірші про природу і розумієш, що таке ліричний твір, пейзаж, ліричний герой.", "learn": [{"h": "Ліричний твір і пейзаж", "p": ["<span class='term'>Лірика</span> передає почуття й настрій. <span class='term'>Пейзаж</span> — опис природи; у ліриці природа відображає стан душі <span class='term'>ліричного героя</span>."]}, {"h": "Джон Кітс (1795–1821). «Про коника та цвіркуна»", "p": ["Англійський поет-романтик, прожив 25 років. Вірш: «Поезія землі не вмре ніколи». Влітку, коли птахи змовкли від спеки, співає <b>коник</b> у траві; узимку, коли все мовчить, за пічкою співає <b>цвіркун</b> — і здається, що це знову коник. Природа ніколи не мовчить, її пісня вічна."]}, {"h": "Йоганн Вольфґанґ Ґете (1749–1832). «Нічна пісня подорожнього»", "p": ["Найбільший німецький поет («Фауст»). Коротка мініатюра: спокій над гірськими вершинами, ані подиху вітру, птахи змовкли в лісі — «зажди лише, скоро й ти спочинеш». Спокій природи → спокій душі. Переклав українською Микола Бажан."]}, {"h": "Генріх Гейне (1797–1856). «Задзвени із глибини…»", "p": ["Німецький поет-романтик. Весняна пісенька: ліричний герой просить пісню задзвеніти, полинути до троянди й привітати її — «передай від мене вітання». Радість весни, ніжність, музичність. Українською перекладала Леся Українка."]}], "remember": "Кітс — коник (літо) і цвіркун (зима): поезія землі не вмре. Ґете — «Нічна пісня подорожнього»: спокій вершин, спокій душі. Гейне — «Задзвени із глибини»: весняна пісня до троянди. Пейзаж — опис природи.", "cards": [{"f": "Хто написав «Про коника та цвіркуна»?", "b": "Джон Кітс, англійський поет."}, {"f": "Хто співає влітку, а хто взимку у вірші Кітса?", "b": "Улітку — коник у траві, узимку — цвіркун за пічкою."}, {"f": "Головна думка вірша Кітса", "b": "«Поезія землі не вмре ніколи» — природа завжди співає."}, {"f": "Хто написав «Нічну пісню подорожнього»?", "b": "Йоганн Вольфґанґ Ґете, німецький поет."}, {"f": "Настрій «Нічної пісні подорожнього»", "b": "Спокій, тиша, умиротворення."}, {"f": "Хто написав «Задзвени із глибини…»?", "b": "Генріх Гейне; вірш про весну й троянду."}, {"f": "Пейзаж", "b": "Опис природи в художньому творі."}], "quiz": [{"t": "choice", "q": "Хто написав «Про коника та цвіркуна»?", "o": ["Кітс", "Ґете", "Гейне"], "a": 0, "e": "Джон Кітс."}, {"t": "choice", "q": "Хто співає взимку у вірші Кітса?", "o": ["Коник", "Цвіркун", "Соловей"], "a": 1, "e": "Цвіркун за пічкою."}, {"t": "choice", "q": "Головна думка вірша Кітса:", "o": ["Зима сумна", "Природа співає завжди, поезія землі вічна", "Коники шкідливі"], "a": 1, "e": "«Поезія землі не вмре ніколи»."}, {"t": "choice", "q": "Хто написав «Нічну пісню подорожнього»?", "o": ["Кітс", "Ґете", "Гейне"], "a": 1, "e": "Ґете."}, {"t": "choice", "q": "Який настрій у «Нічній пісні подорожнього»?", "o": ["Тривога", "Спокій і тиша", "Веселощі"], "a": 1, "e": "«Скоро й ти спочинеш»."}, {"t": "choice", "q": "Про яку пору року вірш Гейне «Задзвени із глибини…»?", "o": ["Зима", "Весна", "Осінь"], "a": 1, "e": "Весняна пісенька."}, {"t": "choice", "q": "Кому передає вітання пісня в Гейне?", "o": ["Троянді", "Місяцю", "Морю"], "a": 0, "e": "«До троянди полети»."}, {"t": "input", "q": "Як називається опис природи у творі?", "a": ["пейзаж"], "e": "Пейзаж."}, {"t": "choice", "q": "З якої країни Ґете і Гейне?", "o": ["Англія", "Німеччина", "Франція"], "a": 1, "e": "Обидва — німецькі поети."}]}, {"id": "zl-kipling-mauhli", "sec": "Слухаємо голоси природи", "title": "Редьярд Кіплінг. «Мауглі» («Книга джунглів»)", "goal": "Ти пам'ятаєш героїв «Мауглі» і Закон Джунглів.", "learn": [{"h": "Редьярд Кіплінг (1865–1936)", "p": ["Англійський письменник, народився в <b>Бомбеї (Індія)</b>. Перший англійський лауреат <b>Нобелівської премії</b> з літератури (1907). «Книга джунглів» (1894) — оповідання про Мауглі; також «Ріккі-Тіккі-Таві», «Як і чому»."]}, {"h": "Герої", "p": ["<b>Мауглі</b> («жабеня») — людське дитя, яке виховали вовки. <b>Батько Вовк</b> і <b>Мати Вовчиця (Ракша)</b>. <b>Акела</b> — ватажок вовчої зграї. <b>Балу</b> — старий ведмідь, учитель Закону Джунглів. <b>Багіра</b> — чорна пантера, викупила Мауглі биком. <b>Каа</b> — мудрий пітон. <b>Шер-Хан</b> — кульгавий тигр, ворог Мауглі. <b>Табакі</b> — шакал-підлиза. <b>Бандар-логи</b> — дурне мавпяче плем'я. <b>Хатхі</b> — слон."]}, {"h": "Сюжет", "p": ["Шер-Хан полює на людське дитя; вовки приймають його в зграю за викуп Багіри й слово Балу. Мауглі росте, вчить Закон Джунглів. Мавпи викрадають його в Холодні Лігва — рятують Багіра, Балу й Каа. Шер-Хан підбурює молодих вовків проти Акели; Мауглі приносить <b>Червону Квітку</b> (вогонь) і проганяє тигра. Іде до людей, у село (жінка Мессуа), пасе буйволів і з їхньою допомогою вбиває Шер-Хана. Зрештою Мауглі — «ні вовк, ні людина» — повертається до людей."], "note": "Закон Джунглів: «Ми з тобою однієї крові, ти і я»; не вбивати заради розваги; сила зграї — у вовку, сила вовка — у зграї. Ідея: людина й природа, дружба, відповідальність, честь."}], "remember": "Кіплінг — Індія, Нобель 1907. Мауглі, Акела (ватажок), Балу (ведмідь-учитель), Багіра (пантера), Каа (пітон), Шер-Хан (тигр), Табакі (шакал), бандар-логи (мавпи). Червона Квітка — вогонь. «Ми з тобою однієї крові».", "cards": [{"f": "Де народився Кіплінг?", "b": "У Бомбеї, в Індії."}, {"f": "Яку премію отримав Кіплінг?", "b": "Нобелівську премію з літератури (1907)."}, {"f": "Акела", "b": "Ватажок вовчої зграї."}, {"f": "Балу", "b": "Старий ведмідь, учитель Закону Джунглів."}, {"f": "Багіра", "b": "Чорна пантера; викупила Мауглі биком."}, {"f": "Каа", "b": "Мудрий пітон; врятував Мауглі від мавп."}, {"f": "Шер-Хан і Табакі", "b": "Кульгавий тигр — ворог Мауглі; шакал-підлиза."}, {"f": "Червона Квітка", "b": "Вогонь, якого бояться звірі."}, {"f": "«Ми з тобою однієї крові, ти і я»", "b": "Заповітні слова Джунглів — знак дружби й миру."}, {"f": "Хто такі бандар-логи?", "b": "Мавпяче плем'я без закону."}], "quiz": [{"t": "choice", "q": "Де народився Кіплінг?", "o": ["У Лондоні", "У Бомбеї", "У Сіднеї"], "a": 1, "e": "В Індії."}, {"t": "choice", "q": "Хто виховав Мауглі?", "o": ["Мавпи", "Вовки", "Ведмеді"], "a": 1, "e": "Вовча зграя."}, {"t": "choice", "q": "Хто такий Балу?", "o": ["Ведмідь-учитель", "Тигр", "Пітон"], "a": 0, "e": "Учив Мауглі Закону Джунглів."}, {"t": "choice", "q": "Хто такий Шер-Хан?", "o": ["Слон", "Кульгавий тигр", "Ватажок вовків"], "a": 1, "e": "Головний ворог Мауглі."}, {"t": "choice", "q": "Хто викрав Мауглі в Холодні Лігва?", "o": ["Мавпи (бандар-логи)", "Шер-Хан", "Люди"], "a": 0, "e": "Бандар-логи."}, {"t": "choice", "q": "Що таке Червона Квітка?", "o": ["Троянда", "Вогонь", "Кров"], "a": 1, "e": "Вогонь, якого бояться звірі."}, {"t": "choice", "q": "Хто такий Каа?", "o": ["Пітон", "Шакал", "Вовк"], "a": 0, "e": "Мудрий пітон."}, {"t": "input", "q": "Як звали ватажка вовчої зграї?", "a": ["акела"], "e": "Акела."}, {"t": "choice", "q": "Чим Багіра викупила Мауглі?", "o": ["Золотом", "Щойно вбитим биком", "Своєю шкурою"], "a": 1, "e": "Биком — так вовки прийняли дитину."}, {"t": "choice", "q": "Заповітні слова Джунглів:", "o": ["«Джунглі — наш дім»", "«Ми з тобою однієї крові, ти і я»", "«Сила в зубах»"], "a": 1, "e": "Знак дружби."}, {"t": "tf", "q": "Кіплінг отримав Нобелівську премію з літератури.", "a": true, "e": "1907, перший англомовний лауреат."}]}, {"id": "zl-seton-lobo", "sec": "Слухаємо голоси природи", "title": "Ернест Сетон-Томпсон. «Лобо — володар Курумпо»", "goal": "Ти пам'ятаєш історію вовка Лобо і знаєш, що таке анімалістична література.", "learn": [{"h": "Ернест Сетон-Томпсон (1860–1946)", "p": ["Канадсько-американський письменник, художник, натураліст; народився в Англії. Засновник <span class='term'>анімалістичної літератури</span> — творів про тварин, де вони показані правдиво, як у природі, без казковості. Книга «Тварини, яких я знав»."]}, {"h": "Сюжет", "p": ["У долині <b>Курумпо</b> (Нью-Мексико) зграя вовків на чолі з велетенським сірим <b>Лобо</b> роками нищила худобу. Лобо був надзвичайно розумний: не чіпав отруєного м'яса, обминав капкани, знімав приманки. Автор приїхав його впіймати: отруєні приманки Лобо зібрав докупи й <b>загидив</b>; капкани викопав. Слабке місце Лобо — його подруга, біла вовчиця <b>Бланка</b>: вона потрапила в капкан, її вбили. Лобо, збожеволілий від горя, шукав її по слідах і сам потрапив у <b>чотири капкани</b>. Його не вбили, а зв'язали й привезли на ранчо; він відмовився від їжі, дивився на прерію і за ніч помер — від туги."], "note": "Автор захоплюється вовком і кається за вчинене. Ідея: тварини мають гідність, вірність і почуття; людина не має права їх бездумно знищувати."}], "remember": "Сетон-Томпсон — засновник анімалістичної літератури. Лобо — вожак вовків у Курумпо, надрозумний; Бланка — біла вовчиця; загинув через любов до Бланки — потрапив у капкани й помер від туги.", "cards": [{"f": "Анімалістична література", "b": "Твори про тварин, показаних правдиво, як у природі. Засновник — Сетон-Томпсон."}, {"f": "Хто такий Лобо?", "b": "Велетенський розумний вовк, вожак зграї в долині Курумпо."}, {"f": "Де відбуваються події?", "b": "У долині Курумпо, Нью-Мексико (США)."}, {"f": "Хто така Бланка?", "b": "Біла вовчиця, подруга Лобо."}, {"f": "Як Лобо ставився до отруєних приманок?", "b": "Зібрав їх докупи і загидив."}, {"f": "Як загинув Лобо?", "b": "Шукаючи Бланку, потрапив у капкани; у полоні відмовився від їжі й помер від туги."}], "quiz": [{"t": "choice", "q": "Хто заснував анімалістичну літературу?", "o": ["Кіплінг", "Сетон-Томпсон", "Твен"], "a": 1, "e": "Ернест Сетон-Томпсон."}, {"t": "choice", "q": "Чим анімалістична література відрізняється від казок про тварин?", "o": ["Тварини показані правдиво, як у природі", "Тварини розмовляють", "Завжди щасливий кінець"], "a": 0, "e": "Реальні спостереження натураліста."}, {"t": "choice", "q": "Хто такий Лобо?", "o": ["Собака", "Вовк-вожак", "Койот"], "a": 1, "e": "Володар Курумпо."}, {"t": "choice", "q": "Як Лобо вчинив з отруєними приманками?", "o": ["З'їв", "Зібрав докупи і загидив", "Проігнорував"], "a": 1, "e": "Показав зневагу до мисливців."}, {"t": "choice", "q": "Хто така Бланка?", "o": ["Дочка автора", "Біла вовчиця, подруга Лобо", "Корова"], "a": 1, "e": "Через неї Лобо загинув."}, {"t": "choice", "q": "Що стало слабким місцем Лобо?", "o": ["Голод", "Любов до Бланки", "Старість"], "a": 1, "e": "Він шукав її і попався."}, {"t": "choice", "q": "У скільки капканів потрапив Лобо?", "o": ["Один", "Чотири", "Десять"], "a": 1, "e": "Чотири — по всіх лапах."}, {"t": "choice", "q": "Від чого помер Лобо?", "o": ["Від пострілу", "Від туги, відмовившись від їжі", "Від отрути"], "a": 1, "e": "Помер вільним духом."}, {"t": "choice", "q": "Як автор ставиться до Лобо?", "o": ["Ненавидить", "Захоплюється й кається", "Байдуже"], "a": 1, "e": "Після цієї історії Сетон-Томпсон став захисником природи."}, {"t": "input", "q": "Як називається долина, де жив Лобо?", "a": ["курумпо"], "e": "Курумпо."}]}, {"id": "zl-hoffmann", "sec": "Сила творчої уяви", "title": "Ернст Теодор Амадей Гофман. «Лускунчик і Мишачий король»", "goal": "Ти пам'ятаєш сюжет казки про Лускунчика і розрізняєш реальний і фантастичний світи в ній.", "learn": [{"h": "Гофман (1776–1822)", "p": ["Німецький письменник-романтик, композитор, художник, юрист. Казка «Лускунчик і Мишачий король» (1816) стала основою балету Чайковського. У творах Гофмана два світи: буденний і чарівний."]}, {"h": "Сюжет", "p": ["На Різдво <b>Марі</b> і <b>Фріц</b> Штальбаум отримують подарунки від хрещеного <b>Дроссельмеєра</b>. Марі впадає в око негарний <b>Лускунчик</b> — лялька для горіхів; Фріц ламає йому зуби. Уночі Марі бачить битву іграшок під проводом Лускунчика з мишами <b>Мишачого короля</b> (семиголового). Дроссельмеєр розповідає казку про <b>твердий горіх Кракатук</b>: принцесу Пірліпат зачарувала Мишильда, зняти чари міг юнак, розгризши горіх, — це був племінник Дроссельмеєра; після рятування він сам став потворним Лускунчиком, а принцеса його відштовхнула. Розчарувати може лише дівчина, яка полюбить його незважаючи на потворність. Марі віддає Лускунчику свої цукерки для миру, дає шаблю; він перемагає Мишачого короля й веде Марі в <b>Лялькове королівство</b>. Марі каже, що не відштовхнула б Лускунчика, — і чари спадають: він стає юнаком і одружується з нею."], "note": "Реальне: дім Штальбаумів, Різдво, іграшки. Фантастичне: битва, Лялькове королівство, ожилий Лускунчик. Ідея: вірність, доброта й любов рятують; краса душі важливіша за зовнішність."}], "remember": "Гофман — Німеччина. Марі, Фріц, хрещений Дроссельмеєр, Лускунчик, Мишачий король (7 голів), горіх Кракатук, принцеса Пірліпат, Мишильда, Лялькове королівство. Два світи: реальний і фантастичний.", "cards": [{"f": "Хто автор «Лускунчика»?", "b": "Ернст Теодор Амадей Гофман, німецький романтик."}, {"f": "Головна героїня казки", "b": "Марі Штальбаум."}, {"f": "Хто такий Дроссельмеєр?", "b": "Хрещений Марі і Фріца, годинникар і майстер іграшок."}, {"f": "Скільки голів у Мишачого короля?", "b": "Сім."}, {"f": "Горіх Кракатук", "b": "Твердий горіх, розгризши який, можна зняти чари з принцеси Пірліпат."}, {"f": "Хто зачарував принцесу і Лускунчика?", "b": "Мишильда — мишача королева."}, {"f": "Як спали чари з Лускунчика?", "b": "Марі полюбила його попри потворність."}, {"f": "Куди Лускунчик повів Марі?", "b": "У Лялькове королівство."}], "quiz": [{"t": "choice", "q": "З якої країни Гофман?", "o": ["Австрія", "Німеччина", "Данія"], "a": 1, "e": "Німецький романтик."}, {"t": "choice", "q": "Коли відбуваються події казки?", "o": ["На Різдво", "На Пасху", "Влітку"], "a": 0, "e": "Різдвяний вечір у Штальбаумів."}, {"t": "choice", "q": "Хто зламав Лускунчику зуби?", "o": ["Марі", "Фріц", "Мишачий король"], "a": 1, "e": "Брат Фріц."}, {"t": "choice", "q": "Скільки голів у Мишачого короля?", "o": ["Три", "Сім", "Дев'ять"], "a": 1, "e": "Семиголовий."}, {"t": "choice", "q": "Що таке Кракатук?", "o": ["Місто", "Твердий горіх", "Меч"], "a": 1, "e": "Чарівний горіх."}, {"t": "choice", "q": "Хто такий Дроссельмеєр?", "o": ["Хрещений дітей", "Батько Марі", "Мишачий король"], "a": 0, "e": "Годинникар, хрещений."}, {"t": "choice", "q": "Чому Лускунчик став потворним?", "o": ["Його зачарувала Мишильда", "Він упав", "Це його справжній вигляд"], "a": 0, "e": "Помста Мишильди."}, {"t": "choice", "q": "Що зняло чари з Лускунчика?", "o": ["Шабля", "Любов Марі попри потворність", "Горіх"], "a": 1, "e": "Марі не відштовхнула його."}, {"t": "choice", "q": "Що у казці фантастичне?", "o": ["Різдвяна ялинка", "Битва іграшок з мишами", "Подарунки"], "a": 1, "e": "Фантастичний світ ночі."}, {"t": "input", "q": "Як звали головну героїню?", "a": ["марі", "маріхен", "марія"], "e": "Марі."}]}, {"id": "zl-carroll", "sec": "Сила творчої уяви", "title": "Льюїс Керролл. «Аліса в Країні Див»", "goal": "Ти пам'ятаєш героїв Країни Див і знаєш, чим казка Керролла особлива.", "learn": [{"h": "Льюїс Керролл (1832–1898)", "p": ["Справжнє ім'я — <b>Чарльз Лютвідж Доджсон</b>, англійський математик, викладач Оксфорда. Казку вигадав для дівчинки <b>Аліси Лідделл</b> під час прогулянки на човні; видав 1865 р. Продовження — «Аліса в Задзеркаллі». Особливість: <b>гра слів, каламбури, абсурд (нонсенс)</b>, пародії на вірші."]}, {"h": "Сюжет і герої", "p": ["<b>Аліса</b> засинає на березі, бачить <b>Білого Кролика</b> з годинником і падає за ним у нору. Пляшечка «Випий мене» і пиріжок «З'їж мене» змінюють її зріст. Море сліз, <b>Миша</b>, біг по колу. <b>Гусінь</b> на грибі («Хто ти така?»). <b>Герцогиня</b>, кухарка й немовля, що стає поросям. <b>Чеширський Кіт</b> зі зникаючою усмішкою. <b>Божевільне чаювання</b>: <b>Капелюшник</b>, <b>Шалений Заєць</b>, <b>Сонько</b>; там завжди шоста година. Сад <b>Королеви Сердець</b> («Відрубати голову!»), крокет із фламінго й їжаками. Суд над <b>Валетом</b> за вкрадені пиріжки; Аліса виростає, розсипає карти — і прокидається."], "note": "Ідея: сила уяви, дитячий погляд на світ дорослих із його безглуздими правилами; гра з логікою та мовою."}], "remember": "Керролл = Доджсон, математик з Оксфорда; казка для Аліси Лідделл, 1865. Білий Кролик, Гусінь, Чеширський Кіт, Капелюшник, Шалений Заєць, Сонько, Королева Сердець, Валет. Нонсенс, гра слів.", "cards": [{"f": "Справжнє ім'я Льюїса Керролла", "b": "Чарльз Лютвідж Доджсон, математик з Оксфорда."}, {"f": "Для кого вигадано казку?", "b": "Для дівчинки Аліси Лідделл."}, {"f": "Як Аліса потрапила в Країну Див?", "b": "Побігла за Білим Кроликом і впала в нору."}, {"f": "Чеширський Кіт", "b": "Кіт, що зникає, залишаючи усмішку."}, {"f": "Хто був на божевільному чаюванні?", "b": "Капелюшник, Шалений Заєць, Сонько."}, {"f": "Улюблена фраза Королеви Сердець", "b": "«Відрубати їй голову!»"}, {"f": "Особливість стилю Керролла", "b": "Нонсенс (абсурд), гра слів, каламбури, пародії."}], "quiz": [{"t": "choice", "q": "Ким був Льюїс Керролл за професією?", "o": ["Лікарем", "Математиком", "Моряком"], "a": 1, "e": "Викладав математику в Оксфорді."}, {"t": "choice", "q": "За ким побігла Аліса?", "o": ["За Чеширським Котом", "За Білим Кроликом", "За Капелюшником"], "a": 1, "e": "Кролик із годинником."}, {"t": "choice", "q": "Хто зникає, залишаючи усмішку?", "o": ["Чеширський Кіт", "Гусінь", "Сонько"], "a": 0, "e": "Чеширський Кіт."}, {"t": "choice", "q": "Хто НЕ був на божевільному чаюванні?", "o": ["Капелюшник", "Шалений Заєць", "Королева"], "a": 2, "e": "Капелюшник, Заєць, Сонько."}, {"t": "choice", "q": "Що любила повторювати Королева Сердець?", "o": ["«Випий мене!»", "«Відрубати голову!»", "«Хто ти така?»"], "a": 1, "e": "Королева Сердець."}, {"t": "choice", "q": "Чим грали в крокет у Королеви?", "o": ["Фламінго й їжаками", "М'ячами", "Картами"], "a": 0, "e": "Абсурд Країни Див."}, {"t": "choice", "q": "Кого судили в будь-якій біді.", "cards": [{"f": "Хто написала «Полліанну»?", "b": "Елеонор Портер, американська письменниця (1913)."}, {"f": "«Гра в радість»", "b": "У будь-якій біді знайти, чому радіти; навчив батько Полліанни."}, {"f": "До кого приїхала Полліанна?", "b": "До суворої тітки Поллі Гаррінґтон у Белдінгсвіль."}, {"f": "Приклад гри в радість з милицями", "b": "Замість ляльки прислали милиці — радій, що вони тобі не потрібні."}, {"f": "Хто такий Джиммі Бін?", "b": "Хлопчик-сирота, якому Полліанна шукала дім."}, {"f": "Що сталось з Полліанною?", "b": "Її збила машина; вона не могла ходити, але місто повернуло їй радість."}, {"f": "Лікар Чилтон", "b": "Самотній лікар, колишній наречений тітки Поллі; вони помирились."}], "quiz": [{"t": "choice", "q": "Що таке «гра в радість»?", "o": ["Настільна гра", "У будь-якій біді знайти, чому радіти", "Гра в м'яч"], "a": 1, "e": "Навчив батько Полліанни."}, {"t": "choice", "q": "Хто навчив Полліанну гри?", "o": ["Тітка Поллі", "Батько", "Ненсі"], "a": 1, "e": "Батько-пастор."}, {"t": "choice", "q": "Де поселила тітка Полліанну?", "o": ["У найкращій кімнаті", "На горищі", "У підвалі"], "a": 1, "e": "І дівчинка зраділа краєвиду з вікна."}, {"t": "choice", "q": "Чому радіти, якщо замість ляльки прислали милиці?", "o": ["Що вони не потрібні", "Що можна продати", "Що вони дерев'яні"], "a": 0, "e": "Класичний приклад гри."}, {"t": "choice", "q": "Хто така Ненсі?", "o": ["Служниця тітки Поллі", "Сестра Полліанни", "Учителька"], "a": 0, "e": "Служниця, перша подруга."}, {"t": "choice", "q": "Що сталось з Полліанною?", "o": ["Захворіла на грип", "Її збила машина", "Загубилась"], "a": 1, "e": "Вона не могла ходити."}, {"t": "choice", "q": "Хто повернув Полліанні радість, коли вона сама зневірилась?", "o": ["Лікар", "Усе місто, розповівши, як гра їх змінила", "Тітка"], "a": 1, "e": "Гра повернулась до неї."}, {"t": "input", "q": "Як звали тітку Полліанни?", "a": ["поллі", "тітка поллі", "поллі гаррінгтон", "поллі гаррінґтон"], "e": "Поллі Гаррінґтон."}, {"t": "choice", "q": "Що означає слово «полліанна» сьогодні?", "o": ["Плакса", "Невиправний оптиміст", "Сирота"], "a": 1, "e": "Оптиміст."}, {"t": "choice", "q": "Із якої країни Елеонор Портер?", "o": ["Англія", "США", "Канада"], "a": 1, "e": "Американська письменниця."}]}, {"id": "zl-twain", "sec": "У вирі захопливих пригод", "title": "Марк Твен. «Пригоди Тома Соєра»", "goal": "Ти пам'ятаєш головні пригоди Тома Соєра і знаєш, хто такий Марк Твен.", "learn": [{"h": "Марк Твен (1835–1910)", "p": ["Справжнє ім'я — <b>Семюел Ленґгорн Клеменс</b>, американський письменник. Псевдонім «марк твен» — вигук лоцманів на Міссісіпі («мірка два» — безпечна глибина). Дитинство — у містечку <b>Ганнібал</b> на Міссісіпі, прототип Сент-Пітерсберга. Книжки: «Пригоди Тома Соєра» (1876), «Пригоди Гекльберрі Фінна», «Принц і злидар»."]}, {"h": "Герої", "p": ["<b>Том Соєр</b> — винахідливий пустун, мрійник, добрий. <b>Тітка Поллі</b> — виховує його. <b>Сід</b> — зразковий брат-донощик. <b>Гекльберрі Фінн</b> — безпритульний друг, вільний як вітер. <b>Беккі Тетчер</b> — кохання Тома. <b>Індіанець Джо</b> — злочинець. <b>Мафф Поттер</b> — невинно обвинувачений."]}, {"h": "Пригоди", "p": ["<b>Фарбування паркану</b>: Том так представив покарання розвагою, що хлопці платили за право фарбувати (принцип: «робота — те, що мусиш; гра — те, чого не мусиш»). <b>Дохлий кіт</b> і похід на цвинтар уночі з Геком — свідки вбивства лікаря Індіанцем Джо. <b>Утеча на острів Джексона</b> «в пірати» з Геком і Джо Гарпером; повернення на власний похорон. <b>Свідчення на суді</b> — Том сміливо рятує Маффа Поттера. <b>Печера</b>: Том і Беккі заблукали; Том знайшов вихід і врятував Беккі. <b>Скарб</b> Індіанця Джо, знайдений з Геком."], "note": "Ідея: дитинство, дружба, сміливість і чесність; іронія щодо нудних правил дорослих."}], "remember": "Марк Твен = Семюел Клеменс, «мірка два» — вигук лоцманів; Ганнібал на Міссісіпі. Том, тітка Поллі, Сід, Гек Фінн, Беккі Тетчер, Індіанець Джо, Мафф Поттер. Паркан, цвинтар, острів і власний похорон, суд, печера, скарб.", "cards": [{"f": "Справжнє ім'я Марка Твена", "b": "Семюел Ленґгорн Клеменс."}, {"f": "Що означає псевдонім «Марк Твен»?", "b": "Вигук лоцманів на Міссісіпі — «мірка два», безпечна глибина."}, {"f": "Хто такий Гекльберрі Фінн?", "b": "Безпритульний друг Тома, вільний і незалежний."}, {"f": "Хто така Беккі Тетчер?", "b": "Дівчинка, в яку закоханий Том; з нею він заблукав у печері."}, {"f": "Як Том перетворив фарбування паркану на гру?", "b": "Удав, що це велика честь, і хлопці платили за право фарбувати."}, {"f": "Що бачили Том і Гек на цвинтарі?", "b": "Як Індіанець Джо вбив лікаря."}, {"f": "Кого врятував Том свідченням на суді?", "b": "Маффа Поттера."}, {"f": "Куди втекли хлопці «в пірати»?", "b": "На острів Джексона; повернулись на власний похорон."}], "quiz": [{"t": "choice", "q": "Справжнє ім'я Марка Твена:", "o": ["Семюел Клеменс", "Джек Лондон", "Чарльз Доджсон"], "a": 0, "e": "Семюел Ленґгорн Клеменс."}, {"t": "choice", "q": "Звідки взято псевдонім «Марк Твен»?", "o": ["З імені діда", "З вигуку лоцманів на Міссісіпі", "З назви міста"], "a": 1, "e": "«Мірка два» — безпечна глибина."}, {"t": "choice", "q": "Хто виховував Тома?", "o": ["Мати", "Тітка Поллі", "Бабуся"], "a": 1, "e": "Тітка Поллі."}, {"t": "choice", "q": "Як Том змусив хлопців фарбувати паркан?", "o": ["Заплатив їм", "Удав, що це велика честь, і вони самі платили", "Попросив тітку"], "a": 1, "e": "Винахідливість Тома."}, {"t": "choice", "q": "Що Том і Гек побачили на цвинтарі?", "o": ["Привида", "Убивство лікаря Індіанцем Джо", "Скарб"], "a": 1, "e": "І присяглись мовчати."}, {"t": "choice", "q": "Куди втекли Том, Гек і Джо Гарпер?", "o": ["На острів Джексона", "У Нью-Йорк", "У печеру"], "a": 0, "e": "Грати в піратів."}, {"t": "choice", "q": "На яку подію повернулись хлопці з острова?", "o": ["На свято", "На власний похорон", "На суд"], "a": 1, "e": "Усі думали, що вони потонули."}, {"t": "choice", "q": "Кого врятував Том на суді?", "o": ["Гека", "Маффа Поттера", "Індіанця Джо"], "a": 1, "e": "Розповів правду попри страх."}, {"t": "choice", "q": "З ким Том заблукав у печері?", "o": ["З Геком", "З Беккі Тетчер", "Із Сідом"], "a": 1, "e": "І знайшов вихід."}, {"t": "input", "q": "Як звали безпритульного друга Тома? Гекльберрі …", "a": ["фінн", "фін"], "e": "Гекльберрі Фінн."}]}, {"id": "zl-jansson", "sec": "У вирі захопливих пригод", "title": "Туве Янсон. «Комета прилітає»", "goal": "Ти пам'ятаєш героїв Долини мумі-тролів і сюжет повісті про комету.", "learn": [{"h": "Туве Янсон (1914–2001)", "p": ["<b>Фінська</b> письменниця й художниця, писала шведською. Створила світ <b>мумі-тролів</b> — добрих білих істот, схожих на бегемотиків. Книжки: «Комета прилітає», «Капелюх Чарівника», «Зима-чарівниця». Сама ілюструвала."]}, {"h": "Герої", "p": ["<b>Мумі-троль</b> — добрий, допитливий. <b>Мумі-мама</b> (завжди із сумочкою) і <b>Мумі-тато</b> (пише мемуари). <b>Чмих</b> — маленький боязкий друг, любить речі. <b>Нюхмумрик</b> — мандрівник із люлькою і губною гармошкою, цінує волю. <b>Хропся</b> (Фрекен Снорк) і її брат <b>Хропусь</b>. <b>Ондатр</b> — філософ, читає книжку про марність усього. <b>Гемуль</b> — колекціонер марок і рослин."]}, {"h": "Сюжет", "p": ["У Долині мумі-тролів усе стає сірим — наближається <b>комета</b>. Мумі-троль і Чмих вирушають в <b>Обсерваторію</b> в Самотніх горах дізнатись, коли впаде комета. Дорогою зустрічають Нюхмумрика, рятують Хропсю від отруйного куща, дізнаються дату — <b>7 жовтня</b>. Повертаються через висохле море на ходулях, зустрічають Гемуля. Усі ховаються в <b>печері</b>; комета проноситься повз — Долина врятована."], "note": "Ідея: дружба й взаємодопомога сильніші за страх; дім і родина — головна цінність. Реальне (природа, друзі) поєднано з фантастичним (мумі-тролі, комета)."}], "remember": "Туве Янсон — Фінляндія, шведською. Мумі-троль, Мумі-мама, Мумі-тато, Чмих, Нюхмумрик, Хропся, Хропусь, Ондатр, Гемуль. Похід в Обсерваторію, комета 7 жовтня, порятунок у печері.", "cards": [{"f": "Хто така Туве Янсон?", "b": "Фінська письменниця й художниця, творець мумі-тролів; писала шведською."}, {"f": "Хто такі мумі-тролі?", "b": "Добрі білі істоти, схожі на бегемотиків, живуть у Долині мумі-тролів."}, {"f": "Чмих", "b": "Маленький боязкий друг Мумі-троля, любить речі."}, {"f": "Нюхмумрик", "b": "Вільний мандрівник з люлькою й губною гармошкою."}, {"f": "Хропся", "b": "Дівчинка-хропа, яку врятував Мумі-троль; змінює колір."}, {"f": "Куди пішли Мумі-троль і Чмих?", "b": "В Обсерваторію в Самотніх горах — дізнатись про комету."}, {"f": "Коли мала впасти комета?", "b": "7 жовтня."}, {"f": "Де сховались герої від комети?", "b": "У печері на березі."}], "quiz": [{"t": "choice", "q": "З якої країни Туве Янсон?", "o": ["Швеція", "Фінляндія", "Норвегія"], "a": 1, "e": "Фінська, писала шведською."}, {"t": "choice", "q": "На кого схожі мумі-тролі?", "o": ["На ведмедиків", "На бегемотиків", "На котів"], "a": 1, "e": "Білі бегемотики."}, {"t": "choice", "q": "Куди вирушили Мумі-троль і Чмих?", "o": ["До моря", "В Обсерваторію", "У місто"], "a": 1, "e": "Дізнатись, коли впаде комета."}, {"t": "choice", "q": "Хто такий Нюхмумрик?", "o": ["Вільний мандрівник", "Учений", "Брат Мумі-троля"], "a": 0, "e": "З люлькою й гармошкою."}, {"t": "choice", "q": "Кого врятував Мумі-троль від отруйного куща?", "o": ["Чмиха", "Хропсю", "Гемуля"], "a": 1, "e": "Хропсю."}, {"t": "choice", "q": "Хто читає книжку про марність усього?", "o": ["Ондатр", "Гемуль", "Мумі-тато"], "a": 0, "e": "Філософ Ондатр."}, {"t": "choice", "q": "Що колекціонує Гемуль?", "o": ["Марки й рослини", "Монети", "Камінці"], "a": 0, "e": "Гемуль-колекціонер."}, {"t": "choice", "q": "Де сховались усі від комети?", "o": ["У будинку", "У печері", "На горі"], "a": 1, "e": "У печері."}, {"t": "input", "q": "Якого числа мала впасти комета? Напиши число (день).", "a": ["7", "сьомого", "7 жовтня"], "e": "7 жовтня."}, {"t": "choice", "q": "Головна думка повісті:", "o": ["Треба боятися комет", "Дружба й взаємодопомога сильніші за страх", "Мандрувати небезпечно"], "a": 1, "e": "І дім — головна цінність."}]}, {"id": "zl-teoriia", "sec": "Теорія літератури", "title": "Терміни 5 класу: сюжет, тема, ідея, портрет, пейзаж, антитеза", "goal": "Ти знаєш основні літературознавчі поняття із зарубіжної літератури.", "learn": [{"h": "Про твір", "p": ["<b>Тема</b> — про що твір. <b>Ідея</b> — головна думка. <b>Сюжет</b> — послідовність подій: <b>зав'язка</b> (початок), <b>розвиток дії</b>, <b>кульмінація</b> (найнапруженіший момент), <b>розв'язка</b> (кінець)."], "ex": ["«Лобо»: зав'язка — автор приїздить у Курумпо; кульмінація — Лобо в капканах; розв'язка — смерть вовка."]}, {"h": "Про героя", "p": ["<b>Персонаж (герой)</b> — дійова особа. <b>Портрет</b> — опис зовнішності. <b>Інтер'єр</b> — опис приміщення. <b>Пейзаж</b> — опис природи. <b>Антитеза</b> — протиставлення (пасербиця — ледача дочка; Том — Сід)."]}, {"h": "Жанри", "p": ["<b>Народна казка</b> (без автора) і <b>літературна казка</b> (з автором). <b>Оповідання</b> — одна подія, мало героїв («Лобо»). <b>Повість</b> — багато подій, довгий час («Полліанна», «Том Соєр»). <b>Анімалістична література</b> — про тварин правдиво. <b>Фантастика</b> — незвичайний вигаданий світ. <b>Мандрівний сюжет</b> — повторюється у різних народів."]}, {"h": "Мова твору", "p": ["<b>Оригінал</b> і <b>переклад</b>. <b>Віршована</b> і <b>прозова</b> мова. <b>Епітет, порівняння, метафора</b> — художні засоби."]}], "remember": "Сюжет: зав'язка → розвиток дії → кульмінація → розв'язка. Тема — про що, ідея — головна думка. Портрет — зовнішність, інтер'єр — приміщення, пейзаж — природа. Антитеза — протиставлення. Оповідання — коротке, повість — довга.", "cards": [{"f": "Елементи сюжету", "b": "Зав'язка, розвиток дії, кульмінація, розв'язка."}, {"f": "Кульмінація", "b": "Найнапруженіший момент твору."}, {"f": "Зав'язка", "b": "Подія, з якої починається дія."}, {"f": "Інтер'єр", "b": "Опис внутрішнього вигляду приміщення."}, {"f": "Антитеза", "b": "Різке протиставлення героїв, явищ, характерів."}, {"f": "Фантастика", "b": "Література про незвичайний вигаданий світ."}, {"f": "Оповідання / повість", "b": "Оповідання — одна подія, мало героїв; повість — багато подій, тривалий час."}], "quiz": [{"t": "choice", "q": "Найнапруженіший момент твору — це…", "o": ["зав'язка", "кульмінація", "розв'язка"], "a": 1, "e": "Кульмінація."}, {"t": "choice", "q": "Подія, з якої починається дія, — це…", "o": ["зав'язка", "кульмінація", "тема"], "a": 0, "e": "Зав'язка."}, {"t": "choice", "q": "Опис приміщення — це…", "o": ["портрет", "інтер'єр", "пейзаж"], "a": 1, "e": "Інтер'єр."}, {"t": "choice", "q": "Протиставлення пасербиці й ледачої дочки — це…", "o": ["антитеза", "метафора", "гіпербола"], "a": 0, "e": "Антитеза."}, {"t": "choice", "q": "«Лобо — володар Курумпо» — це…", "o": ["казка", "оповідання", "повість"], "a": 1, "e": "Одна історія, мало героїв."}, {"t": "choice", "q": "«Полліанна» — це…", "o": ["оповідання", "повість", "вірш"], "a": 1, "e": "Багато подій, тривалий час."}, {"t": "choice", "q": "«Аліса в Країні Див» — приклад…", "o": ["анімалістичної літератури", "фантастики / літературної казки", "народної казки"], "a": 1, "e": "Вигаданий світ, є автор."}, {"t": "choice", "q": "Тема твору — це…", "o": ["про що твір", "головна думка", "останній розділ"], "a": 0, "e": "Тема — про що."}, {"t": "input", "q": "Як називається завершальна подія твору, наслідок дій героїв?", "a": ["розв'язка", "розвязка"], "e": "Розв'язка."}, {"t": "choice", "q": "Хто заснував анімалістичну літературу?", "o": ["Кіплінг", "Сетон-Томпсон", "Янсон"], "a": 1, "e": "Сетон-Томпсон."}]}]};

//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/[^a-z0-9а-яіїєґ' \-]/gi,"").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
</body>
</html>
