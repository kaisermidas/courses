<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Математика · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>
// ============================================================

const COURSE = {"id": "matem5", "title": "Математика", "subtitle": "5 клас · 17 уроків за підручником Мерзляка", "lessons": [{"id": "m-naturalni", "sec": "Натуральні числа", "title": "Натуральні числа. Десятковий запис. Класи і розряди", "goal": "Ти знаєш, що таке натуральні числа, читаєш і записуєш багатоцифрові числа за класами й розрядами.", "learn": [{"h": "Натуральні числа", "p": ["<span class='term'>Натуральні числа</span> — числа для лічби предметів: 1, 2, 3, 4… Найменше — <b>1</b>, найбільшого немає. <b>0 — не натуральне</b>. Ряд натуральних чисел нескінченний; кожне наступне на 1 більше."]}, {"h": "Цифри й десятковий запис", "p": ["<b>Цифр</b> десять: 0, 1, 2, … 9. Число — запис із цифр. Одноцифрові, двоцифрові, трицифрові… <b>Позиційна система</b>: значення цифри залежить від місця (розряду): у числі 555 — 5 сотень, 5 десятків, 5 одиниць. <b>Розряди</b>: одиниці, десятки, сотні. <b>Класи</b> по три розряди: <b>одиниць</b> (1–999), <b>тисяч</b>, <b>мільйонів</b>, <b>мільярдів</b>."], "ex": ["12 345 678 → 12 мільйонів 345 тисяч 678: клас мільйонів — 12, тисяч — 345, одиниць — 678.", "1 000 = тисяча, 1 000 000 = мільйон (6 нулів), 1 000 000 000 = мільярд (9 нулів)."]}, {"h": "Порівняння", "p": ["Із двох натуральних чисел більше те, яке в ряду стоїть правіше. Більше цифр — більше число: 1000 > 999. При однаковій кількості цифр порівнюють зліва по розрядах: 5 <b>4</b>21 > 5 <b>3</b>99. Знаки: > (більше), < (менше), =. <b>Подвійна нерівність</b>: 3 < 5 < 8."]}, {"h": "Римські цифри", "p": ["I = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000. IV = 4, IX = 9, XIV = 14, XIX = 19, XL = 40, XC = 90, MMXXVI = 2026."]}], "remember": "Натуральні: 1, 2, 3… (0 — не натуральне, найменше — 1). 10 цифр. Розряди: одиниці, десятки, сотні; класи по три: одиниць, тисяч, мільйонів, мільярдів. Мільйон — 6 нулів, мільярд — 9. Більше цифр — більше число.", "cards": [{"f": "Натуральні числа", "b": "Числа для лічби: 1, 2, 3… Найменше — 1, найбільшого немає."}, {"f": "Чи є 0 натуральним числом?", "b": "Ні."}, {"f": "Скільки цифр у десятковій системі?", "b": "Десять: 0–9."}, {"f": "Розряди класу одиниць", "b": "Одиниці, десятки, сотні."}, {"f": "Класи чисел", "b": "Одиниць, тисяч, мільйонів, мільярдів — по три розряди."}, {"f": "Скільки нулів у мільйоні? у мільярді?", "b": "6 і 9."}, {"f": "Як порівняти багатоцифрові числа?", "b": "Більше цифр — більше число; при однаковій кількості — порівнюємо зліва по розрядах."}, {"f": "Римські: L, C, D, M", "b": "50, 100, 500, 1000."}], "quiz": [{"t": "choice", "q": "Яке число натуральне?", "o": ["0", "7", "−3"], "a": 1, "e": "7. Нуль і від'ємні — не натуральні."}, {"t": "choice", "q": "Найменше натуральне число —", "o": ["0", "1", "10"], "a": 1, "e": "1."}, {"t": "input", "q": "Скільки десятків у числі 5 348? (цифра в розряді десятків)", "a": ["4"], "e": "5 348: 8 одиниць, 4 десятки, 3 сотні, 5 тисяч."}, {"t": "input", "q": "Скільки нулів у мільйоні?", "a": ["6", "шість"], "e": "1 000 000."}, {"t": "choice", "q": "Число 3 040 507 читається…", "o": ["три мільйони сорок тисяч п'ятсот сім", "триста чотири тисячі п'ятсот сім", "тридцять мільйонів"], "a": 0, "e": "Класи: 3 | 040 | 507."}, {"t": "choice", "q": "Порівняй: 9 999 і 10 000.", "o": ["9 999 > 10 000", "9 999 < 10 000", "Рівні"], "a": 1, "e": "Більше цифр — більше."}, {"t": "choice", "q": "Порівняй: 5 421 і 5 399.", "o": ["5 421 > 5 399", "5 421 < 5 399"], "a": 0, "e": "Сотні: 4 > 3."}, {"t": "input", "q": "Запиши число: сім тисяч двадцять.", "a": ["7020", "7 020"], "e": "7 020."}, {"t": "input", "q": "Запиши цифрами XIV.", "a": ["14"], "e": "X + IV = 14."}, {"t": "input", "q": "Запиши римськими цифрами 19.", "a": ["xix", "хіх", "xіx"], "e": "XIX."}]}, {"id": "m-vidrizok-pryama", "sec": "Натуральні числа", "title": "Відрізок, пряма, промінь. Шкала. Координатний промінь", "goal": "Ти розрізняєш відрізок, пряму, промінь, вимірюєш довжину і працюєш із координатним променем.", "learn": [{"h": "Точка, відрізок, пряма, промінь", "p": ["<b>Точка</b> — позначають великою буквою: A, B. <span class='term'>Відрізок AB</span> — частина прямої між двома точками (<b>кінцями</b>); має <b>довжину</b>. <span class='term'>Пряма</span> — нескінченна в обидва боки, не має кінців; позначають двома точками (пряма AB) або малою буквою (пряма a). Через дві точки можна провести <b>лише одну</b> пряму. <span class='term'>Промінь</span> — частина прямої з одним початком, нескінченна в один бік: промінь OA (O — початок). <b>Площина</b> — нескінченна рівна поверхня."]}, {"h": "Довжина відрізка", "p": ["Вимірюють лінійкою. Одиниці: <b>мм, см, дм, м, км</b>. 1 см = 10 мм; 1 дм = 10 см; 1 м = 100 см = 10 дм; 1 км = 1000 м. <b>Рівні відрізки</b> мають рівні довжини. Якщо точка C лежить на відрізку AB, то <b>AC + CB = AB</b>. <b>Ламана</b> — кілька відрізків, з'єднаних кінцями; довжина ламаної — сума ланок."], "ex": ["AB = 7 см, AC = 3 см → CB = 7 − 3 = 4 см."]}, {"h": "Шкала і координатний промінь", "p": ["<span class='term'>Шкала</span> — ряд позначок із числами (лінійка, термометр, спідометр). <b>Ціна поділки</b> — різниця між сусідніми числами, поділена на кількість поділок між ними. <span class='term'>Координатний промінь</span> — промінь з початком O (число 0), <b>одиничним відрізком</b> і напрямом. Кожній точці відповідає число — <b>координата</b>: A(3). Правіше — більше число."]}], "remember": "Відрізок — має два кінці й довжину; пряма — без кінців; промінь — один початок. Через дві точки — одна пряма. 1 см = 10 мм, 1 м = 100 см, 1 км = 1000 м. AC + CB = AB. Координатний промінь: початок O(0), одиничний відрізок; A(3) — координата 3.", "cards": [{"f": "Відрізок", "b": "Частина прямої між двома точками (кінцями); має довжину."}, {"f": "Пряма", "b": "Нескінченна в обидва боки, не має кінців."}, {"f": "Промінь", "b": "Частина прямої з одним початком, нескінченна в один бік."}, {"f": "Скільки прямих можна провести через дві точки?", "b": "Лише одну."}, {"f": "1 см, 1 дм, 1 м, 1 км", "b": "10 мм; 10 см; 100 см; 1000 м."}, {"f": "Точка C на відрізку AB", "b": "AC + CB = AB."}, {"f": "Ціна поділки шкали", "b": "Різниця сусідніх чисел, поділена на кількість поділок між ними."}, {"f": "Координатний промінь", "b": "Промінь з початком O(0), одиничним відрізком; координата точки — її число."}], "quiz": [{"t": "choice", "q": "Що має два кінці?", "o": ["Пряма", "Промінь", "Відрізок"], "a": 2, "e": "Відрізок."}, {"t": "choice", "q": "Що має один початок і нескінченне в один бік?", "o": ["Відрізок", "Промінь", "Пряма"], "a": 1, "e": "Промінь."}, {"t": "choice", "q": "Скільки прямих можна провести через дві точки?", "o": ["Одну", "Дві", "Безліч"], "a": 0, "e": "Тільки одну."}, {"t": "input", "q": "Скільки см у 3 м? Напиши число.", "a": ["300"], "e": "1 м = 100 см."}, {"t": "input", "q": "Скільки мм у 7 см?", "a": ["70"], "e": "1 см = 10 мм."}, {"t": "input", "q": "AB = 12 см, точка C на AB, AC = 5 см. Знайди CB (см).", "a": ["7"], "e": "12 − 5 = 7."}, {"t": "choice", "q": "Скільки прямих можна провести через одну точку?", "o": ["Одну", "Дві", "Безліч"], "a": 2, "e": "Через одну точку — безліч."}, {"t": "input", "q": "На шкалі між числами 10 і 20 п'ять поділок. Ціна поділки?", "a": ["2"], "e": "(20 − 10) : 5 = 2."}, {"t": "choice", "q": "На координатному промені точка A(5) і B(8). Яка правіше?", "o": ["A", "B"], "a": 1, "e": "Більша координата — правіше."}, {"t": "input", "q": "Скільки м у 2 км 300 м?", "a": ["2300"], "e": "2000 + 300."}]}, {"id": "m-dodavannia-vidnimannia", "sec": "Натуральні числа", "title": "Додавання і віднімання. Властивості", "goal": "Ти знаєш назви компонентів, властивості додавання і зв'язок додавання з відніманням.", "learn": [{"h": "Додавання", "p": ["<b>a + b = c</b>: a, b — <b>доданки</b>, c — <b>сума</b>. <b>Переставна властивість</b>: a + b = b + a. <b>Сполучна</b>: (a + b) + c = a + (b + c) — доданки можна групувати зручно: 47 + 25 + 53 = (47 + 53) + 25 = 125. a + 0 = a."]}, {"h": "Віднімання", "p": ["<b>a − b = c</b>: a — <b>зменшуване</b>, b — <b>від'ємник</b>, c — <b>різниця</b>. Віднімання — дія, обернена до додавання: якщо a − b = c, то c + b = a (перевірка). a − 0 = a, a − a = 0. Віднімання числа від суми: (a + b) − c = (a − c) + b. Віднімання суми від числа: a − (b + c) = a − b − c."], "ex": ["Щоб знайти невідомий доданок, від суми відняти відомий: x + 15 = 40 → x = 40 − 15 = 25.", "Невідоме зменшуване = різниця + від'ємник: x − 8 = 12 → x = 20.", "Невідомий від'ємник = зменшуване − різниця: 30 − x = 18 → x = 12."]}, {"h": "Письмове додавання і віднімання", "p": ["Записуємо розряд під розрядом; додаємо/віднімаємо справа наліво; переносимо десяток / позичаємо десяток. Перевірка: віднімання — додаванням, додавання — відніманням."]}], "remember": "Доданок + доданок = сума; зменшуване − від'ємник = різниця. a + b = b + a; (a + b) + c = a + (b + c). Невідомий доданок = сума − відомий; зменшуване = різниця + від'ємник; від'ємник = зменшуване − різниця.", "cards": [{"f": "Компоненти додавання", "b": "Доданок + доданок = сума."}, {"f": "Компоненти віднімання", "b": "Зменшуване − від'ємник = різниця."}, {"f": "Переставна властивість додавання", "b": "a + b = b + a."}, {"f": "Сполучна властивість додавання", "b": "(a + b) + c = a + (b + c)."}, {"f": "Як знайти невідомий доданок?", "b": "Від суми відняти відомий доданок."}, {"f": "Як знайти невідоме зменшуване?", "b": "До різниці додати від'ємник."}, {"f": "Як знайти невідомий від'ємник?", "b": "Від зменшуваного відняти різницю."}, {"f": "Як перевірити віднімання?", "b": "Додаванням: різниця + від'ємник = зменшуване."}], "quiz": [{"t": "choice", "q": "У виразі 25 − 7 = 18 число 7 — це…", "o": ["зменшуване", "від'ємник", "різниця"], "a": 1, "e": "Те, що віднімаємо."}, {"t": "choice", "q": "У виразі 8 + 4 = 12 число 12 — це…", "o": ["доданок", "сума", "різниця"], "a": 1, "e": "Сума."}, {"t": "input", "q": "Обчисли зручно: 38 + 27 + 62.", "a": ["127"], "e": "(38 + 62) + 27 = 127."}, {"t": "input", "q": "Обчисли: 1 000 − 348.", "a": ["652"], "e": "652."}, {"t": "input", "q": "x + 27 = 60. Знайди x.", "a": ["33"], "e": "60 − 27 = 33."}, {"t": "input", "q": "x − 15 = 45. Знайди x.", "a": ["60"], "e": "45 + 15 = 60."}, {"t": "input", "q": "80 − x = 35. Знайди x.", "a": ["45"], "e": "80 − 35 = 45."}, {"t": "choice", "q": "(a + b) + c = a + (b + c) — це властивість…", "o": ["переставна", "сполучна", "розподільна"], "a": 1, "e": "Сполучна."}, {"t": "input", "q": "Обчисли: 4 507 + 2 895.", "a": ["7402"], "e": "7 402."}, {"t": "choice", "q": "Чому дорівнює a − a?", "o": ["a", "0", "1"], "a": 1, "e": "Нулю."}]}, {"id": "m-vyrazy-rivniannia", "sec": "Натуральні числа", "title": "Числові й буквені вирази. Формули. Рівняння", "goal": "Ти відрізняєш числовий вираз від буквеного, знаєш формули шляху й периметра, розв'язуєш рівняння.", "learn": [{"h": "Вирази", "p": ["<span class='term'>Числовий вираз</span> — числа зі знаками дій: 12 + 8 · 2. Його <b>значення</b> — результат: 28. <span class='term'>Буквений вираз</span> — містить букви: 3a + 5. Якщо a = 4, значення = 17. <b>Порядок дій</b>: спочатку в дужках, потім множення й ділення (зліва направо), потім додавання й віднімання."]}, {"h": "Формули", "p": ["<span class='term'>Формула</span> — рівність, що показує зв'язок величин. <b>Шлях</b>: s = v · t (шлях = швидкість × час); v = s : t; t = s : v. <b>Периметр</b> прямокутника: P = 2(a + b); квадрата: P = 4a. <b>Периметр трикутника</b>: P = a + b + c."], "ex": ["v = 60 км/год, t = 3 год → s = 180 км.", "Прямокутник 5 см і 3 см → P = 2(5 + 3) = 16 см."]}, {"h": "Рівняння", "p": ["<span class='term'>Рівняння</span> — рівність, що містить невідоме (букву): 2x + 3 = 11. <b>Корінь</b> — значення невідомого, при якому рівність правильна. <b>Розв'язати</b> — знайти всі корені або довести, що їх немає. Правила: невідомий доданок = сума − відомий; зменшуване = різниця + від'ємник; від'ємник = зменшуване − різниця; множник = добуток : інший множник; ділене = частка · дільник; дільник = ділене : частка."], "ex": ["2x + 3 = 11 → 2x = 11 − 3 = 8 → x = 8 : 2 = 4. Перевірка: 2·4 + 3 = 11 ✓.", "(x − 5) · 3 = 21 → x − 5 = 7 → x = 12."]}], "remember": "Числовий вираз — з чисел; буквений — з буквами. Порядок: дужки → · : → + −. s = v·t; P прямокутника = 2(a + b); P квадрата = 4a. Рівняння — рівність з невідомим; корінь — значення, що робить її правильною.", "cards": [{"f": "Числовий і буквений вираз", "b": "Числовий — лише числа й дії; буквений — містить букви."}, {"f": "Порядок дій", "b": "Дужки → множення й ділення → додавання й віднімання."}, {"f": "Формула шляху", "b": "s = v · t; v = s : t; t = s : v."}, {"f": "Периметр прямокутника / квадрата", "b": "P = 2(a + b) / P = 4a."}, {"f": "Рівняння", "b": "Рівність, що містить невідоме."}, {"f": "Корінь рівняння", "b": "Значення невідомого, при якому рівність правильна."}, {"f": "Невідомий множник / ділене / дільник", "b": "Добуток : множник / частка · дільник / ділене : частка."}], "quiz": [{"t": "input", "q": "Обчисли: 12 + 8 · 2.", "a": ["28"], "e": "Спочатку множення: 12 + 16."}, {"t": "input", "q": "Обчисли: (12 + 8) · 2.", "a": ["40"], "e": "Дужки спершу: 20 · 2."}, {"t": "input", "q": "Знайди значення виразу 3a + 5 при a = 4.", "a": ["17"], "e": "12 + 5."}, {"t": "input", "q": "Швидкість 70 км/год, час 4 год. Шлях? (км)", "a": ["280"], "e": "s = 70 · 4."}, {"t": "input", "q": "Периметр прямокутника зі сторонами 6 і 4 см?", "a": ["20"], "e": "2(6 + 4) = 20."}, {"t": "input", "q": "Периметр квадрата зі стороною 9 см?", "a": ["36"], "e": "4 · 9."}, {"t": "input", "q": "Розв'яжи: 2x + 3 = 11.", "a": ["4"], "e": "2x = 8, x = 4."}, {"t": "input", "q": "Розв'яжи: 5x = 45.", "a": ["9"], "e": "45 : 5."}, {"t": "input", "q": "Розв'яжи: x : 6 = 7.", "a": ["42"], "e": "7 · 6."}, {"t": "input", "q": "Розв'яжи: 3(x − 4) = 18.", "a": ["10"], "e": "x − 4 = 6, x = 10."}, {"t": "choice", "q": "Що таке корінь рівняння?", "o": ["Будь-яке число", "Число, що робить рівність правильною", "Ліва частина"], "a": 1, "e": "Корінь."}]}, {"id": "m-kuty", "sec": "Геометричні фігури", "title": "Кут. Види кутів. Вимірювання кутів", "goal": "Ти знаєш, що таке кут, його види, і вимірюєш кути транспортиром.", "learn": [{"h": "Кут", "p": ["<span class='term'>Кут</span> — фігура з двох променів (<b>сторін</b>) зі спільним початком (<b>вершиною</b>). Позначення: ∠AOB (вершина посередині), ∠O. <b>Бісектриса</b> — промінь із вершини, що ділить кут навпіл."]}, {"h": "Вимірювання", "p": ["Одиниця — <b>градус</b> (°). Прилад — <b>транспортир</b>: центр на вершину, нуль на одну сторону, читаємо число на другій. <b>Розгорнутий кут</b> — сторони на одній прямій, = <b>180°</b>. <b>Прямий кут</b> = <b>90°</b> (позначають квадратиком). Якщо промінь ділить кут на два, то градусна міра кута = сума мір частин."]}, {"h": "Види кутів", "p": ["<b>Гострий</b> — менше 90°. <b>Прямий</b> — 90°. <b>Тупий</b> — більше 90°, але менше 180°. <b>Розгорнутий</b> — 180°. Рівні кути мають рівні градусні міри."], "ex": ["∠AOB = 40° — гострий; 90° — прямий; 130° — тупий; 180° — розгорнутий.", "Бісектриса кута 80° утворює два кути по 40°."]}], "remember": "Кут — два промені зі спільною вершиною; ∠AOB. Градус, транспортир. Гострий < 90°, прямий = 90°, тупий 90°–180°, розгорнутий = 180°. Бісектриса ділить кут навпіл.", "cards": [{"f": "Кут", "b": "Фігура з двох променів (сторін) зі спільним початком (вершиною)."}, {"f": "Як позначають кут?", "b": "∠AOB — вершина посередині; або ∠O."}, {"f": "Бісектриса", "b": "Промінь із вершини, що ділить кут навпіл."}, {"f": "Прилад і одиниця вимірювання кутів", "b": "Транспортир; градус (°)."}, {"f": "Гострий / прямий / тупий / розгорнутий", "b": "< 90° / 90° / між 90° і 180° / 180°."}, {"f": "Скільки градусів у прямому куті?", "b": "90°."}, {"f": "Скільки градусів у розгорнутому куті?", "b": "180°."}], "quiz": [{"t": "choice", "q": "Кут 45° — це кут…", "o": ["гострий", "прямий", "тупий"], "a": 0, "e": "Менше 90°."}, {"t": "choice", "q": "Кут 120° — це кут…", "o": ["гострий", "тупий", "розгорнутий"], "a": 1, "e": "Між 90° і 180°."}, {"t": "input", "q": "Скільки градусів у прямому куті?", "a": ["90", "90°"], "e": "90°."}, {"t": "input", "q": "Скільки градусів у розгорнутому куті?", "a": ["180", "180°"], "e": "180°."}, {"t": "input", "q": "Бісектриса ділить кут 70° на два кути по … градусів.", "a": ["35", "35°"], "e": "70 : 2."}, {"t": "input", "q": "∠AOB = 50°, ∠BOC = 40°, промінь OB між OA і OC. ∠AOC = ?", "a": ["90", "90°"], "e": "50 + 40 = 90."}, {"t": "choice", "q": "У позначенні ∠MKN вершина —", "o": ["M", "K", "N"], "a": 1, "e": "Середня буква — вершина."}, {"t": "choice", "q": "Яким приладом вимірюють кути?", "o": ["Лінійкою", "Транспортиром", "Циркулем"], "a": 1, "e": "Транспортир."}, {"t": "input", "q": "Кут 180° поділили на два кути, один із них 110°. Другий?", "a": ["70", "70°"], "e": "180 − 110."}, {"t": "choice", "q": "Кут 90° називають…", "o": ["гострим", "прямим", "тупим"], "a": 1, "e": "Прямий."}]}, {"id": "m-mnohokutnyky", "sec": "Геометричні фігури", "title": "Многокутники. Трикутник і його види. Прямокутник і квадрат", "goal": "Ти знаєш види трикутників, властивості прямокутника і квадрата, обчислюєш периметр.", "learn": [{"h": "Многокутник", "p": ["<span class='term'>Многокутник</span> — замкнена ламана без самоперетинів разом з частиною площини. Елементи: <b>вершини</b>, <b>сторони</b>, <b>кути</b>. Трикутник — 3 сторони, чотирикутник — 4, п'ятикутник — 5. <b>Периметр</b> — сума довжин сторін. <b>Рівні фігури</b> — збігаються при накладанні."]}, {"h": "Трикутник", "p": ["За <b>сторонами</b>: <b>різносторонній</b> (усі різні), <b>рівнобедрений</b> (дві сторони рівні — <b>бічні</b>, третя — <b>основа</b>), <b>рівносторонній</b> (усі три рівні). За <b>кутами</b>: <b>гострокутний</b>, <b>прямокутний</b> (один кут 90°), <b>тупокутний</b> (один тупий). Сума кутів трикутника — <b>180°</b>. Периметр P = a + b + c; рівностороннього P = 3a."]}, {"h": "Прямокутник і квадрат", "p": ["<span class='term'>Прямокутник</span> — чотирикутник, у якого всі кути прямі. Протилежні сторони рівні: a — довжина, b — ширина. P = 2(a + b). <span class='term'>Квадрат</span> — прямокутник з усіма рівними сторонами; P = 4a. <b>Діагональ</b> — відрізок між протилежними вершинами; діагоналі прямокутника рівні."], "ex": ["Рівнобедрений трикутник з основою 6 і бічною 5 → P = 6 + 5 + 5 = 16.", "Прямокутник з P = 30 і a = 10 → a + b = 15, b = 5."]}], "remember": "Многокутник: вершини, сторони, кути; периметр — сума сторін. Трикутники за сторонами: різносторонній, рівнобедрений, рівносторонній; за кутами: гострокутний, прямокутний, тупокутний; сума кутів 180°. Прямокутник — усі кути прямі, P = 2(a + b); квадрат — усі сторони рівні, P = 4a.", "cards": [{"f": "Периметр многокутника", "b": "Сума довжин усіх сторін."}, {"f": "Види трикутників за сторонами", "b": "Різносторонній, рівнобедрений, рівносторонній."}, {"f": "Види трикутників за кутами", "b": "Гострокутний, прямокутний, тупокутний."}, {"f": "Рівнобедрений трикутник", "b": "Дві сторони рівні (бічні), третя — основа."}, {"f": "Сума кутів трикутника", "b": "180°."}, {"f": "Прямокутник", "b": "Чотирикутник з усіма прямими кутами; протилежні сторони рівні."}, {"f": "Квадрат", "b": "Прямокутник з рівними сторонами."}, {"f": "Діагональ", "b": "Відрізок, що сполучає протилежні вершини."}], "quiz": [{"t": "choice", "q": "Трикутник зі сторонами 5, 5, 8 —", "o": ["різносторонній", "рівнобедрений", "рівносторонній"], "a": 1, "e": "Дві рівні сторони."}, {"t": "choice", "q": "Трикутник із кутами 30°, 60°, 90° —", "o": ["гострокутний", "прямокутний", "тупокутний"], "a": 1, "e": "Є кут 90°."}, {"t": "input", "q": "Два кути трикутника 50° і 60°. Третій?", "a": ["70", "70°"], "e": "180 − 110."}, {"t": "input", "q": "Периметр трикутника зі сторонами 4, 6, 7 см?", "a": ["17"], "e": "4 + 6 + 7."}, {"t": "input", "q": "Периметр рівностороннього трикутника зі стороною 8 см?", "a": ["24"], "e": "3 · 8."}, {"t": "input", "q": "Периметр прямокутника 12 см × 7 см?", "a": ["38"], "e": "2(12 + 7)."}, {"t": "input", "q": "Периметр квадрата 40 см. Сторона?", "a": ["10"], "e": "40 : 4."}, {"t": "input", "q": "Периметр прямокутника 30 см, довжина 10 см. Ширина?", "a": ["5"], "e": "30 : 2 = 15; 15 − 10 = 5."}, {"t": "choice", "q": "Скільки вершин у п'ятикутника?", "o": ["4", "5", "6"], "a": 1, "e": "П'ять."}, {"t": "tf", "q": "Кожен квадрат є прямокутником.", "a": true, "e": "Так, з рівними сторонами."}]}, {"id": "m-mnozhennia", "sec": "Множення і ділення", "title": "Множення. Властивості множення", "goal": "Ти знаєш компоненти множення, переставну, сполучну й розподільну властивості.", "learn": [{"h": "Множення", "p": ["<b>a · b = c</b>: a, b — <b>множники</b>, c — <b>добуток</b>. Множення — додавання однакових доданків: 4 · 3 = 4 + 4 + 4. a · 1 = a; a · 0 = 0."]}, {"h": "Властивості", "p": ["<b>Переставна</b>: a · b = b · a. <b>Сполучна</b>: (a · b) · c = a · (b · c) — зручно: 25 · 7 · 4 = (25 · 4) · 7 = 700. <b>Розподільна</b> відносно додавання: <b>a · (b + c) = ab + ac</b>; відносно віднімання: a · (b − c) = ab − ac. Обернена дія — <b>винесення спільного множника за дужки</b>: 7x + 3x = 10x; 15 · 8 + 15 · 2 = 15 · 10 = 150."], "ex": ["Зручні пари: 2 · 5 = 10, 4 · 25 = 100, 8 · 125 = 1000.", "Розподільна: 12 · 105 = 12 · 100 + 12 · 5 = 1260."]}, {"h": "Множення на 10, 100, 1000 та письмове", "p": ["Дописуємо стільки нулів: 34 · 100 = 3400. Письмове множення — стовпчиком, розряд під розрядом, добутки на кожну цифру зсуваємо вліво. Числа з нулями в кінці: 240 · 30 = 24 · 3 · 100 = 7200."]}], "remember": "Множник · множник = добуток. a·b = b·a; (a·b)·c = a·(b·c); a(b + c) = ab + ac. Спільний множник виносимо за дужки: 7x + 3x = 10x. 4·25 = 100, 8·125 = 1000. Множення на 10, 100 — дописуємо нулі.", "cards": [{"f": "Компоненти множення", "b": "Множник · множник = добуток."}, {"f": "Переставна властивість множення", "b": "a · b = b · a."}, {"f": "Сполучна властивість множення", "b": "(a · b) · c = a · (b · c)."}, {"f": "Розподільна властивість", "b": "a · (b + c) = a·b + a·c."}, {"f": "Винесення спільного множника", "b": "ab + ac = a(b + c): 7x + 3x = 10x."}, {"f": "a · 0 і a · 1", "b": "a · 0 = 0; a · 1 = a."}, {"f": "Зручні пари множників", "b": "2·5 = 10, 4·25 = 100, 8·125 = 1000."}], "quiz": [{"t": "choice", "q": "У виразі 6 · 7 = 42 число 42 —", "o": ["множник", "добуток", "частка"], "a": 1, "e": "Добуток."}, {"t": "input", "q": "Обчисли зручно: 25 · 13 · 4.", "a": ["1300"], "e": "(25 · 4) · 13 = 1300."}, {"t": "input", "q": "Обчисли: 8 · 125 · 9.", "a": ["9000"], "e": "1000 · 9."}, {"t": "input", "q": "Обчисли за розподільною властивістю: 15 · 12 + 15 · 8.", "a": ["300"], "e": "15 · (12 + 8) = 15 · 20."}, {"t": "input", "q": "Спрости: 9x + 4x.", "a": ["13x", "13х"], "e": "(9 + 4)x."}, {"t": "input", "q": "Обчисли: 47 · 100.", "a": ["4700"], "e": "Два нулі."}, {"t": "input", "q": "Обчисли: 240 · 30.", "a": ["7200"], "e": "24 · 3 = 72, два нулі."}, {"t": "input", "q": "Обчисли: 306 · 7.", "a": ["2142"], "e": "2142."}, {"t": "choice", "q": "a · (b + c) = ab + ac — це властивість…", "o": ["переставна", "сполучна", "розподільна"], "a": 2, "e": "Розподільна."}, {"t": "input", "q": "Обчисли: 12 · 105.", "a": ["1260"], "e": "1200 + 60."}]}, {"id": "m-dilennia", "sec": "Множення і ділення", "title": "Ділення. Ділення з остачею. Степінь числа", "goal": "Ти знаєш компоненти ділення, ділиш з остачею і розумієш степінь числа.", "learn": [{"h": "Ділення", "p": ["<b>a : b = c</b>: a — <b>ділене</b>, b — <b>дільник</b>, c — <b>частка</b>. Обернена до множення: c · b = a (перевірка). <b>На нуль ділити не можна!</b> 0 : a = 0; a : 1 = a; a : a = 1. Невідоме ділене = частка · дільник; невідомий дільник = ділене : частка."]}, {"h": "Ділення з остачею", "p": ["<b>a = b · q + r</b>, де q — <b>неповна частка</b>, r — <b>остача</b>; остача завжди <b>менша за дільник</b>: 0 ≤ r < b. 17 : 5 = 3 (ост. 2), бо 17 = 5·3 + 2. Якщо r = 0 — ділиться націло."], "ex": ["23 : 4 = 5 (ост. 3): 4·5 + 3 = 23.", "Остача при діленні на 5 може бути 0, 1, 2, 3 або 4."]}, {"h": "Степінь числа", "p": ["<span class='term'>Степінь</span> aⁿ — добуток n однакових множників a: <b>a</b> — основа, <b>n</b> — показник. 2³ = 2·2·2 = 8; 5² = 25; 10⁴ = 10 000. a² — <b>квадрат</b> числа, a³ — <b>куб</b>. a¹ = a. Порядок дій: спочатку <b>степінь</b>, потім множення/ділення, потім додавання/віднімання."], "ex": ["Квадрати: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144. Куби: 1, 8, 27, 64, 125, 1000.", "3 + 2² · 5 = 3 + 4 · 5 = 23."]}], "remember": "Ділене : дільник = частка. На нуль не ділять. a = b·q + r, остача менша за дільник. aⁿ: основа a, показник n; a² — квадрат, a³ — куб; 2³ = 8, 5² = 25, 10⁴ = 10 000. Порядок: степінь → · : → + −.", "cards": [{"f": "Компоненти ділення", "b": "Ділене : дільник = частка."}, {"f": "Чи можна ділити на нуль?", "b": "Ні, ніколи."}, {"f": "Формула ділення з остачею", "b": "a = b · q + r, де r < b."}, {"f": "Яка може бути остача при діленні на 7?", "b": "0, 1, 2, 3, 4, 5 або 6."}, {"f": "Степінь aⁿ", "b": "Добуток n множників a; a — основа, n — показник."}, {"f": "Квадрат і куб числа", "b": "a² = a·a; a³ = a·a·a."}, {"f": "2³, 5², 10⁴", "b": "8, 25, 10 000."}, {"f": "Порядок дій зі степенем", "b": "Степінь → множення й ділення → додавання й віднімання."}], "quiz": [{"t": "choice", "q": "У виразі 56 : 8 = 7 число 56 —", "o": ["ділене", "дільник", "частка"], "a": 0, "e": "Ділене."}, {"t": "input", "q": "x : 9 = 8. Знайди x.", "a": ["72"], "e": "8 · 9."}, {"t": "input", "q": "72 : x = 6. Знайди x.", "a": ["12"], "e": "72 : 6."}, {"t": "input", "q": "Остача при діленні 29 на 6?", "a": ["5"], "e": "6·4 + 5 = 29."}, {"t": "input", "q": "Неповна частка при діленні 50 на 7?", "a": ["7"], "e": "7·7 = 49, ост. 1."}, {"t": "choice", "q": "Яка остача НЕ може бути при діленні на 4?", "o": ["0", "3", "4"], "a": 2, "e": "Остача менша за дільник."}, {"t": "input", "q": "Обчисли 2³.", "a": ["8"], "e": "2·2·2."}, {"t": "input", "q": "Обчисли 7².", "a": ["49"], "e": "7·7."}, {"t": "input", "q": "Обчисли 10⁵.", "a": ["100000", "100 000"], "e": "П'ять нулів."}, {"t": "input", "q": "Обчисли: 3 + 2² · 5.", "a": ["23"], "e": "3 + 4·5."}, {"t": "choice", "q": "У степені 6⁴ число 4 —", "o": ["основа", "показник", "добуток"], "a": 1, "e": "Показник."}, {"t": "input", "q": "Обчисли: 1 428 : 7.", "a": ["204"], "e": "204."}]}, {"id": "m-ploshcha", "sec": "Множення і ділення", "title": "Площа. Площа прямокутника і квадрата", "goal": "Ти обчислюєш площу прямокутника і квадрата та переводиш одиниці площі.", "learn": [{"h": "Площа", "p": ["<span class='term'>Площа</span> — величина частини площини, яку займає фігура. Одиниці: <b>мм², см², дм², м², км²</b>, <b>ар</b> (сотка, 100 м²), <b>гектар</b> (га, 10 000 м²). Рівні фігури мають рівні площі; площа фігури = сума площ її частин."]}, {"h": "Формули", "p": ["<b>Площа прямокутника</b>: S = a · b (довжина × ширина). <b>Площа квадрата</b>: S = a² (a · a). Звідси: a = S : b."], "ex": ["Прямокутник 8 см × 5 см → S = 40 см², P = 26 см.", "Квадрат зі стороною 7 см → S = 49 см².", "S = 48 см², a = 6 см → b = 8 см."]}, {"h": "Одиниці площі", "p": ["1 см² = 100 мм²; 1 дм² = 100 см²; <b>1 м² = 100 дм² = 10 000 см²</b>; 1 км² = 1 000 000 м²; 1 а = 100 м²; <b>1 га = 100 а = 10 000 м²</b>; 1 км² = 100 га. Переходимо між сусідніми одиницями довжини ×10, а площі — <b>×100</b>."]}], "remember": "S прямокутника = a·b; S квадрата = a². 1 см² = 100 мм², 1 м² = 10 000 см², 1 а = 100 м², 1 га = 10 000 м², 1 км² = 100 га. Сусідні одиниці площі — ×100.", "cards": [{"f": "Площа прямокутника", "b": "S = a · b."}, {"f": "Площа квадрата", "b": "S = a²."}, {"f": "1 м² у см²", "b": "10 000 см²."}, {"f": "1 см² у мм²", "b": "100 мм²."}, {"f": "Ар і гектар", "b": "1 а = 100 м²; 1 га = 100 а = 10 000 м²."}, {"f": "1 км² у га", "b": "100 га."}, {"f": "Як знайти сторону, знаючи площу й іншу сторону?", "b": "a = S : b."}], "quiz": [{"t": "input", "q": "Площа прямокутника 9 см × 6 см? (см²)", "a": ["54"], "e": "9 · 6."}, {"t": "input", "q": "Площа квадрата зі стороною 11 см?", "a": ["121"], "e": "11²."}, {"t": "input", "q": "Площа 56 см², довжина 8 см. Ширина?", "a": ["7"], "e": "56 : 8."}, {"t": "input", "q": "Скільки см² в 1 м²?", "a": ["10000", "10 000"], "e": "100 · 100."}, {"t": "input", "q": "Скільки м² в 1 га?", "a": ["10000", "10 000"], "e": "Гектар — 10 000 м²."}, {"t": "input", "q": "Скільки м² в 3 арах?", "a": ["300"], "e": "1 а = 100 м²."}, {"t": "input", "q": "Скільки га в 1 км²?", "a": ["100"], "e": "100 га."}, {"t": "input", "q": "Квадрат має площу 64 см². Периметр?", "a": ["32"], "e": "a = 8, P = 32."}, {"t": "choice", "q": "Одиниця площі —", "o": ["см", "см²", "см³"], "a": 1, "e": "Квадратні одиниці."}, {"t": "input", "q": "Прямокутник 5 см × 4 см поділили навпіл. Площа половини?", "a": ["10"], "e": "20 : 2."}]}, {"id": "m-paralelepiped-obiem", "sec": "Множення і ділення", "title": "Прямокутний паралелепіпед. Піраміда. Об'єм", "goal": "Ти знаєш елементи паралелепіпеда й піраміди, обчислюєш об'єм і переводиш одиниці об'єму.", "learn": [{"h": "Прямокутний паралелепіпед", "p": ["Просторова фігура (коробка): <b>6 граней</b> (прямокутники), <b>12 ребер</b>, <b>8 вершин</b>. Протилежні грані рівні. Три виміри: <b>довжина a, ширина b, висота c</b>. <b>Куб</b> — паралелепіпед з рівними ребрами; грані — квадрати. Площа поверхні паралелепіпеда: S = 2(ab + bc + ac); куба — 6a²."]}, {"h": "Піраміда", "p": ["<b>Піраміда</b>: основа — многокутник, бічні грані — трикутники зі спільною <b>вершиною</b>. Трикутна піраміда (тетраедр) — 4 грані, 6 ребер, 4 вершини; чотирикутна — основа чотирикутник, 5 граней, 8 ребер, 5 вершин."]}, {"h": "Об'єм", "p": ["<span class='term'>Об'єм</span> — величина простору, який займає тіло. Одиниці: <b>мм³, см³, дм³, м³</b>, <b>літр</b> = 1 дм³, <b>мл</b> = 1 см³. <b>V паралелепіпеда = a · b · c</b>; <b>V куба = a³</b>. 1 дм³ = 1000 см³; <b>1 м³ = 1000 дм³ = 1 000 000 см³</b>; сусідні одиниці об'єму — <b>×1000</b>."], "ex": ["Коробка 5 × 4 × 3 см → V = 60 см³.", "Куб з ребром 4 см → V = 64 см³, S поверхні = 96 см².", "Акваріум 50 × 30 × 40 см = 60 000 см³ = 60 дм³ = 60 л."]}], "remember": "Паралелепіпед: 6 граней, 12 ребер, 8 вершин; V = a·b·c; S = 2(ab + bc + ac). Куб: V = a³, S = 6a². Піраміда: основа + трикутні грані з вершиною. 1 л = 1 дм³ = 1000 см³; 1 м³ = 1000 дм³. Об'єм — ×1000.", "cards": [{"f": "Скільки граней, ребер, вершин у паралелепіпеда?", "b": "6 граней, 12 ребер, 8 вершин."}, {"f": "Три виміри паралелепіпеда", "b": "Довжина, ширина, висота."}, {"f": "Об'єм паралелепіпеда / куба", "b": "V = a·b·c / V = a³."}, {"f": "Площа поверхні куба", "b": "S = 6a²."}, {"f": "1 літр", "b": "1 дм³ = 1000 см³ (1 мл = 1 см³)."}, {"f": "1 м³ у дм³", "b": "1000 дм³."}, {"f": "Піраміда", "b": "Основа — многокутник, бічні грані — трикутники зі спільною вершиною."}, {"f": "Трикутна піраміда: грані, ребра, вершини", "b": "4, 6, 4."}], "quiz": [{"t": "input", "q": "Скільки ребер у прямокутного паралелепіпеда?", "a": ["12"], "e": "12."}, {"t": "input", "q": "Скільки вершин у куба?", "a": ["8"], "e": "8."}, {"t": "input", "q": "Об'єм паралелепіпеда 5 × 4 × 3 см? (см³)", "a": ["60"], "e": "5·4·3."}, {"t": "input", "q": "Об'єм куба з ребром 5 см?", "a": ["125"], "e": "5³."}, {"t": "input", "q": "Скільки см³ в 1 літрі?", "a": ["1000"], "e": "1 л = 1 дм³ = 1000 см³."}, {"t": "input", "q": "Скільки дм³ в 1 м³?", "a": ["1000"], "e": "10·10·10."}, {"t": "input", "q": "Площа поверхні куба з ребром 3 см? (см²)", "a": ["54"], "e": "6 · 9."}, {"t": "input", "q": "Акваріум 40 × 25 × 30 см. Скільки літрів води вміщує?", "a": ["30"], "e": "30 000 см³ = 30 дм³ = 30 л."}, {"t": "choice", "q": "Бічні грані піраміди —", "o": ["прямокутники", "трикутники", "квадрати"], "a": 1, "e": "Трикутники."}, {"t": "input", "q": "Скільки граней у чотирикутної піраміди?", "a": ["5"], "e": "Основа + 4 бічні."}, {"t": "input", "q": "Об'єм 120 см³, довжина 6, ширина 5. Висота?", "a": ["4"], "e": "120 : 30."}]}, {"id": "m-kombinatoryka", "sec": "Множення і ділення", "title": "Комбінаторні задачі", "goal": "Ти розв'язуєш прості задачі на перебір варіантів: дерево варіантів і правило множення.", "learn": [{"h": "Комбінаторика", "p": ["<span class='term'>Комбінаторні задачі</span> — «скількома способами можна…». Способи розв'язання: <b>перебір</b> усіх варіантів, <b>дерево варіантів</b>, <b>правило множення</b>: якщо перший вибір можна зробити m способами, а другий — n, то разом m · n способів."], "ex": ["3 сорочки і 2 штанів → 3 · 2 = 6 костюмів.", "Скільки двоцифрових чисел можна скласти з цифр 1, 2, 3 (цифри не повторюються)? Перша цифра — 3 способи, друга — 2 → 6 чисел: 12, 13, 21, 23, 31, 32.", "Якщо цифри можуть повторюватись: 3 · 3 = 9."]}, {"h": "Перестановки", "p": ["Скількома способами можна розставити n предметів у ряд: n · (n−1) · … · 1. Трьох дітей у ряд: 3 · 2 · 1 = 6 способів. Чотирьох: 24."]}, {"h": "Поради", "p": ["Записуй варіанти впорядковано (за зростанням), щоб не пропустити й не повторити. Перевіряй умову: чи можуть елементи повторюватись; чи число може починатись з нуля (не може!)."]}], "remember": "Правило множення: m способів × n способів = m·n. Дерево варіантів. Перестановки n предметів: n·(n−1)·…·1; 3 предмети — 6 способів, 4 — 24. Число не починається з нуля.", "cards": [{"f": "Правило множення в комбінаториці", "b": "Якщо перший вибір — m способів, другий — n, то разом m · n."}, {"f": "3 сорочки і 2 штанів — скільки костюмів?", "b": "3 · 2 = 6."}, {"f": "Скількома способами розставити 3 предмети в ряд?", "b": "3 · 2 · 1 = 6."}, {"f": "Скількома способами розставити 4 предмети в ряд?", "b": "4 · 3 · 2 · 1 = 24."}, {"f": "Дерево варіантів", "b": "Схема, де від кожного вибору розходяться гілки наступних виборів."}, {"f": "Чи може число починатись з 0?", "b": "Ні — це треба враховувати при переборі."}], "quiz": [{"t": "input", "q": "4 види морозива і 3 сиропи. Скільки варіантів десерту?", "a": ["12"], "e": "4 · 3."}, {"t": "input", "q": "Скільки двоцифрових чисел можна скласти з цифр 5, 7, 9 без повторення?", "a": ["6"], "e": "3 · 2 = 6."}, {"t": "input", "q": "Скільки двоцифрових чисел з цифр 5, 7, 9, якщо цифри можуть повторюватись?", "a": ["9"], "e": "3 · 3."}, {"t": "input", "q": "Скількома способами можна розсадити 3 друзів на лавці?", "a": ["6"], "e": "3·2·1."}, {"t": "input", "q": "Скількома способами розставити 4 книжки на полиці?", "a": ["24"], "e": "4·3·2·1."}, {"t": "input", "q": "Скільки двоцифрових чисел можна скласти з цифр 0, 1, 2 без повторення?", "a": ["4"], "e": "Перша цифра не 0: 2 варіанти · 2 = 4 (10, 12, 20, 21)."}, {"t": "input", "q": "Від дому до школи 3 дороги, від школи до парку 2. Скільки маршрутів дім → школа → парк?", "a": ["6"], "e": "3 · 2."}, {"t": "choice", "q": "Як не пропустити варіант при переборі?", "o": ["Записувати впорядковано", "Записувати випадково", "Не записувати"], "a": 0, "e": "За зростанням."}]}, {"id": "m-zvychaini-droby", "sec": "Дробові числа", "title": "Звичайні дроби. Правильні й неправильні. Порівняння", "goal": "Ти розумієш, що таке дріб, чисельник і знаменник, порівнюєш дроби з однаковими знаменниками.", "learn": [{"h": "Звичайний дріб", "p": ["<span class='term'>Дріб</span> a/b показує, що ціле поділили на b рівних частин і взяли a таких частин. <b>a — чисельник</b> (скільки взяли), <b>b — знаменник</b> (на скільки поділили). 3/4 — три чверті. Риска дробу — ділення: 3/4 = 3 : 4."]}, {"h": "Правильні й неправильні", "p": ["<b>Правильний</b> дріб — чисельник менший за знаменник: 2/5, 7/9 (менший за 1). <b>Неправильний</b> — чисельник більший або дорівнює знаменнику: 7/4, 5/5 (більший або дорівнює 1). a/a = 1; a/1 = a."]}, {"h": "Порівняння", "p": ["З однаковими знаменниками більший той, у якого <b>чисельник більший</b>: 5/7 > 3/7. З однаковими чисельниками більший той, у якого <b>знаменник менший</b>: 3/4 > 3/8 (частини більші). Будь-який правильний дріб менший за будь-який неправильний. На координатному промені більший дріб — правіше."]}, {"h": "Дріб від числа і число за дробом", "p": ["<b>Знайти дріб від числа</b>: число : знаменник · чисельник. 3/4 від 20 = 20 : 4 · 3 = 15. <b>Знайти число за його дробом</b>: значення : чисельник · знаменник. Якщо 2/5 числа = 10, то число = 10 : 2 · 5 = 25."]}], "remember": "a/b: a — чисельник, b — знаменник. Правильний — чисельник < знаменника (< 1); неправильний — ≥. Однакові знаменники — більший чисельник більший; однакові чисельники — менший знаменник більший. Дріб від числа: : знаменник · чисельник. Число за дробом: : чисельник · знаменник.", "cards": [{"f": "Чисельник і знаменник", "b": "Чисельник (зверху) — скільки частин узяли; знаменник (знизу) — на скільки поділили."}, {"f": "Правильний дріб", "b": "Чисельник менший за знаменник; менший за 1: 2/5."}, {"f": "Неправильний дріб", "b": "Чисельник ≥ знаменника; ≥ 1: 7/4, 5/5."}, {"f": "Порівняння з однаковими знаменниками", "b": "Більший той, у кого більший чисельник: 5/7 > 3/7."}, {"f": "Порівняння з однаковими чисельниками", "b": "Більший той, у кого менший знаменник: 3/4 > 3/8."}, {"f": "Як знайти 3/4 від 20?", "b": "20 : 4 · 3 = 15."}, {"f": "2/5 числа = 10. Число?", "b": "10 : 2 · 5 = 25."}, {"f": "Чому дорівнює a/a?", "b": "1."}], "quiz": [{"t": "choice", "q": "У дробі 5/8 число 8 —", "o": ["чисельник", "знаменник"], "a": 1, "e": "Знизу — знаменник."}, {"t": "choice", "q": "Який дріб правильний?", "o": ["7/5", "4/9", "6/6"], "a": 1, "e": "4 < 9."}, {"t": "choice", "q": "Який дріб неправильний?", "o": ["3/8", "9/9", "1/2"], "a": 1, "e": "9/9 = 1 — неправильний."}, {"t": "choice", "q": "Порівняй: 4/9 і 7/9.", "o": ["4/9 > 7/9", "4/9 < 7/9"], "a": 1, "e": "Однакові знаменники — більший чисельник."}, {"t": "choice", "q": "Порівняй: 2/3 і 2/7.", "o": ["2/3 > 2/7", "2/3 < 2/7"], "a": 0, "e": "Третини більші за сьомі."}, {"t": "input", "q": "Знайди 3/5 від 40.", "a": ["24"], "e": "40 : 5 · 3."}, {"t": "input", "q": "Знайди 2/7 від 21.", "a": ["6"], "e": "21 : 7 · 2."}, {"t": "input", "q": "3/4 числа дорівнюють 18. Знайди число.", "a": ["24"], "e": "18 : 3 · 4."}, {"t": "input", "q": "Скільком чвертям дорівнює 1 ціла? (чисельник дробу /4)", "a": ["4"], "e": "4/4 = 1."}, {"t": "input", "q": "Торт розрізали на 8 частин, з'їли 3. Яка частина залишилась? (дріб)", "a": ["5/8"], "e": "8 − 3 = 5 частин з 8."}, {"t": "choice", "q": "Правильний дріб завжди…", "o": ["більший за 1", "менший за 1", "дорівнює 1"], "a": 1, "e": "Частина цілого."}]}, {"id": "m-droby-dii-mishani", "sec": "Дробові числа", "title": "Додавання й віднімання дробів з однаковими знаменниками. Мішані числа", "goal": "Ти додаєш і віднімаєш дроби з однаковими знаменниками, переводиш неправильний дріб у мішане число й навпаки.", "learn": [{"h": "Додавання і віднімання", "p": ["Знаменник той самий, дії з чисельниками: <b>a/c + b/c = (a+b)/c</b>; <b>a/c − b/c = (a−b)/c</b>. 3/8 + 2/8 = 5/8; 7/9 − 4/9 = 3/9. 1 − 3/5 = 5/5 − 3/5 = 2/5."]}, {"h": "Дроби і ділення", "p": ["a : b = a/b: 7 : 4 = 7/4. Натуральне число можна записати дробом з будь-яким знаменником: 3 = 3/1 = 6/2 = 12/4."]}, {"h": "Мішані числа", "p": ["<span class='term'>Мішане число</span> — ціла частина + дробова: 2 3/4 (дві цілі три чверті). <b>Неправильний дріб → мішане</b>: поділити чисельник на знаменник з остачею: 11/4 → 11 : 4 = 2 (ост. 3) → <b>2 3/4</b>. <b>Мішане → неправильний</b>: ціла · знаменник + чисельник, знаменник той самий: 2 3/4 → (2·4 + 3)/4 = <b>11/4</b>."]}, {"h": "Дії з мішаними числами", "p": ["Цілі з цілими, дробові з дробовими: 2 1/5 + 3 2/5 = 5 3/5. Якщо дробова частина стала неправильною — виділяємо цілу: 1 4/5 + 2 3/5 = 3 7/5 = 4 2/5. Віднімання з позичанням: 5 1/4 − 2 3/4 = 4 5/4 − 2 3/4 = 2 2/4."]}], "remember": "Однакові знаменники: додаємо/віднімаємо чисельники, знаменник той самий. a : b = a/b. Неправильний → мішане: ділимо з остачею (11/4 = 2 3/4). Мішане → неправильний: ціла·знаменник + чисельник (2 3/4 = 11/4). Цілі з цілими, дроби з дробами.", "cards": [{"f": "a/c + b/c", "b": "(a + b)/c — знаменник не змінюється."}, {"f": "3/8 + 2/8", "b": "5/8."}, {"f": "1 − 3/5", "b": "5/5 − 3/5 = 2/5."}, {"f": "7 : 4 у вигляді дробу", "b": "7/4."}, {"f": "Мішане число", "b": "Ціла частина + правильний дріб: 2 3/4."}, {"f": "11/4 → мішане число", "b": "11 : 4 = 2 (ост. 3) → 2 3/4."}, {"f": "2 3/4 → неправильний дріб", "b": "(2·4 + 3)/4 = 11/4."}, {"f": "2 1/5 + 3 2/5", "b": "5 3/5."}], "quiz": [{"t": "input", "q": "Обчисли: 3/7 + 2/7. (запиши дріб)", "a": ["5/7"], "e": "Чисельники додаємо."}, {"t": "input", "q": "Обчисли: 8/9 − 5/9.", "a": ["3/9", "1/3"], "e": "3/9."}, {"t": "input", "q": "Обчисли: 1 − 2/5.", "a": ["3/5"], "e": "5/5 − 2/5."}, {"t": "input", "q": "Запиши 9 : 4 дробом.", "a": ["9/4"], "e": "9/4."}, {"t": "input", "q": "Перетвори 11/4 на мішане число (формат: 2 3/4).", "a": ["2 3/4"], "e": "11 : 4 = 2 ост. 3."}, {"t": "input", "q": "Перетвори 3 2/5 на неправильний дріб.", "a": ["17/5"], "e": "3·5 + 2 = 17."}, {"t": "input", "q": "Обчисли: 2 1/7 + 4 3/7.", "a": ["6 4/7"], "e": "Цілі: 6, дроби: 4/7."}, {"t": "input", "q": "Обчисли: 5 3/8 − 2 1/8.", "a": ["3 2/8", "3 1/4"], "e": "3 2/8."}, {"t": "input", "q": "Скільки цілих у дробі 17/5?", "a": ["3"], "e": "17 : 5 = 3 ост. 2."}, {"t": "input", "q": "Обчисли: 1 4/5 + 2 3/5. (виділи цілу)", "a": ["4 2/5"], "e": "3 7/5 = 4 2/5."}]}, {"id": "m-desiatkovi", "sec": "Дробові числа", "title": "Десяткові дроби. Порівняння. Округлення", "goal": "Ти читаєш і записуєш десяткові дроби, порівнюєш їх і округлюєш.", "learn": [{"h": "Десятковий дріб", "p": ["<span class='term'>Десятковий дріб</span> — дріб зі знаменником 10, 100, 1000…, записаний через кому: 3/10 = 0,3; 25/100 = 0,25; 2 7/100 = 2,07. Ліворуч від коми — <b>ціла частина</b>, праворуч — <b>дробова</b>: розряди <b>десяті, соті, тисячні</b>. 4,375 — чотири цілих триста сімдесят п'ять тисячних. Скільки нулів у знаменнику — стільки цифр після коми."]}, {"h": "Порівняння", "p": ["Нулі в кінці дробової частини можна дописувати або відкидати: 0,5 = 0,50 = 0,500. Порівнюємо спочатку цілі частини; якщо рівні — зрівнюємо кількість цифр після коми нулями й порівнюємо дробові: 0,7 і 0,65 → 0,70 > 0,65. 3,2 > 2,99 (ціла більша)."]}, {"h": "Округлення", "p": ["Округлити до розряду: дивимось на <b>наступну</b> цифру: якщо <b>0–4</b> — відкидаємо (округлюємо з недостачею); якщо <b>5–9</b> — попередню збільшуємо на 1 (з надлишком). 3,847 → до десятих: 3,8 (наступна 4); до сотих: 3,85 (наступна 7); до одиниць: 4. Знак ≈. Натуральні: 2 486 до сотень ≈ 2 500; до тисяч ≈ 2 000."]}], "remember": "Десятковий дріб — знаменник 10, 100, 1000; кома; розряди: десяті, соті, тисячні. 0,5 = 0,50. Порівнюємо цілі, потім дробові, зрівнявши цифри. Округлення: наступна цифра 0–4 — відкидаємо, 5–9 — збільшуємо попередню.", "cards": [{"f": "Десятковий дріб", "b": "Дріб зі знаменником 10, 100, 1000…, записаний через кому."}, {"f": "Розряди після коми", "b": "Десяті, соті, тисячні."}, {"f": "25/100 і 2 7/100 у десятковому записі", "b": "0,25 і 2,07."}, {"f": "Чи змінює значення дріб 0,5 → 0,50?", "b": "Ні, нулі в кінці дробової частини можна дописувати/відкидати."}, {"f": "Як порівняти 0,7 і 0,65?", "b": "0,70 > 0,65."}, {"f": "Правило округлення", "b": "Наступна цифра 0–4 — відкинути; 5–9 — попередню збільшити на 1."}, {"f": "3,847 округлити до десятих / сотих", "b": "3,8 / 3,85."}, {"f": "Знак наближеної рівності", "b": "≈."}], "quiz": [{"t": "input", "q": "Запиши десятковим дробом: 3/10.", "a": ["0.3", "0,3"], "e": "0,3."}, {"t": "input", "q": "Запиши десятковим дробом: 2 7/100.", "a": ["2.07", "2,07"], "e": "2,07 — одна десята відсутня, тому 0."}, {"t": "input", "q": "Запиши десятковим дробом: 45/1000.", "a": ["0.045", "0,045"], "e": "Три цифри після коми."}, {"t": "choice", "q": "Яка цифра стоїть у розряді сотих у числі 5,381?", "o": ["3", "8", "1"], "a": 1, "e": "5,3<b>8</b>1 — десяті 3, соті 8, тисячні 1."}, {"t": "choice", "q": "Порівняй: 0,7 і 0,65.", "o": ["0,7 > 0,65", "0,7 < 0,65", "Рівні"], "a": 0, "e": "0,70 > 0,65."}, {"t": "choice", "q": "Порівняй: 2,3 і 2,30.", "o": ["2,3 > 2,30", "2,3 < 2,30", "Рівні"], "a": 2, "e": "Нуль у кінці не змінює."}, {"t": "input", "q": "Округли 3,847 до десятих.", "a": ["3.8", "3,8"], "e": "Наступна 4 — відкидаємо."}, {"t": "input", "q": "Округли 3,847 до сотих.", "a": ["3.85", "3,85"], "e": "Наступна 7 — збільшуємо."}, {"t": "input", "q": "Округли 7,52 до одиниць.", "a": ["8"], "e": "Наступна 5 — збільшуємо."}, {"t": "input", "q": "Округли 2 486 до сотень.", "a": ["2500", "2 500"], "e": "Десятки 8 — збільшуємо."}, {"t": "input", "q": "Округли 12,349 до десятих.", "a": ["12.3", "12,3"], "e": "Наступна 4."}]}, {"id": "m-desiatkovi-dod-vidn", "sec": "Дробові числа", "title": "Додавання і віднімання десяткових дробів", "goal": "Ти додаєш і віднімаєш десяткові дроби стовпчиком.", "learn": [{"h": "Правило", "p": ["Записати <b>кому під комою</b> (розряд під розрядом), зрівняти кількість цифр після коми нулями, додати/відняти як натуральні, у результаті кому поставити <b>під комами</b>."], "ex": ["3,25 + 1,4 = 3,25 + 1,40 = 4,65", "5 − 2,35 = 5,00 − 2,35 = 2,65", "12,7 + 0,83 = 12,70 + 0,83 = 13,53"]}, {"h": "Властивості", "p": ["Ті самі, що для натуральних: переставна й сполучна. Зручно групувати: 2,7 + 3,4 + 1,3 = (2,7 + 1,3) + 3,4 = 7,4."]}, {"h": "Перевірка й помилки", "p": ["Найчастіша помилка — вирівнювати по правому краю замість коми. Перевіряй відніманням/додаванням. Задачі з величинами: 1 м = 100 см = 0,01 м за 1 см; 1 кг = 1000 г = 0,001 кг за 1 г; 3 м 5 см = 3,05 м; 2 кг 300 г = 2,3 кг; 4 грн 50 к. = 4,50 грн."]}], "remember": "Кома під комою, зрівняти цифри нулями, рахувати як натуральні, кому — під комами. 3,25 + 1,4 = 4,65; 5 − 2,35 = 2,65. 3 м 5 см = 3,05 м; 2 кг 300 г = 2,3 кг.", "cards": [{"f": "Головне правило додавання десяткових дробів", "b": "Записувати кому під комою."}, {"f": "3,25 + 1,4", "b": "4,65."}, {"f": "5 − 2,35", "b": "2,65."}, {"f": "3 м 5 см у метрах", "b": "3,05 м."}, {"f": "2 кг 300 г у кілограмах", "b": "2,3 кг."}, {"f": "Найчастіша помилка", "b": "Вирівнювання по правому краю, а не по комі."}], "quiz": [{"t": "input", "q": "Обчисли: 3,25 + 1,4.", "a": ["4.65", "4,65"], "e": "3,25 + 1,40."}, {"t": "input", "q": "Обчисли: 5 − 2,35.", "a": ["2.65", "2,65"], "e": "5,00 − 2,35."}, {"t": "input", "q": "Обчисли: 1 // ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/,/g,".").replace(/[^a-z0-9а-яіїєґ' \-\/.:%°]/gi,"").replace(/\s*([\/.:%°-])\s*/g,"$1").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
