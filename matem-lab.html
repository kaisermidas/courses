<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика руками</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9; --grid:#E8E5DA;
    --accent:#1F7A5A; --accent-soft:#E2F2EC; --volt:#E9A800; --volt-soft:#FFF3D4;
    --ok:#1F9D63; --ok-soft:#E3F6EC; --bad:#D8433B; --bad-soft:#FCE9E7;
    --blue:#2F6FE4; --blue-soft:#E6EEFF; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.015em;margin:0}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  .app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 48px}
  .screen{display:none}.screen.on{display:block}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:32px}
  .back{color:var(--accent);font-weight:600}
  .bar h2{font-size:17px;flex:1;text-align:center}
  header.hero{margin:6px 0 20px}
  header.hero h1{font-size:31px;line-height:1.15}
  header.hero p{color:var(--ink-2);margin:8px 0 0;max-width:34em}
  .tool{display:flex;gap:14px;align-items:center;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}
  .tool .ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--accent-soft)}
  .tool .tx{flex:1;min-width:0}
  .tool b{display:block;font-size:16px}
  .tool span{color:var(--ink-2);font-size:13px}
  .tool .tick{color:var(--ok);font-weight:700;font-size:18px;opacity:0}
  .tool.done .tick{opacity:1}
  .grp{color:var(--ink-2);font-size:14px;margin:22px 0 8px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px}
  .task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
  .hintline{color:var(--ink-2);font-size:14px;margin-top:10px;min-height:1.4em}
  .verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
  .verdict.on{display:block}
  .verdict.good{background:var(--ok-soft);color:#14603E}
  .verdict.warn{background:var(--bad-soft);color:#8F2018}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .center{justify-content:center}
  .btn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:8px 12px;font-size:14px}
  .legend{color:var(--ink-2);font-size:14px;margin-top:10px}
  .big{font-size:26px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
  svg{display:block;max-width:100%;touch-action:none}
  input[type=text],input[type=number]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .chip{display:inline-block;background:#F4F2EC;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);margin-left:6px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-size:15px}
  .opt.good{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .sieve{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0}
  .sieve button{aspect-ratio:1;border-radius:7px;background:#F4F2EC;font-size:12px;font-weight:600;color:var(--ink)}
  .sieve button.out{background:#EFEDE6;color:#C4C0B4;text-decoration:line-through}
  .sieve button.prime{background:var(--accent-soft);color:#14603E}
  .sieve button.one{background:#fff;color:#C4C0B4;border:1px dashed var(--line)}
  .strip{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:10px 0}
  .strip div{aspect-ratio:1;border-radius:4px;background:#EFEDE6}
  .strip div.on{background:var(--accent)}
  .strip div.cut{background:var(--bad-soft)}
  .fracbar{height:44px;display:flex;gap:2px;margin:6px 0 2px}
  .fracbar i{flex:1;border-radius:5px;background:#EFEDE6}
  .fracbar i.on{background:var(--blue)}
  .fracbar.b i.on{background:var(--volt)}
  .grid8{display:grid;width:min(100%,320px);margin:0 auto;border:2px solid #C9C6BB;border-radius:6px;overflow:hidden}
  .grid8 button{aspect-ratio:1;border:0;background:#F6F3E9}
  .grid8 button.on{background:var(--accent);border:1px solid rgba(255,255,255,.35)}
  .pans{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:10px 0}
  .pan{flex:1;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:#FCFBF7}
  .xbox{width:38px;height:38px;border-radius:9px;background:var(--blue-soft);border:2px solid var(--blue);
    display:grid;place-items:center;font-weight:700;color:var(--blue)}
  .wt{width:26px;height:26px;border-radius:50%;background:#F4EBD0;border:2px solid var(--volt)}
  .hanoi{display:flex;justify-content:space-around;align-items:flex-end;height:150px;margin:10px 0}
  .peg{position:relative;width:31%;height:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;
    border-bottom:5px solid #8B8578;padding-bottom:0}
  .peg:before{content:'';position:absolute;bottom:0;width:6px;height:100%;background:#D8D3C4;border-radius:3px}
  .disk{height:20px;border-radius:6px;position:relative;z-index:1;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .peg.sel{background:rgba(31,122,90,.07);border-radius:10px}
  table.tt{border-collapse:collapse;width:100%;margin-top:10px;font-variant-numeric:tabular-nums}
  table.tt th,table.tt td{border:1px solid var(--line);padding:6px;text-align:center;font-size:15px}
  table.tt th{background:#F4F2EC;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<section id="s-home" class="screen on">
  <header class="hero">
    <h1>Математика руками</h1>
    <p>Сімнадцять приладів. Не рахувалка, а спосіб побачити, <i>чому</i> правило працює саме так.</p>
  </header>
  <div id="home-list"></div>
</section>
<section id="s-tool" class="screen">
  <div class="bar"><button class="back" onclick="go('s-home')">‹ Прилади</button><h2 id="t-title"></h2><span style="width:64px"></span></div>
  <div id="t-body"></div>
</section>
</div>
<script>
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const tg = window.Telegram && window.Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
let PR = {};
const KEY='math-lab-v1';
try { PR = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){}
if (tg && tg.CloudStorage) tg.CloudStorage.getItem(KEY,(e,v)=>{ if(!e&&v){ try{PR=Object.assign(PR,JSON.parse(v));homeDraw();}catch(_){}}});
function saveP(){ try{localStorage.setItem(KEY,JSON.stringify(PR));}catch(e){}
  if(tg && tg.CloudStorage) tg.CloudStorage.setItem(KEY,JSON.stringify(PR),()=>{}); }
function mark(k){ if(!PR[k]){ PR[k]=1; saveP(); homeDraw(); } }
function go(id){ $$('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0); }
function say(sel,text,good){ const e=$(sel); if(!e)return; e.className='verdict on '+(good?'good':'warn'); e.innerHTML=text; }
function hide(sel){ const e=$(sel); if(e) e.className='verdict'; }
const gcd=(a,b)=>b?gcd(b,a%b):a;
const GROUPS=['Числа й дії','Дроби, десяткові, відсотки','Величини й геометрія','Задачі та стратегії'];
const TOOLS={};
function T(key,o){ TOOLS[key]=o; }

/* --- 1. Решето Ератосфена --- */
T('sieve',{g:0,ic:'🔎',t:'Решето Ератосфена',s:'Де ховаються прості числа',html:`
<div class="panel">
  <div class="task">Викреслюй кратні: спершу 2, потім 3, 5, 7. Те, що лишиться, — прості числа.</div>
  <div class="row center" id="sv-btns"></div>
  <div class="sieve" id="sv-grid"></div>
  <div class="hintline" id="sv-state"></div>
  <div class="verdict" id="sv-v"></div>
  <div class="legend">Чому досить 2, 3, 5, 7? Якщо число до 100 складене, то менший його дільник не більший за √100 = 10. Тому далі викреслювати нема чого.</div>
</div>`,init(){svInit();}});
let svOut={},svDone={};
function svInit(){svOut={};svDone={};
  $('#sv-btns').innerHTML=[2,3,5,7].map(p=>'<button class="btn small ghost" id="sv-'+p+'" onclick="svCross('+p+')">кратні '+p+'</button>').join('');
  const g=$('#sv-grid');g.innerHTML='';
  for(let n=1;n<=100;n++){const b=document.createElement('button');b.id='sv-c'+n;b.textContent=n;
    if(n===1)b.className='one';
    (function(k){b.onclick=()=>{if(k===1)return;svOut[k]=!svOut[k];svDraw();};})(n);g.appendChild(b);}
  svDraw();}
function svCross(p){for(let n=2*p;n<=100;n+=p)svOut[n]=true;svDone[p]=true;
  $('#sv-'+p).className='btn small';svDraw();}
function svDraw(){let left=0;
  for(let n=1;n<=100;n++){const b=$('#sv-c'+n);
    if(n===1){b.className='one';continue;}
    if(svOut[n])b.className='out';else{b.className=(svDone[2]&&svDone[3]&&svDone[5]&&svDone[7])?'prime':'';left++;}}
  $('#sv-state').textContent='Лишилось чисел: '+left;
  if(svDone[2]&&svDone[3]&&svDone[5]&&svDone[7]){
    if(left===25){mark('sieve');say('#sv-v','Рівно <b>25</b> простих чисел до 100. Одиниця не є простим: у простого рівно два дільники, а в неї один.',true);}
    else say('#sv-v','Лишилось '+left+', а простих має бути 25. Схоже, щось викреслено зайве або пропущено.',false);}
  else hide('#sv-v');}

/* --- 2. Ділники як прямокутники --- */
T('divrect',{g:0,ic:'▦',t:'Ділники — це прямокутники',s:'Просте число не складається у прямокутник',html:`
<div class="panel">
  <div class="task">Із скількох різних прямокутників можна скласти <b id="dv-n">12</b> клітинок? Кожен прямокутник — це пара ділників.</div>
  <input type="range" min="2" max="36" value="12" id="dv-r" oninput="dvDraw()">
  <div id="dv-list" style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0"></div>
  <div class="hintline" id="dv-state"></div>
  <div class="verdict" id="dv-v"></div>
  <div class="legend">Спробуй 13, 17, 23 — у них лише один варіант, витягнута смужка. Такі числа й називають простими. А в 36 прямокутник виходить квадратним: 6 × 6.</div>
</div>`,init(){dvDraw();}});
function dvDraw(){const n=+$('#dv-r').value;$('#dv-n').textContent=n;
  const box=$('#dv-list');box.innerHTML='';let divs=[];
  for(let a=1;a*a<=n;a++)if(n%a===0)divs.push([a,n/a]);
  divs.forEach(d=>{const [a,b]=d,s=Math.max(5,Math.min(13,Math.floor(150/b)));
    const el=document.createElement('div');el.style.textAlign='center';
    el.innerHTML='<svg viewBox="0 0 '+(b*s+2)+' '+(a*s+2)+'" height="'+Math.min(70,a*s+2)+'">'+
      Array.from({length:a*b},(_,i)=>{const r=Math.floor(i/b),c=i%b;
        return '<rect x="'+(c*s+1)+'" y="'+(r*s+1)+'" width="'+s+'" height="'+s+'" fill="#E2F2EC" stroke="#1F7A5A" stroke-width="1"/>';}).join('')+
      '</svg><div style="font-size:13px;color:var(--ink-2);margin-top:4px">'+a+' × '+b+'</div>';
    box.appendChild(el);});
  let all=0;for(let i=1;i<=n;i++)if(n%i===0)all++;
  $('#dv-state').textContent='Прямокутників: '+divs.length+' · усього ділників: '+all;
  if(divs.length===1&&n>1){mark('divrect');say('#dv-v','Один-єдиний прямокутник 1 × '+n+' — отже, '+n+' просте число.',true);}
  else if(divs[divs.length-1][0]===divs[divs.length-1][1])say('#dv-v',n+' = '+divs[divs.length-1][0]+'², тому серед прямокутників є квадрат.',true);
  else hide('#dv-v');}

/* --- 3. Годинникова арифметика --- */
T('clock',{g:0,ic:'🕰',t:'Остача по колу',s:'Який день буде через 100 днів',html:`
<div class="panel">
  <div class="task" id="ck-task"></div>
  <svg viewBox="0 0 240 240" height="230" id="ck-svg"></svg>
  <div class="row center"><input type="number" id="ck-in" style="width:120px;text-align:center" value="10" oninput="ckDraw()"></div>
  <div class="hintline" id="ck-state"></div>
  <div class="row center" style="margin-top:8px"><button class="btn" onclick="ckCheck()">Перевірити відповідь</button>
    <button class="btn ghost" onclick="ckNew()">Інша задача</button></div>
  <div class="verdict" id="ck-v"></div>
  <div class="legend">Рахувати всі кроки не треба: важлива лише остача від ділення на кількість поділок кола.</div>
</div>`,init(){ckI=0;ckOk=0;ckNewLoad();}});
const DAYS=['понеділок','вівторок','середа','четвер','п’ятниця','субота','неділя'];
const ckT=[{n:7,start:1,step:100,q:'Сьогодні вівторок. Який день тижня буде через 100 днів?'},
 {n:7,start:4,step:365,q:'Сьогодні п’ятниця. Який день буде рівно через рік (365 днів)?'},
 {n:12,start:9,step:50,q:'Зараз 9 година. Котра буде через 50 годин? (за 12-годинним колом)'},
 {n:7,start:0,step:1000,q:'Сьогодні понеділок. Який день буде через 1000 днів?'}];
let ckI=0,ckOk=0;
function ckNewLoad(){const t=ckT[ckI];$('#ck-task').innerHTML=t.q+'<span class="chip">'+ckOk+' з 3</span>';
  $('#ck-in').value=t.step;hide('#ck-v');ckDraw();}
function ckNew(){ckI=(ckI+1)%ckT.length;ckNewLoad();}
function ckDraw(){const t=ckT[ckI],steps=+$('#ck-in').value||0;
  const pos=((t.start+steps)%t.n+t.n)%t.n;let s='<circle cx="120" cy="120" r="92" fill="#fff" stroke="#C9C6BB" stroke-width="3"/>';
  for(let i=0;i<t.n;i++){const a=-Math.PI/2+i*2*Math.PI/t.n,x=120+Math.cos(a)*72,y=120+Math.sin(a)*72;
    const lab=t.n===7?DAYS[i].slice(0,2):(i===0?12:i);
    s+='<circle cx="'+x+'" cy="'+y+'" r="18" fill="'+(i===pos?'#1F7A5A':i===t.start?'#FFF3D4':'#F4F2EC')+'"/>'+
       '<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="13" font-weight="600" fill="'+(i===pos?'#fff':'#1E2A3A')+'">'+lab+'</text>';}
  const a=-Math.PI/2+pos*2*Math.PI/t.n;
  s+='<line x1="120" y1="120" x2="'+(120+Math.cos(a)*48)+'" y2="'+(120+Math.sin(a)*48)+'" stroke="#1F7A5A" stroke-width="5" stroke-linecap="round"/>';
  $('#ck-svg').innerHTML=s;
  $('#ck-state').textContent=steps+' : '+t.n+' = '+Math.floor(steps/t.n)+' і остача '+(steps%t.n)+' → зсув на '+(steps%t.n);}
function ckCheck(){const t=ckT[ckI],steps=+$('#ck-in').value||0;
  if(steps!==t.step)return say('#ck-v','Постав у полі саме '+t.step+' — і подивись, куди вкаже стрілка.',false);
  const pos=(t.start+steps)%t.n;ckOk++;
  const name=t.n===7?DAYS[pos]:(pos===0?12:pos)+' година';
  $('#ck-task').innerHTML=t.q+'<span class="chip">'+ckOk+' з 3</span>';
  if(ckOk>=3)mark('clock');
  say('#ck-v','Відповідь: <b>'+name+'</b>. Бо '+steps+' = '+t.n+' × '+Math.floor(steps/t.n)+' + '+(steps%t.n)+', і повні кола нічого не змінюють.',true);}

/* --- 4. Сума 1 + 2 + … + n --- */
T('gauss',{g:0,ic:'📶',t:'Сходинки Гаусса',s:'Як скласти всі числа за один крок',html:`
<div class="panel">
  <div class="task">Пересунь повзунок і додай дзеркальну копію сходинок — вийде прямокутник.</div>
  <input type="range" min="3" max="14" value="6" id="ga-n" oninput="gaDraw()">
  <svg viewBox="0 0 320 200" height="190" id="ga-svg"></svg>
  <div class="row center"><button class="btn" onclick="gaMirror()">Додати копію</button>
    <button class="btn ghost" onclick="gaReset()">Прибрати</button></div>
  <div class="big" id="ga-eq"></div>
  <div class="row center" style="margin-top:10px"><input type="number" id="ga-in" style="width:150px;text-align:center" placeholder="1+2+…+100 = ?">
    <button class="btn small" onclick="gaCheck()">Перевірити</button></div>
  <div class="verdict" id="ga-v"></div>
</div>`,init(){gaOn=false;gaDraw();}});
let gaOn=false;
function gaMirror(){gaOn=true;gaDraw();}
function gaReset(){gaOn=false;gaDraw();}
function gaDraw(){const n=+$('#ga-n').value,s=Math.floor(170/(n+1));let g='';
  for(let r=0;r<n;r++)for(let c=0;c<=r;c++)
    g+='<rect x="'+(10+c*s)+'" y="'+(180-(r+1)*s)+'" width="'+(s-2)+'" height="'+(s-2)+'" fill="#1F7A5A" rx="2"/>';
  if(gaOn)for(let r=0;r<n;r++)for(let c=r+1;c<=n;c++)
    g+='<rect x="'+(10+c*s)+'" y="'+(180-(r+1)*s)+'" width="'+(s-2)+'" height="'+(s-2)+'" fill="#E9A800" rx="2" opacity=".75"/>';
  $('#ga-svg').innerHTML=g;
  const sum=n*(n+1)/2;
  $('#ga-eq').innerHTML=gaOn
    ? '1+2+…+'+n+' = '+n+' × '+(n+1)+' : 2 = <b>'+sum+'</b>'
    : '1 + 2 + … + '+n+' = ?';}
function gaCheck(){const v=+$('#ga-in').value;
  if(v===5050){mark('gauss');say('#ga-v','Так, 5050. Гаусс у школі помітив те саме: 100 × 101 : 2.',true);}
  else say('#ga-v','Ще ні. Підстав у формулу n × (n + 1) : 2 число 100.',false);}

/* --- 5. Постав дужки --- */
T('brackets',{g:0,ic:'( )',t:'Сила дужок',s:'Порядок дій змінює все',html:`
<div class="panel">
  <div class="task" id="br-task"></div>
  <div class="opts" id="br-opts"></div>
  <div class="verdict" id="br-v"></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="brNext()">Далі</button></div>
  <div class="legend">Спершу дужки, потім множення й ділення, і лише тоді додавання й віднімання.</div>
</div>`,init(){brI=0;brOk=0;brDraw();}});
const brT=[
 {e:'2 + 3 × 4 − 5',target:15,o:['(2 + 3) × 4 − 5','2 + 3 × (4 − 5)','2 + (3 × 4 − 5)'],a:0},
 {e:'12 : 2 + 4 × 2',target:16,o:['12 : (2 + 4) × 2','(12 : 2 + 4) × 2','12 : 2 + (4 × 2)'],a:1},
 {e:'20 − 4 × 3 + 2',target:34,o:['(20 − 4) × 3 + 2','20 − 4 × (3 + 2)','20 − (4 × 3 + 2)'],a:0},
 {e:'6 + 6 : 6 + 6',target:2,o:['(6 + 6) : (6 + 6)','6 + (6 : 6) + 6','(6 + 6) : 6 + 6'],a:0}];
let brI=0,brOk=0;
function brDraw(){const t=brT[brI];

function trAng(i){const a=trP[i],b=trP[(i+1)%3],c=trP[(i+2)%3];
  const v1=[b[0]-a[0],b[1]-a[1]],v2=[c[0]-a[0],c[1]-a[1]];
  const d=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2));
  return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI;}
function trDraw(){const A=trAng(0),B=trAng(1),C=trAng(2);
  let s='<polygon points="'+trP.map(p=>p.join(',')).join(' ')+'" fill="#E2F2EC" stroke="#1F7A5A" stroke-width="3"/>';
  trP.forEach((p,i)=>{const ang=[A,B,C][i];
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="13" fill="#2F6FE4" style="cursor:grab"/>'+
       '<text x="'+p[0]+'" y="'+(p[1]-20)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#1E2A3A">'+Math.round(ang)+'°</text>';});
  $('#tr-svg').innerHTML=s;
  const sum=Math.round(A+B+C);
  $('#tr-sum').textContent=Math.round(A)+'° + '+Math.round(B)+'° + '+Math.round(C)+'° = '+sum+'°';
  $('#tr-state').textContent='Форм змінено: '+trMoved;
  if(trMoved>=6){mark('tri');say('#tr-v','Скільки не тягни — завжди 180°. Це не збіг: якщо провести пряму через вершину паралельно основі, три кути складуться в розгорнутий.',true);}
  trBind();}
function trBind(){const svg=$('#tr-svg');if(!svg||svg.dataset.b)return;svg.dataset.b=1;let idx=-1;
  const pt=e=>{const b=svg.getBoundingClientRect();
    return [(e.clientX-b.left)/b.width*320,(e.clientY-b.top)/b.height*220];};
  svg.addEventListener('pointerdown',e=>{const p=pt(e);
    idx=trP.findIndex(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<24);
    if(idx>=0)svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(idx<0)return;e.preventDefault();const p=pt(e);
    trP[idx]=[Math.max(15,Math.min(305,p[0])),Math.max(15,Math.min(205,p[1]))];trDraw();});
  svg.addEventListener('pointerup',()=>{if(idx>=0)trMoved++;idx=-1;trDraw();});
  svg.addEventListener('pointercancel',()=>idx=-1);}

T('hanoi',{g:3,ic:'🗼',t:'Ханойська вежа',s:'Скільки ходів насправді треба',html:`

let HN={n:3,pegs:[[],[],[]],sel:null,moves:0};
function hnSet(n){HN={n:n,pegs:[[],[],[]],sel:null,moves:0};
  for(let i=n;i>=1;i--)HN.pegs[0].push(i);hide('#hn-v');hnDraw();}
function hnDraw(){const cols=['#1F7A5A','#2F6FE4','#E9A800','#D8433B','#8B5CF6'];
  const box=$('#hn-pegs');box.innerHTML='';
  HN.pegs.forEach((p,i)=>{const el=document.createElement('div');el.className='peg'+(HN.sel===i?' sel':'');
    p.forEach(d=>{const dv=document.createElement('div');dv.className='disk';
      dv.style.width=(28+d*16)+'px';dv.style.background=cols[d-1];dv.textContent=d;el.appendChild(dv);});
    (function(k){el.onclick=()=>hnTap(k);})(i);box.appendChild(el);});
  const min=Math.pow(2,HN.n)-1;
  $('#hn-task').innerHTML='Перенеси всі диски на праву паличку. Більший диск не можна класти на менший.';
  $('#hn-state').textContent='Ходів: '+HN.moves+' · мінімум для '+HN.n+' дисків: '+min;}
function hnTap(i){
  if(HN.sel===null){if(!HN.pegs[i].length)return;HN.sel=i;hnDraw();return;}
  if(HN.sel===i){HN.sel=null;hnDraw();return;}
  const from=HN.pegs[HN.sel],to=HN.pegs[i],d=from[from.length-1];
  if(to.length&&to[to.length-1]<d){HN.sel=null;hnDraw();
    return say('#hn-v','Більший диск не кладуть на менший.',false);}
  from.pop();to.push(d);HN.moves++;HN.sel=null;hide('#hn-v');hnDraw();
  if(HN.pegs[2].length===HN.n){const min=Math.pow(2,HN.n)-1;mark('hanoi');
    say('#hn-v',HN.moves===min?'Ідеально: '+HN.moves+' ходів — це і є мінімум 2^'+HN.n+' − 1.'
      :'Готово за '+HN.moves+' ходів. Мінімум — '+min+'. Спробуй ще: кожен зайвий диск подвоює роботу.',HN.moves===min);}}
