> — що означає.", "<b>Фразеологічний</b> — значення сталих висловів.", "<b>Словник синонімів / антонімів / паронімів / іншомовних слів</b>."]}], "remember": "Орфографія — правила написання, орфоепія — вимови. Орфограма — місце застосування правила. Помилки: орфоепічна (вимова), орфографічна (написання), графічна (описка). Написання — орфографічний словник, вимова — орфоепічний, наголос — словник наголосів.", "cards": [{"f": "Орфографія", "b": "Правила написання слів."}, {"f": "Орфоепія", "b": "Правила вимови й наголошування."}, {"f": "Орфограма", "b": "Місце в слові, де треба застосувати правило написання."}, {"f": "Орфоепічна помилка", "b": "Неправильна вимова або наголос."}, {"f": "Орфографічна помилка", "b": "Неправильне написання слова."}, {"f": "Графічна помилка", "b": "Описка: пропущена або сплутана буква."}, {"f": "Який словник каже, як писати слово?", "b": "Орфографічний."}, {"f": "Який словник каже, як вимовляти?", "b": "Орфоепічний."}], "quiz": [{"t": "choice", "q": "Що вивчає орфографія?", "o": ["Правила вимови", "Правила написання слів", "Значення слів"], "a": 1, "e": "Орфографія — правопис."}, {"t": "choice", "q": "Що вивчає орфоепія?", "o": ["Правила вимови й наголосу", "Правила написання", "Будову слова"], "a": 0, "e": "Орфоепія — вимова."}, {"t": "choice", "q": "Учень сказав «випáдок». Яка це помилка?", "o": ["Орфографічна", "Орфоепічна", "Графічна"], "a": 1, "e": "Неправильний наголос — орфоепічна помилка."}, {"t": "choice", "q": "Учень написав «росказати». Яка це помилка?", "o": ["Орфографічна", "Орфоепічна", "Лексична"], "a": 0, "e": "Неправильне написання префікса — орфографічна."}, {"t": "choice", "q": "У якому словнику перевірити, як пишеться «кишеня»?", "o": ["Тлумачному", "Орфографічному", "Фразеологічному"], "a": 1, "e": "Написання — орфографічний словник."}, {"t": "choice", "q": "У якому словнику перевірити наголос у слові «ознака»?", "o": ["У словнику наголосів", "У словнику синонімів", "У словнику іншомовних слів"], "a": 0, "e": "Наголос — словник наголосів або орфоепічний."}, {"t": "input", "q": "Як називається місце в слові, де треба застосувати правило написання?", "a": ["орфограма"], "e": "Орфограма."}, {"t": "tf", "q": "Пропущена через неуважність буква — це графічна помилка.", "a": true, "e": "Так, описка — графічна помилка."}, {"t": "choice", "q": "Значення фразеологізму «пекти раків» шукаємо у…", "o": ["орфографічному словнику", "фразеологічному словнику", "словнику наголосів"], "a": 1, "e": "Фразеологічний словник."}]}, {"id": "syn-slovospoluchennia", "sec": "Синтаксис і пунктуація", "title": "Словосполучення. Головне й залежне слово", "goal": "Ти відрізняєш словосполучення від слова й речення і знаходиш головне та залежне слово.", "learn": [{"h": "Синтаксис і пунктуація", "p": ["<span class='term'>Синтаксис</span> — розділ науки про мову, що вивчає словосполучення й речення. <span class='term'>Пунктуація</span> — правила вживання розділових знаків."]}, {"h": "Словосполучення", "p": ["<span class='term'>Словосполучення</span> — два або більше слів, пов'язаних за змістом і граматично. Одне слово <b>головне</b> (від нього ставимо питання), інше — <b>залежне</b>."], "ex": ["читати (що?) книгу — головне <i>читати</i>, залежне <i>книгу</i>", "зелений (який?) ліс → головне <i>ліс</i>, залежне <i>зелений</i>", "бігти (як?) швидко → головне <i>бігти</i>"], "note": "Словосполучення називає точніше, ніж слово: <i>ліс</i> → <i>сосновий ліс</i>. Але не виражає закінченої думки, як речення."}, {"h": "Що НЕ є словосполученням", "p": ["Підмет + присудок (<i>дощ іде</i>) — це граматична основа речення.", "Однорідні члени (<i>яблука і груші</i>).", "Слово з прийменником (<i>у лісі</i>), фразеологізм (<i>бити байдики</i>)."]}], "remember": "Словосполучення — головне + залежне слово (читати → книгу). Не словосполучення: підмет із присудком, однорідні члени, слово з прийменником. Синтаксис вивчає словосполучення й речення, пунктуація — розділові знаки.", "cards": [{"f": "Синтаксис", "b": "Розділ науки про мову про словосполучення й речення."}, {"f": "Пунктуація", "b": "Правила вживання розділових знаків."}, {"f": "Словосполучення", "b": "Два або більше слів, пов'язаних за змістом і граматично; є головне й залежне слово."}, {"f": "Головне слово", "b": "Те, від якого ставимо питання: читати (що?) книгу."}, {"f": "Чи є «дощ іде» словосполученням?", "b": "Ні, це граматична основа (підмет і присудок)."}, {"f": "Чи є «яблука і груші» словосполученням?", "b": "Ні, це однорідні члени."}], "quiz": [{"t": "choice", "q": "Що вивчає синтаксис?", "o": ["Звуки", "Словосполучення й речення", "Значення слів"], "a": 1, "e": "Синтаксис — про словосполучення й речення."}, {"t": "choice", "q": "Що з цього — словосполучення?", "o": ["сонце світить", "яскраве сонце", "сонце і місяць"], "a": 1, "e": "Яскраве (яке?) сонце — головне і залежне. Інші: основа речення й однорідні члени."}, {"t": "choice", "q": "У словосполученні «читати книгу» головне слово…", "o": ["читати", "книгу"], "a": 0, "e": "Від «читати» ставимо питання: читати (що?) книгу."}, {"t": "choice", "q": "У словосполученні «високе дерево» головне слово…", "o": ["високе", "дерево"], "a": 1, "e": "Дерево (яке?) високе."}, {"t": "tf", "q": "«У лісі» — словосполучення.", "a": false, "e": "Ні, це слово з прийменником."}, {"t": "choice", "q": "Чим словосполучення відрізняється від речення?", "o": ["Словосполучення довше", "Словосполучення не виражає закінченої думки", "Словосполучення не має слів"], "a": 1, "e": "Речення виражає закінчену думку, словосполучення — лише називає точніше."}, {"t": "input", "q": "Як називається слово, від якого в словосполученні ставимо питання?", "a": ["головне", "головне слово"], "e": "Головне слово."}, {"t": "choice", "q": "Що з цього НЕ словосполучення?", "o": ["бігти швидко", "бити байдики", "солодкий чай"], "a": 1, "e": "Фразеологізм — це одне ціле, як одне слово."}]}, {"id": "syn-hramatychna-osnova", "sec": "Синтаксис і пунктуація", "title": "Речення. Граматична основа: підмет і присудок", "goal": "Ти знаходиш у реченні підмет і присудок і знаєш, чим вони найчастіше виражені.", "learn": [{"h": "Речення", "p": ["<span class='term'>Речення</span> — слово або група слів, що виражають закінчену думку. Має <b>граматичну основу</b> та інтонацію завершеності."]}, {"h": "Підмет", "p": ["<span class='term'>Підмет</span> — головний член речення, що називає, про кого або про що йдеться. Відповідає на питання <b>хто? що?</b> Найчастіше виражений іменником або займенником у називному відмінку. Підкреслюють однією лінією."], "ex": ["<u>Учні</u> читають. <u>Вона</u> усміхнулась. <u>Дніпро</u> тече."]}, {"h": "Присудок", "p": ["<span class='term'>Присудок</span> — головний член речення, що називає, що робить підмет, який він. Питання: <b>що робить? що зробив? який він є? хто він?</b> Найчастіше — дієслово; буває прикметник чи іменник. Підкреслюють двома лініями."], "ex": ["Учні <u><u>читають</u></u>. Ліс <u><u>зелений</u></u>. Київ — <u><u>столиця</u></u>."], "note": "Підмет + присудок = <span class='term'>граматична основа</span>. Знайти її — перший крок розбору речення."}, {"h": "Речення з одним головним членом", "p": ["Є речення, де тільки присудок або тільки підмет: <i>Вечоріє. Світає. Тиша.</i> Це односкладні речення."]}], "remember": "Підмет — хто? що? (одна лінія). Присудок — що робить? який? (дві лінії). Разом — граматична основа. Односкладні речення мають один головний член: Вечоріє.", "cards": [{"f": "Речення", "b": "Слово або група слів, що виражають закінчену думку; має граматичну основу."}, {"f": "Підмет", "b": "Головний член речення: про кого/що йдеться. Хто? що? Одна лінія."}, {"f": "Присудок", "b": "Головний член речення: що робить підмет, який він. Дві лінії."}, {"f": "Граматична основа", "b": "Підмет і присудок разом."}, {"f": "Чим найчастіше виражений підмет?", "b": "Іменником або займенником у називному відмінку."}, {"f": "Чим найчастіше виражений присудок?", "b": "Дієсловом."}, {"f": "Односкладне речення", "b": "Має один головний член: Світає. Тиша."}], "quiz": [{"t": "choice", "q": "На які питання відповідає підмет?", "o": ["хто? що?", "що робить?", "який?"], "a": 0, "e": "Підмет — хто? що?"}, {"t": "choice", "q": "Знайди підмет: «Діти граються у дворі».", "o": ["діти", "граються", "у дворі"], "a": 0, "e": "Хто? — діти."}, {"t": "choice", "q": "Знайди присудок: «Осінь розфарбувала дерева».", "o": ["осінь", "розфарбувала", "дерева"], "a": 1, "e": "Що зробила? — розфарбувала."}, {"t": "input", "q": "Назви підмет у реченні «Червоне сонце сідає за гори».", "a": ["сонце"], "e": "Що? — сонце."}, {"t": "choice", "q": "Що таке граматична основа?", "o": ["Усі слова речення", "Підмет і присудок", "Головне і залежне слово"], "a": 1, "e": "Основа речення — підмет із присудком."}, {"t": "choice", "q": "Чим виражений присудок у реченні «Ліс восени золотий»?", "o": ["Дієсловом", "Прикметником", "Іменником"], "a": 1, "e": "Ліс (який?) золотий — прикметник."}, {"t": "choice", "q": "Скільки головних членів у реченні «Світає»?", "o": ["Один", "Два", "Жодного"], "a": 0, "e": "Тільки присудок — односкладне речення."}, {"t": "tf", "q": "Підмет підкреслюють двома лініями, присудок — однією.", "a": false, "e": "Навпаки: підмет — одна лінія, присудок — дві."}, {"t": "choice", "q": "У реченні «Я люблю читати» підмет виражений…", "o": ["іменником", "займенником", "дієсловом"], "a": 1, "e": "Я — займенник."}]}, {"id": "syn-vydy-rechen", "sec": "Синтаксис і пунктуація", "title": "Види речень за метою висловлювання й емоційним забарвленням", "goal": "Ти розрізняєш розповідні, питальні, спонукальні речення та окличні й неокличні і ставиш правильний знак у кінці.", "learn": [{"h": "За метою висловлювання", "p": ["<span class='term'>Розповідне</span> — повідомляє, розповідає: <i>Настала осінь.</i> У кінці крапка.", "<span class='term'>Питальне</span> — запитує: <i>Ти зробив уроки?</i> У кінці знак питання. Часто є слова <i>хто, що, де, коли, чому, чи, хіба, невже</i>.", "<span class='term'>Спонукальне</span> — наказує, просить, радить: <i>Зачини вікно. Будь ласка, допоможи.</i> У кінці крапка або знак оклику."]}, {"h": "За емоційним забарвленням", "p": ["<span class='term'>Окличне</span> — вимовляється з сильним почуттям, у кінці знак оклику: <i>Як гарно навколо! Біжи швидше!</i>", "<span class='term'>Неокличне</span> — спокійно: <i>Навколо гарно.</i>"], "note": "Окличним може бути речення будь-якого виду: розповідне (<i>Ми перемогли!</i>), питальне (<i>Невже це ти?!</i>), спонукальне (<i>Іди сюди!</i>)."}, {"h": "Знаки в кінці", "p": ["Крапка — розповідне/спонукальне неокличне. Знак питання — питальне. Знак оклику — окличне. Питальне окличне — ?! Три крапки — незакінчена думка."]}], "remember": "За метою: розповідне (.), питальне (?), спонукальне (. або !). За емоціями: окличне (!) і неокличне. Окличним може бути будь-яке речення.", "cards": [{"f": "Розповідне речення", "b": "Повідомляє, розповідає. У кінці крапка."}, {"f": "Питальне речення", "b": "Запитує. У кінці знак питання."}, {"f": "Спонукальне речення", "b": "Наказує, просить, радить. Крапка або знак оклику."}, {"f": "Окличне речення", "b": "Вимовляється з сильним почуттям; знак оклику. Буває будь-якого виду за метою."}, {"f": "Три види речень за метою висловлювання", "b": "Розповідні, питальні, спонукальні."}, {"f": "Два види за емоційним забарвленням", "b": "Окличні й неокличні."}], "quiz": [{"t": "choice", "q": "«Скільки тобі років?» — яке речення за метою висловлювання?", "o": ["Розповідне", "Питальне", "Спонукальне"], "a": 1, "e": "Запитання — питальне."}, {"t": "choice", "q": "«Зачини, будь ласка, двері.» — яке речення?", "o": ["Розповідне", "Питальне", "Спонукальне"], "a": 2, "e": "Прохання — спонукальне."}, {"t": "choice", "q": "«Вчора ми ходили в музей.» — яке речення?", "o": ["Розповідне", "Питальне", "Спонукальне"], "a": 0, "e": "Повідомляє — розповідне."}, {"t": "choice", "q": "«Яка чудова погода!» — яке речення за емоційним забарвленням?", "o": ["Окличне", "Неокличне"], "a": 0, "e": "Сильне почуття, знак оклику — окличне."}, {"t": "tf", "q": "Питальне речення не може бути окличним.", "a": false, "e": "Може: «Невже ти виграв?!»"}, {"t": "choice", "q": "Який знак ставимо в кінці: «Іди сюди негайно»", "o": [".", "!", "?"], "a": 1, "e": "Різкий наказ — спонукальне окличне: знак оклику."}, {"t": "choice", "q": "«Ми перемогли!» — це речення…", "o": ["розповідне окличне", "спонукальне окличне", "питальне неокличне"], "a": 0, "e": "Повідомляє (розповідне) з сильним почуттям (окличне)."}, {"t": "input", "q": "Скільки видів речень за метою висловлювання? Напиши число.", "a": ["3", "три"], "e": "Три: розповідні, питальні, спонукальні."}, {"t": "choice", "q": "Які слова вказують на питальне речення?", "o": ["хто, що, де, коли, чи, невже", "і, та, але", "дуже, надто"], "a": 0, "e": "Питальні слова: хто, що, де, коли, чому, чи, хіба, невже."}]}, {"id": "syn-druhoriadni", "sec": "Синтаксис і пунктуація", "title": "Другорядні члени речення: додаток, означення, обставина", "goal": "Ти розрізняєш додаток, означення та обставину за питаннями.", "learn": [{"h": "Головні й другорядні", "p": ["Головні члени — підмет і присудок. Усі інші — <span class='term'>другорядні</span>: вони пояснюють головні або одне одного. Речення лише з головних членів — <b>непоширене</b>, з другорядними — <b>поширене</b>."]}, {"h": "Додаток", "p": ["<span class='term'>Додаток</span> — означає предмет, на який спрямована дія. Питання непрямих відмінків: <b>кого? чого? кому? чому? кого? що? ким? чим? на кому? на чому?</b> Підкреслюють пунктиром (- - -)."], "ex": ["Мама купила (що?) <i>хліб</i>. Я пишу (кому?) <i>другові</i>."]}, {"h": "Означення", "p": ["<span class='term'>Означення</span> — називає ознаку предмета. Питання: <b>який? чий? котрий?</b> Найчастіше прикметник. Підкреслюють хвилястою лінією (~~~)."], "ex": ["(Який?) <i>Теплий</i> дощ. (Чия?) <i>Мамина</i> книга."]}, {"h": "Обставина", "p": ["<span class='term'>Обставина</span> — вказує на місце, час, спосіб, причину, мету дії. Питання: <b>де? куди? звідки? коли? як? чому? навіщо?</b> Часто прислівник або іменник із прийменником. Підкреслюють крапка-тире (-.-.-)."], "ex": ["Ми гуляли (де?) <i>в парку</i>. Він прийшов (коли?) <i>учора</i>. Читай (як?) <i>уважно</i>."], "note": "Підказка: додаток — «що/кому», означення — «який/чий», обставина — «де/коли/як»."}], "remember": "Додаток — кого? що? кому? чим? (пунктир). Означення — який? чий? (хвиляста). Обставина — де? коли? як? чому? (крапка-тире). Речення з другорядними членами — поширене.", "cards": [{"f": "Другорядні члени речення", "b": "Додаток, означення, обставина. Пояснюють головні члени."}, {"f": "Додаток", "b": "Предмет, на який спрямована дія: кого? що? кому? чим? Пунктир."}, {"f": "Означення", "b": "Ознака предмета: який? чий? котрий? Хвиляста лінія."}, {"f": "Обставина", "b": "Місце, час, спосіб, причина: де? коли? як? чому? Крапка-тире."}, {"f": "Поширене речення", "b": "Має, крім головних, другорядні члени. Непоширене — тільки основа."}], "quiz": [{"t": "choice", "q": "«Мама купила хліб». Слово «хліб» — це…", "o": ["додаток", "означення", "обставина"], "a": 0, "e": "Купила (що?) хліб — додаток."}, {"t": "choice", "q": "«Теплий дощ пройшов». Слово «теплий» — це…", "o": ["додаток", "означення", "обставина"], "a": 1, "e": "Дощ (який?) теплий — означення."}, {"t": "choice", "q": "«Ми гуляли в парку». «В парку» — це…", "o": ["додаток", "означення", "обставина"], "a": 2, "e": "Гуляли (де?) в парку — обставина місця."}, {"t": "choice", "q": "На які питання відповідає означення?", "o": ["який? чий? котрий?", "кого? що?", "де? коли?"], "a": 0, "e": "Означення — ознака: який? чий?"}, {"t": "choice", "q": "«Він прийшов учора». «Учора» — це…", "o": ["обставина часу", "додаток", "означення"], "a": 0, "e": "Прийшов (коли?) учора."}, {"t": "choice", "q": "Яке речення поширене?", "o": ["Дощ іде.", "Іде теплий дощ.", "Світає."], "a": 1, "e": "Є другорядний член «теплий»."}, {"t": "input", "q": "Як називається другорядний член, що відповідає на питання «де? коли? як?»", "a": ["обставина"], "e": "Обставина."}, {"t": "choice", "q": "«Я написав листа другові». Скільки додатків?", "o": ["Один", "Два", "Жодного"], "a": 1, "e": "Написав (що?) листа, (кому?) другові — два додатки."}, {"t": "tf", "q": "Означення підкреслюють пунктиром.", "a": false, "e": "Означення — хвилястою лінією; пунктир — додаток."}, {"t": "choice", "q": "«Мамина книга лежить на столі». «Мамина» — це…", "o": ["означення", "додаток", "підмет"], "a": 0, "e": "Книга (чия?) мамина."}]}, {"id": "syn-odnoridni", "sec": "Синтаксис і пунктуація", "title": "Однорідні члени речення. Кома між ними", "goal": "Ти знаходиш однорідні члени й правильно ставиш коми між ними.", "learn": [{"h": "Однорідні члени", "p": ["<span class='term'>Однорідні члени</span> — слова, що відповідають на одне питання, відносяться до одного слова і є одним членом речення. Вимовляються з інтонацією переліку."], "ex": ["На столі лежали <i>яблука, груші</i> і <i>сливи</i> (однорідні підмети).", "Він <i>читає</i> і <i>пише</i> (однорідні присудки).", "<i>Швидко, весело</i> бігли діти (однорідні обставини)."]}, {"h": "Кома ставиться", "p": ["1. Між однорідними без сполучників: <i>яблука<b>,</b> груші<b>,</b> сливи</i>.", "2. Перед <b>а, але, та (=але)</b>: <i>малий<b>,</b> але сильний</i>.", "3. Перед повторюваними <b>і…і, ні…ні, то…то</b>: <i>і сміх<b>,</b> і сльози</i>."]}, {"h": "Кома НЕ ставиться", "p": ["Перед одиничним <b>і, та (=і), або, чи</b>: <i>яблука <b>і</b> груші</i>; <i>читає <b>або</b> пише</i>."]}, {"h": "Узагальнювальне слово", "p": ["<span class='term'>Узагальнювальне слово</span> об'єднує однорідні члени. Якщо стоїть перед ними — <b>двокрапка</b>; після — <b>тире</b>."], "ex": ["У саду росли <b>дерева:</b> яблуні, груші, сливи.", "Яблуні, груші, сливи — <b>усе</b> росло в саду."]}], "remember": "Однорідні члени — одне питання, одне слово, один член речення. Кома: без сполучників, перед а, але, і…і. Без коми: перед одиничним і, та, або. Узагальнювальне слово: перед — двокрапка, після — тире.", "cards": [{"f": "Однорідні члени речення", "b": "Одне питання, залежать від одного слова, один член речення: яблука, груші і сливи."}, {"f": "Кома між однорідними", "b": "Без сполучників; перед а, але; перед повторюваними і…і, ні…ні."}, {"f": "Без коми між однорідними", "b": "Перед одиничним і, та (=і), або, чи."}, {"f": "Узагальнювальне слово перед однорідними", "b": "Двокрапка: дерева: яблуні, груші."}, {"f": "Узагальнювальне слово після однорідних", "b": "Тире: яблуні, груші — усе росло."}], "quiz": [{"t": "choice", "q": "Де правильно розставлено коми?", "o": ["Ми купили яблука груші і сливи.", "Ми купили яблука, груші і сливи.", "Ми купили яблука, груші, і сливи."], "a": 1, "e": "Кома між однорідними без сполучника; перед одиничним і — немає."}, {"t": "choice", "q": "Чи потрібна кома: «Він малий (,) але сильний»?", "o": ["Так", "Ні"], "a": 0, "e": "Перед «але» кома ставиться завжди."}, {"t": "choice", "q": "Чи потрібна кома: «Я читаю (,) або малюю»?", "o": ["Так", "Ні"], "a": 1, "e": "Перед одиничним «або» кома не ставиться."}, {"t": "choice", "q": "Чи потрібна кома: «І сміх (,) і сльози були в залі»?", "o": ["Так", "Ні"], "a": 0, "e": "Перед повторюваним і…і кома ставиться."}, {"t": "choice", "q": "Який знак: «У саду росли дерева (…) яблуні, груші, сливи»?", "o": ["двокрапка", "тире", "кома"], "a": 0, "e": "Узагальнювальне слово перед однорідними — двокрапка."}, {"t": "choice", "q": "Який знак: «Яблуні, груші, сливи (…) усе росло в саду»?", "o": ["двокрапка", "тире", "крапка"], "a": 1, "e": "Узагальнювальне слово після — тире."}, {"t": "choice", "q": "Які члени однорідні: «Діти сміялися і співали»?", "o": ["Присудки", "Підмети", "Додатки"], "a": 0, "e": "Сміялися і співали — однорідні присудки."}, {"t": "tf", "q": "Однорідні члени завжди відповідають на одне й те саме питання.", "a": true, "e": "Так, це головна ознака."}, {"t": "input", "q": "Як називається слово, що об'єднує однорідні члени (наприклад «дерева» перед «яблуні, груші»)?", "a": ["узагальнювальне", "узагальнювальне слово", "узагальнююче"], "e": "Узагальнювальне слово."}]}, {"id": "syn-zvertannia-vstavni", "sec": "Синтаксис і пунктуація", "title": "Звертання. Вставні слова", "goal": "Ти знаходиш звертання і вставні слова та виділяєш їх комами.", "learn": [{"h": "Звертання", "p": ["<span class='term'>Звертання</span> — слово або кілька слів, що називають того, до кого звертаються. Стоїть у кличному відмінку: <i>Оленко, Іване, мамо, друже, пане вчителю</i>. Не є членом речення."], "ex": ["<b>Оленко,</b> іди сюди.", "Іди, <b>Оленко,</b> сюди.", "Іди сюди, <b>Оленко.</b>"], "note": "На письмі виділяємо комами з обох боків. Якщо вимовляється з сильним почуттям на початку речення — знак оклику: <i>Друзі! Слухайте!</i>"}, {"h": "Кличний відмінок", "p": ["<i>Оля → Олю, Петро → Петре, Андрій → Андрію, мама → мамо, бабуся → бабусю, друг → друже, пан → пане, Ігор → Ігорю</i>."]}, {"h": "Вставні слова", "p": ["<span class='term'>Вставні слова</span> виражають ставлення мовця до сказаного; не є членами речення. Виділяються комами."], "ex": ["впевненість: <i>звичайно, безперечно, справді</i>", "невпевненість: <i>мабуть, можливо, здається, певно</i>", "почуття: <i>на щастя, на жаль, на диво</i>", "джерело: <i>по-моєму, кажуть, на мою думку</i>", "порядок думок: <i>по-перше, по-друге, отже, нарешті</i>"]}], "remember": "Звертання — кличний відмінок (Оленко, друже), виділяємо комами, не член речення. Вставні слова (мабуть, звичайно, на жаль, по-перше) виділяємо комами, не члени речення.", "cards": [{"f": "Звертання", "b": "Називає того, до кого звертаються. Кличний відмінок. Виділяємо комами."}, {"f": "Чи є звертання членом речення?", "b": "Ні."}, {"f": "Кличний відмінок: Оля, Петро, друг", "b": "Олю, Петре, друже."}, {"f": "Вставні слова", "b": "Виражають ставлення до сказаного: мабуть, звичайно, на жаль, по-перше. Виділяємо комами."}, {"f": "Вставні слова невпевненості", "b": "Мабуть, можливо, здається, певно."}, {"f": "Вставні слова порядку думок", "b": "По-перше, по-друге, отже, нарешті."}], "quiz": [{"t": "choice", "q": "Де правильно виділено звертання?", "o": ["Оленко іди сюди.", "Оленко, іди сюди.", "Оленко, іди, сюди."], "a": 1, "e": "Звертання на початку — кома після нього."}, {"t": "choice", "q": "У якому відмінку стоїть звертання?", "o": ["У називному", "У кличному", "У знахідному"], "a": 1, "e": "Звертання — кличний відмінок."}, {"t": "input", "q": "Постав у кличний відмінок: «друг» → «…»", "a": ["друже"], "e": "Друже."}, {"t": "input", "q": "Постав у кличний відмінок: «Оля» → «…»", "a": ["олю"], "e": "Олю."}, {"t": "choice", "q": "Знайди вставне слово: «Мабуть, завтра буде дощ».", "o": ["мабуть", "завтра", "дощ"], "a": 0, "e": "Мабуть — невпевненість, вставне слово."}, {"t": "choice", "q": "Що виражає вставне слово «на жаль»?", "o": ["Впевненість", "Почуття", "Порядок думок"], "a": 1, "e": "На жаль, на щастя — почуття."}, {"t": "tf", "q": "Вставні слова є членами речення.", "a": false, "e": "Ні, як і звертання."}, {"t": "choice", "q": "Де правильно розставлено коми?", "o": ["Ти звичайно правий.", "Ти, звичайно, правий.", "Ти звичайно, правий."], "a": 1, "e": "Вставне слово в середині — коми з обох боків."}, {"t": "choice", "q": "Яке слово вставне?", "o": ["По-перше", "Швидко", "Дуже"], "a": 0, "e": "По-перше — порядок думок."}, {"t": "choice", "q": "«Друзі! Слухайте уважно.» — чому після звертання знак оклику?", "o": ["Помилка", "Звертання вимовлено з сильним почуттям", "Так завжди"], "a": 1, "e": "Окличне звертання на початку — знак оклику."}]}, {"id": "syn-skladne", "sec": "Синтаксис і пунктуація", "title": "Складне речення. Кома між його частинами", "goal": "Ти відрізняєш просте речення від складного і ставиш кому між частинами складного.", "learn": [{"h": "Просте і складне", "p": ["<span class='term'>Просте речення</span> має одну граматичну основу. <span class='term'>Складне</span> — дві або більше основ, тобто складається з кількох простих."], "ex": ["Просте: <u>Дощ</u> <u><u>іде</u></u>.", "Складне: <u>Дощ</u> <u><u>іде</u></u>, і <u>ми</u> <u><u>сидимо</u></u> вдома. (2 основи)"], "note": "Не плутай з однорідними присудками: «Дощ іде і шумить» — одна основа, це просте речення."}, {"h": "Сполучникове й безсполучникове", "p": ["Частини складного речення з'єднуються <b>сполучниками</b> (<i>і, та, а, але, бо, що, щоб, коли, як, тому що, якщо</i>) або тільки <b>інтонацією</b> (без сполучників)."], "ex": ["Сонце зайшло<b>, і</b> стало темно.", "Сонце зайшло<b>,</b> стало темно."]}, {"h": "Кома в складному реченні", "p": ["Між частинами складного речення ставимо <b>кому</b> — і перед сполучником, і без сполучника."], "ex": ["Я знаю<b>,</b> що ти прийдеш.", "Коли настане літо<b>,</b> ми поїдемо до моря.", "Він не прийшов<b>,</b> бо захворів."], "note": "Щоб перевірити: знайди основи. Дві основи — кома між частинами."}], "remember": "Складне речення = дві і більше граматичних основ. Між частинами — кома (і перед і, бо, що, коли, і без сполучника). Однорідні присудки — не складне речення.", "cards": [{"f": "Просте речення", "b": "Одна граматична основа."}, {"f": "Складне речення", "b": "Дві або більше граматичних основ."}, {"f": "Як з'єднуються частини складного речення?", "b": "Сполучниками (і, а, але, бо, що, коли) або лише інтонацією."}, {"f": "Який знак між частинами складного речення?", "b": "Кома."}, {"f": "«Дощ іде і шумить» — просте чи складне?", "b": "Просте: одна основа з однорідними присудками."}], "quiz": [{"t": "choice", "q": "Скільки основ у складному реченні?", "o": ["Одна", "Дві або більше", "Жодної"], "a": 1, "e": "Складне — дві і більше основ."}, {"t": "choice", "q": "Яке речення складне?", "o": ["Сонце зайшло, і стало темно.", "Сонце зайшло за гори.", "Сонце зайшло і сховалось."], "a": 0, "e": "Дві основи: сонце зайшло, стало темно."}, {"t": "choice", "q": "«Дощ іде і шумить» — це…", "o": ["складне речення", "просте з однорідними присудками"], "a": 1, "e": "Один підмет, два присудки — одна основа."}, {"t": "choice", "q": "Де потрібна кома?", "o": ["Я знаю що ти прийдеш.", "Я знаю, що ти прийдеш."], "a": 1, "e": "Перед «що» між частинами складного речення — кома."}, {"t": "choice", "q": "Де потрібна кома?", "o": ["Він не прийшов, бо захворів.", "Він не прийшов бо захворів."], "a": 0, "e": "Перед «бо» — кома."}, {"t": "tf", "q": "Якщо частини складного речення з'єднані без сполучника, кома не потрібна.", "a": false, "e": "Потрібна: «Сонце зайшло, стало темно»."}, {"t": "input", "q": "Скільки основ у реченні «Коли настане літо, ми поїдемо до моря»? Напиши число.", "a": ["2", "дві"], "e": "Літо настане; ми поїдемо — дві основи."}, {"t": "choice", "q": "Чи потрібна кома: «Діти співали (,) і танцювали»?", "o": ["Так", "Ні"], "a": 1, "e": "Однорідні присудки з одиничним і — без коми."}, {"t": "choice", "q": "Чи потрібна кома: «Діти співали (,) і музика лунала всюди»?", "o": ["Так", "Ні"], "a": 0, "e": "Дві основи — складне речення, кома перед і."}]}, {"id": "syn-priama-mova-dialoh", "sec": "Синтаксис і пунктуація", "title": "Пряма мова. Діалог", "goal": "Ти ставиш розділові знаки при прямій мові і оформлюєш діалог.", "learn": [{"h": "Пряма мова", "p": ["<span class='term'>Пряма мова</span> — точно передані чужі слова. <span class='term'>Слова автора</span> вказують, кому вона належить. Пряму мову беремо в лапки, починаємо з великої букви."]}, {"h": "Схеми", "p": ["А — слова автора, П — пряма мова."], "ex": ["<b>А: «П».</b> Мама сказала: «Іди обідати».", "<b>А: «П!»</b> / <b>А: «П?»</b> Він гукнув: «Біжи!»", "<b>«П», — а.</b> «Іди обідати», — сказала мама.", "<b>«П!» — а.</b> / <b>«П?» — а.</b> «Ти йдеш?» — спитала мама."], "note": "Після слів автора — двокрапка. Після прямої мови перед словами автора — кома (або ! ?) і тире; слова автора з малої букви."}, {"h": "Діалог", "p": ["<span class='term'>Діалог</span> — розмова двох або кількох осіб. Кожна <span class='term'>репліка</span> з нового рядка, перед нею <b>тире</b>, лапки не ставимо."], "ex": ["— Ти зробив уроки?<br>— Так, — відповів Петрик.<br>— Тоді ходімо гуляти!"]}], "remember": "Пряма мова в лапках з великої букви. А: «П». / «П», — а. / «П?» — а. Діалог: кожна репліка з нового рядка, тире, без лапок.", "cards": [{"f": "Пряма мова", "b": "Точно передані чужі слова; у лапках, з великої букви."}, {"f": "Слова автора", "b": "Вказують, кому належить пряма мова."}, {"f": "Схема А: «П».", "b": "Слова автора перед прямою мовою — двокрапка: Мама сказала: «Іди обідати»."}, {"f": "Схема «П», — а.", "b": "Пряма мова перед словами автора — кома і тире, слова автора з малої: «Іди», — сказала мама."}, {"f": "Схема «П?» — а.", "b": "Після ? або ! кому не ставимо: «Ти йдеш?» — спитала мама."}, {"f": "Діалог", "b": "Розмова двох чи кількох осіб. Репліка з нового рядка, перед нею тире, без лапок."}], "quiz": [{"t": "choice", "q": "Де правильно оформлено пряму мову?", "o": ["Мама сказала: «Іди обідати».", "Мама сказала «Іди обідати».", "Мама сказала, «іди обідати»."], "a": 0, "e": "Після слів автора — двокрапка, пряма мова в лапках з великої букви."}, {"t": "choice", "q": "Де правильно?", "o": ["«Іди обідати», — сказала мама.", "«Іди обідати», сказала мама.", "«Іди обідати». — Сказала мама."], "a": 0, "e": "Кома, тире, слова автора з малої букви."}, {"t": "choice", "q": "Де правильно?", "o": ["«Ти йдеш?», — спитала мама.", "«Ти йдеш?» — спитала мама."], "a": 1, "e": "Після знака питання кома не потрібна, тільки тире."}, {"t": "choice", "q": "Який знак після слів автора перед прямою мовою?", "o": ["Кома", "Двокрапка", "Тире"], "a": 1, "e": "А: «П»."}, {"t": "choice", "q": "Як оформлюють репліки в діалозі?", "o": ["У лапках в одному рядку", "З нового рядка, з тире, без лапок", "Без розділових знаків"], "a": 1, "e": "Кожна репліка — новий рядок, тире."}, {"t": "tf", "q": "Пряма мова завжди пишеться з великої букви.", "a": true, "e": "Так."}, {"t": "input", "q": "Як називається розмова двох або кількох осіб?", "a": ["діалог"], "e": "Діалог."}, {"t": "input", "q": "Як називаються слова одного учасника діалогу?", "a": ["репліка"], "e": "Репліка."}, {"t": "choice", "q": "Схема «П!» — а. підходить до речення…", "o": ["«Біжи!» — крикнув він.", "Він крикнув: «Біжи!»", "«Біжи», — крикнув він."], "a": 0, "e": "Пряма мова з окликом перед словами автора."}]}, {"id": "syn-punkt-pomylka-uzahal", "sec": "Синтаксис і пунктуація", "title": "Пунктуаційна помилка. Узагальнення синтаксису", "goal": "Ти знаєш, що таке пунктуаційна помилка, і повторюєш усі правила розділових знаків 5 класу.", "learn": [{"h": "Пунктуаційна помилка", "p": ["<span class='term'>Пунктуаційна помилка</span> — пропущений, зайвий або неправильний розділовий знак. Розділові знаки: <b>. ? ! , ; : — «» ( ) …</b>"]}, {"h": "Усі коми 5 класу", "p": ["1. Між однорідними членами (крім одиничних і, та, або).", "2. Перед а, але.", "3. При звертанні.", "4. При вставних словах.", "5. Між частинами складного речення.", "6. При прямій мові перед словами автора («П», — а)."]}, {"h": "Інші знаки", "p": ["<b>Двокрапка</b>: після узагальнювального слова; після слів автора перед прямою мовою.", "<b>Тире</b>: після однорідних перед узагальнювальним словом; перед словами автора; перед репліками діалогу; між підметом і присудком-іменником (<i>Київ — столиця</i>).", "<b>Лапки</b>: пряма мова, назви книжок і фільмів."]}, {"h": "Порядок синтаксичного розбору", "p": ["1) вид за метою висловлювання; 2) за емоційним забарвленням; 3) просте чи складне; 4) поширене чи непоширене; 5) граматична основа; 6) другорядні члени; 7) ускладнення (однорідні, звертання, вставні)."]}], "remember": "Кома: однорідні, а/але, звертання, вставні слова, складне речення, пряма мова. Двокрапка: узагальнювальне слово перед; А: «П». Тире: узагальнювальне слово після; «П», — а; діалог; Київ — столиця.", "cards": [{"f": "Пунктуаційна помилка", "b": "Пропущений, зайвий або неправильний розділовий знак."}, {"f": "Шість випадків коми у 5 класі", "b": "Однорідні; а/але; звертання; вставні слова; складне речення; пряма мова."}, {"f": "Коли двокрапка?", "b": "Після узагальнювального слова; після слів автора перед прямою мовою."}, {"f": "Коли тире?", "b": "Перед узагальнювальним словом після однорідних; перед словами автора; у діалозі; Київ — столиця."}, {"f": "Із чого починається розбір речення?", "b": "Вид за метою висловлювання → емоційне забарвлення → просте/складне → основа."}], "quiz": [{"t": "choice", "q": "Що таке пунктуаційна помилка?", "o": ["Неправильна вимова", "Неправильний розділовий знак", "Неправильне слово"], "a": 1, "e": "Пропущений, зайвий або не той знак."}, {"t": "choice", "q": "У якому реченні пунктуаційна помилка?", "o": ["Оленко, іди сюди.", "Я купив яблука, і груші.", "Він не прийшов, бо захворів."], "a": 1, "e": "Перед одиничним і між однорідними кома зайва."}, {"t": "choice", "q": "Який знак: «Київ (…) столиця України»?", "o": ["кома", "тире", "двокрапка"], "a": 1, "e": "Між підметом і присудком-іменником — тире."}, {"t": "choice", "q": "У якому реченні пропущено кому?", "o": ["Мабуть буде дощ.", "Мама сказала: «Спи».", "Іде дощ і дме вітер."], "a": 0, "e": "Вставне слово «мабуть» треба виділити комою."}, {"t": "choice", "q": "Чи є помилка: «Іде дощ і дме вітер»?", "o": ["Так, пропущена кома перед і", "Ні, все правильно"], "a": 0, "e": "Дві основи (дощ іде; вітер дме) — кома перед і потрібна."}, {"t": "choice", "q": "Скільки ком у реченні «Друже я знаю що ти зможеш»?", "o": ["Одна", "Дві", "Три"], "a": 1, "e": "Друже, я знаю, що ти зможеш — звертання і складне речення."}, {"t": "tf", "q": "Назви книжок і фільмів беремо в лапки.", "a": true, "e": "Так: «Гаррі Поттер», «Фарбований Лис»."}, {"t": "choice", "q": "З чого починається синтаксичний розбір речення?", "o": ["З підмета", "З виду за метою висловлювання", "З розділових знаків"], "a": 1, "e": "Спочатку вид речення, потім основа й члени."}, {"t": "choice", "q": "Який знак після узагальнювального слова перед однорідними?", "o": ["Двокрапка", "Тире", "Кома"], "a": 0, "e": "Дерева: яблуні, груші."}]}, {"id": "inf-vydy", "sec": "Інформація і текст", "title": "Інформація. Види й джерела інформації", "goal": "Ти знаєш види інформації (текстова, графічна, числова, звукова, мультимедійна) та її джерела.", "learn": [{"h": "Що таке інформація", "p": ["<span class='term'>Інформація</span> — відомості про світ, які ми отримуємо, зберігаємо й передаємо. Основні дії з інформацією: <b>отримати, зрозуміти, запам'ятати, передати, використати</b>."]}, {"h": "Види інформації за формою", "p": ["<b>Текстова</b> — слова, речення: книжки, статті, повідомлення.", "<b>Графічна</b> — малюнки, схеми, карти, фото, діаграми.", "<b>Числова</b> — цифри, таблиці, розклад, ціни.", "<b>Звукова</b> — мовлення, музика, подкасти, аудіокниги.", "<b>Мультимедійна</b> — поєднання кількох видів: відео, презентації, ігри."]}, {"h": "Джерела інформації", "p": ["<b>Люди</b> (учитель, батьки, експерти), <b>книжки й друковані видання</b> (енциклопедії, словники, газети), <b>інтернет</b> (сайти, відео), <b>власний досвід і спостереження</b>."], "note": "Джерела бувають <b>надійні</b> (енциклопедія, офіційний сайт, підручник) і <b>ненадійні</b> (анонімний допис, чутки). Перевіряй важливу інформацію в 2–3 джерелах."}], "remember": "Види інформації: текстова, графічна, числова, звукова, мультимедійна. Джерела: люди, книжки, інтернет, власний досвід. Надійне джерело — те, де відомо автора і яке можна перевірити.", "cards": [{"f": "Інформація", "b": "Відомості про світ, які отримуємо, зберігаємо й передаємо."}, {"f": "П'ять видів інформації за формою", "b": "Текстова, графічна, числова, звукова, мультимедійна."}, {"f": "Графічна інформація", "b": "Малюнки, схеми, карти, фото, діаграми."}, {"f": "Мультимедійна інформація", "b": "Поєднання кількох видів: відео, презентація."}, {"f": "Надійне джерело", "b": "Відомий автор, можна перевірити: енциклопедія, підручник, офіційний сайт."}], "quiz": [{"t": "choice", "q": "Карта міста — це інформація…", "o": ["текстова", "графічна", "звукова"], "a": 1, "e": "Карти, схеми, малюнки — графічна."}, {"t": "choice", "q": "Розклад уроків із номерами кабінетів — це переважно інформація…", "o": ["числова", "звукова", "мультимедійна"], "a": 0, "e": "Розклад, таблиці, цифри — числова."}, {"t": "choice", "q": "Навчальне відео — це інформація…", "o": ["текстова", "графічна", "мультимедійна"], "a": 2, "e": "Відео поєднує зображення, звук, текст — мультимедійна."}, {"t": "choice", "q": "Аудіокнига — це інформація…", "o": ["звукова", "текстова", "числова"], "a": 0, "e": "Звукова."}, {"t": "choice", "q": "Яке джерело найнадійніше?", "o": ["Анонімний коментар", "Енциклопедія", "Чутки на подвір'ї"], "a": 1, "e": "В енциклопедії відомі автори і перевірені факти."}, {"t": "tf", "q": "Важливу інформацію варто перевіряти в кількох джерелах.", "a": true, "e": "Так, це основа критичного ставлення до інформації."}, {"t": "input", "q": "Скільки основних видів інформації за формою? Напиши число.", "a": ["5", "п'ять"], "e": "П'ять: текстова, графічна, числова, звукова, мультимедійна."}, {"t": "choice", "q": "Що НЕ є джерелом інформації?", "o": ["Учитель", "Словник", "Порожній аркуш"], "a": 2, "e": "Джерело має містити відомості."}]}, {"id": "tekst-oznaky", "sec": "Інформація і текст", "title": "Текст. Тема, головна думка, мікротеми. Ключові слова", "goal": "Ти знаєш ознаки тексту, відрізняєш тему від головної думки та знаходиш мікротеми й ключові слова.", "learn": [{"h": "Ознаки тексту", "p": ["<span class='term'>Текст</span> — кілька речень, пов'язаних за змістом і граматично. Ознаки: <b>тема</b>, <b>головна думка</b>, <b>зв'язність</b> (речення йдуть по порядку), <b>завершеність</b>, часто є <b>заголовок</b>."]}, {"h": "Тема і головна думка", "p": ["<span class='term'>Тема</span> — про що текст. <span class='term'>Головна думка</span> — що автор хотів сказати, до чого закликає, чого навчає."], "ex": ["Текст про те, як хлопчик урятував кошеня. <b>Тема:</b> порятунок кошеняти. <b>Головна думка:</b> треба допомагати слабшим."], "note": "Заголовок може відображати тему («Кошеня») або головну думку («Не залишай у біді»)."}, {"h": "Мікротеми й абзаци", "p": ["<span class='term'>Мікротема</span> (підтема) — частина теми, окрема думка тексту. Зазвичай кожна мікротема — окремий <b>абзац</b>. Абзац починають з нового рядка з відступом."], "note": "План тексту — це перелік мікротем."}, {"h": "Ключові слова", "p": ["<span class='term'>Ключові слова</span> — найважливіші слова, без яких не зрозумієш, про що текст. За ними можна переказати текст або знайти його в інтернеті."]}], "remember": "Текст: тема (про що), головна думка (навіщо), зв'язність, завершеність, заголовок. Мікротема = абзац. Ключові слова — найважливіші слова тексту.", "cards": [{"f": "Текст", "b": "Кілька речень, пов'язаних за змістом і граматично; має тему й головну думку."}, {"f": "Тема тексту", "b": "Про що йдеться в тексті."}, {"f": "Головна думка", "b": "Що автор хотів сказати, чого навчити."}, {"f": "Мікротема", "b": "Частина теми; зазвичай окремий абзац."}, {"f": "Абзац", "b": "Частина тексту з нового рядка, з відступом; розкриває одну мікротему."}, {"f": "Ключові слова", "b": "Найважливіші слова, за якими зрозуміло зміст тексту."}], "quiz": [{"t": "choice", "q": "Тема тексту — це…", "o": ["про що текст", "чого навчає текст", "перше речення"], "a": 0, "e": "Тема — про що йдеться."}, {"t": "choice", "q": "Головна думка тексту — це…", "o": ["про що текст", "що автор хотів сказати, чого навчити", "кількість абзаців"], "a": 1, "e": "Головна думка — ідея, висновок."}, {"t": "choice", "q": "Текст про хлопчика, який урятував кошеня. «Треба допомагати слабшим» — це…", "o": ["тема", "головна думка", "мікротема"], "a": 1, "e": "Це висновок автора — головна думка."}, {"t": "choice", "q": "Із чим зазвичай збігається мікротема?", "o": ["З реченням", "З абзацом", "Із заголовком"], "a": 1, "e": "Кожна мікротема — окремий абзац."}, {"t": "tf", "q": "Речення, не пов'язані за змістом, — це текст.", "a": false, "e": "Ні, зв'язність — обов'язкова ознака тексту."}, {"t": "input", "q": "Як називаються найважливіші слова тексту, за якими зрозуміло його зміст?", "a": ["ключові", "ключові слова"], "e": "Ключові слова."}, {"t": "choice", "q": "План тексту — це перелік…", "o": ["ключових слів", "мікротем", "розділових знаків"], "a": 1, "e": "Пункти плану = мікротеми."}, {"t": "choice", "q": "Що НЕ є ознакою тексту?", "o": ["Тема", "Зв'язність", "Рима"], "a": 2, "e": "Рима — ознака вірша, а не будь-якого тексту."}]}, {"id": "tekst-typy", "sec": "Інформація і текст", "title": "Розповідь, опис, роздум. Будова текстів", "goal": "Ти розрізняєш три типи мовлення й знаєш будову кожного.", "learn": [{"h": "Розповідь", "p": ["<span class='term'>Розповідь</span> — про події, що відбуваються по черзі. Питання: <b>що сталося?</b> Багато дієслів."], "ex": ["Будова: <b>зачин</b> (початок) → <b>основна частина</b> (розвиток подій, кульмінація) → <b>кінцівка</b>."]}, {"h": "Опис", "p": ["<span class='term'>Опис</span> — про ознаки предмета, людини, тварини, місця. Питання: <b>який?</b> Багато прикметників. Описи бувають <b>художні</b> (образні, з почуттями) і <b>наукові</b> (точні, без емоцій)."], "ex": ["Будова: <b>загальне враження</b> → <b>окремі ознаки</b> (розмір, форма, колір, звички) → <b>висновок / ставлення</b>."], "note": "Опис тварини: зовнішній вигляд → поведінка, звички → чому вона тобі подобається."}, {"h": "Роздум", "p": ["<span class='term'>Роздум</span> — пояснює, чому щось так; доводить думку. Питання: <b>чому?</b> Є слова <i>бо, тому що, отже, по-перше</i>."], "ex": ["Будова: <b>теза</b> (думка, яку доводимо) → <b>докази</b> (аргументи, приклади) → <b>висновок</b>."]}, {"h": "Первинні й вторинні тексти", "p": ["<b>Первинний</b> — створений автором (оповідання, стаття). <b>Вторинний</b> — створений на основі первинного: переказ, план, конспект, анотація, відгук."]}], "remember": "Розповідь — що сталося? (зачин → події → кінцівка). Опис — який? (враження → ознаки → висновок). Роздум — чому? (теза → докази → висновок). Вторинний текст — переказ, план, відгук.", "cards": [{"f": "Розповідь", "b": "Про події по черзі. Що сталося? Зачин → основна частина → кінцівка."}, {"f": "Опис", "b": "Про ознаки. Який? Загальне враження → ознаки → висновок."}, {"f": "Роздум", "b": "Доводить думку. Чому? Теза → докази → висновок."}, {"f": "Теза", "b": "Думка, яку доводять у роздумі."}, {"f": "Художній і науковий опис", "b": "Художній — образний, з почуттями; науковий — точний, без емоцій."}, {"f": "Вторинний текст", "b": "Створений на основі іншого: переказ, план, конспект, відгук."}], "quiz": [{"t": "choice", "q": "«Вранці ми зібрали речі, сіли в автобус і поїхали до лісу» — це…", "o": ["розповідь", "опис", "роздум"], "a": 0, "e": "Події по черзі — розповідь."}, {"t": "choice", "q": "«Мій кіт рудий, з білими лапками й довгими вусами» — це…", "o": ["розповідь", "опис", "роздум"], "a": 1, "e": "Ознаки, питання «який?» — опис."}, {"t": "choice", "q": "«Читати корисно, бо це розвиває уяву й збагачує мову» — це…", "o": ["розповідь", "опис", "роздум"], "a": 2, "e": "Доводить думку, є «бо» — роздум."}, {"t": "choice", "q": "Із чого складається роздум?", "o": ["Зачин, події, кінцівка", "Теза, докази, висновок", "Враження, ознаки, висновок"], "a": 1, "e": "Теза → докази → висновок."}, {"t": "choice", "q": "На яке питання відповідає розповідь?", "o": ["Який?", "Що сталося?", "Чому?"], "a": 1, "e": "Розповідь — що сталося."}, {"t": "input", "q": "Як називається думка, яку доводять у роздумі?", "a": ["теза"], "e": "Теза."}, {"t": "choice", "q": "Який опис науковий?", "o": ["«Лисичка-сестричка хитро мружить оченята»", "«Лисиця — хижий ссавець родини собачих, довжина тіла 60–90 см»"], "a": 1, "e": "Точні факти без емоцій — науковий опис."}, {"t": "choice", "q": "Переказ оповідання — це текст…", "o": ["первинний", "вторинний"], "a": 1, "e": "Створений на основі іншого тексту — вторинний."}, {"t": "tf", "q": "В описі багато прикметників, у розповіді — дієслів.", "a": true, "e": "Так, це типова ознака."}, {"t": "choice", "q": "Як називається початок розповіді?", "o": ["Зачин", "Теза", "Кінцівка"], "a": 0, "e": "Зачин."}]}, {"id": "tekst-chytannia", "sec": "Інформація і текст", "title": "Види читання. Критичне читання", "goal": "Ти знаєш, чим відрізняються види читання, і вмієш читати критично.", "learn": [{"h": "Мета читання", "p": ["Читаємо, щоб: <b>отримати інформацію</b> (підручник, стаття), <b>отримати задоволення</b> (художня книжка), <b>навчитися щось робити</b> (інструкція)."]}, {"h": "Види читання", "p": ["<b>Ознайомлювальне</b> — швидко, щоб зрозуміти загальний зміст (гортаємо книжку).", "<b>Переглядове</b> — шукаємо потрібне: заголовки, ключові слова (пошук у словнику, розкладі).", "<b>Вивчальне</b> — повільно, уважно, з розумінням кожної деталі (підручник перед контрольною).", "<b>Критичне</b> — оцінюємо: чи правда, хто автор, навіщо написано."]}, {"h": "Критичне читання", "p": ["Питання, які варто ставити: Хто автор і чи можна йому довіряти? Це факт чи думка? Чи є докази? Чи не хочуть мною маніпулювати? Що кажуть інші джерела?"], "note": "<b>Факт</b> можна перевірити («Дніпро — найдовша річка України»). <b>Думка</b> — чиясь оцінка («Дніпро — найгарніша річка»)."}, {"h": "Читання для чуттєвого й естетичного досвіду", "p": ["Художню літературу читаємо, щоб пережити почуття, побачити красу мови, поставити себе на місце героя. Тут важливо уявляти, помічати образи, порівняння."]}], "remember": "Види читання: ознайомлювальне (загалом), переглядове (пошук), вивчальне (детально), критичне (оцінка). Факт можна перевірити, думка — чиясь оцінка.", "cards": [{"f": "Ознайомлювальне читання", "b": "Швидке, щоб зрозуміти загальний зміст."}, {"f": "Переглядове читання", "b": "Пошук потрібного за заголовками й ключовими словами."}, {"f": "Вивчальне читання", "b": "Повільне, уважне, з розумінням деталей."}, {"f": "Критичне читання", "b": "Оцінювання: хто автор, факт чи думка, чи є докази."}, {"f": "Факт і думка", "b": "Факт можна перевірити; думка — чиясь оцінка."}], "quiz": [{"t": "choice", "q": "Ти шукаєш слово в словнику. Який це вид читання?", "o": ["Вивчальне", "Переглядове", "Критичне"], "a": 1, "e": "Пошук потрібного — переглядове."}, {"t": "choice", "q": "Ти готуєшся до контрольної й читаєш параграф уважно. Який це вид читання?", "o": ["Ознайомлювальне", "Вивчальне", "Переглядове"], "a": 1, "e": "Детально, з розумінням — вивчальне."}, {"t": "choice", "q": "Ти гортаєш книжку в магазині, щоб зрозуміти, про що вона. Це читання…", "o": ["ознайомлювальне", "вивчальне", "критичне"], "a": 0, "e": "Загальне враження — ознайомлювальне."}, {"t": "choice", "q": "«Дніпро — найдовша річка України». Це…", "o": ["факт", "думка"], "a": 0, "e": "Можна перевірити — факт."}, {"t": "choice", "q": "«Дніпро — найгарніша річка у світі». Це…", "o": ["факт", "думка"], "a": 1, "e": "Оцінка — думка."}, {"t": "choice", "q": "Яке питання ставить критичний читач?", "o": ["Скільки сторінок у тексті?", "Хто автор і чи є докази?", "Який шрифт?"], "a": 1, "e": "Критичне читання — про довіру й докази."}, {"t": "tf", "q": "Усе, що написано в інтернеті, — правда.", "a": false, "e": "Ні. Інформацію треба перевіряти."}, {"t": "input", "q": "Як називається читання, під час якого оцінюють, чи можна довіряти тексту?", "a": ["критичне", "критичне читання"], "e": "Критичне читання."}]}, {"id": "zhanr-kompliment-prohannia", "sec": "Жанри мовлення і спілкування", "title": "Жанри мовлення. Комплімент, похвала, прохання, запрошення", "goal": "Ти знаєш, що таке жанр мовлення, і відрізняєш комплімент від лестощів, прохання від умовляння.", "learn": [{"h": "Жанр мовлення", "p": ["<span class='term'>Жанр мовлення</span> — усталений вид висловлювання з певною метою: комплімент, прохання, вибачення, подяка, запрошення, привітання, смс. Кожен жанр має свої слова-формули."]}, {"h": "Комплімент, похвала, лестощі", "p": ["<span class='term'>Комплімент</span> — приємні слова про зовнішність, уміння, вчинок: <i>У тебе чудова усмішка!</i>", "<span class='term'>Похвала</span> — схвалення зробленого: <i>Ти добре впорався із задачею.</i>", "<span class='term'>Лестощі</span> — нещире перебільшене вихваляння заради вигоди: <i>Ви найрозумніша вчителька у всесвіті, поставте 12!</i>"], "note": "Комплімент щирий і конкретний. Лестощі — нещирі й «з розрахунком». На комплімент відповідають: «Дякую, мені приємно»."}, {"h": "Прохання, умовляння, благання, пропозиція", "p": ["<span class='term'>Прохання</span> — ввічливо просимо: <i>Будь ласка, допоможи мені.</i>", "<span class='term'>Умовляння</span> — переконуємо погодитись: <i>Ну ходімо, буде цікаво!</i>", "<span class='term'>Благання</span> — дуже сильне, емоційне прохання: <i>Благаю, не йди!</i>", "<span class='term'>Пропозиція</span> — пропонуємо щось зробити разом: <i>Може, підемо в кіно?</i>"], "ex": ["Слова прохання: <i>будь ласка, будьте ласкаві, прошу, чи не могли б ви, якщо можна</i>."]}, {"h": "Запрошення", "p": ["Містить: <b>кого</b> запрошують, <b>куди</b> (подія), <b>коли</b> (дата, час), <b>де</b> (місце), ввічливу формулу: <i>Запрошую тебе на мій день народження 12 травня о 15:00 за адресою… Буду радий бачити!</i>"]}], "remember": "Жанр мовлення — вид висловлювання з певною метою. Комплімент — щирий і конкретний; лестощі — нещирі, заради вигоди. Прохання — «будь ласка»; благання — дуже емоційне. Запрошення: кого, куди, коли, де.", "cards": [{"f": "Жанр мовлення", "b": "Усталений вид висловлювання з певною метою: прохання, вибачення, подяка."}, {"f": "Комплімент", "b": "Щирі приємні слова про людину: У тебе чудова усмішка!"}, {"f": "Лестощі", "b": "Нещире перебільшене вихваляння заради вигоди."}, {"f": "Як відповісти на комплімент?", "b": "Дякую, мені приємно."}, {"f": "Чим благання відрізняється від прохання?", "b": "Благання — дуже сильне, емоційне прохання."}, {"f": "Що має бути в запрошенні?", "b": "Кого, куди, коли, де + ввічлива формула."}], "quiz": [{"t": "choice", "q": "«Ви найкращий учитель у Всесвіті, поставте мені 12!» — це…", "o": ["комплімент", "лестощі", "похвала"], "a": 1, "e": "Перебільшено й заради вигоди — лестощі."}, {"t": "choice", "q": "«Ти дуже гарно намалювала цей пейзаж» — це…", "o": ["комплімент", "лестощі", "благання"], "a": 0, "e": "Щиро й конкретно — комплімент."}, {"t": "choice", "q": "Як правильно відповісти на комплімент?", "o": ["Та ні, це неправда", "Дякую, мені приємно", "Мовчати"], "a": 1, "e": "Прийняти з подякою."}, {"t": "choice", "q": "«Благаю, не кажи мамі!» — це…", "o": ["прохання", "благання", "пропозиція"], "a": 1, "e": "Дуже емоційне прохання — благання."}, {"t": "choice", "q": "«Може, підемо разом у кіно?» — це…", "o": ["прохання", "умовляння", "пропозиція"], "a": 2, "e": "Пропонують спільну дію — пропозиція."}, {"t": "choice", "q": "Чого бракує в запрошенні «Приходь на мій день народження!»?", "o": ["Усе є", "Коли і де", "Слова «будь ласка»"], "a": 1, "e": "У запрошенні мають бути дата, час, місце."}, {"t": "tf", "q": "Слова «будь ласка», «чи не могли б ви» — формули прохання.", "a": true, "e": "Так, це ввічливі формули прохання."}, {"t": "input", "q": "Як називається усталений вид висловлювання з певною метою (комплімент, подяка, вибачення)?", "a": ["жанр мовлення", "жанр"], "e": "Жанр мовлення."}]}, {"id": "zhanr-zhoda-vybachennia-podiaka", "sec": "Жанри мовлення і спілкування", "title": "Згода і відмова. Вибачення. Подяка. Привітання. Смс", "goal": "Ти вмієш ввічливо погодитись і відмовити, вибачитись, подякувати, привітати й написати смс.", "learn": [{"h": "Згода і відмова", "p": ["<b>Згода</b>: <i>Так, звичайно. Із задоволенням. Гаразд, домовились.</i>", "<b>Ввічлива відмова</b> = подяка + причина + (за можливості) інший варіант: <i>Дякую за запрошення, але завтра не зможу — маю тренування. Може, у суботу?</i>"], "note": "Відмовляти можна, але без грубості: не «ні, не хочу», а «на жаль, не зможу»."}, {"h": "Вибачення", "p": ["Щире вибачення містить: <b>слово вибачення</b> (<i>вибач, пробач, перепрошую, мені шкода</i>), <b>що саме сталося</b>, <b>як виправити</b>: <i>Вибач, що зламав твою ручку. Я куплю нову.</i>"], "note": "Правильно: <i>вибач мені, пробач мені</i>. Неправильно: «вибачаюсь» (це ніби вибачаєш сам себе)."}, {"h": "Подяка", "p": ["<i>Дякую, щиро дякую, дуже вдячний, спасибі.</i> Добре сказати, за що саме: <i>Дякую тобі за допомогу з математикою!</i> Відповідь на подяку: <i>Будь ласка. Прошу. Нема за що.</i>"], "note": "Правильно: <i>дякую тобі</i> (кому?), а не «дякую тебе»."}, {"h": "Привітання", "p": ["Містить: звертання, привід (зі святом, з днем народження), побажання, підпис: <i>Люба бабусю! Вітаю тебе з днем народження! Бажаю здоров'я і радості. Твій онук Петрик.</i>"]}, {"h": "Смс-повідомлення", "p": ["Коротке, зрозуміле, з привітанням і підписом, якщо адресат тебе не знає. Без образ, із розділовими знаками. Не пиши вночі, не надсилай десять смс поспіль."]}], "remember": "Відмова = дякую + причина + інший варіант. Вибачення = вибач + що сталося + як виправити («вибач мені», не «вибачаюсь»). Подяка: «дякую тобі» (не «тебе»), відповідь — «будь ласка». Привітання: звертання, привід, побажання, підпис.", "cards": [{"f": "Ввічлива відмова", "b": "Подяка + причина + інший варіант: Дякую, але не зможу — маю тренування. Може, у суботу?"}, {"f": "Із чого складається щире вибачення?", "b": "Слово вибачення + що сталося + як виправити."}, {"f": "Вибачаюсь чи вибач мені?", "b": "Вибач мені / пробач / перепрошую. «Вибачаюсь» — неправильно."}, {"f": "Дякую тебе чи дякую тобі?", "b": "Дякую тобі (кому?)."}, {"f": "Як відповісти на подяку?", "b": "Будь ласка. Прошу. Нема за що."}, {"f": "Із чого складається привітання?", "b": "Звертання, привід, побажання, підпис."}], "quiz": [{"t": "choice", "q": "Яка відмова ввічлива?", "o": ["Ні, не хочу.", "Дякую, але не зможу — у мене тренування. Може, у неділю?", "Відчепись."], "a": 1, "e": "Подяка + причина + інший варіант."}, {"t": "choice", "q": "Як правильно?", "o": ["Вибачаюсь", "Вибач мені"], "a": 1, "e": "«Вибачаюсь» — ніби вибачаєш себе. Правильно — вибач мені, перепрошую."}, {"t": "choice", "q": "Як правильно?", "o": ["Дякую тебе", "Дякую тобі"], "a": 1, "e": "Дякую (кому?) тобі."}, {"t": "choice", "q": "Що варто додати до вибачення «Вибач»?", "o": ["Нічого", "За що вибачаєшся і як виправиш", "Смайлик"], "a": 1, "e": "Щире вибачення — конкретне, з обіцянкою виправити."}, {"t": "choice", "q": "Як відповісти на «Дякую!»?", "o": ["Будь ласка", "Дякую", "Так"], "a": 0, "e": "Будь ласка / прошу / нема за що."}, {"t": "choice", "q": "Чого не вистачає у привітанні «З днем народження!»?", "o": ["Усе є", "Звертання, побажання, підпису", "Дати"], "a": 1, "e": "Повне привітання: звертання, привід, побажання, підпис."}, {"t": "tf", "q": "У смс незнайомій людині треба привітатись і підписатись.", "a": true, "e": "Так, інакше адресат не зрозуміє, хто пише."}, {"t": "choice", "q": "Яка фраза — згода?", "o": ["Із задоволенням!", "На жаль, не зможу.", "Перепрошую."], "a": 0, "e": "Із задоволенням — згода."}]}, {"id": "spilk-tsili-sytuatsiia", "sec": "Жанри мовлення і спілкування", "title": "Спілкування. Ситуація, учасники, засоби", "goal": "Ти знаєш, з чого складається ситуація спілкування, і розрізняєш мовні та позамовні засоби.", "learn": [{"h": "Спілкування", "p": ["<span class='term'>Спілкування</span> — обмін інформацією, думками, почуттями між людьми. Цілі: повідомити, дізнатися, переконати, попросити, подякувати, підтримати, розважити."]}, {"h": "Ситуація спілкування", "p": ["Складається з: <b>адресант</b> (хто говорить), <b>адресат</b> (кому), <b>тема</b> (про що), <b>мета</b> (навіщо), <b>умови</b> (де, коли, офіційно чи неофіційно)."], "note": "Від умов залежить тон: із другом — «привіт», з директором — «добрий день»."}, {"h": "Живе й віртуальне спілкування", "p": ["<b>Живе</b> — обличчям до обличчя: бачимо міміку, чуємо голос. <b>Віртуальне</b> — через інтернет: чати, відеозв'язок, соцмережі. У віртуальному легко неправильно зрозуміти тон, тому важливі ввічливість і смайли доречно."]}, {"h": "Безпека віртуального спілкування", "p": ["Не повідомляй незнайомцям адресу, школу, номер телефону, паролі. Не надсилай свої фото незнайомим. Не зустрічайся з онлайн-знайомими без дорослих. Якщо хтось ображає чи лякає — розкажи батькам, заблокуй."]}, {"h": "Засоби спілкування", "p": ["<b>Мовні</b> — слова, речення, інтонація. <b>Позамовні</b> — міміка, жести, поза, погляд, відстань між співрозмовниками."]}], "remember": "Ситуація спілкування: адресант, адресат, тема, мета, умови. Мовні засоби — слова й інтонація; позамовні — міміка, жести, поза. В інтернеті не діли особисті дані з незнайомцями.", "cards": [{"f": "Спілкування", "b": "Обмін інформацією, думками, почуттями між людьми."}, {"f": "Адресант і адресат", "b": "Адресант — хто говорить/пише; адресат — кому."}, {"f": "Складники ситуації спілкування", "b": "Адресант, адресат, тема, мета, умови."}, {"f": "Мовні засоби спілкування", "b": "Слова, речення, інтонація."}, {"f": "Позамовні засоби спілкування", "b": "Міміка, жести, поза, погляд."}, {"f": "Правило безпеки в інтернеті", "b": "Не давай незнайомцям адресу, телефон, паролі, фото; про образи розкажи дорослим."}], "quiz": [{"t": "choice", "q": "Хто такий адресат?", "o": ["Той, хто говорить", "Той, кому говорять", "Тема розмови"], "a": 1, "e": "Адресат — кому адресоване повідомлення."}, {"t": "choice", "q": "Що НЕ входить до ситуації спілкування?", "o": ["Мета", "Умови", "Кількість букв"], "a": 2, "e": "Складники: адресант, адресат, тема, мета, умови."}, {"t": "choice", "q": "Жести й міміка — це засоби…", "o": ["мовні", "позамовні"], "a": 1, "e": "Позамовні (невербальні)."}, {"t": "choice", "q": "Інтонація — це засіб…", "o": ["мовний", "позамовний"], "a": 0, "e": "Інтонація належить до мовних засобів."}, {"t": "choice", "q": "Незнайомець у грі просить твою адресу. Що робити?", "o": ["Дати, він же друг у грі", "Не давати й розповісти батькам", "Дати тільки номер школи"], "a": 1, "e": "Особисті дані незнайомцям не повідомляють."}, {"t": "tf", "q": "У віртуальному спілкуванні тон повідомлення легко зрозуміти неправильно.", "a": true, "e": "Так, бо не видно обличчя й не чути голосу."}, {"t": "input", "q": "Як називається той, хто говорить або пише повідомлення?", "a": ["адресант"], "e": "Адресант."}, {"t": "choice", "q": "Чим живе спілкування відрізняється від віртуального?", "o": ["Нічим", "Бачимо міміку, чуємо голос співрозмовника", "Живе завжди офіційне"], "a": 1, "e": "Наживо є позамовні засоби."}]}, {"id": "spilk-harmoniine", "sec": "Жанри мовлення і спілкування", "title": "Гармонійне спілкування. Слухання. Запитання й відповіді", "goal": "Ти знаєш правила гарного співрозмовника, види слухання і як ставити запитання.", "learn": [{"h": "Ознаки гармонійного спілкування", "p": ["Обидва співрозмовники слухають одне одного, поважають, говорять по черзі, не перебивають, не ображають, досягають мети розмови."]}, {"h": "Правила гарного співрозмовника", "p": ["Слухай уважно, дивись на людину. Не перебивай. Говори ввічливо, спокійно. Став запитання, якщо не зрозумів. Не говори тільки про себе. Поважай іншу думку."]}, {"h": "Види слухання", "p": ["<b>Ознайомлювальне</b> — загальний зміст (оголошення).", "<b>Вивчальне</b> — детально, щоб запам'ятати (пояснення вчителя).", "<b>Критичне</b> — оцінюємо, чи погоджуємось (реклама, суперечка).", "<b>Активне (уважне)</b> слухання — показуємо, що слухаємо: кивок, «так-так», перепитування."], "note": "Головне в слуханні — не готувати свою відповідь, поки говорить інший, а справді чути."}, {"h": "Запитання і відповіді", "p": ["<b>Закриті</b> запитання — відповідь «так/ні»: <i>Ти читав цю книжку?</i> <b>Відкриті</b> — потребують розгорнутої відповіді: <i>Що тобі сподобалось у книжці?</i>", "Добра відповідь — по суті, повна, ввічлива. Якщо не знаєш — чесно скажи."]}], "remember": "Гарний співрозмовник слухає, не перебиває, поважає іншу думку. Види слухання: ознайомлювальне, вивчальне, критичне; активне — з кивками й перепитуванням. Закриті запитання — так/ні, відкриті — розгорнута відповідь.", "cards": [{"f": "Гармонійне спілкування", "b": "Обоє слухають, поважають, говорять по черзі, досягають мети."}, {"f": "Три правила гарного співрозмовника", "b": "Слухай уважно, не перебивай, поважай іншу думку."}, {"f": "Активне слухання", "b": "Показуємо, що слухаємо: кивок, «так-так», перепитування."}, {"f": "Види слухання", "b": "Ознайомлювальне, вивчальне, критичне."}, {"f": "Закрите запитання", "b": "Відповідь «так» або «ні»: Ти читав книжку?"}, {"f": "Відкрите запитання", "b": "Потребує розгорнутої відповіді: Що тобі сподобалось?"}], "quiz": [{"t": "choice", "q": "«Ти любиш читати?» — яке це запитання?", "o": ["Закрите", "Відкрите"], "a": 0, "e": "Відповідь так/ні — закрите."}, {"t": "choice", "q": "«Чому ти любиш читати?» — яке це запитання?", "o": ["Закрите", "Відкрите"], "a": 1, "e": "Потребує пояснення — відкрите."}, {"t": "choice", "q": "Що НЕ є правилом гарного співрозмовника?", "o": ["Не перебивати", "Дивитись на співрозмовника", "Говорити лише про себе"], "a": 2, "e": "Гарний співрозмовник цікавиться іншим."}, {"t": "choice", "q": "Ти слухаєш пояснення вчителя, щоб запам'ятати. Яке це слухання?", "o": ["Ознайомлювальне", "Вивчальне", "Критичне"], "a": 1, "e": "Детально, щоб запам'ятати — вивчальне."}, {"t": "choice", "q": "Ти слухаєш рекламу й думаєш, чи правда це. Яке слухання?", "o": ["Ознайомлювальне", "Вивчальне", "Критичне"], "a": 2, "e": "Оцінюєш — критичне."}, {"t": "choice", "q": "Що таке активне слухання?", "o": ["Голосно говорити", "Показувати, що слухаєш: кивати, перепитувати", "Записувати кожне слово"], "a": 1, "e": "Активне слухання — участь у розмові без перебивання."}, {"t": "tf", "q": "Якщо не знаєш відповіді, краще вигадати, ніж зізнатись.", "a": false, "e": "Ні, чесно сказати «не знаю» — ознака гарного співрозмовника."}, {"t": "choice", "q": "Ознака гармонійного спілкування:", "o": ["Один говорить, інший мовчить весь час", "Обидва слухають і поважають одне одного", "Хтось перемагає в суперечці"], "a": 1, "e": "Гармонія — взаємна повага й участь."}]}, {"id": "spilk-superechka-manipuliatsii", "sec": "Жанри мовлення і спілкування", "title": "Суперечка і сварка. Маніпуляції. Етикет", "goal": "Ти відрізняєш суперечку від сварки, впізнаєш маніпуляції та знаєш етикетні норми.", "learn": [{"h": "Су f": "Приклади маніпуляцій", "b": "«Якщо ти мені друг…», «усі так роблять», лестощі, залякування."}, {"f": "Як захиститись від маніпуляції?", "b": "Помітити, спокійно сказати «ні», порадитись із дорослими."}, {"f": "Мовний етикет", "b": "Правила ввічливості: вітатись, дякувати, вибачатись, «ви» до старших."}], "quiz": [{"t": "choice", "q": "«Я думаю, що ця книжка цікавіша, бо…» — це…", "o": ["суперечка", "сварка"], "a": 0, "e": "Аргумент про справу — суперечка."}, {"t": "choice", "q": "«Ти нічого не розумієш, дурню!» — це ознака…", "o": ["суперечки", "сварки"], "a": 1, "e": "Образа, перехід на особистість — сварка."}, {"t": "choice", "q": "«Якщо ти мені друг, то даси списати» — це…", "o": ["прохання", "маніпуляція", "комплімент"], "a": 1, "e": "Тиск на почуття провини — маніпуляція."}, {"t": "choice", "q": "Як краще відповісти на маніпуляцію?", "o": ["Виправдовуватись довго", "Спокійно сказати «ні»", "Кричати у відповідь"], "a": 1, "e": "Спокійне «ні» без виправдань."}, {"t": "choice", "q": "Як звертатись до незнайомого дорослого?", "o": ["На «ти»", "На «ви»", "Без звертання"], "a": 1, "e": "До старших і незнайомих — на «ви»."}, {"t": "tf", "q": "Суперечка перетворюється на сварку, коли переходять на особистості.", "a": true, "e": "Так."}, {"t": "choice", "q": "«Усі вже спробували, а ти боїшся?» — який це прийом?", "o": ["Аргумент", "Маніпуляція «усі так роблять»", "Комплімент"], "a": 1, "e": "Тиск через «усіх» — маніпуляція."}, {"t": "input", "q": "Як називаються правила ввічливого мовлення (вітатись, дякувати, вибачатись)?", "a": ["мовний етикет", "етикет", "етикетні норми"], "e": "Мовний етикет."}, {"t": "choice", "q": "Що робить мовлення переконливим?", "o": ["Гучний крик", "Чітка думка, аргументи, спокійний тон", "Багато слів"], "a": 1, "e": "Переконує зміст і впевнений спокійний тон."}]}]};

// ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/[^a-z0-9а-яіїєґ' \-]/gi,"").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
