<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Українська мова · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>

яне дерево з білою корою.", "<i>Мчати</i> — дуже швидко бігти або їхати."], "note": "У слова є ще граматичне значення (рід, число, час тощо) — його вивчає граматика, а не лексикологія."}, {"h": "Тлумачний словник", "p": ["<span class='term'>Тлумачний словник</span> пояснює (тлумачить) значення слів. Слова в ньому розміщені за алфавітом. Найбільший — «Словник української мови» в 11 томах, є й онлайн-словники."], "ex": ["Словникова стаття: <i>ГАЙ</i>, -ю, ч. Невеликий листяний ліс."]}], "remember": "Лексика — усі слова мови. Лексичне значення — зміст слова. Пояснює значення тлумачний словник, слова в ньому — за алфавітом.", "cards": [{"f": "Лексика", "b": "Усі слова мови."}, {"f": "Лексикологія", "b": "Розділ науки про мову, що вивчає слова, їх значення і вживання."}, {"f": "Лексичне значення слова", "b": "Те, що слово означає, його зміст. Гай — невеликий листяний ліс."}, {"f": "Тлумачний словник", "b": "Словник, що пояснює значення слів. Слова в ньому за алфавітом."}, {"f": "Як розміщені слова в тлумачному словнику?", "b": "За алфавітом."}], "quiz": [{"t": "choice", "q": "Що таке лексика?", "o": ["Правила написання слів", "Усі слова мови", "Звуки мови"], "a": 1, "e": "Лексика — словниковий склад мови, усі її слова."}, {"t": "choice", "q": "Який розділ науки про мову вивчає значення слів?", "o": ["Фонетика", "Синтаксис", "Лексикологія"], "a": 2, "e": "Лексикологія вивчає слова та їх значення. Фонетика — звуки, синтаксис — речення."}, {"t": "choice", "q": "Лексичне значення слова «сузір'я» — це…", "o": ["іменник середнього роду", "група зірок, що утворює фігуру", "слово з апострофом"], "a": 1, "e": "Лексичне значення — зміст слова. Рід і апостроф — це не про значення."}, {"t": "input", "q": "Як називається словник, що пояснює значення слів?", "a": ["тлумачний", "тлумачний словник"], "e": "Тлумачний словник."}, {"t": "choice", "q": "У якому порядку розміщені слова в тлумачному словнику?", "o": ["За довжиною", "За алфавітом", "За частинами мови"], "a": 1, "e": "За алфавітом — так слово легко знайти."}, {"t": "tf", "q": "Слово «дуб» і слово «дубовий» мають однакове лексичне значення.", "a": false, "e": "Ні: дуб — дерево, дубовий — зроблений з дуба або пов'язаний з дубом. Значення різні, хоч корінь спільний."}, {"t": "choice", "q": "Що НЕ належить до лексичного значення слова «стрибати»?", "o": ["Відштовхуватися і підніматися вгору", "Дієслово недоконаного виду", "Переміщатися стрибками"], "a": 1, "e": "«Дієслово недоконаного виду» — це граматична характеристика, а не значення."}, {"t": "tf", "q": "Найбільший тлумачний словник української мови має 11 томів.", "a": true, "e": "Так, «Словник української мови» в 11 томах (1970–1980)."}]}, {"id": "leks-bahatoznachni", "sec": "Лексикологія", "title": "Однозначні й багатозначні слова. Пряме і переносне значення", "goal": "Ти відрізняєш однозначні слова від багатозначних і знаходиш переносне значення в реченні.", "learn": [{"h": "Однозначні й багатозначні", "p": ["<span class='term'>Однозначні</span> слова мають одне лексичне значення. <span class='term'>Багатозначні</span> — кілька значень, пов'язаних між собою."], "ex": ["Однозначні: <i>олівець</i>, <i>Дніпро</i>, <i>суфікс</i>.", "Багатозначне: <i>ручка</i> — для письма, дверей, дитини, крісла."], "note": "У тлумачному словнику значення багатозначного слова нумерують: 1, 2, 3…"}, {"h": "Пряме значення", "p": ["<span class='term'>Пряме значення</span> — основне, звичайне значення слова."], "ex": ["<i>золотий</i> перстень — зроблений із золота", "<i>гострий</i> ніж — добре нагострений"]}, {"h": "Переносне значення", "p": ["<span class='term'>Переносне значення</span> виникає, коли назву одного предмета переносять на інший через схожість (за кольором, формою, дією, враженням)."], "ex": ["<i>золоте</i> волосся — кольору золота", "<i>золоті</i> руки — вмілі", "<i>гострий</i> розум — кмітливий"], "note": "Переносне значення робить мову образною: у віршах «сонце сміється», «вітер плаче»."}], "remember": "Однозначне слово — одне значення, багатозначне — кілька пов'язаних. Пряме значення — звичайне; переносне — перенесене на інший предмет через схожість.", "cards": [{"f": "Однозначне слово", "b": "Слово з одним лексичним значенням. Олівець, суфікс."}, {"f": "Багатозначне слово", "b": "Слово з кількома пов'язаними значеннями. Ручка, ніжка, корінь."}, {"f": "Пряме значення", "b": "Основне, звичайне значення слова. Гострий ніж."}, {"f": "Переносне значення", "b": "Назву перенесено на інший предмет через схожість. Гострий розум."}, {"f": "Як у словнику показують багатозначність?", "b": "Значення нумерують: 1, 2, 3…"}], "quiz": [{"t": "choice", "q": "Яке слово багатозначне?", "o": ["Корінь", "Олівець", "Суфікс"], "a": 0, "e": "Корінь — рослини, зуба, слова, проблеми. Олівець і суфікс мають одне значення."}, {"t": "choice", "q": "У якому словосполученні слово вжито в переносному значенні?", "o": ["Солодкий мед", "Солодкий сон", "Солодка цукерка"], "a": 1, "e": "Сон не має смаку — «солодкий» тут означає приємний."}, {"t": "tf", "q": "«Кам'яне серце» — це пряме значення слова «кам'яне».", "a": false, "e": "Серце не з каменю; «кам'яне» — байдуже, жорстоке. Значення переносне."}, {"t": "input", "q": "У виразі «залізна воля» слово «залізна» вжито в … значенні (пряме чи переносне?).", "a": ["переносному", "переносне", "переносне значення"], "e": "Воля не із заліза — значення переносне: міцна, непохитна."}, {"t": "choice", "q": "Значення багатозначного слова…", "o": ["ніяк не пов'язані між собою", "пов'язані між собою схожістю", "завжди протилежні"], "a": 1, "e": "Саме пов'язаність значень відрізняє багатозначне слово від омонімів."}, {"t": "choice", "q": "«Ніжка» дитини і «ніжка» стола — це…", "o": ["два різні слова", "одне багатозначне слово", "антоніми"], "a": 1, "e": "Обидві ніжки — опора, значення пов'язані. Одне багатозначне слово."}, {"t": "choice", "q": "У якому реченні «іде» вжито в прямому значенні?", "o": ["Іде дощ.", "Іде урок.", "Хлопчик іде до школи."], "a": 2, "e": "Пряме значення «іде» — рухається ногами. Дощ і урок «ідуть» переносно."}, {"t": "tf", "q": "Однозначних слів у мові більше, ніж багатозначних.", "a": false, "e": "Більшість уживаних слів — багатозначні. Однозначні — переважно терміни й назви."}, {"t": "choice", "q": "Що робить переносне значення в художньому тексті?", "o": ["Ускладнює текст помилками", "Робить мову образною, виразною", "Замінює розділові знаки"], "a": 1, "e": "Переносні значення — основа образності: «сонце сміється», «ліс шумить»."}]}, {"id": "leks-syn-ant-om", "sec": "Лексикологія", "title": "Синоніми, антоніми, омоніми", "goal": "Ти знаєш, чим відрізняються ці три групи слів, і не плутаєш омоніми з багатозначними словами.", "learn": [{"h": "Синоніми", "p": ["<span class='term'>Синоніми</span> — слова, різні за звучанням, але близькі або однакові за значенням. Група синонімів — <span class='term'>синонімічний ряд</span>."], "ex": ["<i>сміливий</i> — <i>хоробрий</i> — <i>відважний</i>", "<i>іти</i> — <i>крокувати</i> — <i>брести</i> — <i>чимчикувати</i>"], "note": "Синоніми роблять мову багатшою: не треба повторювати одне слово в кожному реченні."}, {"h": "Антоніми", "p": ["<span class='term'>Антоніми</span> — слова з протилежним значенням."], "ex": ["<i>день</i> — <i>ніч</i>", "<i>високий</i> — <i>низький</i>", "<i>сміятися</i> — <i>плакати</i>"], "note": "Антоніми завжди належать до однієї частини мови."}, {"h": "Омоніми", "p": ["<span class='term'>Омоніми</span> — слова, що звучать і пишуться однаково, але мають зовсім різні, не пов'язані значення."], "ex": ["<i>коса</i> (дівоча) — <i>коса</i> (для трави) — <i>коса</i> (піщана)", "<i>ключ</i> (від дверей) — <i>ключ</i> (журавлиний)"], "note": "Не плутай з багатозначним словом: там значення пов'язані (<i>ніжка</i> дитини і стола), в омонімів зв'язку немає."}], "remember": "Синоніми — <b>схожі</b> за значенням. Антоніми — <b>протилежні</b>. Омоніми — <b>однакові за звучанням</b>, різні за значенням.", "cards": [{"f": "Синоніми", "b": "Слова, різні за звучанням, але близькі за значенням. Сміливий — хоробрий."}, {"f": "Антоніми", "b": "Слова з протилежним значенням. День — ніч."}, {"f": "Омоніми", "b": "Слова, що звучать однаково, але мають різні, не пов'язані значення. Коса — коса."}, {"f": "Синонімічний ряд", "b": "Група синонімів. Головне слово ряду — найзагальніше: іти — крокувати, брести."}, {"f": "Чим омонім відрізняється від багатозначного слова?", "b": "У багатозначного значення пов'язані між собою, в омонімів — ні."}], "quiz": [{"t": "choice", "q": "Які слова називають синонімами?", "o": ["Слова з протилежним значенням", "Слова, близькі за значенням", "Слова, однакові за звучанням"], "a": 1, "e": "Синоніми близькі за значенням: веселий — радісний."}, {"t": "choice", "q": "Знайди пару антонімів.", "o": ["сміливий — хоробрий", "світло — темрява", "коса — коса"], "a": 1, "e": "Світло і темрява — протилежні за значенням."}, {"t": "choice", "q": "Слово «ключ» (від дверей) і «ключ» (журавлиний) — це…", "o": ["синоніми", "антоніми", "омоніми"], "a": 2, "e": "Пишуться й звучать однаково, а значення різні й не пов'язані — омоніми."}, {"t": "tf", "q": "Антоніми можуть бути різними частинами мови, наприклад «швидкий — повільно».", "a": false, "e": "Ні. Антоніми завжди однієї частини мови: швидкий — повільний, швидко — повільно."}, {"t": "input", "q": "Добери антонім до слова «холодний».", "a": ["теплий", "гарячий"], "e": "Холодний — теплий (або гарячий)."}, {"t": "input", "q": "Добери синонім до слова «великий».", "a": ["величезний", "здоровенний", "чималий", "гігантський", "велетенський", "здоровий"], "e": "Наприклад: величезний, чималий, велетенський."}, {"t": "choice", "q": "Який рядок складається лише з синонімів?", "o": ["радісний, веселий, щасливий", "радісний, сумний, веселий", "радісний, радість, радіти"], "a": 0, "e": "У другому рядку є антонім «сумний», у третьому — різні частини мови одного кореня."}, {"t": "tf", "q": "Синоніми допомагають не повторювати те саме слово в тексті.", "a": true, "e": "Так, саме для цього ними й користуються."}, {"t": "input", "q": "Як називається група синонімів, наприклад «іти, крокувати, брести»?", "a": ["синонімічний ряд", "ряд синонімів"], "e": "Синонімічний ряд."}, {"t": "choice", "q": "«Лисичка» (тварина) і «лисичка» (гриб) — це…", "o": ["омоніми", "антоніми", "багатозначне слово"], "a": 0, "e": "Значення не пов'язані — омоніми."}]}, {"id": "leks-paronimy", "sec": "Лексикологія", "title": "Пароніми", "goal": "Ти знаєш, що таке пароніми, і не плутаєш такі слова, як «уява» і «уявлення».", "learn": [{"h": "Що таке пароніми", "p": ["<span class='term'>Пароніми</span> — слова, схожі за звучанням, але різні за значенням. Через схожість їх часто плутають."], "ex": ["<i>адрес</i> (вітальний) — <i>адреса</i> (де живеш)", "<i>уява</i> (здатність фантазувати) — <i>уявлення</i> (знання про щось)", "<i>ефектний</i> (вражає) — <i>ефективний</i> (дає результат)", "<i>дружний</i> (згуртований) — <i>дружній</i> (доброзичливий)"]}, {"h": "Як не помилитись", "p": ["Якщо сумніваєшся — заглянь у тлумачний словник або словник паронімів. Помилка з паронімом — лексична помилка."], "note": "<i>Музикальний</i> слух (здібності до музики), але <i>музичний</i> інструмент (для музики)."}], "remember": "Пароніми — схожі за звучанням, різні за значенням: адрес — адреса, уява — уявлення, ефектний — ефективний.", "cards": [{"f": "Пароніми", "b": "Слова, схожі за звучанням, але різні за значенням. Адрес — адреса."}, {"f": "Адрес чи адреса?", "b": "Адрес — вітальний текст. Адреса — місце проживання."}, {"f": "Уява чи уявлення?", "b": "Уява — здатність фантазувати. Уявлення — знання, розуміння чогось."}, {"f": "Ефектний чи ефективний?", "b": "Ефектний — справляє враження. Ефективний — дає результат."}, {"f": "Дружний чи дружній?", "b": "Дружний — згуртований (клас). Дружній — доброзичливий (тон, порада)."}], "quiz": [{"t": "choice", "q": "Пароніми — це слова…", "o": ["однакові за звучанням і різні за значенням", "схожі за звучанням і різні за значенням", "близькі за значенням"], "a": 1, "e": "Пароніми схожі, але не однакові за звучанням. Однакові — омоніми, близькі за значенням — синоніми."}, {"t": "choice", "q": "Обери правильне: «Напиши свою … на конверті».", "o": ["адрес", "адреса", "адресу"], "a": 2, "e": "Адреса — місце проживання; у знахідному відмінку — адресу. Адрес — це вітальний текст."}, {"t": "choice", "q": "«У дитини багата …» — яке слово?", "o": ["уява", "уявлення"], "a": 0, "e": "Уява — здатність фантазувати."}, {"t": "choice", "q": "Ліки, які добре допомагають, — які?", "o": ["ефектні", "ефективні"], "a": 1, "e": "Ефективні — дають результат. Ефектні — справляють враження."}, {"t": "tf", "q": "Пароніми — це те саме, що омоніми.", "a": false, "e": "Ні. Омоніми звучать однаково, пароніми — лише схоже."}, {"t": "choice", "q": "«Наш клас дуже …» — згуртований.", "o": ["дружний", "дружній"], "a": 0, "e": "Дружний — згуртований, єдиний. Дружній — доброзичливий."}, {"t": "input", "q": "Як називається помилка, коли слово вжито не в тому значенні (наприклад, сплутано пароніми)?", "a": ["лексична", "лексична помилка"], "e": "Це лексична помилка."}, {"t": "choice", "q": "«… інструмент» — обери слово.", "o": ["музикальний", "музичний"], "a": 1, "e": "Музичний — призначений для музики. Музикальний — має здібності до музики (слух, дитина)."}]}, {"id": "leks-zapozycheni", "sec": "Лексикологія", "title": "Власне українські й запозичені слова", "goal": "Ти розрізняєш власне українські слова і слова іншомовного походження та знаєш ознаки запозичених слів.", "learn": [{"h": "Дві групи за походженням", "p": ["<span class='term'>Власне українські</span> слова виникли в самій українській мові: <i>мрія, лелека, вареники, зозуля, віхола</i>.", "<span class='term'>Запозичені</span> (іншомовного походження) прийшли з інших мов: <i>комп'ютер</i> (англ.), <i>театр</i> (грец.), <i>футбол</i> (англ.), <i>парасолька</i> (італ.)."]}, {"h": "Ознаки запозичених слів", "p": ["Часто починаються на <b>а, е, і</b> (<i>апельсин, екран, ідея</i>); мають збіг голосних (<i>радіо, поет</i>); звук <b>ф</b> (<i>фабрика, фото</i>); не змінюються за відмінками (<i>кіно, меню, таксі</i>)."], "note": "Запозичення — нормально, коли для поняття немає свого слова. Але замість «окей» краще «добре», замість «фейл» — «невдача»."}, {"h": "Словник іншомовних слів", "p": ["Пояснює значення і походження запозичених слів."]}], "remember": "Власне українські — виникли в українській мові (лелека, мрія). Запозичені — прийшли з інших мов; ознаки: початкові а, е, і; збіг голосних; звук ф; незмінність (кіно, таксі).", "cards": [{"f": "Власне українські слова", "b": "Виникли в українській мові: лелека, мрія, вареники, віхола."}, {"f": "Запозичені слова", "b": "Прийшли з інших мов: комп'ютер, театр, футбол."}, {"f": "Ознаки запозичених слів", "b": "Початкові а, е, і; збіг голосних (радіо); звук ф (фото); незмінність (кіно, таксі)."}, {"f": "Словник іншомовних слів", "b": "Пояснює значення і походження запозичених слів."}], "quiz": [{"t": "choice", "q": "Яке слово власне українське?", "o": ["Лелека", "Театр", "Футбол"], "a": 0, "e": "Лелека — власне українське. Театр — з грецької, футбол — з англійської."}, {"t": "choice", "q": "Яке слово запозичене?", "o": ["Вареники", "Мрія", "Апельсин"], "a": 2, "e": "Апельсин — запозичене (через німецьку). Вареники і мрія — власне українські."}, {"t": "tf", "q": "Слова, що починаються на «а» (апетит, аеропорт), — здебільшого запозичені.", "a": true, "e": "Так, початкове «а» — типова ознака іншомовного слова."}, {"t": "choice", "q": "Яка ознака вказує, що «таксі» — запозичене слово?", "o": ["Має два склади", "Не змінюється за відмінками", "Означає транспорт"], "a": 1, "e": "Незмінюваність (таксі, кіно, меню) — ознака запозичення."}, {"t": "choice", "q": "Звук [ф] у слові зазвичай свідчить, що слово…", "o": ["власне українське", "запозичене", "застаріле"], "a": 1, "e": "Звук [ф] прийшов до нас із запозиченнями: фото, фабрика, шафа."}, {"t": "input", "q": "Як називається словник, що пояснює значення й походження запозичених слів?", "a": ["словник іншомовних слів", "іншомовних слів"], "e": "Словник іншомовних слів."}, {"t": "choice", "q": "Яке слово краще вжити замість запозиченого «окей»?", "o": ["Гаразд", "Ок", "Йес"], "a": 0, "e": "Якщо є своє слово — краще воно: гаразд, добре."}, {"t": "choice", "q": "Збіг голосних (радіо, поет) — ознака…", "o": ["власне українського слова", "запозиченого слова"], "a": 1, "e": "У власне українських словах два голосні поспіль трапляються рідко."}]}, {"id": "leks-inshomovni-pravopys", "sec": "Лексикологія", "title": "Правопис слів іншомовного походження", "goal": "Ти знаєш чотири правила: апостроф, м'який знак, подвоєння та букви и/і в іншомовних словах.", "learn": [{"h": "Апостроф", "p": ["Ставимо після <b>б, п, в, м, ф, ж, ч, ш, р</b> перед <b>я, ю, є, ї</b>: <i>п'єдестал, комп'ютер, бар'єр, інтерв'ю, кар'єра</i>.", "Не ставимо, коли я, ю, є пом'якшують приголосний: <i>бюро, пюре, гравюра, ревю</i>."]}, {"h": "М'який знак", "p": ["Пишемо після <b>д, т, з, с, л, н</b> перед <b>я, ю, є, ї, йо</b>: <i>ательє, мільйон, павільйон, конферансьє, Ньютон</i>."]}, {"h": "Подвоєння", "p": ["У <b>загальних назвах</b> приголосні НЕ подвоюються: <i>клас, група, сума, колектив, хобі, шосе</i>.", "Винятки: <i>ванна, манна, тонна, вілла, нетто, брутто, бонна, мадонна, панна</i>.", "У <b>власних назвах</b> подвоєння зберігається: <i>Голландія, Марокко, Джонні, Шиллер</i>.", "На межі префікса й кореня: <i>ім<b>м</b>іграція, ір<b>р</b>аціональний</i>."]}, {"h": "Букви и та і — «правило дев'ятки»", "p": ["Пишемо <b>и</b> після <b>д, т, з, с, ц, ж, ч, ш, р</b> перед приголосним: <i>дискета, титул, система, цирк, режим, шифр, ритм</i>.", "В інших випадках — <b>і</b>: <i>кіно, мітинг, бізнес, вікінг</i>; а також перед голосним і в кінці слова: <i>радіо, таксі</i>."], "note": "Дев'ятку запам'ятай фразою: <b>Де Ти З'їСи Цю ЧаШу ЖиРу</b>."}], "remember": "Апостроф після б, п, в, м, ф, ж, ч, ш, р (комп'ютер). М'який знак після д, т, з, с, л, н (мільйон). У загальних назвах подвоєння немає (клас), крім винятків (ванна, тонна). «Дев'ятка» + приголосний → и (диск), інакше — і (кіно).", "cards": [{"f": "Апостроф в іншомовних словах", "b": "Після б, п, в, м, ф, ж, ч, ш, р перед я, ю, є, ї: комп'ютер, п'єдестал. Але: бюро, пюре."}, {"f": "М'який знак в іншомовних словах", "b": "Після д, т, з, с, л, н перед я, ю, є, ї, йо: мільйон, ательє."}, {"f": "Подвоєння в загальних назвах", "b": "Немає: клас, група, сума. Винятки: ванна, манна, тонна, вілла, нетто, брутто."}, {"f": "Подвоєння у власних назвах", "b": "Зберігається: Голландія, Марокко, Джонні."}, {"f": "Правило дев'ятки", "b": "Після д, т, з, с, ц, ж, ч, ш, р перед приголосним пишемо и: диск, ритм. Де Ти З'їСи Цю ЧаШу ЖиРу."}, {"f": "Коли в іншомовних словах пишемо і?", "b": "Після інших букв (кіно, бізнес), перед голосним (радіо) і в кінці слова (таксі)."}], "quiz": [{"t": "choice", "q": "У якому слові треба апостроф?", "o": ["бюро", "комп..ютер", "пюре"], "a": 1, "e": "Комп'ютер: п + ю. У «бюро» і «пюре» ю пом'якшує приголосний — апострофа немає."}, {"t": "choice", "q": "У якому слові пишемо м'який знак?", "o": ["міл..йон", "бар..єр", "п..єдестал"], "a": 0, "e": "Мільйон: після л перед йо — м'який знак. Бар'єр і п'єдестал — з апострофом."}, {"t": "choice", "q": "Як правильно?", "o": ["клас", "класс"], "a": 0, "e": "У загальних назвах іншомовного походження подвоєння немає: клас, група, сума."}, {"t": "choice", "q": "У якому слові подвоєння зберігається?", "o": ["гру..па", "то..на", "ко..лектив"], "a": 1, "e": "Тонна — виняток. Група і колектив — без подвоєння."}, {"t": "choice", "q": "Обери правильний варіант.", "o": ["Голандія", "Голландія"], "a": 1, "e": "У власних назвах подвоєння зберігається: Голландія, Марокко."}, {"t": "choice", "q": "Яку букву пишемо в слові «д..ск»?", "o": ["и", "і"], "a": 0, "e": "Д — із дев'ятки, після нього приголосний → и: диск."}, {"t": "choice", "q": "Яку букву пишемо в слові «к..но»?", "o": ["и", "і"], "a": 1, "e": "К не входить у дев'ятку → і: кіно."}, {"t": "input", "q": "Встав пропущену букву: «рад..о».", "a": ["і", "радіо"], "e": "Перед голосним пишемо і: радіо."}, {"t": "tf", "q": "Слово «ванна» пишеться з подвоєнням.", "a": true, "e": "Так, ванна — один із винятків."}, {"t": "input", "q": "Встав пропущену букву: «р..тм».", "a": ["и", "ритм"], "e": "Р — із дев'ятки, далі приголосний → ритм."}]}, {"id": "leks-aktyvna-pasyvna", "sec": "Лексикологія", "title": "Активна й пасивна лексика. Застарілі слова, неологізми", "goal": "Ти знаєш, що таке активна й пасивна лексика, відрізняєш історизми від архаїзмів і впізнаєш неологізми.", "learn": [{"h": "Активна лексика", "p": ["<span class='term'>Активна лексика</span> — слова, які всі знають і постійно вживають: <i>хліб, школа, іти, добрий</i>."]}, {"h": "Пасивна лексика", "p": ["<span class='term'>Пасивна лексика</span> — слова, що вживаються рідко: застарілі й нові."], "ex": ["<span class='term'>Історизми</span> — застарілі слова, бо зникли предмети: <i>кольчуга, князь, кріпак, свита</i>.", "<span class='term'>Архаїзми</span> — застарілі слова, які замінили іншими: <i>перст</i> → палець, <i>чоло</i> → лоб, <i>ланіти</i> → щоки, <i>град</i> → місто.", "<span class='term'>Неологізми</span> — нові слова: <i>дрон, смартфон, стрім, застосунок</i>."], "note": "Історизм замінити нічим — предмета вже немає. В архаїзма є сучасний синонім."}, {"h": "Письменницькі новотвори", "p": ["Слова, які створюють автори для образності: <i>яблуневоцвітно, сонцебризний, зорепад</i> (у Тичини, Малишка). Вони не завжди стають загальновживаними."]}], "remember": "Активна лексика — вживається постійно. Пасивна — рідко: історизми (предмет зник: кольчуга), архаїзми (замінені: перст → палець), неологізми (нові: дрон).", "cards": [{"f": "Активна лексика", "b": "Слова, які всі знають і постійно вживають: хліб, школа."}, {"f": "Пасивна лексика", "b": "Рідковживані слова: застарілі та нові."}, {"f": "Історизми", "b": "Застарілі слова, бо зникли предмети чи явища: кольчуга, кріпак, князь."}, {"f": "Архаїзми", "b": "Застарілі слова, замінені сучасними: перст — палець, чоло — лоб."}, {"f": "Неологізми", "b": "Нові слова: дрон, стрім, застосунок."}, {"f": "Чим історизм відрізняється від архаїзма?", "b": "Історизму немає чим замінити (зник предмет), в архаїзма є сучасний синонім."}], "quiz": [{"t": "choice", "q": "Яке слово належить до активної лексики?", "o": ["Кольчуга", "Дорога", "Ланіти"], "a": 1, "e": "Дорога — вживається постійно. Кольчуга — історизм, ланіти — архаїзм."}, {"t": "choice", "q": "«Перст», «чоло», «ланіти» — це…", "o": ["історизми", "архаїзми", "неологізми"], "a": 1, "e": "Це архаїзми: їх замінили слова палець, лоб, щоки."}, {"t": "choice", "q": "«Кріпак», «князь», «кольчуга» — це…", "o": ["історизми", "архаїзми", "неологізми"], "a": 0, "e": "Історизми: зникли самі явища й предмети."}, {"t": "choice", "q": "Яке слово — неологізм?", "o": ["Свита", "Смартфон", "Град"], "a": 1, "e": "Смартфон — нове слово. Свита — історизм, град (місто) — архаїзм."}, {"t": "tf", "q": "Неологізми належать до пасивної лексики.", "a": true, "e": "Так, поки слово нове і вживається рідко — воно в пасивній лексиці."}, {"t": "input", "q": "Як називаються застарілі слова, замінені сучасними синонімами (перст → палець)?", "a": ["архаїзми", "архаїзм"], "e": "Архаїзми."}, {"t": "input", "q": "Як називаються нові слова, що з'явилися в мові недавно?", "a": ["неологізми", "неологізм"], "e": "Неологізми."}, {"t": "choice", "q": "«Яблуневоцвітно», «сонцебризний» — це…", "o": ["історизми", "письменницькі новотвори", "діалектизми"], "a": 1, "e": "Це авторські неологізми — письменницькі новотвори."}, {"t": "choice", "q": "Чому слово «кріпак» — історизм, а не архаїзм?", "o": ["Бо воно довге", "Бо зникло саме явище, замінити нічим", "Бо його вигадав письменник"], "a": 1, "e": "Кріпацтва немає, отже й слову немає сучасного синоніма."}]}, {"id": "leks-vzhyvannia", "sec": "Лексикологія", "title": "Загальновживані слова. Діалектизми, професійні слова, терміни", "goal": "Ти розрізняєш загальновживані слова і слова обмеженого вживання: діалектні, професійні, терміни.", "learn": [{"h": "Загальновживані слова", "p": ["<span class='term'>Загальновживані</span> — слова, зрозумілі всім, хто говорить українською: <i>вода, читати, зелений, швидко</i>."]}, {"h": "Слова обмеженого вживання", "p": ["<span class='term'>Діалектизми</span> — слова, поширені лише в певній місцевості: <i>когут</i> (півень), <i>файно</i> (гарно), <i>бараболя</i> (картопля), <i>маржина</i> (худоба).", "<span class='term'>Професійні слова</span> — уживають люди певної професії: <i>скальпель</i> (лікарі), <i>вітрило, штурвал</i> (моряки), <i>рубанок</i> (столяри).", "<span class='term'>Терміни</span> — слова з точним значенням у науці: <i>іменник, підмет</i> (мовознавство), <i>дріб, куб</i> (математика), <i>атом</i> (фізика)."], "note": "Термін має одне точне значення й не буває образним."}], "remember": "Загальновживані — зрозумілі всім. Обмеженого вживання: діалектизми (місцевість: когут, файно), професійні слова (професія: скальпель), терміни (наука: підмет, дріб).", "cards": [{"f": "Загальновживані слова", "b": "Зрозумілі всім носіям мови: вода, читати."}, {"f": "Діалектизми", "b": "Слова певної місцевості: когут (півень), файно (гарно), бараболя (картопля)."}, {"f": "Професійні слова", "b": "Уживають люди певної професії: скальпель, штурвал, рубанок."}, {"f": "Терміни", "b": "Слова з точним значенням у науці: підмет, дріб, атом."}, {"f": "Що означає «файно»?", "b": "Гарно, добре (діалектизм, захід України)."}], "quiz": [{"t": "choice", "q": "Яке слово загальновживане?", "o": ["Бараболя", "Картопля", "Скальпель"], "a": 1, "e": "Картопля зрозуміла всім. Бараболя — діалектизм, скальпель — професійне слово."}, {"t": "choice", "q": "«Когут», «файно», «маржина» — це…", "o": ["терміни", "діалектизми", "неологізми"], "a": 1, "e": "Це діалектизми — слова певної місцевості."}, {"t": "choice", "q": "«Підмет», «присудок», «іменник» — це…", "o": ["терміни", "діалектизми", "загальновживані слова"], "a": 0, "e": "Це мовознавчі терміни."}, {"t": "choice", "q": "Хто вживає слова «штурвал», «вітрило», «камбуз»?", "o": ["Лікарі", "Моряки", "Учителі"], "a": 1, "e": "Це професійні слова моряків."}, {"t": "tf", "q": "Термін може мати кілька значень і вживатися в переносному значенні.", "a": false, "e": "Ні. Термін має одне точне значення й не буває образним."}, {"t": "input", "q": "Як називаються слова, поширені лише в певній місцевості?", "a": ["діалектизми", "діалектні", "діалектні слова", "діалектизм"], "e": "Діалектизми (діалектні слова)."}, {"t": "choice", "q": "Загальновживане слово до діалектного «когут» — це…", "o": ["кіт", "півень", "когось"], "a": 1, "e": "Когут — півень."}, {"t": "choice", "q": "Де доречно вживати діалектизми?", "o": ["У наукових статтях", "У художніх творах для колориту", "У законах"], "a": 1, "e": "Письменники вживають діалектизми, щоб передати мовлення жителів краю."}]}, {"id": "leks-pomylka-surzhyk", "sec": "Лексикологія", "title": "Лексична помилка. Суржик", "goal": "Ти впізнаєш лексичні помилки і суржик і вмієш їх виправляти.", "learn": [{"h": "Лексична помилка", "p": ["<span class='term'>Лексична помилка</span> — неправильне вживання слова: не в тому значенні, зайве повторення, сплутані пароніми, чуже слово замість свого."], "ex": ["<i>Він одягнув окуляри</i> → <i>надів</i> окуляри (одягають одяг, надівають річ).", "<i>У тексті є помилки й недоліки, і помилки</i> → повтор.", "<i>Моя автобіографія</i> → «авто» вже означає «моя» — зайве слово."]}, {"h": "Суржик", "p": ["<span class='term'>Суржик</span> — мішанина української та російської мов. Це не окрема мова, а зіпсована мова."], "ex": ["<i>слідуючий</i> → наступний", "<i>любий</i> (у значенні «будь-який») → будь-який", "<i>приймати участь</i> → брати участь", "<i>саме важне</i> → найважливіше", "<i>на протязі року</i> → протягом року"], "note": "Найкращий спосіб позбутися суржику — читати українські книжки й перевіряти слова в словнику."}], "remember": "Лексична помилка — слово не в тому значенні, зайвий повтор, сплутані пароніми. Суржик — суміш української й російської: слідуючий → наступний, приймати участь → брати участь.", "cards": [{"f": "Лексична помилка", "b": "Неправильне вживання слова: не те значення, повтор, сплутані пароніми."}, {"f": "Суржик", "b": "Мішанина української та російської мов."}, {"f": "«Слідуючий» — як правильно?", "b": "Наступний."}, {"f": "«Приймати участь» — як правильно?", "b": "Брати участь."}, {"f": "«На протязі року» — як правильно?", "b": "Протягом року."}, {"f": "Одягнути чи надіти окуляри?", "b": "Надіти. Одягають одяг (пальто), надівають річ (окуляри, шапку, каблучку)."}], "quiz": [{"t": "choice", "q": "Що таке суржик?", "o": ["Окрема мова", "Суміш української та російської мов", "Застаріла українська мова"], "a": 1, "e": "Суржик — мішанина мов, зіпсована мова."}, {"t": "choice", "q": "Як правильно?", "o": ["Слідуючий урок", "Наступний урок"], "a": 1, "e": "«Слідуючий» — суржик. Українською — наступний."}, {"t": "choice", "q": "Як правильно?", "o": ["Приймати участь", "Брати участь"], "a": 1, "e": "Брати участь."}, {"t": "input", "q": "Виправ: «на протязі тижня» → «… тижня».", "a": ["протягом", "упродовж", "впродовж"], "e": "Протягом (упродовж) тижня."}, {"t": "choice", "q": "Де лексична помилка?", "o": ["Він надів шапку.", "Він одягнув шапку.", "Він зняв шапку."], "a": 1, "e": "Шапку надівають. Одягають одяг: пальто, куртку."}, {"t": "choice", "q": "«Моя автобіографія» — у чому помилка?", "o": ["Помилки немає", "Зайве слово: «авто-» уже означає «моя»", "Треба «автобіографія моя»"], "a": 1, "e": "Автобіографія — це вже «опис власного життя», тому «моя» зайве."}, {"t": "choice", "q": "Обери правильний варіант.", "o": ["Саме важне", "Найважливіше"], "a": 1, "e": "«Саме важне» — суржик. Правильно: найважливіше."}, {"t": "tf", "q": "Повторення одного слова кілька разів поспіль у тексті — лексична помилка.", "a": true, "e": "Так, невиправданий повтор — лексична помилка. Замінюй синонімами або займенниками."}, {"t": "choice", "q": "«Любий учень може відповісти» — що не так?", "o": ["Усе правильно", "«Любий» тут означає «дорогий»; треба «будь-який»", "Треба «люба учениця»"], "a": 1, "e": "Любий — коханий, дорогий. У значенні «кожен» кажемо будь-який."}]}, {"id": "fraz-shcho", "sec": "Фразеологія", "title": "Фразеологізми", "goal": "Ти знаєш, що таке фразеологізм, і розумієш значення поширених сталих висловів.", "learn": [{"h": "Що таке фразеологізм", "p": ["<span class='term'>Фразеологізм</span> — стійке сполучення слів, яке має одне цілісне значення, часто переносне. Слова в ньому не можна замінити чи переставити."], "ex": ["<i>байдики бити</i> — ледарювати", "<i>накивати п'ятами</i> — втекти", "<i>пекти раків</i> — червоніти від сорому", "<i>як кіт наплакав</i> — дуже мало", "<i>зарубати на носі</i> — добре запам'ятати"], "note": "Фразеологізм у реченні — один член речення. «Він <i>байдики б'є</i>» = «він ледарює» (присудок)."}, {"h": "Фразеологія", "p": ["<span class='term'>Фразеологія</span> — розділ мовознавства, що вивчає фразеологізми. Значення фразеологізмів пояснює <span class='term'>фразеологічний словник</span>."]}, {"h": "Синоніми й антоніми серед фразеологізмів", "p": ["Синонімічні: <i>накивати п'ятами — дати драла — дременути</i> (втекти).", "Антонімічні: <i>рукою подати</i> (близько) — <i>за тридев'ять земель</i> (далеко)."]}], "remember": "Фразеологізм — стійкий вислів з одним цілісним значенням: байдики бити = ледарювати. У реченні — один член речення. Вивчає фразеологія, пояснює фразеологічний словник.", "cards": [{"f": "Фразеологізм", "b": "Стійке сполучення слів з одним цілісним значенням. Байдики бити — ледарювати."}, {"f": "Фразеологія", "b": "Розділ науки про мову, що вивчає фразеологізми."}, {"f": "Байдики бити", "b": "Ледарювати."}, {"f": "Накивати п'ятами", "b": "Втекти."}, {"f": "Пекти раків", "b": "Червоніти від сорому."}, {"f": "Як кіт наплакав", "b": "Дуже мало."}, {"f": "Зарубати на носі", "b": "Добре запам'ятати."}, {"f": "Скільки членів речення — фразеологізм?", "b": "Один (усе сполучення разом)."}], "quiz": [{"t": "choice", "q": "Фразеологізм — це…", "o": ["будь-яке словосполучення", "стійке сполучення слів з одним цілісним значенням", "речення з однорідними членами"], "a": 1, "e": "Фразеологізм стійкий і має одне значення, як одне слово."}, {"t": "choice", "q": "Що означає «пекти раків»?", "o": ["Готувати їжу", "Червоніти від сорому", "Довго спати"], "a": 1, "e": "Пекти раків — червоніти."}, {"t": "choice", "q": "Який вислів означає «дуже мало»?", "o": ["Як кіт наплакав", "Хоч греблю гати", "За тридев'ять земель"], "a": 0, "e": "Як кіт наплакав — мало. Хоч греблю гати — дуже багато."}, {"t": "input", "q": "Заміни одним словом: «накивати п'ятами».", "a": ["втекти", "утекти", "втікати", "утікати"], "e": "Втекти."}, {"t": "choice", "q": "Скількома членами речення є фразеологізм «б'є байдики» в реченні «Петрик б'є байдики»?", "o": ["Одним", "Двома", "Трьома"], "a": 0, "e": "Фразеологізм — один член речення (тут присудок)."}, {"t": "tf", "q": "У фразеологізмі можна вільно замінювати слова синонімами: «байдики стукати».", "a": false, "e": "Ні. Фразеологізм стійкий: тільки «байдики бити»."}, {"t": "choice", "q": "Який словник пояснює значення фразеологізмів?", "o": ["Орфографічний", "Фразеологічний", "Словник наголосів"], "a": 1, "e": "Фразеологічний словник."}, {"t": "choice", "q": "Знайди фразеологізм.", "o": ["Зарубати дерево", "Зарубати на носі", "Зарубати гілку"], "a": 1, "e": "«Зарубати на носі» — запам'ятати. Інші — вільні словосполучення."}, {"t": "choice", "q": "Які фразеологізми антонімічні?", "o": ["дати драла — дременути", "рукою подати — за тридев'ять земель", "байдики бити — ледаря святкувати"], "a": 1, "e": "Близько — далеко. Інші пари — синоніми."}]}, {"id": "fraz-dzherela", "sec": "Фразеологія", "title": "Джерела фразеологізмів. Прислів'я і приказки", "goal": "Ти знаєш, звідки походять фразеологізми, і відрізняєш прислів'я від приказки.", "learn": [{"h": "Звідки беруться фразеологізми", "p": ["З <b>побуту й праці</b>: <i>тримати ніс за вітром</i> (моряки), <i>стригти під один гребінець</i>, <i>куй залізо, поки гаряче</i> (ковалі).", "З <b>народних казок і легенд</b>: <i>лисичка-сестричка, за тридев'ять земель</i>.", "З <b>історії</b>: <i>погиб як швед під Полтавою</i>.", "З <b>Біблії</b>: <i>блудний син, манна небесна, умивати руки</i>.", "З <b>античних міфів</b>: <i>ахіллесова п'ята, нитка Аріадни, авгієві стайні</i>.", "З <b>літератури</b>: <i>а віз і нині там</i> (Крилов), <i>і чужому научайтесь, й свого не цурайтесь</i> (Шевченко)."]}, {"h": "Прислів'я і приказки", "p": ["<span class='term'>Прислів'я</span> — завершене речення з повчальним змістом: <i>Без труда нема плода. Хто рано встає, тому Бог дає.</i>", "<span class='term'>Приказка</span> — влучний вислів без повчання, часто частина речення: <i>як сніг на голову, ні риба ні м'ясо</i>."], "note": "Прислів'я — думка повністю (є висновок). Приказка — тільки образ, без висновку."}, {"h": "Крилаті вислови", "p": ["<span class='term'>Крилаті вислови</span> — влучні слова відомих людей чи з книжок: <i>Борітеся — поборете</i> (Шевченко)."]}], "remember": "Джерела: побут і праця, казки, історія, Біблія, міфи, література. Прислів'я — повчальне завершене речення. Приказка — образний вислів без повчання.", "cards": [{"f": "Прислів'я", "b": "Завершене речення з повчальним змістом: Без труда нема плода."}, {"f": "Приказка", "b": "Влучний образний вислів без повчання: як сніг на голову."}, {"f": "Крилаті вислови", "b": "Влучні слова відомих людей або з книжок: Борітеся — поборете."}, {"f": "Ахіллесова п'ята", "b": "Вразливе місце. З античного міфу."}, {"f": "Манна небесна", "b": "Несподіване благо. З Біблії."}, {"f": "Куй залізо, поки гаряче", "b": "Не гай часу. З мовлення ковалів."}], "quiz": [{"t": "choice", "q": "Звідки походить «ахіллесова п'ята»?", "o": ["З Біблії", "З античного міфу", "З професії ковалів"], "a": 1, "e": "З міфу про героя Ахілла, вразливого тільки в п'яту."}, {"t": "choice", "q": "«Куй залізо, поки гаряче» прийшло з мовлення…", "o": ["моряків", "ковалів", "рибалок"], "a": 1, "e": "Із професії ковалів."}, {"t": "choice", "q": "Що з цього прислів'я?", "o": ["Як сніг на голову", "Хто рано встає, тому Бог дає", "Ні риба ні м'ясо"], "a": 1, "e": "Це завершене речення з повчанням — прислів'я. Інші — приказки."}, {"t": "choice", "q": "Чим приказка відрізняється від прислів'я?", "o": ["Приказка довша", "Приказка не має повчального висновку", "Приказка завжди римується"], "a": 1, "e": "Приказка — образ без повчання; прислів'я — повна повчальна думка."}, {"t": "choice", "q": "«Манна небесна», «блудний син» походять…", "o": ["із Біблії", "з казок", "із професійного мовлення"], "a": 0, "e": "Це біблійні вислови."}, {"t": "tf", "q": "«Борітеся — поборете» — крилатий вислів Тараса Шевченка.", "a": true, "e": "Так, із поеми «Кавказ»."}, {"t": "input", "q": "Як називається влучний вислів відомої людини або з книжки, що став загальновідомим?", "a": ["крилатий вислів", "крилаті вислови", "крилатий", "крилаті слова"], "e": "Крилатий вислів."}, {"t": "choice", "q": "«За тридев'ять земель» походить…", "o": ["з народних казок", "з Біблії", "з історії"], "a": 0, "e": "Це казковий вислів."}]}, {"id": "bud-osnova-zakinchennia", "sec": "Будова слова. Орфографія", "title": "Основа слова і закінчення. Змінні й незмінні слова", "goal": "Ти вмієш знаходити закінчення й основу слова та знаєш, у яких слів закінчення немає.", "learn": [{"h": "Закінчення", "p": ["<span class='term'>Закінчення</span> — змінна частина слова, що служить для зв'язку слів у реченні. Щоб знайти, зміни слово за відмінками або числами."], "ex": ["книг<b>а</b> — книг<b>и</b> — книг<b>у</b> — книг<b>ою</b> → закінчення -а", "стіл<b>□</b> — стол<b>а</b> — стол<b>у</b> → закінчення нульове"], "note": "<span class='term'>Нульове закінчення</span> — коли в початковій формі закінчення не виражене буквами, але з'являється в інших формах: ліс□ — ліс<b>у</b>."}, {"h": "Основа", "p": ["<span class='term'>Основа</span> — частина слова без закінчення. Саме основа несе лексичне значення."], "ex": ["<u>книг</u>а, <u>зелен</u>ий, <u>пиш</u>у"]}, {"h": "Змінні й незмінні слова", "p": ["<span class='term'>Незмінні слова</span> не мають закінчення взагалі — тільки основу: прислівники (<i>швидко, вчора</i>), незмінювані іменники (<i>кіно, таксі, меню</i>), службові слова (<i>і, але, на</i>)."], "note": "Не плутай: у слові «кіно» кінцеве -о — частина основи, а не закінчення, бо слово не змінюється."}], "remember": "Закінчення — змінна частина слова; знайди, змінюючи слово. Основа — все без закінчення. Нульове закінчення: стіл□. Незмінні слова (швидко, кіно, але) закінчення не мають.", "cards": [{"f": "Закінчення", "b": "Змінна частина слова для зв'язку слів у реченні: книга — книги — книгу."}, {"f": "Основа слова", "b": "Частина слова без закінчення; несе лексичне значення."}, {"f": "Нульове закінчення", "b": "Не виражене буквами, але з'являється в інших формах: стіл□ — стола."}, {"f": "Незмінні слова", "b": "Не мають закінчення: швидко, вчора, кіно, таксі, і, але."}, {"f": "Як знайти закінчення?", "b": "Змінити слово за відмінками або числами: те, що змінюється, і є закінчення."}], "quiz": [{"t": "choice", "q": "Що таке закінчення?", "o": ["Остання буква слова", "Змінна частина слова для зв'язку слів у реченні", "Частина слова, що несе лексичне значення"], "a": 1, "e": "Закінчення змінюється й зв'язує слова. Лексичне значення несе основа."}, {"t": "input", "q": "Яке закінчення у слові «сонце» (сонце — сонця — сонцю)?", "a": ["е", "-е"], "e": "Закінчення -е: сонц-е, сонц-я, сонц-ю."}, {"t": "choice", "q": "У якому слові нульове закінчення?", "o": ["Дуб", "Дуби", "Дубом"], "a": 0, "e": "Дуб□ — нульове закінчення, з'являється в інших формах: дуба, дубом."}, {"t": "choice", "q": "Яке слово незмінне (без закінчення)?", "o": ["Місто", "Швидко", "Ліжко"], "a": 1, "e": "Швидко — прислівник, не змінюється. Місто, ліжко — іменники з закінченням -о."}, {"t": "tf", "q": "У слові «кіно» закінчення -о.", "a": false, "e": "Ні. Кіно не змінюється, тому -о — частина основи."}, {"t": "input", "q": "Яка основа у слові «весна»?", "a": ["весн", "весн-"], "e": "Весн-а: основа весн-."}, {"t": "choice", "q": "Основа слова — це…", "o": ["слово без закінчення", "корінь слова", "перша частина слова"], "a": 0, "e": "Основа — усе слово без закінчення (може містити префікс, корінь, суфікс)."}, {"t": "choice", "q": "Як знайти закінчення у слові «зелений»?", "o": ["Відкинути дві останні букви", "Змінити слово: зелена, зелене, зелені", "Подивитися в словник"], "a": 1, "e": "Змінюємо слово — те, що змінюється, і є закінчення: -ий."}]}, {"id": "bud-korin", "sec": "Будова слова. Орфографія", "title": "Корінь. Спільнокореневі слова та форми слова", "goal": "Ти знаходиш корінь і відрізняєш спільнокореневі слова від форм одного слова.", "learn": [{"h": "Корінь", "p": ["<span class='term'>Корінь</span> — головна частина слова, спільна для всіх споріднених слів; у ній головне значення. Щоб знайти корінь, добери споріднені слова."], "ex": ["<u>ліс</u>, <u>ліс</u>ок, <u>ліс</u>ник, <u>ліс</u>овий, про<u>ліс</u>ок → корінь -ліс-"]}, {"h": "Спільнокореневі слова", "p": ["<span class='term'>Спільнокореневі</span> (споріднені) слова мають той самий корінь і близьке значення, але це <b>різні слова</b>: <i>сад, садок, садівник, садити</i>."], "note": "Однаковий корінь, але різне значення — не спільнокореневі: <i>вода</i> і <i>водити</i>, <i>гора</i> і <i>горе</i>."}, {"h": "Форми слова", "p": ["<span class='term'>Форми слова</span> — те саме слово, змінене за відмінками, числами тощо: <i>сад, саду, садом, сади</i>. Відрізняються тільки закінченням."], "ex": ["Спільнокореневі: <i>школа, школяр, шкільний</i>", "Форми одного слова: <i>школа, школи, школою</i>"]}, {"h": "Чергування в корені", "p": ["У корені можуть чергуватися звуки: <i>н<b>о</b>га — н<b>і</b>г, ру<b>к</b>а — ру<b>ч</b>ка, дру<b>г</b> — дру<b>з</b>і</i>. Корінь при цьому той самий."]}], "remember": "Корінь — спільна частина споріднених слів. Спільнокореневі — різні слова з одним коренем (сад, садок). Форми слова — те саме слово з іншим закінченням (сад, саду).", "cards": [{"f": "Корінь", "b": "Головна частина слова, спільна для споріднених слів: ліс, лісок, лісник."}, {"f": "Спільнокореневі слова", "b": "Різні слова з одним коренем і близьким значенням: сад, садок, садівник."}, {"f": "Форми слова", "b": "Те саме слово, змінене за відмінками чи числами: сад, саду, сади."}, {"f": "Чи спільнокореневі «вода» і «водити»?", "b": "Ні: корені збігаються за звучанням, але значення різні."}, {"f": "Як знайти корінь?", "b": "Дібрати споріднені слова і знайти спільну частину."}], "quiz": [{"t": "choice", "q": "Що таке корінь слова?", "o": ["Перша частина слова", "Спільна частина споріднених слів з головним значенням", "Частина слова після префікса"], "a": 1, "e": "Корінь — спільна частина споріднених слів, у ній головне значення."}, {"t": "choice", "q": "Який рядок — спільнокореневі слова?", "o": ["ліс, лісу, лісом", "ліс, лісник, лісовий", "ліс, ліси, лісами"], "a": 1, "e": "Це різні слова з коренем -ліс-. Інші рядки — форми одного слова."}, {"t": "choice", "q": "Який рядок — форми одного слова?", "o": ["гора, гірський, горянин", "гора, гори, горою", "гора, горе, горювати"], "a": 1, "e": "Гора, гори, горою — змінилося тільки закінчення."}, {"t": "tf", "q": "«Гора» і «горе» — спільнокореневі слова.", "a": false, "e": "Ні. Корені збігаються за буквами, але значення зовсім різні."}, {"t": "input", "q": "Назви корінь у словах «зима, зимовий, зимувати».", "a": ["зим", "зим-", "-зим-"], "e": "Корінь -зим-."}, {"t": "choice", "q": "Чим відрізняються форми одного слова?", "o": ["Коренем", "Закінченням", "Значенням"], "a": 1, "e": "Тільки закінченням: сад — саду — садом."}, {"t": "choice", "q": "«Друг — друзі»: що відбувається в корені?", "o": ["Змінюється корінь", "Чергування приголосних г — з", "Додається суфікс"], "a": 1, "e": "Чергування г — з, корінь той самий."}, {"t": "choice", "q": "Яке слово зайве: «водяний, водичка, водій, водопад»?", "o": ["водяний", "водій", "водопад"], "a": 1, "e": "Водій — від «водити», інші — від «вода»."}]}, {"id": "bud-prefiks", "sec": "Будова слова. Орфографія", "title": "Префікс. Написання префіксів пре-, при-, прі-", "goal": "Ти знаєш, що таке префікс, і правильно пишеш пре-, при-, прі-.", "learn": [{"h": "Префікс", "p": ["<span class='term'>Префікс</span> — частина слова перед коренем, що утворює нові слова: <i><b>при</b>їхати, <b>ви</b>їхати, <b>за</b>їхати, <b>пере</b>їхати</i>."], "note": "Префікс змінює значення: <i>бігти</i> → <i>прибігти</i> (наблизитись), <i>вибігти</i> (вийти), <i>перебігти</i> (через щось)."}, {"h": "Пре-", "p": ["Пишемо, якщо означає <b>дуже</b>, найвищу міру ознаки (можна замінити словом «дуже»): <i>пре<b>гарний</b></i> = дуже гарний, <i>предобрий, премудрий, прекрасний</i>."], "ex": ["Також у старих словах: <i>престол, презирство, преподобний</i>."]}, {"h": "При-", "p": ["Пишемо, якщо означає: <b>наближення</b>, <b>приєднання</b> (<i>прийти, приклеїти, прибити</i>); <b>неповноту дії</b> (<i>присісти, прикрити, привідкрити</i>); <b>близькість до чогось</b> (<i>прибережний, пришкільний, приміський</i>)."]}, {"h": "Прі-", "p": ["Тільки у трьох словах: <i>прі<b>звище</b>, прі<b>звисько</b>, прі<b>рва</b></i>."]}], "remember": "Пре- = дуже (прегарний). При- = наближення, приєднання, неповна дія, близькість (прийти, присісти, приморський). Прі- — тільки прізвище, прізвисько, прірва.", "cards": [{"f": "Префікс", "b": "Частина слова перед коренем, що утворює нові слова: при-їхати, ви-їхати."}, {"f": "Коли пишемо пре-?", "b": "Коли означає «дуже»: прегарний = дуже гарний."}, {"f": "Коли пишемо при-?", "b": "Наближення, приєднання (прийти), неповна дія (присісти), близькість (прибережний)."}, {"f": "Коли пишемо прі-?", "b": "Тільки: прізвище, прізвисько, прірва."}, {"f": "Пр..мудрий — е чи и?", "b": "Премудрий (дуже мудрий)."}, {"f": "Пр..клеїти — е чи и?", "b": "Приклеїти (приєднання)."}], "quiz": [{"t": "choice", "q": "Що таке префікс?", "o": ["Частина слова після кореня", "Частина слова перед коренем", "Змінна частина слова"], "a": 1, "e": "Префікс стоїть перед коренем і утворює нові слова."}, {"t": "choice", "q": "Яку букву пишемо: «пр..гарний»?", "o": ["е", "и", "і"], "a": 0, "e": "Прегарний = дуже гарний → пре-."}, {"t": "choice", "q": "Яку букву пишемо: «пр..йти»?", "o": ["е", "и", "і"], "a": 1, "e": "Прийти — наближення → при-."}, {"t": "choice", "q": "Яку букву пишемо: «пр..рва»?", "o": ["е", "и", "і"], "a": 2, "e": "Прірва — одне з трьох слів із прі-."}, {"t": "choice", "q": "«Присісти» — яке значення префікса?", "o": ["Дуже", "Неповнота дії", "Близькість"], "a": 1, "e": "Присісти — сісти неповністю, на хвилинку."}, {"t": "input", "q": "Встав букву: «пр..шкільний» (майданчик).", "a": ["и", "пришкільний"], "e": "Пришкільний — близько до школи → при-."}, {"t": "input", "q": "Встав букву: «пр..красний».", "a": ["е", "прекрасний"], "e": "Прекрасний — дуже красний (гарний) → пре-."}, {"t": "tf", "q": "Слів із префіксом прі- в українській мові лише три.", "a": true, "e": "Прізвище, прізвисько, прірва."}, {"t": "choice", "q": "У якому слові пре- НЕ означає «дуже»?", "o": ["Предобрий", "Престол", "Прехороший"], "a": 1, "e": "Престол — старе слово, тут пре- не означає «дуже», але пишеться з е."}, {"t": "choice", "q": "Обери правильне написання.", "o": ["прізвисько", "призвисько", "презвисько"], "a": 0, "e": "Прізвисько — виняток із прі-."}]}, {"id": "bud-sufiks", "sec": "Будова слова. Орфографія", "title": "Суфікс. Правопис значущих частин слова", "goal": "Ти знаєш, що таке суфікс, і розбираєш слово за будовою.", "learn": [{"h": "Суфікс", "p": ["<span class='term'>Суфікс</span> — частина слова після кореня перед закінченням, що утворює нові слова або їх форми: <i>ліс<b>ок</b>, ліс<b>ник</b>, дуб<b>ов</b>ий</i>."], "ex": ["Зменшувально-пестливі: <i>-ик, -ок, -еньк-, -оньк-</i>: кот<b>ик</b>, син<b>ок</b>, рід<b>неньк</b>ий", "Назви людей: <i>-ар, -ник, -тель</i>: лік<b>ар</b>, учи<b>тель</b>, зв'яз<b>ок</b>"]}, {"h": "Значущі частини слова", "p": ["<span class='term'>Значущі частини</span> (морфеми): <b>префікс, корінь, суфікс, закінчення</b>. Розбір за будовою — знайти всі частини."], "ex": ["<i>пролісок</i>: про- (префікс), -ліс- (корінь), -ок (суфікс), □ (нульове закінчення)"], "note": "Порядок розбору: 1) закінчення (зміни слово), 2) основа, 3) корінь (споріднені слова), 4) префікс, 5) суфікс."}, {"h": "Правопис частин слова", "p": ["Префікси й суфікси пишуться однаково незалежно від вимови: <i>ро<b>з</b>казати</i> (хоч чуємо [с]), <i>бе<b>з</b>печний</i>, <i>-ськ-</i>: укра<b>ї</b>н<b>ськ</b>ий."]}], "remember": "Суфікс — після кореня, утворює нові слова (лісок, лісник). Значущі частини: префікс, корінь, суфікс, закінчення. Розбір: закінчення → основа → корінь → префікс → суфікс.", "cards": [{"f": "Суфікс", "b": "Частина слова після кореня перед закінченням; утворює нові слова: ліс-ок, ліс-ник."}, {"f": "Значущі частини слова", "b": "Префікс, корінь, суфікс, закінчення."}, {"f": "Порядок розбору слова за будовою", "b": "Закінчення → основа → корінь → префікс → суфікс."}, {"f": "Розбери «пролісок»", "b": "про- префікс, -ліс- корінь, -ок суфікс, □ нульове закінчення."}, {"f": "Які суфікси зменшувально-пестливі?", "b": "-ик, -ок, -еньк-, -оньк-: котик, синок, гарненький."}], "quiz": [{"t": "choice", "q": "Де стоїть суфікс?", "o": ["Перед коренем", "Після кореня, перед закінченням", "Після закінчення"], "a": 1, "e": "Суфікс — між коренем і закінченням."}, {"t": "input", "q": "Назви суфікс у слові «лісник».", "a": ["ник", "-ник"], "e": "Ліс-ник: суфікс -ник."}, {"t": "choice", "q": "Які частини є у слові «підводний»?", "o": ["корінь, суфікс", "префікс, корінь, суфікс, закінчення", "корінь, закінчення"], "a": 1, "e": "Під- (префікс), -вод- (корінь), -н- (суфікс), -ий (закінчення)."}, {"t": "choice", "q": "З чого починають розбір слова за будовою?", "o": ["З кореня", "Із закінчення", "З префікса"], "a": 1, "e": "Спочатку закінчення (змінюємо слово), потім основа, корінь, префікс, суфікс."}, {"t": "choice", "q": "У якому слові є зменшувально-пестливий суфікс?", "o": ["Учитель", "Котик", "Лікар"], "a": 1, "e": "Кот-ик: суфікс -ик."}, {"t": "tf", "q": "Значущих частин слова чотири: префікс, корінь, суфікс, закінчення.", "a": true, "e": "Так."}, {"t": "input", "q": "Назви префікс у слові «прибережний».", "a": ["при", "при-"], "e": "При-береж-н-ий: префікс при-."}, {"t": "choice", "q": "Як пишемо: «ро..казати»?", "o": ["розказати", "росказати"], "a": 0, "e": "Префікс роз- пишеться завжди з з, хоч чуємо [с]."}, {"t": "choice", "q": "Скільки суфіксів у слові «гарненький»?", "o": ["Один", "Два", "Жодного"], "a": 0, "e": "Гарн-еньк-ий: один суфікс -еньк-."}]}, {"id": "fon-zvuky", "sec": "Фонетика. Графіка. Орфоепія", "title": "Звуки мови. Голосні й приголосні", "goal": "Ти знаєш, скільки звуків в українській мові, і відрізняєш звук від букви.", "learn": [{"h": "Фонетика", "p": ["<span class='term'>Фонетика</span> — розділ науки про мову, що вивчає звуки. <b>Звуки</b> ми вимовляємо й чуємо, <b>букви</b> — пишемо й бачимо."], "note": "Звуки записують у квадратних дужках: [а], [б]. Буква — «а», «бе»."}, {"h": "Скільки звуків", "p": ["В українській мові <b>38</b> звуків: <b>6 голосних</b> і <b>32 приголосні</b>. А букв — <b>33</b>."], "ex": ["Голосні: [а], [о], [у], [е], [и], [і].", "Приголосні: усі решта, зокрема [дж], [дз], [дз'] — це один звук, а не два."]}, {"h": "Голосні й приголосні", "p": ["<span class='term'>Голосні</span> творяться тільки голосом, повітря проходить вільно; їх можна проспівати. <span class='term'>Приголосні</span> творяться голосом і шумом або тільки шумом — повітря натрапляє на перешкоду (губи, зуби, язик)."]}], "remember": "Фонетика вивчає звуки. Звуків 38: 6 голосних ([а], [о], [у], [е], [и], [і]) + 32 приголосні. Букв 33. Звук — чуємо, букву — бачимо.", "cards": [{"f": "Фонетика", "b": "Розділ науки про мову, що вивчає звуки."}, {"f": "Скільки звуків в українській мові?", "b": "38: 6 голосних і 32 пригол лос", "p": ["<span class='term'>Наголос</span> — виділення одного складу в слові силою голосу. В українській мові наголос <b>вільний</b> (на будь-якому складі) і <b>рухомий</b> (може змінюватись: <i>рукá — рýки</i>)."], "note": "Наголос може розрізняти слова: <i>зáмок — замóк, дорóга — дорогá, брáти — братú</i>."}, {"h": "Запам'ятай наголос", "p": ["<i>вúпадок, чотирнáдцять, одинáдцять, новúй, старúй, котрúй, ознáка, фаховúй, рáзом, посерéдині, кіломéтр, докумéнт, чергóвий, спúна, рукóпис, укрáїнський, дóнька, читáння, завдáння, серéдина, вимóва, зрýчний</i>."], "ex": ["У числівниках на -надцять наголос на «на»: одинáдцять, чотирнáдцять.", "Перевіряй у словнику наголосів або орфоепічному."]}, {"h": "Ненаголошені е, и в корені", "p": ["Під наголосом голосний чуємо чітко, без наголосу [е] та [и] звучать схоже. Щоб перевірити, <b>зміни слово або добери споріднене</b>, щоб цей голосний став наголошеним."], "ex": ["с<b>е</b>ло → сéла; в<b>е</b>сна → вéсни", "з<b>и</b>ма → зúми; ш<b>и</b>рокий → шúроко"], "note": "Якщо перевірити не можна — дивись в орфографічний словник: <i>левада, кишеня, пиріг, медаль, апельсин</i>."}], "remember": "Наголос в українській мові вільний і рухомий. Ненаголошені е, и перевіряй наголосом: село — сéла, зима — зúми. Не перевіряється — словник.", "cards": [{"f": "Наголос", "b": "Виділення одного складу силою голосу."}, {"f": "Який наголос в українській мові?", "b": "Вільний (на будь-якому складі) і рухомий (рука — руки)."}, {"f": "Як перевірити ненаголошений е чи и?", "b": "Змінити слово або дібрати споріднене, щоб голосний став наголошеним: село — сéла."}, {"f": "Наголос: одинадцять, чотирнадцять", "b": "Одинáдцять, чотирнáдцять — на «на»."}, {"f": "Наголос: випадок, новий, ознака", "b": "Вúпадок, новúй, ознáка."}, {"f": "Наголос: спина, читання, завдання", "b": "Спúна, читáння, завдáння."}], "quiz": [{"t": "choice", "q": "Наголос в українській мові…", "o": ["завжди на першому складі", "вільний і рухомий", "завжди на останньому складі"], "a":
