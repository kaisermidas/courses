pan> творяться голосом і шумом, <span class='term'>глухі</span> — тільки шумом. Вони утворюють пари:"], "ex": ["Дзвінкі: [б] [д] [з] [ж] [г] [ґ] [дж] [дз]", "Глухі: [п] [т] [с] [ш] [х] [к] [ч] [ц]", "Без пари глухий: [ф]. Без пари дзвінкі (сонорні): [м] [н] [л] [р] [в] [й]."], "note": "Запам'ятай глухі: <b>Хоч Фока Кашу Сипле Цю Че Пе Те</b> ([х], [ф], [к], [ш], [с], [ц], [ч], [п], [т])."}, {"h": "Вимова в корені", "p": ["Дзвінкі в кінці слова й перед глухими <b>не оглушуються</b>: <i>дуб</i> [дуб], <i>ніж</i> [н'іж], <i>казка</i> [казка].", "Виняток — [г] перед глухим у словах <i>легко, вогко, нігті, кігті, дьогтю</i> вимовляється як [х]: [лехко].", "Глухі перед дзвінкими одзвінчуються: <i>боротьба</i> [бород'ба], <i>просьба</i> [проз'ба], <i>вокзал</i> [воґзал]."]}], "remember": "М'які: Де Ти З'їСи Ці ЛиНи + р, й. Дзвінкі — з голосом (б, д, з, ж, г, ґ, дж, дз), глухі — шум (п, т, с, ш, х, к, ч, ц, ф). Дзвінкі в кінці слова не оглушуємо: [дуб]. Легко, вогко, нігті → [х].", "cards": [{"f": "М'які приголосні", "b": "[д'] [т'] [з'] [с'] [ц'] [л'] [н'] [дз'] [р'] [й]. Де Ти З'їСи Ці ЛиНи."}, {"f": "Дзвінкі приголосні", "b": "[б] [д] [з] [ж] [г] [ґ] [дж] [дз] + сонорні [м] [н] [л] [р] [в] [й]."}, {"f": "Глухі приголосні", "b": "[п] [т] [с] [ш] [х] [к] [ч] [ц] [ф]. Хоч Фока Кашу Сипле Цю Че Пе Те."}, {"f": "Пара до [б]? до [з]? до [г]?", "b": "[п], [с], [х]."}, {"f": "Чи оглушується дзвінкий у кінці слова?", "b": "Ні: дуб [дуб], ніж [н'іж]."}, {"f": "Легко, вогко, нігті, кігті", "b": "[г] перед глухим вимовляється як [х]: [лехко]."}, {"f": "Боротьба, просьба, вокзал", "b": "Глухий перед дзвінким одзвінчується: [бород'ба], [проз'ба], [воґзал]."}], "quiz": [{"t": "choice", "q": "Який рядок містить лише м'які приголосні?", "o": ["[д'] [т'] [л'] [н']", "[б] [п] [м]", "[ш] [ж] [ч]"], "a": 0, "e": "Де Ти З'їСи Ці ЛиНи: [д'] [т'] [з'] [с'] [ц'] [л'] [н']."}, {"t": "choice", "q": "Пара до дзвінкого [д] — це…", "o": ["[т]", "[с]", "[з]"], "a": 0, "e": "[д] — [т]."}, {"t": "choice", "q": "Який приголосний глухий?", "o": ["[ж]", "[ш]", "[з]"], "a": 1, "e": "[ш] — глухий, пара до дзвінкого [ж]."}, {"t": "choice", "q": "Як вимовляти слово «дуб»?", "o": ["[дуп]", "[дуб]"], "a": 1, "e": "В українській мові дзвінкі в кінці слова не оглушуються."}, {"t": "choice", "q": "Як вимовляється «легко»?", "o": ["[легко]", "[лехко]"], "a": 1, "e": "Виняток: у словах легко, вогко, нігті, кігті [г] звучить як [х]."}, {"t": "choice", "q": "Як вимовляється «боротьба»?", "o": ["[борот'ба]", "[бород'ба]"], "a": 1, "e": "Глухий [т'] перед дзвінким [б] одзвінчується."}, {"t": "tf", "q": "Звук [й] завжди м'який.", "a": true, "e": "Так, [й] не має твердої пари."}, {"t": "input", "q": "Назви глуху пару до звука [г].", "a": ["х", "[х]"], "e": "[г] — [х]."}, {"t": "choice", "q": "Який звук не має дзвінкої пари?", "o": ["[ф]", "[п]", "[к]"], "a": 0, "e": "[ф] — єдиний глухий без пари. [п] — [б], [к] — [ґ]."}, {"t": "choice", "q": "Чим дзвінкі відрізняються від глухих?", "o": ["Дзвінкі творяться голосом і шумом, глухі — тільки шумом", "Дзвінкі завжди м'які", "Глухі стоять тільки в кінці слова"], "a": 0, "e": "Різниця — в участі голосу."}]}, {"id": "fon-miakyi-znak", "sec": "Фонетика. Графіка. Орфоепія", "title": "Позначення м'якості. Правила вживання м'якого знака", "goal": "Ти знаєш, коли писати м'який знак, а коли — ні.", "learn": [{"h": "Як позначаємо м'якість на письмі", "p": ["М'якість приголосного позначають: буква <b>ь</b> (<i>сіль</i>), букви <b>і, я, ю, є</b> після приголосного (<i>ліс, няня, люди, синє</i>)."]}, {"h": "М'який знак пишемо", "p": ["1. Після <b>д, т, з, с, ц, л, н</b> у кінці слова та складу: <i>день, мідь, сіль, кінець, батько, донька</i>.", "2. Після <b>л</b> перед приголосним: <i>пальці, сільський, більше</i>.", "3. У суфіксах <b>-ськ-, -зьк-, -цьк-, -еньк-, -оньк-, -есеньк-</b>: <i>український, козацький, маленький</i>.", "4. Перед <b>о</b>: <i>льон, сьогодні, трьох, дзьоб</i>.", "5. У дієсловах на <b>-ться, -ть</b>: <i>сміється, вчаться, робить</i>."]}, {"h": "М'який знак НЕ пишемо", "p": ["1. Після <b>б, п, в, м, ф, ж, ч, ш, щ, г, к, х, ґ, р</b>: <i>голуб, кров, ніч, дощ, кобзар, Харків</i>.", "2. Перед <b>я, ю, є, ї</b>, які самі пом'якшують: <i>синє, люди, зоря</i>.", "3. Між подовженими м'якими: <i>життя, знання, стаття</i>.", "4. Після <b>н</b> перед <b>ж, ч, ш, щ</b>: <i>кінчик, тонший, менший, інший</i>.", "5. У буквосполученнях <b>лц, лч, нц, нч, сц, сч</b>, якщо походять від <b>лк, нк, ск</b>: <i>рибалка → рибалці, сонечко → сонечці, Наталка → Наталці</i>."]}], "remember": "Ь після д, т, з, с, ц, л, н у кінці слова/складу (день, батько), у -ськ-, -цьк-, -еньк- (український, маленький), перед о (льон), у -ться (сміється). НЕ пишемо після губних, шиплячих, р, г, к, х (кров, ніч, кобзар), перед я, ю, є, ї (синє), між подовженими (життя), після н перед ж, ч, ш, щ (менший, тонший).", "cards": [{"f": "Після яких букв пишемо ь?", "b": "Після д, т, з, с, ц, л, н: день, сіль, кінець."}, {"f": "Після яких букв ь НЕ пишемо?", "b": "Після б, п, в, м, ф, ж, ч, ш, щ, г, к, х, ґ, р: голуб, ніч, дощ, кобзар."}, {"f": "Ь у суфіксах", "b": "-ськ-, -зьк-, -цьк-, -еньк-, -оньк-: український, козацький, маленький."}, {"f": "Ь перед о", "b": "Пишемо: льон, сьогодні, трьох, дзьоб."}, {"f": "Ь у дієсловах", "b": "-ться, -ть: сміється, вчаться, робить."}, {"f": "Чи пишемо ь перед я, ю, є?", "b": "Ні, ці букви самі пом'якшують: синє, люди."}, {"f": "Н перед ж, ч, ш, щ", "b": "Ь не пишемо: менший, тонший, кінчик, інший."}, {"f": "Між подовженими м'якими", "b": "Ь не пишемо: життя, знання, стаття."}], "quiz": [{"t": "choice", "q": "У якому слові треба ь?", "o": ["ніч..", "ден..", "кров.."], "a": 1, "e": "День: після н у кінці слова. Ніч і кров — після ч і в ь не пишемо."}, {"t": "choice", "q": "Як правильно?", "o": ["українский", "український"], "a": 1, "e": "Суфікс -ськ- пишеться з м'яким знаком."}, {"t": "choice", "q": "Як правильно?", "o": ["меньший", "менший"], "a": 1, "e": "Після н перед ш м'який знак не пишемо."}, {"t": "choice", "q": "Як правильно?", "o": ["сьогодні", "согодні"], "a": 0, "e": "Перед о після м'якого приголосного пишемо ь: сьогодні, льон."}, {"t": "choice", "q": "Як правильно?", "o": ["сміється", "сміеться"], "a": 0, "e": "У дієсловах на -ться м'який знак є завжди."}, {"t": "choice", "q": "Як правильно?", "o": ["житьтя", "життя"], "a": 1, "e": "Між подовженими м'якими ь не пишемо."}, {"t": "tf", "q": "У слові «кобзар» у кінці треба писати ь.", "a": false, "e": "Після р у кінці слова ь не пишемо: кобзар, лікар, Харків."}, {"t": "input", "q": "Встав, якщо треба, ь: «пал..ці».", "a": ["ь", "пальці"], "e": "Пальці: після л перед приголосним пишемо ь."}, {"t": "choice", "q": "У якому слові ь НЕ потрібен?", "o": ["син..є", "бат..ко", "сіл.."], "a": 0, "e": "Синє — є сама пом'якшує н. Батько, сіль — з ь."}, {"t": "choice", "q": "Як правильно?", "o": ["маленький", "маленкий"], "a": 0, "e": "Суфікс -еньк- завжди з м'яким знаком."}]}, {"id": "fon-hrafika-alfavit", "sec": "Фонетика. Графіка. Орфоепія", "title": "Графіка. Алфавіт. Звук [ґ] і буква ґ", "goal": "Ти знаєш алфавіт, розумієш, що вивчає графіка, і правильно вживаєш букву ґ.", "learn": [{"h": "Графіка й алфавіт", "p": ["<span class='term'>Графіка</span> — розділ науки про мову, що вивчає букви та інші знаки письма. <span class='term'>Алфавіт</span> (абетка, азбука) — усі букви в усталеному порядку. В українському алфавіті <b>33</b> букви."], "ex": ["А Б В Г Ґ Д Е Є Ж З И І Ї Й К Л М Н О П Р С Т У Ф Х Ц Ч Ш Щ Ь Ю Я"], "note": "Ь звука не позначає. Літери я, ю, є, ї, щ можуть позначати два звуки. Букви дж, дз немає — є буквосполучення."}, {"h": "Навіщо знати алфавіт", "p": ["За алфавітом розміщені слова в словниках, прізвища в списках, книжки в бібліотеці. Якщо перші букви однакові — порівнюють другі, треті тощо."]}, {"h": "Звук [ґ] і буква ґ", "p": ["[ґ] — дзвінкий проривний (як англ. g), [г] — гортанний. Запам'ятай слова з ґ: <i>ґанок, ґудзик, ґрунт, ґава, ґуля, ґазда, аґрус, дзиґа, ґрати, ґречний, ґніт, ґелґотати, ґедзь</i>."], "note": "Різні слова: <i>грати</i> (на гітарі) — <i>ґрати</i> (у вікні), <i>гніт</i> (тиск) — <i>ґніт</i> (у свічці)."}], "remember": "Графіка вивчає букви. В алфавіті 33 букви; за алфавітом — словники й списки. Слова з ґ: ґанок, ґудзик, ґрунт, ґава, ґуля, аґрус, дзиґа, ґрати, ґречний.", "cards": [{"f": "Графіка", "b": "Розділ науки про мову, що вивчає букви та знаки письма."}, {"f": "Алфавіт", "b": "Усі букви мови в усталеному порядку. В українському — 33."}, {"f": "Які букви не позначають звука?", "b": "Ь (м'який знак)."}, {"f": "Слова з ґ", "b": "Ґанок, ґудзик, ґрунт, ґава, ґуля, аґрус, дзиґа, ґрати, ґречний, ґніт."}, {"f": "Грати чи ґрати?", "b": "Грати — на інструменті; ґрати — у вікні."}, {"f": "Яка буква йде після Ґ? після Ї?", "b": "Після Ґ — Д; після Ї — Й."}], "quiz": [{"t": "choice", "q": "Що вивчає графіка?", "o": ["Звуки мови", "Букви та знаки письма", "Наголос"], "a": 1, "e": "Графіка — про букви."}, {"t": "input", "q": "Скільки букв в українському алфавіті? Напиши число.", "a": ["33", "тридцять три"], "e": "33."}, {"t": "choice", "q": "Яка буква не позначає жодного звука?", "o": ["Ї", "Ь", "Й"], "a": 1, "e": "Ь лише позначає м'якість попереднього приголосного."}, {"t": "choice", "q": "Яке слово пишемо з ґ?", "o": ["..анок", "..олова", "..ора"], "a": 0, "e": "Ґанок. Голова, гора — з г."}, {"t": "choice", "q": "«… на гітарі» — грати чи ґрати?", "o": ["грати", "ґрати"], "a": 0, "e": "Грати на гітарі; ґрати — металева решітка."}, {"t": "choice", "q": "Розстав за алфавітом: «сонце, слово, сіль».", "o": ["сіль, слово, сонце", "слово, сіль, сонце", "сонце, слово, сіль"], "a": 0, "e": "Перша буква однакова, порівнюємо другі: і, л, о."}, {"t": "choice", "q": "Яка буква стоїть в алфавіті після Ї?", "o": ["І", "Й", "К"], "a": 1, "e": "…І, Ї, Й, К…"}, {"t": "tf", "q": "Буква ґ позначає той самий звук, що й г.", "a": false, "e": "Ні, [ґ] — проривний, [г] — гортанний; це різні звуки."}, {"t": "input", "q": "Як правильно: «..удзик»? Напиши слово.", "a": ["ґудзик"], "e": "Ґудзик — з ґ."}, {"t": "choice", "q": "Де в житті потрібно знати алфавіт?", "o": ["Щоб знайти слово в словнику", "Щоб рахувати склади", "Щоб ставити наголос"], "a": 0, "e": "Словники, списки, каталоги впорядковані за алфавітом."}]}, {"id": "fon-ya-yu-ye-apostrof", "sec": "Фонетика. Графіка. Орфоепія", "title": "Букви я, ю, є, ї, щ. Правила вживання апострофа", "goal": "Ти знаєш, коли я, ю, є, ї позначають два звуки, і правильно ставиш апостроф.", "learn": [{"h": "Скільки звуків позначають я, ю, є, ї", "p": ["<b>Два звуки</b> [йа], [йу], [йе], [йі]: на початку слова (<i>яма, юнак, єнот</i>), після голосного (<i>моя, малює</i>), після апострофа (<i>м'яч, б'ю</i>), після м'якого знака (<i>мільйон</i> — там й окремо).", "<b>Один звук</b> [а], [у], [е] + м'якість попереднього приголосного: <i>ляля</i> [л'ал'а], <i>синє</i>, <i>люди</i>.", "Буква <b>ї</b> завжди два звуки [йі]. Буква <b>щ</b> завжди два звуки [шч]."]}, {"h": "Апостроф ставимо", "p": ["Перед <b>я, ю, є, ї</b>:", "1. Після <b>б, п, в, м, ф</b>: <i>б'ю, п'ять, в'юн, м'ята, Стеф'юк</i>.", "2. Після <b>р</b> у кінці складу (коли р твердий): <i>бур'ян, пір'я, подвір'я, матір'ю</i>.", "3. Після префіксів на приголосний: <i>з'їзд, під'їхати, роз'яснити, об'єднати</i>.", "4. Після <b>к</b> у слові <i>Лук'ян</i> та похідних."], "note": "Апостроф — знак, що приголосний твердий, а далі чуємо [й]: м'яч [мйач]."}, {"h": "Апостроф НЕ ставимо", "p": ["1. Якщо перед б, п, в, м, ф стоїть інший приголосний (крім р), що належить до кореня: <i>свято, цвях, тьмяний, дзвякнути, мавпячий</i>.", "2. Після р, коли він м'який: <i>рясний, буряк, Рєпін, крюк</i>.", "3. Після губних у деяких запозиченнях: <i>бюро, пюре, бюджет</i>."]}], "remember": "Я, ю, є = два звуки на початку слова, після голосного, апострофа, ь; = один звук + м'якість після приголосного. Ї і щ — завжди два звуки. Апостроф після б, п, в, м, ф (м'яч), р твердого (бур'ян), префіксів (з'їзд). Не ставимо: свято, цвях, буряк, рясний, бюро.", "cards": [{"f": "Коли я, ю, є — два звуки?", "b": "На початку слова (яма), після голосного (моя), після апострофа (м'яч), після ь (мільйон)."}, {"f": "Коли я, ю, є — один звук?", "b": "Після приголосного: позначають голосний і м'якість — ляля, люди, синє."}, {"f": "Скільки звуків позначає ї? щ?", "b": "Завжди два: ї = [йі], щ = [шч]."}, {"f": "Апостроф після б, п, в, м, ф", "b": "Ставимо перед я, ю, є, ї: м'яч, п'ять, в'юн, б'ю."}, {"f": "Апостроф після р", "b": "Коли р твердий: бур'ян, пір'я. Не ставимо, коли м'який: буряк, рясний."}, {"f": "Апостроф після префіксів", "b": "З'їзд, під'їхати, роз'яснити, об'єднати."}, {"f": "Свято, цвях, тьмяний", "b": "Без апострофа: перед губним стоїть інший приголосний кореня."}], "quiz": [{"t": "choice", "q": "Скільки звуків позначає я в слові «яблуко»?", "o": ["Один", "Два"], "a": 1, "e": "На початку слова я = [йа]."}, {"t": "choice", "q": "Скільки звуків позначає я в слові «ляля»?", "o": ["Один", "Два"], "a": 0, "e": "Після приголосного я = [а] + м'якість л."}, {"t": "choice", "q": "Скільки звуків у слові «щука»?", "o": ["4", "5", "3"], "a": 1, "e": "[шчука] — щ це два звуки, разом 5."}, {"t": "choice", "q": "Де потрібен апостроф?", "o": ["св..ято", "м..яч", "бур..як"], "a": 1, "e": "М'яч: після м перед я. Свято — перед в є с; буряк — р м'який."}, {"t": "choice", "q": "Де потрібен апостроф?", "o": ["р..ясний", "бур..ян", "р..юкзак"], "a": 1, "e": "Бур'ян: р твердий у кінці складу. Рясний, рюкзак — р м'який."}, {"t": "choice", "q": "Як правильно?", "o": ["зїзд", "з'їзд"], "a": 1, "e": "Після префікса на приголосний перед ї — апостроф."}, {"t": "tf", "q": "У слові «цвях» потрібен апостроф.", "a": false, "e": "Ні: перед в стоїть ц, що належить до кореня."}, {"t": "input", "q": "Напиши слово правильно: «п..ять».", "a": ["п'ять", "п’ять"], "e": "П'ять — після п перед я апостроф."}, {"t": "choice", "q": "Як правильно?", "o": ["під'їхати", "підїхати"], "a": 0, "e": "Префікс під- + їхати → апостроф."}, {"t": "choice", "q": "Як правильно?", "o": ["б'юро", "бюро"], "a": 1, "e": "Бюро — запозичене слово, ю пом'якшує б, апострофа немає."}]}, {"id": "fon-sklad-perenos", "sec": "Фонетика. Графіка. Орфоепія", "title": "Склад. Правила перенесення слів", "goal": "Ти ділиш слова на склади і правильно переносиш їх з рядка в рядок.", "learn": [{"h": "Склад", "p": ["<span class='term'>Склад</span> — частина слова з одним голосним звуком. Скільки голосних — стільки складів: <i>кни-га</i> (2), <i>о-лі-вець</i> (3), <i>дім</i> (1)."], "ex": ["<b>Відкритий</b> склад закінчується на голосний: <i>ма-ма</i>. <b>Закритий</b> — на приголосний: <i>дім, стіл-ець</i>.", "Склад із наголосом — <b>наголошений</b>, інші — ненаголошені."]}, {"h": "Правила перенесення", "p": ["1. Переносимо по складах: <i>кни-га, ма-ши-на</i>.", "2. Одну букву не залишаємо в рядку і не переносимо: <i>яма, олія, її</i> — не переносяться; <i>ака-де-мія</i>.", "3. Не розриваємо <b>дж, дз</b> (один звук): <i>хо-джу, ґу-дзик</i>. Але на межі префікса й кореня можна: <i>під-звітний</i>.", "4. Апостроф, ь, й не відриваємо від попередньої букви: <i>бур'-ян, низь-ко, бай-ка</i>.", "5. Подвоєні букви можна розривати: <i>жит-тя</i> або <i>жи-ття</i>.", "6. Не розриваємо скорочення, ініціали й прізвище, число та одиницю: <i>Т. Шевченко, 2026 р., 5 км</i>."], "note": "Односкладові слова не переносяться: <i>дім, сніг, друг</i>."}], "remember": "Склад = один голосний. Переносимо по складах; одну букву не залишаємо (о-лія ✗); дж, дз, ь, й, апостроф не відриваємо (хо-джу, низь-ко, бай-ка, бур'-ян); подвоєні можна ділити (жит-тя).", "cards": [{"f": "Склад", "b": "Частина слова з одним голосним звуком. Скільки голосних — стільки складів."}, {"f": "Відкритий і закритий склад", "b": "Відкритий закінчується на голосний (ма-ма), закритий — на приголосний (дім)."}, {"f": "Чи можна перенести «олія»?", "b": "Ні: одну букву не залишають і не переносять."}, {"f": "Перенесення слова «ходжу»", "b": "Хо-джу: дж не розриваємо (один звук)."}, {"f": "Перенесення «байка», «низько», –зі</b>."]}, {"h": "У — В", "p": ["<b>У</b> пишемо: між приголосними (<i>прийшов <b>у</b> клас</i>), на початку речення перед приголосним (<i><b>У</b> лісі тихо</i>), перед в, ф, льв, св, тв, хв (<i><b>у</b> вікні, <b>у</b> Львові, <b>у</b> свято</i>).", "<b>В</b> пишемо: між голосними (<i>була <b>в</b> Одесі</i>), на початку речення перед голосним (<i><b>В</b> Одесі тепло</i>), після голосного перед приголосним (<i>пішла <b>в</b> ліс</i>)."], "note": "Те саме для дієслів і прийменників: <i>учитель — вчитель, уже — вже, усе — все</i>."}, {"h": "І — Й", "p": ["<b>І</b>: між приголосними (<i>брат <b>і</b> сестра</i>), на початку речення (<i><b>І</b> сонце зійшло</i>), після паузи.", "<b>Й</b>: між голосними (<i>Оля <b>й</b> Іра</i>), після голосного перед приголосним (<i>небо <b>й</b> земля</i>).", "Перед й, я, ю, є, ї завжди <b>і</b>: <i>дощ <b>і</b> яблука</i>."]}, {"h": "З — ІЗ — ЗІ", "p": ["<b>З</b>: перед голосним (<i>з Одеси</i>) і перед приголосним після голосного (<i>прийшла з школи</i> → краще <i>зі школи</i>).", "<b>Із</b>: між приголосними (<i>вийшов <b>із</b> дому</i>).", "<b>Зі</b>: перед з, с, ш, щ + приголосний (<i><b>зі</b> школи, <b>зі</b> мною, <b>зі</b> сходу</i>)."]}], "remember": "У / і — між приголосними й на початку речення перед приголосним. В / й — між голосними, після голосного. Перед в, ф, св, тв, хв — у. Зі — перед з, с, ш, щ (зі школи), із — між приголосними.", "cards": [{"f": "Коли пишемо у?", "b": "Між приголосними, на початку речення перед приголосним, перед в, ф, св, тв, хв, льв."}, {"f": "Коли пишемо в?", "b": "Між голосними, після голосного перед приголосним, на початку речення перед голосним."}, {"f": "Коли пишемо й?", "b": "Між голосними і після голосного перед приголосним: Оля й Іра, небо й земля."}, {"f": "Коли завжди і?", "b": "Перед й, я, ю, є, ї і на початку речення: дощ і яблука."}, {"f": "Зі — коли?", "b": "Перед з, с, ш, щ + приголосний: зі школи, зі мною."}, {"f": "Із — коли?", "b": "Між приголосними: вийшов із дому."}], " ути"]}, {"h": "Винятки — спрощення немає", "p": ["<i>кістлявий, пестливий, хвастливий, хворостняк, зап'ястний, шістнадцять, шістсот, шістдесят</i>.", "У словах іншомовного походження: <i>студентський, туристський, агентство, контрастний, баластний, компостний, форпостний</i>."], "note": "Шістнадцять пишемо з т, хоч не вимовляємо."}], "remember": "Спрощення: ждн→жн, здн→зн, стн→сн, стл→сл, слн→сн, рдц→рц (тижневий, чесний, щасливий, серце). Винятки: кістлявий, пестливий, хвастливий, шістнадцять, студентський, агентство, контрастний.", "cards": [{"f": "Спрощення", "b": "Випадання середнього приголосного з групи трьох: честь → чесний."}, {"f": "стн → сн", "b": "Радість → радісний, честь → чесний, вість → вісник."}, {"f": "ждн → жн, здн → зн", "b": "Тиждень → тижневий, проїзд → проїзний."}, {"f": "стл → сл", "b": "Щастя → щасливий."}, {"f": "Винятки (спрощення немає)", "b": "Кістлявий, пестливий, хвастливий, шістнадцять, зап'ястний."}, {"f": "Іншомовні винятки", "b": "Студентський, туристський, агентство, контрастний."}], "quiz": [{"t": "choice", "q": "Як правильно?", "o": ["чесний", "честний"], "a": 0, "e": "Стн → сн: чесний."}, {"t": "choice", "q": "Як правильно?", "o": ["тиждневий", "тижневий"], "a": 1, "e": "Ждн → жн."}, {"t": "choice", "q": "Як правильно?", "o": ["щастливий", "щасливий"], "a": 1, "e": "Стл → сл."}, {"t": "choice", "q": "У якому слові спрощення НЕ відбувається?", "o": ["радіс..ний", "шіс..надцять", "проїз..ний"], "a": 1, "e": "Шістнадцять — виняток, т зберігається."}, {"t": "choice", "q": "Як правильно?", "o": ["студентський", "студенський"], "a": 0, "e": "Іншомовне слово — виняток, спрощення немає."}, {"t": "tf", "q": "У слові «серце» відбулося спрощення (рдц → рц).", "a": true, "e": "Так: серденько — серце."}, {"t": "input", "q": "Утвори прикметник від «вість» (звістка): «…ник» — напиши слово.", "a": ["вісник"], "e": "Вість → вісник (стн → сн)."}, {"t": "choice", "q": "Як правильно?", "o": ["пестливий", "песливий"], "a": 0, "e": "Пестливий — виняток."}, {"t": "choice", "q": "Як правильно?", "o": ["контрастний", "контрасний"], "a": 0, "e": "Іншомовне — спрощення немає."}, {"t": "input", "q": "Утвори прикметник від слова «масло»: … (жирний).", "a": ["масний"], "e": "Масло → масний (слн → сн)."}]}, {"id": "orf-cherhuvannia-hol", "sec": "Фонетика. Графіка. Орфоепія", "title": "Чергування голосних о, е з і; е з и", "goal": "Ти знаєш, коли о, е чергуються з і та коли е чергується з и.", "learn": [{"h": "О, Е — І", "p": ["<b>О, е</b> у відкритому складі чергуються з <b>і</b> у закритому:"], "ex": ["н<b>о</b>-га — н<b>і</b>г, ст<b>о</b>-ла — ст<b>і</b>л", "п<b>е</b>-чі — п<b>і</b>ч, ш<b>е</b>-сти — ш<b>і</b>сть", "Ки-<b>є</b>-ва — Ки-<b>ї</b>в"], "note": "Не чергуються у деяких словах: <i>народ, лоб, сон, день</i> (там о, е випадні)."}, {"h": "Е — О після шиплячих та й", "p": ["Після <b>ж, ч, ш, щ, дж, й</b> пишемо <b>е</b> перед м'яким приголосним і перед складом з е, и: <i>вечеря, четвертий, щебетати</i>.", "Пишемо <b>о</b> перед твердим приголосним і перед складом з а, о, у, и (з и): <i>жонатий, чотири, пшоно, чоловік, шостий</i>."], "ex": ["в<b>е</b>чері — веч<b>о</b>ра; ч<b>е</b>тверо — ч<b>о</b>тири"]}, {"h": "Е — И у коренях дієслів", "p": ["<b>Е</b> чергується з <b>и</b> перед наголошеним суфіксом <b>-а-</b>: <i>бер<b>у</b> — збир<b>а</b>ти, стел<b>ю</b> — застил<b>а</b>ти, тер — витир<b>а</b>ти, дер — здир<b>а</b>ти, мер — вмир<b>а</b>ти</i>."]}, {"h": "Е — І у дієсловах", "p": ["<i>плет<b>у</b> — заплітати, мест<b>и</b> — замітати, лет<b>і</b>ти — літати, чекати — очікувати</i> (е → і перед наголошеним -а-, -ува-)."]}], "remember": "О, е у відкритому складі → і в закритому: нога — ніг, піч — печі. Після шиплячих: е перед м'яким/е, и (вечеря), о перед твердим/а, о, у (чотири). У дієсловах е → и перед наголошеним -а-: беру — збирати.", "cards": [{"f": "Чергування о, е з і", "b": "У закритому складі і, у відкритому о, е: ніг — нога, піч — печі."}, {"f": "Після ж, ч, ш, щ, й: е чи о?", "b": "Е перед м'яким або ових:"], "ex": ["<b>г — ж — з</b>: но<b>г</b>а — ні<b>ж</b>ка — на но<b>з</b>і; дру<b>г</b> — дру<b>ж</b>ба — дру<b>з</b>і", "<b>к — ч — ц</b>: ру<b>к</b>а — ру<b>ч</b>ка — у ру<b>ц</b>і; пе<b>к</b>ти — пе<b>ч</b>у", "<b>х — ш — с</b>: ву<b>х</b>о — ву<b>ш</b>ко — у ву<b>с</b>і; му<b>х</b>а — му<b>ш</b>ка — му<b>с</b>і"], "note": "Ж, ч, ш — перед е, і (кличний відмінок, дієслова); з, ц, с — у давальному й місцевому відмінках (на нозі, у руці)."}, {"h": "Префікс з- / с-", "p": ["<b>С-</b> пишемо перед <b>к, п, т, ф, х</b> (запам'ятай: <b>КаФе «ПТаХ»</b>): <i>сказати, спитати, стерти, сфотографувати, сховати</i>.", "<b>З-</b> — перед усіма іншими: <i>зробити, збити, зшити, зсунути, зцідити</i>.", "<b>Зі-</b> (зо-) — перед збігом приголосних: <i>зібрати, зігнути, зійти, зомліти</i>."]}, {"h": "Префікси роз-, без-", "p": ["Завжди з <b>з</b>, незалежно від вимови: <i>розказати, розпитати, розчесати, безпечний, безхмарний, безкраїй</i>.", "Перед збігом приголосних — <b>розі-</b>: <i>розібрати, розігнати</i>."]}], "remember": "Г–ж–з, к–ч–ц, х–ш–с: нога — ніжка — нозі, рука — ручка — руці, вухо — вушко — вусі. С- перед к, п, т, ф, х (КаФе «ПТаХ»): сказати, спитати. Роз-, без- завжди з з: розпитати, безпечний.", "cards": [{"f": "Г — ж — з", "b": "Нога — ніжка — на нозі; друг — дружба — друзі."}, {"f": "К — ч — ц", "b": "Рука — ручка — у руці; пекти — печу."}, {"f": "Х — ш — с", "b": "Вухо — вушко — у вусі; муха — мушка — мусі."}, {"f": "Коли префікс с-?", "b": "Перед к, п, т, ф, х (КаФе «ПТаХ»): сказати, спитати, стерти, сховати."}, {"f": "Коли префікс з-?", "b": "Перед іншими приголосними й голосними: зробити, зшити, зорати."}, {"f": "Роз-, без- перед глухими", "b": "Завжди з: розпитати, розказати, безпечний."}], "quiz": [{"t": "choice", "q": "«Нога — на но..і» — яку букву?", "o": ["г", "ж", "з"], "a": 2, "e": "У місцевому відмінку г → з: на нозі."}, {"t": "choice", "q": "«Рука — ру..ка» (маленька) — яку букву?", "o": ["к", "ч", "ц"], "a": 1, "e": "Ручка: к → ч."}, {"t": "i
