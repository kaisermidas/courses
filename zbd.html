<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Здоров'я і безпека · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>

const COURSE = {"id": "zbd5", "title": "Здоров'я і безпека", "subtitle": "5 клас · 12 уроків за підручниками Поліщук і Василенка", "lessons": [{"id": "zb-zdorovia-skladnyky", "sec": "Моє здоров'я", "title": "Що таке здоров'я. Складники здоров'я. Здоровий спосіб життя", "goal": "Ти знаєш визначення здоров'я, його складники і правила здорового способу життя.", "learn": [{"h": "Здоров'я", "p": ["<span class='term'>Здоров'я</span> (за ВООЗ) — стан повного <b>фізичного, психічного й соціального</b> благополуччя, а не лише відсутність хвороб. Здоров'я — найбільша цінність, його легше берегти, ніж повертати."]}, {"h": "Складники здоров'я", "p": ["<b>Фізичне</b> — тіло: сила, витривалість, відсутність хвороб. <b>Психічне (емоційне)</b> — настрій, уміння керувати емоціями, впевненість. <b>Соціальне</b> — стосунки з людьми, дружба, місце в колективі. <b>Духовне</b> — цінності, мета, совість. Усі складники пов'язані: сварка (соціальне) → стрес (психічне) → головний біль (фізичне)."]}, {"h": "Що впливає на здоров'я", "p": ["Спосіб життя — <b>50%</b>, спадковість — 20%, довкілля — 20%, медицина — 10%. Тобто найбільше залежить від нас."]}, {"h": "Здоровий спосіб життя", "p": ["<b>Режим дня</b>, <b>сон 9–10 годин</b>, <b>рух</b> — щонайменше 60 хвилин на день, <b>здорове харчування</b>, <b>гігієна</b>, <b>загартування</b>, свіже повітря, <b>без шкідливих звичок</b> (куріння, алкоголь, енергетики, надмір гаджетів), позитивні емоції, друзі."]}], "remember": "Здоров'я — фізичне, психічне й соціальне благополуччя. Складники: фізичне, психічне, соціальне, духовне. Спосіб життя — 50% здоров'я. ЗСЖ: режим, сон 9–10 год, рух 60 хв, харчування, гігієна, без шкідливих звичок.", "cards": [{"f": "Здоров'я (за ВООЗ)", "b": "Стан повного фізичного, психічного й соціального благополуччя, а не лише відсутність хвороб."}, {"f": "Складники здоров'я", "b": "Фізичне, психічне (емоційне), соціальне, духовне."}, {"f": "Соціальне здоров'я", "b": "Стосунки з людьми, дружба, місце в колективі."}, {"f": "Від чого здоров'я залежить найбільше?", "b": "Від способу життя — на 50%."}, {"f": "Скільки треба рухатись щодня?", "b": "Не менше 60 хвилин."}, {"f": "Скільки спати п'ятикласнику?", "b": "9–10 годин."}, {"f": "Шкідливі звички", "b": "Куріння, алкоголь, енергетики, надмір гаджетів, пізній сон."}], "quiz": [{"t": "choice", "q": "Здоров'я — це…", "o": ["відсутність хвороб", "фізичне, психічне й соціальне благополуччя", "сильні м'язи"], "a": 1, "e": "Визначення ВООЗ."}, {"t": "choice", "q": "Дружба й стосунки з людьми — це здоров'я…", "o": ["фізичне", "соціальне", "духовне"], "a": 1, "e": "Соціальне."}, {"t": "choice", "q": "Уміння керувати емоціями — здоров'я…", "o": ["психічне", "фізичне", "соціальне"], "a": 0, "e": "Психічне (емоційне)."}, {"t": "choice", "q": "Від чого здоров'я залежить найбільше?", "o": ["Від лікарів", "Від способу життя", "Від погоди"], "a": 1, "e": "50% — спосіб життя."}, {"t": "choice", "q": "Скільки хвилин руху потрібно щодня?", "o": ["10", "60", "300"], "a": 1, "e": "Не менше години."}, {"t": "choice", "q": "Скільки годин сну потрібно в 10–11 років?", "o": ["6–7", "9–10", "12–14"], "a": 1, "e": "9–10 годин."}, {"t": "choice", "q": "Що НЕ належить до здорового способу життя?", "o": ["Загартування", "Енергетики", "Режим дня"], "a": 1, "e": "Енергетики шкідливі."}, {"t": "tf", "q": "Складники здоров'я не пов'язані між собою.", "a": false, "e": "Стрес впливає на тіло і навпаки."}, {"t": "input", "q": "Скільки складників здоров'я? Напиши число.", "a": ["4", "чотири"], "e": "Фізичне, психічне, соціальне, духовне."}]}, {"id": "zb-rezhym-navchannia", "sec": "Моє здоров'я", "title": "Режим дня. Як навчатись ефективно. Пошук і перевірка інформації", "goal": "Ти знаєш, як скласти режим дня, як учитись ефективно і як відрізнити факт від фейку.", "learn": [{"h": "Режим дня", "p": ["<span class='term'>Режим дня</span> — розпорядок сну, їжі, навчання, руху, відпочинку. Підйом в один час; сніданок обов'язково; уроки — після відпочинку 1–1,5 год, не пізно ввечері; прогулянка щодня; гаджети — не більше 2 годин і не перед сном; сон о 21:30–22:00. <b>Комфортний освітній простір</b>: світло зліва, рівна спина, стіл і стілець по зросту, порядок, тиша."]}, {"h": "Навчатись ефективно", "p": ["Ставити <b>ціль</b> уроку; починати з важчого; вчити частинами з перервами (25 хв робота — 5 хв відпочинок); <b>повторювати</b> (через день, тиждень); переказувати своїми словами; малювати схеми; вчити інших; не відкладати. Помилка — це підказка, чого ще не вмієш. <b>Пам'ять</b> краща після сну і руху."]}, {"h": "Інформація і фейки", "p": ["<b>Факт</b> — можна перевірити. <b>Думка</b> — чиясь оцінка. <b>Фейк</b> — неправдива інформація, поширена як правда. Ознаки фейку: гучний заголовок, немає автора й джерела, заклик «терміново поширюй», помилки, надто емоційно. Перевірка: хто автор? яке джерело? чи є в інших надійних джерелах? яка дата? <b>Критичне мислення</b> — не вірити на слово, а перевіряти."]}], "remember": "Режим: підйом в один час, сніданок, уроки після відпочинку, рух, гаджети ≤ 2 год, сон о 22:00. Учитись: ціль, частинами з перервами, повторення, переказ. Фейк — неправда як правда; перевіряй автора, джерело, інші джерела, дату.", "cards": [{"f": "Режим дня", "b": "Розпорядок сну, їжі, навчання, руху й відпочинку."}, {"f": "Комфортне робоче місце", "b": "Світло зліва, рівна спина, меблі по зросту, порядок, тиша."}, {"f": "Скільки часу на гаджети?", "b": "Не більше 2 годин на день і не перед сном."}, {"f": "Правило 25/5", "b": "25 хвилин роботи — 5 хвилин відпочинку."}, {"f": "Найкращий спосіб запам'ятати", "b": "Повторювати через час і переказувати своїми словами."}, {"f": "Фейк", "b": "Неправдива інформація, поширена як правда."}, {"f": "Як перевірити інформацію?", "b": "Хто автор, яке джерело, чи є в інших надійних джерелах, яка дата."}, {"f": "Критичне мислення", "b": "Не вірити на слово, а перевіряти."}], "quiz": [{"t": "choice", "q": "Коли краще робити домашнє завдання?", "o": ["Одразу після школи", "Після відпочинку 1–1,5 режися: оцінюй ризик — «що може статися і як цього уникнути?»"}, {"h": "Служби порятунку", "p": ["<b>101</b> — пожежна/рятувальники (ДСНС); <b>102</b> — поліція; <b>103</b> — швидка; <b>104</b> — газ; <b>112</b> — єдиний номер (з будь-якого телефону). Що казати: <b>що сталось, де (адреса), хто постраждав, своє ім'я</b>; не класти слухавку першим."]}, {"h": "Алгоритм у небезпеці", "p": ["1) <b>Зупинись</b> і оціни. 2) <b>Не панікуй</b>. 3) <b>Відійди</b> від небезпеки. 4) <b>Поклич дорослих</b> / зателефонуй у службу. 5) Дій за правилами. Не геройствуй: головне — твоє життя."]}, {"h": "Воєнна безпека", "p": ["Сигнал <b>«Повітряна тривога»</b> → в укриття (правило двох стін), не біля вікон. Не чіпати незнайомі предмети (можуть бути міни, «пелюстки») — відійти й повідомити 101/102. Не фотографувати військових об'єктів. Мати «тривожну валізку»: документи, вода, ліхтарик, зарядка, ліки."]}], "remember": "Небезпека — може завдати шкоди; ризик — імовірність. Види: природні, техногенні, соціальні, воєнні. 101 пожежна, 102 поліція, 103 швидка, 104 газ, 112 єдиний. Алгоритм: зупинись → не панікуй → відійди → поклич дорослих. Тривога — укриття, дві стіни; незнайомі предмети не чіпати.", "cards": [{"f": "Безпека / небезпека / ризик", "b": "Нічого не загрожує / те, що може зашкодити / імовірність небезпеки."}, {"f": "101", "b": "Пожежна й рятувальна служба (ДСНС)."}, {"f": "102", "b": "Поліція."}, {"f": "103", "b": "Швидка медична допомога."}, {"f": "104", "b": "Аварійна газова служба."}, {"f": "112", "b": "Єдиний номер екстрених служб."}, {"f": "Що казати диспетчеру?", "b": "Що сталось, де (адреса), хто постраждав, своє ім'я."}, {"f": "Правило двох стін", "b": "Під час тривоги — в місці, де між тобою і вулицею дві стіни, без вікон."}, {"f": "Знайшов незнайомий предмет (можливо, міну)", "b": "Не чіпати, відійти, повідомити дорослих і 101/102."}], "quiz": [{"t": "choice", "q": "Пожежа. Який номер?", "o": ["101", "102", "103"], "a": 0, "e": "101 — рятувальники."}, {"t": "choice", "q": "Людині погано, потрібен лікар. Номер?", "o": ["101", "102", "103"], "a": 2, "e": "103 — швидка."}, {"t": "choice", "q": "Запах газу в квартирі. Номер?", "o": ["104", "103", "101"], "a": 0, "e": "104 — газова служба; не вмикати світло!"}, {"t": "choice", "q": "Єдиний номер екстрених служб —", "o": ["112", "911", "100"], "a": 0, "e": "112."}, {"t": "choice", "q": "Що НАЙВАЖЛИВІШЕ сказати диспетчеру?", "o": ["Свій вік", "Що сталось і адресу", "Погоду"], "a": 1, "e": "Що і де."}, {"t": "choice", "q": "Гроза, повінь — небезпеки…", "o": ["природні", "техногенні", "соціальні"], "a": 0, "e": "Природні."}, {"t": "choice", "q": "Витік газу, пожежа на заводі — небезпеки…", "o": ["природні", "техногенні", "соціальні"], "a": 1, "e": "Техногенні — від техніки."}, {"t": "choice", "q": "Перший крок у небезпеці:", "o": ["Бігти", "Зупинитись і оцінити", "Кричати"], "a": 1, "e": "Не панікувати."}, {"t": "choice", "q": "Сигнал повітряної тривоги. Що робити?", "o": ["Іти в укриття", "Дивитись у вікно", "Продовжувати гуляти"], "a": 0, "e": "Правило двох стін."}, {"t": "choice", "q": "Ти знайшов дивний предмет на дорозі. Що робити?", "o": ["Підняти й роздивитись", "Не чіпати, відійти, повідомити дорослим", "Штовхнути ногою"], "a": 1, "e": "Може бути вибухонебезпечним."}]}, {"id": "zb-pishokhid", "sec": "Моя безпека", "title": "Я — пішохід. Дорожній рух", "goal": "Ти знаєш правила пішохода, сигнали світлофора і головні дорожні знаки.", "learn": [{"h": "Учасники руху", "p": ["<b>Пішоходи</b>, <b>пасажири</b>, <b>водії</b>, велосипедисти. Правила дорожнього руху (<b>ПДР</b>) обов'язкові для всіх. <b>Регулювальник</b> — головніший за світлофор і знаки."]}, {"h": "Правила пішохода", "p": ["Ходити <b>тротуаром</b>; де немає — <b>узбіччям назустріч транспорту</b>. Переходити дорогу тільки на <b>пішохідному переході</b> («зебра», підземний, надземний) на <b>зелений</b>. Перед переходом: зупинись → подивись <b>ліворуч</b> → <b>праворуч</b> → знову ліворуч → переходь. Не вибігати з-за автобуса чи машини. Не переходити перед транспортом, що близько. У темряві — <b>світловідбивачі (флікери)</b>. Навушники й телефон — прибрати."]}, {"h": "Світлофор і знаки", "p": ["<b>Червоний</b> — стій; <b>жовтий</b> — чекай; <b>зелений</b> — іди; миготливий зелений — закінчуй перехід. Пішохідний світлофор — фігурка. Знаки: <b>трикутні</b> — попереджувальні («Діти»); <b>круглі з червоною облямівкою</b> — заборонні («Рух пішоходів заборонено»); <b>сині круглі</b> — наказові («Пішохідна доріжка»); <b>сині квадратні</b> — інформаційні («Пішохідний перехід», «Підземний перехід»)."]}, {"h": "Дорога і погода", "p": ["Гальмівний шлях авто на мокрій дорозі й ожеледиці — у кілька разів довший. Узимку — тепліший одяг, але не закривати огляд капюшоном. Не грати біля дороги, не кататись на самокаті на проїжджій частині."]}], "remember": "Ходити тротуаром, узбіччям — назустріч транспорту. Перехід: ліворуч → праворуч → ліворуч, тільки на зелений, на «зебрі». Флікери в темряві. Знаки: трикутні — попередження, круглі червоні — заборона, сині — наказ/інформація. Регулювальник головніший за світлофор.", "cards": [{"f": "Де ходити, якщо немає тротуару?", "b": "Узбіччям назустріч транспорту."}, {"f": "Куди дивитись перед переходом?", "b": "Ліворуч → праворуч → знову ліворуч."}, {"f": "Флікер", "b": "Світловідбивач на одязі, щоб водії бачили в темряві."}, {"f": "Трикутні знаки", "b": "Попереджувальні: «Діти», «Слизька дорога»."}, {"f": "Круглі з червоною облямівкою", "b": "Заборонні."}, {"f": "Сині квадратні знаки", "b": "Інформаційно-вказівні: «Пішохідний перехід»."}, {"f": "Хто головніший: світлофор чи регулювальник?", "b": "Регулювальник."}, {"f": "Види пішохідних переходів", "b": "Наземний («зебра»), підземний, надземний."}], "quiz": [{"t": "choice", "q": "Немає тротуару. Як іти узбіччям?", "o": ["За рухом транспорту", "Назустріч транспорту", "Як зручно"], "a": 1, "e": "Щоб бачити машини."}, {"t": "choice", "q": "Куди дивитись першим перед переходом?", "o": ["Праворуч", "Ліворуч", "Уперед"], "a": 1, "e": "Звідти їдуть машини на твоїй смузі."}, {"t": "choice", "q": "Що означає жовтий сигнал?", "o": ["Іди", "Чекай, готуйся", "Біжи швидше"], "a": 1, "e": "Жовтий — чекай."}, {"t": "choice", "q": "Трикутний знак із дітьми означає…", "o": ["Школа поруч, водію бути уважним", "Дітям заборонено", "Дитячий майданчик"], "a": 0, "e": "Попереджувальний знак «Діти»."}, {"t": "choice", "q": "Круглий знак із червоною облямівкою — це знак…", "o": ["заборонний", "інформаційний", "наказовий"], "a": 0, "e": "Заборона."}, {"t": "choice", "q": "Навіщо флікер?", "o": ["Для краси", "Щоб водії бачили пішохода в темряві", "Щоб не змерзнути"], "a": 1, "e": "Світловідбивач."}, {"t": "choice", "q": "Автобус зупинився. Як перейти дорогу?", "o": ["Обійти автобус спереду й перейти", "Почекати, поки автобус поїде, і йти до переходу", "Обійти ззаду й бігти"], "a": 1, "e": "Не вибігати з-за транспорту."}, {"t": "choice", "q": "Чому взимку небезпечніше переходити дорогу?", "o": ["Гальмівний шлях довший", "Темніше вранці", "Обидва варіанти"], "a": 2, "e": "Ожеледиця і темрява."}, {"t": "input", "q": "Як називають смугасту розмітку пішохідного переходу?", "a": ["зебра"], "e": "Зебра."}, {"t": "choice", "q": "Що робити з навушниками біля дороги?", "o": ["Зробити тихіше", "Зняти", "Нічого"], "a": 1, "e": "Треба чути транспорт."}]}, {"id": "zb-pasazhyr-velosyped", "sec": "Моя безпека", "title": "Я — пасажир. ДТП. Я — велосипедист", "goal": "Ти знаєш правила поведінки в транспорті, дії під час ДТП і правила велосипедиста.", "learn": [{"h": "Пасажир у транспорті", "p": ["Чекати на зупинці, не на дорозі. Заходити після зупинки, тримаючись за поручні. У салоні не бігати, не висовуватись у вікно. Виходити, коли транспорт зупинився. Обходити автобус/тролейбус — не спереду і не ззаду, а дочекатись, поки поїде. У маршрутці — сидіти або міцно триматись. В авто — <b>пасок безпеки завжди</b>, діти до 12 років (до 145 см) — у дитячому кріслі або бустері, на задньому сидінні."]}, {"h": "ДТП", "p": ["<span class='term'>ДТП</span> — дорожньо-транспортна пригода. Якщо ти в машині: залишайся пристебнутим, не виходь на дорогу без потреби. Якщо свідок: не наближайся до дороги, поклич дорослих, зателефонуй <b>103</b> і <b>102</b>: місце, скільки постраждалих. Не рухати потерпілого без потреби (можлива травма хребта). Увімкнути аварійку, виставити знак — це роблять дорослі."]}, {"h": "Велосипедист", "p": ["На дорозі самостійно — з <b>14 років</b>; до того — тротуаром, велодоріжкою, двором. Обов'язково <b>шолом</b>; справні <b>гальма, дзвінок, світловідбивачі, фари</b>. Пішохідний перехід — <b>злізти й вести велосипед</b>. Не їхати «без рук», не чіплятись за авто, не возити пасажирів на рамі. Сигнали: рука вбік — поворот, рука вгору — зупинка. Самокат, ролики, гіроборд — не на проїжджій частині; шолом і захист."]}], "remember": "Пасажир: чекати на зупинці, триматись, пасок безпеки, дитяче крісло до 12 років/145 см. ДТП: 103 і 102, не рухати потерпілого. Велосипед: на дорозі з 14 років, шолом, справні гальма; на переході — вести пішки.", "cards": [{"f": "Як обходити автобус, що стоїть?", "b": "Не обходити — дочекатись, поки поїде, і йти до переходу."}, {"f": "До якого віку потрібне дитяче автокрісло?", "b": "До 12 років або 145 см зросту."}, {"f": "ДТП", "b": "Дорожньо-транспортна пригода."}, {"f": "Куди дзвонити при ДТП?", "b": "103 (швидка) і 102 (поліція) або 112."}, {"f": "Чи можна рухати потерпілого?", "b": "Без потреби — ні: можлива травма хребта."}, {"f": "З якого віку можна їхати велосипедом по дорозі?", "b": "З 14 років."}, {"f": "Як перетинати перехід на велосипеді?", "b": "Злізти й вести велосипед пішки."}, {"f": "Сигнали велосипедиста", "b": "Рука вбік — поворот; рука вгору — зупинка."}], "quiz": [{"t": "choice", "q": "Де чекати автобус?", "o": ["На дорозі", "На зупинці, подалі від краю", "У кущах"], "a": 1, "e": "На зупинці."}, {"t": "choice", "q": "Пасок безпеки в авто потрібен…", "o": ["тільки на трасі", "завжди", "тільки водію"], "a": 1, "e": "Завжди, усім."}, {"t": "choice", "q": "Дитяче крісло потрібне дітям…", "o": ["до 6 років", "до 12 років або 145 см", "до 18 років"], "a": 1, "e": "За ПДР."}, {"t": "choice", "q": "Ти побачив ДТП з потерпілими. Що робити?", "o": ["Підбігти й перенести їх", "Покликати дорослих і зателефонувати 103/102", "Знімати на телефон"], "a": 1, "e": "Не рухати потерпілих."}, {"t": "choice", "q": "З якого віку дозволено їздити на велосипеді по дорозі?", "o": ["10", "12", "14"], "a": 2, "e": "14 років."}, {"t": "choice", "q": "Як проїхати пішохідний перехід велосипедом?", "o": ["Швидко проїхати", "Злізти й перевести пішки", "Об'їхати по дорозі"], "a": 1, "e": "На переході ти пішохід."}, {"t": "choice", "q": "Що обов'язково для велосипедиста?", "o": ["Шолом", "Навушники", "Пасажир на рамі"], "a": 0, "e": "Шолом і справні гальма."}, {"t": "choice", "q": "Рука велосипедиста вгору означає…", "o": ["Поворот", "Зупинку", "Привітання"], "a": 1, "e": "Зупинка."}, {"t": "tf", "q": "На самокаті можна їхати по проїжджій частині, якщо швидко.", "a": false, "e": "Самокат — тротуар, велодоріжка, двір."}]}, {"id": "zb-naselenyi-punkt-pobut", "sec": "Моя безпека", "title": "Безпека в населеному пункті. Незнайомці. Безпека вдома", "goal": "Ти знаєш правила поведінки з незнайомцями, на вулиці, вдома з електрикою, газом, вогнем.", "learn": [{"h": "Незнайомці", "p": ["<b>Не йти</b> з незнайомим, що б він не обіцяв (цуценя, цукерки, «мама просила»). <b>Не сідати</b> в чужу машину. <b>Не брати</b> подарунків. Тримати дистанцію, кричати «Я вас не знаю!», бігти в людне місце, до поліцейського, продавця, мами з дитиною. Домовитись із батьками про <b>кодове слово</b>. Не казати по телефону чи в мережі, що ти вдома сам. Знати адресу і телефони батьків напам'ять."]}, {"h": "На вулиці", "p": ["Не гуляти в темряві сам; не ходити безлюдними місцями, будівництвом, підвалами, покинутими будинками; не заходити в ліфт із незнайомцем; не чіпати бездомних тварин; повідомляти батькам, куди й з ким ідеш і коли повернешся. Небезпечні місця: люки, трансформаторні будки, водойми без дорослих, крига."]}, {"h": "Електрика і газ", "p": ["Не чіпати розетки й проводи мокрими руками; не тягнути за шнур; не вмикати прилади з пошкодженим кабелем; не користуватись феном у ванні. <b>Запах газу</b>: не вмикати світло й нічого електричного, не запалювати, відкрити вікна, закрити кран, вийти, дзвонити <b>104</b> з вулиці."]}, {"h": "Пожежа", "p": ["Не грати з вогнем, сірниками. При пожежі: <b>не ховатись</b> (шафа, під ліжко), вийти з квартири, закривши двері; повзти під димом, прикривши ніс мокрою тканиною; не користуватись ліфтом; дзвонити <b>101</b>; кликати на допомогу з балкона/вікна. Загорівся одяг — зупинись, падай, качайся. Не гасити водою електроприлади й олію."], "note": "Ліки й побутова хімія — не для дітей; читати етикетки; не змішувати."}], "remember": "Незнайомець: не йти, не сідати в авто, не брати, кричати, бігти до людей; кодове слово. Газ: не вмикати світло, вікна, кран, 104 з вулиці. Пожежа: не ховатись, повзти під димом, без ліфта, 101; одяг горить — стій, падай, качайся.", "cards": [{"f": "Незнайомець кличе з собою. Що робити?", "b": "Не йти, тримати дистанцію, кричати «Я вас не знаю!», бігти до людей."}, {"f": "Кодове слово", "b": "Секретне слово з батьками: хто його не знає — не від них."}, {"f": "Запах газу — перше правило", "b": "Не вмикати світло і нічого електричного, не запалювати вогонь."}, {"f": "Куди дзвонити при запаху газу і звідки?", "b": "104, з вулиці або від сусідів."}, {"f": "Пожежа: як рухатись у димі?", "b": "Повзти низько, прикривши ніс і рот мокрою тканиною."}, {"f": "Чому не можна ховатись під час пожежі?", "b": "Рятувальники не знайдуть; треба вийти й кликати на допомогу."}, {"f": "Загорівся одяг", "b": "Зупинись, падай, качайся."}, {"f": "Чи можна ліфтом при пожежі?", "b": "Ні — може зупинитись і заповнитись димом."}], "quiz": [{"t": "choice", "q": "Незнайомий каже: «Мама просила забрати тебе». Що робити?", "o": ["Іти з ним", "Не йти, перевірити через кодове слово або зателефонувати мамі", "Сісти в машину"], "a": 1, "e": "Не довіряти без перевірки."}, {"t": "choice", "q": "Незнайомець хапає за руку. Що робити?", "o": ["Мовчати", "Голосно кричати «Я вас не знаю!» і бігти до людей", "Плакати"], "a": 1, "e": "Привернути увагу."}, {"t": "choice", "q": "Хтось по телефону питає, чи ти сам удома. Що сказати?", "o": ["Правду", "Що батьки вдома, але зайняті", "Адресу"], "a": 1, "e": "Не розкривати, що сам."}, {"t": "choice", "q": "Пахне газом. Перше, що НЕ можна робити:", "o": ["Відкрити вікно", "Увімкнути світло", "Вийти з квартири"], "a": 1, "e": "Іскра — вибух."}, {"t": "choice", "q": "Куди дзвонити при запаху газу?", "o": ["104", "103", "101"], "a": 0, "e": "104, з вулиці."}, {"t": "choice", "q": "Пожежа, кімната в диму. Як рухатись?", "o": ["Бігти на повний зріст", "Повзти під димом", "Сховатись у шафі"], "a": 1, "e": "Дим угорі."}, {"t": "choice", "q": "Загорівся рукав куртки. Що робити?", "o": ["Бігти", "Зупинитись, упасти, качатись", "Дмухати"], "a": 1, "e": "Біг роздуває вогонь."}, {"t": "choice", "q": "Чи можна гасити водою електроприлад, що горить?", "o": ["Так", "Ні, спершу вимкнути струм"], "a": 1, "e": "Вода проводить струм."}, {"t": "choice", "q": "Куди не можна заходити самому?", "o": ["У бібліотеку", "На будівництво і в підвал", "У магазин"], "a": 1, "e": "Небезпечні місця."}, {"t": "tf", "q": "Можна користуватись феном у ванні, стоячи у воді.", "a": false, "e": "Смертельно небезпечно."}]}, {"id": "zb-kharchuvannia-son", "sec": "Моє здоров'я", "title": "Харчування і сон. Гігієна. Загартування", "goal": "Ти знаєш правила здорового харчування, навіщо сон і як загартовуватись.", "learn": [{"h": "Здорове харчування", "p": ["Їсти <b>4–5 разів</b> на день у певний час; <b>сніданок обов'язковий</b>. <b>Тарілка здоров'я</b>: половина — овочі й фрукти, чверть — крупи/хліб цільнозерновий, чверть — білок (м'ясо, риба, яйця, бобові) + молочне. <b>Поживні речовини</b>: білки (ріст), жири (енергія, тепло), вуглеводи (енергія), вітаміни й мінерали, вода (1,5–2 л). Менше: солодощів, чипсів, газованих напоїв, фастфуду. Мити руки, овочі, фрукти; перевіряти термін придатності."], "note": "Вітамін C — цитрусові, шипшина, капуста; A — морква; D — сонце, риба; кальцій — молочне."}, {"h": "Сон", "p": ["Під час сну мозок «записує» вивчене, тіло росте й відновлюється. Норма 9–10 годин. Правила: лягати в один час, без гаджетів за годину до сну, провітрити, темрява й тиша, не наїдатись перед сном. Недосип → погана пам'ять, дратівливість, хвороби."]}, {"h": "Гігієна", "p": ["Мити руки з милом 20 секунд (перед їжею, після туалету, вулиці); зуби — двічі на день по 2 хвилини, щітку міняти раз на 3 місяці; душ щодня; чистий одяг; власні рушник, гребінець, щітка. Гігієна зору: 30–40 см до книжки, перерви від екрана (правило 20-20-20: кожні 20 хв дивитись 20 секунд на 6 м)."]}, {"h": "Загартування", "p": ["Поступове звикання до холоду для зміцнення імунітету: повітряні ванни, прогулянки в будь-яку погоду, обтирання, контрастний душ, ходіння босоніж улітку. Принципи: <b>поступово, регулярно, з урахуванням самопочуття</b>."]}], "remember": "4–5 прийомів їжі, сніданок обов'язково; половина тарілки — овочі й фрукти; вода 1,5–2 л. Сон 9–10 год без гаджетів перед сном. Руки — 20 с з милом, зуби — 2 рази по 2 хв. Загартування — поступово й регулярно.", "cards": [{"f": "Скільки разів на день їсти?", "b": "4–5 разів, сніданок обов'язково."}, {"f": "Тарілка здоров'я", "b": "½ овочі й фрукти, ¼ крупи, ¼ білкові продукти."}, {"f": "Навіщо білки, жири, вуглеводи?", "b": "Білки — ріст; жири — енергія й тепло; вуглеводи — енергія."}, {"f": "Скільки води пити?", "b": "1,5–2 л на день."}, {"f": "Де вітамін C?", "b": "Цитрусові, шипшина, капуста, смородина."}, {"f": "Скільки мити руки і чистити зуби?", "b": "Руки — 20 секунд з милом; зуби — 2 рази на день по 2 хвилини."}, {"f": "Правило 20-20-20", "b": "Кожні 20 хв роботи за екраном 20 секунд дивитись на відстань 6 м."}, {"f": "Принципи загартування", "b": "Поступово, регулярно, з урахуванням самопочуття."}], "quiz": [{"t": "choice", "q": "Скільки разів на день варто їсти?", "o": ["1–2", "4–5", "8–10"], "a": 1, "e": "Регулярно, невеликими порціями."}, {"t": "choice", "q": "Що має займати половину тарілки?", "o": ["М'ясо", "Овочі й фрукти", "Солодощі"], "a": 1, "e": "Тарілка здоров'я."}, {"t": "choice", "q": "Які речовини потрібні для росту?", "o": ["Білки", "Жири", "Вода"], "a": 0, "e": "Білки — будівельний матеріал."}, {"t": "choice", "q": "Скільки води пити на день?", "o": ["0,5 л", "1,5–2 л", "5 л"], "a": 1, "e": "1,5–2 літри."}, {"t": "choice", "q": "Чому не можна їсти чипси щодня?", "o": ["Багато солі й жиру, мало користі", "Вони дорогі", "Вони хрусткі"], "a": 0, "e": "Шкідливі продукти."}, {"t": "choice", "q": "Що робить мозок під час сну?", "o": ["Нічого", "Закріплює вивчене", "Забуває все"], "a": 1, "e": "Пам'ять формується уві сні."}, {"t": "choice", "q": "Скільки треба мити руки з милом?", "o": ["5 секунд", "20 секунд", "5 хвилин"], "a": 1, "e": "20 секунд."}, {"t": "choice", "q": "Як часто міняти зубну щітку?", "o": ["Раз на рік", "Раз на 3 місяці", "Ніколи"], "a": 1, "e": "Кожні 3 місяці."}, {"t": "choice", "q": "Правильне загартування —", "o": ["одразу в ополонку", "поступово й регулярно", "тільки влітку"], "a": 1, "e": "Поступовість."}, {"t": "tf", "q": "Перед сном корисно годину погратись у телефон.", "a": false, "e": "Екрани заважають заснути."}]}, {"id": "zb-pidlitky-khvoroby", "sec": "Моє здоров'я", "title": "Ви — підлітки. Інфекційні хвороби та профілактика", "goal": "Ти знаєш, що змінюється в підлітковому віці, чим інфекційні хвороби відрізняються від неінфекційних, і як їм запобігти.", "learn": [{"h": "Підлітковий вік", "p": ["З 10–12 років починається <b>підлітковий вік</b>: організм швидко росте, змінюється тіло й голос, з'являються нові емоції, перепади настрою, бажання самостійності. Це нормально. Важливо: гігієна (частіше душ, чистий одяг), сон, спорт, розмови з батьками, повага до себе й інших. Дівчата й хлопці дорослішають по-різному й у різний час — порівнювати себе не треба."]}, {"h": "Інфекційні хвороби", "p": ["<span class='term'>Інфекційні</span> — спричинені <b>мікробами</b> (бактерії, віруси, гриби) і <b>передаються</b> від людини до людини: грип, ГРВІ, COVID-19, кір, вітрянка, кишкові інфекції, педикульоз. Шляхи: повітряно-крапельний (кашель, чхання), контактний (руки, речі), через воду і їжу, через укуси комах. <b>Імунітет</b> — захист організму від мікробів."]}, {"h": "Неінфекційні хвороби", "p": ["Не передаються: карієс, короткозорість, сколіоз, алергія, ожиріння, травми. Часто через спосіб життя: сидіння, солодке, екрани."]}, {"h": "Профілактика", "p": ["<span class='term'>Профілактика</span> — попередження хвороби. Мити руки; не користуватись чужими речами; <b>щеплення (вакцинація)</b> — навчає імунітет боротися; хворий — залишайся вдома, маска; провітрювання; загартування; здорове харчування; рух; огляд у лікаря раз на рік. Домашня <b>аптечка</b>: бинт, пластир, антисептик, термометр — ліки тільки за призначенням дорослих."]}], "remember": "Підлітковий вік з 10–12 років: зміни тіла й настрою — норма; гігієна, сон, розмови. Інфекційні хвороби — від мікробів, передаються (грип, вітрянка); неінфекційні — не передаються (карієс, сколіоз). Профілактика: руки, щеплення, вдома при хворобі, загартування.", "cards": [{"f": "Підлітковий вік", "b": "Починається з 10–12 років: швидкий ріст, зміни тіла, перепади настрою."}, {"f": "Інфекційні хвороби", "b": "Спричинені мікробами і передаються: грип, ГРВІ, вітрянка, кір."}, {"f": "Неінфекційні хвороби", "b": "Не передаються: карієс, короткозорість, сколіоз, алергія."}, {"f": "Шляхи передачі інфекцій", "b": "Повітряно-крапельний, контактний, через воду й їжу, через укуси."}, {"f": "Імунітет", "b": "Захист організму від мікробів."}, {"f": "Вакцинація", "b": "Щеплення, що навчає імунітет боротися з хворобою."}, {"f": "Профілактика", "b": "Попередження хвороби: гігієна, щеплення, загартування."}, {"f": "Що в домашній аптечці?", "b": "Бинт, пластир, антисептик, термометр; ліки — лише за призначенням дорослих."}], "quiz": [{"t": "choice", "q": "З якого віку починається підлітковий вік?", "o": ["З 6–7", "З 10–12", "З 16–18"], "a": 1, "e": "10–12 років."}, {"t": "choice", "q": "Перепади настрою в підлітка — це…", "o": ["хвороба", "нормальна частина дорослішання", "погане виховання"], "a": 1, "e": "Гормональні зміни."}, {"t": "choice", "q": "Яка хвороба інфекційна?", "o": ["Карієс", "Грип", "Сколіоз"], "a": 1, "e": "Грип — вірус, передається."}, {"t": "choice", "q": "Яка хвороба неінфекційна?", "o": ["Вітрянка", "Кір", "Короткозорість"], "a": 2, "e": "Не передається."}, {"t": "choice", "q": "Як передається грип?", "o": ["Повітряно-крапельним шляхом", "Через укуси комарів", "Не передається"], "a": 0, "e": "Кашель, чхання."}, {"t": "choice", "q": "Що таке імунітет?", "o": ["Хвороба", "Захист організму від мікробів", "Вітамін"], "a": 1, "e": "Захисна система."}, {"t": "choice", "q": "Навіщо щеплення?", "o": ["Щоб захворіти", "Щоб імунітет навчився боротись із хворобою", "Для краси"], "a": 1, "e": "Вакцинація — профілактика."}, {"t": "choice", "q": "Ти захворів на ГРВІ. Що робити?", "o": ["Іти до школи", "Залишитись удома, викликати лікаря", "Гуляти"], "a": 1, "e": "Не заражати інших."}, {"t": "input", "q": "Як називається попередження хвороб?", "a": ["профілактика"], "e": "Профілактика."}, {"t": "tf", "q": "Можна взяти будь-які ліки з аптечки самостійно.", "a": false, "e": "Тільки за призначенням дорослих."}]}, {"id": "zb-dozvillia-vidpochynok", "sec": "Моє здоров'я", "title": "Дозвілля. Активний відпочинок. Безпека на природі й воді", "goal": "Ти знаєш, яким має бути корисне дозвілля, і правила безпеки на природі, воді, у спеку й мороз.", "learn": [{"h": "Дозвілля", "p": ["<span class='term'>Дозвілля</span> — вільний час. Корисне: спорт, гуртки, читання, творчість, прогулянки, друзі, допомога вдома. Шкідливе: години в телефоні, ігри до ночі, нічого не робити. <b>Ігрова залежність</b> — коли гра важливіша за сон, їжу, друзів. Правило: спочатку справи — потім гра; час на екран обмежений."]}, {"h": "Активний відпочинок", "p": ["Рух на свіжому повітрі: велосипед, м'яч, плавання, туризм, зимові види. Користь: серце, м'язи, імунітет, настрій, сон. Спорт — із розминкою, у захисті (шолом), без перенапруження."]}, {"h": "На природі", "p": ["Похід — з дорослими, повідомити маршрут, вода, головний убір, аптечка, заряджений телефон. Не пити з водойм; не їсти незнайомих ягід і грибів; не чіпати диких тварин; від <b>кліщів</b> — закритий одяг, огляд після лісу, кліща видаляти в лікаря; від змій — дивитись під ноги, не чіпати. <b>Гроза</b>: не ховатись під високим деревом, подалі від води й металу, присісти. Заблукав — стій на місці, кричи, дзвони 101/112."]}, {"h": "На воді, у спеку, на морозі", "p": ["<b>Вода</b>: плавати тільки з дорослими, у дозволених місцях, не запливати за буйки, не пірнати в незнайомому місці, не грати «топлення», надувний матрац — не рятівний засіб. Тонеш — не панікуй, лягай на спину. <b>Спека</b>: головний убір, вода, тінь 11–16 год, крем від сонця; <b>тепловий удар</b> — слабкість, нудота → тінь, вода, холод на голову, 103. <b>Мороз</b>: шари одягу, рукавиці, не сидіти на холодному; <b>обмороження</b> — блідість, оніміння → тепло, не терти снігом. <b>Крига</b>: не виходити на неозначену кригу; провалився — розкинь руки, повзи в бік, звідки прийшов."]}], "remember": "Корисне дозвілля — спорт, гуртки, читання; гра після справ, з обмеженням. Природа: з дорослими, вода, кліщі — закритий одяг, гроза — не під деревом. Вода: за буйки не запливати, пірнати лише в знайомому місці. Спека — головний убір і вода; мороз — шари одягу, не терти снігом.", "cards": [{"f": "Дозвілля", "b": "Вільний час; корисне — спорт, гуртки, читання, друзі."}, {"f": "Ознака ігрової залежності", "b": "Гра важливіша за сон, їжу, друзів, навчання."}, {"f": "Захист від кліщів", "b": "Закритий одяг, огляд після лісу, видаляти в лікаря."}, {"f": "Гроза на природі", "b": "Не під високим деревом, подалі від води й металу, присісти."}, {"f": "Заблукав у лісі", "b": "Стій на місці, кричи, дзвони 101 або 112."}, {"f": "Правила на воді", "b": "З дорослими, у дозволених місцях, не за буйки, не пірнати в незнайомому місці."}, {"f": "Тепловий удар — що робити?", "b": "У тінь, пити воду, холод на голову, викликати 103."}, {"f": "Обмороження — чого не робити?", "b": "Не терти снігом; поступово зігрівати."}, {"f": "Провалився під кригу", "b": "Розкинь руки, не панікуй, повзи в бік, звідки прийшов."}], "quiz": [{"t": "choice", "q": "Що з цього корисне дозвілля?", "o": ["6 годин ігор на телефоні", "Гурток або спорт", "Лежати весь день"], "a": 1, "e": "Активність і розвиток."}, {"t": "choice", "q": "Ознака ігрової залежності:", "o": ["Грає годину після уроків", "Пропускає сон і їжу заради гри", "Грає з друзями у футбол"], "a": 1, "e": "Гра витісняє життя."}, {"t": "choice", "q": "Гроза застала в полі. Що робити?", "o": ["Стати під одиноке дерево", "Присісти подалі від дерев і води", "Бігти до річки"], "a": 1, "e": "Дерево притягує блискавку."}, {"t": "choice", "q": "Після лісу треба…", "o": ["оглянути тіло на кліщів", "з'їсти ягоди", "полежати"], "a": 0, "e": "Кліщі переносять хвороби."}, {"t": "choice", "q": "Ти заблукав у лісі. Що робити?", "o": ["Іти навмання", "Зупинитись, кричати, дзвонити 112", "Ховатись"], "a": 1, "e": "Так тебе швидше знайдуть."}, {"t": "choice", "q": "Чи можна пірнати в незнайомому місці?", "o": ["Так", "Ні, під водою можуть бути камені"], "a": 1, "e": "Травма хребта."}, {"t": "choice", "q": "Навіщо буйки на пляжі?", "o": ["Для краси", "Позначають межу безпечного плавання", "Для риболовлі"], "a": 1, "e": "Не запливати за них."}, {"t": "choice", "q": "Ознаки теплового удару:", "o": ["Слабкість, нудота, запаморочення", "Голод", "Сміх"], "a": 0, "e": "Негайно в тінь і воду."}, {"t": "choice", "q": "Що НЕ можна робити при обмороженні?", "o": ["Зігрівати поступово", "Терти снігом", "Дати теплого чаю"], "a": 1, "e": "Сніг травмує шкіру  "Бюджет", "b": "План доходів і витрат."}, {"f": "На що ділити кишенькові гроші?", "b": "Витрати, заощадження, трохи на добро."}, {"f": "Потреби / бажання", "b": "Спочатку необхідне, потім те, чого хочеться."}, {"f": "Ознаки свідомого покупця", "b": "Список, порівняння цін, читає склад і термін, не купує імпульсивно."}, {"f": "Безпечний онлайн-шопінг", "b": "З батьками, перевірені сайти, не вводити дані картки самому."}, {"f": "Шлях від мрії до результату", "b": "Мрія → ціль → план → дія → результат."}], "quiz": [{"t": "choice", "q": "Добробут — це…", "o": ["тільки багато грошей", "здоров'я, житло, освіта, безпека, стосунки", "дорогий телефон"], "a": 1, "e": "Гроші — лише частина."}, {"t": "choice", "q": "Отримав кишенькові гроші. Що розумно?", "o": ["Витратити все одразу", "Частину відкласти, частину — на потреби", "Позичити всім"], "a": 1, "e": "Заощадження + витрати."}, {"t": "choice", "q": "Що купити першим: новий чохол чи зошити для школи?", "o": ["Чохол", "Зошити — це потреба", "Обидва в кредит"], "a": 1, "e": "Потреби перед бажаннями."}, {"t": "choice", "q": "Що робить свідомий покупець у магазині?", "o": ["Бере все яскраве", "Іде за списком і читає склад", "Купує найдорожче"], "a": 1, "e": "Свідоме споживання."}, {"t": "choice", "q": "Сайт пропонує телефон за 10% ціни. Що це?", "o": ["Удача", "Ймовірно, шахрайство", "Розпродаж"], "a": 1, "e": "Надто дешево — ознака обману."}, {"t": "choice", "q": "Чи можна вводити дані батьківської картки в інтернеті самому?", "o": ["Так", "Ні, тільки з батьками"], "a": 1, "e": "Безпека грошей."}, {"t": "choice", "q": "Що іде після цілі в плануванні?", "o": ["Мрія", "План кроків", "Результат"], "a": 1, "e": "Мрія → ціль → план → дія."}, {"t": "input", "q": "Як називається план доходів і витрат?", "a": ["бюджет"], "e": "Бюджет."}, {"t": "tf", "q": "Вимкнути воду під час чищення зубів — це заощадження ресурсів.", "a": true, "e": "Так."}]}, {"id": "zb-sered-liudei", "sec": "Я серед людей", "title": "Цінності. Коло спілкування. let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }

    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/[^a-z0-9а-яіїєґ' \-]/gi,"").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
