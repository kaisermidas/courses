<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Аліса в Країні Див — розбір твору</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#150F2E; --bg2:#1E1642; --card:#241A4E;
  --ink:#F2ECE3; --dim:#A79EC4;
  --red:#E3395C; --teal:#57D9B4; --gold:#E9B54A;
  --line:rgba(242,236,227,.14);
  --ok:#57D9B4; --no:#FF6B81;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{padding:0 0 40px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.scr{display:none}.scr.on{display:block}

/* ---------- шапка ---------- */
.hero{position:relative;padding:26px 16px 22px;overflow:hidden;
  background:radial-gradient(120% 90% at 15% 0%,#33215E 0%,var(--bg) 70%)}
.suits{position:absolute;inset:0;font-size:78px;color:rgba(227,57,92,.09);
  line-height:1;pointer-events:none;user-select:none}
.suits span{position:absolute}
.hero h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.4px}
.hero .by{margin:8px 0 0;color:var(--dim);font-size:14px}
.hero .meta{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}
.bar{margin-top:16px;height:5px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));
  transition:width .5s}
.barlab{margin-top:7px;font-size:12px;color:var(--dim)}

/* ---------- список модулів ---------- */
.gh{margin:26px 0 10px;font-size:12px;color:var(--dim);letter-spacing:.5px}
.mod{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;color:var(--ink);font-size:15px;cursor:pointer}
.mod:active{transform:scale(.985)}
.mod .ic{font-size:22px;width:28px;text-align:center;flex:none}
.mod b{display:block;font-weight:600}
.mod small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.mod .dot{margin-left:auto;flex:none;width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.15)}
.mod.done .dot{background:var(--teal)}

/* ---------- екран модуля ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{background:none;border:none;color:var(--teal);font-size:15px;padding:4px 0;cursor:pointer}
.top h2{margin:0;font-size:16px;flex:1}
#t-body{padding:16px}

.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;margin-bottom:12px}
.blk h3{margin:0 0 8px;font-size:17px;color:var(--gold)}
.blk p{margin:0 0 9px}
.blk p:last-child{margin-bottom:0}
.blk ul{margin:6px 0 0;padding-left:19px}
.blk li{margin-bottom:5px}
.lead{color:var(--dim);font-size:14px;margin:0 0 14px}
.q{border-left:3px solid var(--red);padding:2px 0 2px 12px;margin:10px 0;
  font-family:Georgia,serif;font-style:italic}
.note{background:rgba(233,181,74,.11);border:1px solid rgba(233,181,74,.3);
  border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:10px}

/* факти */
.facts{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{background:var(--card);padding:11px 14px;display:flex;gap:12px}
.facts span{color:var(--dim);font-size:13px;flex:none;width:104px;padding-top:1px}
.facts b{font-weight:600;font-size:14.5px}

/* стрічка часу */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--red),var(--gold))}
.tl div{position:relative;margin-bottom:15px}
.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;
  border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.tl b{color:var(--gold);font-size:13px;display:block}

/* розділи */
.ch{background:var(--card);border:1px solid var(--line);border-radius:13px;
  margin-bottom:9px;overflow:hidden}
.ch>button{width:100%;display:flex;gap:11px;align-items:center;background:none;border:none;
  color:var(--ink);padding:12px 14px;text-align:left;font-size:15px;cursor:pointer;
  font-family:inherit}
.ch .n{font-family:Georgia,serif;color:var(--red);font-size:19px;width:24px;flex:none}
.ch .body{display:none;padding:0 14px 14px;font-size:14.5px}
.ch.open .body{display:block}
.ch .body .key{margin-top:9px;color:var(--teal);font-size:13.5px}

/* персонажі */
.per{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:10px}
.per h4{margin:0;font-size:16px;font-family:Georgia,serif}
.per .role{color:var(--dim);font-size:12.5px;margin:2px 0 8px}
.per .tr{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.per .tr i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:20px;
  background:rgba(87,217,180,.13);color:var(--teal)}
.per .said{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--gold)}

/* кнопки / ігри */
.btn{background:var(--red);color:#fff;border:none;border-radius:11px;padding:12px 18px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.g{background:rgba(255,255,255,.09);color:var(--ink)}
.btn:active{opacity:.85}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;
  font-size:15px;cursor:pointer;font-family:inherit}
.opt.ok{border-color:var(--ok);background:rgba(87,217,180,.14)}
.opt.no{border-color:var(--no);background:rgba(255,107,129,.13)}
.opt:disabled{opacity:.75}
.say{margin:10px 0;padding:10px 12px;border-radius:11px;font-size:14.5px;display:none}
.say.on{display:block}
.say.y{background:rgba(87,217,180,.14);border:1px solid var(--ok)}
.say.n{background:rgba(255,107,129,.13);border:1px solid var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.used{opacity:.3;pointer-events:none}
.chip.ok{border-color:var(--ok)}.chip.no{border-color:var(--no)}
.slot{min-height:44px;border:1px dashed var(--line);border-radius:11px;padding:8px;
  margin:10px 0;font-size:14px;color:var(--dim)}
.prog{font-size:13px;color:var(--dim);margin-bottom:10px}

/* шкала зросту */
.grow{text-align:center;padding:6px 0}
.grow .fig{height:150px;display:flex;align-items:flex-end;justify-content:center}
.grow .fig i{display:block;background:linear-gradient(180deg,var(--gold),var(--red));
  border-radius:6px 6px 2px 2px;transition:all .35s;width:26px}
.grow input{width:100%;margin:14px 0 6px;accent-color:var(--red)}
.grow .cap b{display:block;font-size:17px;font-family:Georgia,serif;color:var(--gold)}
.grow .cap span{color:var(--dim);font-size:13px}
.grow .cap p{font-size:14.5px;margin:8px 0 0}

/* спойлер */
.sp{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;margin-bottom:10px}
.sp b{display:block;font-size:15px;margin-bottom:8px}
.sp .ans{display:none;font-size:14.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.sp.open .ans{display:block}
.sp button{background:rgba(255,255,255,.08);border:none;color:var(--teal);
  border-radius:9px;padding:8px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}

/* рівні тесту */
.lvl{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
  color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}
.lvl .ic{font-size:24px}
.lvl b{display:block;font-size:15px}
.lvl small{color:var(--dim);font-size:12.5px}
.lvl .sc{margin-left:auto;color:var(--gold);font-size:13px;font-family:Georgia,serif}
.res{text-align:center;padding:20px 0}
.res .big{font-size:46px;font-family:Georgia,serif;color:var(--gold)}
.res .st{font-size:26px;letter-spacing:4px;margin:6px 0 12px}
.wrongs{text-align:left;margin-top:18px}
.wrongs .w{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:9px;font-size:14px}
.wrongs .w em{color:var(--no);font-style:normal}
.wrongs .w s{color:var(--dim)}
</style>
</head>
<body>

<!-- ================= ГОЛОВНА ================= -->
<div id="s-home" class="scr on">
  <div class="hero">
    <div class="suits">
      <span style="top:-14px;right:6px">♥</span>
      <span style="top:70px;right:64px;font-size:44px">♠</span>
      <span style="top:120px;right:12px;font-size:30px">♦</span>
    </div>
    <h1>Аліса<br>в Країні Див</h1>
    <p class="by">Льюїс Керролл · 1865 · переклад Валентина Корнієнка</p>
    <div class="meta">
      <span class="tag">повість-казка</span>
      <span class="tag">фантастика</span>
      <span class="tag">нонсенс</span>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="barlab" id="plab">Пройдено 0 з 13</div>
  </div>
  <div class="wrap" id="menu"></div>
</div>

<!-- ================= МОДУЛЬ ================= -->
<div id="s-tool" class="scr">
  <div class="top">
    <button class="back" onclick="home()">‹ Назад</button>
    <h2 id="t-title"></h2>
  </div>
  <div class="wrap"><div id="t-body"></div></div>
</div>

<script>
/* ============ ядро ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
let TIMERS=[];
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id}
function stopAll(){TIMERS.forEach(clearInterval);TIMERS=[]}
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG){TG.ready();TG.expand();try{TG.setHeaderColor('#150F2E')}catch(e){}}

const KEY='alisa-tvir-v1';
let PR={done:{},best:{}};
function load(cb){
  try{const l=localStorage.getItem(KEY);if(l)PR=Object.assign(PR,JSON.parse(l))}catch(e){}
  if(TG&&TG.CloudStorage){
    TG.CloudStorage.getItem(KEY,(err,val)=>{
      if(!err&&val){try{PR=Object.assign(PR,JSON.parse(val))}catch(e){}}
      cb();
    });
  } else cb();
}
function save(){
  const s=JSON.stringify(PR);
  try{localStorage.setItem(KEY,s)}catch(e){}
  if(TG&&TG.CloudStorage){try{TG.CloudStorage.setItem(KEY,s)}catch(e){}}
}
function mark(k){if(!PR.done[k]){PR.done[k]=1;save()}paint()}
function buzz(t){try{TG.HapticFeedback.notificationOccurred(t)}catch(e){}}

function say(sel,txt,ok){
  const e=$(sel);if(!e)return;
  e.className='say on '+(ok?'y':'n');e.innerHTML=txt;
}
function hide(sel){const e=$(sel);if(e)e.className='say'}

/* ============ реєстр модулів ============ */
const GROUPS=['Про твір','Розібратися','Перевірити себе'];
const M={},ORDER=[];
function T(k,o){M[k]=o;ORDER.push(k)}

function paint(){
  const html=GROUPS.map((g,gi)=>{
    const items=ORDER.filter(k=>M[k].g===gi).map(k=>{
      const m=M[k];
      return `<button class="mod ${PR.done[k]?'done':''}" onclick="open_('${k}')">
        <span class="ic">${m.ic}</span>
        <span><b>${m.t}</b><small>${m.s}</small></span>
        <span class="dot"></span></button>`;
    }).join('');
    return `<div class="gh">${g}</div>${items}`;
  }).join('');
  $('#menu').innerHTML=html;
  const n=ORDER.filter(k=>PR.done[k]).length;
  $('#pbar').style.width=Math.round(n/ORDER.length*100)+'%';
  $('#plab').textContent=`Пройдено ${n} з ${ORDER.length}`;
}
function open_(k){
  stopAll();
  const m=M[k];
  $('#t-title').textContent=m.t;
  $('#t-body').innerHTML=m.html;
  $('#s-home').classList.remove('on');
  $('#s-tool').classList.add('on');
  window.scrollTo(0,0);
  if(m.init)m.init();
  if(TG&&TG.BackButton){TG.BackButton.show();TG.BackButton.onClick(home)}
}
function home(){
  stopAll();
  $('#s-tool').classList.remove('on');
  $('#s-home').classList.add('on');
  window.scrollTo(0,0);
  if(TG&&TG.BackButton)TG.BackButton.hide();
  paint();
}
function done(k){mark(k);home()}
function fin(k){return `<button class="btn" style="width:100%;margin-top:6px" onclick="done('${k}')">Готово, зрозумів</button>`}
function toggle(el){el.parentNode.classList.toggle('open')}

/* ==================================================================
   1. ПАСПОРТ ТВОРУ
   ================================================================== */
T('passport',{g:0,ic:'📋',t:'Паспорт твору',s:'Те, що просять назвати першим',html:`
<p class="lead">Це відповіді на запитання, які на уроці звучать майже завжди. Вивчи їх — і початок будь-якої відповіді в тебе вже є.</p>
<div class="facts">
  <div><span>Автор</span><b>Льюїс Керролл (справжнє ім’я — Чарлз Лютвідж Доджсон), Англія</b></div>
  <div><span>Роки життя</span><b>1832–1898</b></div>
  <div><span>Назва</span><b>«Пригоди Аліси в Країні Див»</b></div>
  <div><span>Рік виходу</span><b>1865</b></div>
  <div><span>Жанр</span><b>літературна казка (повість-казка); фантастика, нонсенс</b></div>
  <div><span>Тема</span><b>пригоди дівчинки Аліси у фантастичній Країні Див, куди вона потрапила крізь кролячу нору</b></div>
  <div><span>Головна думка</span><b>поки ти лишаєшся собою, ставиш запитання і не боїшся сказати «це нісенітниця» — жоден дивний світ тебе не переможе</b></div>
  <div><span>Головна героїня</span><b>Аліса — допитлива, чемна, розсудлива дівчинка</b></div>
  <div><span>Композиція</span><b>12 розділів; усе обрамлене сном: заснула на березі — прокинулася на колінах у сестри</b></div>
  <div><span>Оповідь</span><b>від третьої особи, але очима Аліси: ми знаємо рівно те, що знає вона</b></div>
  <div><span>Переклади</span><b>українською — Галина Бушина, Валентин Корнієнко, Володимир Панченко, Вікторія Наріжна</b></div>
  <div><span>Продовження</span><b>«Аліса в Задзеркаллі» (1871)</b></div>
</div>
<div class="note"><b>Обережно з назвою.</b> Українською книжку видавали і як «Країна Див», і як «Країна Чудес». Це один твір, просто різні перекладачі.</div>
${fin('passport')}`});

/* ==================================================================
   2. АВТОР
   ================================================================== */
T('author',{g:0,ic:'👤',t:'Автор',s:'Математик, який писав нісенітниці',html:`
<p class="lead">Про Керролла кажуть: найзагадковіший письменник Англії. У ньому поєдналося непоєднуване — математик і казкар, священник і фотограф.</p>

<div class="blk"><h3>Дитинство</h3>
<p>Чарлз Лютвідж Доджсон народився 1832 року і був старшим у багатодітній родині. Розважати молодших братів і сестер довелося йому — і він робив це винахідливо: змайстрував ляльковий театр, писав для нього п’єси й сам грав, вигадував ігри, читав дітям свої оповідання перед сном.</p>
<p>Він навіть видавав домашній рукописний журнал із власними віршами та малюнками. Тобто письменником він став задовго до того, як став письменником.</p></div>

<div class="blk"><h3>Математик</h3>
<p>У школі вчителі відразу помітили його математичні здібності — вони й привели його в Оксфорд. Там він спочатку вчився, потім виграв конкурс на читання лекцій і викладав математику понад тридцять років. Надрукував багато наукових праць.</p>
<p>Це важливо для розуміння «Аліси»: людина, яка все життя мала справу з логікою, знала точно, як її зламати найсмішнішим способом.</p></div>

<div class="blk"><h3>Звідки взявся псевдонім</h3>
<p>Підписувати кумедні віршики поважним професорським ім’ям було незручно. Тому Доджсон зробив із власного імені фокус у три ходи. Натисни, щоб побачити.</p>
<div id="pseudo" style="text-align:center;font-family:Georgia,serif;font-size:19px;padding:14px 0;color:var(--gold)"></div>
<button class="btn g" style="width:100%" onclick="stepPseudo()" id="pbtn">Далі</button></div>

<div class="blk"><h3>Чим ще захоплювався</h3>
<ul>
<li><b>Іграми й головоломками</b> — математичними, логічними, мовними. За це його прозвали «королем нісенітниць».</li>
<li><b>Шахами</b> — сам грав і вчив грати дітей. Друга книжка про Алісу побудована як шахова партія.</li>
<li><b>Фотографією</b> — сьогодні його вважають одним із найкращих фотографів-портретистів свого часу.</li>
<li><b>Малюванням</b> — 38 ілюстрацій до першого рукопису «Аліси» він зробив власноруч.</li>
</ul>
<div class="note">Керролл був священником (дияконом) і всюди ходив у темній рясі — з фотокамерою в руках. Сучасники не могли цього зрозуміти.</div></div>

<div class="blk"><h3>Ще один Доджсон у книжці</h3>
<p>У третьому розділі з’являється птах Додо, який влаштовує Гасай-Коло. Вважають, що це сам автор: Доджсон трохи заїкався і, називаючи себе, виходило «До-до-джсон».</p></div>
${fin('author')}`,
init(){window.PS=0;stepPseudo()}});

const PSEUDO=[
  ['Чарлз Лютвідж','справжнє ім’я: Charles Lutwidge'],
  ['Carolus Ludovicus','переклав його латиною'],
  ['Lewis Carroll','переклав назад англійською'],
  ['Льюїс Керролл','і поміняв слова місцями']
];
function stepPseudo(){
  const e=$('#pseudo');if(!e)return;
  const s=PSEUDO[window.PS];
  e.innerHTML=`<div>${s[0]}</div><div style="color:var(--dim);font-size:13px;font-family:inherit;margin-top:5px">${s[1]}</div>`;
  window.PS=(window.PS+1)%PSEUDO.length;
  const b=$('#pbtn');if(b)b.textContent=window.PS===0?'Ще раз':'Далі';
}

/* ==================================================================
   3. ІСТОРІЯ СТВОРЕННЯ
   ================================================================== */

 ['Аліса прокидається на березі','розв’язка']
];
const CNAMES=['експозиція','зав’язка','розвиток дії','кульмінація','розв’язка'];
function buildComp(){
  const box=$('#comp');if(!box)return;
  box.innerHTML=COMP.map((c,i)=>`<div style="margin:12px 0 16px">
    <div style="font-size:14.5px;margin-bottom:7px">${c[0]}</div>
    <div class="row" id="cr${i}">${CNAMES.map(n=>
      `<button class="chip" onclick="pickComp(${i},'${n}',this)">${n}</button>`).join('')}</div></div>`).join('');
}
function pickComp(i,n,el){
  const ok=COMP[i][1]===n;
  $$('#cr'+i+' .chip').forEach(b=>b.disabled=true);
  el.classList.add(ok?'ok':'no');
  if(!ok){$$('#cr'+i+' .chip').forEach(b=>{if(b.textContent===COMP[i][1])b.classList.add('ok')})}
  buzz(ok?'success':'error');
  const solved=$$('#comp .chip.ok').length;
  if(solved>=5)say('#cs','Опори на місці. Тепер ти можеш переказати твір за схемою, а не «і потім, і потім».',true);
}

T('themes',{g:1,ic:'💡',t:'Теми й головна думка',s:'Про що це насправді',html:`
<p class="lead">Керролл не збирався нічого доводити — він фантазував вільно. Та коли книжку читають уже 160 років, у ній видно більше, ніж бачив автор.</p>

<div class="blk"><h3>Дорослішання: «хто ти?»</h3>
<p>За один день Аліса змінює зріст щонайменше десять разів і врешті сама не може сказати, хто вона. Питання Гусені — головне питання твору. Дорослішання і виглядає так: тіло змінюється швидше, ніж ти встигаєш до нього звикнути.</p>

<div class="blk"><h3>Уява проти нудьги</h3>
<p>Усе починається з дівчинки, якій нудно, бо книжка без малюнків. Країна Див — нагорода за цікавість. Аліса не змогла не побігти за кроликом — і саме тому з нею сталася історія.</p></div>

<div class="blk"><h3>Безглуздя дорослого світу</h3>
<p>Придивись, із чого зроблена Країна Див: змагання без правил, школа без знань, крокет фламінго, суд без доказів, вирок раніше за розгляд. Це все — дорослі порядки, доведені до смішного. Дитині вони часто саме такими й здаються.</p></div>

<div class="blk"><h3>Влада, яка тримається на крику</h3>
<p>Чирвова Королева наказує рубати голови кожні дві хвилини. Аліса помічає, що не страчено нікого. Коли вона нарешті каже вголос «ви просто колода карт», грізне військо розлітається за вітром.</p></div>

<div class="blk"><h3>Мова як гра</h3>
<p>Тут слова живуть окремим життям: «не всі вдома» стає діагнозом, приказка «котові й король не указ» — юридичним аргументом, а сумна історія Миші перетворюється на хвіст. Керролл-математик показує: правила мови можна крутити так само, як правила гри.</p></div>

<div class="blk"><h3>Час</h3>
<p>Капелюшник посварився з Часом — і Час зупинився на п’ятій годині. Це жарт, але й точний образ: коли з часом не домовитися, життя застрягає на одному місці, і лишається пересідати по колу.</p></div>

T('legacy',{g:1,ic:'🌍',t:'Слід у культурі',s:'Що сталося з книжкою за 160 років',html:`
<div class="blk"><h3>Мови й переклади</h3>
<p>«Алісу» перекладено 125 мовами. Українською її переклали Галина Бушина, Валентин Корнієнко, Володимир Панченко та Вікторія Наріжна — тому в різних виданнях герої можуть звучати трохи по-різному.</p>
<div class="note">Перекладати «Алісу» дуже важко: майже кожен жарт побудований на англійських словах. Перекладач мусить вигадати свій каламбур — тому «Аліса» українською частково написана заново.</div></div>

<div class="blk"><h3>Художники</h3>
<p>Перші й найвідоміші ілюстрації зробив Джон Тенієл ще для видання 1865 року. Українські видання малювали Владислав Єрко, Євгенія Гапчинська, Олег Ліпченко, Яна Гавриш. А 1959 року «Алісу» проілюструвала Туве Янсон — та сама, що придумала мумі-тролів.</p></div>

<div class="blk"><h3>Кіно та ігри</h3>
<p>За книжками про Алісу знято близько десяти екранізацій, два аніме, зроблено п’ять відеоігор і тисячі театральних вистав. Мультфільм студії Волта Діснея вийшов 1951 року, українською його дублювали 2018-го.</p></div>

<div class="blk"><h3>Вплив на літературу</h3>
<p>Саме «Аліса» дала поштовх розвитку фентезі — літератури про вигадані світи. Улюбленими книжками маленького Джона Толкіна, автора «Гобіта», були «Аліса в Країні Див» і казки братів Грімм.</p></div>

<div class="blk"><h3>Дивні історії</h3>
<ul>
<li>У Китаї «Алісу» свого часу забороняли: мовляв, тварини не повинні говорити людським голосом і не можна показувати тварин рівними людям.</li>
<li>Астероїди назвали на честь Білого Кролика, Капелюшника, Березневого зайця, Казна-Що-Не-Черепахи і навіть кішки Діни.</li>
<li>Від книжок Керролла була в захваті сама королева Вікторія.</li>
<li>Цитати з «Аліси» вже сто років уживають як приказки.</li>
</ul></div>
${fin('legacy')}`});

T('train',{g:2,ic:'🃏',t:'Тренажери',s:'Чотири вправи на пам’ять і розуміння',html:`
<p class="lead">Не тест. Тут можна помилятися скільки завгодно — саме так і запам’ятовується.</p>

<div class="blk"><h3>Хто це сказав?</h3>
<div class="prog" id="wsp"></div>
<div id="ws"></div><div class="say" id="wss"></div></div>

<div class="blk"><h3>Постав події по порядку</h3>
<p style="font-size:14px;color:var(--dim);margin-top:0">Натискай події від першої до останньої.</p>
<div class="slot" id="oslot">поки порожньо</div>
<div class="row" id="ord"></div><div class="say" id="os"></div></div>

<div class="blk"><h3>Реальне чи вигадане?</h3>
<p style="font-size:14px;color:var(--dim);margin-top:0">У Країні Див справжнє й вигадане переплетені. Розділи їх.</p>
<div id="rf"></div><div class="say" id="rfs"></div></div>

<div class="blk"><h3>Аліса росте</h3>
<p style="font-size:14px;color:var(--dim);margin-top:0">Пересунь повзунок і подивись, коли саме вона такою була.</p>
<div class="grow">
  <div class="fig"><i id="gfig"></i></div>
  <input type="range" min="0" max="5" value="0" id="grng" oninput="grow(this.value)">
  <div class="cap" id="gcap"></div>
</div></div>
${fin('train')}`,
init(){initWho();initOrder();initRF();grow(0)}});

/* --- хто сказав --- */
const WHO=[
 ['Голову з пліч!','Чирвова Королева',['Чирвова Королева','Герцогиня','Капелюшник']],
 ['Ми всі тут не сповна розуму.','Чеширський Кіт',['Гусінь','Чеширський Кіт','Сонько-Гризун']],
 ['Хто ти?','Гусінь',['Гусінь','Білий Кролик','Грифон']],
 ['Ой лишенько, як я забарився!','Білий Кролик',['Білий Кролик','Шалений Заєць','Додо']],
 ['Все дивасніше й дивасніше!','Аліса',['Аліса','Миша','Горлиця']],
 ['Може, твій годинник показує роки?','Капелюшник',['Капелюшник','Чирвовий Король','Грифон']],
 ['Ви ж просто колода карт!','Аліса',['Чеширський Кіт','Аліса','Казна-Що-Не-Черепаха']],
 ['Зроду не терпіла арифметики!','Герцогиня',['Кухарка','Герцогиня','Чирвова Королева']]
];
let wi=0,wok=0;
function initWho(){wi=0;wok=0;drawWho()}
function drawWho(){
  const b=$('#ws');if(!b)return;
  if(wi>=WHO.length){
    b.innerHTML='';
    say('#wss',`Правильних: ${wok} з ${WHO.length}. <button class="btn g" style="margin-top:8px" onclick="initWho();hide('#wss')">Ще раз</button>`,wok>=6);
    $('#wsp').textContent='';return;
  }
  hide('#wss');
  $('#wsp').textContent=`Репліка ${wi+1} з ${WHO.length}`;
  const w=WHO[wi];
  b.innerHTML=`<div class="q">${w[0]}</div>`+
    w[2].map(o=>`<button class="opt" onclick="ansWho(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('');
}
function ansWho(el,o){
  const w=WHO[wi];const ok=(o===w[1]);
  $$('#ws .opt').forEach(b=>{b.disabled=true;if(b.textContent===w[1])b.classList.add('ok')});
  if(!ok)el.classList.add('no');else wok++;
  buzz(ok?'success':'error');
  setTimeout(()=>{wi++;drawWho()},900);
}

/* --- порядок подій --- */
const ORD=[
 'Аліса біжить за Кроликом і падає в нору',
 'Випиває «ВИПИЙ МЕНЕ» і меншає',
 'Наплакала озеро сліз',
 'Гусінь питає «Хто ти?»',
 'Немовля Герцогині стає поросям',
 'Божевільне чаювання з Капелюшником',
 'Крокет із фламінго в Королеви',
 'Суд над Чирвовим Валетом'
];
let opick=[];
function initOrder(){
  opick=[];
  const box=$('#ord');if(!box)return;
  const sh=ORD.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  box.innerHTML=sh.map(o=>`<button class="chip" data-i="${o.i}" onclick="pickOrd(this)">${o.t}</button>`).join('');
  $('#oslot').textContent='поки порожньо';hide('#os');
}
function pickOrd(el){
  const i=+el.dataset.i;
  const ok=(i===opick.length);
  if(ok){
    opick.push(i);el.classList.add('used');
    $('#oslot').innerHTML=opick.map((n,k)=>`${k+1}. ${ORD[n]}`).join('<br>');
    buzz('success');
    if(opick.length===ORD.length)say('#os','Уся дорога Аліси — від нори до суду. Так і переказуй.',true);
  }else{
    el.classList.add('no');buzz('error');
    say('#os','Не поспішай — ця подія буде пізніше.',false);
    setTimeout(()=>{el.classList.remove('no');hide('#os')},900);
  }
}

/* --- реальне / вигадане --- */
const RF=[
 ['Річка Темза, де плив човен',1],
 ['Кролик у жилетці з годинником',0],
 ['Дівчинка Аліса Ліддел',1],
 ['Кіт, що тане, лишаючи усмішку',0],
 ['Кішка Діна',1],
 ['Колода карт, яка судить',0],
 ['Злива, через яку всі змокли',1],
 ['Озеро з дитячих сліз',0],
 ['Англійський звичай пити чай о п’ятій',1],
 ['Гриб, від якого міняється зріст',0]
];
function initRF(){
  const b=$('#rf');if(!b)return;
  b.innerHTML=RF.map((r,i)=>`<div style="margin-bottom:11px">
    <div style="font-size:14.5px;margin-bottom:6px">${r[0]}</div>
    <div class="row" id="rf${i}">
      <button class="chip" onclick="ansRF(${i},1,this)">з життя</button>
      <button class="chip" onclick="ansRF(${i},0,this)">вигадка</button>
    </div></div>`).join('');
}
function ansRF(i,v,el){
  const ok=(RF[i][1]===v);
  $$('#rf'+i+' .chip').forEach(b=>b.disabled=true);
  el.classList.add(ok?'ok':'no');buzz(ok?'success':'error');
  if($$('#rf .chip.ok').length+$$('#rf .chip.no').length>=RF.length)
    say('#rfs','Керролл змішав своє життя з вигадкою так, що перші слухачі впізнавали в героях себе.',true);
}

/* --- шкала зросту --- */
const GROW=[

T('test',{g:2,ic:'🧠',t:'Тести',s:'Три рівні складності',html:`
<p class="lead">Легкий пояснює після кожної відповіді. Дуже складний мовчить до кінця, а тоді показує розбір помилок.</p>
<div id="lvls"></div>`,
init(){drawLv()}});

function drawLv(){
  const b=$('#lvls');if(!b)return;
  b.innerHTML=LV.map((l,i)=>{
    const s=PR.best[l[0]];
    return `<button class="lvl" onclick="startQ(${i})">
      <span class="ic">${l[1]}</span>
      <span><b>${l[2]}</b><small>${l[3]} · ${l[4].length} питань</small></span>
      <span class="sc">${s!=null?s+'%':''}</span></button>`;
  }).join('');
}
let QL=0,QI=0,QOK=0,QW=[];
function startQ(l){
  QL=l;QI=0;QOK=0;QW=[];drawQ();
}
function drawQ(){
  const L=LV[QL],qs=L[4],b=$('#t-body');
  if(QI>=qs.length){return resQ()}
  const q=qs[QI];
  let opts;
  if(q[1]==='tf'){
    opts=['Так','Ні'].map((o,i)=>`<button class="opt" onclick="ansQ(${i===0?1:0})">${o}</button>`).join('');
  }else{
    opts=q[2].map((o,i)=>`<button class="opt" onclick="ansQ(${i})">${o}</button>`).join('');
  }
  b.innerHTML=`<div class="prog">${L[1]} ${L[2]} · питання ${QI+1} з ${qs.length}</div>
    <div class="blk"><p style="font-size:16px;margin:0">${q[0]}</p></div>
    <div id="qo">${opts}</div><div class="say" id="qs"></div>`;
  window.scrollTo(0,0);
}
function ansQ(v){
  const q=LV[QL][4][QI];
  const right=q[3];
  const ok=(q[1]==='tf')?((v===1)===right):(v===right);
  const btns=$$('#qo .opt');
  btns.forEach(b=>b.disabled=true);
  if(q[1]==='tf'){
    btns[right?0:1].classList.add('ok');
    if(!ok)btns[v===1?0:1].classList.add('no');
  }else{
    btns[right].classList.add('ok');
    if(!ok)btns[v].classList.add('no');
  }
  if(ok)QOK++;else QW.push([q[0],q]);
  buzz(ok?'success':'error');
  const last=QL===2;
  if(!last)say('#qs',(ok?'✔ ':'✘ ')+q[4],ok);
  setTimeout(()=>{QI++;drawQ()},last?450:1500);
}
function resQ(){
  const L=LV[QL],n=L[4].length;
  const pc=Math.round(QOK/n*100);
  const st=pc>=95?3:pc>=75?2:pc>=50?1:0;
  if(PR.best[L[0]]==null||pc>PR.best[L[0]]){PR.best[L[0]]=pc;save()}
  if(pc>=75)mark('test');
  let w='';
  if(QW.length&&QL===2){
    w='<div class="wrongs"><h3 style="font-family:Georgia,serif;color:var(--gold)">Розбір помилок</h3>'+
      QW.map(x=>{const q=x[1];const cor=(q[1]==='tf')?(q[3]?'Так':'Ні'):q[2][q[3]];
      return `<div class="w"><s>${q[0]}</s><br><em>Правильно: ${cor}</em><br>${q[4]}</div>`}).join('')+'</div>';
  }
  $('#t-body').innerHTML=`<div class="res">
    <div class="big">${pc}%</div>
    <div class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <div style="color:var(--dim)">Правильних ${QOK} з ${n}</div>
    <div style="margin-top:18px" class="row">
      <button class="btn" onclick="startQ(${QL})">Ще раз</button>
      <button class="btn g" onclick="open_('test')">До рівнів</button>
    </div>${w}</div>`;
  window.scrollTo(0,0);
  buzz(pc>=75?'success':'warning');
}
