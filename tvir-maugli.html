<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мауглі — розбір твору</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0C1512; --card:#14211C;
  --ink:#ECEFE6; --dim:#93A89B;
  --amber:#E0913C; --moon:#C3D2DE; --blood:#C8503F;
  --line:rgba(236,239,230,.14);
  --ok:#7BC08A; --no:#DB6A5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{padding:0 0 40px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.scr{display:none}.scr.on{display:block}

.hero{position:relative;padding:26px 16px 22px;overflow:hidden;
  background:radial-gradient(120% 85% at 78% 4%,#1E3229 0%,var(--bg) 70%)}
.moon{position:absolute;top:16px;right:22px;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#E7EEF4,#9FB2C0);opacity:.22}
.claw{position:absolute;top:66px;right:6px;width:110px;height:110px;pointer-events:none;opacity:.16}
.claw i{position:absolute;width:3px;height:92px;background:linear-gradient(180deg,transparent,var(--amber),transparent);
  border-radius:3px;transform-origin:top center}
.hero h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.5px}
.hero .by{margin:8px 0 0;color:var(--dim);font-size:14px}
.hero .meta{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}
.bar{margin-top:16px;height:5px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--ok));transition:width .5s}
.barlab{margin-top:7px;font-size:12px;color:var(--dim)}

.gh{margin:26px 0 10px;font-size:12px;color:var(--dim);letter-spacing:.5px}
.mod{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;color:var(--ink);font-size:15px;cursor:pointer}
.mod:active{transform:scale(.985)}
.mod .ic{font-size:22px;width:28px;text-align:center;flex:none}
.mod b{display:block;font-weight:600}
.mod small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.mod .dot{margin-left:auto;flex:none;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15)}
.mod.done .dot{background:var(--ok)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{background:none;border:none;color:var(--moon);font-size:15px;padding:4px 0;cursor:pointer}
.top h2{margin:0;font-size:16px;flex:1}
#t-body{padding:16px}

.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.blk h3{margin:0 0 8px;font-size:17px;color:var(--amber)}
.blk p{margin:0 0 9px}.blk p:last-child{margin-bottom:0}
.blk ul{margin:6px 0 0;padding-left:19px}.blk li{margin-bottom:5px}
.lead{color:var(--dim);font-size:14px;margin:0 0 14px}
.q{border-left:3px solid var(--blood);padding:2px 0 2px 12px;margin:10px 0;
  font-family:Georgia,serif;font-style:italic}
.note{background:rgba(224,145,60,.11);border:1px solid rgba(224,145,60,.3);
  border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:10px}

.facts{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{background:var(--card);padding:11px 14px;display:flex;gap:12px}
.facts span{color:var(--dim);font-size:13px;flex:none;width:104px;padding-top:1px}
.facts b{font-weight:600;font-size:14.5px}

.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--amber),var(--ok))}
.tl div{position:relative;margin-bottom:15px}
.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;
  border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--bg)}
.tl b{color:var(--amber);font-size:13px;display:block}

.storyhead{font-family:Georgia,serif;font-size:19px;color:var(--moon);
  margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ch{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}
.ch>button{width:100%;display:flex;gap:11px;align-items:center;background:none;border:none;
  color:var(--ink);padding:12px 14px;text-align:left;font-size:14.5px;cursor:pointer;font-family:inherit}
.ch .n{font-family:Georgia,serif;color:var(--blood);font-size:18px;width:26px;flex:none}
.ch .body{display:none;padding:0 14px 14px;font-size:14.5px}
.ch.open .body{display:block}
.ch .body .key{margin-top:9px;color:var(--ok);font-size:13.5px}

.per{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.per h4{margin:0;font-size:16px;font-family:Georgia,serif}
.per .role{color:var(--dim);font-size:12.5px;margin:2px 0 8px}
.per .tr{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.per .tr i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:20px;
  background:rgba(195,210,222,.13);color:var(--moon)}
.per .said{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--amber)}

.btn{background:var(--blood);color:#fff;border:none;border-radius:11px;padding:12px 18px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.g{background:rgba(255,255,255,.09);color:var(--ink)}
.btn:active{opacity:.85}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;
  font-size:15px;cursor:pointer;font-family:inherit}
.opt.ok{border-color:var(--ok);background:rgba(123,192,138,.15)}
.opt.no{border-color:var(--no);background:rgba(219,106,92,.13)}
.opt:disabled{opacity:.75}
.say{margin:10px 0;padding:10px 12px;border-radius:11px;font-size:14.5px;display:none}
.say.on{display:block}
.say.y{background:rgba(123,192,138,.15);border:1px solid var(--ok)}
.say.n{background:rgba(219,106,92,.13);border:1px solid var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.used{opacity:.3;pointer-events:none}
.chip.ok{border-color:var(--ok)}.chip.no{border-color:var(--no)}
.slot{min-height:44px;border:1px dashed var(--line);border-radius:11px;padding:8px;
  margin:10px 0;font-size:14px;color:var(--dim)}
.prog{font-size:13px;color:var(--dim);margin-bottom:10px}

.sp{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.sp b{display:block;font-size:15px;margin-bottom:8px}
.sp .ans{display:none;font-size:14.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.sp.open .ans{display:block}
.sp button{background:rgba(255,255,255,.08);border:none;color:var(--moon);
  border-radius:9px;padding:8px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}

.lvl{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
  color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}
.lvl .ic{font-size:24px}
.lvl b{display:block;font-size:15px}
.lvl small{color:var(--dim);font-size:12.5px}
.lvl .sc{margin-left:auto;color:var(--amber);font-size:13px;font-family:Georgia,serif}
.res{text-align:center;padding:20px 0}
.res .big{font-size:46px;font-family:Georgia,serif;color:var(--amber)}
.res .st{font-size:26px;letter-spacing:4px;margin:6px 0 12px}
.wrongs{text-align:left;margin-top:18px}
.wrongs .w{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:9px;font-size:14px}
.wrongs .w em{color:var(--no);font-style:normal}
.wrongs .w s{color:var(--dim)}
</style>
</head>
<body>

<div id="s-home" class="scr on">
  <div class="hero">
    <div class="moon"></div>
    <div class="claw">
      <i style="left:20px;transform:rotate(12deg)"></i>
      <i style="left:44px;transform:rotate(4deg)"></i>
      <i style="left:68px;transform:rotate(-4deg)"></i>
    </div>
    <h1>Мауглі</h1>
    <p class="by">Джозеф Редьярд Кіплінг · «Книга джунглів», 1894 · переклад Всеволода Прокопчука</p>
    <div class="meta">
      <span class="tag">оповідання</span>
      <span class="tag">Закон Джунглів</span>
      <span class="tag">Індія</span>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="barlab" id="plab">Пройдено 0 з 13</div>
  </div>
  <div class="wrap" id="menu"></div>
</div>

<div id="s-tool" class="scr">
  <div class="top">
    <button class="back" onclick="home()">‹ Назад</button>
    <h2 id="t-title"></h2>
  </div>
  <div class="wrap"><div id="t-body"></div></div>
</div>

<script>
/* ============ ядро ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
let TIMERS=[];
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id}
function stopAll(){TIMERS.forEach(clearInterval);TIMERS=[]}
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG){TG.ready();TG.expand();try{TG.setHeaderColor('#0C1512')}catch(e){}}

const KEY='maugli-tvir-v1';
let PR={done:{},best:{}};
function load(cb){
  try{const l=localStorage.getItem(KEY);if(l)PR=Object.assign(PR,JSON.parse(l))}catch(e){}
  if(TG&&TG.CloudStorage){
    TG.CloudStorage.getItem(KEY,(err,val)=>{
      if(!err&&val){try{PR=Object.assign(PR,JSON.parse(val))}catch(e){}}
      cb();
    });
  } else cb();
}
function save(){
  const s=JSON.stringify(PR);
  try{localStorage.setItem(KEY,s)}catch(e){}
  if(TG&&TG.CloudStorage){try{TG.CloudStorage.setItem(KEY,s)}catch(e){}}
}
function mark(k){if(!PR.done[k]){PR.done[k]=1;save()}paint()}
function buzz(t){try{TG.HapticFeedback.notificationOccurred(t)}catch(e){}}
function say(sel,txt,ok){const e=$(sel);if(!e)return;e.className='say on '+(ok?'y':'n');e.innerHTML=txt}
function hide(sel){const e=$(sel);if(e)e.className='say'}

const GROUPS=['Про твір','Розібратися','Перевірити себе'];
const M={},ORDER=[];
function T(k,o){M[k]=o;ORDER.push(k)}

function paint(){
  $('#menu').innerHTML=GROUPS.map((g,gi)=>{
    const items=ORDER.filter(k=>M[k].g===gi).map(k=>{
      const m=M[k];
      return `<button class="mod ${PR.done[k]?'done':''}" onclick="open_('${k}')">
        <span class="ic">${m.ic}</span>
        <span><b>${m.t}</b><small>${m.s}</small></span>
        <span class="dot"></span></button>`;
    }).join('');
    return `<div class="gh">${g}</div>${items}`;
  }).join('');
  const n=ORDER.filter(k=>PR.done[k]).length;
  $('#pbar').style.width=Math.round(n/ORDER.length*100)+'%';
  $('#plab').textContent=`Пройдено ${n} з ${ORDER.length}`;
}
function open_(k){
  stopAll();
  const m=M[k];
  $('#t-title').textContent=m.t;
  $('#t-body').innerHTML=m.html;
  $('#s-home').classList.remove('on');
  $('#s-tool').classList.add('on');
  window.scrollTo(0,0);
  if(m.init)m.init();
  if(TG&&TG.BackButton){TG.BackButton.show();TG.BackButton.onClick(home)}
}
function home(){
  stopAll();
  $('#s-tool').classList.remove('on');
  $('#s-home').classList.add('on');
  window.scrollTo(0,0);
  if(TG&&TG.BackButton)TG.BackButton.hide();
  paint();
}
function done(k){mark(k);home()}
function fin(k){return `<button class="btn" style="width:100%;margin-top:6px" onclick="done('${k}')">Готово, зрозумів</button>`}
function toggle(el){el.parentNode.classList.toggle('open')}

/* ================= 1. ПАСПОРТ ================= */
T('passport',{g:0,ic:'📋',t:'Паспорт твору',s:'Те, що просять назвати першим',html:`
<p class="lead">Відповіді, з яких починається будь-яка усна відповідь на уроці.</p>
<div class="facts">
  <div><span>Автор</span><b>Джозеф Редьярд Кіплінг, Англія (народився в Індії)</b></div>
  <div><span>Роки життя</span><b>1865–1936</b></div>
  <div><span>Назва</span><b>оповідання про Мауглі зі збірки «Книга джунглів»</b></div>
  <div><span>Роки виходу</span><b>оповідання друкувалися в журналах 1893–1894; окремою книжкою — наприкінці 1894 року</b></div>
  <div><span>Жанр</span><b>оповідання; разом вони складають цикл у збірці</b></div>
  <div><span>За програмою</span><b>«Брати Мауглі» та «Полювання Каа»</b></div>
  <div><span>Тема</span><b>життя хлопчика, вихованого вовками, у джунглях Індії та його дорослішання за Законом Джунглів</b></div>
  <div><span>Головна думка</span><b>усе живе пов’язане між собою, а справжня сила — не в зубах, а в законі, вірності й умінні бути частиною цілого</b></div>
  <div><span>Головні герої</span><b>Мауглі, Балу, Багіра, Каа, Акела, Мати Вовчиця, Шер-Хан</b></div>
  <div><span>Місце дії</span><b>Сіонійські гори в джунглях Індії, річка Вайнгунга, село поблизу</b></div>
  <div><span>Особливість</span><b>кожне оповідання закінчується віршем-піснею</b></div>
  <div><span>Переклад</span><b>українською — Всеволод Прокопчук та інші</b></div>
</div>
<div class="note"><b>Не сплутай.</b> «Книга джунглів» — це не тільки про Мауглі. Там є й інші оповідання, зокрема про мангуста Ріккі-Тіккі-Таві.</div>
${fin('passport')}`});

/* ================= 2. АВТОР ================= */
T('author',{g:0,ic:'👤',t:'Автор',s:'Англієць, для якого домом була Індія',html:`
<p class="lead">Кіплінг народився в Індії, заговорив індійською раніше, ніж англійською, — і все життя писав про світ, який знав із дитинства зсередини.</p>

<div class="blk"><h3>Дитинство в Бомбеї</h3>
<p>Народився 30 грудня 1865 року в місті Бомбеї (нині Мумбаї). Батько викладав у художній школі, мати писала вірші. Батьки були дуже зайняті, тому хлопчика виховували слуги-індійці — саме вони розповіли йому безліч індійських казок і легенд.</p>
<p>Перші слова Редьярд вимовив мовою хіндустані. Він виріс англоіндійцем: засвоїв одразу дві культури — західну і східну.</p>
<div class="note">Ім’я він отримав на честь англійського озера Редьярд, на березі якого познайомилися його батьки.</div></div>

<div class="blk"><h3>Школа, яку він ненавидів</h3>
<p>Навчався в закритому пансіоні, де його ображали, принижували й навіть били. Потім — в елітному Юнайтед Сервіс Коледжі, де готували військових для Британської імперії. Але військова справа його не приваблювала: він захопився літературою, писав вірші й надсилав їх у журнали, хоча спершу їх не друкували.</p></div>

<div class="blk"><h3>Чому індійці йому довіряли</h3>
<p>Кіплінг цікавився мовами, звичаями й законами різних народів Індії. Для місцевих англійці тоді були загарбниками — але його сприймали як свого, бо він знав і поважав їхні традиції. Йому розповідали легенди й ділилися життєвими історіями.</p>
<p>Саме там народилася головна його думка: про єдність усього живого й відповідальність людини за природу.</p></div>

<div class="blk"><h3>Мандрівник і лауреат</h3>
<p>Він багато подорожував: побував у Китаї, Австралії, Японії, країнах Африки, довго жив у США — і все побачене відображав у творах. 1907 року став першим англійцем, який отримав Нобелівську премію з літератури.</p>
<div class="note">Йому було лише 42 роки — і донині він лишається наймолодшим лауреатом Нобелівської премії з літератури. Ще одна дивна деталь: писати він міг тільки чорним чорнилом.</div></div>
${fin('author')}`});

/* ================= 3. ІСТОРІЯ ================= */
T('history',{g:0,ic:'📜',t:'Як народилася книжка',s:'Від індійських легенд до Нобеля',html:`
<div class="blk"><div class="tl">
<div><b>1865</b>Народження в Бомбеї. Дитинство серед слуг-індійців, казки й легенди рідною для них мовою.</div>
<div><b>юність</b>Пансіон і коледж в Англії, перші вірші, робота журналістом в Індії.</div>
<div><b>1893–1894</b>Оповідання «Книги джунглів» друкуються в журналах. Кожне закінчується віршем-піснею.</div>
<div><b>кінець 1894</b>«Книга джунглів» виходить окремою книжкою. Ілюстрації до неї робив батько письменника, Джон-Локвуд Кіплінг.</div>
<div><b>1895</b>З’являється продовження — «Друга книга джунглів», де історія Мауглі доходить до кінця.</div>
<div><b>1907</b>Нобелівська премія з літератури. Кіплінгові 42 роки — рекорд, не побитий досі.</div>
<div><b>1936</b>Кіплінг помирає, лишивши по собі новели, романи, вірші — але найвідомішим стало те, що він писав для дітей.</div>
</div></div>
<div class="note"><b>Що треба на уроці:</b> 1865–1936, народився в Бомбеї, «Книга джунглів» 1894 року, Нобелівська премія 1907, найвідоміші герої — Мауглі, Ріккі-Тіккі-Таві, Слоненя.</div>
${fin('history')}`});

/* ================= 4. СЮЖЕТ ================= */

const COMP=[
 ['Вечір у джунглях, вовча родина, звістка Табакі про Шер-Хана','експозиція'],
 ['До печери приходить людське дитинча, і Мати Вовчиця бере його','зав’язка'],
 ['Скеля Ради, роки навчання, старіння Акели','розвиток дії'],
 ['Мауглі приносить Червону Квітку і розганяє Зграю','кульмінація'],
 ['Мауглі прощається з вовками і йде до людей','розв’язка']
];
const CNAMES=['експозиція','зав’язка','розвиток дії','кульмінація','розв’язка'];
function buildComp(){
  const box=$('#comp');if(!box)return;
  box.innerHTML=COMP.map((c,i)=>`<div style="margin:12px 0 16px">
    <div style="font-size:14.5px;margin-bottom:7px">${c[0]}</div>
    <div class="row" id="cr${i}">${CNAMES.map(n=>
      `<button class="chip" onclick="pickComp(${i},'${n}',this)">${n}</button>`).join('')}</div></div>`).join('');
}
function pickComp(i,n,el){
  const ok=COMP[i][1]===n;
  $$('#cr'+i+' .chip').forEach(b=>b.disabled=true);
  el.classList.add(ok?'ok':'no');
  if(!ok){$$('#cr'+i+' .chip').forEach(b=>{if(b.textContent===COMP[i][1])b.classList.add('ok')})}
  buzz(ok?'success':'error');
  if($$('#comp .chip.ok').length>=5)
    say('#cs','Кульмінація тут — вогонь, а не бійка. Мауглі перемагає тим, чого в джунглях ні в кого немає.',true);
}

<div class="blk"><h3>Закон Джунглів</h3>
<p>Джунглі здаються місцем, де виживає найсильніший. Насправді там усе тримається на Законі, суворому, але справедливому. Він забороняє полювати заради розваги чи помсти — тільки заради їжі. Забороняє чіпати Людину. Вимагає ділитися здобиччю зі слабшим і берегти чуже лігво.</p>

<div class="blk"><h3>Ми однієї крові</h3>
<p>Заповітні Слова, яких Балу навчив Мауглі, — це не чари, а спосіб сказати чужому племені: ми не вороги. Хлопець звертається так до птахів, змій, слонів — і вони відгукуються. У цьому й полягає думка Кіплінга про єдність усього живого.</p></div>

T('train',{g:2,ic:'🐾',t:'Тренажери',s:'Чотири вправи на пам’ять і розуміння',html:`
<p class="lead">Помилятися можна скільки завгодно — саме так і запам’ятовується.</p>

<div class="blk"><h3>Хто це сказав?</h3>
<div class="prog" id="wsp"></div>
<div id="ws"></div><div class="say" id="wss"></div></div>

<div class="blk"><h3>Постав події по порядку</h3>
<p style="font-size:14px;color:var(--dim);margin-top:0">Події обох оповідань, від першої до останньої.</p>
<div class="slot" id="oslot">поки порожньо</div>
<div class="row" id="ord"></div><div class="say" id="os"></div></div>

<div class="blk"><h3>За Законом чи проти нього?</h3>
<p style="font-size:14px;color:var(--dim);margin-top:0">Головна перевірка на розуміння твору.</p>
<div id="lw"></div><div class="say" id="lws"></div></div>

<div class="blk"><h3>Хто є хто в джунглях</h3>
<p style="font-size:14px;color:var(--dim);margin-top:0">Признач кожному його вид і роль.</p>
<div id="rl"></div><div class="say" id="rls"></div></div>
${fin('train')}`,
init(){initWho();initOrder();initLw();initRl()}});

const WHO=[
 ['Ми з тобою однієї крові — ти і я.','Мауглі',['Мауглі','Балу','Каа']],
 ['Дитинча моє, рано чи пізно йому не минути моїх зубів.','Шер-Хан',['Табакі','Шер-Хан','Акела']],
 ['Хоробре серце і ввічлива мова далеко поведуть тебе.','Каа',['Каа','Багіра','Хаті']],
 ['Я люблю тебе більше, ніж любила своїх щенят.','Мати Вовчиця',['Багіра','Мати Вовчиця','Мессуа']],
 ['Зате Людське дитинча знову з нами!','Балу',['Балу','Акела','Чіль']],
 ['Ось що вийшло з твоїх забавок з Бандар-Логами!','Багіра',['Балу','Багіра','Каа']],
 ['Хай доля пошле щастя твоїм шляхетним діткам!','Табакі',['Табакі','Чіль','Табакі-молодший']],
 ['Ніколи, поки здужаємо ходити по сліду.','вовченята',['вовченята','Бандар-Логи','буйволи']]
];
let wi=0,wok=0;
function initWho(){wi=0;wok=0;drawWho()}
function drawWho(){
  const b=$('#ws');if(!b)return;
  if(wi>=WHO.length){
    b.innerHTML='';$('#wsp').textContent='';
    say('#wss',`Правильних: ${wok} з ${WHO.length}. <button class="btn g" style="margin-top:8px" onclick="initWho();hide('#wss')">Ще раз</button>`,wok>=6);
    return;
  }
  hide('#wss');
  $('#wsp').textContent=`Репліка ${wi+1} з ${WHO.length}`;
  const w=WHO[wi];
  b.innerHTML=`<div class="q">${w[0]}</div>`+
    w[2].map(o=>`<button class="opt" onclick="ansWho(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('');
}
function ansWho(el,o){
  const w=WHO[wi];const ok=(o===w[1]);
  $$('#ws .opt').forEach(b=>{b.disabled=true;if(b.textContent===w[1])b.classList.add('ok')});
  if(!ok)el.classList.add('no');else wok++;
  buzz(ok?'success':'error');
  setTimeout(()=>{wi++;drawWho()},900);
}

const ORD=[
 'Табакі приносить звістку, що Шер-Хан полює тут',
 'До печери приходить людське дитинча',
 'Скеля Ради: Балу заступається, Багіра платить викуп',
 'Акела схибив на полюванні',
 'Мауглі приносить Червону Квітку і йде до людей',
 'Балу вчить Мауглі Заповітних Слів',
 'Бандар-Логи викрадають Мауглі до Холодних Печер',
 'Каа рятує Мауглі, і Багіра нагадує йому про ціну'
];
let opick=[];
function initOrder(){
  opick=[];
  const box=$('#ord');if(!box)return;
  const sh=ORD.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  box.innerHTML=sh.map(o=>`<button class="chip" data-i="${o.i}" onclick="pickOrd(this)">${o.t}</button>`).join('');
  $('#oslot').textContent='поки порожньо';hide('#os');
}
function pickOrd(el){
  const i=+el.dataset.i,ok=(i===opick.length);
  if(ok){
    opick.push(i);el.classList.add('used');
    $('#oslot').innerHTML=opick.map((n,k)=>`${k+1}. ${ORD[n]}`).join('<br>');
    buzz('success');
    if(opick.length===ORD.length)say('#os','Перші п’ять подій — «Брати Мауглі», останні три — «Полювання Каа».',true);
  }else{
    el.classList.add('no');buzz('error');
    say('#os','Не поспішай — ця подія буде пізніше.',false);
    setTimeout(()=>{el.classList.remove('no');hide('#os')},900);
  }
}

const LAW=[
 ['Шер-Хан полює на Людину',0,'Закон прямо забороняє чіпати Людину: за вбивство приходять білі люди з рушницями, і страждають усі Джунглі.'],
 ['Вовк убиває оленя, щоб нагодувати щенят',1,'Бити дозволено для себе й для малих — але тільки не заради забави.'],
 ['Шер-Хан змінює місце ловів без попередження',0,'Порушення: він розполохає дичину на десять миль навколо, і сусіди голодуватимуть.'],
 ['Табакі підбирає недоїдки тигра',1,'Це неприємно, і вовки шакалів зневажають, але Закон саме так і каже: шакал підбирає недоїдки тигра.'],
 ['Мауглі йде гратися з Бандар-Логами, хоч Балу заборонив',0,'Порушення — і воно ледь не коштувало життя і йому, і його вчителям.'],
 ['Балу заступається за чужинця на Раді',1,'Закон передбачає, що за нове щеня можуть поручитися двоє з Племені, крім батьків.'],
 ['Багіра платить за Мауглі щойно вбитим биком',1,'Викуп теж передбачений Законом — саме тому Зграя не може відмовити.'],
 ['Бандар-Логи живуть без вожака й без правил',0,'Тому Джунглі їх і не вважають за плем’я: без Закону немає ні пам’яті, ні поваги.']
];
function initLw(){
  const b=$('#lw');if(!b)return;
  b.innerHTML=LAW.map((l,i)=>`<div style="margin-bottom:13px">
    <div style="font-size:14.5px;margin-bottom:6px">${l[0]}</div>
    <div class="row" id="lw${i}">
      <button class="chip" onclick="ansLw(${i},1,this)">за Законом</button>
      <button class="chip" onclick="ansLw(${i},0,this)">порушення</button>
    </div><div class="say" id="lwe${i}"></div></div>`).join('');
}
function ansLw(i,v,el){
  const ok=(LAW[i][1]===v);
  $$('#lw'+i+' .chip').forEach(b=>b.disabled=true);
  el.classList.add(ok?'ok':'no');
  say('#lwe'+i,LAW[i][2],ok);
  buzz(ok?'success':'error');
  if($$('#lw .chip.ok').length+$$('#lw .chip.no').length>=LAW.length)
    say('#lws','Головне, що з цього видно: Закон Джунглів — не право сильного, а якраз межа для сильних.',true);
}

const RL=[
 ['Балу','бурий ведмідь, учитель Закону'],
 ['Багіра','чорна пантера, яка викупила Мауглі'],
 ['Каа','скельний пітон, якого бояться мавпи'],
 ['Акела','старий ватажок Вовчої Зграї'],
 ['Табакі','шакал, що розносить плітки'],
 ['Чіль','шуліка, який приніс звістку']
];
function initRl(){
  const b=$('#rl');if(!b)return;
  const roles=RL.map(r=>r[1]).sort(()=>Math.random()-.5);
  b.innerHTML=RL.map((r,i)=>`<div style="margin-bottom:13px">
    <div style="font-size:14.5px;margin-bottom:6px;color:var(--amber)">${r[0]}</div>
    <div class="row" id="rl${i}">${roles.map(o=>
      `<button class="chip" style="font-size:13px" onclick="ansRl(${i},this)">${o}</button>`).join('')}</div></div>`).join('');
}
function ansRl(i,el){
  const ok=(el.textContent===RL[i][1]);
  $$('#rl'+i+' .chip').forEach(b=>{b.disabled=true;if(b.textContent===RL[i][1])b.classList.add('ok')});
  if(!ok)el.classList.add('no');
  buzz(ok?'success':'error');
  if($$('#rl .chip.ok').length>=RL.length)
    say('#rls','Кожен із них — окрема сила в джунглях. Мауглі виживає тому, що дружить із кожною.',true);
}

T('test',{g:2,ic:'🧠',t:'Тести',s:'Три рівні складності',html:`
<p class="lead">Легкий пояснює після кожної відповіді. Дуже складний мовчить до кінця, а тоді показує розбір помилок.</p>
<div id="lvls"></div>`,
init(){drawLv()}});

function drawLv(){
  const b=$('#lvls');if(!b)return;
  b.innerHTML=LV.map((l,i)=>{
    const s=PR.best[l[0]];
    return `<button class="lvl" onclick="startQ(${i})">
      <span class="ic">${l[1]}</span>
      <span><b>${l[2]}</b><small>${l[3]} · ${l[4].length} питань</small></span>
      <span class="sc">${s!=null?s+'%':''}</span></button>`;
  }).join('');
}
let QL=0,QI=0,QOK=0,QW=[];
function startQ(l){QL=l;QI=0;QOK=0;QW=[];drawQ()}
function drawQ(){
  const L=LV[QL],qs=L[4],b=$('#t-body');
  if(QI>=qs.length)return resQ();
  const q=qs[QI];
  const opts=(q[1]==='tf')
    ? ['Так','Ні'].map((o,i)=>`<button class="opt" onclick="ansQ(${i===0?1:0})">${o}</button>`).join('')
    : q[2].map((o,i)=>`<button class="opt" onclick="ansQ(${i})">${o}</button>`).join('');
  b.innerHTML=`<div class="prog">${L[1]} ${L[2]} · питання ${QI+1} з ${qs.length}</div>
    <div class="blk"><p style="font-size:16px;margin:0">${q[0]}</p></div>
    <div id="qo">${opts}</div><div class="say" id="qs"></div>`;
  window.scrollTo(0,0);
}
function ansQ(v){
  const q=LV[QL][4][QI];
  const right=q[3];
  const ok=(q[1]==='tf')?((v===1)===right):(v===right);
  const btns=$$('#qo .opt');
  btns.forEach(b=>b.disabled=true);
  if(q[1]==='tf'){
    btns[right?0:1].classList.add('ok');
    if(!ok)btns[v===1?0:1].classList.add('no');
  }else{
    btns[right].classList.add('ok');
    if(!ok)btns[v].classList.add('no');
  }
  if(ok)QOK++;else QW.push(q);
  buzz(ok?'success':'error');
  const last=QL===2;
  if(!last)say('#qs',(ok?'✔ ':'✘ ')+q[4],ok);
  setTimeout(()=>{QI++;drawQ()},last?450:1500);
}
function resQ(){
  const L=LV[QL],n=L[4].length;
  const pc=Math.round(QOK/n*100);
  const st=pc>=95?3:pc>=75?2:pc>=50?1:0;
  if(PR.best[L[0]]==null||pc>PR.best[L[0]]){PR.best[L[0]]=pc;save()}
  if(pc>=75)mark('test');
  let w='';
  if(QW.length&&QL===2){
    w='<div class="wrongs"><h3 style="font-family:Georgia,serif;color:var(--amber)">Розбір помилок</h3>'+
      QW.map(q=>{const cor=(q[1]==='tf')?(q[3]?'Так':'Ні'):q[2][q[3]];
      return `<div class="w"><s>${q[0]}</s><br><em>Правильно: ${cor}</em><br>${q[4]}</div>`}).join('')+'</div>';
  }
  $('#t-body').innerHTML=`<div class="res">
    <div class="big">${pc}%</div>
    <div class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <div style="color:var(--dim)">Правильних ${QOK} з ${n}</div>
    <div style="margin-top:18px" class="row">
      <button class="btn" onclick="startQ(${QL})">Ще раз</button>
      <button class="btn g" onclick="open_('test')">До рівнів</button>
    </div>${w}</div>`;
  window.scrollTo(0,0);
  buzz(pc>=75?'success':'warning');
}
