<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Інформатика руками</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9; --grid:#E8E5DA;
    --accent:#5B4BD6; --accent-soft:#EBE8FB; --volt:#E9A800; --volt-soft:#FFF3D4;
    --ok:#1F9D63; --ok-soft:#E3F6EC; --bad:#D8433B; --bad-soft:#FCE9E7;
    --blue:#2F6FE4; --blue-soft:#E6EEFF; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.015em;margin:0}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  .app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 48px}
  .screen{display:none}.screen.on{display:block}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:32px}
  .back{color:var(--accent);font-weight:600}
  .bar h2{font-size:17px;flex:1;text-align:center}
  header.hero{margin:6px 0 20px}
  header.hero h1{font-size:31px;line-height:1.15}
  header.hero p{color:var(--ink-2);margin:8px 0 0;max-width:34em}
  .tool{display:flex;gap:14px;align-items:center;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}
  .tool .ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--accent-soft)}
  .tool .tx{flex:1;min-width:0}
  .tool b{display:block;font-size:16px}
  .tool span{color:var(--ink-2);font-size:13px}
  .tool .tick{color:var(--ok);font-weight:700;font-size:18px;opacity:0}
  .tool.done .tick{opacity:1}
  .grp{color:var(--ink-2);font-size:14px;margin:22px 0 8px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px}
  .task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
  .hintline{color:var(--ink-2);font-size:14px;margin-top:10px;min-height:1.4em}
  .verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
  .verdict.on{display:block}
  .verdict.good{background:var(--ok-soft);color:#14603E}
  .verdict.warn{background:var(--bad-soft);color:#8F2018}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .center{justify-content:center}
  .btn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:8px 12px;font-size:14px}
  .legend{color:var(--ink-2);font-size:14px;margin-top:10px}
  .big{font-size:26px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
  svg{display:block;max-width:100%;touch-action:none}
  input[type=text],input[type=number]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .chip{display:inline-block;background:#F4F2EC;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);margin-left:6px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-size:15px}
  .opt.good{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .sieve{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0}
  .sieve button{aspect-ratio:1;border-radius:7px;background:#F4F2EC;font-size:12px;font-weight:600;color:var(--ink)}
  .sieve button.out{background:#EFEDE6;color:#C4C0B4;text-decoration:line-through}
  .sieve button.prime{background:var(--accent-soft);color:#14603E}
  .sieve button.one{background:#fff;color:#C4C0B4;border:1px dashed var(--line)}
  .strip{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:10px 0}
  .strip div{aspect-ratio:1;border-radius:4px;background:#EFEDE6}
  .strip div.on{background:var(--accent)}
  .strip div.cut{background:var(--bad-soft)}
  .fracbar{height:44px;display:flex;gap:2px;margin:6px 0 2px}
  .fracbar i{flex:1;border-radius:5px;background:#EFEDE6}
  .fracbar i.on{background:var(--blue)}
  .fracbar.b i.on{background:var(--volt)}
  .grid8{display:grid;width:min(100%,320px);margin:0 auto;border:2px solid #C9C6BB;border-radius:6px;overflow:hidden}
  .grid8 button{aspect-ratio:1;border:0;background:#F6F3E9}
  .grid8 button.on{background:var(--accent);border:1px solid rgba(255,255,255,.35)}
  .pans{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:10px 0}
  .pan{flex:1;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:#FCFBF7}
  .xbox{width:38px;height:38px;border-radius:9px;background:var(--blue-soft);border:2px solid var(--blue);
    display:grid;place-items:center;font-weight:700;color:var(--blue)}
  .wt{width:26px;height:26px;border-radius:50%;background:#F4EBD0;border:2px solid var(--volt)}
  .hanoi{display:flex;justify-content:space-around;align-items:flex-end;height:150px;margin:10px 0}
  .peg{position:relative;width:31%;height:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;
    border-bottom:5px solid #8B8578;padding-bottom:0}
  .peg:before{content:'';position:absolute;bottom:0;width:6px;height:100%;background:#D8D3C4;border-radius:3px}
  .disk{height:20px;border-radius:6px;position:relative;z-index:1;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .peg.sel{background:rgba(31,122,90,.07);border-radius:10px}
  table.tt{border-collapse:collapse;width:100%;margin-top:10px;font-variant-numeric:tabular-nums}
  table.tt th,table.tt td{border:1px solid var(--line);padding:6px;text-align:center;font-size:15px}
  table.tt th{background:#F4F2EC;font-weight:600}
  .bits{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
  .bit{width:44px;text-align:center}
  .bit button{width:44px;height:52px;border-radius:10px;background:#EFEDE6;font-size:22px;font-weight:700;color:#B9B5A8}
  .bit button.on{background:var(--accent);color:#fff}
  .bit span{display:block;font-size:11px;color:var(--ink-2);margin-top:3px}
  .pix{display:grid;width:min(100%,270px);margin:0 auto;gap:1px;background:#D8D3C4;border:2px solid #C9C6BB;border-radius:6px;overflow:hidden}
  .pix button{aspect-ratio:1;border:0;background:#fff}
  .pix button.on{background:#1E2A3A}
  .rgrid{display:grid;width:min(100%,300px);margin:0 auto;gap:2px}
  .rgrid div{aspect-ratio:1;border-radius:4px;background:#F4F2EC;display:grid;place-items:center;font-size:15px}
  .rgrid div.rob{background:var(--accent-soft)}
  .rgrid div.goal{background:#FFF3D4}
  .rgrid div.wall{background:#8B8578}
  .prog{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin:10px 0}
  .cmd{background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600}
  .cmd.now{background:var(--volt-soft);border-color:var(--volt)}
  .bars{display:flex;align-items:flex-end;gap:4px;height:130px;justify-content:center}
  .bars div{flex:1;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;transition:height .2s}
  .bars div.cmp{background:var(--volt)}
  .bars div.done{background:var(--ok)}
  .tree{font-size:15px;line-height:1.8}
  .tree button{text-align:left}
  .tree .fold{color:var(--accent);font-weight:600}
  .mail{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font-size:15px;line-height:1.7}
  .mail mark{background:#FFF3D4;border-radius:4px;padding:1px 3px;cursor:pointer}
  .mail mark.hit{background:var(--ok-soft);outline:2px solid var(--ok)}
  .planet{cursor:pointer}
  .molec{position:relative;height:150px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#F7FAFF}
  .mol{position:absolute;width:13px;height:13px;border-radius:50%;background:#2F6FE4}
  .tank{height:170px;border:3px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;position:relative;overflow:hidden;background:#EAF4FF}
  .tank .surf{position:absolute;left:0;right:0;top:38%;height:2px;background:#5AA9EE}
  .item{position:absolute;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;transition:top .5s ease}
  .kbox{border:2px dashed var(--line);border-radius:12px;min-height:64px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .kcard{border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;font-size:14px}
  .kcard.sel{border-color:var(--accent);background:var(--accent-soft)}
  .pyr{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
  .lvl{border-radius:10px;padding:9px 14px;font-weight:600;color:#fff;text-align:center;transition:opacity .3s}
  .lvl.dead{opacity:.25;text-decoration:line-through}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<section id="s-home" class="screen on">
  <header class="hero">
    <h1>Інформатика руками</h1>
    <p>Шістнадцять приладів. Комп'ютер перестає бути чорною скринькою, коли бачиш, з чого він зроблений.</p>
  </header>
  <div id="home-list"></div>
</section>
<section id="s-tool" class="screen">
  <div class="bar"><button class="back" onclick="go('s-home')">‹ Прилади</button><h2 id="t-title"></h2><span style="width:64px"></span></div>
  <div id="t-body"></div>
</section>
</div>
<script>
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const tg = window.Telegram && window.Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
let PR = {};
const KEY='inf-lab-v1';
try { PR = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){}
if (tg && tg.CloudStorage) tg.CloudStorage.getItem(KEY,(e,v)=>{ if(!e&&v){ try{PR=Object.assign(PR,JSON.parse(v));homeDraw();}catch(_){}}});
function saveP(){ try{localStorage.setItem(KEY,JSON.stringify(PR));}catch(e){}
  if(tg && tg.CloudStorage) tg.CloudStorage.setItem(KEY,JSON.stringify(PR),()=>{}); }
function mark(k){ if(!PR[k]){ PR[k]=1; saveP(); homeDraw(); } }
function go(id){ if(id==='s-home')stopAll(); $$('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0); }
function say(sel,text,good){ const e=$(sel); if(!e)return; e.className='verdict on '+(good?'good':'warn'); e.innerHTML=text; }
function hide(sel){ const e=$(sel); if(e) e.className='verdict'; }
const gcd=(a,b)=>b?gcd(b,a%b):a;
const GROUPS=['Як влаштована інформація','Алгоритми','Дані, файли, мережа','Безпека й творення'];
const TOOLS={};
function T(key,o){ TOOLS[key]=o; }
let TIMERS=[];
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id;}
function stopAll(){TIMERS.forEach(clearInterval);TIMERS=[];}

/* --- 1. Сонячна система --- */
T('sun',{g:0,ic:'🪐',t:'Сонячна система',s:'Орбіти, розміри й порядок планет',html:`
<div class="panel">
  <div class="task">Тисни на планету — дізнаєшся про неї. Повзунок прискорює час.</div>
  <svg viewBox="0 0 320 320" height="310" id="ss-svg"></svg>
  <div class="row"><div style="flex:1">швидкість часу<input type="range" min="0" max="10" value="3" id="ss-sp"></div></div>
  <div class="hintline" id="ss-info">Меркурій робить оберт за 88 днів, Нептун — за 165 років. Тому внутрішні планети біжать швидко, а зовнішні майже стоять.</div>
  <div class="row center"><button class="btn" onclick="ssQuiz()">Питання</button></div>
  <div class="verdict" id="ss-v"></div>
  <div class="legend">Розміри й відстані тут не в масштабі: якби Земля була горошиною, Сонце було б за 25 метрів від неї.</div>
</div>`,init(){ssStart();}});

/* --- 1. Двійкові лампочки --- */
T('bits',{g:0,ic:'💡',t:'Двійкові лампочки',s:'Як комп’ютер записує числа',html:`
<div class="panel">
  <div class="task" id="bt-task"></div>
  <div class="bits" id="bt-row"></div>
  <div class="big" id="bt-val"></div>
  <div class="hintline" id="bt-sum"></div>
  <div class="row center"><button class="btn" onclick="btCheck()">Перевірити</button>
    <button class="btn ghost" onclick="btNew()">Інше число</button>
    <button class="btn ghost" onclick="btClear()">Погасити всі</button></div>
  <div class="verdict" id="bt-v"></div>
  <div class="legend">Вісім лампочок — один байт. Найбільше, що можна ними записати, — 255, а всього комбінацій 256.</div>
</div>`,init(){btB=[0,0,0,0,0,0,0,0];btI=0;btOk=0;btDraw();}});
const btT=[42,100,7,255,13];
let btB=[0,0,0,0,0,0,0,0],btI=0,btOk=0;
function btVal(){return btB.reduce((a,v,i)=>a+v*Math.pow(2,7-i),0);}
function btDraw(){const box=$('#bt-row');box.innerHTML='';
  btB.forEach((v,i)=>{const w=document.createElement('div');w.className='bit';
    const p=Math.pow(2,7-i);
    w.innerHTML='<button class="'+(v?'on':'')+'">'+v+'</button><span>'+p+'</span>';
    w.firstChild.onclick=()=>{btB[i]=1-btB[i];btDraw();};box.appendChild(w);});
  $('#bt-val').textContent=btVal();
  const parts=btB.map((v,i)=>v?Math.pow(2,7-i):0).filter(x=>x);
  $('#bt-sum').textContent=parts.length?parts.join(' + ')+' = '+btVal():'усі лампочки вимкнені';
  $('#bt-task').innerHTML='Увімкни лампочки так, щоб вийшло <b>'+btT[btI]+'</b>.<span class="chip">'+btOk+' з 3</span>';}
function btCheck(){if(btVal()===btT[btI]){btOk++;btI=(btI+1)%btT.length;
    if(btOk>=3)mark('bits');btDraw();
    say('#bt-v','Точно. Кожна лампочка вдвічі «дорожча» за сусідню праворуч. Наступне число: '+btT[btI]+'.',true);}
  else say('#bt-v','Зараз '+btVal()+'. Починай із найбільшої лампочки, яка ще влазить у число.',false);}
function btNew(){btI=(btI+1)%btT.length;btDraw();hide('#bt-v');}
function btClear(){btB=[0,0,0,0,0,0,0,0];btDraw();}

/* --- 2. Одиниці інформації --- */
T('units',{g:0,ic:'💾',t:'Байти, кілобайти, гігабайти',s:'Скільки фото влізе на флешку',html:`
<div class="panel">
  <div class="task">Пересувай повзунок і дивись, як те саме число виглядає в різних одиницях.</div>
  <div class="big" id="un-val"></div>
  <input type="range" min="0" max="40" value="20" id="un-r" oninput="unDraw()">
  <table class="tt" id="un-tt"></table>
  <div class="hintline" id="un-cmp"></div>
  <div class="row center" style="margin-top:10px"><input type="number" id="un-in" style="width:150px;text-align:center" placeholder="фото по 4 МБ на 16 ГБ">
    <button class="btn small" onclick="unCheck()">Скільки фото?</button></div>
  <div class="verdict" id="un-v"></div>
  <div class="legend">У комп’ютері рахують не десятками, а двійками: 1 КБ = 1024 байти, бо 1024 = 2¹⁰.</div>
</div>`,init(){unDraw();}});
function unDraw(){const k=+$('#un-r').value,bytes=Math.pow(2,k);
  const fmt=n=>n>=1?n.toFixed(n<10?2:0):n.toFixed(3);
  $('#un-val').textContent=bytes>=1073741824?fmt(bytes/1073741824)+' ГБ':bytes>=1048576?fmt(bytes/1048576)+' МБ':bytes>=1024?fmt(bytes/1024)+' КБ':bytes+' Б';
  $('#un-tt').innerHTML='<tr><th>біти</th><th>байти</th><th>КБ</th><th>МБ</th></tr><tr><td>'+
    (bytes*8).toLocaleString('uk')+'</td><td>'+bytes.toLocaleString('uk')+'</td><td>'+fmt(bytes/1024)+'</td><td>'+fmt(bytes/1048576)+'</td></tr>';
  const ex=bytes<1024?'одна буква — це 1–2 байти':bytes<102400?'сторінка тексту ≈ 3 КБ':
    bytes<10485760?'фото з телефона ≈ 4 МБ':bytes<1073741824?'пісня ≈ 5 МБ, серія мультика ≈ 300 МБ':'фільм ≈ 2 ГБ';
  $('#un-cmp').textContent='Для порівняння: '+ex;}
function unCheck(){const v=+$('#un-in').value;
  if(v===4096){mark('units');say('#un-v','Так: 16 ГБ = 16 × 1024 МБ = 16384 МБ, а 16384 : 4 = <b>4096</b> фото.',true);}
  else say('#un-v','Ще ні. Спершу переведи 16 ГБ у мегабайти — множ на 1024.',false);}

/* --- 3. Кодування тексту --- */
T('text',{g:0,ic:'🔤',t:'Букви стають числами',s:'Що насправді зберігає комп’ютер',html:`
<div class="panel">
  <div class="task">Напиши слово — і подивись, у що воно перетворюється всередині комп’ютера.</div>
  <input type="text" id="tx-in" value="сова" oninput="txDraw()" maxlength="12">
  <div style="margin-top:12px;font-size:14px;color:var(--ink-2)">номери букв в алфавіті</div>
  <div class="cipher-out" id="tx-num"></div>
  <div style="margin-top:8px;font-size:14px;color:var(--ink-2)">ті самі номери у двійковому коді</div>
  <div class="cipher-out" id="tx-bin" style="font-size:14px"></div>
  <div class="hintline" id="tx-state"></div>
  <div class="verdict" id="tx-v"></div>
  <div class="legend">Комп’ютер не знає букв — лише числа. Таблиця, яка каже, що «а» це 1, називається кодуванням; сучасне зветься Unicode.</div>
</div>`,init(){txDraw();}});
const AL='абвгґдеєжзиіїйклмнопрстуфхцчшщьюя';
function txDraw(){const w=$('#tx-in').value.toLowerCase();
  const nums=[...w].map(c=>{const i=AL.indexOf(c);return i<0?0:i+1;});
  $('#tx-num').textContent=nums.join(' · ');
  $('#tx-bin').textContent=nums.map(n=>n.toString(2).padStart(6,'0')).join(' ');
  const bits=nums.length*6;
  $('#tx-state').textContent='Букв: '+nums.length+' · бітів у цьому записі: '+bits+' ≈ '+Math.ceil(bits/8)+' байт';
  if(w.length>=4){mark('text');
    say('#tx-v','Одна буква нашого алфавіту вміщається в 6 біт, бо 2⁶ = 64 > 33. У справжньому Unicode на кирилицю відводять 2 байти — щоб вистачило на всі мови світу.',true);}}

/* --- 4. Піксельний малюнок --- */
T('pixel',{g:0,ic:'🖼',t:'Малюнок із пікселів',s:'Чому фото важить мегабайти',html:`
<div class="panel">
  <div class="task">Намалюй щось на сітці 8×8 — і подивись, скільки місця це займе.</div>
  <div class="pix" id="px-grid" style="grid-template-columns:repeat(8,1fr)"></div>
  <div class="hintline" id="px-state"></div>
  <div class="row center" style="margin-top:10px"><button class="btn ghost" onclick="pxClear()">Стерти</button>
    <button class="btn" onclick="pxBig()">А якщо як у телефона?</button></div>
  <div class="verdict" id="px-v"></div>

T('robot',{g:1,ic:'🤖',t:'Виконавець',s:'Склади програму й запусти',html:`

const rbL=[{w:5,h:4,start:[0,3],dir:0,goal:[4,0],walls:[],hint:'Проста дорога: угору й праворуч.'},
 {w:5,h:4,start:[0,3],dir:0,goal:[4,3],walls:[[2,3],[2,2]],hint:'Стіна на дорозі — доведеться обійти.'},
 {w:6,h:5,start:[0,4],dir:0,goal:[5,0],walls:[[1,3],[3,3],[3,1],[4,1]],hint:'Тут без плану не пройти: спершу подумай, потім став команди.'}];
let rbI=0,rbOk=0,RB={x:0,y:0,d:0},rbProg=[],rbTimer=null;
function rbLoad(i){rbI=i;stopAll();const L=rbL[i];RB={x:L.start[0],y:L.start[1],d:L.dir};rbProg=[];hide('#rb-v');
  $('#rb-lv').innerHTML=rbL.map((l,k)=>'<button class="btn small'+(k===i?'':' ghost')+'" onclick="rbLoad('+k+')">рівень '+(k+1)+'</button>').join('');

  const p=$('#rb-prog');p.innerHTML='';

/* --- 12. Як ходить інтернет --- */
T('net',{g:2,ic:'🌐',t:'Пакети в мережі',s:'Чому інтернет важко зламати',html:`
<div class="panel">
  <div class="task">Надішли пакет із твого комп’ютера на сервер. Потім вимкни вузол посеред дороги.</div>
  <svg viewBox="0 0 320 200" height="195" id="nt-svg"></svg>
  <div class="row center"><button class="btn" onclick="ntSend()">Надіслати пакет</button>
    <button class="btn ghost" onclick="ntReset()">Увімкнути всі вузли</button></div>
  <div class="hintline" id="nt-state">Тисни на вузол, щоб вимкнути його.</div>
  <div class="verdict" id="nt-v"></div>
  <div class="legend">Мережа не має єдиної дороги: якщо вузол зник, пакет шукає інший маршрут. Саме так інтернет і задумували.</div>
</div>`,init(){ntDead={};ntPath=[];ntReset();}});
const NT={pos:[[24,100],[110,44],[110,156],[200,44],[200,156],[292,100]],
  edges:[[0,1],[0,2],[1,3],[2,4],[1,4],[2,3],[3,5],[4,5]],names:['ти','A','B','C','D','сервер']};
let ntDead={},ntPath=[],ntTimer=null,ntStep=0;
function ntReset(){stopAll();ntDead={};ntPath=[];ntStep=0;hide('#nt-v');ntDraw();}
function ntRoute(){const q=[[0]],seen={0:1};
  while(q.length){const p=q.shift(),v=p[p.length-1];
    if(v===5)return p;
    NT.edges.forEach(e=>{const n=e[0]===v?e[1]:e[1]===v?e[0]:-1;
      if(n<0||seen[n]||ntDead[n])return;seen[n]=1;q.push(p.concat([n]));});}
  return null;}
function ntDraw(){let s='';
  NT.edges.forEach(e=>{const a=NT.pos[e[0]],b=NT.pos[e[1]];
    const used=ntPath.some((v,i)=>i<ntPath.length-1&&((ntPath[i]===e[0]&&ntPath[i+1]===e[1])||(ntPath[i]===e[1]&&ntPath[i+1]===e[0])));
    s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+(used?'#5B4BD6':'#D8D3C4')+'" stroke-width="'+(used?4:2)+'"/>';});
  NT.pos.forEach((p,i)=>{const dead=ntDead[i];
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="20" fill="'+(dead?'#EFEDE6':i===0||i===5?'#EBE8FB':'#fff')+'" stroke="'+(dead?'#C9C6BB':'#5B4BD6')+'" stroke-width="2" style="cursor:pointer" onclick="ntKill('+i+')"/>'+
       '<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="11" font-weight="600" fill="'+(dead?'#C4C0B4':'#1E2A3A')+'" pointer-events="none">'+NT.names[i]+'</text>';});
  if(ntPath.length&&ntStep<ntPath.length){const p=NT.pos[ntPath[ntStep]];
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="#E9A800"/>';}
  $('#nt-svg').innerHTML=s;}
function ntKill(i){if(i===0||i===5)return;ntDead[i]=!ntDead[i];ntPath=[];ntDraw();
  $('#nt-state').textContent=Object.keys(ntDead).filter(k=>ntDead[k]).length?'Вимкнено вузлів: '+Object.keys(ntDead).filter(k=>ntDead[k]).length:'Усі вузли працюють.';}
function ntSend(){stopAll();const path=ntRoute();
  if(!path){ntPath=[];ntDraw();return say('#nt-v','Усі маршрути перекрито — пакет не дійде. У справжньому інтернеті доріг набагато більше.',false);}
  ntPath=path;ntStep=0;ntDraw();
  ntTimer=every(()=>{if(!document.querySelector('#nt-svg'))return;ntStep++;ntDraw();
    if(ntStep>=ntPath.length){stopAll();mark('net');
      say('#nt-v','Пакет дійшов маршрутом: '+path.map(i=>NT.names[i]).join(' → ')+'. Вимкни вузол на цьому шляху й надішли ще раз — пакет знайде обхід.',true);}},450);}

T('pass',{g:3,ic:'🔑',t:'Наскільки міцний пароль',s:'Чому «12345» ламають миттєво',html:`
<div class="panel">
  <div class="task">Пиши пароль — прилад покаже, скільки варіантів довелося б перебрати зловмиснику.</div>
  <input type="text" id="pw-in" value="12345" oninput="pwDraw()">
  <div class="big" id="pw-time"></div>
  <div class="hintline" id="pw-state"></div>
  <div class="row center" id="pw-tips"></div>
  <div class="verdict" id="pw-v"></div>
  <div class="legend">Довжина важливіша за складність: «конякапарасолька7» надійніше за «Qw!7z».</div>
</div>`,init(){pwBest=0;pwDraw();}});
let pwBest=0;
function pwDraw(){const p=$('#pw-in').value;
  let set=0;
  if(/[a-zа-яґєії]/.test(p))set+=33;
  if(/[A-ZА-ЯҐЄІЇ]/.test(p))set+=33;
  if(/[0-9]/.test(p))set+=10;
  if(/[^0-9a-zA-Zа-яА-ЯґєііїЇ]/.test(p))set+=20;
  const combos=p.length?Math.pow(set||1,p.length):0;
  const secs=combos/1e9;
  const fmt=s=>s<1?'менш ніж секунда':s<60?Math.round(s)+' с':s<3600?Math.round(s/60)+' хв':
    s<86400?Math.round(s/3600)+' год':s<31536000?Math.round(s/86400)+' днів':
    s<31536000*1000?Math.round(s/31536000)+' років':'мільйони років';
  const weak=['12345','123456','qwerty','password','пароль','11111','00000'];
  const isWeak=weak.some(w=>p.toLowerCase().includes(w));
  $('#pw-time').textContent=isWeak?'миттєво':fmt(secs);
  $('#pw-state').textContent='Довжина '+p.length+' · різних символів у наборі '+set+' · варіантів ≈ '+(combos>1e15?combos.toExponential(1):Math.round(combos).toLocaleString('uk'));
  $('#pw-tips').innerHTML='<span class="chip">'+(p.length>=12?'✓':'✗')+' 12+ символів</span>'+
    '<span class="chip">'+(/[0-9]/.test(p)?'✓':'✗')+' цифри</span>'+
    '<span class="chip">'+(/[A-ZА-Я]/.test(p)?'✓':'✗')+' великі букви</span>'+
    '<span class="chip">'+(isWeak?'✗ є у словниках':'✓ не зі списку популярних')+'</span>';
  if(isWeak)say('#pw-v','Такий пароль є в перших рядках будь-якого словника зламу — його підберуть за частку секунди, скільки б варіантів не було в теорії.',false);
  else if(secs>31536000*100){mark('pass');
    say('#pw-v','Ось це вже надійно. Але головне правило лишається: для кожного сайту — свій пароль.',true);}
  else hide('#pw-v');}

T('vector',{g:3,ic:'🔍',t:'Растр проти вектора',s:'Чому одні картинки не пікселяться',html:`
<div class="panel">
  <div class="task">Збільшуй зображення. Ліворуч — з пікселів, праворуч — з формул.</div>
  <div class="row"><div style="flex:1;text-align:center"><div style="font-size:14px;color:var(--ink-2)">растр (фото)</div>
      <svg viewBox="0 0 100 100" height="130" id="vc-a"></svg></div>
    <div style="flex:1;text-align:center"><div style="font-size:14px;color:var(--ink-2)">вектор (схема)</div>
      <svg viewBox="0 0 100 100" height="130" id="vc-b"></svg></div></div>
  <div style="font-size:14px;color:var(--ink-2);margin-top:8px">збільшення <b id="vc-zL">1</b>×</div>
  <input type="range" min="1" max="12" value="1" id="vc-z" oninput="vcDraw()">
  <div class="verdict" id="vc-v"></div>
  <div class="legend">Логотипи й креслення роблять векторними — їх можна збільшити на білборд. Фото завжди растрове.</div>
</div>`,init(){vcDraw();}});
function vcDraw(){const z=+$('#vc-z').value;$('#vc-zL').textContent=z;
  const n=Math.max(2,Math.round(24/z));const s=100/n;
  let a='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const cx=(x+0.5)/n,cy=(y+0.5)/n;
    const d=Math.hypot(cx-0.5,cy-0.55);
    const col=d<0.3?'#5B4BD6':d<0.42?'#B7AEEA':'#F4F2EC';
    a+='<rect x="'+(x*s)+'" y="'+(y*s)+'" width="'+(s+0.5)+'" height="'+(s+0.5)+'" fill="'+col+'"/>';}
  $('#vc-a').innerHTML=a;
  $('#vc-b').innerHTML='<rect width="100" height="100" fill="#F4F2EC"/><circle cx="50" cy="55" r="30" fill="#5B4BD6"/>';
  if(z>=8){mark('vector');
    say('#vc-v','Растр розсипався на квадратики — пікселів більше не стало, вони просто збільшились. Вектор лишився чітким: він зберігає не крапки, а формулу «коло радіусом 30».',true);}
  else hide('#vc-v');}

T('sheet',{g:3,ic:'🧮',t:'Формула в таблиці',s:'Чому електронна таблиця розумніша за зошит',html:`
<div class="panel">
  <div class="task">Зміни будь-яке число — і подивись, що станеться з підсумками. Нічого не треба переписувати.</div>

  <div class="verdict" id="sh-v"></div>
  <div class="legend">Формула завжди починається зі знака =. Вона зберігає не результат, а спосіб його обчислити.</div>
</div>`,init(){shData=[[120,3],[45,10],[230,2],[80,5]];shDraw();}});
let shData=[[120,3],[45,10],[230,2],[80,5]];
const shNames=['Олівці','Зошити','Ручки','Гумки'];
function shDraw(){let h='<tr><th>товар</th><th>ціна</th><th>кількість</th><th>сума = ціна × к-сть</th></tr>';
  shData.forEach((r,i)=>{h+='<tr><td>'+shNames[i]+'</td>'+
    '<td><input type="number" value="'+r[0]+'" style="width:70px;padding:4px;text-align:center" oninput="shSet('+i+',0,this.value)"></td>'+
    '<td><input type="number" value="'+r[1]+'" style="width:60px;padding:4px;text-align:center" oninput="shSet('+i+',1,this.value)"></td>'+
    '<td><b>'+(r[0]*r[1])+'</b></td></tr>';});
  const tot=shData.reduce((a,r)=>a+r[0]*r[1],0);
  h+='<tr><th colspan="3">Разом =СУМА(D2:D5)</th><th>'+tot+'</th></tr>';
  $('#sh-t').innerHTML=h;
  $('#sh-state').textContent='Загальна сума перерахувалась сама: '+tot+' грн';}
function shSet(i,j,v){shData[i][j]=+v||0;shDraw();mark('sheet');}
function shAsk(){say('#sh-v','У стовпці «сума» стоїть не число, а формула <b>=B2*C2</b>. Тому щойно ти міняєш ціну, сума й підсумок оновлюються самі. У зошиті довелося б перераховувати все вручну.',true);}

}
