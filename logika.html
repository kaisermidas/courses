<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Логіка · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}.mode .ic.d{background:#FFE8D6}.mode .ic.e{background:#F0E4FF}
  .lvl-title{color:var(--ink-2);font-size:14px;margin:22px 0 8px;padding-left:2px}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
  .rev{margin-top:10px;font-size:15px;color:var(--ink-2)}.rev i{color:var(--ink);font-style:normal;font-weight:600}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <div class="lvl-title">Перевірити себе</div>
    <button class="mode" onclick="openQuiz(1)"><div class="ic c">🙂</div><div><b>Легкий</b><span id="q1-count"></span></div><div class="st" id="st-q1"></div></button>
    <button class="mode" onclick="openQuiz(2)"><div class="ic d">🔥</div><div><b>Складний</b><span id="q2-count"></span></div><div class="st" id="st-q2"></div></button>
    <button class="mode" onclick="openQuiz(3)"><div class="ic e">💀</div><div><b>Дуже складний</b><span id="q3-count"></span></div><div class="st" id="st-q3"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <div id="r-review" style="display:none;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px"></div>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz(LEVEL)">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>
// ============================================================
//  ДАНІ КУРСУ. Один об'єкт на предмет; генерується з підручника.
// ============================================================
const COURSE = {"id": "logika5", "title": "Логіка", "subtitle": "5 клас · 17 уроків за програмою курсу (35 тижнів)", "lessons": [{"id": "lg-poniattia", "sec": "Логіка як наука", "title": "Магія понять", "goal": "Ти знаєш, що вивчає логіка, що таке поняття, його обсяг і зміст, і як давати означення.", "learn": [{"h": "Логіка", "p": ["<span class='term'>Логіка</span> — наука про правильне мислення: як міркувати, щоб не помилятись. Засновник — давньогрецький філософ <b>Аристотель</b>. Логіка потрібна всім: детективам, програмістам, лікарям, юристам — і тобі, коли розв'язуєш задачу чи сперечаєшся."]}, {"h": "Поняття", "p": ["<span class='term'>Поняття</span> — думка про предмет за його суттєвими ознаками (те, без чого предмет перестає бути собою). <b>Зміст</b> поняття — набір ознак («квадрат» = чотирикутник + усі кути прямі + усі сторони рівні). <b>Обсяг</b> — усі предмети, які під нього підпадають (усі квадрати світу)."], "note": "Закон: чим <b>більший зміст</b> (більше ознак) — тим <b>менший обсяг</b>. «Тварина» — величезний обсяг, мало ознак; «сибірський кіт» — багато ознак, малий обсяг."}, {"h": "Види понять і відношення", "p": ["<b>Одиничні</b> (Дніпро, Тарас Шевченко) і <b>загальні</b> (річка, поет). <b>Конкретні</b> (стіл) і <b>абстрактні</b> (доброта). Відношення: <b>рівнозначні</b> (квадрат — рівносторонній прямокутник), <b>підпорядкування</b> (кіт ⊂ тварина — рід і вид), <b>перетин</b> (учні й спортсмени), <b>несумісні</b> (парне і непарне число)."]}, {"h": "Означення", "p": ["<span class='term'>Означення</span> = <b>рід</b> + <b>видова відмінність</b>: «квадрат — це <i>прямокутник</i> (рід), у якого <i>всі сторони рівні</i> (відмінність)». Помилки означення: <b>коло</b> («логіка — це наука про логіку»), <b>надто широке</b> («квадрат — це фігура»), <b>надто вузьке</b>, <b>тільки заперечення</b> («квадрат — це не коло»)."]}], "remember": "Логіка — наука про правильне мислення (Аристотель). Поняття має зміст (ознаки) і обсяг (предмети); більше ознак — менший обсяг. Відношення: рівнозначність, підпорядкування (рід і вид), перетин, несумісність. Означення = рід + видова відмінність.", "cards": [{"f": "Логіка", "b": "Наука про правильне мислення; засновник — Аристотель."}, {"f": "Поняття", "b": "Думка про предмет за його суттєвими ознаками."}, {"f": "Зміст поняття", "b": "Набір суттєвих ознак предмета."}, {"f": "Обсяг поняття", "b": "Усі предмети, що підпадають під поняття."}, {"f": "Закон оберненого відношення", "b": "Чим більше ознак (зміст), тим менше предметів (обсяг)."}, {"f": "Рід і вид", "b": "Ширше поняття і вужче, що в нього входить: тварина — кіт."}, {"f": "Як будувати означення?", "b": "Рід + видова відмінність: квадрат — прямокутник, у якого всі сторони рівні."}, {"f": "Помилка «коло в означенні»", "b": "Означення через саме себе: «логіка — наука про логіку»."}], "quiz": [{"t": "choice", "q": "Що вивчає логіка?", "o": ["Мову", "Правильне мислення", "Числа"], "a": 1, "e": "Наука про міркування."}, {"t": "choice", "q": "Хто вважається засновником логіки?", "o": ["Піфагор", "Аристотель", "Евклід"], "a": 1, "e": "Аристотель."}, {"t": "choice", "q": "У якого поняття обсяг більший?", "o": ["Тварина", "Кіт", "Сіамський кіт"], "a": 0, "e": "Найзагальніше — найбільший обсяг."}, {"t": "choice", "q": "Якщо додати до поняття ознаку, обсяг…", "o": ["зменшиться", "збільшиться", "не зміниться"], "a": 0, "e": "Обернене відношення."}, {"t": "choice", "q": "«Кіт» і «тварина» — це відношення…", "o": ["перетину", "підпорядкування", "несумісності"], "a": 1, "e": "Вид і рід."}, {"t": "choice", "q": "«Учні» і «спортсмени» — це…", "o": ["перетин", "підпорядкування", "рівнозначність"], "a": 0, "e": "Частина учнів — спортсмени."}, {"t": "choice", "q": "Яке означення правильне?", "o": ["Квадрат — це фігура", "Квадрат — прямокутник з рівними сторонами", "Квадрат — це не трикутник"], "a": 1, "e": "Рід + видова відмінність."}, {"t": "choice", "q": "«Годинник — це прилад, який показує час, як годинник» — яка помилка?", "o": ["Коло в означенні", "Надто вузьке", "Заперечення"], "a": 0, "e": "Означення через себе."}, {"t": "input", "q": "Як називаються всі предмети, що охоплює поняття?", "a": ["обсяг", "обсяг поняття"], "e": "Обсяг."}], "quiz2": [{"t": "choice", "q": "Розташуй за зростанням обсягу: «вівчарка», «тварина», «собака».", "o": ["вівчарка → собака → тварина", "тварина → собака → вівчарка", "собака → вівчарка → тварина"], "a": 0, "e": "Від вужчого до ширшого."}, {"t": "choice", "q": "«Стіл — це меблі» — це означення чи ні?", "o": ["Ні, надто широке: бракує видової відмінності", "Так, правильне", "Це поняття"], "a": 0, "e": "Треба уточнити."}, {"t": "choice", "q": "«Учні» і «хлопці» — яке відношення?", "o": ["перетин", "підпорядкування", "несумісність"], "a": 0, "e": "Є хлопці-учні й хлопці-неучні."}, {"t": "input", "q": "Як називається набір суттєвих ознак поняття?", "a": ["зміст", "зміст поняття"], "e": "Зміст."}], "quiz3": [{"t": "choice", "q": "Додали ознаку «чорний» до поняття «кіт». Що сталося з обсягом і змістом?", "o": ["Зміст збільшився, обсяг зменшився", "Обидва зросли", "Обидва зменшились"], "a": 0, "e": "Закон оберненого відношення."}, {"t": "choice", "q": "«Квадрат — це рівносторонній прямокутник». Це означення…", "o": ["правильне: рід + видова відмінність", "надто широке", "з колом"], "a": 0, "e": "Коректне."}, {"t": "choice", "q": "«Парні» й «непарні числа» — яке відношення?", "o": ["несумісність, що вичерпує обсяг «цілі числа»", "перетин", "підпорядкування"], "a": 0, "e": "Повний поділ."}, {"t": "input", "q": "Яка помилка в означенні «Логіка — це наука логічного мислення»?", "a": ["коло", "коло в означенні", "тавтологія"], "e": "Коло в означенні."}]}, {"id": "lg-sudzhennia", "sec": "Логіка як наука", "title": "Судження: розгадуємо логічні таємниці", "goal": "Ти відрізняєш судження від інших речень, визначаєш істинність і будуєш заперечення.", "learn": [{"h": "Судження (висловлювання)", "p": ["<span class='term'>Судження</span> — речення, про яке можна сказати, що воно <b>істинне</b> або <b>хибне</b>. «Київ — столиця України» (істинне). «2 + 2 = 5» (хибне). <b>Не є</b> судженнями: питання («Котра година?»), накази («Закрий двері!»), вигуки, побажання — про них не скажеш «правда» чи «неправда»."]}, {"h": "Будова судження", "p": ["<b>Суб'єкт</b> (про що говоримо) + <b>предикат</b> (що говоримо) + зв'язка: «Кит (S) є ссавцем (P)». Судження бувають <b>стверджувальні</b> («Кит є ссавцем») і <b>заперечні</b> («Кит не є рибою»)."]}, {"h": "Загальні й часткові", "p": ["<b>Загальні</b> — про всі: «<b>Усі</b> квадрати мають прямі кути». <b>Часткові</b> — про деякі: «<b>Деякі</b> учні грають у шахи». <b>Одиничні</b> — про один предмет: «Дніпро тече в Україні». Слова-підказки: усі, кожен, жоден, деякі, більшість, хтось."]}, {"h": "Заперечення", "p": ["Заперечення істинного судження — хибне, і навпаки. Головне правило: заперечення до «<b>усі</b> A є B» — це не «жоден», а «<b>деякі</b> A не є B» (досить одного винятку!). Заперечення до «деякі A є B» — «жоден A не є B». Заперечення «сьогодні тепло» — «сьогодні не тепло» (не обов'язково «холодно»)."], "ex": ["«Усі учні класу — відмінники» спростує один трієчник.", "«Жоден кіт не літає» спростує один кіт, що літає."]}], "remember": "Судження — речення, яке істинне або хибне (питання й накази — не судження). Загальні (усі, жоден), часткові (деякі), одиничні. Заперечення до «усі A є B» — «деякі A не є B» (досить одного винятку), а не «жоден».", "cards": [{"f": "Судження (висловлювання)", "b": "Речення, про яке можна сказати: істинне або хибне."}, {"f": "Що не є судженням?", "b": "Питання, накази, вигуки, побажання."}, {"f": "Загальне судження", "b": "Про всі предмети: «Усі…», «Жоден…»."}, {"f": "Часткове судження", "b": "Про деякі: «Деякі учні…»."}, {"f": "Заперечення до «Усі A є B»", "b": "«Деякі A не є B» — досить одного винятку."}, {"f": "Заперечення до «Деякі A є B»", "b": "«Жоден A не є B»."}, {"f": "Скільки прикладів потрібно, щоб спростувати «усі»?", "b": "Один — контрприклад."}], "quiz": [{"t": "choice", "q": "Що з цього — судження?", "o": ["Котра година?", "Сніг білий.", "Закрий вікно!"], "a": 1, "e": "Про нього можна сказати «істинне»."}, {"t": "choice", "q": "«Скільки тобі років?» — це…", "o": ["істинне судження", "хибне судження", "не судження"], "a": 2, "e": "Питання."}, {"t": "choice", "q": "«Деякі птахи не літають» — судження…", "o": ["загальне", "часткове", "не є судженням"], "a": 1, "e": "Слово «деякі»."}, {"t": "choice", "q": "Заперечення до «Усі учні написали тест» —", "o": ["Жоден учень не написав", "Деякі учні не написали", "Усі учні не написали"], "a": 1, "e": "Досить одного винятку."}, {"t": "choice", "q": "Заперечення до «Деякі коти чорні» —", "o": ["Жоден кіт не чорний", "Усі коти чорні", "Деякі коти не чорні"], "a": 0, "e": "Правило заперечення."}, {"t": "choice", "q": "Скільки прикладів треба, щоб спростувати «усі лебеді білі»?", "o": ["Один чорний лебідь", "Половина лебедів", "Усі лебеді"], "a": 0, "e": "Один контрприклад."}, {"t": "tf", "q": "«2 + 2 = 5» — це судження.", "a": true, "e": "Так, хибне судження — але судження."}, {"t": "choice", "q": "У судженні «Кит є ссавцем» слово «кит» — це…", "o": ["суб'єкт", "предикат", "зв'язка"], "a": 0, "e": "Про що говоримо."}, {"t": "choice", "q": "Якщо судження істинне, то його заперечення…", "o": ["істинне", "хибне", "невідомо"], "a": 1, "e": "Завжди навпаки."}], "quiz2": [{"t": "choice", "q": "«Усі учні класу принесли зошити». Один не приніс. Судження…", "o": ["хибне", "істинне", "не судження"], "a": 0, "e": "Один контрприклад."}, {"t": "choice", "q": "Заперечення до «Жоден птах не плаває»:", "o": ["Деякі птахи плавають", "Усі птахи плавають", "Жоден птах не літає"], "a": 0, "e": "Правило заперечення."}, {"t": "choice", "q": "«Зачини вікно!» — це…", "o": ["не судження", "істинне судження", "хибне судження"], "a": 0, "e": "Наказ."}, {"t": "input", "q": "Скільки контрприкладів треба, щоб спростувати «усі»?", "a": ["1", "один"], "e": "Один."}], "quiz3": [{"t": "choice", "q": "«Деякі учні не люблять математику» істинне. Що можна сказати про «Усі учні люблять математику»?", "o": ["Воно хибне", "Воно істинне", "Невідомо"], "a": 0, "e": "Заперечні пари."}, {"t": "choice", "q": "«Деякі птахи літають» істинне. Чи істинне «Деякі птахи не літають»?", "o": ["Невідомо з цього судження — потрібна додаткова інформація", "Так, автоматично", "Ні"], "a": 0, "e": "Часткові судження незалежні."}, {"t": "choice", "q": "У судженні «Кит не є рибою» предикат —", "o": ["риба", "кит", "не"], "a": 0, "e": "Що говоримо."}, {"t": "input", "q": "Заперечення до «Усі коти сірі» — «Деякі коти … сірі».", "a": ["не", "не є"], "e": "Деякі коти не сірі."}]}, {"id": "lg-perevernuti", "sec": "Логіка як наука", "title": "Логічні перевернуті справи. Стань Шерлоком Холмсом", "goal": "Ти вмієш будувати обернені твердження і робити висновки з фактів.", "learn": [{"h": "Пряме й обернене твердження", "p": ["<b>Пряме</b>: «Якщо число ділиться на 4, то воно парне» — істинне. <b>Обернене</b> (міняємо місцями умову й висновок): «Якщо число парне, то воно ділиться на 4» — <b>хибне</b> (6 парне, але на 4 не ділиться!). Важливо: <b>з істинності прямого не випливає істинність оберненого</b>. Це найчастіша логічна пастка."], "ex": ["«Усі яблука — фрукти» істинно; «усі фрукти — яблука» хибно.", "«Якщо йде дощ, то земля мокра» — правда; «якщо земля мокра, то йде дощ» — ні (могли полити)."]}, {"h": "Протилежне й протилежне оберненому", "p": ["<b>Протилежне</b>: «Якщо число не ділиться на 4, то воно не парне» — теж хибне. А от <b>протилежне оберненому</b>: «Якщо число непарне, то воно не ділиться на 4» — <b>істинне</b> завжди, коли істинне пряме. Це правило називають <b>контрапозицією</b>."]}, {"h": "Метод Шерлока Холмса", "p": ["1) Зібрати <b>факти</b> (що точно відомо). 2) Відрізнити факт від <b>здогадки</b>. 3) Висунути <b>версії</b>. 4) <b>Виключити</b> неможливе. 5) Те, що лишилось, — відповідь. «Відкинь неможливе; те, що залишиться, і буде правдою, хай яким неймовірним воно здається.»"], "note": "Холмс користувався не лише дедукцією (від загального до окремого), а й <b>спостережливістю</b> та <b>індукцією</b> (від окремих спостережень до загального висновку)."}, {"h": "Приклад", "p": ["На столі три коробки з написами «цукерки», «печиво», «цукерки й печиво». Відомо: <b>усі написи неправильні</b>. Дістали одну цукерку з коробки «цукерки й печиво» → значить, там лише цукерки. Тоді в коробці «цукерки» не цукерки й не суміш → печиво. Отже, в «печиві» — суміш."]}], "remember": "Обернене твердження може бути хибним, навіть якщо пряме істинне (парне ≠ ділиться на 4). Контрапозиція («якщо не B, то не A») завжди істинна разом із прямим. Метод: факти → версії → виключення неможливого → залишок і є відповідь.", "cards": [{"f": "Обернене твердження", "b": "Умова й висновок міняються місцями."}, {"f": "Чи істинне обернене, якщо істинне пряме?", "b": "Не обов'язково — це логічна пастка."}, {"f": "Приклад пастки", "b": "«Ділиться на 4 → парне» правда; «парне → ділиться на 4» хибно (6)."}, {"f": "Контрапозиція", "b": "«Якщо не B, то не A» — істинна завжди, коли істинне «якщо A, то B»."}, {"f": "Метод виключення", "b": "Відкинь неможливе; те, що залишиться, і буде правдою."}, {"f": "Факт і здогадка", "b": "Факт можна перевірити; здогадка — припущення."}, {"f": "Дедукція / індукція", "b": "Від загального до окремого / від окремих випадків до загального висновку."}], "quiz": [{"t": "choice", "q": "«Усі троянди — квіти». Обернене твердження «Усі квіти — троянди» —", "o": ["істинне", "хибне"], "a": 1, "e": "Обернене не завжди істинне."}, {"t": "choice", "q": "«Якщо число ділиться на 10, то воно ділиться на 5» — істинно. А обернене?", "o": ["Істинне", "Хибне: 15 ділиться на 5, але не на 10"], "a": 1, "e": "Контрприклад 15."}, {"t": "choice", "q": "Яке твердження завжди істинне разом із «якщо A, то B»?", "o": ["Якщо B, то A", "Якщо не B, то не A", "Якщо не A, то не B"], "a": 1, "e": "Контрапозиція."}, {"t": "choice", "q": "«Якщо йде дощ — земля мокра». Земля мокра. Що можна сказати?", "o": ["Точно йде дощ", "Дощ міг і не йти", "Дощу немає"], "a": 1, "e": "Могли полити з шланга."}, {"t": "choice", "q": "У чому суть методу Холмса?", "o": ["Вгадувати", "Виключити неможливе, а решта — правда", "Питати свідків"], "a": 1, "e": "Метод виключення."}, {"t": "choice", "q": "«На вулиці мокрий асфальт» — це…", "o": ["факт", "здогадка"], "a": 0, "e": "Можна перевірити."}, {"t": "choice", "q": "«Мабуть, уночі був дощ» — це…", "o": ["факт", "здогадка"], "a": 1, "e": "Припущення."}, {"t": "input", "q": "Три коробки, усі написи неправильні. З коробки «цукерки й печиво» дістали цукерку. Що в ній насправді? (одне слово)", "a": ["цукерки"], "e": "Напис хибний, тому не суміш — лише цукерки."}, {"t": "choice", "q": "Як називають міркування від окремих спостережень до загального висновку?", "o": ["Дедукція", "Індукція", "Аналогія"], "a": 1, "e": "Індукція."}], "quiz2": [{"t": "choice", "q": "«Якщо це кіт, то це тварина» істинне. Обернене?", "o": ["Хибне: не всяка тварина — кіт", "Істинне", "Невідомо"], "a": 0, "e": "Обернене ≠ пряме."}, {"t": "choice", "q": "«Якщо йде сніг, то холодно». Холодно. Що можна сказати про сніг?", "o": ["Нічого певного", "Точно йде сніг", "Снігу немає"], "a": 0, "e": "Помилка оберненого висновку."}, {"t": "choice", "q": "«Якщо число ділиться на 6, то воно парне». Яке твердження точно істинне?", "o": ["Якщо число непарне, то не ділиться на 6", "Якщо парне, то ділиться на 6", "Якщо не ділиться на 6, то непарне"], "a": 0, "e": "Контрапозиція."}, {"t": "input", "q": "Як називається міркування від загального до окремого?", "a": ["дедукція"], "e": "Дедукція."}], "quiz3": [{"t": "choice", "q": "Три коробки з неправильними написами: «яблука», «груші», «яблука й груші». З якої брати фрукт, щоб визначити все?", "o": ["З коробки «яблука й груші»", "З «яблук»", "З «груш»"], "a": 0, "e": "Там точно один вид."}, {"t": "choice", "q": "«Усі мої друзі люблять футбол. Петро любить футбол». Висновок «Петро — мій друг»…", "o": ["неправильний", "правильний", "істинний"], "a": 0, "e": "Помилка оберненого."}, {"t": "choice", "q": "Детектив каже: «Вбивця був лівшею». Підозрюваний — правша. Висновок?", "o": ["Він не вбивця (контрапозиція)", "Він убивця", "Нічого не можна сказати"], "a": 0, "e": "Виключення."}, {"t": "input", "q": "Як називається міркування від окремих випадків до загального?", "a": ["індукція"], "e": "Індукція."}]}, {"id": "lg-vyslovlennia", "sec": "Логіка як наука", "title": "Декодування висловлень. Світ тверджень", "goal": "Ти працюєш зі складеними висловленнями «і», «або», «не», «якщо…то» і будуєш таблиці істинності.", "learn": [{"h": "Прості й складені", "p": ["<b>Просте</b> висловлення — одна думка: «Іде дощ». <b>Складене</b> — з кількох, з'єднаних <b>логічними зв'язками</b>: <b>не</b> (заперечення), <b>і</b> (кон'юнкція), <b>або</b> (диз'юнкція), <b>якщо… то</b> (імплікація)."]}, {"h": "Правила істинності", "p": ["<b>НЕ A</b> — істинне, коли A хибне.", "<b>A і B</b> — істинне <b>лише коли обидва істинні</b>. «Я взяв парасольку і чоботи» — брехня, якщо забув чоботи.", "<b>A або B</b> — істинне, коли <b>хоча б одне</b> істинне (у логіці «або» не виключне: обидва — теж істинно).", "<b>Якщо A, то B</b> — хибне <b>лише</b> в одному випадку: A істинне, а B хибне («Обіцяв: якщо буде сонце — підемо гуляти»; сонце було, не пішли — обіцянку порушено)."]}, {"h": "Таблиця істинності", "p": ["Записують усі варіанти: для двох висловлень — 4 рядки (І+І, І+Х, Х+І, Х+Х).", "<b>A і B</b>: І, Х, Х, Х. <b>A або B</b>: І, І, І, Х. <b>Якщо A, то B</b>: І, Х, І, І."]}, {"h": "Закони", "p": ["<b>Закони де Моргана</b>: «не (A і B)» = «не A або не B»; «не (A або B)» = «не A і не B».", "Приклад: неправда, що «він високий і сильний» → він або не високий, або не сильний.", "<b>Подвійне заперечення</b>: «не (не A)» = A."]}], "remember": "«І» істинне лише коли обидва істинні. «Або» — коли хоча б одне. «Якщо A, то B» хибне тільки при A істинному й B хибному. Де Морган: не(A і B) = не A або не B; не(A або B) = не A і не B. Не(не A) = A.", "cards": [{"f": "Логічні зв'язки", "b": "Не, і, або, якщо… то."}, {"f": "Коли істинне «A і B»?", "b": "Тільки коли обидва істинні."}, {"f": "Коли істинне «A або B»?", "b": "Коли хоча б одне істинне (можна й обидва)."}, {"f": "Коли хибне «якщо A, то B»?", "b": "Лише коли A істинне, а B хибне."}, {"f": "Закон де Моргана для «і»", "b": "Не (A і B) = не A або не B."}, {"f": "Закон де Моргана для «або»", "b": "Не (A або B) = не A і не B."}, {"f": "Подвійне заперечення", "b": "Не (не A) = A."}, {"f": "Скільки рядків у таблиці істинності для двох висловлень?", "b": "Чотири."}], "quiz": [{"t": "choice", "q": "«Сьогодні вівторок і йде сніг». Вівторок є, снігу немає. Висловлення…", "o": ["істинне", "хибне"], "a": 1, "e": "«І» потребує обох."}, {"t": "choice", "q": "«Я поїду автобусом або велосипедом». Поїхав автобусом. Висловлення…", "o": ["істинне", "хибне"], "a": 0, "e": "Досить одного."}, {"t": "choice", "q": "Коли «A або B» хибне?", "o": ["Коли обидва хибні", "Коли одне хибне", "Ніколи"], "a": 0, "e": "Тільки Х+Х."}, {"t": "choice", "q": "«Якщо буде сонце, підемо гуляти». Сонця не було, гуляти не пішли. Обіцянку…", "o": ["порушено", "не порушено"], "a": 1, "e": "Хибне лише при сонці без прогулянки."}, {"t": "choice", "q": "«Якщо буде сонце, підемо гуляти». Сонце було, не пішли. Обіцянку…", "o": ["порушено", "не порушено"], "a": 0, "e": "Єдиний хибний випадок."}, {"t": "choice", "q": "Неправда, що «Оля співає і танцює». Отже…", "o": ["Оля не співає і не танцює", "Оля не співає або не танцює", "Оля мовчить"], "a": 1, "e": "Закон де Моргана."}, {"t": "choice", "q": "Неправда, що «Петро вдома або в школі». Отже…", "o": ["Петро не вдома і не в школі", "Петро вдома", "Петро не вдома або не в школі"], "a": 0, "e": "Де Морган."}, {"t": "input", "q": "Чому дорівнює «не (не A)»?", "a": ["a", "а"], "e": "Подвійне заперечення дає A."}, {"t": "input", "q": "Скільки рядків у таблиці істинності для двох висловлень?", "a": ["4", "чотири"], "e": "Чотири комбінації."}, {"t": "choice", "q": "«Число парне і більше за 10». Яке число підходить?", "o": ["7", "12", "9"], "a": 1, "e": "Обидві умови."}], "quiz2": [{"t": "choice", "q": "«Іде дощ або сніг». Ідуть обидва. Висловлення…", "o": ["істинне", "хибне"], "a": 0, "e": "У логіці «або» невиключне."}, {"t": "choice", "q": "«Якщо я вивчу, то отримаю 10». Не вивчив, отримав 10. Обіцянка…", "o": ["не порушена", "порушена"], "a": 0, "e": "Хибне лише І→Х."}, {"t": "choice", "q": "Неправда, що «він високий і сильний». Отже…", "o": ["він або не високий, або не сильний", "він низький і слабкий", "він низький"], "a": 0, "e": "Де Морган."}, {"t": "input", "q": "Скільки рядків у таблиці істинності для трьох висловлень?", "a": ["8"], "e": "2³ = 8."}], "quiz3": [{"t": "choice", "q": "Коли «A і B» хибне?", "o": ["Коли хоча б одне хибне", "Тільки коли обидва хибні", "Ніколи"], "a": 0, "e": "Достатньо одного."}, {"t": "choice", "q": "«Не (A або B)» рівносильне…", "o": ["не A і не B", "не A або не B", "A і B"], "a": 0, "e": "Де Морган."}, {"t": "choice", "q": "«Якщо 2×2=5, то Місяць квадратний». Це висловлення…", "o": ["істинне, бо умова хибна", "хибне", "безглузде"], "a": 0, "e": "З хибної умови випливає що завгодно."}, {"t": "input", "q": "Чому дорівнює «не (не A)»?", "a": ["a", "а"], "e": "A."}]}, {"id": "lg-mat-khytroshchi", "sec": "Логіка як наука", "title": "Математичні хитрощі", "goal": "Ти знаєш прийоми швидкого рахунку і розв'язуєш задачі-пастки.", "learn": [{"h": "Швидкий рахунок", "p": ["<b>Множення на 5</b>: помнож на 10 і поділи на 2 (48 · 5 = 480 : 2 = 240). <b>На 9</b>: помнож на 10 і відніми число (7 · 9 = 70 − 7 = 63). <b>На 11</b> двоцифрове: 34 · 11 = 3_(3+4)_4 = 374. <b>На 25</b>: · 100 : 4. <b>Квадрат числа, що закінчується на 5</b>: 35² → 3·4 = 12, дописати 25 → 1225."]}, {"h": "Хитрощі додавання", "p": ["Групувати зручні пари: 17 + 28 + 83 = (17 + 83) + 28 = 128. Сума 1 + 2 + … + 100: пари по 101 → 50 · 101 = <b>5050</b> (спосіб Гаусса: n·(n+1)/2)."]}, {"h": "Задачі-пастки", "p": ["<b>«Що важче: кілограм пуху чи кілограм заліза?»</b> — однаково.", "<b>«Скільки місяців у році мають 28 днів?»</b> — усі 12.", "<b>«Батько й син — 30 років разом, батько на 26 старший. Скільки синові?»</b> — 2 роки (не 4! (30−26):2 = 2).", "<b>«Битка й м'яч разом 110 грн, битка на 100 дорожча. Скільки м'яч?»</b> — 5 грн (не 10)."], "note": "Правило: якщо відповідь спала на думку миттєво — перевір її обчисленням."}, {"h": "Перевірка результату", "p": ["<b>Прикидка</b>: 197 · 4 ≈ 200 · 4 = 800, отже 788 схоже на правду. <b>Остання цифра</b>: 23 · 17 закінчується на 1 (3·7=21). <b>Обернена дія</b>: перевір ділення множенням."]}], "remember": "·5 = ·10 : 2; ·9 = ·10 − число; 34·11 = 374; 35² = 1225. Сума 1…100 = 5050. Пастки: кілограм пуху = кілограм заліза; 28 днів у всіх 12 місяцях; батько й син — 2 роки; м'яч — 5 грн. Перевіряй прикидкою й оберненою дією.", "cards": [{"f": "Швидко помножити на 5", "b": "Помножити на 10 і поділити на 2."}, {"f": "Швидко помножити на 9", "b": "Помножити на 10 і відняти саме число."}, {"f": "34 · 11", "b": "374: між цифрами вставляємо їх суму."}, {"f": "35²", "b": "1225: 3·4 = 12, дописати 25."}, {"f": "Сума 1 + 2 + … + 100", "b": "5050 (спосіб Гаусса)."}, {"f": "Скільки місяців мають 28 днів?", "b": "Усі 12."}, {"f": "Битка й м'яч 110 грн, битка на 100 дорожча. М'яч?", "b": "5 грн."}, {"f": "Прикидка", "b": "Приблизна оцінка результату для перевірки."}], "quiz": [{"t": "input", "q": "Обчисли швидко: 48 · 5.", "a": ["240"], "e": "480 : 2."}, {"t": "input", "q": "Обчисли швидко: 17 · 9.", "a": ["153"], "e": "170 − 17."}, {"t": "input", "q": "Обчисли: 34 · 11.", "a": ["374"], "e": "3, 3+4, 4."}, {"t": "input", "q": "Обчисли: 45².", "a": ["2025"], "e": "4·5 = 20, дописати 25."}, {"t": "input", "q": "Скільки місяців у році мають 28 днів?", "a": ["12", "дванадцять", "усі"], "e": "Усі 12 мають щонайменше 28."}, {"t": "input", "q": "Битка й м'яч разом 110 грн, битка на 100 грн дорожча. Скільки коштує м'яч?", "a": ["5", "5 грн"], "e": "5 + 105 = 110."}, {"t": "input", "q": "Батькові й синові разом 30 років, батько на 26 старший. Скільки років синові?", "a": ["2"], "e": "(30 − 26) : 2 = 2."}, {"t": "input", "q": "Обчисли суму 1 + 2 + … + 100.", "a": ["5050"], "e": "50 пар по 101."}, {"t": "choice", "q": "Що важче: кілограм пуху чи кілограм заліза?", "o": ["Пух", "Залізо", "Однаково"], "a": 2, "e": "По кілограму."}, {"t": "input", "q": "На яку цифру закінчується 23 · 17?", "a": ["1"], "e": "3 · 7 = 21."}], "quiz2": [{"t": "input", "q": "Обчисли швидко: 25 · 12.", "a": ["300"], "e": "·100 : 4 = 1200 : 4."}, {"t": "input", "q": "Обчисли: 65².", "a": ["4225"], "e": "6·7 = 42, дописати 25."}, {"t": "input", "q": "Скільки тварин узяв Мойсей у ковчег кожної пари?", "a": ["0", "жодної", "нуль", "мойсей не брав"], "e": "Ковчег будував Ной, а не Мойсей."}, {"t": "input", "q": "Обчисли: 1 + 2 + … + 50.", "a": ["1275"], "e": "25 пар по 51."}], "quiz3": [{"t": "input", "q": "У кімнаті 4 кути, у кожному кутку кіт, навпроти кожного кота 3 коти. Скільки котів?", "a": ["4", "чотири"], "e": "Кожен бачить трьох інших."}, {"t": "input", "q": "Цеглина важить 1 кг і ще пів цеглини. Скільки важить цеглина?", "a": ["2", "2 кг"], "e": "Половина = 1 кг."}, {"t": "input", "q": "Півень стоїть на даху. У який бік скотиться яйце?", "a": ["нікуди", "жоден", "півні не несуть яєць", "ніякий"], "e": "Півні не несуть яєць."}, {"t": "input", "q": "Лілії на озері подвоюються щодня й покривають озеро за 20 днів. За скільки днів покриють половину?", "a": ["19"], "e": "За день до кінця."}]}, {"id": "lg-chysla-parnist", "sec": "Числа та нестандартні задачі", "title": "Секрети чисел. Магія парності", "goal": "Ти знаєш історію чисел і використовуєш парність для розв'язання задач.", "learn": [{"h": "Як з'явилися числа", "p": ["Спершу лічили пальцями, камінцями, <b>зарубками</b> на кістці. Потім — системи запису: <b>єгипетська</b> (ієрогліфи), <b>вавилонська</b> (60-кова — звідси 60 хвилин і 360°), <b>римська</b> (I, V, X, L, C, D, M), <b>арабська</b> (насправді індійська: 0–9, позиційна). <b>Нуль</b> винайшли в Індії — найважливіша цифра, бо дозволяє позиційний запис. Комп'ютери рахують у <b>двійковій</b> системі: 0 і 1."]}, {"h": "Парність", "p": ["<b>Парне</b> число ділиться на 2 (закінчується на 0, 2, 4, 6, 8), <b>непарне</b> — ні. Правила: парне + парне = <b>парне</b>; непарне + непарне = <b>парне</b>; парне + непарне = <b>непарне</b>. Множення: якщо хоч один множник парний — добуток парний."]}, {"h": "Парність як інструмент", "p": ["Багато задач розв'язуються без обчислень, лише парністю:", "• Сума 1 + 2 + … + 9 = 45 — непарна, тому її не можна розбити на дві рівні частини.", "• Чи можна 25 монет розкласти в 2 однакові купки? Ні — 25 непарне.", "• Чи може сума 5 непарних чисел бути парною? Ні: непарна кількість непарних дає непарну суму.", "• Коник стрибає по прямій на 1 крок і за 11 стрибків повернувся на місце? Неможливо — 11 непарне.", "• На дошці числа; кожним ходом два стирають і пишуть їх суму — парність суми не змінюється (<b>інваріант</b>)."], "note": "<span class='term'>Інваріант</span> — величина, що не змінюється під час дій. Найпростіший інваріант — парність."}], "remember": "Числа: зарубки → єгипетська, вавилонська (60), римська, індійсько-арабська з нулем; комп'ютери — двійкова. Парне ділиться на 2. Непарне + непарне = парне. Непарну суму не розділити навпіл. Інваріант — те, що не змінюється; парність — головний інваріант.", "cards": [{"f": "Де винайшли нуль?", "b": "В Індії; звідти цифри прийшли через арабів."}, {"f": "Яка система лічби у комп'ютерів?", "b": "Двійкова: 0 і 1."}, {"f": "Звідки 60 хвилин і 360°?", "b": "З вавилонської шістдесяткової системи."}, {"f": "Парне число", "b": "Ділиться на 2; закінчується на 0, 2, 4, 6, 8."}, {"f": "Непарне + непарне", "b": "Парне."}, {"f": "Парне + непарне", "b": "Непарне."}, {"f": "Коли добуток парний?", "b": "Якщо хоча б один множник парний."}, {"f": "Інваріант", "b": "Величина, що не змінюється під час дій; часто це парність."}, {"f": "Чи можна 25 предметів поділити на дві рівні купки?", "b": "Ні — 25 непарне."}], "quiz": [{"t": "choice", "q": "Де винайшли цифру нуль?", "o": ["У Греції", "В Індії", "У Римі"], "a": 1, "e": "Через арабів прийшла до Європи."}, {"t": "choice", "q": "У якій системі рахують комп'ютери?", "o": ["Десятковій", "Двійковій", "Римській"], "a": 1, "e": "0 і 1."}, {"t": "choice", "q": "Непарне + непарне =", "o": ["парне", "непарне", "залежить"], "a": 0, "e": "Наприклад 3 + 5 = 8."}, {"t": "choice", "q": "Чи може сума трьох непарних чисел бути парною?", "o": ["Так", "Ні"], "a": 1, "e": "Непарна кількість непарних — сума непарна."}, {"t": "choice", "q": "Чи можна 25 цукерок порівну поділити між двома дітьми?", "o": ["Так", "Ні, 25 непарне"], "a": 1, "e": "Парність."}, {"t": "choice", "q": "Коник стрибає вздовж прямої на 1 крок вліво або вправо. Чи може він за 7 стрибків повернутись у початок?", "o": ["Так", "Ні"], "a": 1, "e": "Потрібна парна кількість стрибків."}, {"t": "input", "q": "Обчисли суму 1 + 2 + 3 + … + 9.", "a": ["45"], "e": "45 — непарна."}, {"t": "choice", "q": "Добуток 7 · 4 · 9 —", "o": ["парний", "непарний"], "a": 0, "e": "Є парний множник 4."}, {"t": "input", "q": "Як називається величина, що не змінюється під час дій?", "a": ["інваріант"], "e": "Інваріант."}, {"t": "choice", "q": "Звідки взялися 360° у колі?", "o": ["З вавилонської системи", "З римської", "З двійкової"], "a": 0, "e": "Шістдесяткова система."}], "quiz2": [{"t": "choice", "q": "Чи може сума чотирьох непарних чисел бути непарною?", "o": ["Ні", "Так", "Інколи"], "a": 0, "e": "Парна кількість непарних — сума парна."}, {"t": "choice", "q": "Учень 10 разів переклав фішку між двома клітинками. Де вона?", "o": ["Там, звідки почала", "На іншій клітинці", "Невідомо"], "a": 0, "e": "Парна кількість."}, {"t": "input", "q": "Чи можна 100 цукерок поділити порівну між 6 дітьми? Напиши «так» або «ні».", "a": ["ні"], "e": "100 не ділиться на 6."}, {"t": "input", "q": "Сума 1 + 2 + … + 10 парна чи непарна? Напиши слово.", "a": ["непарна"], "e": "55 — непарна."}], "quiz3": [{"t": "choice", "q": "На дошці числа 1–10. Кожним ходом стирають два й пишуть їхню суму. Яке останнє число?", "o": ["55", "50", "Залежить від порядку"], "a": 0, "e": "Сума не змінюється — інваріант."}, {"t": "choice", "q": "Чи можна обійти всі клітинки шахівниці 5×5 конем, побувавши в кожній раз, і повернутись у початок?", "o": ["Ні: колірна парність не дозволяє", "Так", "Тільки з кутка"], "a": 0, "e": "Непарна кількість клітинок."}, {"t": "input", "q": "Число 2 + 4 + 6 + … + 20 — парне чи непарне?", "a": ["парне"], "e": "Сума парних завжди парна."}, {"t": "input", "q": "Коник стрибає на 1 крок уліво або вправо. Чи може за 10 стрибків опинитись на 3 кроки праворуч? («так» або «ні»)", "a": ["ні"], "e": "Парність не дозволяє."}]}, {"id": "lg-shyfry-kvadraty", "sec": "Числа та нестандартні задачі", "title": "Математичні шифри та магічні квадрати", "goal": "Ти шифруєш і дешифруєш прості шифри й заповнюєш магічні квадрати.", "learn": [{"h": "Шифри", "p": ["<span class='term'>Шифр</span> — спосіб приховати повідомлення. <b>Шифр Цезаря</b>: кожну букву замінюють буквою через n позицій в алфавіті (ключ). Ключ 3: А→Г, Б→Д. <b>Атбаш</b> — алфавіт навпаки (перша ↔ остання). <b>Числовий</b> — кожна буква своїм номером в алфавіті. <b>Перестановочний</b> — букви міняють місцями за схемою (наприклад, читати задом наперед або по стовпцях). <b>Морзе</b> — крапки й тире. Щоб <b>зламати</b> шифр заміни, дивляться на найчастіші букви (в українській — о, а, и, н)."]}, {"h": "Магічний квадрат", "p": ["<span class='term'>Магічний квадрат</span> — таблиця, де суми чисел у кожному рядку, стовпці й обох діагоналях однакові — це <b>магічна константа</b>. Для квадрата 3×3 з чисел 1–9 вона дорівнює <b>15</b> (бо 45 : 3), а в центрі завжди <b>5</b>."], "ex": ["Класичний квадрат Ло Шу:", "<b>2 7 6</b> / <b>9 5 1</b> / <b>4 3 8</b> — кожен рядок, стовпець і діагональ дають 15."]}, {"h": "Як заповнювати", "p": ["Формула константи для квадрата n×n з чисел 1…n²: <b>n·(n²+1)/2</b>. Для 4×4 це 34. Прийом: знайти суму всіх чисел, поділити на кількість рядків — отримаєш константу; потім підбирати, спираючись на вже відомі клітинки (у кожному рядку невідома одна — вона знаходиться відніманням)."]}, {"h": "Судоку й латинський квадрат", "p": ["<b>Латинський квадрат</b> — у кожному рядку й стовпці кожен символ рівно один раз. <b>Судоку</b> — латинський квадрат 9×9 з додатковою умовою для блоків 3×3. Розв'язують <b>виключенням</b>: якщо число вже є в рядку, стовпці чи блоці — його тут бути не може."]}], "remember": "Шифр Цезаря — зсув на n букв; Атбаш — алфавіт навпаки. Магічний квадрат: усі рядки, стовпці й діагоналі дають однакову суму; для 3×3 з 1–9 це 15, у центрі 5. Формула: n(n²+1)/2. Судоку — латинський квадрат із блоками, метод виключення.", "cards": [{"f": "Шифр Цезаря", "b": "Кожну букву замінюють буквою через n позицій в алфавіті."}, {"f": "Атбаш", "b": "Шифр, де алфавіт перевернутий: перша буква ↔ остання."}, {"f": "Магічний квадрат", "b": "Таблиця, де суми в рядках, стовпцях і діагоналях однакові."}, {"f": "Магічна константа квадрата 3×3 (1–9)", "b": "15; у центрі завжди 5."}, {"f": "Формула магічної константи", "b": "n · (n² + 1) / 2."}, {"f": "Латинський квадрат", "b": "У кожному рядку й стовпці кожен символ рівно один раз."}, {"f": "Головний метод у судоку", "b": "Виключення: чого вже є в рядку, стовпці чи блоці — тут бути не може."}, {"f": "Як зламати шифр заміни?", "b": "Аналізувати найчастіші букви мови."}], "quiz": [{"t": "input", "q": "Яка магічна константа квадрата 3×3 з чисел 1–9?", "a": ["15"], "e": "45 : 3."}, {"t": "input", "q": "Яке число завжди в центрі магічного квадрата 3×3 з 1–9?", "a": ["5"], "e": "П'ятірка."}, {"t": "input", "q": "У рядку магічного квадрата 3×3 стоять 2 і 7. Яке третє число?", "a": ["6"], "e": "15 − 9 = 6."}, {"t": "input", "q": "Магічна константа квадрата 4×4 з чисел 1–16?", "a": ["34"], "e": "4·(16+1)/2 = 34."}, {"t": "choice", "q": "Шифр Цезаря з ключем 1: слово «АБВ» стане…", "o": ["БВГ", "ВГД", "ЯАБ"], "a": 0, "e": "Зсув на одну букву."}, {"t": "choice", "q": "У чому суть шифру Атбаш?", "o": ["Алфавіт навпаки", "Зсув на 3", "Заміна цифрами"], "a": 0, "e": "Перша ↔ остання."}, {"t": "choice", "q": "Латинський квадрат — це коли…", "o": ["усі числа різні", "у кожному рядку й стовпці символ трапляється рівно раз", "сума однакова"], "a": 1, "e": "Основа судоку."}, {"t": "choice", "q": "Головний прийом у судоку —", "o": ["вгадування", "виключення", "додавання"], "a": 1, "e": "Метод виключення."}, {"t": "input", "q": "У магічному квадраті 3×3 діагональ має 4 і 5. Яке третє число?", "a": ["6"], "e": "15 − 9 = 6."}], "quiz2": [{"t": "input", "q": "У магічному квадраті 3×3 у рядку 8 і 1. Яке третє число?", "a": ["6"], "e": "15 − 9."}, {"t": "input", "q": "Магічна константа квадрата 5×5 із чисел 1–25?", "a": ["65"], "e": "5·(25+1)/2."}, {"t": "choice", "q": "Шифр Цезаря з ключем 2: «ДІМ» стане…", "o": ["ЖКО", "ЕЇН", "ВЗЛ"], "a": 0, "e": "Зсув на дві букви вперед."}, {"t": "input", "q": "Скільки чисел у магічному квадраті 4×4?", "a": ["16"], "e": "4 · 4."}], "quiz3": [{"t": "input", "q": "У магічному квадраті 3×3 (числа 1–9) у кутку стоїть 2. Яке число в протилежному кутку?", "a": ["8"], "e": "Через центр 5: 2 і 8 дають 10."}, {"t": "choice", "q": "Чому в центрі магічного квадрата 3×3 із 1–9 завжди 5?", "o": ["Через центр проходять 4 лінії, і лише 5 дає всі потрібні пари", "Це традиція", "Випадковість"], "a": 0, "e": "Математичний доказ."}, {"t": "choice", "q": "Як найшвидше зламати шифр простої заміни?", "o": ["Порахувати частоту символів і зіставити з частотою букв мови", "Перебрати всі варіанти", "Не можна"], "a": 0, "e": "Частотний аналіз."}, {"t": "input", "q": "Магічна константа квадрата 3×3 із чисел 2–10?", "a": ["18"], "e": "Сума 54 : 3."}]}, {"id": "lg-perelyvannia-zvazhuvannia", "sec": "Числа та нестандартні задачі", "title": "Магія переливань. Казкові задачі та логічні секрети", "goal": "Ти розв'язуєш задачі на переливання, зважування й перевезення.", "learn": [{"h": "Переливання", "p": ["Дано посудини без поділок; треба відміряти певний об'єм. Дозволено: наповнити, вилити, перелити з однієї в іншу до країв або поки перша не спорожніє."], "ex": ["<b>Класика:</b> є 3 л і 5 л, треба 4 л. Наповнити 5 → перелити в 3 (лишається 2) → вилити 3 → перелити 2 у трилітрову → наповнити 5 → долити в трилітрову 1 л (там уже 2) → у п'ятилітровій лишилось <b>4 л</b>.", "<b>8, 5, 3:</b> з повного 8-літрового поділити навпіл (4 і 4) за допомогою 5 і 3."]}, {"h": "Зважування", "p": ["Терези без гир: порівнюємо групи. Головна ідея — ділити на <b>три</b> частини, бо результат зважування має 3 варіанти (ліва важча, права важча, рівновага)."], "ex": ["<b>9 монет, одна фальшива (легша), 2 зважування:</b> ділимо на 3 по 3 → зважуємо дві трійки; якщо рівні — фальшива в третій трійці. Далі з 3 монет так само: 1 проти 1.", "<b>З 27 монет — 3 зважування</b>, з 81 — 4 (кожне зважування ділить на три)."]}, {"h": "Перевезення", "p": ["<b>Вовк, коза, капуста:</b> селянин перевозить по одному; вовка не можна лишати з козою, козу з капустою. Розв'язок: перевезти <b>козу</b> → повернутись → перевезти <b>вовка</b> → <b>забрати козу назад</b> → перевезти <b>капусту</b> → повернутись → перевезти <b>козу</b>. Ключ — можливість везти назад."]}, {"h": "Задачі на переправу й час", "p": ["<b>Свічки, мотузки, годинники</b>: якщо мотузка горить 60 хв нерівномірно, підпалена з двох кінців згорить за 30 хв. <b>Задача про міст із ліхтарем</b>: пара йде зі швидкістю повільнішого; спочатку переходять двоє найшвидших. Загальний принцип — <b>шукати дію, що здається зайвою</b> (повернути назад, підпалити з двох боків)."]}], "remember": "Переливання: 5 і 3 дають 4 л (наповнити 5, перелити в 3, вилити, перелити 2, наповнити 5, долити 1). Зважування: ділити на три частини; з 9 монет — 2 зважування, з 27 — 3. Вовк-коза-капуста: спершу коза, потім вовк, козу назад, капуста, і знову коза.", "cards": [{"f": "Дозволені дії при переливанні", "b": "Наповнити, вилити, перелити до країв або поки не спорожніє."}, {"f": "Як відміряти 4 л посудинами 5 і 3?", "b": "5 → у 3 (лишилось 2) → вилити 3 → 2 у трилітрову → наповнити 5 → долити 1 у трилітрову → у 5-літровій 4 л."}, {"f": "Чому при зважуванні ділять на три частини?", "b": "Бо результат має три варіанти: ліворуч важче, праворуч важче, рівновага."}, {"f": "9 монет, одна легша: скільки зважувань?", "b": "Два."}, {"f": "27 монет: скільки зважувань?", "b": "Три."}, {"f": "Вовк, коза, капуста — перший рейс", "b": "Везти козу."}, {"f": "Головний прийом у задачі про переправу", "b": "Не боятись везти щось назад."}, {"f": "Мотузка горить 60 хв. Як відміряти 30?", "b": "Підпалити з двох кінців."}], "quiz": [{"t": "input", "q": "Є посудини 5 л і 3 л. Скільки літрів лишиться у п'ятилітровій наприкінці класичного розв'язку?", "a": ["4"], "e": "4 літри."}, {"t": "input", "q": "9 монет, одна легша. Мінімальна кількість зважувань?", "a": ["2", "два"], "e": "Ділимо на три трійки."}, {"t": "input", "q": "27 монет, одна легша. Скільки зважувань?", "a": ["3", "три"], "e": "Кожне ділить на три."}, {"t": "choice", "q": "Кого селянин перевозить першим?", "o": ["Вовка", "Козу", "Капусту"], "a": 1, "e": "Вовк не їсть капусту."}, {"t": "choice", "q": "Що робить селянин після того, як перевіз вовка?", "o": ["Везе капусту", "Забирає козу назад", "Повертається порожнім"], "a": 1, "e": "Інакше вовк з'їсть козу."}, {"t": "input", "q": "Мотузка горить рівно 60 хвилин. За скільки хвилин згорить, якщо підпалити з обох кінців?", "a": ["30"], "e": "Удвічі швидше."}, {"t": "choice", "q": "Скільки результатів має одне зважування на терезах без гир?", "o": ["Два", "Три", "Чотири"], "a": 1, "e": "Ліва, права, рівновага."}, {"t": "input", "q": "Скільки разів селянин перепливає річку в задачі про вовка, козу й капусту? (кількість рейсів)", "a": ["7", "сім"], "e": "Сім переправ."}, {"t": "choice", "q": "Головна ідея задач на переправу:", "o": ["везти все одразу", "іноді треба везти назад", "поспішати"], "a": 1, "e": "Крок, що здається зайвим."}], "quiz2": [{"t": "input", "q": "Є 8 і 5 літрів. Скільки літрів лишиться у восьмилітровій після одного переливання в п'ятилітрову?", "a": ["3"], "e": "8 − 5."}, {"t": "input", "q": "12 монет, одна легша. Скільки зважувань мінімум?", "a": ["3", "три"], "e": "3 зважування."}, {"t": "input", "q": "Скільки разів човен перетинає річку в задачі про вовка, козу й капусту?", "a": ["7", "сім"], "e": "Сім."}, {"t": "input", "q": "Дві мотузки горять по 60 хв. Скільки кінців підпалити спочатку, щоб відміряти 45 хвилин?", "a": ["3", "три"], "e": "Обидва кінці першої і один другої."}], "quiz3": [{"t": "input", "q": "Є 5 л і 3 л. Скільки літрів лишиться у 5-літровій, якщо з повної 5-літрової двічі наповнити 3-літрову (виливаючи її)? Напиши число.", "a": ["2"], "e": "5 − 3 = 2."}, {"t": "input", "q": "81 монета, одна легша. Скільки зважувань?", "a": ["4"], "e": "3⁴ = 81."}, {"t": "input", "q": "Троє мають перейти міст із одним ліхтарем: 1, 2 і 5 хв, ідуть по двоє зі швидкістю повільнішого. Мінімальний час?", "a": ["8"], "e": "1+2 разом (2), 1 назад (1), 1+5 (5) = 8."}, {"t": "input", "q": "Мотузка горить 60 хв. Скільки хвилин, якщо підпалити з двох кінців і одночасно другу з одного?", "a": ["30"], "e": "Перша згорить за 30."}]}, {"id": "lg-obernenyi-khid", "sec": "Числа та нестандартні задачі", "title": "Математичні трюки. Крокуємо назад: метод оберненого ходу", "goal": "Ти розумієш математичні фокуси й розв'язуєш задачі з кінця.", "learn": [{"h": "Метод оберненого ходу", "p": ["Якщо відомий <b>результат</b>, а шукають початок — іди <b>з кінця</b>, замінюючи кожну дію на обернену: додавання ↔ віднімання, множення ↔ ділення."], "ex": ["«Задумав число, помножив на 3, додав 6, поділив на 2, отримав 12. Яке число?» З кінця: 12 · 2 = 24 → 24 − 6 = 18 → 18 : 3 = <b>6</b>.", "«Половину яблук віддав, потім ще 2, лишилось 3». З кінця: 3 + 2 = 5 — це половина → було <b>10</b>."]}, {"h": "Математичні фокуси", "p": ["Фокус працює, бо задумане число <b>скорочується</b>. Приклад: «задумай число, додай 5, помнож на 2, відніми 10, поділи на 2» → завжди отримаєш <b>задумане число</b>. Перевірка алгеброю: ((x + 5)·2 − 10) : 2 = x.", "Фокус «завжди 5»: задумай число, додай 3, помнож на 2, відніми 4, поділи на 2, відніми задумане → завжди 2."]}, {"h": "Задачі з дробами і з кінця", "p": ["«З'їв третину печива, потім половину решти, лишилось 4». З кінця: 4 — це половина решти → решта 8 → 8 — це дві третини → усього 12."]}, {"h": "Коли метод не працює", "p": ["Якщо дії неоднозначні (наприклад, «округлив») — обернений хід дає кілька варіантів; тоді перевіряють кожен підстановкою в умову. Завжди роби <b>перевірку прямим ходом</b>."]}], "remember": "Обернений хід: іди з кінця, замінюючи дії на обернені (+ ↔ −, · ↔ :). Приклад: ·3, +6, :2 = 12 → 12·2 = 24, −6 = 18, :3 = 6. Фокуси працюють, бо задумане число скорочується. Завжди перевіряй прямим ходом.", "cards": [{"f": "Метод оберненого ходу", "b": "Розв'язувати з кінця, замінюючи дії оберненими."}, {"f": "Обернені дії", "b": "Додавання ↔ віднімання; множення ↔ ділення."}, {"f": "Задумав, ·3, +6, :2 = 12. Задумане число?", "b": "6."}, {"f": "Чому працюють математичні фокуси?", "b": "Задумане число під час дій скорочується."}, {"f": "Що робити після розв'язання оберненим ходом?", "b": "Перевірити прямим ходом за умовою."}, {"f": "Половину віддав, ще 2 віддав, лишилось 3. Скільки було?", "b": "10."}], "quiz": [{"t": "input", "q": "Задумане число помножили на 4 і додали 5, отримали 29. Яке число задумали?", "a": ["6"], "e": "29 − 5 = 24, 24 : 4 = 6."}, {"t": "input", "q": "Число поділили на 3, потім відняли 2, отримали 5. Яке число?", "a": ["21"], "e": "5 + 2 = 7, 7 · 3 = 21."}, {"t": "input", "q": "Віддав половину цукерок, потім ще 3, лишилось 4. Скільки було?", "a": ["14"], "e": "4 + 3 = 7 — половина, отже 14."}, {"t": "input", "q": "З'їв третину печива, потім половину решти, лишилось 4. Скільки було печива?", "a": ["12"], "e": "4 → 8 → 12."}, {"t": "input", "q": "Задумай число, додай 5, помнож на 2, відніми 10, поділи на 2. Що отримаєш?", "a": ["задумане число", "задумане", "те саме число", "число"], "e": "Завжди задумане число."}, {"t": "input", "q": "Число збільшили у 2 рази, потім ще на 7, вийшло 23. Яке було число?", "a": ["8"], "e": "23 − 7 = 16, 16 : 2 = 8."}, {"t": "choice", "q": "Обернена дія до множення —", "o": ["додавання", "ділення", "віднімання"], "a": 1, "e": "Ділення."}, {"t": "choice", "q": "Що обов'язково зробити після оберненого ходу?", "o": ["Перевірити прямим ходом", "Округлити", "Нічого"], "a": 0, "e": "Підставити в умову."}], "quiz2": [{"t": "input", "q": "Число помножили на 3, відняли 7, поділили на 2, отримали 10. Яке число?", "a": ["9"], "e": "10·2=20, +7=27, :3=9."}, {"t": "input", "q": "Віддав третину яблук, потім половину решти, лишилось 6. Скільки було?", "a": ["18"], "e": "6·2=12, це 2/3 → 18."}, {"t": "input", "q": "Задумай число, помнож на 2, додай 8, поділи на 2, відніми задумане. Що вийде?", "a": ["4"], "e": "Завжди 4."}, {"t": "input", "q": "Число зменшили втричі й додали 12, вийшло 20. Яке число?", "a": ["24"], "e": "20−12=8, ·3=24."}], "quiz3": [{"t": "input", "q": "Три брати ділили горіхи: перший узяв половину, другий половину решти, третій — 5 горіхів, і нічого не лишилось. Скільки було?", "a": ["20"], "e": "5 = половина решти після першого → решта 10 → усього 20."}, {"t": "input", "q": "Кожного дня кількість подвоюється. На 10-й день ставок повний. На який день був заповнений на чверть?", "a": ["8"], "e": "8-й день."}, {"t": "input", "q": "Число: додали 5, помножили на 3, відняли 9, поділили на 6, вийшло 4. Яке число?", "a": ["6"], "e": "4·6=24, +9=33, :3=11, −5=6."}, {"t": "input", "q": "Продали половину товару й ще 3 одиниці, лишилось 12. Скільки було?", "a": ["30"], "e": "12+3=15 — половина."}]}, {"id": "lg-kod-ploshchyny", "sec": "Весела геометрія навколо нас", "title": "Код площини: точки, відрізки, прямі. Периметр", "goal": "Ти знаєш основні геометричні поняття, рахуєш периметр і розв'язуєш задачі на обхід фігури.", "learn": [{"h": "Основні поняття", "p": ["<b>Точка</b> — не має розмірів. <b>Пряма</b> — нескінченна в обидва боки; через дві точки проходить <b>лише одна</b> пряма. <b>Промінь</b> — має початок. <b>Відрізок</b> — має два кінці й довжину. <b>Ламана</b> — кілька відрізків підряд; <b>замкнена</b> ламана обмежує многокутник."], "ex": ["Скільки прямих через 3 точки, що не лежать на одній прямій? — <b>3</b>. Через 4 точки — <b>6</b>. Формула: n·(n−1)/2.", "Скільки відрізків на прямій, де позначено 5 точок? — 10."]}, {"h": "Периметр", "p": ["<span class='term'>Периметр</span> — довжина «обходу» фігури: сума всіх сторін. P прямокутника = 2(a + b); квадрата = 4a; трикутника = a + b + c. Обернені задачі: P = 24 см у квадрата → сторона 6; P = 30 у прямокутника з a = 10 → b = 5."], "note": "Хитрі задачі: якщо фігуру складають із квадратиків, при склеюванні периметр <b>зменшується</b> — сторони, що злиплись, більше не належать контуру."}, {"h": "Задачі-головоломки на периметр", "p": ["• З двох квадратів 1×1 склали прямокутник — периметр 6, а не 8 (дві сторони зникли всередині).", "• Прямокутник 6×2 і 4×3 мають однакову площу 12, але різні периметри: 16 і 14. З усіх прямокутників однакової площі <b>найменший периметр у квадрата</b>.", "• Мурашка обходить фігуру — рахуємо тільки зовнішній контур."]}], "remember": "Через дві точки — одна пряма; через n точок — n(n−1)/2 прямих. Периметр — сума сторін; P прямокутника = 2(a+b), квадрата = 4a. При склеюванні фігур периметр зменшується. Серед прямокутників однакової площі найменший периметр у квадрата.", "cards": [{"f": "Скільки прямих через дві точки?", "b": "Рівно одна."}, {"f": "Скільки прямих через n точок загального положення?", "b": "n·(n−1)/2."}, {"f": "Периметр", "b": "Сума довжин усіх сторін фігури."}, {"f": "P прямокутника і квадрата", "b": "2(a + b) і 4a."}, {"f": "Що стається з периметром при склеюванні фігур?", "b": "Зменшується — злиплі сторони не входять у контур."}, {"f": "У якого прямокутника з даною площею найменший периметр?", "b": "У квадрата."}], "quiz": [{"t": "input", "q": "Скільки прямих можна провести через 4 точки, жодні три з яких не на одній прямій?", "a": ["6"], "e": "4·3/2 = 6."}, {"t": "input", "q": "Периметр квадрата 36 см. Яка сторона?", "a": ["9"], "e": "36 : 4."}, {"t": "input", "q": "Периметр прямокутника 26 см, одна сторона 8 см. Яка друга?", "a": ["5"], "e": "26 : 2 = 13; 13 − 8 = 5."}, {"t": "input", "q": "Два квадрати зі стороною 1 склали в прямокутник. Який його периметр?", "a": ["6"], "e": "1+2+1+2 = 6."}, {"t": "input", "q": "Периметр прямокутника 6 × 2?", "a": ["16"], "e": "2(6+2)."}, {"t": "choice", "q": "Прямокутники 6×2 і 4×3 мають однакову площу. У якого менший периметр?", "o": ["6×2", "4×3"], "a": 1, "e": "14 проти 16."}, {"t": "input", "q": "Скільки відрізків утворюють 4 точки на прямій?", "a": ["6"], "e": "4·3/2 = 6."}, {"t": "choice", "q": "Що не має розмірів?", "o": ["Точка", "Відрізок", "Промінь"], "a": 0, "e": "Точка."}], "quiz2": [{"t": "input", "q": "Скільки прямих через 5 точок загального положення?", "a": ["10"], "e": "5·4/2."}, {"t": "input", "q": "Периметр прямокутника 40, довжина втричі більша за ширину. Ширина?", "a": ["5"], "e": "a+b=20; 3b+b=20 → 5."}, {"t": "input", "q": "Із двох квадратів 2×2 склали прямокутник. Його периметр?", "a": ["12"], "e": "2(4+2)."}, {"t": "input", "q": "Скільки відрізків утворюють 6 точок на прямій?", "a": ["15"], "e": "6·5/2."}], "quiz3": [{"t": "input", "q": "Квадрат 6×6 розрізали на 4 однакові квадрати. Сума їхніх периметрів?", "a": ["48"], "e": "4 квадрати 3×3, по 12."}, {"t": "input", "q": "Дріт довжиною 24 см зігнули у прямокутник з найбільшою площею. Яка площа?", "a": ["36"], "e": "Квадрат 6×6."}, {"t": "input", "q": "Із 4 однакових квадратиків 1×1 склали фігуру у формі букви L. Її периметр?", "a": ["10"], "e": "L-тетраміно."}, {"t": "input", "q": "Скільки трикутників можна утворити з 5 точок, жодні три з яких не на одній прямій?", "a": ["10"], "e": "5·4·3 : 6."}]}, {"id": "lg-figury-obiemni", "sec": "Весела геометрія навколо нас", "title": "Фігури навколо нас. Подорож у світ об'ємних фігур", "goal": "Ти знаєш властивості плоских і об'ємних фігур та рахуєш грані, ребра, вершини.", "learn": [{"h": "Плоскі фігури", "p": ["Трикутник (сума кутів 180°), чотирикутник (360°), прямокутник, квадрат, ромб, паралелограм, трапеція, коло. <b>Коло</b> — лінія, <b>круг</b> — частина площини всередині; <b>радіус</b>, <b>діаметр</b> (d = 2r), <b>центр</b>. <b>Симетрія</b>: у квадрата 4 осі, у прямокутника 2, у кола — безліч, у рівнобедреного трикутника — 1."]}, {"h": "Об'ємні фігури", "p": ["<b>Куб</b>, <b>прямокутний паралелепіпед</b>, <b>піраміда</b>, <b>призма</b>, <b>циліндр</b>, <b>конус</b>, <b>куля</b>. У куба: <b>6 граней, 12 ребер, 8 вершин</b>. Трикутна піраміда: 4 грані, 6 ребер, 4 вершини. У циліндра, конуса і кулі — криві поверхні, ребер у звичному сенсі немає."], "note": "<b>Формула Ейлера</b> для многогранників: <b>В − Р + Г = 2</b> (вершини − ребра + грані). Перевір на кубі: 8 − 12 + 6 = 2 ✓."}, {"h": "Розгортки й види", "p": ["<b>Розгортка</b> — фігура на площині, з якої складають об'ємне тіло. У куба 11 різних розгорток. Задачі: «яка розгортка дає куб?», «яка грань буде навпроти?». У куба протилежні грані ніколи не мають спільного ребра. <b>Види</b>: спереду, зверху, збоку — за трьома видами можна впізнати фігуру."]}, {"h": "Задачі на підрахунок", "p": ["«Скільки квадратів на шахівниці 3×3?» — 9 (1×1) + 4 (2×2) + 1 (3×3) = <b>14</b>. «Скільки трикутників на малюнку?» — рахуй по розмірах: маленькі, з двох, з чотирьох. Головне — рахувати <b>системно</b>, а не хаотично."]}], "remember": "Сума кутів трикутника 180°, чотирикутника 360°. d = 2r. Куб: 6 граней, 12 ребер, 8 вершин; формула Ейлера В − Р + Г = 2. Куб має 11 розгорток; протилежні грані не мають спільного ребра. Рахуй фігури системно за розмірами.", "cards": [{"f": "Сума кутів трикутника і чотирикутника", "b": "180° і 360°."}, {"f": "Коло і круг", "b": "Коло — лінія; круг — частина площини всередині неї."}, {"f": "Діаметр", "b": "d = 2r — удвічі більший за радіус."}, {"f": "Скільки осей симетрії у квадрата?", "b": "Чотири."}, {"f": "Куб: грані, ребра, вершини", "b": "6, 12, 8."}, {"f": "Формула Ейлера", "b": "Вершини − Ребра + Грані = 2."}, {"f": "Скільки різних розгорток у куба?", "b": "11."}, {"f": "Скільки квадратів на сітці 3×3?", "b": "14: дев'ять 1×1, чотири 2×2, один 3×3."}], "quiz": [{"t": "input", "q": "Скільки ребер у куба?", "a": ["12"], "e": "12."}, {"t": "input", "q": "Скільки вершин у куба?", "a": ["8"], "e": "8."}, {"t": "input", "q": "Перевір формулу Ейлера для куба: 8 − 12 + 6 = ?", "a": ["2"], "e": "Завжди 2."}, {"t": "input", "q": "Радіус 7 см. Який діаметр?", "a": ["14"], "e": "d = 2r."}, {"t": "input", "q": "Скільки осей симетрії у квадрата?", "a": ["4", "чотири"], "e": "Чотири."}, {"t": "input", "q": "Скільки всього квадратів на сітці 3×3?", "a": ["14"], "e": "9 + 4 + 1."}, {"t": "choice", "q": "Скільки граней у трикутної піраміди?", "o": ["3", "4", "5"], "a": 1, "e": "Основа + три бічні."}, {"t": "choice", "q": "Коло — це…", "o": ["лінія", "частина площини", "об'ємна фігура"], "a": 0, "e": "Круг — частина площини."}, {"t": "input", "q": "Скільки різних розгорток має куб?", "a": ["11"], "e": "Одинадцять."}, {"t": "choice", "q": "Сума кутів чотирикутника —", "o": ["180°", "360°", "90°"], "a": 1, "e": "360°."}], "quiz2": [{"t": "input", "q": "Скільки квадратів на сітці 4×4?", "a": ["30"], "e": "16+9+4+1."}, {"t": "input", "q": "Перевір формулу Ейлера для трикутної піраміди: 4 − 6 + 4 = ?", "a": ["2"], "e": "Завжди 2."}, {"t": "input", "q": "Два кути трикутника рівні, третій 80°. Знайди один із рівних (градуси).", "a": ["50", "50°"], "e": "(180−80):2."}, {"t": "input", "q": "Скільки осей симетрії у рівностороннього трикутника?", "a": ["3", "три"], "e": "Три."}], "quiz3": [{"t": "input", "q": "Скільки прямокутників (не лише квадратів) на сітці 2×2?", "a": ["9"], "e": "3·3 способи вибрати межі."}, {"t": "input", "q": "Многогранник має 12 вершин і 30 ребер. Скільки граней? (формула Ейлера)", "a": ["20"], "e": "12 − 30 + Г = 2."}, {"t": "input", "q": "Скільки осей симетрії у кола?", "a": ["безліч", "нескінченно", "безмежно"], "e": "Безліч."}, {"t": "input", "q": "Куб розрізали площиною через три вершини однієї грані. Яка фігура в перерізі?", "a": ["трикутник"], "e": "Трикутник."}]}, {"id": "lg-rozfarbuvannia-rozcherk", "sec": "Весела геометрія навколо нас", "title": "Магія незмінності: розфарбовування. Мости й одним розчерком", "goal": "Ти застосовуєш розфарбовування як інваріант і знаєш правило обходу фігури одним розчерком.", "learn": [{"h": "Розфарбовування як доказ", "p": ["Прийом: пофарбувати клітинки в шахові кольори — і побачити, що щось неможливе.", "<b>Класика:</b> з шахівниці 8×8 вирізали дві протилежні кутові клітинки. Чи можна замостити її доміношками 1×2? <b>Ні:</b> кожна доміношка накриває одну чорну й одну білу, а вирізані кутики одного кольору — залишилось 30 і 32 клітинки.", "<b>Кінь на шахівниці</b> завжди ходить з клітинки одного кольору на клітинку іншого, тому за непарну кількість ходів не повернеться на місце."]}, {"h": "Обхід одним розчерком", "p": ["<span class='term'>Задача про кенігсберзькі мости</span>: 7 мостів, треба пройти кожним рівно раз. <b>Ейлер</b> довів — неможливо, і створив теорію графів. <b>Граф</b> — точки (<b>вершини</b>) і лінії (<b>ребра</b>). <b>Степінь</b> вершини — скільки ліній до неї підходить; вершина <b>парна</b> або <b>непарна</b>."]}, {"h": "Правило Ейлера", "p": ["Фігуру можна обійти одним розчерком (не відриваючи олівця й не проводячи лінію двічі), якщо непарних вершин <b>0 або 2</b>.", "• 0 непарних → можна почати де завгодно й повернутись у ту саму точку.", "• 2 непарні → почати треба в одній непарній, а закінчити в іншій.", "• 4 і більше непарних → <b>неможливо</b>. У Кенігсберзі було 4 непарні вершини."], "ex": ["Конверт (прямокутник з діагоналями й «дашком») малюється одним розчерком: у нього рівно 2 непарні вершини — починати треба з нижнього кута."]}], "remember": "Розфарбування — інваріант: доміношка завжди накриває дві різні клітинки; кінь змінює колір щоходу. Граф — вершини й ребра; степінь вершини — кількість ліній. Одним розчерком можна, якщо непарних вершин 0 або 2; при 2 — старт в одній із них. Мости Кенігсберга — 4 непарні, неможливо.", "cards": [{"f": "Що накриває доміношка 1×2 на шахівниці?", "b": "Одну чорну й одну білу клітинку."}, {"f": "Чому не замостити дошку без двох кутів?", "b": "Вирізані клітинки одного кольору — 30 і 32, а доміношка потребує порівну."}, {"f": "Як ходить шаховий кінь щодо кольору?", "b": "Завжди на клітинку іншого кольору."}, {"f": "Граф", "b": "Схема з вершин (точок) і ребер (ліній)."}, {"f": "Степінь вершини", "b": "Кількість ліній, що виходять із неї."}, {"f": "Правило одного розчерку", "b": "Можна, якщо непарних вершин 0 або 2."}, {"f": "Якщо непарних вершин дві", "b": "Починати треба в одній із них, закінчити в іншій."}, {"f": "Задача про кенігсберзькі мости", "b": "Ейлер довів, що обійти всі 7 мостів по разу неможливо; так виникла теорія графів."}], "quiz": [{"t": "choice", "q": "Скільки клітинок кожного кольору накриває доміношка 1×2?", "o": ["Дві однакові", "Одну чорну й одну білу"], "a": 1, "e": "Завжди різні."}, {"t": "choice", "q": "Чи можна замостити доміношками дошку 8×8 без двох протилежних кутів?", "o": ["Так", "Ні"], "a": 1, "e": "Кольорів порівну не буде."}, {"t": "choice", "q": "Кінь зробив 5 ходів. Чи може він бути на початковій клітинці?", "o": ["Так", "Ні"], "a": 1, "e": "Колір змінюється щоходу; потрібна парна кількість."}, {"t": "input", "q": "При скількох непарних вершинах фігуру можна намалювати одним розчерком? Напиши обидва числа через кому (менше першим).", "a": ["0,2", "0, 2", "0 і 2", "0 2"], "e": "0 або 2."}, {"t": "choice", "q": "Скільки непарних вершин було в задачі про кенігсберзькі мости?", "o": ["2", "4", "0"], "a": 1, "e": "Тому й неможливо."}, {"t": "choice", "q": "Хто розв'язав задачу про мости?", "o": ["Ейлер", "Піфагор", "Аристотель"], "a": 0, "e": "Леонард Ейлер."}, {"t": "choice", "q": "Якщо у фігури 2 непарні вершини, звідки починати?", "o": ["З будь-якої", "З непарної вершини", "З парної"], "a": 1, "e": "Старт і фініш — непарні."}, {"t": "input", "q": "Як називається схема з точок і ліній, що їх з'єднують?", "a": ["граф"], "e": "Граф."}, {"t": "choice", "q": "Скількома лініями визначається степінь вершини?", "o": ["Кількістю ліній, що до неї підходять", "Її розміром", "Кольором"], "a": 0, "e": "Степінь."}], "quiz2": [{"t": "choice", "q": "Фігура має 4 непарні вершини. Чи можна намалювати її одним розчерком?", "o": ["Ні", "Так", "Тільки з кутка"], "a": 0, "e": "Правило Ейлера."}, {"t": "input", "q": "Скільки непарних вершин має конверт (прямокутник із діагоналями й «дашком»)?", "a": ["2", "два"], "e": "Тому малюється одним розчерком."}, {"t": "choice", "q": "Чи можна доміношками замостити дошку 5×5?", "o": ["Ні, 25 клітинок — непарна кількість", "Так", "Тільки частково"], "a": 0, "e": "Парність."}, {"t": "input", "q": "Скільки мостів було в задачі про Кенігсберг?", "a": ["7", "сім"], "e": "Сім."}], "quiz3": [{"t": "choice", "q": "У графа 0 непарних вершин. Що це означає?", "o": ["Можна обійти всі ребра, повернувшись у початок", "Не можна обійти", "Треба почати з парної"], "a": 0, "e": "Ейлерів цикл."}, {"t": "choice", "q": "З дошки 8×8 вирізали дві клітинки різних кольорів. Чи можна замостити доміношками?", "o": ["Зазвичай так — кольорів порівну", "Ні", "Ніколи"], "a": 0, "e": "Умова парності виконана."}, {"t": "choice", "q": "Чому кінь із білої клітинки завжди потрапляє на чорну?", "o": ["Хід конем змінює колір клітинки", "Це не так", "Через форму дошки"], "a": 0, "e": "Інваріант."}, {"t": "input", "q": "Хто створив теорію графів, розв'язавши задачу про мости?", "a": ["ейлер", "леонард ейлер"], "e": "Ейлер."}]}, {"id": "lg-rozrizannia", "sec": "Весела геометрія навколо нас", "title": "Розрізання, яке веде до відкриттів. Розв'язування задач", "goal": "Ти розв'язуєш задачі на розрізання й складання фігур.", "learn": [{"h": "Ідея", "p": ["Задачі на <b>розрізання</b>: поділити фігуру на рівні частини або перекроїти в іншу. Ключ — <b>площа не змінюється</b>: якщо площа фігури 12, то на 5 однакових частин її не поділити. Перед розрізанням завжди: порахуй площу і поділи на кількість частин — отримаєш площу однієї."]}, {"h": "Типові задачі", "p": ["• Розрізати квадрат 4×4 на 4 рівні частини (не обов'язково квадрати — можуть бути Г-подібні, «сходинками»).", "• Розрізати фігуру-«Г» на 4 однакові фігури, подібні до неї.", "• З двох квадратів зробити один (перекроювання).", "• Розрізати квадрат на 5 квадратів? Ні — не завжди можливо, треба перевіряти площу.", "• <b>Танграм</b> — китайська головоломка з 7 частин квадрата, з яких складають фігурки."]}, {"h": "Прийоми", "p": ["1) Порахувати площу й поділити. 2) Малювати по клітинках. 3) Шукати <b>симетрію</b> — часто розріз проходить через центр. 4) Пробувати повороти й дзеркальні відображення (частини можна перевертати). 5) Якщо не виходить — довести неможливість (площею, парністю, розфарбуванням)."]}, {"h": "Пентаміно", "p": ["<b>Пентаміно</b> — фігури з 5 клітинок; їх рівно <b>12</b> різних. З них складають прямокутники (наприклад, 6×10). Такі задачі тренують просторову уяву — саме те, що потрібно й у 3D-моделюванні."]}], "remember": "У задачах на розрізання площа не змінюється: площа фігури має ділитись на кількість частин. Прийоми: рахувати по клітинках, шукати симетрію, дозволяти повороти й перевертання. Танграм — 7 частин; пентаміно — фігури з 5 клітинок, їх 12.", "cards": [{"f": "Що не змінюється при розрізанні й складанні?", "b": "Площа фігури."}, {"f": "Перший крок у задачі на розрізання", "b": "Порахувати площу й поділити на кількість частин."}, {"f": "Чи можна перевертати частини?", "b": "Так, зазвичай дозволені повороти й дзеркальні відображення."}, {"f": "Танграм", "b": "Головоломка з 7 частин квадрата, з яких складають фігури."}, {"f": "Пентаміно", "b": "Фігури з 5 клітинок; існує 12 різних."}, {"f": "Як довести, що розрізати неможливо?", "b": "Через площу, парність або розфарбування."}], "quiz": [{"t": "input", "q": "Квадрат 4×4 ділять на 4 рівні частини. Яка площа однієї частини?", "a": ["4"], "e": "16 : 4."}, {"t": "choice", "q": "Чи можна фігуру площею 12 клітинок поділити на 5 рівних частин?", "o": ["Так", "Ні"], "a": 1, "e": "12 не ділиться на 5."}, {"t": "input", "q": "Скільки частин у танграмі?", "a": ["7", "сім"], "e": "Сім."}, {"t": "input", "q": "Скільки існує різних фігур пентаміно?", "a": ["12", "дванадцять"], "e": "Дванадцять."}, {"t": "choice", "q": "З чого починати задачу на розрізання?", "o": ["Малювати навмання", "Порахувати площу", "Шукати відповідь"], "a": 1, "e": "Площа однієї частини."}, {"t": "input", "q": "Фігура з 20 клітинок ділиться на однакові частини по 5 клітинок. Скільки частин?", "a": ["4"], "e": "20 : 5."}, {"t": "choice", "q": "Що допомагає знайти лінію розрізу?", "o": ["Симетрія фігури", "Її колір", "Назва"], "a": 0, "e": "Часто розріз через центр."}, {"t": "choice", "q": "Пентаміно складається з…", "o": ["4 клітинок", "5 клітинок", "6 клітинок"], "a": 1, "e": "Пента — п'ять."}], "quiz2": [{"t": "input", "q": "Фігуру площею 24 клітинки ділять на 6 однакових частин. Скільки клітинок у частині?", "a": ["4"], "e": "24 : 6."}, {"t": "choice", "q": "Чи можна квадрат 3×3 поділити на 4 рівні за площею частини?", "o": ["Ні: 9 не ділиться на 4", "Так", "Тільки по діагоналі"], "a": 0, "e": "Площа."}, {"t": "input", "q": "Скільки клітинок у фігурі пентаміно?", "a": ["5", "п'ять"], "e": "П'ять."}, {"t": "input", "q": "Скільки частин у танграмі?", "a": ["7", "сім"], "e": "Сім."}], "quiz3": [{"t": "input", "q": "Скільки пентаміно потрібно, щоб скласти прямокутник 5×12?", "a": ["12"], "e": "60 : 5."}, {"t": "choice", "q": "Квадрат розрізали на 5 квадратів. Чи можливо?", "o": ["Так, якщо квадрати різних розмірів", "Ні", "Тільки на 4"], "a": 0, "e": "Можливо."}, {"t": "input", "q": "Прямокутник 4×6 ділять на дві однакові частини одним розрізом по клітинках. Площа однієї?", "a": ["12"], "e": "24 : 2."}, {"t": "choice", "q": "Що завжди перевіряють першим у задачі на розрізання?", "o": ["Чи ділиться площа на кількість частин", "Симетрію", "Колір"], "a": 0, "e": "Перевірка можливості."}]}, {"id": "lg-zakonomirnosti", "sec": "Закономірності", "title": "Математичний квест: знайди зв'язок. Секрети розумників: висновки", "goal": "Ти знаходиш закономірності в рядах і робиш правильні висновки.", "learn": [{"h": "Закономірність", "p": ["<span class='term'>Закономірність</span> — правило, за яким будується ряд. Щоб знайти: подивись <b>різницю</b> сусідніх членів, потім <b>частку</b>, потім чергування, потім позицію числа."], "ex": ["2, 4, 6, 8 → +2 → 10. 3, 6, 12, 24 → ×2 → 48. 1, 4, 9, 16 → квадрати → 25. 1, 1, 2, 3, 5, 8 → <b>Фібоначчі</b>, кожне = сума двох попередніх → 13. 1, 2, 4, 7, 11 → різниці 1, 2, 3, 4 → 16. 31, 28, 31, 30 → дні місяців. А, В, Д, Ж → пропускаємо по букві."]}, {"h": "Види рядів", "p": ["<b>Числові</b> (арифметичні: +d; геометричні: ×q), <b>буквені</b> (за алфавітом), <b>фігурні</b> (обертання, додавання елементів, зміна кольору), <b>змішані</b>. У фігурних рядах шукай, що змінюється: кількість, поворот, колір, розмір, положення."]}, {"h": "Висновки: силогізм", "p": ["<span class='term'>Силогізм</span> — висновок із двох суджень. «Усі птахи мають пір'я. Горобець — птах. Отже, <b>горобець має пір'я</b>».", "Помилки: «Усі коти — тварини. Мурка — тварина. Отже, Мурка — кіт» — <b>неправильно</b> (Мурка може бути собакою). Не можна робити висновок із двох часткових суджень («деякі… деякі…») або з двох заперечних."]}, {"h": "Правила висновку", "p": ["1) Висновок має спиратись лише на дані. 2) З «усі A є B» не випливає «усі B є A». 3) Один контрприклад руйнує загальний висновок. 4) Розрізняй <b>кореляцію</b> й <b>причину</b>: влітку більше морозива і більше засмаглих — але морозиво не робить засмагу."]}], "remember": "Шукай різницю, потім частку, потім чергування. Фібоначчі: кожне = сума двох попередніх (1,1,2,3,5,8,13). Силогізм: усі A є B + C є A ⇒ C є B. Помилка: «усі A є B, C є B ⇒ C є A». Кореляція ≠ причина.", "cards": [{"f": "Закономірність", "b": "Правило, за яким побудований ряд."}, {"f": "Як шукати правило ряду?", "b": "Різниця сусідніх → частка → чергування → позиція."}, {"f": "Ряд Фібоначчі", "b": "1, 1, 2, 3, 5, 8, 13… кожне число — сума двох попередніх."}, {"f": "1, 4, 9, 16, …", "b": "25 — квадрати натуральних чисел."}, {"f": "Силогізм", "b": "Висновок із двох суджень: усі A є B; C — A; отже, C є B."}, {"f": "Типова помилка висновку", "b": "«Усі коти — тварини; Мурка — тварина; отже, кіт» — неправильно."}, {"f": "Кореляція і причина", "b": "Дві речі можуть траплятись разом, не будучи причиною одна одної."}], "quiz": [{"t": "input", "q": "Продовж ряд: 3, 6, 12, 24, …", "a": ["48"], "e": "×2."}, {"t": "input", "q": "Продовж ряд: 1, 1, 2, 3, 5, 8, …", "a": ["13"], "e": "Фібоначчі."}, {"t": "input", "q": "Продовж ряд: 1, 4, 9, 16, …", "a": ["25"], "e": "Квадрати."}, {"t": "input", "q": "Продовж ряд: 1, 2, 4, 7, 11, …", "a": ["16"], "e": "Різниці 1, 2, 3, 4, 5."}, {"t": "input", "q": "Продовж ряд: 2, 5, 10, 17, …", "a": ["26"], "e": "Різниці 3, 5, 7, 9."}, {"t": "choice", "q": "«Усі метали проводять струм. Мідь — метал. Отже…»", "o": ["мідь проводить струм", "мідь не метал", "висновок неможливий"], "a": 0, "e": "Правильний силогізм."}, {"t": "choice", "q": "«Усі коти — тварини. Рекс — тварина. Отже, Рекс — кіт». Це…", "o": ["правильно", "неправильно"], "a": 1, "e": "Рекс може бути собакою."}, {"t": "choice", "q": "Улітку продають більше морозива і більше людей тоне. Отже…", "o": ["морозиво небезпечне", "обидва пов'язані зі спекою, а не між собою"], "a": 1, "e": "Кореляція ≠ причина."}, {"t": "input", "q": "Продовж ряд букв: А, В, Д, Ж, …", "a": ["и", "і"], "e": "Через одну букву алфавіту."}, {"t": "choice", "q": "Що руйнує загальний висновок «усі…»?", "o": ["Один контрприклад", "Половина випадків", "Нічого"], "a": 0, "e": "Досить одного."}], "quiz2": [{"t":
