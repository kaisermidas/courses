 "input", "q": "Продовж: 1, 3, 6, 10, 15, …", "a": ["21"], "e": "Різниці 2,3,4,5,6."}, {"t": "input", "q": "Продовж: 2, 6, 18, 54, …", "a": ["162"], "e": "×3."}, {"t": "input", "q": "Продовж: 1, 8, 27, 64, …", "a": ["125"], "e": "Куби."}, {"t": "choice", "q": "«Усі риби плавають. Дельфін плаває. Отже, дельфін — риба». Це…", "o": ["неправильний висновок", "правильний", "істинний"], "a": 0, "e": "Помилка."}], "quiz3": [{"t": "input", "q": "Продовж: 1, 2, 6, 24, 120, …", "a": ["720"], "e": "×2, ×3, ×4, ×5, ×6."}, {"t": "input", "q": "Продовж: 0, 1, 1, 2, 3, 5, 8, 13, …", "a": ["21"], "e": "Фібоначчі."}, {"t": "input", "q": "Продовж ряд: О, Д, Т, Ч, П, …", "a": ["ш"], "e": "Перші букви числівників: один, два, три, чотири, п'ять, шість."}, {"t": "choice", "q": "У місті більше морозива продають улітку, і більше людей носять окуляри від сонця. Чи одне спричиняє інше?", "o": ["Ні, обидва пов'язані зі спекою", "Так", "Морозиво спричиняє окуляри"], "a": 0, "e": "Кореляція ≠ причина."}]}, {"id": "lg-analohii-klasyfikatsiia", "sec": "Закономірності", "title": "Сила аналогій. Логіка класифікації", "goal": "Ти розв'язуєш аналогії і правильно класифікуєш предмети.", "learn": [{"h": "Аналогія", "p": ["<span class='term'>Аналогія</span> — схожість між різними речами; висновок за аналогією: якщо A схоже на B у кількох ознаках, можливо, схоже й у ще одній. Формат задачі: <b>А відноситься до Б, як В до …</b>", "Приклади: «птах — гніздо, людина — <b>дім</b>»; «риба — плавці, птах — <b>крила</b>»; «лікар — лікарня, учитель — <b>школа</b>»; «холодно — гарячо, темно — <b>світло</b>» (антоніми); «палець — рука, листок — <b>дерево</b>» (частина–ціле)."], "note": "Аналогія — <b>не доказ</b>: вона підказує ідею, але висновок треба перевірити. «Атом схожий на сонячну систему» — корисний образ, але не точна істина."}, {"h": "Види зв'язків в аналогіях", "p": ["Частина–ціле, предмет–функція, причина–наслідок, синонім, антонім, рід–вид, предмет–матеріал, професія–інструмент, тварина–дитинча, дія–результат."]}, {"h": "Класифікація", "p": ["<span class='term'>Класифікація</span> — поділ на групи за <b>однією ознакою</b> (основою поділу). Правила: 1) одна основа за раз; 2) групи <b>не перетинаються</b>; 3) поділ <b>повний</b> — жоден предмет не загублено; 4) поділ послідовний (без стрибків)."], "ex": ["Правильно: трикутники за кутами → гострокутні, прямокутні, тупокутні.", "Помилка: «люди діляться на дітей, дорослих і спортсменів» — різні основи й перетин.", "Помилка неповноти: «числа бувають парні» — а непарні?"]}, {"h": "Знайди зайве", "p": ["Задача «що зайве» — це класифікація: знайди спільну ознаку більшості. Кіт, собака, ворона, кінь → <b>ворона</b> (птах, решта — ссавці). Іноді відповідей кілька — важливо <b>пояснити ознаку</b>."]}], "remember": "Аналогія: А до Б, як В до … Види зв'язків: частина–ціле, предмет–функція, антоніми, рід–вид, професія–інструмент. Аналогія підказує, але не доводить. Класифікація: одна основа, групи не перетинаються, поділ повний. «Зайве» — те, що не має спільної ознаки.", "cards": [{"f": "Аналогія", "b": "Схожість між різними речами; висновок за схожістю ознак."}, {"f": "Чи є аналогія доказом?", "b": "Ні, вона лише підказує ідею — висновок треба перевірити."}, {"f": "Приклади зв'язків в аналогіях", "b": "Частина–ціле, предмет–функція, антоніми, рід–вид, професія–інструмент."}, {"f": "Класифікація", "b": "Поділ на групи за однією ознакою."}, {"f": "Правила класифікації", "b": "Одна основа, групи не перетинаються, поділ повний і послідовний."}, {"f": "Помилка класифікації", "b": "«Люди: діти, дорослі, спортсмени» — різні основи й перетин груп."}, {"f": "Як розв'язувати «знайди зайве»?", "b": "Знайти спільну ознаку більшості й пояснити її."}], "quiz": [{"t": "choice", "q": "Птах — гніздо, людина — …", "o": ["дім", "їжа", "робота"], "a": 0, "e": "Житло."}, {"t": "choice", "q": "Риба — плавці, птах — …", "o": ["дзьоб", "крила", "пір'я"], "a": 1, "e": "Орган руху."}, {"t": "choice", "q": "Учитель — школа, лікар — …", "o": ["хвороба", "лікарня", "ліки"], "a": 1, "e": "Місце роботи."}, {"t": "choice", "q": "Палець — рука, листок — …", "o": ["зелений", "дерево", "осінь"], "a": 1, "e": "Частина–ціле."}, {"t": "choice", "q": "Що зайве: кіт, собака, ворона, кінь?", "o": ["кіт", "ворона", "кінь"], "a": 1, "e": "Птах серед ссавців."}, {"t": "choice", "q": "Що зайве: 2, 4, 7, 8, 10?", "o": ["2", "7", "10"], "a": 1, "e": "Єдине непарне."}, {"t": "choice", "q": "Яка класифікація правильна?", "o": ["Трикутники: гострокутні, прямокутні, тупокутні", "Люди: діти, дорослі, спортсмени", "Числа: парні"], "a": 0, "e": "Одна основа й повнота."}, {"t": "choice", "q": "У чому помилка поділу «числа бувають парні»?", "o": ["Немає повноти — забули непарні", "Забагато груп", "Немає помилки"], "a": 0, "e": "Неповний поділ."}, {"t": "choice", "q": "Чи можна вважати аналогію доказом?", "o": ["Так", "Ні, лише підказкою"], "a": 1, "e": "Потрібна перевірка."}], "quiz2": [{"t": "choice", "q": "Голка — шити, ножиці — …", "o": ["різати", "колоти", "клеїти"], "a": 0, "e": "Предмет — функція."}, {"t": "choice", "q": "Кінь — лоша, корова — …", "o": ["теля", "бик", "молоко"], "a": 0, "e": "Тварина — дитинча."}, {"t": "choice", "q": "Що зайве: береза, дуб, сосна, ромашка?", "o": ["ромашка", "сосна", "дуб"], "a": 0, "e": "Не дерево."}, {"t": "input", "q": "Учитель — школа, лікар — …", "a": ["лікарня"], "e": "Місце роботи."}], "quiz3": [{"t": "choice", "q": "Що зайве: 3, 5, 7, 9, 11?", "o": ["9", "3", "11"], "a": 0, "e": "Єдине складене число (решта прості)."}, {"t": "choice", "q": "Книжка — сторінка, будинок — …", "o": ["цегла", "дах", "місто"], "a": 0, "e": "Ціле — складова частина."}, {"t": "choice", "q": "«Люди поділяються на високих, розумних і брюнетів». Помилка?", "o": ["Різні основи поділу й групи перетинаються", "Немає помилки", "Груп замало"], "a": 0, "e": "Правила класифікації."}, {"t": "choice", "q": "Що зайве: квадрат, коло, куб, трикутник?", "o": ["куб", "коло", "квадрат"], "a": 0, "e": "Об'ємна фігура серед плоских."}]}, {"id": "lg-pereborn-tablytsi", "sec": "Закономірності", "title": "Детективний перебір: знайди рішення. Логічні таблиці", "goal": "Ти розв'язуєш класичні логічні задачі перебором і таблицею.", "learn": [{"h": "Метод перебору", "p": ["Коли варіантів небагато — випиши <b>всі</b> й викресли ті, що суперечать умові. Головне: перебирати <b>системно</b> (за порядком), нічого не пропускаючи й не повторюючи. Кількість варіантів рахують правилом множення: 3 сорочки × 2 штанів = 6."]}, {"h": "Логічна таблиця", "p": ["Для задач «хто де живе / хто чим захоплюється» будують <b>таблицю</b>: рядки — люди, стовпці — ознаки. Ставлять <b>−</b>, коли варіант неможливий, і <b>+</b>, коли єдиний. Правило: якщо в рядку чи стовпці лишився один вільний квадратик — там плюс; якщо поставили плюс — уся решта рядка й стовпця стає мінусами."], "ex": ["<b>Задача:</b> Аня, Богдан і Влад мають улюблені предмети: математика, музика, малювання. Аня не любить математику. Богдан любить не музику й не математику. Хто що любить?", "Богдан → малювання (виключення). Тоді Аня → музика (бо не математика), Влад → математика."]}, {"h": "Задачі про лицарів і брехунів", "p": ["<b>Лицарі</b> завжди кажуть правду, <b>брехуни</b> завжди брешуть. Прийом: припустити, що людина — лицар, і перевірити, чи не виникає суперечності; якщо виникає — вона брехун.", "«Я брехун» — так не може сказати ні лицар (бо збрехав би), ні брехун (бо сказав би правду) — отже, ніхто цього не казав."]}, {"h": "Поради", "p": ["Записуй умову коротко (літерами). Виділяй <b>категоричні</b> слова: «ніколи», «завжди», «тільки», «жоден» — вони дають найбільше мінусів. Починай із того факту, який виключає найбільше варіантів. Наприкінці <b>перевір</b> відповідь усіма умовами."]}], "remember": "Перебір — системно й повністю. Логічна таблиця: люди × ознаки, «−» неможливо, «+» єдине; після плюса решта рядка і стовпця — мінуси. Лицарі кажуть правду, брехуни брешуть; перевіряй припущенням. Починай із умови, що виключає найбільше.", "cards": [{"f": "Метод перебору", "b": "Виписати всі варіанти системно й викреслити ті, що суперечать умові."}, {"f": "Логічна таблиця", "b": "Рядки — люди, стовпці — ознаки; «−» неможливо, «+» єдиний варіант."}, {"f": "Правило таблиці", "b": "Поставив «+» — уся решта рядка й стовпця стає «−»."}, {"f": "Лицарі й брехуни", "b": "Лицарі завжди кажуть правду, брехуни завжди брешуть."}, {"f": "Чому ніхто не може сказати «я брехун»?", "b": "Лицар збрехав би, брехун сказав би правду — суперечність."}, {"f": "З чого починати розв'язання?", "b": "З умови, яка виключає найбільше варіантів."}, {"f": "Що робити наприкінці?", "b": "Перевірити відповідь усіма умовами задачі."}], "quiz": [{"t": "choice", "q": "Аня не любить математику. Богдан не любить ні музику, ні математику. Що любить Богдан?", "o": ["Математику", "Музику", "Малювання"], "a": 2, "e": "Залишається малювання."}, {"t": "choice", "q": "У тій же задачі: що любить Аня?", "o": ["Музику", "Математику", "Малювання"], "a": 0, "e": "Малювання зайняв Богдан, математику вона не любить."}, {"t": "choice", "q": "Що ставлять у таблиці, коли варіант неможливий?", "o": ["Плюс", "Мінус", "Нічого"], "a": 1, "e": "Мінус."}, {"t": "choice", "q": "Поставили «+» у клітинці. Що робити далі?", "o": ["Решту рядка й стовпця позначити «−»", "Нічого", "Стерти інші плюси"], "a": 0, "e": "Правило таблиці."}, {"t": "choice", "q": "Мешканець острова каже: «Я брехун». Хто він?", "o": ["Лицар", "Брехун", "Так сказати ніхто не може"], "a": 2, "e": "Суперечність в обох випадках."}, {"t": "choice", "q": "Лицар каже…", "o": ["завжди правду", "завжди неправду", "іноді правду"], "a": 0, "e": "Лицарі не брешуть."}, {"t": "input", "q": "3 футболки і 4 шорти. Скільки різних комплектів?", "a": ["12"], "e": "3 · 4."}, {"t": "choice", "q": "З якої умови починати розв'язання логічної задачі?", "o": ["З найдовшої", "З тієї, що виключає найбільше варіантів", "З останньої"], "a": 1, "e": "Найінформативніша."}, {"t": "choice", "q": "Які слова в умові найкорисніші?", "o": ["«ніколи», «жоден», «тільки»", "«можливо», «мабуть»", "«гарний», «великий»"], "a": 0, "e": "Категоричні дають мінуси."}], "quiz2": [{"t": "choice", "q": "Аня, Богдан, Влад мають різні улюблені кольори. Аня не любить синій і зелений. Який колір Ані, якщо є ще червоний?", "o": ["червоний", "синій", "зелений"], "a": 0, "e": "Виключення."}, {"t": "input", "q": "Скільки різних пар можна скласти з 5 учнів?", "a": ["10"], "e": "5·4/2."}, {"t": "choice", "q": "Житель острова каже: «Я лицар». Хто він?", "o": ["Не можна визначити", "Лицар", "Брехун"], "a": 0, "e": "Так може сказати кожен."}, {"t": "input", "q": "Скільки трицифрових чисел можна скласти з цифр 1, 2, 3, 4 без повторень?", "a": ["24"], "e": "4·3·2 = 24."}], "quiz3": [{"t": "choice", "q": "Двоє: A каже «Ми обидва брехуни». Хто A?", "o": ["Брехун, а B — лицар", "Лицар", "Обидва брехуни"], "a": 0, "e": "Якби A був лицарем, він збрехав би."}, {"t": "choice", "q": "У задачі про трьох друзів кожна умова дає мінуси. З якої починати?", "o": ["З тієї, що дає найбільше виключень", "З першої", "З останньої"], "a": 0, "e": "Ефективність."}, {"t": "input", "q": "Скільки способами розсадити 5 дітей у ряд, якщо двоє мають сидіти поруч?", "a": ["48"], "e": "Пара як один об'єкт: 4! · 2 = 48."}, {"t": "choice", "q": "Житель каже: «Я брехун». Що це означає?", "o": ["Такого висловлення бути не може — суперечність", "Він брехун", "Він лицар"], "a": 0, "e": "Парадокс."}]}, {"id": "lg-uzahalnennia", "sec": "Узагальнення вивченого", "title": "Мистецтво впорядковувати світ. Великий квест логіки", "goal": "Ти повторюєш усі поняття курсу й застосовуєш їх разом.", "learn": [{"h": "Множини й діаграми", "p": ["<span class='term'>Множина</span> — сукупність предметів (<b>елементів</b>). <b>Порожня множина</b> — без елементів. <b>Підмножина</b> — уся входить в іншу. <b>Переріз</b> (∩) — спільні елементи, <b>об'єднання</b> (∪) — усі разом. <b>Діаграми Ейлера — Венна</b>: кола, які показують відношення множин. Задача: у класі 20 учнів, 12 люблять футбол, 9 // ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ const o = P[id] || (P[id] = {learn:false, cards:false, best:null}); if(o.b2===undefined) o.b2=null; if(o.b3===undefined) o.b3=null; return o; }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function lvlLine(p){
  const done=[]; if(p.best!==null) done.push("легкий "+p.best+"%"); if(p.b2!==null) done.push("складний "+p.b2+"%"); if(p.b3!==null) done.push("дуже складний "+p.b3+"%");
  return done.length? done.join(" · ") : "Ще не проходив";
}
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = Math.max(starsOf(p.best), starsOf(p.b2), starsOf(p.b3));
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${lvlLine(p)}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  const qs=[L.quiz, L.quiz2, L.quiz3], keys=["best","b2","b3"];
  for(let k=1;k<=3;k++){
    const el=document.getElementById("q"+k+"-count"), st=document.getElementById("st-q"+k);
    const arr=qs[k-1]||[];
    el.textContent = arr.length? arr.length+" питань" : "поки немає";
    const v=p[keys[k-1]];
    st.innerHTML = v===null? "" : `<span class="stars">${starStr(starsOf(v))}</span>`;
  }
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCardsThenQuiz(){ openQuiz(1); }
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(1); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
let LEVEL = 1;
function openQuiz(lvl, items){
  if(typeof lvl==="number") LEVEL = lvl;
  const src = LEVEL===2 ? (L.quiz2||[]) : LEVEL===3 ? (L.quiz3||[]) : L.quiz;
  if(!items && !src.length){ alert("Для цього рівня питань поки немає."); return; }
  quiz = (items || src).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0;
  document.querySelector("#s-quiz .title").textContent = LEVEL===2?"Складний":LEVEL===3?"Дуже складний":"Легкий";
  showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/,/g,".").replace(/[^a-z0-9а-яіїєґ' \-\/.:%°]/gi,"").replace(/\s*([\/.:%°-])\s*/g,"$1").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = LEVEL===1
      ? `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`
      : `<b>${ok?"Правильно!":"Не зовсім."}</b>${ok?"":"Розбір буде в кінці."}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), p = lp(L.id);
  const st = LEVEL===3 ? (pct>=95?3:pct>=80?2:pct>=60?1:0) : starsOf(pct);
  const key = LEVEL===2?"b2":LEVEL===3?"b3":"best";
  const full = (LEVEL===2?(L.quiz2||[]):LEVEL===3?(L.quiz3||[]):L.quiz).length;
  if(quiz.length===full && (p[key]===null || pct>p[key])){ p[key]=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = LEVEL===3
    ? (st===3?"Неймовірно. Це найвищий рівень.":st===2?"Дуже добре для такого рівня.":st===1?"Складно — і це нормально. Спробуй ще.":"Цей рівень найважчий. Повтори легший і повертайся.")
    : (st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.");
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  const rev=document.getElementById("r-review");
  if(LEVEL>1 && qWrong.length){
    rev.style.display="block";
    rev.innerHTML = "<b>Розбір помилок</b>" + qWrong.map(q=>`<div class="rev"><i>${q.q}</i><br>${q.e}${q.t==="input"?" Правильно: <b>"+q.a[0]+"</b>.":""}</div>`).join("");
  } else rev.style.display="none";
  go("s-res");
}
function retryWrong(){ openQuiz(LEVEL, qWrong); }

load(renderList);
</script>
