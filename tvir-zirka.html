<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Хлопчик-зірка — розбір твору</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#101623; --card:#1A2231;
  --ink:#EEF2F7; --dim:#95A5BC;
  --star:#E9D08A; --pome:#C0505C; --frost:#A9C4DA;
  --line:rgba(238,242,247,.14);
  --ok:#79BFA0; --no:#D9737C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{padding:0 0 40px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.scr{display:none}.scr.on{display:block}

.hero{position:relative;padding:26px 16px 22px;overflow:hidden;
  background:radial-gradient(120% 90% at 76% 0%,#243149 0%,var(--bg) 68%)}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(233,208,138,.7)}
.fall{position:absolute;top:34px;right:34px;width:96px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(233,208,138,.75));transform:rotate(34deg)}
.hero h1{margin:0;font-size:33px;line-height:1.06;letter-spacing:-.5px}
.hero .by{margin:8px 0 0;color:var(--dim);font-size:14px}
.hero .meta{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}
.bar{margin-top:16px;height:5px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pome),var(--star));transition:width .5s}
.barlab{margin-top:7px;font-size:12px;color:var(--dim)}

.gh{margin:26px 0 10px;font-size:12px;color:var(--dim);letter-spacing:.5px}
.mod{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;color:var(--ink);font-size:15px;cursor:pointer}
.mod:active{transform:scale(.985)}
.mod .ic{font-size:22px;width:28px;text-align:center;flex:none}
.mod b{display:block;font-weight:600}
.mod small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.mod .dot{margin-left:auto;flex:none;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15)}
.mod.done .dot{background:var(--ok)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{background:none;border:none;color:var(--frost);font-size:15px;padding:4px 0;cursor:pointer}
.top h2{margin:0;font-size:16px;flex:1}
#t-body{padding:16px}

.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.blk h3{margin:0 0 8px;font-size:17px;color:var(--star)}
.blk p{margin:0 0 9px}.blk p:last-child{margin-bottom:0}
.blk ul{margin:6px 0 0;padding-left:19px}.blk li{margin-bottom:5px}
.lead{color:var(--dim);font-size:14px;margin:0 0 14px}
.q{border-left:3px solid var(--pome);padding:2px 0 2px 12px;margin:10px 0;
  font-family:Georgia,serif;font-style:italic}
.note{background:rgba(233,208,138,.11);border:1px solid rgba(233,208,138,.3);
  border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:10px}

.facts{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{background:var(--card);padding:11px 14px;display:flex;gap:12px}
.facts span{color:var(--dim);font-size:13px;flex:none;width:104px;padding-top:1px}
.facts b{font-weight:600;font-size:14.5px}

.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--pome),var(--star))}
.tl div{position:relative;margin-bottom:15px}
.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;
  border-radius:50%;background:var(--star);box-shadow:0 0 0 3px var(--bg)}
.tl b{color:var(--star);font-size:13px;display:block}

.ch{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}
.ch>button{width:100%;display:flex;gap:11px;align-items:center;background:none;border:none;
  color:var(--ink);padding:12px 14px;text-align:left;font-size:14.5px;cursor:pointer;font-family:inherit}
.ch .n{font-family:Georgia,serif;color:var(--pome);font-size:18px;width:26px;flex:none}
.ch .body{display:none;padding:0 14px 14px;font-size:14.5px}
.ch.open .body{display:block}
.ch .body .key{margin-top:9px;color:var(--ok);font-size:13.5px}

.per{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.per h4{margin:0;font-size:16px;font-family:Georgia,serif}
.per .role{color:var(--dim);font-size:12.5px;margin:2px 0 8px}
.per .tr{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.per .tr i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:20px;
  background:rgba(169,196,218,.16);color:var(--frost)}
.per .said{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--star)}

.btn{background:var(--pome);color:#fff;border:none;border-radius:11px;padding:12px 18px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.g{background:rgba(255,255,255,.09);color:var(--ink)}
.btn:active{opacity:.85}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;
  font-size:15px;cursor:pointer;font-family:inherit}
.opt.ok{border-color:var(--ok);background:rgba(121,191,160,.15)}
.opt.no{border-color:var(--no);background:rgba(217,115,124,.13)}
.opt:disabled{opacity:.75}
.say{margin:10px 0;padding:10px 12px;border-radius:11px;font-size:14.5px;display:none}
.say.on{display:block}
.say.y{background:rgba(121,191,160,.15);border:1px solid var(--ok)}
.say.n{background:rgba(217,115,124,.13);border:1px solid var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.used{opacity:.3;pointer-events:none}
.chip.ok{border-color:var(--ok)}.chip.no{border-color:var(--no)}
.slot{min-height:44px;border:1px dashed var(--line);border-radius:11px;padding:8px;
  margin:10px 0;font-size:14px;color:var(--dim)}
.prog{font-size:13px;color:var(--dim);margin-bottom:10px}

.sp{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.sp b{display:block;font-size:15px;margin-bottom:8px}
.sp .ans{display:none;font-size:14.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.sp.open .ans{display:block}
.sp button{background:rgba(255,255,255,.08);border:none;color:var(--frost);
  border-radius:9px;padding:8px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}

.lvl{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
  color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}
.lvl .ic{font-size:24px}
.lvl b{display:block;font-size:15px}
.lvl small{color:var(--dim);font-size:12.5px}
.lvl .sc{margin-left:auto;color:var(--star);font-size:13px;font-family:Georgia,serif}
.res{text-align:center;padding:20px 0}
.res .big{font-size:46px;font-family:Georgia,serif;color:var(--star)}
.res .st{font-size:26px;letter-spacing:4px;margin:6px 0 12px}
.wrongs{text-align:left;margin-top:18px}
.wrongs .w{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:9px;font-size:14px}
.wrongs .w em{color:var(--no);font-style:normal}
.wrongs .w s{color:var(--dim)}
</style>
</head>
<body>

<div id="s-home" class="scr on">
  <div class="hero">
    <div class="stars">
      <i style="top:30px;left:26px"></i><i style="top:62px;left:70px"></i>
      <i style="top:96px;left:30px"></i><i style="top:46px;left:120px"></i>
      <i style="top:112px;left:92px"></i><i style="top:22px;left:170px"></i>
    </div>
    <div class="fall"></div>
    <h1>Хлопчик-зірка</h1>
    <p class="by">Оскар Уайльд · переклад Ілька Корунця</p>
    <div class="meta">
      <span class="tag">літературна казка</span>
      <span class="tag">Англія</span>
      <span class="tag">про красу й серце</span>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="barlab" id="plab">Пройдено 0 з 13</div>
  </div>
  <div class="wrap" id="menu"></div>
</div>

<div id="s-tool" class="scr">
  <div class="top">
    <button class="back" onclick="home()">‹ Назад</button>
    <h2 id="t-title"></h2>
  </div>
  <div class="wrap"><div id="t-body"></div></div>
</div>

<script>
/* ============ ядро ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
let TIMERS=[];
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id}
function stopAll(){TIMERS.forEach(clearInterval);TIMERS=[]}
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG){TG.ready();TG.expand();try{TG.setHeaderColor('#101623')}catch(e){}}

const KEY='zirka-tvir-v1';
let PR={done:{},best:{}};
function load(cb){
  try{const l=localStorage.getItem(KEY);if(l)PR=Object.assign(PR,JSON.parse(l))}catch(e){}
  if(TG&&TG.CloudStorage){
    TG.CloudStorage.getItem(KEY,(err,val)=>{
      if(!err&&val){try{PR=Object.assign(PR,JSON.parse(val))}catch(e){}}
      cb();
    });
  } else cb();
}
function save(){
  const s=JSON.stringify(PR);
  try{localStorage.setItem(KEY,s)}catch(e){}
  if(TG&&TG.CloudStorage){try{TG.CloudStorage.setItem(KEY,s)}catch(e){}}
}
function mark(k){if(!PR.done[k]){PR.done[k]=1;save()}paint()}
function buzz(t){try{TG.HapticFeedback.notificationOccurred(t)}catch(e){}}
function say(sel,txt,ok){const e=$(sel);if(!e)return;e.className='say on '+(ok?'y':'n');e.innerHTML=txt}
function hide(sel){const e=$(sel);if(e)e.className='say'}

const GROUPS=['Про твір','Розібратися','Перевірити себе'];
const M={},ORDER=[];
function T(k,o){M[k]=o;ORDER.push(k)}

function paint(){
  $('#menu').innerHTML=GROUPS.map((g,gi)=>{
    const items=ORDER.filter(k=>M[k].g===gi).map(k=>{
      const m=M[k];
      return `<button class="mod ${PR.done[k]?'done':''}" onclick="open_('${k}')">
        <span class="ic">${m.ic}</span>
        <span><b>${m.t}</b><small>${m.s}</small></span>
        <span class="dot"></span></button>`;
    }).join('');
    return `<div class="gh">${g}</div>${items}`;
  }).join('');
  const n=ORDER.filter(k=>PR.done[k]).length;
  $('#pbar').style.width=Math.round(n/ORDER.length*100)+'%';
  $('#plab').textContent=`Пройдено ${n} з ${ORDER.length}`;
}
function open_(k){
  stopAll();
  const m=M[k];
  $('#t-title').textContent=m.t;
  $('#t-body').innerHTML=m.html;
  $('#s-home').classList.remove('on');
  $('#s-tool').classList.add('on');
  window.scrollTo(0,0);
  if(m.init)m.init();
  if(TG&&TG.BackButton){TG.BackButton.show();TG.BackButton.onClick(home)}
}
function home(){
  stopAll();
  $('#s-tool').classList.remove('on');
  $('#s-home').classList.add('on');
  window.scrollTo(0,0);
  if(TG&&TG.BackButton)TG.BackButton.hide();
  paint();
}
function done(k){mark(k);home()}
function fin(k){return `<button class="btn" style="width:100%;margin-top:6px" onclick="done('${k}')">Готово, зрозумів</button>`}
function toggle(el){el.parentNode.classList.toggle('open')}

/* ================= 1. ПАСПОРТ ================= */
T('passport',{g:0,ic:'📋',t:'Паспорт твору',s:'Те, що просять назвати першим',html:`
<p class="lead">Відповіді, з яких починається будь-яка усна відповідь на уроці.</p>
<div class="facts">
  <div><span>Автор</span><b>Оскар Уайльд, англійський письменник ірландського походження</b></div>
  <div><span>Роки життя</span><b>1854–1900</b></div>
  <div><span>Назва</span><b>«Хлопчик-зірка»</b></div>
  <div><span>Жанр</span><b>літературна казка</b></div>
  <div><span>Тема</span><b>історія гордого й жорстокого хлопчика, знайденого в лісі, який утратив красу, відрікшись від матері, і повернув її, навчившись співчувати</b></div>
  <div><span>Головна думка</span><b>справжня краса — не в обличчі, а в серці; людину змінює не покарання, а власне каяття й уміння віддати останнє іншому</b></div>
  <div><span>Головний герой</span><b>Хлопчик-зірка</b></div>
  <div><span>Інші герої</span><b>Лісоруб і його дружина, мати-жебрачка, прокажений, Чаклун, Зайченя, звірі лісу</b></div>
  <div><span>Композиція</span><b>дзеркальна: спершу він кривдить усіх, а потім тричі поспіль віддає останнє</b></div>
  <div><span>Головний засіб</span><b>антитеза — протиставлення краси й потворності, зовнішнього та внутрішнього</b></div>
  <div><span>Переклад</span><b>українською — Ілько Корунець</b></div>
  <div><span>Кому розказано</span><b>уперше — власним синам письменника</b></div>
</div>
<div class="note"><b>Про переклад.</b> Оригінал — це текст мовою, якою його написав автор; тут англійська. Переклад — той самий твір іншою мовою. У різних перекладах героя звуть то Хлопчик-зірка, то Дитя-зірка, а Лісоруба — Дроворубом. Це той самий персонаж.</div>
${fin('passport')}`});

/* ================= 2. АВТОР ================= */
T('author',{g:0,ic:'👤',t:'Автор',s:'Найбільший дотепник Британії',html:`
<p class="lead">Оскара Уайльда знали в Лондоні як людину з найгострішим язиком і найдивнішими костюмами. А казки він писав для власних синів.</p>

<div class="blk"><h3>Родина в Дубліні</h3>
<p>Народився 1854 року в Дубліні. Батько був відомим лікарем, який захоплювався ще й археологією та фольклором. Власним коштом він збудував невеличкий медпункт, де будь-хто міг отримати безкоштовну допомогу; згодом та амбулаторія стала лікарнею, яка працює донині. Від батька Оскар успадкував працелюбство й допитливість.</p>
<p>Мати була поеткою, захоплювалася мистецтвом і пишалася письменниками серед своїх родичів, тому будинок Уайльдів прикрашала сила-силенна картин і скульптур.</p></div>

<div class="blk"><h3>Оксфорд і слава</h3>
<p>Ще дитиною Оскар опанував німецьку та французьку мови. У школі був першим учнем, потім закінчив знаменитий Оксфордський університет і став журналістом. Мав гострий розум і оригінальний вигляд: його костюми обговорювали тижнями, а дотепні жарти повторювали і зарозумілі лондонські аристократи, і міська біднота.</p>
<div class="note">Англійці й нині вважають Оскара Уайльда найбільшим дотепником Великої Британії. Вистави за його п’єсами збирали повні зали, а книжки розходилися величезними накладами.</div></div>

<div class="blk"><h3>Казки для синів</h3>
<p>«Хлопчик-зірка» ввійшов до збірки казок Уайльда, а вигадував він ці історії передусім для власних дітей. Саме тому на уроці часто просять відповісти на питання: чого хотів навчити письменник своїх синів, розказуючи їм цю казку.</p></div>

<div class="blk"><h3>Оригінал і переклад</h3>
<p>Уайльд писав англійською — це оригінал. Українською «Хлопчика-зірку» переклав професор Ілько Корунець. Завдяки праці перекладачів твори різних народів промовляють до нас рідною мовою, тому й ім’я перекладача варто знати поряд з ім’ям автора.</p></div>
${fin('author')}`});

/* ================= 3. ІСТОРІЯ ================= */
T('history',{g:0,ic:'📜',t:'Як побудована казка',s:'Дзеркальна композиція',html:`
<p class="lead">Це найважливіше, що варто зрозуміти про цей твір: він складається з двох половин, які дзеркально відбивають одна одну.</p>

<div class="blk"><h3>Перша половина: він кривдить</h3>
<ul>
<li>Виколов очі Кротові.</li>
<li>Підрізав крила Коноплянці.</li>
<li>Убив матір Білочки.</li>
<li>Кидав камінцями в жебраків і сліпих.</li>
<li>Прогнав рідну матір і назвав її бридкою старчихою.</li>
</ul></div>

<div class="blk"><h3>Друга половина: йому повертають</h3>
<ul>
<li>Кріт не може показати дороги, бо не бачить.</li>
<li>Коноплянка не може злетіти, бо не має крил.</li>
<li>Білочка питає, чи не шукає він і її матір, щоб убити.</li>
<li>Люди в селах кидають у нього камінцями й женуть геть.</li>
<li>Три роки ніхто не жаліє його — бо це той світ, який він створив сам.</li>
</ul>
<div class="q">Це був такий світ, який він створив у дні своєї великої гордості.</div></div>

<div class="blk"><h3>Три випробування</h3>
<p>Далі йде класична казкова трійця: три золоті монети — біла, жовта й червона. І щоразу повторюється те саме: Зайченя допомагає знайти монету, прокажений просить її, хлопчик віддає, а Чаклун карає. Із третього разу покарання мало бути смертю.</p>
<div class="note">Ця будова називається триразовим повтором. Але важливо, що щоразу хлопчик робить складніший вибір: спершу ризикує побоями, потім рабством, потім життям.</div></div>
${fin('history')}`});

/* ================= 4. СЮЖЕТ ================= */

const COMP=[
 ['Лісоруби знаходять у снігу дитину й забирають додому','експозиція'],
 ['Хлопчик відрікається від матері й одразу стає потворним','зав’язка'],
 ['Три роки пошуків, рабство в Чаклуна, три монети','розвиток дії'],
 ['Він утретє віддає монету прокаженому, ризикуючи життям','кульмінація'],
 ['Краса повертається, він знаходить батьків і стає правителем','розв’язка']
];
const CNAMES=['експозиція','зав’язка','розвиток дії','кульмінація','розв’язка'];
function buildComp(){
  const box=$('#comp');if(!box)return;
  box.innerHTML=COMP.map((c,i)=>`<div style="margin:12px 0 16px">
    <div style="font-size:14.5px;margin-bottom:7px">${c[0]}</div>
    <div class="row" id="cr${i}">${CNAMES.map(n=>
      `<button class="chip" onclick="pickComp(${i},'${n}',this)">${n}</button>`).join('')}</div></div>`).join('');
}
function pickComp(i,n,el){
  const ok=COMP[i][1]===n;
  $$('#cr'+i+' .chip').forEach(b=>b.disabled=true);
  el.classList.add(ok?'ok':'no');
  if(!ok){$$('#cr'+i+' .chip').forEach(b=>{if(b.textContent===COMP[i][1])b.classList.add('ok')})}
  buzz(ok?'success':'error');
  if($$('#comp .chip.ok').length>=5)
    say('#cs','Зверни увагу: кульмінація — не повернення краси, а третя монета. Саме там він ризикує життям заради чужого.',true);
}

T('test',{g:2,ic:'🧠',t:'Тести',s:'Три рівні складності',html:`
<p class="lead">Легкий пояснює після кожної відповіді. Дуже складний мовчить до кінця, а тоді показує розбір помилок.</p>
<div id="lvls"></div>`,
init(){drawLv()}});

function drawLv(){
  const b=$('#lvls');if(!b)return;
  b.innerHTML=LV.map((l,i)=>{
    const s=PR.best[l[0]];
    return `<button class="lvl" onclick="startQ(${i})">
      <span class="ic">${l[1]}</span>
      <span><b>${l[2]}</b><small>${l[3]} · ${l[4].length} питань</small></span>
      <span class="sc">${s!=null?s+'%':''}</span></button>`;
  }).join('');
}
let QL=0,QI=0,QOK=0,QW=[];
function startQ(l){QL=l;QI=0;QOK=0;QW=[];drawQ()}
function drawQ(){
  const L=LV[QL],qs=L[4],b=$('#t-body');
  if(QI>=qs.length)return resQ();
  const q=qs[QI];
  const opts=(q[1]==='tf')
    ? ['Так','Ні'].map((o,i)=>`<button class="opt" onclick="ansQ(${i===0?1:0})">${o}</button>`).join('')
    : q[2].map((o,i)=>`<button class="opt" onclick="ansQ(${i})">${o}</button>`).join('');
  b.innerHTML=`<div class="prog">${L[1]} ${L[2]} · питання ${QI+1} з ${qs.length}</div>
    <div class="blk"><p style="font-size:16px;margin:0">${q[0]}</p></div>
    <div id="qo">${opts}</div><div class="say" id="qs"></div>`;
  window.scrollTo(0,0);
}
function ansQ(v){
  const q=LV[QL][4][QI];
  const right=q[3];
  const ok=(q[1]==='tf')?((v===1)===right):(v===right);
  const btns=$$('#qo .opt');
  btns.forEach(b=>b.disabled=true);
  if(q[1]==='tf'){
    btns[right?0:1].classList.add('ok');
    if(!ok)btns[v===1?0:1].classList.add('no');
  }else{
    btns[right].classList.add('ok');
    if(!ok)btns[v].classList.add('no');
  }
  if(ok)QOK++;else QW.push(q);
  buzz(ok?'success':'error');
  const last=QL===2;
  if(!last)say('#qs',(ok?'✔ ':'✘ ')+q[4],ok);
  setTimeout(()=>{QI++;drawQ()},last?450:1500);
}
function resQ(){
  const L=LV[QL],n=L[4].length;
  const pc=Math.round(QOK/n*100);
  const st=pc>=95?3:pc>=75?2:pc>=50?1:0;
  if(PR.best[L[0]]==null||pc>PR.best[L[0]]){PR.best[L[0]]=pc;save()}
  if(pc>=75)mark('test');
  let w='';
  if(QW.length&&QL===2){
    w='<div class="wrongs"><h3 style="font-family:Georgia,serif;color:var(--star)">Розбір помилок</h3>'+
      QW.map(q=>{const cor=(q[1]==='tf')?(q[3]?'Так':'Ні'):q[2][q[3]];
      return `<div class="w"><s>${q[0]}</s><br><em>Правильно: ${cor}</em><br>${q[4]}</div>`}).join('')+'</div>';
  }
  $('#t-body').innerHTML=`<div class="res">
    <div class="big">${pc}%</div>
    <div class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <div style="color:var(--dim)">Правильних ${QOK} з ${n}</div>
    <div style="margin-top:18px" class="row">
      <button class="btn" onclick="startQ(${QL})">Ще раз</button>
      <button class="btn g" onclick="open_('test')">До рівнів</button>
    </div>${w}</div>`;
  window.scrollTo(0,0);
  buzz(pc>=75?'success':'warning');
}
