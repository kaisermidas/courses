<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Історія руками</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9; --grid:#E8E5DA;
    --accent:#8B5E34; --accent-soft:#F2E9DE; --volt:#E9A800; --volt-soft:#FFF3D4;
    --ok:#1F9D63; --ok-soft:#E3F6EC; --bad:#D8433B; --bad-soft:#FCE9E7;
    --blue:#2F6FE4; --blue-soft:#E6EEFF; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.015em;margin:0}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  .app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 48px}
  .screen{display:none}.screen.on{display:block}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:32px}
  .back{color:var(--accent);font-weight:600}
  .bar h2{font-size:17px;flex:1;text-align:center}
  header.hero{margin:6px 0 20px}
  header.hero h1{font-size:31px;line-height:1.15}
  header.hero p{color:var(--ink-2);margin:8px 0 0;max-width:34em}
  .tool{display:flex;gap:14px;align-items:center;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}
  .tool .ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--accent-soft)}
  .tool .tx{flex:1;min-width:0}
  .tool b{display:block;font-size:16px}
  .tool span{color:var(--ink-2);font-size:13px}
  .tool .tick{color:var(--ok);font-weight:700;font-size:18px;opacity:0}
  .tool.done .tick{opacity:1}
  .grp{color:var(--ink-2);font-size:14px;margin:22px 0 8px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px}
  .task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
  .hintline{color:var(--ink-2);font-size:14px;margin-top:10px;min-height:1.4em}
  .verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
  .verdict.on{display:block}
  .verdict.good{background:var(--ok-soft);color:#14603E}
  .verdict.warn{background:var(--bad-soft);color:#8F2018}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .center{justify-content:center}
  .btn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:8px 12px;font-size:14px}
  .legend{color:var(--ink-2);font-size:14px;margin-top:10px}
  .big{font-size:26px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
  svg{display:block;max-width:100%;touch-action:none}
  input[type=text],input[type=number]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .chip{display:inline-block;background:#F4F2EC;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);margin-left:6px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-size:15px}
  .opt.good{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .sieve{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0}
  .sieve button{aspect-ratio:1;border-radius:7px;background:#F4F2EC;font-size:12px;font-weight:600;color:var(--ink)}
  .sieve button.out{background:#EFEDE6;color:#C4C0B4;text-decoration:line-through}
  .sieve button.prime{background:var(--accent-soft);color:#14603E}
  .sieve button.one{background:#fff;color:#C4C0B4;border:1px dashed var(--line)}
  .strip{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:10px 0}
  .strip div{aspect-ratio:1;border-radius:4px;background:#EFEDE6}
  .strip div.on{background:var(--accent)}
  .strip div.cut{background:var(--bad-soft)}
  .fracbar{height:44px;display:flex;gap:2px;margin:6px 0 2px}
  .fracbar i{flex:1;border-radius:5px;background:#EFEDE6}
  .fracbar i.on{background:var(--blue)}
  .fracbar.b i.on{background:var(--volt)}
  .grid8{display:grid;width:min(100%,320px);margin:0 auto;border:2px solid #C9C6BB;border-radius:6px;overflow:hidden}
  .grid8 button{aspect-ratio:1;border:0;background:#F6F3E9}
  .grid8 button.on{background:var(--accent);border:1px solid rgba(255,255,255,.35)}
  .pans{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:10px 0}
  .pan{flex:1;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:#FCFBF7}
  .xbox{width:38px;height:38px;border-radius:9px;background:var(--blue-soft);border:2px solid var(--blue);
    display:grid;place-items:center;font-weight:700;color:var(--blue)}
  .wt{width:26px;height:26px;border-radius:50%;background:#F4EBD0;border:2px solid var(--volt)}
  .hanoi{display:flex;justify-content:space-around;align-items:flex-end;height:150px;margin:10px 0}
  .peg{position:relative;width:31%;height:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;
    border-bottom:5px solid #8B8578;padding-bottom:0}
  .peg:before{content:'';position:absolute;bottom:0;width:6px;height:100%;background:#D8D3C4;border-radius:3px}
  .disk{height:20px;border-radius:6px;position:relative;z-index:1;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .peg.sel{background:rgba(31,122,90,.07);border-radius:10px}
  table.tt{border-collapse:collapse;width:100%;margin-top:10px;font-variant-numeric:tabular-nums}
  table.tt th,table.tt td{border:1px solid var(--line);padding:6px;text-align:center;font-size:15px}
  table.tt th{background:#F4F2EC;font-weight:600}
  .tl{position:relative;height:60px;margin:16px 0;background:#F4F2EC;border-radius:10px}
  .tl .ax{position:absolute;left:2%;right:2%;top:28px;height:3px;background:#C9C6BB}
  .tl .ev{position:absolute;top:14px;width:30px;height:30px;border-radius:50%;background:var(--accent);
    color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;transform:translateX(-15px)}
  .cards{display:grid;gap:8px;margin:10px 0}
  .card2{border:2px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff;text-align:left;font-size:15px}
  .card2.sel{border-color:var(--accent);background:var(--accent-soft)}
  .card2.ok{border-color:var(--ok);background:var(--ok-soft)}
  .card2.no{border-color:var(--bad);background:var(--bad-soft)}
  .slots{display:grid;gap:8px;margin:10px 0}
  .slot{border:2px dashed var(--line);border-radius:12px;padding:9px 12px;min-height:46px;font-size:14px;color:var(--ink-2)}
  .slot b{color:var(--ink)}
  .dig{display:flex;flex-direction:column-reverse;gap:3px;margin:10px 0}
  .layer{border-radius:8px;padding:12px;color:#fff;font-size:14px;text-align:center;cursor:pointer;position:relative}
  .layer.hid{background:#B7A98F!important;color:#8B7B5E}
  .word{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .word button{min-width:34px;height:46px;border-radius:9px;background:#F4F2EC;font-size:20px;font-weight:600}
  .word button.pick{background:var(--accent);color:#fff}
  .word button.gap{min-width:16px;background:transparent;color:var(--ink-2);font-size:22px}
  .word button.gap.on{background:var(--volt);color:#fff;border-radius:6px}
  .trans{font-size:24px;text-align:center;letter-spacing:.06em;margin:10px 0;font-weight:600}
  .sent{font-size:18px;line-height:2.4;text-align:center;margin:12px 0}
  .sent span{padding:2px 1px}
  .sent .g{display:inline-block;width:16px;color:#C4C0B4;cursor:pointer;font-weight:700}
  .sent .g.on{color:var(--bad);font-size:22px}
  .sent .w{cursor:pointer;border-radius:5px;padding:2px 4px}
  .sent .w.subj{background:#DCE9FF;box-shadow:inset 0 -3px 0 #2F6FE4}
  .sent .w.pred{background:#E3F6EC;box-shadow:inset 0 -3px 0 #1F9D63}
  .morph{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .morph div{border-radius:8px;padding:8px 10px;font-size:19px;font-weight:600;text-align:center}
  .morph small{display:block;font-size:11px;font-weight:400;color:var(--ink-2);margin-top:2px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .pair button{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:14px;text-align:left}
  .pair button.sel{border-color:var(--accent);background:var(--accent-soft)}
  .pair button.ok{border-color:var(--ok);background:var(--ok-soft)}
  .bits{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
  .bit{width:44px;text-align:center}
  .bit button{width:44px;height:52px;border-radius:10px;background:#EFEDE6;font-size:22px;font-weight:700;color:#B9B5A8}
  .bit button.on{background:var(--accent);color:#fff}
  .bit span{display:block;font-size:11px;color:var(--ink-2);margin-top:3px}
  .pix{display:grid;width:min(100%,270px);margin:0 auto;gap:1px;background:#D8D3C4;border:2px solid #C9C6BB;border-radius:6px;overflow:hidden}
  .pix button{aspect-ratio:1;border:0;background:#fff}
  .pix button.on{background:#1E2A3A}
  .rgrid{display:grid;width:min(100%,300px);margin:0 auto;gap:2px}
  .rgrid div{aspect-ratio:1;border-radius:4px;background:#F4F2EC;display:grid;place-items:center;font-size:15px}
  .rgrid div.rob{background:var(--accent-soft)}
  .rgrid div.goal{background:#FFF3D4}
  .rgrid div.wall{background:#8B8578}
  .prog{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin:10px 0}
  .cmd{background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600}
  .cmd.now{background:var(--volt-soft);border-color:var(--volt)}
  .bars{display:flex;align-items:flex-end;gap:4px;height:130px;justify-content:center}
  .bars div{flex:1;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;transition:height .2s}
  .bars div.cmp{background:var(--volt)}
  .bars div.done{background:var(--ok)}
  .tree{font-size:15px;line-height:1.8}
  .tree button{text-align:left}
  .tree .fold{color:var(--accent);font-weight:600}
  .mail{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font-size:15px;line-height:1.7}
  .mail mark{background:#FFF3D4;border-radius:4px;padding:1px 3px;cursor:pointer}
  .mail mark.hit{background:var(--ok-soft);outline:2px solid var(--ok)}
  .planet{cursor:pointer}
  .molec{position:relative;height:150px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#F7FAFF}
  .mol{position:absolute;width:13px;height:13px;border-radius:50%;background:#2F6FE4}
  .tank{height:170px;border:3px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;position:relative;overflow:hidden;background:#EAF4FF}
  .tank .surf{position:absolute;left:0;right:0;top:38%;height:2px;background:#5AA9EE}
  .item{position:absolute;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;transition:top .5s ease}
  .kbox{border:2px dashed var(--line);border-radius:12px;min-height:64px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .kcard{border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;font-size:14px}
  .kcard.sel{border-color:var(--accent);background:var(--accent-soft)}
  .pyr{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
  .lvl{border-radius:10px;padding:9px 14px;font-weight:600;color:#fff;text-align:center;transition:opacity .3s}
  .lvl.dead{opacity:.25;text-decoration:line-through}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<section id="s-home" class="screen on">
  <header class="hero">
    <h1>Історія руками</h1>
    <p>Чотирнадцять приладів. Час і простір стають зрозумілими, коли їх можна посунути рукою.</p>
  </header>
  <div id="home-list"></div>
</section>
<section id="s-tool" class="screen">
  <div class="bar"><button class="back" onclick="go('s-home')">‹ Прилади</button><h2 id="t-title"></h2><span style="width:64px"></span></div>
  <div id="t-body"></div>
</section>
</div>
<script>
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const tg = window.Telegram && window.Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
let PR = {};
const KEY='istoriya-lab-v1';
try { PR = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){}
if (tg && tg.CloudStorage) tg.CloudStorage.getItem(KEY,(e,v)=>{ if(!e&&v){ try{PR=Object.assign(PR,JSON.parse(v));homeDraw();}catch(_){}}});
function saveP(){ try{localStorage.setItem(KEY,JSON.stringify(PR));}catch(e){}
  if(tg && tg.CloudStorage) tg.CloudStorage.setItem(KEY,JSON.stringify(PR),()=>{}); }
function mark(k){ if(!PR[k]){ PR[k]=1; saveP(); homeDraw(); } }
function go(id){ if(id==='s-home')stopAll(); $$('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0); }
function say(sel,text,good){ const e=$(sel); if(!e)return; e.className='verdict on '+(good?'good':'warn'); e.innerHTML=text; }
function hide(sel){ const e=$(sel); if(e) e.className='verdict'; }
const gcd=(a,b)=>b?gcd(b,a%b):a;
const GROUPS=['Лічба часу','Простір і карта','Джерела','Люди й держава'];
const TOOLS={};
function T(key,o){ TOOLS[key]=o; }
let TIMERS=[];
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id;}
function stopAll(){TIMERS.forEach(clearInterval);TIMERS=[];}

/* --- 1. Стрічка часу --- */
T('tl',{g:0,ic:'📜',t:'Стрічка часу',s:'Розстав події за порядком',html:`
<div class="panel">
  <div class="task" id="tl-task"></div>
  <div class="tl" id="tl-line"><div class="ax"></div></div>
  <div class="cards" id="tl-cards"></div>
  <div class="row center"><button class="btn" onclick="tlCheck()">Перевірити порядок</button>
    <button class="btn ghost" onclick="tlLoad()">Заново</button></div>
  <div class="verdict" id="tl-v"></div>
  <div class="legend">Стрічка часу йде зліва направо: що лівіше — те давніше. Однакові відрізки на ній — однакова кількість років.</div>
</div>`,init(){tlI=0;tlOk=0;tlLoad();}});
const tlSets=[
 [['Заснування Києва','бл. 482'],['Хрещення Русі','988'],['«Руська правда»','1036'],['Перша згадка «Україна»','1187']],
 [['Битва під Берестечком','1651'],['Заснування Січі','бл. 1556'],['Гетьман Хмельницький починає війну','1648'],['Зруйнування Січі','1775']],
 [['Проголошення УНР','1917'],['Голодомор','1932'],['Незалежність України','1991'],['Революція Гідності','2014']]];
let tlI=0,tlOk=0,tlOrder=[],tlSel=null;
function tlLoad(){const set=tlSets[tlI];tlOrder=set.map((_,i)=>i).sort(()=>Math.random()-.5);tlSel=null;hide('#tl-v');tlDraw();}
function tlDraw(){if(!document.querySelector('#tl-cards'))return;const set=tlSets[tlI];
  $('#tl-task').innerHTML='Розстав <b>'+set.length+'</b> події від найдавнішої до найновішої: тисни на дві картки, щоб поміняти їх місцями.<span class="chip">'+tlOk+' з 3</span>';
  const box=$('#tl-cards');box.innerHTML='';
  tlOrder.forEach((idx,pos)=>{const b=document.createElement('button');
    b.className='card2'+(tlSel===pos?' sel':'');
    b.innerHTML='<b>'+(pos+1)+'.</b> '+set[idx][0];
    (function(k){b.onclick=()=>{if(tlSel===null){tlSel=k;}else{const t=tlOrder[tlSel];tlOrder[tlSel]=tlOrder[k];tlOrder[k]=t;tlSel=null;}tlDraw();};})(pos);
    box.appendChild(b);});
  const line=$('#tl-line');line.innerHTML='<div class="ax"></div>';
  tlOrder.forEach((idx,pos)=>{const d=document.createElement('div');d.className='ev';
    d.style.left=(6+pos*(88/(set.length-1)))+'%';d.textContent=pos+1;line.appendChild(d);});}
function tlCheck(){const set=tlSets[tlI];
  const ok=tlOrder.every((v,i)=>v===i);
  if(ok){tlOk++;if(tlOk>=3)mark('tl');
    say('#tl-v','Правильно: '+set.map(e=>e[0]+' ('+e[1]+')').join(' → ')+'.',true);}
  else say('#tl-v','Порядок ще не той. Підказка: перша подія — '+set[0][0]+'.',false);}
function tlNext(){tlI=(tlI+1)%tlSets.length;tlLoad();}

/* --- 2. Рік і століття --- */
T('cent',{g:0,ic:'🔢',t:'Рік і століття',s:'Чому 1700 — це XVII',html:`
<div class="panel">
  <div class="task">Пересувай рік — і дивись, до якого століття він належить. Зверни увагу на роки, що закінчуються на 00.</div>
  <div class="big" id="ce-year"></div>
  <input type="range" min="1" max="2026" value="988" id="ce-r" oninput="ceDraw()">
  <div class="big" id="ce-cent" style="color:var(--accent)"></div>
  <div class="hintline" id="ce-state"></div>
  <div class="row center" style="margin-top:10px"><input type="number" id="ce-in" style="width:130px;text-align:center" placeholder="століття для 1700">
    <button class="btn small" onclick="ceCheck()">Перевірити</button></div>
  <div class="verdict" id="ce-v"></div>
  <div class="legend">Століття рахують від одиниці: перше — це роки 1–100. Тому 1700 рік — останній рік XVII століття, а XVIII починається з 1701.</div>
</div>`,init(){ceDraw();}});
const ROM=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
function toRoman(n){let s='';ROM.forEach(([v,r])=>{while(n>=v){s+=r;n-=v;}});return s;}
function ceDraw(){if(!document.querySelector('#ce-r'))return;const y=+$('#ce-r').value,c=Math.ceil(y/100);
  $('#ce-year').textContent=y+' рік';
  $('#ce-cent').textContent=toRoman(c)+' століття';
  const last=y%100===0;
  $('#ce-state').textContent=last?'Рік закінчується на 00 — це ОСТАННІЙ рік свого століття.'
    :'Століття '+c+' охоплює роки '+((c-1)*100+1)+'–'+(c*100)+'.';}
function ceCheck(){const v=+$('#ce-in').value;
  if(v===17){mark('cent');say('#ce-v','Так, 1700 — це XVII століття, а не XVIII. Століття закінчується роком, кратним 100.',true);}
  else say('#ce-v','Ще ні. Постав повзунок на 1700 і подивись, що покаже прилад.',false);}

/* --- 3. Римські цифри --- */
T('roman',{g:0,ic:'Ⅻ',t:'Римські цифри',s:'Як читати дати на пам’ятниках',html:`
<div class="panel">
  <div class="task">Пересувай число — і дивись, як воно виглядає по-римськи.</div>
  <div class="big" id="rm-n"></div>
  <input type="range" min="1" max="2026" value="49" id="rm-r" oninput="rmDraw()">

 {n:'Трипільська культура',c:'#8B6B4A',y:'бл. 4000 до н.е.',f:'Розписана кераміка, глиняні фігурки, залишки хат.'}];

T('family',{g:3,ic:'🌳',t:'Родовід',s:'Ким тобі доводиться…',html:`
<div class="panel">
  <div class="task">Тисни на людину в дереві — і подивись, ким вона тобі доводиться.</div>
  <svg viewBox="0 0 320 210" height="205" id="fm-svg"></svg>

const FM=[{n:'прадід',x:80,y:24,r:'Батько твого діда. Народився приблизно за 75 років до тебе — це вже інша епоха.'},
 {n:'прабабуся',x:150,y:24,r:'Мати твого діда або баби.'},
 {n:'дідусь',x:70,y:82,r:'Батько твого тата або мами.'},
 {n:'бабуся',x:140,y:82,r:'Мати твого тата або мами.'},
 {n:'тато',x:104,y:140,r:'Твій батько — перше покоління вгору.'},
 {n:'мама',x:196,y:140,r:'Твоя мати.'},
 {n:'ти',x:150,y:190,r:'Це ти. Далі рід продовжується вниз.'},
 {n:'дядько',x:246,y:82,r:'Брат твого тата або мами. Його діти — твої двоюрідні брати й сестри.'},
 {n:'двоюрідний брат',x:262,y:140,r:'Син твого дядька або тітки. Спільні в вас — дід і баба.'}];
let fmSeen={};
function fmDraw(){let s='';
  const link=(a,b)=>{s+='<line x1="'+FM[a].x+'" y1="'+(FM[a].y+13)+'" x2="'+FM[b].x+'" y2="'+(FM[b].y-13)+'" stroke="#C9C6BB" stroke-width="2"/>';};
  link(0,2);link(1,2);link(0,7);link(2,4);link(3,4);link(4,6);link(5,6);link(7,8);
  FM.forEach((p,i)=>{s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="13" fill="'+(p.n==='ти'?'#8B5E34':fmSeen[i]?'#F2E9DE':'#fff')+'" stroke="#8B5E34" stroke-width="2" style="cursor:pointer" onclick="fmPick('+i+')"/>'+
    '<text x="'+p.x+'" y="'+(p.y+29)+'" text-anchor="middle" font-size="9" fill="#5B6779">'+p.n+'</text>';});
  $('#fm-svg').innerHTML=s;}
function fmPick(i){fmSeen[i]=1;$('#fm-info').innerHTML='<b>'+FM[i].n+'</b> — '+FM[i].r;fmDraw();
  if(Object.keys(fmSeen).length>=5)mark('family');}
function fmAsk(){say('#fm-v','Скільки в тебе прапрадідів і прапрабабусь разом? Відповідь: <b>16</b> — на кожне покоління вгору кількість предків подвоюється: 2 батьки, 4 діди й баби, 8 прадідів, 16 прапрадідів.',true);mark('family');}

T('power',{g:3,ic:'⚖️',t:'Три гілки влади',s:'Хто що робить у державі',html:`
<div class="panel">
  <div class="task" id="pw-task">Обери повноваження, потім гілку влади, якій воно належить.</div>

</div>`,init(){pwInit();}});
const PW=[{n:'ухвалює закони',k:0},{n:'обирається народом на 5 років',k:0},
 {n:'керує міністерствами',k:1},{n:'виконує закони й стежить за господарством',k:1},
 {n:'розглядає спори між людьми',k:2},{n:'вирішує, чи винна людина',k:2},
 {n:'ухвалює державний бюджет',k:0},{n:'призначає стипендії та виплати',k:1},
 {n:'скасовує незаконне рішення чиновника',k:2}];
const PWN=['Верховна Рада (законодавча)','Уряд (виконавча)','Суди (судова)'];
let pwSel=-1,pwOk=0,pwLeft=[];
function pwInit(){pwSel=-1;pwOk=0;pwLeft=PW.map((_,i)=>i);hide('#pw-v');
  $('#pw-btns').innerHTML=PWN.map((n,i)=>'<button class="btn ghost small" onclick="pwPut('+i+')">'+n+'</button>').join('');
  pwDraw();}
function pwDraw(){const box=$('#pw-pool');box.innerHTML='';
  pwLeft.forEach(i=>{const b=document.createElement('button');b.className='card2'+(pwSel===i?' sel':'');
    b.textContent=PW[i].n;(function(k){b.onclick=()=>{pwSel=k;pwDraw();};})(i);box.appendChild(b);});
  $('#pw-task').innerHTML='Обери повноваження, потім гілку влади.<span class="chip">'+pwOk+' з '+PW.length+'</span>';}
function pwPut(k){if(pwSel<0)return say('#pw-v','Спершу обери повноваження.',false);
  if(PW[pwSel].k===k){pwOk++;pwLeft=pwLeft.filter(i=>i!==pwSel);pwSel=-1;hide('#pw-v');pwDraw();
    if(!pwLeft.length){mark('power');say('#pw-v','Розподілено правильно. Саме такий поділ записано в Конституції України 1996 року.',true);}}
  else say('#pw-v','Ні, це повноваження іншої гілки. Хто пише правила, хто їх виконує, а хто судить?',false);}

/* ================= головна ================= */
function homeDraw(){
  const list=$('#home-list');if(!list)return;list.innerHTML='';
  GROUPS.forEach((g,gi)=>{
    const keys=Object.keys(TOOLS).filter(k=>TOOLS[k].g===gi);
    if(!keys.length)return;
    const done=keys.filter(k=>PR[k]).length;
    const h=document.createElement('div');h.className='grp';
    h.textContent=g+(done?'  ·  освоєно '+done+' з '+keys.length:'');list.appendChild(h);
    keys.forEach(k=>{const t=TOOLS[k],b=document.createElement('button');
      b.className='tool'+(PR[k]?' done':'');
      b.innerHTML='<div class="ic">'+t.ic+'</div><div class="tx"><b>'+t.t+'</b><span>'+t.s+'</span></div><div class="tick">✓</div>';
      b.onclick=()=>openTool(k);list.appendChild(b);});
  });
}
function openTool(k){stopAll();const t=TOOLS[k];$('#t-title').textContent=t.t;$('#t-body').innerHTML=t.html;
  go('s-tool');try{t.init();}catch(e){console.error(e);}}
homeDraw();
