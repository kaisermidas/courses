<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Логіка руками</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9; --grid:#E8E5DA;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --volt:#E9A800; --volt-soft:#FFF3D4;
    --ok:#1F9D63; --ok-soft:#E3F6EC; --bad:#D8433B; --bad-soft:#FCE9E7; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.015em;margin:0}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  .app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 48px}
  .screen{display:none}.screen.on{display:block}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:32px}
  .back{color:var(--accent);font-weight:600}
  .bar h2{font-size:17px;flex:1;text-align:center}
  header.hero{margin:6px 0 20px}
  header.hero h1{font-size:31px;line-height:1.15}
  header.hero p{color:var(--ink-2);margin:8px 0 0;max-width:34em}
  .tool{display:flex;gap:14px;align-items:center;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}
  .tool .ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--accent-soft)}
  .tool .tx{flex:1;min-width:0}
  .tool b{display:block;font-size:16px}
  .tool span{color:var(--ink-2);font-size:13px}
  .tool .tick{color:var(--ok);font-weight:700;font-size:18px;opacity:0}
  .tool.done .tick{opacity:1}
  .grp{color:var(--ink-2);font-size:14px;margin:22px 0 8px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px}
  .task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
  .hintline{color:var(--ink-2);font-size:14px;margin-top:10px;min-height:1.4em}
  .verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
  .verdict.on{display:block}
  .verdict.good{background:var(--ok-soft);color:#14603E}
  .verdict.warn{background:var(--bad-soft);color:#8F2018}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .center{justify-content:center}
  .btn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:8px 12px;font-size:14px}
  .legend{color:var(--ink-2);font-size:14px;margin-top:10px}
  svg{display:block;max-width:100%;touch-action:none}
  .wire{stroke:#C9C6BB;stroke-width:5;fill:none}
  .wire.hot{stroke:var(--volt)}
  .sw{cursor:pointer}
  table.tt{border-collapse:collapse;width:100%;margin-top:12px;font-variant-numeric:tabular-nums}
  table.tt th,table.tt td{border:1px solid var(--line);padding:6px;text-align:center;font-size:15px}
  table.tt th{background:#F4F2EC;font-weight:600}
  table.tt tr.now td{background:var(--volt-soft)}
  table.tt td.q{color:#B9B5A8}
  .jugs{display:flex;gap:26px;justify-content:center;align-items:flex-end;margin:6px 0 14px}
  .jug{width:92px;text-align:center}
  .glass{border:3px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;display:flex;flex-direction:column-reverse;overflow:hidden;background:#fff}
  .water{background:linear-gradient(#9CCBF5,#5AA9EE);transition:height .3s ease}
  .jug b{display:block;margin-top:7px;font-size:19px}
  .jug span{color:var(--ink-2);font-size:13px}
  .coins{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0}
  .coin{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#F7F3E4;font-weight:600;display:grid;place-items:center}
  .coin.l{border-color:var(--accent);background:var(--accent-soft)}
  .coin.r{border-color:var(--volt);background:var(--volt-soft)}
  .board{display:grid;width:min(100%,330px);margin:0 auto;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
  .cell{aspect-ratio:1;display:grid;place-items:center;font-size:11px;border:0}
  .cell.dark{background:#D8D3C4}.cell.light{background:#F6F3E9}
  .cell.gone{background:repeating-linear-gradient(45deg,#EFEDE6,#EFEDE6 4px,#E3E1D9 4px,#E3E1D9 8px)}
  .cell.sel{outline:3px solid var(--accent);outline-offset:-3px}
  .cell.dom{background:#5AA9EE}
  .counts{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:15px;flex-wrap:wrap}
  .msq{display:grid;grid-template-columns:repeat(4,58px);gap:6px;justify-content:center;margin:8px auto}
  .msq input{width:58px;height:58px;text-align:center;font:600 21px/1 inherit;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .msq input:disabled{background:#F4F2EC;color:var(--ink-2)}
  .msq .sum{width:58px;height:58px;display:grid;place-items:center;font-weight:600;color:var(--ink-2);border:2px dashed var(--line);border-radius:12px;font-size:17px}
  .msq .sum.ok{color:#14603E;border-color:var(--ok);background:var(--ok-soft)}
  .msq .sum.bad{color:#8F2018;border-color:var(--bad)}
  .socks{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0;min-height:50px}
  .sock{width:32px;height:44px;border-radius:8px 8px 14px 14px;border:2px solid rgba(0,0,0,.12)}
  .cipher-out{background:#F4F2EC;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:17px;letter-spacing:.05em;min-height:3em;word-break:break-word}
  input[type=text],input[type=number]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .mach{display:flex;flex-direction:column;gap:7px;align-items:center;margin:10px 0}
  .op{background:#F4F2EC;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600;text-align:center}
  .op.now{background:var(--volt-soft);border-color:var(--volt)}
  .val{font-size:26px;font-weight:700}
  .arrow{color:var(--ink-2)}
  .who{display:flex;flex-direction:column;gap:8px}
  .who .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
  .who-b{border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600;border:2px solid var(--line);background:#fff;white-space:nowrap}
  .who-b.k{border-color:var(--accent);background:var(--accent-soft)}
  .who-b.l{border-color:var(--bad);background:var(--bad-soft)}
  .lgrid{border-collapse:collapse;margin:6px auto}
  .lgrid td,.lgrid th{border:1px solid var(--line);padding:0;text-align:center;font-size:13px}
  .lgrid th{background:#F4F2EC;padding:6px 8px;font-weight:600}
  .lgrid td button{width:46px;height:40px;font-size:18px;font-weight:700}
  .lgrid td button.yes{background:var(--ok-soft);color:#14603E}
  .lgrid td button.no{background:var(--bad-soft);color:#8F2018}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-size:15px}
  .opt.good{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .chip{display:inline-block;background:#F4F2EC;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);margin-left:6px}
  .nets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .net{border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff}
  .net.pick{border-color:var(--accent);background:var(--accent-soft)}
  .net.good{border-color:var(--ok);background:var(--ok-soft)}
  .net.bad{border-color:var(--bad);background:var(--bad-soft)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<section id="s-home" class="screen on">
  <header class="hero">
    <h1>Логіка руками</h1>
    <p>Двадцять два прилади. Кожен показує один закон логіки так, щоб його було видно, а не вивчено напам'ять.</p>
  </header>
  <div class="panel" style="padding:13px 15px">
    <div style="display:flex;align-items:center;gap:14px">
      <svg viewBox="0 0 150 70" width="140" height="66" aria-hidden="true">
        <path class="wire" d="M8 35 H40"/><path class="wire" id="tw1" d="M40 35 H78"/>
        <path class="wire" id="tw2" d="M78 35 H108"/>
        <circle id="tlamp" cx="126" cy="35" r="15" fill="#EFEDE6" stroke="#C9C6BB" stroke-width="3"/>
        <g id="tsw" class="sw"><circle cx="59" cy="35" r="13" fill="#fff" stroke="#1E2A3A" stroke-width="3"/>
          <line id="tline" x1="52" y1="41" x2="66" y2="29" stroke="#1E2A3A" stroke-width="4" stroke-linecap="round"/></g>
      </svg>
      <div style="font-size:15px;color:var(--ink-2)">Натисни вимикач.<br>Це і є «істина» й «хиба».</div>
    </div>
  </div>
  <div id="home-list"></div>
</section>
<section id="s-tool" class="screen">
  <div class="bar"><button class="back" onclick="go('s-home')">‹ Прилади</button><h2 id="t-title"></h2><span style="width:64px"></span></div>
  <div id="t-body"></div>
</section>
</div>
<script>
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const tg = window.Telegram && window.Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
let PR = {};
const KEY='logic-lab-v2';
try { PR = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){}
if (tg && tg.CloudStorage) tg.CloudStorage.getItem(KEY,(e,v)=>{ if(!e&&v){ try{PR=Object.assign(PR,JSON.parse(v));homeDraw();}catch(_){}}});
function saveP(){ try{localStorage.setItem(KEY,JSON.stringify(PR));}catch(e){}
  if(tg && tg.CloudStorage) tg.CloudStorage.setItem(KEY,JSON.stringify(PR),()=>{}); }
function mark(k){ if(!PR[k]){ PR[k]=1; saveP(); homeDraw(); } }
function go(id){ $$('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0); }
function say(sel,text,good){ const e=$(sel); if(!e)return; e.className='verdict on '+(good?'good':'warn'); e.innerHTML=text; }
function hide(sel){ const e=$(sel); if(e) e.className='verdict'; }
const rnd = a => a[Math.floor(Math.random()*a.length)];
let teaser=false;
$('#tsw').onclick=()=>{ teaser=!teaser; $('#tline').setAttribute('y2',teaser?35:29);
  $('#tw1').classList.toggle('hot',teaser); $('#tw2').classList.toggle('hot',teaser);
  $('#tlamp').setAttribute('fill',teaser?'#FFD84D':'#EFEDE6');
  $('#tlamp').setAttribute('stroke',teaser?'#E9A800':'#C9C6BB'); };
const GROUPS=['Тижні 1–8 · Логіка як наука','Тижні 9–16 · Числа й нестандартні задачі',
  'Тижні 17–25 · Геометрія навколо нас','Тижні 26–35 · Закономірності й підсумок'];
const TOOLS={};
function T(key,o){ TOOLS[key]=o; }

/* --- 1. Кола понять --- */
T('euler',{g:0,ic:'⭕️',t:'Кола понять',s:'Тижд. 1 · обсяг, рід і вид, перетин',html:`
<div class="panel">
  <div class="task" id="eu-task"></div>
  <svg viewBox="0 0 340 240" height="230" id="eu-svg">
    <circle id="eu-a" cx="130" cy="120" r="72" fill="rgba(47,111,228,.18)" stroke="#2F6FE4" stroke-width="2.5"/>
    <circle id="eu-b" cx="215" cy="120" r="46" fill="rgba(233,168,0,.20)" stroke="#E9A800" stroke-width="2.5"/>
    <text id="eu-la" x="130" y="126" text-anchor="middle" font-size="15" font-weight="600"></text>
    <text id="eu-lb" x="215" y="126" text-anchor="middle" font-size="14" font-weight="600"></text></svg>
  <div class="hintline" id="eu-state"></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="euCheck()">Перевірити</button>
    <button class="btn ghost" onclick="euNext()">Інша пара</button></div>
  <div class="verdict" id="eu-v"></div>
  <div class="legend">Тягни менше коло. Усередині — рід і вид. Краї заходять — перетин. Нарізно — несумісні.</div>
</div>`,init(){euI=0;euSolved=0;euDraw();euDrag();}});
const euPairs=[
 {a:'тварини',b:'коти',w:'in',ask:'Покажи: <b>кожен кіт — тварина</b>.'},
 {a:'учні',b:'спортсмени',w:'cross',ask:'Покажи: <b>деякі учні — спортсмени</b>.'},
 {a:'парні',b:'непарні',w:'out',ask:'Покажи: <b>жодне парне число не є непарним</b>.'},
 {a:'меблі',b:'стільці',w:'in',ask:'Покажи: <b>стілець — це меблі</b>.'},
 {a:'птахи',b:'літають',w:'cross',ask:'Покажи: <b>деякі птахи літають, але не всі</b>.'},
 {a:'квадрати',b:'кола',w:'out',ask:'Покажи: <b>жоден квадрат не є колом</b>.'},
 {a:'числа',b:'прості',w:'in',ask:'Покажи: <b>просте число — це число</b>.'}];
let euI=0,euSolved=0;
const euName={in:'менше коло всередині — рід і вид',cross:'кола перетинаються — спільна частина',out:'кола нарізно — несумісні'};
function euRel(){const A=$('#eu-a'),B=$('#eu-b');
  const d=Math.hypot(+B.getAttribute('cx')-+A.getAttribute('cx'),+B.getAttribute('cy')-+A.getAttribute('cy'));
  const ra=+A.getAttribute('r'),rb=+B.getAttribute('r');
  if(d+rb<=ra+2)return 'in'; if(d>=ra+rb-2)return 'out'; return 'cross';}
function euDraw(){const p=euPairs[euI];$('#eu-la').textContent=p.a;$('#eu-lb').textContent=p.b;
  $('#eu-task').innerHTML=p.ask+'<span class="chip">'+euSolved+' з 4</span>';
  $('#eu-state').textContent='Зараз: '+euName[euRel()];}
function euNext(){euI=(euI+1)%euPairs.length;$('#eu-b').setAttribute('cx',215);$('#eu-b').setAttribute('cy',120);
  $('#eu-lb').setAttribute('x',215);$('#eu-lb').setAttribute('y',126);hide('#eu-v');euDraw();}
function euCheck(){const p=euPairs[euI],r=euRel();
  if(r===p.w){euSolved++;euDraw();say('#eu-v','Так. '+euName[r][0].toUpperCase()+euName[r].slice(1)+'.',true);
    if(euSolved>=4){mark('euler');say('#eu-v','Чотири з чотирьох — прилад освоєно.',true);}}
  else say('#eu-v','Ще ні. Зараз '+euName[r]+', а потрібне інше.',false);}
function euDrag(){const svg=$('#eu-svg'),B=$('#eu-b'),L=$('#eu-lb');if(!svg)return;let on=false;
  const pt=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*340,y:(e.clientY-r.top)/r.height*240};};
  B.addEventListener('pointerdown',e=>{on=true;B.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!on)return;e.preventDefault();const p=pt(e);
    const x=Math.max(46,Math.min(294,p.x)),y=Math.max(46,Math.min(194,p.y));
    B.setAttribute('cx',x);B.setAttribute('cy',y);L.setAttribute('x',x);L.setAttribute('y',y+6);
    $('#eu-state').textContent='Зараз: '+euName[euRel()];});
  svg.addEventListener('pointerup',()=>on=false);svg.addEventListener('pointercancel',()=>on=false);}

/* --- 2. Усі, деякі, жоден --- */
T('quant',{g:0,ic:'🚦',t:'Усі, деякі, жоден',s:'Тижд. 2 · істинність і заперечення',html:`
<div class="panel">
  <div class="task" id="q-task"></div>
  <div class="row center" style="gap:9px;margin:6px 0 14px" id="q-figs"></div>
  <div style="display:grid;gap:7px"><div class="op" id="q-s1"></div><div class="op" id="q-s2"></div><div class="op" id="q-s3"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="qCheck()">Перевірити</button>
    <button class="btn ghost" onclick="qNext()">Інше завдання</button></div>
  <div class="verdict" id="q-v"></div>
  <div class="legend">Щоб спростувати «усі», досить однієї фігури іншого кольору — це контрприклад.</div>
</div>`,init(){qI=0;qOk=0;figs=[1,1,1,1,1,1];qDraw();}});
const qTasks=[
 {ask:'Зроби так, щоб «усі сині» стало <b>хибним</b>, а «деякі сині» лишилось істинним.',ok:b=>b>0&&b<6},
 {ask:'Зроби так, щоб «жодна не синя» стало <b>істинним</b>.',ok:b=>b===0},
 {ask:'Зроби так, щоб синіх було <b>рівно дві</b>.',ok:b=>b===2},
 {ask:'Поверни все так, щоб «усі фігури сині» стало <b>істинним</b>.',ok:b=>b===6}];
let figs=[1,1,1,1,1,1],qI=0,qOk=0;
function qDraw(){const box=$('#q-figs');box.innerHTML='';
  figs.forEach((v,i)=>{const b=document.createElement('button');
    b.style.cssText='width:42px;height:42px;border-radius:12px;border:2px solid '+(v?'#2F6FE4':'#E9A800')+';background:'+(v?'rgba(47,111,228,.18)':'rgba(233,168,0,.22)');
    b.onclick=()=>{figs[i]=1-figs[i];qDraw();};box.appendChild(b);});
  const blue=figs.filter(v=>v).length;
  const st=(t,ok)=>'<span style="color:'+(ok?'#14603E':'#8F2018')+';font-weight:600">'+(ok?'істинне':'хибне')+'</span> — '+t;
  $('#q-s1').innerHTML='«Усі фігури сині» → '+st('синіх '+blue+' з 6',blue===6);
  $('#q-s2').innerHTML='«Деякі фігури сині» → '+st('синіх '+blue,blue>0);
  $('#q-s3').innerHTML='«Жодна фігура не синя» → '+st('синіх '+blue,blue===0);
  $('#q-task').innerHTML=qTasks[qI].ask+'<span class="chip">'+qOk+' з '+qTasks.length+'</span>';}
function qCheck(){const blue=figs.filter(v=>v).length;
  if(qTasks[qI].ok(blue)){qOk++;qDraw();say('#q-v','Так, саме так.',true);if(qOk>=qTasks.length)mark('quant');}
  else say('#q-v','Поки ні — перечитай умову й подивись на кольори тверджень.',false);}
function qNext(){qI=(qI+1)%qTasks.length;hide('#q-v');qDraw();}

/* --- 3. Схема і/або/не + де Морган --- */
T('circuit',{g:0,ic:'💡',t:'Схема «і / або / не»',s:'Тижд. 5–6 · таблиця істинності',html:`
<div class="panel">
  <div class="row" style="margin-bottom:12px">
    <button class="btn small" id="m-and" onclick="setMode('and')">A і B</button>
    <button class="btn small ghost" id="m-or" onclick="setMode('or')">A або B</button>
    <button class="btn small ghost" id="m-not" onclick="setMode('not')">не A</button>
    <button class="btn small ghost" id="m-dm" onclick="setMode('dm')">Де Морган</button></div>
  <svg viewBox="0 0 340 180" height="175" id="c-svg"></svg>
  <div class="hintline" id="c-state"></div>
  <table class="tt" id="c-tt"></table>
  <div class="legend" id="c-legend"></div>
</div>`,init(){setMode('and');}});
let mode='and',A=false,B=false,seen=new Set();
function lampOn(){return mode==='and'?(A&&B):mode==='or'?(A||B):mode==='not'?!A:!(A&&B);}
function setMode(m){mode=m;A=B=false;seen=new Set();
  ['and','or','not','dm'].forEach(k=>$('#m-'+k).className='btn small'+(k===m?'':' ghost'));cDraw();}
function swSVG(x,y,st,id){return '<g class="sw" onclick="toggle(\'' + id + '\')">'+
  '<circle cx="'+x+'" cy="'+y+'" r="15" fill="#fff" stroke="#1E2A3A" stroke-width="3"/>'+
  '<line x1="'+(x-8)+'" y1="'+(y+7)+'" x2="'+(x+8)+'" y2="'+(st?y:y-8)+'" stroke="#1E2A3A" stroke-width="4" stroke-linecap="round"/>'+
  '<text x="'+x+'" y="'+(y+33)+'" text-anchor="middle" font-size="14" font-weight="600">'+id+'</text></g>';}
function lampSVG(x,y,on,label){return '<circle cx="'+x+'" cy="'+y+'" r="19" fill="'+(on?'#FFD84D':'#EFEDE6')+'" stroke="'+(on?'#E9A800':'#C9C6BB')+'" stroke-width="3"/>'+
  '<text x="'+x+'" y="'+(y+36)+'" text-anchor="middle" font-size="12" fill="#5B6779">'+label+'</text>';}
function cDraw(){let s='';
  if(mode==='and') s='<path class="wire '+(A?'hot':'')+'" d="M10 70 H55"/><path class="wire '+(A&&B?'hot':'')+'" d="M85 70 H145"/>'+
    '<path class="wire '+(lampOn()?'hot':'')+'" d="M175 70 H232"/>'+swSVG(70,70,A,'A')+swSVG(160,70,B,'B')+lampSVG(256,70,lampOn(),'A і B');
  else if(mode==='or') s='<path class="wire '+(A||B?'hot':'')+'" d="M10 70 H38"/>'+
    '<path class="wire '+(A?'hot':'')+'" d="M38 70 V38 H55"/><path class="wire '+(A?'hot':'')+'" d="M85 38 H138 V70"/>'+
    '<path class="wire '+(B?'hot':'')+'" d="M38 70 V102 H55"/><path class="wire '+(B?'hot':'')+'" d="M85 102 H138 V70"/>'+
    '<path class="wire '+(lampOn()?'hot':'')+'" d="M138 70 H232"/>'+swSVG(70,38,A,'A')+swSVG(70,102,B,'B')+lampSVG(256,70,lampOn(),'A або B');
  else if(mode==='not') s='<path class="wire '+(!A?'hot':'')+'" d="M10 70 H55"/><path class="wire '+(!A?'hot':'')+'" d="M85 70 H232"/>'+
    swSVG(70,70,!A,'A')+lampSVG(256,70,lampOn(),'не A');
  else{const left=!(A&&B),right=(!A)||(!B);
    s='<text x="8" y="18" font-size="13" fill="#5B6779">не (A і B)</text>'+
      '<path class="wire '+(left?'hot':'')+'" d="M10 55 H140"/>'+lampSVG(168,55,left,'')+
      '<text x="8" y="115" font-size="13" fill="#5B6779">не A або не B</text>'+
      '<path class="wire '+(right?'hot':'')+'" d="M10 150 H140"/>'+lampSVG(168,150,right,'')+
      '<g transform="translate(230,15)">'+swSVG(30,45,A,'A')+swSVG(30,115,B,'B')+'</g>';}
  $('#c-svg').innerHTML=s;
  $('#c-state').textContent = mode==='not' ? 'A '+(A?'істинне':'хибне')+' → лампа '+(lampOn()?'горить':'не горить')
    : mode==='dm' ? 'A '+(A?'І':'Х')+', B '+(B?'І':'Х')+' → обидві лампи '+(!(A&&B)?'горять':'не горять')
    : 'A '+(A?'істинне':'хибне')+', B '+(B?'істинне':'хибне')+' → лампа '+(lampOn()?'горить':'не горить');
  ttDraw();
  $('#c-legend').textContent = mode==='and'?'Вимикачі один за одним: струм іде, лише коли обидва ввімкнені.'
    :mode==='or'?'Два шляхи поруч: досить одного ввімкненого.'
    :mode==='not'?'Вимикач розмикає коло: «не A» істинне тоді, коли A хибне.'
    :'Перебери всі чотири комбінації: лампи завжди однакові. Це закон де Моргана.';}
function toggle(id){ if(mode==='not'){A=!A;} else if(id==='A'){A=!A;} else {B=!B;}
  seen.add(mode==='not'?String(+A):String(+A)+String(+B));
  if(seen.size>=(mode==='not'?2:4)) mark('circuit');
  cDraw();}
function ttDraw(){
  if(mode==='dm'){const rows=[[0,0],[0,1],[1,0],[1,1]],cur=String(+A)+String(+B);
    let h='<tr><th>A</th><th>B</th><th>не (A і B)</th><th>не A або не B</th></tr>',b='';
    rows.forEach(r=>{const k=r.join(''),v=!(r[0]&&r[1])?'І':'Х',kn=seen.has(k)||k===cur;
      b+='<tr class="'+(k===cur?'now':'')+'"><td>'+(r[0]?'І':'Х')+'</td><td>'+(r[1]?'І':'Х')+'</td>'+
        (kn?'<td><b>'+v+'</b></td><td><b>'+v+'</b></td>':'<td class="q">?</td><td class="q">?</td>')+'</tr>';});
    $('#c-tt').innerHTML=h+b;return;}
  const rows=mode==='not'?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]];
  const cur=mode==='not'?String(+A):String(+A)+String(+B);
  let h=mode==='not'?'<tr><th>A</th><th>не A</th></tr>':'<tr><th>A</th><th>B</th><th>A '+(mode==='and'?'і':'або')+' B</th></tr>',b='';
  rows.forEach(r=>{const k=r.join(''),res=mode==='and'?(r[0]&&r[1]):mode==='or'?(r[0]||r[1]):(r[0]?0:1),kn=seen.has(k)||k===cur;
    b+='<tr class="'+(k===cur?'now':'')+'">'+r.map(v=>'<td>'+(v?'І':'Х')+'</td>').join('')+
      (kn?'<td><b>'+(res?'І':'Х')+'</b></td>':'<td class="q">?</td>')+'</tr>';});
  $('#c-tt').innerHTML=h+b;}

T('domino',{g:1,ic:'🁣',t:'Доміно на шахівниці',s:'Тижд. 10 · парність і розфарбування',html:`
<div class="panel">
  <div class="task">З дошки вирізали два кутики. Спробуй накрити решту доміношками: тисни на дві сусідні клітинки.</div>
  <div class="board" id="p-board" style="grid-template-columns:repeat(8,1fr)"></div>
  <div class="counts"><span id="p-w"></span><span id="p-b"></span><span id="p-d"></span></div>
  <div class="row center" style="margin-top:12px">
    <button class="btn ghost small" onclick="parityInit(true)">Вирізати інші кути</button>
    <button class="btn ghost small" onclick="parityInit(false)">Заново</button></div>
  <div class="verdict" id="p-v"></div>
</div>`,init(){pCut='opp';parityInit(false);}});
let pBoard=[],pSel=null,pCut='opp';
function parityInit(sw){if(sw)pCut=pCut==='opp'?'adj':'opp';pBoard=[];pSel=null;hide('#p-v');
  const cut=pCut==='opp'?[[0,0],[7,7]]:[[0,0],[0,7]];const el=$('#p-board');el.innerHTML='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const dark=(r+c)%2===1,gone=cut.some(x=>x[0]===r&&x[1]===c);
    pBoard.push({r:r,c:c,dark:dark,gone:gone,dom:false});const d=document.createElement('button');
    d.className='cell '+(gone?'gone':dark?'dark':'light');
    (function(idx){d.onclick=()=>pTap(idx);})(r*8+c);el.appendChild(d);}
  pStats();}
function pTap(i){const cells=$('#p-board').children,cell=pBoard[i];if(cell.gone||cell.dom)return;
  if(pSel===null){pSel=i;cells[i].classList.add('sel');return;}
  if(pSel===i){cells[i].classList.remove('sel');pSel=null;return;}
  const a=pBoard[pSel],b=cell,near=Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;cells[pSel].classList.remove('sel');
  if(near){a.dom=b.dom=true;cells[pSel].classList.add('dom');cells[i].classList.add('dom');pSel=null;pStats();}
  else{pSel=i;cells[i].classList.add('sel');}}
function pStats(){const free=pBoard.filter(c=>!c.gone&&!c.dom);
  const w=free.filter(c=>!c.dark).length,b=free.filter(c=>c.dark).length,placed=pBoard.filter(c=>c.dom).length/2;
  $('#p-w').textContent='світлих: '+w;$('#p-b').textContent='темних: '+b;$('#p-d').textContent='доміношок: '+placed;
  const stuck=!pBoard.some(c=>{if(c.gone||c.dom)return false;
    return [[0,1],[1,0]].some(d=>{const r=c.r+d[0],cc=c.c+d[1];if(r>7||cc>7)return false;
      const n=pBoard[r*8+cc];return !n.gone&&!n.dom;});});
  if(free.length===0){mark('domino');say('#p-v','Уся дошка накрита — тут світлих і темних було порівну.',true);}
  else if(stuck){mark('domino');say('#p-v',pCut==='opp'
    ? 'Далі нікуди. Світлих і темних <b>не порівну</b> ('+w+' і '+b+'). Кожна доміношка накриває одну світлу й одну темну, тож таку дошку накрити неможливо — і жодне перекладання не допоможе.'
    : 'Тупик випадковий: світлих і темних порівну ('+w+' і '+b+'). Спробуй заново — розв’язок існує.',pCut!=='opp');}
  else hide('#p-v');}

T('hop',{g:1,ic:'🦗',t:'Коник на прямій',s:'Тижд. 10 · інваріант парності',html:`

</div>`,init(){hpI=0;hpLoad();}});
const hpT=[{target:2,steps:4},{target:3,steps:4},{target:1,steps:5},{target:0,steps:7}];
let hpI=0,hpPos=0,hpN=0;
function hpLoad(){hpPos=0;hpN=0;hide('#hp-v');const t=hpT[hpI];
  $('#hp-task').innerHTML='Зроби рівно <b>'+t.steps+'</b> стрибків і опинись на позиції <b>'+t.target+'</b>. Кожен стрибок — на 1 клітинку.';
  hpDraw();}
function hpDraw(){let s='<line x1="10" y1="40" x2="330" y2="40" stroke="#C9C6BB" stroke-width="3"/>';
  for(let i=-5;i<=5;i++){const x=25+(i+5)*29;
    s+='<line x1="'+x+'" y1="30" x2="'+x+'" y2="50" stroke="#C9C6BB" stroke-width="2"/>'+
       '<text x="'+x+'" y="70" text-anchor="middle" font-size="12" fill="#5B6779">'+i+'</text>';}
  const t=hpT[hpI];
  s+='<circle cx="'+(25+(t.target+5)*29)+'" cy="40" r="13" fill="none" stroke="#E9A800" stroke-width="3"/>';
  s+='<circle cx="'+(25+(hpPos+5)*29)+'" cy="40" r="9" fill="#2F6FE4"/>';
  $('#hp-svg').innerHTML=s;
  $('#hp-state').textContent='Стрибків: '+hpN+' з '+t.steps+' · позиція '+hpPos;}
function hop(d){const t=hpT[hpI];if(hpN>=t.steps)return;hpPos+=d;hpN++;hpDraw();
  if(hpN===t.steps){const ok=hpPos===t.target;
    const par=((t.target%2)+2)%2===((t.steps%2)+2)%2;
    if(ok||!par)mark('hop');
    say('#hp-v',ok?'Є! Парність позиції збіглася з парністю кількості стрибків.'
      :par?'Не влучив, але ціль досяжна — спробуй іншу послідовність.'
      :'Це <b>неможливо</b>, скільки не пробуй: за '+t.steps+' стрибків можна потрапити лише в '+(t.steps%2?'непарну':'парну')+' клітинку, а '+t.target+' — '+(t.target%2?'непарна':'парна')+'.',ok||!par);}}
function hpNew(){hpI=(hpI+1)%hpT.length;hpLoad();}

const msPre=[{},{'00':8,'22':2},{'11':5,'02':6,'20':4}];
let msL=0;
function msBuild(){const g=$('#ms');g.innerHTML='';
  for(let r=0;r<3;r++){for(let c=0;c<3;c++){const i=document.createElement('input');
    i.inputMode='numeric';i.maxLength=1;i.id='m'+r+c;i.oninput=msCheck;g.appendChild(i);}
    const s=document.createElement('div');s.className='sum';s.id='sr'+r;g.appendChild(s);}
  for(let c=0;c<3;c++){const s=document.createElement('div');s.className='sum';s.id='sc'+c;g.appendChild(s);}
  const d=document.createElement('div');d.className='sum';d.id='sd';g.appendChild(d);}
function msLevel(l){msL=l;[0,1,2].forEach(k=>$('#ml-'+k).className='btn small'+(k===l?'':' ghost'));
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const el=$('#m'+r+c),v=msPre[l][''+r+c];
    el.value=v||'';el.disabled=!!v;}
  hide('#ms-v');msCheck();}
function mv(r,c){const v=parseInt($('#m'+r+c).value,10);return isNaN(v)?0:v;}
function msSum(sel,val,full){const e=$(sel);e.textContent=val||'';e.className='sum'+(full?(val===15?' ok':' bad'):'');}
function msCheck(){let vals=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++){const v=mv(r,c);if(v)vals.push(v);}
  for(let r=0;r<3;r++)msSum('#sr'+r,mv(r,0)+mv(r,1)+mv(r,2),[0,1,2].every(c=>mv(r,c)));
  for(let c=0;c<3;c++)msSum('#sc'+c,mv(0,c)+mv(1,c)+mv(2,c),[0,1,2].every(r=>mv(r,c)));
  msSum('#sd',mv(0,0)+mv(1,1)+mv(2,2),mv(0,0)&&mv(1,1)&&mv(2,2));
  const used=[...new Set(vals)];
  $('#ms-used').textContent='Використано: '+(used.length?used.slice().sort((a,b)=>a-b).join(', '):'—');
  if(vals.length!==used.length)return say('#ms-v','Числа повторюються — кожне має бути рівно один раз.',false);
  if(vals.length!==9)return hide('#ms-v');
  const ok=[0,1,2].every(r=>mv(r,0)+mv(r,1)+mv(r,2)===15)&&[0,1,2].every(c=>mv(0,c)+mv(1,c)+mv(2,c)===15)
    &&mv(0,0)+mv(1,1)+mv(2,2)===15&&mv(0,2)+mv(1,1)+mv(2,0)===15;
  if(ok){mark('magic');say('#ms-v','Зібрано. У центрі в тебе 5 — інакше не буває.',true);}
  else say('#ms-v','Числа всі різні, але суми ще не по 15. Дивись на червоні клітинки збоку.',false);}
function msHint(){say('#ms-v','Через центр проходять чотири лінії. Пари, що дають 10 (1+9, 2+8, 3+7, 4+6), можуть зійтись лише навколо 5.',true);}

T('caesar',{g:1,ic:'🔐',t:'Шифрувальне колесо',s:'Тижд. 11 · шифр Цезаря',html:`

const AB='абвгґдеєжзиіїйклмнопрстуфхцчшщьюя';
const czMsgs=['ключ під килимком','зустрічаємось опівночі','сова бачить усе','логіка сильніша за силу'];
let czSecret='',czKey=0;
function czShift(s,k){return s.split('').map(ch=>{const i=AB.indexOf(ch);return i<0?ch:AB[(i+k+AB.length*3)%AB.length];}).join('');}
function czMode(m){$('#cz-m0').className='btn small'+(m?' ghost':'');$('#cz-m1').className='btn small'+(m?'':' ghost');
  $('#cz-enc').style.display=m?'none':'block';$('#cz-dec').style.display=m?'block':'none';if(m)czCrack();else czRun();}
function czRun(){const k=+$('#cz-shift').value;$('#cz-k').textContent=k;
  $('#cz-out').textContent=czShift($('#cz-in').value.toLowerCase(),k);
  let s='';for(let i=0;i<9;i++){const x=18+i*32;
    s+='<text x="'+x+'" y="20" font-size="16" text-anchor="middle">'+AB[i]+'</text>'+
       '<text x="'+x+'" y="50" font-size="16" text-anchor="middle" fill="#2F6FE4" font-weight="600">'+AB[(i+k)%AB.length]+'</text>'+
       '<line x1="'+x+'" y1="26" x2="'+x+'" y2="36" stroke="#C9C6BB" stroke-width="2"/>';}
  $('#cz-wheel').innerHTML=s;}
function czNew(){czSecret=rnd(czMsgs);czKey=2+Math.floor(Math.random()*10);
  $('#cz-crypt').textContent=czShift(czSecret,czKey);$('#cz-shift2').value=1;hide('#cz-v');czCrack();}
function czCrack(){const k=+$('#cz-shift2').value;$('#cz-k2').textContent=k;
  const out=czShift($('#cz-crypt').textContent,-k);$('#cz-plain').textContent=out;
  if(out===czSecret){mark('caesar');say('#cz-v','Зламано! Зсув був '+czKey+'. Так само працює частотний аналіз: шукають найчастішу букву.',true);}
  else hide('#cz-v');}

const jugL=[{a:5,b:3,goal:4,best:6},{a:8,b:5,goal:4,best:8},{a:7,b:4,goal:5,best:8},{a:9,b:4,goal:6,best:8}];
let JG={i:0,a:0,b:0,n:0};
function jugLevel(i){JG={i:i,a:0,b:0,n:0};const L=jugL[i];

  $('#j-task').innerHTML='Відміряй рівно <b>'+L.goal+' л</b>. Мірок немає — лише глечики '+L.a+' л і '+L.b+' л.';

  $('#j-btns').innerHTML='<button class="btn ghost small" onclick="jug(\'fa\')">Наповнити '+L.a+'</button>'+
    '<button class="btn ghost small" onclick="jug(\'fb\')">Наповнити '+L.b+'</button>'+
    '<button class="btn ghost small" onclick="jug(\'ea\')">Вилити '+L.a+'</button>'+
    '<button class="btn ghost small" onclick="jug(\'eb\')">Вилити '+L.b+'</button>'+
    '<button class="btn small" onclick="jug(\'ab\')">'+L.a+' → '+L.b+'</button>'+
    '<button class="btn small" onclick="jug(\'ba\')">'+L.b+' → '+L.a+'</button>';
  hide('#j-v');jugDraw();}
function jugDraw(){const L=jugL[JG.i];
  $('#j5').style.height=(JG.a/L.a*100)+'%';$('#j3').style.height=(JG.b/L.b*100)+'%';
  $('#j5v').textContent=JG.a+' л';$('#j3v').textContent=JG.b+' л';$('#j-moves').textContent='Кроків: '+JG.n;
  if(JG.a===L.goal||JG.b===L.goal){mark('jugs');
    say('#j-v',L.goal+' л є, за '+JG.n+' кроків.'+(JG.n<=L.best?' Це найкоротший шлях.':' Найкоротший — '+L.best+', спробуй ще.'),true);}
  else hide('#j-v');}
function jug(op){const L=jugL[JG.i];
  if(op==='fa')JG.a=L.a;else if(op==='fb')JG.b=L.b;else if(op==='ea')JG.a=0;else if(op==='eb')JG.b=0;
  else if(op==='ab'){const t=Math.min(JG.a,L.b-JG.b);JG.a-=t;JG.b+=t;}
  else{const t=Math.min(JG.b,L.a-JG.a);JG.b-=t;JG.a+=t;}
  JG.n++;jugDraw();}
function jugReset(){JG.a=0;JG.b=0;JG.n=0;hide('#j-v');jugDraw();}

let SC={n:9,light:1,pan:[],w:0,done:false};
function scSet(n){SC={n:n,light:Math.floor(Math.random()*n)+1,pan:new Array(n+1).fill(0),w:0,done:false};
  $('#sl-9').className='btn small'+(n===9?'':' ghost');$('#sl-27').className='btn small'+(n===27?'':' ghost');

  $('#sc-guess').value='';hide('#sc-v');scDraw(0);}
function scDraw(tilt){tilt=tilt||0;const c=$('#sc-coins');c.innerHTML='';
  for(let i=1;i<=SC.n;i++){const b=document.createElement('button');
    b.className='coin'+(SC.pan[i]===1?' l':SC.pan[i]===2?' r':'');b.textContent=i;
    if(SC.n>9)b.style.cssText='width:34px;height:34px;font-size:13px';
    (function(k){b.onclick=()=>{if(SC.done)return;SC.pan[k]=(SC.pan[k]+1)%3;scDraw(0);};})(i);
    c.appendChild(b);}
  const y=tilt*10;
  $('#sc-svg').innerHTML='<line x1="150" y1="30" x2="150" y2="95" stroke="#8B8578" stroke-width="6"/>'+

    '<path d="M240 '+(45-y)+' l-22 26 h44 z" fill="#FFF3D4" stroke="#E9A800" stroke-width="2"/>'+
    '<rect x="120" y="95" width="60" height="10" rx="4" fill="#8B8578"/>';
  const L=SC.pan.filter(v=>v===1).length,R=SC.pan.filter(v=>v===2).length;
  $('#sc-state').textContent='Зважувань: '+SC.w+' · ліворуч '+L+', праворуч '+R;}
function scWeigh(){if(SC.done)return;
  const L=[],R=[];for(let i=1;i<=SC.n;i++){if(SC.pan[i]===1)L.push(i);if(SC.pan[i]===2)R.push(i);}
  if(!L.length||!R.length)return say('#sc-v','Поклади монети на обидві шальки.',false);
  if(L.length!==R.length)return say('#sc-v','Монет має бути порівну, інакше порівняння нічого не скаже.',false);
  SC.w++;const l=L.indexOf(SC.light)>=0,r=R.indexOf(SC.light)>=0,tilt=l?-1:r?1:0;scDraw(tilt);
  say('#sc-v',tilt===0?'Рівновага: легша монета не на терезах.':tilt<0?'Ліва шалька вгорі — легша ліворуч.':'Права шалька вгорі — легша праворуч.',true);}
function scGuess(){const g=+$('#sc-guess').value;if(!g)return;SC.done=true;
  const lim=SC.n===9?2:3;

      :'Монета №'+g+' — правильно, але зважувань '+SC.w+'. Досить '+lim+': ділити треба на три рівні купки.',ok);}
  else say('#sc-v','Ні, легша була №'+SC.light+'. Спробуй ще: перше зважування — третина проти третини.',false);}

T('back',{g:1,ic:'↩️',t:'Машина навпаки',s:'Тижд. 15 · обернений хід',html:`

const bkTasks=[{ops:[['×',3],['+',6],[':',2]],start:6},{ops:[['+',5],['×',2],['−',4]],start:7},

  t.ops.forEach(o=>{v=o[0]==='×'?v*o[1]:o[0]==='+'?v+o[1]:o[0]==='−'?v-o[1]:v/o[1];});return v;}
function bkLoad(){const t=bkTasks[BK.i];BK.val=bkFwd(BK.i);BK.step=t.ops.length;hide('#bk-v');

function bkDraw(){const t=bkTasks[BK.i];let h='<div class="val">'+BK.val+'</div>';
  for(let k=t.ops.length-1;k>=0;k--){const o=t.ops[k][0],n=t.ops[k][1];

    h+='<div class="arrow">↑</div><div class="op '+(act?'now':'')+'">'+(act?'зараз: ':'')+inv+

  $('#bk-mach').innerHTML=h;
  if(BK.step===0){const ok=BK.val===t.start;if(ok)mark('back');
    say('#bk-v',ok?'Задумане число — '+BK.val+'. Перевіримо вперед: '+t.start+' '+t.ops.map(o=>o[0]+o[1]).join(' ')+' = '+bkFwd(BK.i)+'.':'Щось не зійшлося.',ok);}}
function bkStep(){if(BK.step===0)return;const o=bkTasks[BK.i].ops[BK.step-1];

T('path',{g:2,ic:'✏️',t:'Одним розчерком',s:'Тижд. 22 · мости й непарні вершини',html:`
<div class="panel">

</div>`,init(){graphLoad(0);}});
const graphs=[
 {n:'Конверт',v:[[60,190],[260,190],[260,90],[60,90],[160,30]],e:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3],[3,4],[4,2]]},
 {n:'Будиночок',v:[[60,200],[260,200],[260,110],[60,110],[160,40]],e:[[0,1],[1,2],[2,3],[3,0],[3,4],[4,2],[0,2]]},
 {n:'Зірка',v:[[160,30],[280,120],[235,220],[85,220],[40,120]],e:[[0,2],[2,4],[4,1],[1,3],[3,0]]},
 {n:'Мости Кенігсберга',v:[[160,40],[60,140],[260,140],[160,220]],e:[[0,1],[0,1],[0,2],[0,2],[1,3],[2,3],[0,3]]}];
let G={i:0,used:[],cur:null};
function graphLoad(i){G={i:i,used:[],cur:null};hide('#gp-v');
  $('#g-tabs').innerHTML=graphs.map((g,k)=>'<button class="btn small'+(k===i?'':' ghost')+'" onclick="graphLoad('+k+')">'+g.n+'</button>').join('');
  graphDraw();}
function graphReset(){G.used=[];G.cur=null;hide('#gp-v');graphDraw();}
function degs(){const g=graphs[G.i],d=new Array(g.v.length).fill(0);g.e.forEach(e=>{d[e[0]]++;d[e[1]]++;});return d;}
function graphDraw(){const g=graphs[G.i];let s='';
  g.e.forEach((e,idx)=>{const a=g.v[e[0]],b=g.v[e[1]];
    const dup=g.e.filter((x,j)=>j<idx&&x[0]===e[0]&&x[1]===e[1]).length,off=dup?26:0;
    const path=off?'M'+a[0]+' '+a[1]+' Q'+((a[0]+b[0])/2+off)+' '+((a[1]+b[1])/2-off/1.5)+' '+b[0]+' '+b[1]
                  :'M'+a[0]+' '+a[1]+' L'+b[0]+' '+b[1];
    const on=G.used.indexOf(idx)>=0;
    s+='<path d="'+path+'" fill="none" stroke="'+(on?'#2F6FE4':'#C9C6BB')+'" stroke-width="'+(on?6:4)+'" stroke-linecap="round"/>';});
  const d=degs();
  g.v.forEach((p,i)=>{const odd=d[i]%2;
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="'+(G.cur===i?'#2F6FE4':odd?'#FFF3D4':'#fff')+'" stroke="'+(odd?'#E9A800':'#8B8578')+'" stroke-width="3" onclick="gTap('+i+')" style="cursor:pointer"/>'+
       '<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="13" font-weight="600" fill="'+(G.cur===i?'#fff':'#1E2A3A')+'" pointer-events="none">'+d[i]+'</text>';});
  $('#gp-svg').innerHTML=s;
  const odd=d.filter(x=>x%2).length;
  $('#gp-state').innerHTML='Проведено '+G.used.length+' з '+g.e.length+' · непарних вершин: <b>'+odd+'</b>';
  if(G.used.length===g.e.length){mark('path');say('#gp-v','Готово, одним розчерком! Непарних вершин тут '+odd+'.',true);}}
function gTap(i){const g=graphs[G.i];
  if(G.cur===null){G.cur=i;graphDraw();return;}
  let idx=-1;
  for(let k=0;k<g.e.length;k++){const e=g.e[k];
    if(G.used.indexOf(k)<0&&((e[0]===G.cur&&e[1]===i)||(e[1]===G.cur&&e[0]===i))){idx=k;break;}}
  if(idx<0){G.cur=i;graphDraw();return;}
  G.used.push(idx);G.cur=i;graphDraw();
  if(G.used.length<g.e.length){
    const has=g.e.some((e,k)=>G.used.indexOf(k)<0&&(e[0]===G.cur||e[1]===G.cur));
    const odd=degs().filter(x=>x%2).length;
    if(!has)say('#gp-v',odd>2?'Застряг. Непарних вершин '+odd+' — понад дві, тому обійти всі лінії одним розчерком <b>неможливо</b>. Саме це довів Ейлер про кенігсберзькі мости.'
      :'Застряг, але розв’язок є: почни з жовтої (непарної) вершини.',false);}}

  <div class="row center" style="margin-top:12px"><button class="btn" onclick="lgCheck()">Перевірити</button>
    <button class="btn ghost" onclick="lgLoad()">Очистити</button>
    <button class="btn ghost" onclick="lgNext()">Інша загадка</button></div>
  <div class="verdict" id="lg-v"></div>
  <div class="legend">Тисни на клітинку: порожньо → ✓ → ✗. Поставив ✓ — решта рядка й стовпця стають ✗.</div>
</div>`,init(){lgI=0;lgOk=0;lgLoad();}});
const lgP=[
 {rows:['Аня','Богдан','Влад'],cols:['математика','музика','малювання'],
  clues:['Аня не любить математику.','Богдан не любить ні музику, ні математику.'],sol:[1,2,0]},
 {rows:['Оля','Петро','Софія'],cols:['кіт','папуга','хом’як'],
  clues:['У Софії не хом’як і не кіт.','У Петра не кіт.'],sol:[0,2,1]},
 {rows:['Іван','Марта','Юрко'],cols:['футбол','шахи','плавання'],
  clues:['Юрко не плаває і не грає в шахи.','Марта не грає у футбол.'],sol:[1,2,0]},
 {rows:['Ліда','Максим','Ніна'],cols:['яблуко','груша','слива'],
  clues:['Ніна не любить сливу і не любить грушу.','Максим не любить грушу.'],sol:[1,2,0]}];
let lgI=0,lgOk=0,lgState=[];
function lgLoad(){const p=lgP[lgI];lgState=p.rows.map(()=>p.cols.map(()=>0));hide('#lg-v');lgChip();lgDraw();}
function lgChip(){const p=lgP[lgI];
  $('#lg-task').innerHTML=p.clues.map(c=>'• '+c).join('<br>')+'<span class="chip">'+lgOk+' з '+lgP.length+'</span>';}
function lgDraw(){const p=lgP[lgI];
  let h='<table class="lgrid"><tr><th></th>'+p.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  p.rows.forEach((r,i)=>{h+='<tr><th>'+r+'</th>'+p.cols.map((_,j)=>{const v=lgState[i][j];
    return '<td><button class="'+(v===1?'yes':v===2?'no':'')+'" onclick="lgTap('+i+','+j+')">'+(v===1?'✓':v===2?'✗':'')+'</button></td>';}).join('')+'</tr>';});
  $('#lg-wrap').innerHTML=h+'</table>';}
function lgTap(i,j){lgState[i][j]=(lgState[i][j]+1)%3;
  if(lgState[i][j]===1){lgState[i].forEach((v,k)=>{if(k!==j&&v!==1)lgState[i][k]=2;});
    lgState.forEach((row,k)=>{if(k!==i&&row[j]!==1)row[j]=2;});}
  lgDraw();}
function lgCheck(){const p=lgP[lgI],got=lgState.map(r=>r.indexOf(1));
  if(got.some(v=>v<0))return say('#lg-v','Постав ✓ у кожному рядку.',false);
  if(got.every((v,i)=>v===p.sol[i])){lgOk++;lgChip();
    say('#lg-v','Розгадано. Метод простий: із заборон ставимо ✗, а коли в рядку лишається одна клітинка — там ✓.',true);
    if(lgOk>=lgP.length)mark('grid');}
  else say('#lg-v','Щось не сходиться з підказками. Перечитай їх і став ✗ там, де точно ні.',false);}
function lgNext(){lgI=(lgI+1)%lgP.length;lgLoad();}

/* --- 22. Шкарпетки --- */
T('socks',{g:3,ic:'🧦',t:'Шухляда зі шкарпетками',s:'Тижд. 35 · принцип Діріхле',html:`
<div class="panel">
  <div class="task">У темряві не видно кольору. Скільки шкарпеток витягти, щоб <b>напевно</b> була пара?</div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn small" id="k-2" onclick="sockSet(2)">2 кольори</button>
    <button class="btn small ghost" id="k-3" onclick="sockSet(3)">3 кольори</button>
    <button class="btn small ghost" id="k-4" onclick="sockSet(4)">4 кольори</button></div>
  <div class="socks" id="sk-list"></div>
  <div class="row"><button class="btn" onclick="sockPull()">Витягнути</button>
    <button class="btn ghost" onclick="sockReset()">Скласти назад</button></div>
  <div class="hintline" id="sk-state"></div>
  <div class="verdict" id="sk-v"></div>
  <div class="legend">Найгірший випадок: спершу трапляються всі кольори по одному. Наступна шкарпетка обов’язково повторить колір.</div>
</div>`,init(){sockSet(2);}});
const SOCK_COLORS=['#5AA9EE','#E9A800','#7BC47F','#D8433B'];
let SK={k:2,drawn:[]};
function sockSet(k){SK.k=k;[2,3,4].forEach(n=>$('#k-'+n).className='btn small'+(n===k?'':' ghost'));sockReset();}
function sockReset(){SK.drawn=[];hide('#sk-v');sockDraw();}
function sockPull(){SK.drawn.push(Math.floor(Math.random()*SK.k));sockDraw();}
function sockDraw(){const box=$('#sk-list');box.innerHTML='';
  SK.drawn.forEach(c=>{const d=document.createElement('div');d.className='sock';d.style.background=SOCK_COLORS[c];box.appendChild(d);});
  const cnt={};SK.drawn.forEach(c=>{cnt[c]=(cnt[c]||0)+1;});
  const pair=Object.keys(cnt).some(k=>cnt[k]>=2);
  $('#sk-state').textContent='Витягнуто: '+SK.drawn.length+' · різних кольорів: '+Object.keys(cnt).length+' з '+SK.k;
  if(pair){mark('socks');
    say('#sk-v','Пара є — на '+SK.drawn.length+'-й шкарпетці. Але <b>гарантія</b> настає лише на '+(SK.k+1)+'-й: кольорів '+SK.k+', більше ніж по одній не витягнеш.',true);}
  else if(SK.drawn.length>=SK.k)say('#sk-v','Усі '+SK.k+' кольори вже трапились по одному. Наступна обов’язково повторить колір.',true);
  else hide('#sk-v');}

/* ================= головна ================= */
function homeDraw(){
  const list=$('#home-list');if(!list)return;list.innerHTML='';
  GROUPS.forEach((g,gi)=>{
    const keys=Object.keys(TOOLS).filter(k=>TOOLS[k].g===gi);
    if(!keys.length)return;
    const done=keys.filter(k=>PR[k]).length;
    const h=document.createElement('div');h.className='grp';
    h.textContent=g+(done?'  ·  освоєно '+done+' з '+keys.length:'');list.appendChild(h);
    keys.forEach(k=>{const t=TOOLS[k],b=document.createElement('button');
      b.className='tool'+(PR[k]?' done':'');
      b.innerHTML='<div class="ic">'+t.ic+'</div><div class="tx"><b>'+t.t+'</b><span>'+t.s+'</span></div><div class="tick">✓</div>';
      b.onclick=()=>openTool(k);list.appendChild(b);});
  });
}
function openTool(k){const t=TOOLS[k];$('#t-title').textContent=t.t;$('#t-body').innerHTML=t.html;
  go('s-tool');try{t.init();}catch(e){console.error(e);}}
homeDraw();
</script>
