<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Довкілля · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>
// ============================================================
//  ДАНІ КУРСУ. Один об'єкт на предмет; генерується з підручника.
// ============================================================
const COURSE = {"id": "pryroda5", "title": "Довкілля", "subtitle": "5 клас · 16 уроків за шкільним підручником", "lessons": [{"id": "dv-vstup-metody", "sec": "Я в природі", "title": "Природа і науки про неї. Методи пізнання", "goal": "Ти знаєш, що таке природа, які науки її вивчають і які є методи дослідження.", "learn": [{"h": "Природа", "p": ["<span class='term'>Природа</span> — усе, що існує без участі людини. <b>Жива природа</b> — організми: бактерії, гриби, рослини, тварини, людина. <b>Нежива природа</b> — вода, повітря, камені, Сонце, зорі. Люди створюють <b>рукотворні тіла</b> (будинок, телефон)."]}, {"h": "Науки про природу", "p": ["<b>Біологія</b> — живі організми. <b>Фізика</b> — рух, енергія, світло, звук. <b>Хімія</b> — речовини і їх перетворення. <b>Астрономія</b> — небесні тіла. <b>Географія</b> — Земля, її поверхня. <b>Екологія</b> — зв'язки організмів між собою і з довкіллям."]}, {"h": "Методи пізнання природи", "p": ["<b>Спостереження</b> — уважно дивитись, не втручаючись (за птахами, погодою). <b>Експеримент (дослід)</b> — створюємо умови і перевіряємо припущення (<b>гіпотезу</b>). <b>Вимірювання</b> — визначаємо величину приладом: лінійка (довжина), терези (маса), термометр (температура), мензурка (об'єм), секундомір (час). <b>Моделювання</b> — вивчаємо копію (глобус — модель Землі)."], "note": "Порядок дослідження: питання → гіпотеза → дослід → результат → висновок."}, {"h": "Прилади", "p": ["<b>Лупа</b> і <b>мікроскоп</b> — збільшують дрібне; <b>телескоп</b> — далекі небесні тіла; <b>бінокль</b>; <b>компас</b> — напрямок; <b>барометр</b> — тиск повітря."]}], "remember": "Природа — жива (організми) і нежива. Науки: біологія, фізика, хімія, астрономія, географія, екологія. Методи: спостереження, експеримент, вимірювання, моделювання. Гіпотеза — припущення. Прилади: мікроскоп, телескоп, терези, термометр.", "cards": [{"f": "Природа", "b": "Усе, що існує без участі людини; жива й нежива."}, {"f": "Біологія / фізика / хімія", "b": "Живі організми / рух, енергія, світло / речовини та їх перетворення."}, {"f": "Астрономія / екологія", "b": "Небесні тіла / зв'язки організмів з довкіллям."}, {"f": "Спостереження", "b": "Вивчення без втручання."}, {"f": "Експеримент (дослід)", "b": "Створюємо умови і перевіряємо гіпотезу."}, {"f": "Гіпотеза", "b": "Наукове припущення, яке перевіряють."}, {"f": "Чим вимірюють масу, температуру, об'єм рідини?", "b": "Терезами, термометром, мензуркою."}, {"f": "Модель", "b": "Копія об'єкта для вивчення: глобус — модель Землі."}], "quiz": [{"t": "choice", "q": "Що належить до живої природи?", "o": ["Камінь", "Гриб", "Хмара"], "a": 1, "e": "Гриб — організм."}, {"t": "choice", "q": "Яка наука вивчає речовини та їх перетворення?", "o": ["Фізика", "Хімія", "Біологія"], "a": 1, "e": "Хімія."}, {"t": "choice", "q": "Яка наука вивчає зорі й планети?", "o": ["Географія", "Астрономія", "Екологія"], "a": 1, "e": "Астрономія."}, {"t": "choice", "q": "Ти щодня записуєш температуру повітря, не змінюючи нічого. Це…", "o": ["експеримент", "спостереження", "моделювання"], "a": 1, "e": "Без втручання — спостереження."}, {"t": "choice", "q": "Ти поливаєш одну рослину, а іншу ні, і порівнюєш. Це…", "o": ["спостереження", "експеримент", "вимірювання"], "a": 1, "e": "Створюєш умови — дослід."}, {"t": "choice", "q": "Чим вимірюють об'єм рідини?", "o": ["Терезами", "Мензуркою", "Лінійкою"], "a": 1, "e": "Мензурка."}, {"t": "input", "q": "Як називається наукове припущення, яке перевіряють дослідом?", "a": ["гіпотеза"], "e": "Гіпотеза."}, {"t": "choice", "q": "Глобус — це…", "o": ["модель Землі", "карта", "прилад для вимірювання"], "a": 0, "e": "Модель."}, {"t": "choice", "q": "Який прилад показує напрямок на північ?", "o": ["Барометр", "Компас", "Термометр"], "a": 1, "e": "Компас."}, {"t": "choice", "q": "Що іде після гіпотези в дослідженні?", "o": ["Висновок", "Дослід", "Питання"], "a": 1, "e": "Питання → гіпотеза → дослід → результат → висновок."}]}, {"id": "dv-tila-rechovyny", "sec": "Я в природі", "title": "Тіла і речовини. Атоми й молекули. Стани речовини", "goal": "Ти відрізняєш тіло від речовини, знаєш про атоми й молекули та три стани речовини.", "learn": [{"h": "Тіло і речовина", "p": ["<span class='term'>Тіло</span> — будь-який предмет: склянка, крапля, планета. <span class='term'>Речовина</span> — те, з чого тіло складається: скло, вода, залізо. Одна речовина — різні тіла (скляна ваза й вікно); одне тіло — кілька речовин (ножиці: сталь і пластик)."]}, {"h": "Атоми й молекули", "p": ["Усі речовини складаються з найдрібніших частинок — <span class='term'>атомів</span>. Атоми з'єднуються в <span class='term'>молекули</span>: молекула води — 2 атоми водню + 1 атом кисню (H₂O). Між молекулами є проміжки; молекули безперервно рухаються — тому запах поширюється (<b>дифузія</b>)."]}, {"h": "Три стани речовини", "p": ["<b>Твердий</b> — зберігає форму й об'єм (лід): молекули щільно, коливаються на місці. <b>Рідкий</b> — зберігає об'єм, набуває форми посудини (вода): молекули рухливі. <b>Газоподібний</b> — не має ні форми, ні об'єму, заповнює весь простір (пара): молекули далеко й швидко."], "ex": ["Переходи: лід → вода (плавлення), вода → пара (випаровування, кипіння при 100 °C), пара → вода (конденсація), вода → лід (замерзання при 0 °C)."]}, {"h": "Властивості речовин", "p": ["Колір, запах, смак, твердість, розчинність, теплопровідність, електропровідність, густина. <b>Чисті речовини</b> (дистильована вода) і <b>суміші</b> (морська вода, повітря, ґрунт). Суміші розділяють: відстоюванням, фільтруванням, випаровуванням, магнітом."]}], "remember": "Тіло — предмет; речовина — з чого він. Атоми → молекули; H₂O. Молекули рухаються (дифузія). Стани: твердий (форма й об'єм), рідкий (об'єм), газ (нічого). 0 °C — лід, 100 °C — кипіння. Суміші розділяють фільтруванням, відстоюванням, випаровуванням.", "cards": [{"f": "Тіло / речовина", "b": "Тіло — предмет (склянка); речовина — з чого він (скло)."}, {"f": "Атом", "b": "Найдрібніша частинка речовини."}, {"f": "Молекула", "b": "Кілька з'єднаних атомів; молекула води — H₂O."}, {"f": "Дифузія", "b": "Проникнення молекул однієї речовини між молекулами іншої; так поширюється запах."}, {"f": "Три стани речовини", "b": "Твердий, рідкий, газоподібний."}, {"f": "Який стан зберігає об'єм, але не форму?", "b": "Рідкий."}, {"f": "За якої температури вода кипить і замерзає?", "b": "Кипить при 100 °C, замерзає при 0 °C."}, {"f": "Способи розділення сумішей", "b": "Відстоювання, фільтрування, випаровування, магніт."}], "quiz": [{"t": "choice", "q": "Що з цього речовина?", "o": ["Ложка", "Залізо", "Стіл"], "a": 1, "e": "Залізо — речовина; ложка і стіл — тіла."}, {"t": "choice", "q": "З чого складається молекула води?", "o": ["2 водню + 1 кисню", "1 водню + 2 кисню", "1 водню + 1 кисню"], "a": 0, "e": "H₂O."}, {"t": "choice", "q": "Чому запах парфумів поширюється по кімнаті?", "o": ["Дифузія — молекули рухаються", "Вітер у кімнаті", "Так здається"], "a": 0, "e": "Молекули рухаються безперервно."}, {"t": "choice", "q": "Який стан речовини не має ні форми, ні власного об'єму?", "o": ["Твердий", "Рідкий", "Газоподібний"], "a": 2, "e": "Газ заповнює весь простір."}, {"t": "choice", "q": "Вода набуває форми посудини, але зберігає об'єм. Це стан…", "o": ["твердий", "рідкий", "газоподібний"], "a": 1, "e": "Рідкий."}, {"t": "choice", "q": "Перехід пари у воду — це…", "o": ["плавлення", "конденсація", "випаровування"], "a": 1, "e": "Конденсація — краплі на холодному склі."}, {"t": "input", "q": "За якої температури кипить вода? Напиши число.", "a": ["100"], "e": "100 °C."}, {"t": "choice", "q": "Морська вода — це…", "o": ["чиста речовина", "суміш"], "a": 1, "e": "Вода + солі."}, {"t": "choice", "q": "Як відділити пісок від води?", "o": ["Магнітом", "Фільтруванням", "Нагріванням до кипіння"], "a": 1, "e": "Фільтр затримує пісок."}, {"t": "choice", "q": "Як відділити залізні ошурки від піску?", "o": ["Магнітом", "Фільтром", "Водою"], "a": 0, "e": "Залізо притягується магнітом."}]}, {"id": "dv-enerhiia", "sec": "Я в природі", "title": "Енергія та її види. Джерела енергії", "goal": "Ти знаєш види енергії, як вона перетворюється, і що таке відновлювані джерела.", "learn": [{"h": "Енергія", "p": ["<span class='term'>Енергія</span> — здатність виконувати роботу, рухати, нагрівати, світити. Одиниця — <b>джоуль (Дж)</b>. Енергія не виникає з нічого і не зникає — <b>перетворюється</b> з одного виду в інший (закон збереження енергії)."]}, {"h": "Види енергії", "p": ["<b>Механічна</b> — рух (кінетична) і положення (потенціальна: піднятий м'яч). <b>Теплова</b> — нагріті тіла. <b>Світлова</b> — Сонце, лампа. <b>Електрична</b> — струм. <b>Хімічна</b> — у їжі, паливі, батарейках. <b>Ядерна</b> — в атомах (АЕС). <b>Звукова</b>."], "ex": ["Лампа: електрична → світлова + теплова. Їжа: хімічна → рух і тепло тіла. Вітряк: механічна (вітер) → електрична."]}, {"h": "Джерела енергії", "p": ["Головне джерело енергії на Землі — <b>Сонце</b>: рослини запасають сонячну енергію (фотосинтез), тварини їдять рослини, з давніх рослин утворилось паливо. <b>Невідновлювані</b> джерела — вугілля, нафта, газ (закінчуються, забруднюють). <b>Відновлювані</b> — сонце, вітер, вода (ГЕС), геотермальна, біопаливо — не вичерпуються, чисті."], "note": "Енергозбереження: вимикати світло, LED-лампи, утеплення, менше пластику."}], "remember": "Енергія — здатність виконувати роботу (Дж). Не зникає — перетворюється. Види: механічна, теплова, світлова, електрична, хімічна, ядерна, звукова. Джерело всього — Сонце. Невідновлювані: вугілля, нафта, газ; відновлювані: сонце, вітер, вода.", "cards": [{"f": "Енергія", "b": "Здатність виконувати роботу, рухати, нагрівати, світити. Одиниця — джоуль."}, {"f": "Закон збереження енергії", "b": "Енергія не виникає з нічого і не зникає, а перетворюється."}, {"f": "Види енергії", "b": "Механічна, теплова, світлова, електрична, хімічна, ядерна, звукова."}, {"f": "Яка енергія в їжі й паливі?", "b": "Хімічна."}, {"f": "Головне джерело енергії на Землі", "b": "Сонце."}, {"f": "Невідновлювані джерела", "b": "Вугілля, нафта, природний газ."}, {"f": "Відновлювані джерела", "b": "Сонце, вітер, вода, геотермальна, біопаливо."}], "quiz": [{"t": "choice", "q": "Одиниця вимірювання енергії:", "o": ["Метр", "Джоуль", "Кілограм"], "a": 1, "e": "Джоуль (Дж)."}, {"t": "choice", "q": "Куди «зникає» енергія в лампі?", "o": ["Зникає назавжди", "Перетворюється у світло і тепло", "Повертається в розетку"], "a": 1, "e": "Закон збереження."}, {"t": "choice", "q": "Яка енергія запасена в батарейці?", "o": ["Хімічна", "Ядерна", "Звукова"], "a": 0, "e": "Хімічна → електрична."}, {"t": "choice", "q": "Енергія руху — це…", "o": ["потенціальна", "кінетична", "теплова"], "a": 1, "e": "Кінетична."}, {"t": "choice", "q": "Головне джерело енергії для життя на Землі:", "o": ["Вугілля", "Сонце", "Вітер"], "a": 1, "e": "Рослини запасають сонячну енергію."}, {"t": "choice", "q": "Що з цього відновлюване джерело?", "o": ["Нафта", "Вітер", "Вугілля"], "a": 1, "e": "Вітер не вичерпується."}, {"t": "choice", "q": "Чому нафта й газ — невідновлювані?", "o": ["Їх запаси вичерпуються", "Вони дорогі", "Вони рідкі"], "a": 0, "e": "Утворювались мільйони років."}, {"t": "choice", "q": "Яке перетворення енергії у вітряку?", "o": ["Механічна → електрична", "Теплова → світлова", "Хімічна → звукова"], "a": 0, "e": "Рух вітру → струм."}, {"t": "input", "q": "Як називається енергія, що виділяється в атомах на АЕС?", "a": ["ядерна", "атомна"], "e": "Ядерна."}, {"t": "tf", "q": "Вимкнути світло, виходячи з кімнати, — це енергозбереження.", "a": true, "e": "Так."}]}, {"id": "dv-klityna", "sec": "Я — частина природи", "title": "Клітина. Одноклітинні й багатоклітинні організми", "goal": "Ти знаєш будову клітини і відрізняєш одноклітинні організми від багатоклітинних.", "learn": [{"h": "Клітина", "p": ["<span class='term'>Клітина</span> — найменша жива частинка організму; усе живе складається з клітин. Відкрита завдяки <b>мікроскопу</b> (Роберт Гук, XVII ст.). Клітини дуже дрібні: у тілі людини їх десятки трильйонів."]}, {"h": "Будова клітини", "p": ["<b>Клітинна мембрана</b> — оболонка, що пропускає речовини. <b>Цитоплазма</b> — в'язка рідина всередині, де відбуваються процеси. <b>Ядро</b> — керує клітиною, зберігає спадкову інформацію (ДНК). У <b>рослинної</b> клітини ще є: тверда <b>клітинна стінка</b>, <b>хлоропласти</b> (зелені, фотосинтез), велика <b>вакуоля</b> із соком. У бактерій ядра немає."]}, {"h": "Одноклітинні й багатоклітинні", "p": ["<b>Одноклітинні</b> — весь організм одна клітина: бактерії, амеба, інфузорія-туфелька, евглена зелена, хлорела, дріжджі. Живуть у воді, ґрунті, в інших організмах. <b>Багатоклітинні</b> — з багатьох клітин, які спеціалізовані й утворюють <b>тканини</b> → <b>органи</b> → <b>системи органів</b> → організм."], "note": "Клітина → тканина → орган → система органів → організм."}, {"h": "Життєві процеси клітини", "p": ["Живлення, дихання, ріст, поділ (розмноження — одна клітина ділиться на дві), обмін речовин, подразливість (відповідь на зміни)."]}], "remember": "Клітина — найменша жива частинка; мембрана, цитоплазма, ядро. У рослин ще стінка, хлоропласти, вакуоля. Одноклітинні: бактерії, амеба, інфузорія. Багатоклітинні: клітина → тканина → орган → система → організм.", "cards": [{"f": "Клітина", "b": "Найменша жива частинка організму."}, {"f": "Ядро клітини", "b": "Керує клітиною, зберігає спадкову інформацію."}, {"f": "Цитоплазма", "b": "В'язка рідина всередині клітини, де йдуть процеси."}, {"f": "Клітинна мембрана", "b": "Оболонка клітини, що пропускає речовини."}, {"f": "Хлоропласти", "b": "Зелені частини рослинної клітини, де відбувається фотосинтез."}, {"f": "Одноклітинні організми", "b": "Бактерії, амеба, інфузорія-туфелька, евглена, дріжджі."}, {"f": "Рівні організації багатоклітинного організму", "b": "Клітина → тканина → орган → система органів → організм."}, {"f": "Хто відкрив клітину і за допомогою чого?", "b": "Роберт Гук за допомогою мікроскопа, XVII ст."}], "quiz": [{"t": "choice", "q": "Найменша жива частинка організму — це…", "o": ["атом", "клітина", "орган"], "a": 1, "e": "Клітина."}, {"t": "choice", "q": "Яка частина клітини керує нею?", "o": ["Мембрана", "Ядро", "Вакуоля"], "a": 1, "e": "Ядро зберігає спадкову інформацію."}, {"t": "choice", "q": "Де відбувається фотосинтез у рослинній клітині?", "o": ["У ядрі", "У хлоропластах", "У мембрані"], "a": 1, "e": "Хлоропласти — зелені."}, {"t": "choice", "q": "Чого немає у тваринній клітині, але є в рослинній?", "o": ["Ядра", "Клітинної стінки й хлоропластів", "Цитоплазми"], "a": 1, "e": "Стінка, хлоропласти, велика вакуоля — у рослин."}, {"t": "choice", "q": "Який організм одноклітинний?", "o": ["Амеба", "Мураха", "Ромашка"], "a": 0, "e": "Амеба — одна клітина."}, {"t": "choice", "q": "Що іде після тканини в будові організму?", "o": ["Клітина", "Орган", "Система органів"], "a": 1, "e": "Клітина → тканина → орган."}, {"t": "choice", "q": "Як розмножуються клітини?", "o": ["Поділом", "Насінням", "Спорами"], "a": 0, "e": "Одна ділиться на дві."}, {"t": "choice", "q": "За допомогою якого приладу побачили клітину?", "o": ["Телескопа", "Мікроскопа", "Лупи"], "a": 1, "e": "Мікроскоп."}, {"t": "input", "q": "Як називається в'язка рідина всередині клітини?", "a": ["цитоплазма"], "e": "Цитоплазма."}, {"t": "tf", "q": "У бактерій є ядро.", "a": false, "e": "Бактерії — без'ядерні."}]}, {"id": "dv-riznomanitnist", "sec": "Я — частина природи", "title": "Різноманітність організмів: бактерії, гриби, рослини, тварини", "goal": "Ти знаєш царства живої природи та ознаки кожного.", "learn": [{"h": "Царства живої природи", "p": ["<b>Бактерії</b> — одноклітинні без ядра; є корисні (кисломолочні, ґрунтові) і хвороботворні. <b>Гриби</b> — не рослини і не тварини: не мають хлорофілу, живляться готовими речовинами; шапинкові (білий, лисичка), цвілеві, дріжджі. <b>Рослини</b> — самі творять їжу з світла (фотосинтез), зелені, нерухомі. <b>Тварини</b> — живляться готовою їжею, рухаються, мають органи чуття."], "note": "Живі організми відрізняє від неживого: живлення, дихання, ріст, розмноження, рух, подразливість, обмін речовин."}, {"h": "Гриби", "p": ["Тіло гриба — <b>грибниця (міцелій)</b> у ґрунті; те, що збираємо, — <b>плодове тіло</b>: ніжка й шапинка. Розмножуються <b>спорами</b>. <b>Їстівні</b>: білий, лисички, підберезник, маслюк, опеньки. <b>Отруйні</b>: бліда поганка (смертельна), мухомор, несправжні опеньки. Правило: не знаєш — не бери; не збирай біля доріг."]}, {"h": "Рослини", "p": ["Групи: <b>водорості</b> (у воді), <b>мохи</b>, <b>папороті</b>, <b>хвойні</b> (сосна, ялина — насіння в шишках), <b>квіткові</b> (найбільше). Органи рослини: <b>корінь</b> (тримає, всмоктує воду), <b>стебло</b> (несе листки, проводить речовини), <b>листок</b> (фотосинтез, дихання), <b>квітка</b> (розмноження), <b>плід з насінням</b>."]}, {"h": "Тварини", "p": ["<b>Безхребетні</b> — без хребта: черви, молюски (слимак), членистоногі (комахи, павуки, раки). <b>Хребетні</b>: риби, амфібії (жаби), рептилії (ящірки, змії), птахи, ссавці (годують молоком, у т. ч. людина). За живленням: рослиноїдні, хижаки, всеїдні."]}], "remember": "Царства: бактерії (без ядра), гриби (без хлорофілу, спори, грибниця), рослини (фотосинтез), тварини (рухаються, готова їжа). Органи рослини: корінь, стебло, листок, квітка, плід. Тварини: безхребетні й хребетні (риби, амфібії, рептилії, птахи, ссавці).", "cards": [{"f": "Чотири царства живої природи", "b": "Бактерії, гриби, рослини, тварини."}, {"f": "Ознаки живого", "b": "Живлення, дихання, ріст, розмноження, рух, подразливість, обмін речовин."}, {"f": "Чим гриби відрізняються від рослин?", "b": "Не мають хлорофілу, не фотосинтезують, живляться готовими речовинами."}, {"f": "Грибниця (міцелій)", "b": "Справжнє тіло гриба — нитки в ґрунті; шапинка з ніжкою — плодове тіло."}, {"f": "Найотруйніший гриб України", "b": "Бліда поганка."}, {"f": "Органи квіткової рослини", "b": "Корінь, стебло, листок, квітка, плід із насінням."}, {"f": "Групи хребетних тварин", "b": "Риби, амфібії, рептилії, птахи, ссавці."}, {"f": "Ссавці", "b": "Тварини, що годують малят молоком; людина теж ссавець."}], "quiz": [{"t": "choice", "q": "Які організми не мають ядра в клітині?", "o": ["Гриби", "Бактерії", "Рослини"], "a": 1, "e": "Бактерії — без'ядерні."}, {"t": "choice", "q": "Чому гриби — не рослини?", "o": ["Вони не зелені і не фотосинтезують", "Вони маленькі", "Вони ростуть у лісі"], "a": 0, "e": "Живляться готовими речовинами."}, {"t": "choice", "q": "Що таке грибниця?", "o": ["Кошик для грибів", "Справжнє тіло гриба в ґрунті", "Шапинка"], "a": 1, "e": "Міцелій — нитки в ґрунті."}, {"t": "choice", "q": "Який гриб смертельно отруйний?", "o": ["Лисичка", "Бліда поганка", "Маслюк"], "a": 1, "e": "Бліда поганка."}, {"t": "choice", "q": "Чим розмножуються гриби?", "o": ["Насінням", "Спорами", "Поділом"], "a": 1, "e": "Спори."}, {"t": "choice", "q": "Який орган рослини всмоктує воду з ґрунту?", "o": ["Листок", "Корінь", "Квітка"], "a": 1, "e": "Корінь."}, {"t": "choice", "q": "У якому органі рослини відбувається фотосинтез?", "o": ["У листку", "У корені", "У плоді"], "a": 0, "e": "Листок зелений — хлоропласти."}, {"t": "choice", "q": "Сосна і ялина — це рослини…", "o": ["хвойні", "квіткові", "мохи"], "a": 0, "e": "Насіння в шишках."}, {"t": "choice", "q": "Хто з цих тварин безхребетний?", "o": ["Жаба", "Павук", "Горобець"], "a": 1, "e": "Павук — членистоногий."}, {"t": "choice", "q": "Хто годує малят молоком?", "o": ["Птахи", "Ссавці", "Риби"], "a": 1, "e": "Ссавці."}, {"t": "input", "q": "До якої групи тварин належить людина?", "a": ["ссавці", "ссавець"], "e": "Людина — ссавець."}]}, {"id": "dv-liudyna-rozmnozhennia", "sec": "Я — частина природи", "title": "Людина — організм. Розмноження рослин і тварин. Пристосування", "goal": "Ти знаєш системи органів людини, способи розмноження організмів і приклади пристосування до середовища.", "learn": [{"h": "Людина — частина природи", "p": ["Людина — багатоклітинний організм, ссавець. Системи органів: <b>опорно-рухова</b> (скелет, м'язи), <b>травна</b> (рот, шлунок, кишечник), <b>дихальна</b> (легені), <b>кровоносна</b> (серце, судини), <b>нервова</b> (мозок, нерви), <b>видільна</b> (нирки), <b>органи чуття</b> (очі, вуха, ніс, язик, шкіра). Здоров'я: рух, сон 9–10 годин, здорова їжа, гігієна, без шкідливих звичок."]}, {"h": "Розмноження", "p": ["<span class='term'>Розмноження</span> — відтворення собі подібних. <b>Статеве</b> — за участю двох батьків: у квіткових рослин — <b>запилення</b> (пилок на квітку — вітром, комахами) → <b>плід з насінням</b>; у тварин — яйця, ікра, живонародження. <b>Нестатеве</b> — від одного організму: поділ (бактерії, амеба), спори (гриби, мохи, папороті), <b>вегетативне</b> у рослин — живцями, бульбами (картопля), цибулинами, вусами (полуниця), відводками."], "note": "Насіння розповсюджують вітер (кульбаба, клен), тварини (реп'ях, ягоди), вода (кокос), сама рослина (горох вистрілює)."}, {"h": "Пристосування до середовища", "p": ["Організми пристосовані до умов життя. <b>Вода</b>: риби — плавці, зябра, обтічне тіло. <b>Повітря</b>: птахи — крила, пір'я, легкі кістки. <b>Ґрунт</b>: кріт — лопатоподібні лапи, малі очі. <b>Пустеля</b>: кактус запасає воду, верблюд — жир у горбах. <b>Холод</b>: густе хутро, жир, білий колір (полярний ведмідь). <b>Захисне забарвлення</b> (маскування), <b>сплячка</b> взимку (ведмідь, їжак), <b>міграція</b> (перелітні птахи)."]}], "remember": "Системи органів людини: опорно-рухова, травна, дихальна, кровоносна, нервова, видільна. Розмноження статеве (запилення → плід; яйця, ікра) і нестатеве (поділ, спори, вегетативне: живці, бульби, цибулини). Пристосування: плавці, крила, сплячка, міграція, маскування.", "cards": [{"f": "Системи органів людини", "b": "Опорно-рухова, травна, дихальна, кровоносна, нервова, видільна, органи чуття."}, {"f": "Розмноження", "b": "Відтворення організмом собі подібних."}, {"f": "Запилення", "b": "Перенесення пилку на квітку вітром або комахами; далі утворюється плід."}, {"f": "Вегетативне розмноження", "b": "Від частини рослини: живці, бульби (картопля), цибулини, вуса (полуниця)."}, {"f": "Хто розповсюджує насіння?", "b": "Вітер (кульбаба), тварини (реп'ях), вода (кокос), сама рослина (горох)."}, {"f": "Пристосування риб до води", "b": "Плавці, зябра, обтічне тіло, луска."}, {"f": "Сплячка / міграція", "b": "Сон узимку (ведмідь, їжак) / переліт у теплі краї (лелеки)."}, {"f": "Захисне забарвлення", "b": "Колір, що маскує тварину: зелений коник, білий зимовий заєць."}], "quiz": [{"t": "choice", "q": "До якої системи належить серце?", "o": ["Дихальної", "Кровоносної", "Нервової"], "a": 1, "e": "Серце і судини."}, {"t": "choice", "q": "Скільки годин сну потрібно п'ятикласнику?", "o": ["5–6", "9–10", "12–14"], "a": 1, "e": "9–10 годин."}, {"t": "choice", "q": "Картопля розмножується…", "o": ["бульбами", "спорами", "ікрою"], "a": 0, "e": "Вегетативно."}, {"t": "choice", "q": "Хто переносить пилок квіток?", "o": ["Комахи і вітер", "Риби", "Дощ"], "a": 0, "e": "Запилення."}, {"t": "choice", "q": "Як розповсюджується насіння кульбаби?", "o": ["Водою", "Вітром", "Тваринами"], "a": 1, "e": "Парашутики."}, {"t": "choice", "q": "Гриби розмножуються…", "o": ["насінням", "спорами", "бульбами"], "a": 1, "e": "Спори."}, {"t": "choice", "q": "Навіщо верблюду горби?", "o": ["Для краси", "Запас жиру", "Для води"], "a": 1, "e": "Жир — енергія і вода при розщепленні."}, {"t": "choice", "q": "Чому заєць узимку білий?", "o": ["Замерз", "Захисне забарвлення на снігу", "Постарів"], "a": 1, "e": "Маскування."}, {"t": "choice", "q": "Лелеки відлітають у теплі краї. Це…", "o": ["сплячка", "міграція", "линяння"], "a": 1, "e": "Міграція."}, {"t": "input", "q": "Як називається орган дихання риб?", "a": ["зябра"], "e": "Зябра."}]}, {"id": "dv-vsesvit-svitlo", "sec": "Я у Всесвіті", "title": "Всесвіт. Зорі й галактики. Світло", "goal": "Ти знаєш, що таке Всесвіт, галактика, зоря, і властивості світла.", "learn": [{"h": "Всесвіт", "p": ["<span class='term'>Всесвіт</span> — увесь простір з усіма тілами: зорями, планетами, галактиками. Виник близько <b>13,8 млрд років</b> тому (Великий вибух). <span class='term'>Галактика</span> — велетенське скупчення зір; наша — <b>Молочний Шлях</b> (Чумацький Шлях), у ній понад 100 млрд зір. Сонце — одна з них, на околиці галактики."]}, {"h": "Зорі", "p": ["<span class='term'>Зоря</span> — велетенська розжарена газова куля, що випромінює світло й тепло. Сонце — найближча зоря. Зорі різні за кольором (температурою): <b>червоні</b> — холодніші, <b>жовті</b> (Сонце), <b>білі і блакитні</b> — найгарячіші. Відстані — у <b>світлових роках</b> (шлях світла за рік). Найближча зоря після Сонця — Проксима Центавра, 4 світлових роки."]}, {"h": "Світло", "p": ["<span class='term'>Світло</span> — вид енергії; поширюється <b>прямолінійно</b> зі швидкістю <b>300 000 км/с</b> (від Сонця до Землі — 8 хвилин). <b>Джерела світла</b>: природні (Сонце, зорі, блискавка, світлячки) і штучні (лампа). Місяць — не джерело, він <b>відбиває</b> сонячне світло. Прозорі тіла пропускають світло (скло), непрозорі — утворюють <b>тінь</b>. Біле світло — суміш кольорів: <b>веселка</b> (дисперсія в краплях). <b>Відбивання</b> (дзеркало) і <b>заломлення</b> (ложка у воді здається зламаною)."]}], "remember": "Всесвіт — 13,8 млрд років; галактика Молочний Шлях; Сонце — зоря, жовта. Зорі: червоні — холодні, блакитні — гарячі. Світловий рік — відстань. Світло: 300 000 км/с, прямолінійно, 8 хв від Сонця; Місяць відбиває; тінь, веселка, відбивання, заломлення.", "cards": [{"f": "Всесвіт", "b": "Увесь простір з усіма тілами; вік — близько 13,8 млрд років."}, {"f": "Галактика", "b": "Велетенське скупчення зір; наша — Молочний (Чумацький) Шлях."}, {"f": "Зоря", "b": "Розжарена газова куля, що випромінює світло й тепло."}, {"f": "Найближча до Землі зоря", "b": "Сонце."}, {"f": "Які зорі найгарячіші?", "b": "Білі й блакитні; червоні — найхолодніші."}, {"f": "Світловий рік", "b": "Відстань, яку світло проходить за рік."}, {"f": "Швидкість світла", "b": "300 000 км/с; від Сонця до Землі — 8 хвилин."}, {"f": "Чи Місяць — джерело світла?", "b": "Ні, він відбиває сонячне світло."}, {"f": "Веселка", "b": "Розкладання білого світла на кольори в краплях дощу."}], "quiz": [{"t": "choice", "q": "Як називається наша галактика?", "o": ["Андромеда", "Молочний Шлях", "Сонячна"], "a": 1, "e": "Чумацький Шлях."}, {"t": "choice", "q": "Що таке зоря?", "o": ["Холодна планета", "Розжарена газова куля", "Уламок каменю"], "a": 1, "e": "Випромінює світло й тепло."}, {"t": "choice", "q": "Найближча до нас зоря —", "o": ["Полярна", "Сонце", "Сіріус"], "a": 1, "e": "Сонце."}, {"t": "choice", "q": "Які зорі найгарячіші?", "o": ["Червоні", "Жовті", "Блакитні"], "a": 2, "e": "Блакитні й білі."}, {"t": "choice", "q": "Скільки часу летить світло від Сонця до Землі?", "o": ["8 секунд", "8 хвилин", "8 годин"], "a": 1, "e": "Близько 8 хвилин."}, {"t": "choice", "q": "Швидкість світла:", "o": ["300 км/с", "300 000 км/с", "3 000 км/с"], "a": 1, "e": "300 тисяч км/с."}, {"t": "choice", "q": "Місяць світить, бо…", "o": ["сам розжарений", "відбиває світло Сонця", "у ньому лампа"], "a": 1, "e": "Відбите світло."}, {"t": "choice", "q": "Чому за непрозорим предметом утворюється тінь?", "o": ["Світло поширюється прямолінійно", "Світло важке", "Предмет холодний"], "a": 0, "e": "Прямолінійність."}, {"t": "choice", "q": "Веселка — це…", "o": ["відбивання", "розкладання білого світла на кольори", "тінь"], "a": 1, "e": "Дисперсія."}, {"t": "input", "q": "Як називається одиниця відстані — шлях світла за рік? … рік", "a": ["світловий", "світловий рік"], "e": "Світловий рік."}]}, {"id": "dv-soniachna-systema", "sec": "Я у Всесвіті", "title": "Сонячна система. Планети. Маса. Дослідження космосу", "goal": "Ти знаєш будову Сонячної системи, порядок планет, поняття маси й головні події космонавтики.", "learn": [{"h": "Сонячна система", "p": ["<span class='term'>Сонячна система</span> — Сонце і всі тіла, що обертаються навколо нього: 8 планет, їхні супутники, астероїди, комети, метеори. Планети: <b>Меркурій, Венера, Земля, Марс</b> (кам'янисті, малі) — <b>Юпітер, Сатурн, Уран, Нептун</b> (газові гіганти)."], "note": "Запам'ятовуй: <b>М</b>и <b>В</b>се <b>З</b>наємо: <b>М</b>ама <b>Ю</b>лі <b>С</b>іла <b>У</b>ранці <b>Н</b>а… (Меркурій, Венера, Земля, Марс, Юпітер, Сатурн, Уран, Нептун). Плутон з 2006 — карликова планета."}, {"h": "Цікаве про планети", "p": ["<b>Меркурій</b> — найближчий до Сонця, найменший. <b>Венера</b> — найгарячіша (парниковий ефект). <b>Земля</b> — єдина з життям і рідкою водою; супутник — Місяць. <b>Марс</b> — червона планета, два супутники. <b>Юпітер</b> — найбільший. <b>Сатурн</b> — кільця. <b>Уран, Нептун</b> — крижані, далекі. <b>Астероїди</b> — кам'яні брили, пояс між Марсом і Юпітером. <b>Комети</b> — крижані з хвостом. <b>Метеор</b> — «падаюча зірка»; <b>метеорит</b> — той, що впав на Землю."]}, {"h": "Маса і вага", "p": ["<span class='term'>Маса</span> — кількість речовини в тілі; одиниця — <b>кілограм</b>; вимірюють терезами; маса не змінюється, де б тіло не було. <b>Вага</b> — сила, з якою тіло тисне через притягання; на Місяці вага в 6 разів менша, маса — та сама. <b>Гравітація</b> (тяжіння) утримує планети біля Сонця й нас на Землі."]}, {"h": "Дослідження космосу", "p": ["<b>1957</b> — перший штучний супутник. <b>12 квітня 1961</b> — <b>Юрій Гагарін</b>, перша людина в космосі (День космонавтики). <b>1969</b> — <b>Ніл Армстронг</b> на Місяці. Українці: <b>Сергій Корольов</b> (конструктор ракет, з Житомира), <b>Юрій Кондратюк</b> (розрахував траєкторію польоту на Місяць), <b>Леонід Каденюк</b> — перший космонавт незалежної України (1997). <b>МКС</b> — Міжнародна космічна станція. Телескопи: Габбл, Джеймс Вебб."]}], "remember": "8 планет: Меркурій, Венера, Земля, Марс, Юпітер, Сатурн, Уран, Нептун. Юпітер найбільший, Сатурн — кільця, Венера найгарячіша. Маса — кг, не змінюється; вага — залежить від тяжіння. Гагарін — 12.04.1961; Армстронг — Місяць 1969; Корольов, Кондратюк, Каденюк (1997).", "cards": [{"f": "Планети за порядком від Сонця", "b": "Меркурій, Венера, Земля, Марс, Юпітер, Сатурн, Уран, Нептун."}, {"f": "Найбільша планета", "b": "Юпітер."}, {"f": "Планета з кільцями", "b": "Сатурн."}, {"f": "Червона планета", "b": "Марс."}, {"f": "Маса", "b": "Кількість речовини в тілі; кілограм; не змінюється."}, {"f": "Чим маса відрізняється від ваги?", "b": "Маса стала; вага — сила притягання, на Місяці в 6 разів менша."}, {"f": "Хто перша людина в космосі і коли?", "b": "Юрій Гагарін, 12 квітня 1961."}, {"f": "Перший космонавт незалежної України", "b": "Леонід Каденюк, 1997."}, {"f": "Сергій Корольов", "b": "Конструктор ракет, родом з Житомира."}, {"f": "Метеор і метеорит", "b": "Метеор — «падаюча зірка» в атмосфері; метеорит — те, що впало на Землю."}], "quiz": [{"t": "choice", "q": "Скільки планет у Сонячній системі?", "o": ["7", "8", "9"], "a": 1, "e": "Вісім; Плутон — карликова."}, {"t": "choice", "q": "Яка планета найближча до Сонця?", "o": ["Венера", "Меркурій", "Марс"], "a": 1, "e": "Меркурій."}, {"t": "choice", "q": "Яка планета найбільша?", "o": ["Сатурн", "Юпітер", "Земля"], "a": 1, "e": "Юпітер."}, {"t": "choice", "q": "Яка планета має яскраві кільця?", "o": ["Сатурн", "Марс", "Нептун"], "a": 0, "e": "Сатурн."}, {"t": "choice", "q": "Яка планета третя від Сонця?", "o": ["Венера", "Земля", "Марс"], "a": 1, "e": "Земля."}, {"t": "choice", "q": "Одиниця маси:", "o": ["Метр", "Кілограм", "Секунда"], "a": 1, "e": "Кілограм."}, {"t": "choice", "q": "Що станеться з масою космонавта на Місяці?", "o": ["Зменшиться в 6 разів", "Не зміниться", "Зникне"], "a": 1, "e": "Маса стала; зменшиться вага."}, {"t": "choice", "q": "Хто першим полетів у космос?", "o": ["Армстронг", "Гагарін", "Каденюк"], "a": 1, "e": "12 квітня 1961."}, {"t": "choice", "q": "Хто перший ступив на Місяць?", "o": ["Гагарін", "Ніл Армстронг", "Корольов"], "a": 1, "e": "1969 рік."}, {"t": "input", "q": "Хто перший космонавт незалежної України? Напиши прізвище.", "a": ["каденюк"], "e": "Леонід Каденюк, 1997."}, {"t": "choice", "q": "Що утримує планети біля Сонця?", "o": ["Магніт", "Гравітація", "Вітер"], "a": 1, "e": "Тяжіння."}]}, {"id": "dv-zemlia-budova-rukh", "sec": "Я на планеті Земля", "title": "Будова Землі. Літосфера. Рух Землі: доба і рік", "goal": "Ти знаєш внутрішню будову Землі, оболонки та чому змінюються день і ніч, пори року.", "learn": [{"h": "Будова Землі", "p": ["Земля — куля, трохи сплюснута. Зсередини: <b>ядро</b> (розжарене, залізо й нікель) → <b>мантія</b> (в'язка, гаряча) → <b>земна кора</b> (тверда, тонка). Кора і верх мантії — <span class='term'>літосфера</span>. Кора поділена на <b>літосферні плити</b>, що повільно рухаються — звідси землетруси й вулкани."]}, {"h": "Оболонки Землі", "p": ["<b>Літосфера</b> — кам'яна; <b>гідросфера</b> — водна (океани, річки, льодовики; 71% поверхні); <b>атмосфера</b> — повітряна (азот 78%, кисень 21%); <b>біосфера</b> — жива оболонка, де є життя."]}, {"h": "Рух Землі", "p": ["<b>Обертання навколо осі</b> — за <b>24 години (доба)</b>: день на боці, поверненому до Сонця, ніч — на протилежному. Вісь нахилена. <b>Обертання навколо Сонця</b> — за <b>365 діб (рік)</b>; раз на 4 роки — високосний (366). Через <b>нахил осі</b> Сонце по-різному освітлює півкулі — <b>пори року</b>: коли Північна півкуля нахилена до Сонця — літо, від Сонця — зима. У Південній півкулі навпаки."], "note": "22 червня — найдовший день (літнє сонцестояння), 22 грудня — найкоротший; 21 березня і 23 вересня — рівнодення (день = ніч)."}], "remember": "Земля: ядро → мантія → кора; літосфера, гідросфера (71%), атмосфера (азот 78%, кисень 21%), біосфера. Доба — оберт навколо осі (24 год) → день і ніч. Рік — навколо Сонця (365 діб) + нахил осі → пори року. 22 червня — найдовший день.", "cards": [{"f": "Внутрішня будова Землі", "b": "Ядро → мантія → земна кора."}, {"f": "Літосфера", "b": "Тверда кам'яна оболонка: земна кора і верх мантії."}, {"f": "Гідросфера", "b": "Водна оболонка; вода займає 71% поверхні."}, {"f": "Склад атмосфери", "b": "Азот 78%, кисень 21%, інші гази 1%."}, {"f": "Чому змінюються день і ніч?", "b": "Земля обертається навколо своєї осі за 24 години."}, {"f": "Чому змінюються пори року?", "b": "Земля обертається навколо Сонця за рік, а її вісь нахилена."}, {"f": "Високосний рік", "b": "366 діб, раз на 4 роки."}, {"f": "22 червня і 22 грудня", "b": "Найдовший день (літнє сонцестояння) і найкоротший (зимове)."}], "quiz": [{"t": "choice", "q": "Що в центрі Землі?", "o": ["Мантія", "Ядро", "Кора"], "a": 1, "e": "Розжарене ядро."}, {"t": "choice", "q": "Яка оболонка водна?", "o": ["Літосфера", "Гідросфера", "Атмосфера"], "a": 1, "e": "Гідросфера."}, {"t": "choice", "q": "Якого газу найбільше в атмосфері?", "o": ["Кисню", "Азоту", "Вуглекислого газу"], "a": 1, "e": "Азот — 78%."}, {"t": "choice", "q": "Скільки поверхні Землі займає вода?", "o": ["29%", "50%", "71%"], "a": 2, "e": "71%."}, {"t": "choice", "q": "Чому буває день і ніч?", "o": ["Земля обертається навколо осі", "Сонце вимикається", "Земля обертається навколо Сонця"], "a": 0, "e": "За 24 години."}, {"t": "choice", "q": "Чому змінюються пори року?", "o": ["Земля то ближче, то далі від Сонця", "Вісь Землі нахилена під час руху навколо Сонця", "Через Місяць"], "a": 1, "e": "Нахил осі."}, {"t": "input", "q": "За скільки діб Земля обертається навколо Сонця? Напиши число.", "a": ["365"], "e": "365 (366 у високосний)."}, {"t": "choice", "q": "Коли найдовший день у Північній півкулі?", "o": ["22 червня", "22 грудня", "21 березня"], "a": 0, "e": "Літнє сонцестояння."}, {"t": "choice", "q": "Коли в Україні зима, в Австралії…", "o": ["теж зима", "літо", "весна"], "a": 1, "e": "Південна півкуля — навпаки."}, {"t": "choice", "q": "Чому бувають землетруси?", "o": ["Рух літосферних плит", "Сильний вітер", "Дощі"], "a": 0, "e": "Плити рухаються."}]}, {"id": "dv-misiats-mahnetyzm-koordynaty", "sec": "Я на планеті Земля", "title": "Місяць і його вплив. Магнетизм. Географічні координати. Корисні копалини", "goal": "Ти знаєш фази Місяця, чому бувають припливи, як працює компас, що таке широта й довгота, і які є корисні копалини.", "learn": [{"h": "Місяць", "p": ["<span class='term'>Місяць</span> — природний супутник Землі, обертається навколо неї за ~29,5 діб. Сам не світить. <b>Фази</b>: новий місяць (не видно) → молодий (серп ніби «Р») → перша чверть → повня → остання чверть → старий (серп як «С»). <b>Припливи й відпливи</b> — через притягання Місяця до води океанів, двічі на добу. <b>Затемнення</b>: сонячне — Місяць між Сонцем і Землею; місячне — Земля між Сонцем і Місяцем."]}, {"h": "Магнетизм", "p": ["<span class='term'>Магніт</span> притягує залізо, нікель, кобальт; має два <b>полюси</b> — північний (N) і південний (S); однойменні відштовхуються, різнойменні притягуються. Земля — велетенський магніт, тому стрілка <b>компаса</b> показує на північ. Магнітне поле Землі захищає від космічного випромінювання; <b>полярне сяйво</b> — біля полюсів."]}, {"h": "Географічні координати", "p": ["<b>Екватор</b> ділить Землю на Північну й Південну півкулі. <b>Паралелі</b> — лінії, паралельні екватору; <b>меридіани</b> — від полюса до полюса; нульовий — Гринвіцький. <span class='term'>Широта</span> — відстань у градусах від екватора (0°–90°, північна/південна). <span class='term'>Довгота</span> — від нульового меридіана (0°–180°, східна/західна). Київ ≈ 50° пн. ш., 30° сх. д. Кілія ≈ 45° пн. ш., 29° сх. д."]}, {"h": "Корисні копалини", "p": ["<span class='term'>Корисні копалини</span> — природні речовини з земної кори, які видобувають. <b>Паливні</b>: вугілля (Донбас), нафта і газ (Прикарпаття, Полтавщина), торф. <b>Рудні</b>: залізна руда (Кривий Ріг), марганцева (Нікополь), уранова. <b>Нерудні</b>: сіль (Солотвино, Бахмут), граніт, глина, пісок, вапняк, каолін, сірка. <b>Родовище</b> — місце, де залягають; <b>шахта</b>, <b>кар'єр</b> — де видобувають."]}], "remember": "Місяць — супутник, 29,5 діб, фази, припливи. Магніт — N і S; компас — на північ, Земля — магніт. Широта — від екватора, довгота — від Гринвіча; Київ 50° пн. ш., 30° сх. д. Копалини: паливні (вугілля, нафта, газ), рудні (залізна руда — Кривий Ріг), нерудні (сіль, граніт).", "cards": [{"f": "Місяць", "b": "Природний супутник Землі; оберт за ~29,5 діб; сам не світить."}, {"f": "Фази Місяця", "b": "Новий → молодий → перша чверть → повня → остання чверть → старий."}, {"f": "Чому бувають припливи?", "b": "Притягання Місяця до води океанів."}, {"f": "Сонячне затемнення", "b": "Місяць стає між Сонцем і Землею."}, {"f": "Чому стрілка компаса показує на північ?", "b": "Земля — велетенський магніт."}, {"f": "Широта / довгота", "b": "Широта — від екватора (0–90°); довгота — від Гринвіцького меридіана (0–180°)."}, {"f": "Координати Києва", "b": "≈ 50° пн. ш., 30° сх. д."}, {"f": "Групи корисних копалин", "b": "Паливні (вугілля, нафта, газ), рудні (залізна руда), нерудні (сіль, граніт, глина)."}, {"f": "Де в Україні залізна руда? вугілля?", "b": "Кривий Ріг; Донбас."}], "quiz": [{"t": "choice", "q": "Місяць — це…", "o": ["зоря", "планета", "супутник Землі"], "a": 2, "e": "Природний супутник."}, {"t": "choice", "q": "Коли Місяць не видно на небі?", "o": ["У повню", "У новий місяць", "У першу чверть"], "a": 1, "e": "Новий місяць."}, {"t": "choice", "q": "Що викликає припливи?", "o": ["Вітер", "Притягання Місяця", "Тепло Сонця"], "a": 1, "e": "Місячне тяжіння."}, {"t": "choice", "q": "Сонячне затемнення буває, коли…", "o": ["Місяць між Сонцем і Землею", "Земля між Сонцем і Місяцем", "Сонце вимикається"], "a": 0, "e": "Місяць затуляє Сонце."}, {"t": "choice", "q": "Які полюси магніту притягуються?", "o": ["Однойменні", "Різнойменні", "Ніякі"], "a": 1, "e": "N до S."}, {"t": "choice", "q": "Чому компас показує на північ?", "o": ["Земля — магніт", "Стрілка важка", "Так зроблено"], "a": 0, "e": "Магнітне поле Землі."}, {"t": "choice", "q": "Широту відлічують від…", "o": ["екватора", "Гринвіча", "Північного полюса"], "a": 0, "e": "0° — екватор."}, {"t": "choice", "q": "Кривий Ріг відомий видобутком…", "o": ["вугілля", "залізної руди", "нафти"], "a": 1, "e": "Залізна руда."}, {"t": "choice", "q": "Сіль, граніт, глина — це копалини…", "o": ["паливні", "рудні", "нерудні"], "a": 2, "e": "Нерудні."}, {"t": "input", "q": "Як називається лінія, що ділить Землю на Північну й Південну півкулі?", "a": ["екватор"], "e": "Екватор."}]}, {"id": "dv-neboskhyl", "sec": "Я під небосхилом", "title": "Небосхил. Сузір'я. Орієнтування. Час і календар", "goal": "Ти знаєш головні сузір'я, як знайти Полярну зорю, орієнтуватись за Сонцем і Місяцем, і звідки календар.", "learn": [{"h": "Небосхил і сузір'я", "p": ["<span class='term'>Небосхил</span> — видима частина неба над горизонтом. Уночі видно зорі, планети (Венера — «вечірня зоря»), Місяць. <span class='term'>Сузір'я</span> — ділянка неба з групою зір; усього 88. Найвідоміші: <b>Велика Ведмедиця</b> («Великий Віз»), <b>Мала Ведмедиця</b> з <b>Полярною зорею</b>, <b>Кассіопея</b> (W), <b>Оріон</b> (зима), <b>Лебідь</b>. Зодіакальні сузір'я — на шляху Сонця (12)."]}, {"h": "Полярна зоря", "p": ["Знаходиться майже над Північним полюсом, тому <b>завжди вказує на північ</b>. Знайти: продовжити відстань між двома крайніми зорями «ковша» Великого Віза вгору ≈ 5 разів — потрапиш на Полярну (кінець ручки Малого Віза). <b>Мапа небосхилу</b> — карта зір для певної дати й часу."]}, {"h": "Орієнтування", "p": ["<b>За Сонцем</b>: сходить на сході, о 12–13 год — на півдні (тінь показує на північ), сідає на заході. <b>За Полярною зорею</b> — північ. <b>За Місяцем</b>: повня опівночі — на півдні. <b>За компасом</b>. <b>Місцеві ознаки</b> (ненадійні): мох з північного боку дерев, мурашники з південного, кільця на пні ширші з півдня."]}, {"h": "Час і календар", "p": ["<b>Доба</b> — оберт Землі навколо осі; <b>місяць</b> — від фаз Місяця (~29,5 діб); <b>рік</b> — оберт навколо Сонця (365,25 діб) → високосний кожен 4-й рік. <b>Календар</b>: юліанський (Юлій Цезар, 46 р. до н. е.) → <b>григоріанський</b> (папа Григорій XIII, 1582) — за ним живемо. Годинники: сонячний, водяний, пісковий, механічний, електронний. <b>Часові пояси</b> — 24; Україна — київський час."]}], "remember": "88 сузір'їв; Велика Ведмедиця (Великий Віз), Мала Ведмедиця з Полярною зорею — північ. Орієнтування: Сонце — схід/південь опівдні/захід; Полярна — північ; компас. Доба — оберт Землі, місяць — фази Місяця, рік — навколо Сонця. Григоріанський календар 1582.", "cards": [{"f": "Сузір'я", "b": "Ділянка неба з групою зір; усього 88."}, {"f": "Народна назва Великої Ведмедиці", "b": "Великий Віз."}, {"f": "Куди вказує Полярна зоря?", "b": "На північ; вона в сузір'ї Малої Ведмедиці."}, {"f": "Як знайти Полярну зорю?", "b": "Продовжити лінію між крайніми зорями ковша Великого Воза ≈ 5 разів."}, {"f": "Де Сонце опівдні?", "b": "На півдні; тінь показує на північ."}, {"f": "Звідки береться доба, місяць, рік?", "b": "Оберт Землі навколо осі; фази Місяця; оберт навколо Сонця."}, {"f": "Григоріанський календар", "b": "Введений 1582 року папою Григорієм XIII; ним користуємось."}, {"f": "Сузір'я у формі W", "b": "Кассіопея."}], "quiz": [{"t": "choice", "q": "Скільки сузір'їв на небі?", "o": ["12", "88", "1000"], "a": 1, "e": "88."}, {"t": "choice", "q": "Як у народі називають Велику Ведмедицю?", "o": ["Великий Віз", "Ківш Мала", "Хрест"], "a": 0, "e": "Великий Віз."}, {"t": "choice", "q": "У якому сузір'ї Полярна зоря?", "o": ["Велика Ведмедиця", "Мала Ведмедиця", "Оріон"], "a": 1, "e": "Кінець ручки Малого Воза."}, {"t": "choice", "q": "Куди вказує Полярна зоря?", "o": ["На південь", "На північ", "На захід"], "a": 1, "e": "Над Північним полюсом."}, {"t": "choice", "q": "Де Сонце опівдні?", "o": ["На сході", "На півдні", "На заході"], "a": 1, "e": "Тінь — на північ."}, {"t": "choice", "q": "Де сходить Сонце?", "o": ["На заході", "На сході", "На півночі"], "a": 1, "e": "Схід."}, {"t": "choice", "q": "З чого походить тривалість місяця?", "o": ["З фаз Місяця", "З оберту Землі", "З пір року"], "a": 0, "e": "~29,5 діб."}, {"t": "choice", "q": "За яким календарем живемо?", "o": ["Юліанським", "Григоріанським", "Місячним"], "a": 1, "e": "З 1582 року."}, {"t": "input", "q": "Скільки часових поясів на Землі? Напиши число.", "a": ["24"], "e": "24."}, {"t": "choice", "q": "Сузір'я у формі літери W —", "o": ["Кассіопея", "Лебідь", "Оріон"], "a": 0, "e": "Кассіопея."}]}, {"id": "dv-lis", "sec": "Я в лісі", "title": "Ліс як екосистема. Ланцюги живлення. Червона книга", "goal": "Ти знаєш, що таке екосистема, яруси лісу, ланцюг живлення і навіщо Червона книга.", "learn": [{"h": "Екосистема", "p": ["<span class='term'>Екосистема</span> — організми і середовище, пов'язані між собою (ліс, озеро, луг, степ). Складники: <b>продуценти</b> (рослини — творять органічні речовини), <b>консументи</b> (тварини — споживають), <b>редуценти</b> (бактерії, гриби — розкладають рештки). <b>Ланцюг живлення</b>: рослина → рослиноїдна тварина → хижак → редуценти. Приклад: дуб → гусінь → синиця → яструб."]}, {"h": "Ліс", "p": ["<b>Яруси лісу</b>: 1) високі дерева (дуб, сосна, ялина), 2) підлісок — кущі (ліщина, калина), 3) трави й папороті, 4) мохи, лишайники, гриби. Ліси України: <b>хвойні</b> (Полісся, Карпати — сосна, ялина), <b>листяні</b> (дуб, бук, липа), <b>мішані</b>. Ліси вкривають ~16% України (мало!)."]}, {"h": "Мешканці лісу", "p": ["Дерева: дуб, бук (Карпати), сосна, ялина, береза, граб. Тварини: лось, олень, кабан, вовк, лисиця, заєць, білка, їжак, борсук; птахи: дятел, сова, зозуля, сойка. Гриби, комахи — санітари лісу."]}, {"h": "Червона книга України", "p": ["<span class='term'>Червона книга</span> — перелік рідкісних і зникаючих видів рослин і тварин, які охороняє держава. Приклади: зубр, рись, ведмідь бурий, чорний лелека, лісовий кіт, беркут, дрохва; рослини: підсніжник, сон-трава, лілія лісова, тис ягідний, едельвейс. <b>Заповідник</b> — територія, де природу охороняють повністю (Асканія-Нова, Карпатський); <b>національний парк</b> — охорона + туризм (Синевир, Шацький)."]}], "remember": "Екосистема — організми + середовище; продуценти → консументи → редуценти. Ланцюг живлення: дуб → гусінь → синиця → яструб. Яруси лісу: дерева, кущі, трави, мохи. Червона книга — рідкісні види (зубр, рись, підсніжник). Заповідник — повна охорона.", "cards": [{"f": "Екосистема", "b": "Організми і середовище, пов'язані між собою: ліс, озеро, степ."}, {"f": "Продуценти / консументи / редуценти", "b": "Рослини творять речовини / тварини споживають / гриби й бактерії розкладають."}, {"f": "Ланцюг живлення", "b": "Рослина → рослиноїдна тварина → хижак: дуб → гусінь → синиця → яструб."}, {"f": "Яруси лісу", "b": "Дерева → кущі (підлісок) → трави → мохи, лишайники, гриби."}, {"f": "Види лісів", "b": "Хвойні, листяні, мішані."}, {"f": "Червона книга України", "b": "Перелік рідкісних і зникаючих видів, що охороняються."}, {"f": "Приклади з Червоної книги", "b": "Зубр, рись, чорний лелека, беркут; підсніжник, сон-трава, тис."}, {"f": "Заповідник", "b": "Територія повної охорони природи: Асканія-Нова, Карпатський."}], "quiz": [{"t": "choice", "q": "Хто в екосистемі творить органічні речовини з світла?", "o": ["Продуценти (рослини)", "Консументи", "Редуценти"], "a": 0, "e": "Рослини — виробники."}, {"t": "choice", "q": "Хто розкладає рештки організмів?", "o": ["Хижаки", "Гриби й бактерії", "Рослини"], "a": 1, "e": "Редуценти."}, {"t": "choice", "q": "Правильний ланцюг живлення:", "o": ["дуб → гусінь → синиця → яструб", "яструб → синиця → гусінь → дуб", "гусінь → дуб → яструб"], "a": 0, "e": "Від рослини до хижака."}, {"t": "choice", "q": "Що росте в найнижчому ярусі лісу?", "o": ["Дуби", "Кущі", "Мохи і лишайники"], "a": 2, "e": "Мохи, гриби."}, {"t": "choice", "q": "Сосна і ялина утворюють ліс…", "o": ["хвойний", "листяний", "мішаний"], "a": 0, "e": "Хвойний."}, {"t": "choice", "q": "Що таке Червона книга?", "o": ["Книга рецептів", "Перелік рідкісних видів під охороною", "Атлас"], "a": 1, "e": "Зникаючі види."}, {"t": "choice", "q": "Хто з цих тварин у Червоній книзі України?", "o": ["Заєць", "Зубр", "Ворона"], "a": 1, "e": "Зубр."}, {"t": "choice", "q": "Де природу охороняють повністю, без туризму?", "o": ["У парку міста", "У заповіднику", "У зоопарку"], "a": 1, "e": "Заповідник."}, {"t": "input", "q": "Яка весняна рослина з Червоної книги першою цвіте з-під снігу?", "a": ["підсніжник", "підсніжники"], "e": "Підсніжник."}, {"t": "choice", "q": "Яку частку України вкривають ліси?", "o": ["≈16%", "≈50%", "≈80%"], "a": 0, "e": "Мало — тому ліс треба берегти."}]}, {"id": "dv-lis-ekolohiia", "sec": "Я в лісі", "title": "Багатства лісу. Екологічні проблеми та збереження", "goal": "Ти знаєш, що дає ліс, які загрози йому шкодять і як поводитись у лісі.", "learn": [{"h": "Значення лісу", "p": ["Ліс — <b>«легені планети»</b>: дерева поглинають вуглекислий газ і виділяють кисень (фотосинтез). Утримує вологу, захищає від вітру й ерозії ґрунту, очищує повітря, дає дім тваринам. Багатства: деревина, гриби, ягоди, лікарські рослини, горіхи, живиця, мед; відпочинок і здоров'я."]}, {"h": "Екологічні проблеми", "p": ["<b>Вирубка</b> (особливо незаконна в Карпатах) → повені, зсуви. <b>Пожежі</b> — 90% через людей (багаття, недопалки, підпал сухої трави). <b>Сміття</b> — пластик розкладається сотні років. <b>Забруднення</b> повітря й води. <b>Браконьєрство</b>. Наслідок — зникнення видів, зміна клімату."]}, {"h": "Правила в лісі", "p": ["Не розпалювати багаття без потреби і не залишати його; не ламати гілки, не рвати рідкісні рослини; не забирати додому тварин і пташенят; забирати сміття з собою; не шуміти; не збирати незнайомі гриби; гуляти з дорослими, не сходити зі стежок. <b>Лісник</b> — охоронець лісу. <b>Лісовідновлення</b> — садити дерева."], "note": "Правило трьох R: <b>Reduce</b> (менше споживати), <b>Reuse</b> (використовувати повторно), <b>Recycle</b> (переробляти). Сортування сміття: папір, пластик, скло, метал, органіка."}], "remember": "Ліс — «легені планети»: кисень, волога, захист ґрунту, дім тваринам. Загрози: вирубка, пожежі (90% — людина), сміття, браконьєрство. Правила: не залишати вогонь і сміття, не ламати, не забирати тварин. 3R: менше, повторно, переробка.", "cards": [{"f": "Чому ліс — «легені планети»?", "b": "Дерева поглинають CO₂ і виділяють кисень."}, {"f": "Багатства лісу", "b": "Деревина, гриби, ягоди, лікарські рослини, горіхи, мед, відпочинок."}, {"f": "Головні загрози лісу", "b": "Вирубка, пожежі, сміття, забруднення, браконьєрство."}, {"f": "Хто спричиняє більшість лісових пожеж?", "b": "Людина — близько 90%."}, {"f": "Лісник", "b": "Людина, яка охороняє й доглядає ліс."}, {"f": "Правило 3R", "b": "Reduce — менше споживати, Reuse — повторно використовувати, Recycle — переробляти."}, {"f": "Скільки розкладається пластик у природі?", "b": "Сотні років."}], "quiz": [{"t": "choice", "q": "Чому ліс називають легенями планети?", "o": ["Він дихає", "Дерева виділяють кисень", "Там свіжо"], "a": 1, "e": "Фотосинтез."}, {"t": "choice", "q": "Що НЕ є багатством лісу?", "o": ["Гриби", "Нафта", "Ягоди"], "a": 1, "e": "Нафта — корисна копалина з надр."}, {"t": "choice", "q": "Хто найчастіше спричиняє лісові пожежі?", "o": ["Блискавка", "Людина", "Тварини"], "a": 1, "e": "Близько 90%."}, {"t": "choice", "q": "Незаконна вирубка лісу в Карпатах призводить до…", "o": ["повеней і зсувів", "більше грибів", "потепління взимку"], "a": 0, "e": "Ліс тримає воду й ґрунт."}, {"t": "choice", "q": "Ти знайшов у лісі пташеня. Що робити?", "o": ["Забрати додому", "Не чіпати, відійти", "Погодувати хлібом"], "a": 1, "e": "Батьки поруч; людина лише зашкодить."}, {"t": "choice", "q": "Що робити зі сміттям після пікніка?", "o": ["Закопати", "Забрати з собою", "Спалити"], "a": 1, "e": "Забрати."}, {"t": "choice", "q": "Що означає Recycle?", "o": ["Менше споживати", "Переробляти", "Викидати"], "a": 1, "e": "Переробка."}, {"t": "choice", "q": "Хто охороняє ліс?", "o": ["Лісник", "Егер", "Садівник"], "a": 0, "e": "Лісник."}, {"t": "input", "q": "Як називається садіння нових дерев замість вирубаних? Лісо…", "a": ["лісовідновлення", "відновлення"], "e": "Лісовідновлення."}]}, {"id": "dv-pole-grunt", "sec": "Я в полі", "title": "Лани і степи. Сільськогосподарські культури. Ґрунти", "goal": "Ти знаєш, що таке степ, які культури вирощують в Україні, і що таке ґрунт та чорнозем.", "learn": [{"h": "Степ", "p": ["<span class='term'>Степ</span> — рівнина з трав'яною рослинністю, майже без дерев; жарке сухе літо. Степова зона — південь України (в т. ч. Одещина, Бессарабія). Рослини: ковила, типчак, тюльпани, полин. Тварини: ховрах, бабак, тушканчик, полівки, дрохва, степовий орел, жайворонок, гадюка степова. Майже весь степ розорано — залишки охороняють (Асканія-Нова, Хомутовський степ)."]}, {"h": "Лани і культури", "p": ["<span class='term'>Лан (поле)</span> — оброблена земля для вирощування культур. Україна — «житниця»: <b>зернові</b> (пшениця, кукурудза, ячмінь, жито, гречка, рис на Херсонщині), <b>технічні</b> (соняшник — олія, цукровий буряк, ріпак, льон), <b>овочі</b>, <b>баштанні</b> (кавун — Херсонщина), <b>сади й виноградники</b> (Закарпаття, Одещина, Бессарабія). Україна — світовий лідер з експорту соняшникової олії."]}, {"h": "Ґрунт", "p": ["<span class='term'>Ґрунт</span> — верхній родючий шар землі. Складники: пісок, глина, <b>гумус</b> (перегній — рештки організмів; що більше гумусу — то родючіший), вода, повітря, живі організми (черви, бактерії). Утворюється тисячі років. <b>Чорнозем</b> — найродючіший ґрунт у світі; Україна має ~25% світових чорноземів. Інші ґрунти: піщані, глинисті, підзолисті (Полісся), каштанові (сухий степ)."]}, {"h": "Обробка ґрунту", "p": ["Оранка, боронування, сівба, полив (зрошення), удобрення (органічні — гній, компост; мінеральні), боротьба зі шкідниками, збирання врожаю. <b>Сівозміна</b> — чергування культур, щоб ґрунт не виснажувався. Загрози: <b>ерозія</b> (вимивання й вивітрювання), виснаження, забруднення хімікатами. Захист: лісосмуги, сівозміна, органічні добрива."]}], "remember": "Степ — трав'яна рівнина півдня; ковила, ховрах, дрохва; розорано, охороняють в Асканії-Новій. Культури: пшениця, кукурудза, соняшник (Україна — лідер олії), буряк, кавуни, виноград. Ґрунт — родючий шар; гумус — родючість; чорнозем — найродючіший, 25% світових в Україні. Сівозміна, лісосмуги — проти ерозії.", "cards": [{"f": "Степ", "b": "Трав'яна рівнина без дерев, сухе жарке літо; південь України."}, {"f": "Рослини й тварини степу", "b": "Ковила, типчак, тюльпани; ховрах, бабак, дрохва, степовий орел."}, {"f": "Головні зернові культури України", "b": "Пшениця, кукурудза, ячмінь, жито, гречка."}, {"f": "З якої культури Україна — світовий лідер олії?", "b": "Соняшник."}, {"f": "Ґрунт", "b": "Верхній родючий шар землі: пісок, глина, гумус, вода, повітря, організми."}, {"f": "Гумус", "b": "Перегній з решток організмів; що більше гумусу — то родючіший ґрунт."}, {"f": "Чорнозем", "b": "Найродючіший ґрунт світу; в Україні ~25% світових чорноземів."}, {"f": "Сівозміна", "b": "Чергування культур на полі, щоб ґрунт не виснажувався."}, {"f": "Ерозія ґрунту", "b": "Руйнування ґрунту водою і вітром; захист — лісосмуги."}], "quiz": [{"t": "choice", "q": "Степ — це…", "o": ["ліс без кущів", "трав'яна рівнина без дерев", "гори"], "a": 1, "e": "Південь України."}, {"t": "choice", "q": "Яка тварина степова?", "o": ["Ховрах", "Лось", "Білка"], "a": 0, "e": "Ховрах живе в норах у степу."}, {"t": "choice", "q": "Символічна рослина українського степу —", "o": ["ковила", "мох", "папороть"], "a": 0, "e": "Ковила."}, {"t": "choice", "q": "З чого роблять соняшникову олію?", "o": ["З буряка", "З соняшнику", "З льону"], "a": 1, "e": "Технічна культура."}, {"t": "choice", "q": "Що робить ґрунт родючим?", "o": ["Пісок", "Гумус", "Каміння"], "a": 1, "e": "Перегній."}, {"t": "choice", "q": "Найродючіший ґрунт —", "o": ["піщаний", "чорнозем", "глинистий"], "a": 1, "e": "Чорнозем."}, {"t": "choice", "q": "Яка частка світових чорноземів в Україні?", "o": ["≈5%", "≈25%", "≈70%"], "a": 1, "e": "Близько чверті."}, {"t": "choice", "q": "Навіщо сівозміна?", "o": ["Щоб було красиво", "Щоб ґрунт не виснажувався", "Щоб більше води"], "a": 1, "e": "Різні культури — різні речовини."}, {"t": "choice", "q": "Що захищає поля від вітрової ерозії?", "o": ["Лісосмуги", "Асфальт", "Пестициди"], "a": 0, "e": "Смуги дерев уздовж полів."}, {"t": "input", "q": "Де в Україні охороняють залишки степу? Заповідник Асканія-…", "a": ["нова", "асканія-нова"], "e": "Асканія-Нова."}]}, {"id": "dv-hory-zvuk", "sec": "Я в горах", "title": "Гори. Гірські породи. Явища в горах. Звук", "goal": "Ти знаєш гори Землі й України, види гірських порід, небезпеки в горах і властивості звуку.", "learn": [{"h": "Гори", "p": ["<span class='term'>Гори</span> — ділянки суходолу, підняті понад 500 м. Утворюються при русі літосферних плит (складчасті), вулканами. Частини: підніжжя, схил, вершина, гребінь, перевал. Найвищі гори світу — <b>Гімалаї</b>, гора <b>Еверест (Джомолунгма) 8849 м</b>. Європа — Альпи (Монблан 4810 м). Україна: <b>Карпати</b> — найвища <b>Говерла 2061 м</b>; <b>Кримські гори</b> — Роман-Кош 1545 м. Пояси: ліси → полонини (луки) → скелі й сніг."]}, {"h": "Гірські породи", "p": ["<span class='term'>Гірські породи</span> — речовини, з яких складається земна кора. <b>Магматичні</b> — з застиглої магми (граніт, базальт, обсидіан). <b>Осадові</b> — з осадів і решток організмів (пісок, глина, вапняк, крейда, вугілля, сіль). <b>Метаморфічні</b> — змінені тиском і температурою (мармур із вапняку, гнейс із граніту). <b>Мінерали</b> — складники порід (кварц, польовий шпат, слюда; коштовні — алмаз, рубін)."]}, {"h": "Явища в горах", "p": ["<b>Лавина</b> — сходження снігу; <b>сель</b> — потік грязі й каміння; <b>зсув</b>, <b>каменепад</b>, <b>землетрус</b>, <b>вулкан</b> (лава, попіл). Погода змінюється швидко: з висотою холоднішає (на кожні 1000 м ≈ на 6 °C), тиск падає, повітря розріджене. Правила: ходити групою зі знаючим провідником, теплий одяг і вода, не сходити зі стежки, не кричати біля снігових схилів, повідомляти маршрут."]}, {"h": "Звук", "p": ["<span class='term'>Звук</span> — коливання, що поширюються хвилями в повітрі, воді, твердих тілах; у вакуумі (космосі) звуку немає. Швидкість у повітрі ≈ <b>340 м/с</b> (тому блискавку бачимо раніше, ніж чуємо грім). У воді й металі — швидше. <b>Луна (ехо)</b> — відбитий звук від скель, стін. <b>Гучність</b> вимірюють у <b>децибелах</b>; понад 85 дБ шкодить слуху. <b>Висота</b> звуку залежить від частоти коливань. Тварини чують ультразвук (кажани, дельфіни)."]}], "remember": "Гори понад 500 м; Еверест 8849 м; Говерла 2061 м (Карпати); Роман-Кош 1545 м (Крим). Породи: магматичні (граніт), осадові (вапняк, вугілля), метаморфічні (мармур). Лавина, сель, зсув. Звук — коливання, 340 м/с у повітрі, у вакуумі немає; луна; децибели.", "cards": [{"f": "Найвища вершина світу", "b": "Еверест (Джомолунгма), 8849 м, Гімалаї."}, {"f": "Найвища гора України", "b": "Говерла, 2061 м, Карпати."}, {"f": "Найвища точка Криму", "b": "Роман-Кош, 1545 м."}, {"f": "Три групи гірських порід", "b": "Магматичні (граніт), осадові (вапняк, вугілля), метаморфічні (мармур)."}, {"f": "З чого утворюється мармур?", "b": "З вапняку під тиском і температурою."}, {"f": "Лавина / сель", "b": "Сходження снігу / потік грязі й каміння."}, {"f": "Як змінюється температура з висотою?", "b": "Знижується ≈ на 6 °C на кожні 1000 м."}, {"f": "Швидкість звуку в повітрі", "b": "≈ 340 м/с; у вакуумі звук не поширюється."}, {"f": "Луна", "b": "Відбитий від перешкоди звук."}, {"f": "У чому вимірюють гучність?", "b": "У децибелах; понад 85 дБ шкідливо."}], "quiz": [{"t": "choice", "q": "Найвища гора України —", "o": ["Роман-Кош", "Говерла", "Піп Іван"], "a": 1, "e": "2061 м."}, {"t": "choice", "q": "Найвища вершина світу —", "o": ["Монблан", "Еверест", "Ельбрус"], "a": 1, "e": "8849 м."}, {"t": "choice", "q": "Граніт — порода…", "o": ["магматична", "осадова", "метаморфічна"], "a": 0, "e": "З застиглої магми."}, {"t": "choice", "q": "Вапняк, крейда, вугілля — породи…", "o": ["магматичні", "осадові", "метаморфічні"], "a": 1, "e": "З осадів і решток організмів."}, {"t": "choice", "q": "Мармур утворюється з…", "o": ["граніту", "вапняку", "піску"], "a": 1, "e": "Метаморфічна порода."}, {"t": "choice", "q": "Що таке сель?", "o": ["Снігова лавина", "Потік грязі й каміння", "Сильний вітер"], "a": 1, "e": "Грязекам'яний потік."}, {"t": "choice", "q": "Як змінюється температура при підйомі в гори?", "o": ["Тепліє", "Холоднішає", "Не змінюється"], "a": 1, "e": "≈6 °C на 1000 м."}, {"t": "choice", "q": "Чому грім чуємо після блискавки?", "o": ["Звук повільніший за світло", "Грім запізнюється навмисне", "Так здається"], "a": 0, "e": "340 м/с проти 300 000 км/с."}, {"t": "choice", "q": "Чи чутно звук у космосі?", "o": ["Так", "Ні, у вакуумі звук не поширюється"], "a": 1, "e": "Немає середовища для коливань."}, {"t": "input", "q": "Як називається відбитий від скель звук?", "a": ["луна", "ехо", "відлуння"], "e": "Луна (ехо)."}, {"t": "choice", "q": "Гучність вимірюють у…", "o": ["метрах", "децибелах", "градусах"], "a": 1, "e": "Децибели."}]}, {"id": "dv-pustelia", "sec": "Я в пустелі", "title": "Пустелі та їх екосистеми", "goal": "Ти знаєш, що таке пустеля, які бувають пустелі, і як організми в них виживають.", "learn": [{"h": "Пустеля", "p": ["<span class='term'>Пустеля</span> — територія з дуже малою кількістю опадів (менше 250 мм на рік), бідною рослинністю. Бувають <b>піщані</b> (бархани, дюни), <b>кам'янисті</b>, <b>глинисті</b>, <b>солончакові</b> і навіть <b>крижані</b> (Антарктида — найбільша пустеля світу). Найбільша жарка — <b>Сахара</b> (Африка). Інші: Гобі (Азія), Атакама (найсухіша, Південна Америка), Аравійська. В Україні — <b>Олешківські піски</b> (Херсонщина) — найбільший піщаний масив Європи, напівпустеля."]}, {"h": "Клімат", "p": ["Удень спека до +50 °C, уночі холодно (до 0 °C) — велика добова різниця, бо немає хмар і вологи. Сильні вітри, піщані бурі. <b>Оаза</b> — місце з водою (джерело, річка), де ростуть пальми і живуть люди. <b>Міраж</b> — оптичний обман через нагріте повітря."]}, {"h": "Пристосування організмів", "p": ["Рослини: <b>кактуси</b> запасають воду в стеблі, замість листків — колючки (менше випаровування); <b>саксаул</b>, <b>верблюжа колючка</b> — корені до 20 м; насіння чекає дощу роками. Тварини: <b>верблюд</b> — жир у горбах, довго без води, широкі ступні, закриваються ніздрі; <b>фенек</b> (лисичка з великими вухами — охолодження); ящірки, змії, скорпіони, тушканчики — активні вночі, ховаються в норах; <b>ефа</b> закопується в пісок."]}], "remember": "Пустеля — опадів менше 250 мм; піщані, кам'янисті, крижані (Антарктида — найбільша). Сахара — найбільша жарка, Атакама — найсухіша. Олешківські піски — в Україні. Оаза — вода. Кактус запасає воду, колючки; верблюд — жир у горбах; тварини активні вночі.", "cards": [{"f": "Пустеля", "b": "Територія з опадами менше 250 мм на рік і бідною рослинністю."}, {"f": "Найбільша жарка пустеля", "b": "Сахара (Африка)."}, {"f": "Найбільша пустеля світу взагалі", "b": "Антарктида — крижана пустеля."}, {"f": "Найсухіша пустеля", "b": "Атакама (Південна Америка)."}, {"f": "Пустеля в Україні", "b": "Олешківські піски на Херсонщині."}, {"f": "Оаза", "b": "Місце в пустелі з водою, де є рослини й життя."}, {"f": "Як кактус виживає без води?", "b": "Запасає воду в стеблі; колючки замість листків зменшують випаровування."}, {"f": "Пристосування верблюда", "b": "Жир у горбах, довго без води, широкі ступні, ніздрі закриваються від піску."}, {"f": "Чому в пустелі вночі холодно?", "b": "Немає хмар і вологи — тепло швидко йде."}], "quiz": [{"t": "choice", "q": "Скільки опадів у пустелі?", "o": ["Менше 250 мм на рік", "Близько 1000 мм", "Понад 2000 мм"], "a": 0, "e": "Дуже мало."}, {"t": "choice", "q": "Найбільша жарка пустеля —", "o": ["Гобі", "Сахара", "Атакама"], "a": 1, "e": "Сахара в Африці."}, {"t": "choice", "q": "Чи буває пустеля крижаною?", "o": ["Ні", "Так, Антарктида — найбільша пустеля"], "a": 1, "e": "Опадів там дуже мало."}, {"t": "choice", "q": "Де в Україні пустеля?", "o": ["Олешківські піски", "Карпати", "Полісся"], "a": 0, "e": "Херсонщина."}, {"t": "choice", "q": "Що таке оаза?", "o": ["Піщана гора", "Місце з водою в пустелі", "Сильний вітер"], "a": 1, "e": "Джерело життя."}, {"t": "choice", "q": "Навіщо кактусу колючки замість листків?", "o": ["Для краси", "Менше випаровування води", "Щоб ловити комах"], "a": 1, "e": "Економія води."}, {"t": "choice", "q": "Що у верблюда в горбах?", "o": ["Вода", "Жир", "Пісок"], "a": 1, "e": "Жир — запас енергії."}, {"t": "choice", "q": "Чому пустельні тварини активні вночі?", "o": ["Удень занадто спекотно", "Бояться сонця", "Люблять зорі"], "a": 0, "e": "Ховаються від спеки."}, {"t": "choice", "q": "Чому вночі в пустелі холодно?", "o": ["Немає хмар і вологи — тепло швидко йде", "Дме з півночі", "Земля замерзає"], "a": 0, "e": "Велика добова різниця температур."}, {"t": "input", "q": "Як називається піщаний пагорб у пустелі?", "a": ["бархан", "дюна", "бархани"], "e": "Бархан (дюна)."}]}]};

// ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
