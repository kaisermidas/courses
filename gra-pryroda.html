<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

  .screen{display:none}.screen.on{display:block}
  header.hero{margin:6px 0 16px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px}
  .task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap}

  .item{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}

  .verdict.warn{background:var(--bad-soft);color:#8F2018}
  .why{margin-top:12px;padding:13px 15px;border:1px solid var(--line);border-left:4px solid var(--volt);
    border-radius:0 12px 12px 0;background:#fff;font-size:15px;display:none}
  .why.on{display:block}
  .why b{display:block;margin-bottom:4px}
  .opts{display:grid;gap:8px;margin-top:2px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-size:16px}
  .opt.good{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}

  .chip2.on{border-color:var(--accent);background:var(--accent-soft)}
  .chip2.used{opacity:.35}
  .line{min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px;
    font-size:17px;text-align:center;color:var(--ink-2);line-height:1.7}
  .line.full{border-style:solid;color:var(--ink)}
  .line.good{border-color:var(--ok);background:var(--ok-soft);color:#14603E}
  .line.bad{border-color:var(--bad);background:var(--bad-soft);color:#8F2018}

  .groups button{border:1px solid var(--line);border-radius:12px;padding:14px 10px;background:#fff;font-size:16px}

</head>

</div>

/* ---------- спільна черга повторення Арени (однакова в усіх модулях) ----------
   Помилка в будь-якій грі лягає сюди, а Щоденка перепитує її назавтра,
   потім через 3, 7 і 21 день. Повний текст картки — у localStorage,
   короткий список — у CloudStorage, щоб не впертися в ліміт 4 КБ.        */
const SRS_KEY='sovenya-srs-v1', SRS_STEPS=[1,3,7,21];
function srsDay(n){ const t=new Date(), d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+(n||0));
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function srsLoad(){ try{ const q=JSON.parse(localStorage.getItem(SRS_KEY)||'[]'); return Array.isArray(q)?q:[]; }catch(e){ return []; } }
function srsSave(q){
  q=q.slice(-40);
  try{ localStorage.setItem(SRS_KEY, JSON.stringify(q)); }catch(e){}
  if(tg && tg.CloudStorage){
    const idx=q.map(c=>({i:c.i,m:c.m,d:c.d,s:c.s}));
    let s=JSON.stringify(idx);
    while(s.length>3800 && idx.length){ idx.shift(); s=JSON.stringify(idx); }
    try{ tg.CloudStorage.setItem(SRS_KEY, s, ()=>{}); }catch(e){}
  }
}
function srsMiss(id, mod, card){
  if(!id || !card) return;
  const q=srsLoad(), ex=q.find(x=>x.i===id);
  if(ex){ ex.s=0; ex.d=srsDay(1); ex.c=card; ex.m=mod; }
  else q.push({i:id, m:mod, c:card, s:0, d:srsDay(1)});
  srsSave(q);
}
function srsHit(id){
  const q=srsLoad(), k=q.findIndex(x=>x.i===id); if(k<0) return;
  const it=q[k]; it.s=(it.s||0)+1;
  if(it.s>=SRS_STEPS.length) q.splice(k,1); else it.d=srsDay(SRS_STEPS[it.s]);
  srsSave(q);
}
function srsDue(){ const t=srsDay(0); return srsLoad().filter(x=>x.d<=t && x.c); }

function go(id){ $$('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0); }

 {n:'🪲 жук', g:2, r:'Найбільша група комах у світі — понад 350 тисяч видів.'},
 {n:'🐟 щука', g:3, r:'Хижа річкова риба, дихає зябрами.'},
 {n:'🐠 окунь', g:3, r:'Має плавальний міхур, який тримає рибу на глибині без зусиль.'},
 {n:'🦈 акула', g:3, r:'Риба, хоч і величезна: зябра, плавці, луска. Плавального міхура не має, тому мусить рухатися.'},
 {n:'🐡 короп', g:3, r:'Прісноводна риба, яку розводять у ставках.'}
];
const MOON=['Новий місяць','Молодий серп','Перша чверть','Зростаючий опуклий',
            'Повний місяць','Спадний опуклий','Остання чверть','Старий серп'];
function moonSVG(k){
  const R=58, cx=70, cy=70, LIGHT='#F4E7B8', DARK='#39445A';
  const frac=k/8, a=frac*2*Math.PI, rx=Math.abs(R*Math.cos(a));
  const waxing = frac<0.5;
  const half = 'M '+cx+' '+(cy-R)+' A '+R+' '+R+' 0 0 '+(waxing?1:0)+' '+cx+' '+(cy+R)+' Z';
  return '<svg viewBox="0 0 140 140" width="150" height="150">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="'+DARK+'"/>'+
    '<path d="'+half+'" fill="'+LIGHT+'"/>'+
    '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+R+'" fill="'+(Math.cos(a)>0?DARK:LIGHT)+'"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#C9C6BB" stroke-width="2"/></svg>';
}

/* ================= ГОЛОВНА ================= */
const GAMES=[
 {id:'planets', ic:'🪐', t:'Сонячна система', s:'Постав планети за відстанню від Сонця', n:8},
 {id:'chain',   ic:'🌾', t:'Ланцюг живлення', s:'Склади ланцюг від сонця до хижака', n:6},
 {id:'predict', ic:'🔬', t:'Що станеться?', s:'Спершу передбач, потім дивись', n:6},
 {id:'sort',    ic:'🐾', t:'Хто є хто', s:'Розклади тварин по групах', n:10},
 {id:'moon',    ic:'🌙', t:'Фази Місяця', s:'Впізнай фазу і скажи, що буде далі', n:8}
];
function homeDraw(){
  const box=$('#home-list'); box.innerHTML='';
  GAMES.forEach(g=>{
    const B=PR.best||{};
    const b=document.createElement('button'); b.className='item';
    const sc = B[g.id]!==undefined ? B[g.id]+'/'+g.n : '';
    b.innerHTML='<span class="ic">'+g.ic+'</span><span class="tx"><b>'+g.t+'</b><span>'+g.s+'</span></span><span class="sc">'+sc+'</span>';
    b.onclick=()=>startRun(g.id); box.appendChild(b);
  });
}

/* ================= РУШІЙ ================= */
let KIND='', ITEMS=[], I=0, RIGHT=0, LOG=[], order=[], sel=null;

function startRun(kind){
  KIND=kind; I=0; RIGHT=0; LOG=[];
  const g=GAMES.find(x=>x.id===kind);
  if(kind==='planets') ITEMS=[0];                                  // одна задача — уся система
  if(kind==='chain')   ITEMS=shuffle(CHAINS).slice(0,g.n);
  if(kind==='predict') ITEMS=shuffle(PREDICT).slice(0,g.n);
  if(kind==='sort')    ITEMS=shuffle(CREATURES).slice(0,g.n);
  if(kind==='moon')    ITEMS=shuffle([0,1,2,3,4,5,6,7]).map(k=>({k, next:Math.random()<0.4}));
  go('s-play'); renderItem();
}
function dots(){
  const total = KIND==='planets' ? PLANETS.length : ITEMS.length;
  const done  = KIND==='planets' ? order.length : ITEMS.length;
  $('#p-dots').innerHTML = KIND==='planets' ? '' : ITEMS.map((_,i)=>{
    const l=LOG[i]; return '<span class="dot '+(l===undefined?(i===I?'now':''):(l?'g':'r'))+'"></span>'; }).join('');
  $('#p-sc').textContent = KIND==='planets' ? order.length+'/8' : RIGHT+'/'+ITEMS.length;
}
function renderItem(){
  order=[]; sel=null; dots();
  $('#p-verdict').className='verdict'; $('#p-why').className='why';
  $('#p-act').disabled=false; $('#p-act').style.display='inline-block';
  $('#p-act').textContent='Перевірити'; $('#p-act').onclick=checkItem;
  const b=$('#p-body');

  if(KIND==='planets'){
    $('#p-task').innerHTML='Постав вісім планет за порядком — від найближчої до Сонця. Тисни по черзі.';
    b.innerHTML='<div class="line" id="p-line">…</div><div class="chips">'+
      shuffle([...PLANETS.keys()]).map(i=>'<button class="chip2" data-i="'+i+'">'+PLANETS[i].e+' '+PLANETS[i].n+'</button>').join('')+'</div>';
    bindChips(b, PLANETS.map(p=>p.n));
  }
  if(KIND==='chain'){
    const it=ITEMS[I];
    $('#p-task').innerHTML='Склади ланцюг живлення: хто кого їсть. Починай із джерела енергії.';
    b.innerHTML='<div class="line" id="p-line">…</div><div class="chips">'+
      shuffle([...it.c.keys()]).map(i=>'<button class="chip2" data-i="'+i+'">'+it.c[i]+'</button>').join('')+'</div>';
    bindChips(b, it.c);
  }
  if(KIND==='predict'){
    const it=ITEMS[I];
    $('#p-task').innerHTML=it.q;
    b.innerHTML='<div class="opts">'+it.o.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>';
    $$('.opt',b).forEach(el=>el.onclick=()=>{ sel=+el.dataset.i; checkItem(); });
    $('#p-act').style.display='none';
  }
  if(KIND==='sort'){
    const it=ITEMS[I];
    $('#p-task').innerHTML='До якої групи належить ця тварина?';
    b.innerHTML='<div class="card">'+it.n+'</div><div class="groups">'+
      GROUPS.map((g,i)=>'<button data-i="'+i+'">'+g+'</button>').join('')+'</div>';
    $$('.groups button',b).forEach(el=>el.onclick=()=>{ sel=+el.dataset.i; checkItem(); });
    $('#p-act').style.display='none';
  }
  if(KIND==='moon'){
    const it=ITEMS[I];
    $('#p-task').innerHTML = it.next
      ? 'Ось фаза сьогодні. Яка фаза буде <b>приблизно через два тижні</b>?'
      : 'Як називається ця фаза Місяця?';
    const right = it.next ? (it.k+4)%8 : it.k;
    const wrongs=shuffle([0,1,2,3,4,5,6,7].filter(x=>x!==right)).slice(0,3);
    const opts=shuffle([right,...wrongs]);
    b.innerHTML=moonSVG(it.k)+'<div class="opts">'+
      opts.map(o=>'<button class="opt" data-i="'+o+'">'+MOON[o]+'</button>').join('')+'</div>';
    $$('.opt',b).forEach(el=>el.onclick=()=>{ sel=+el.dataset.i; checkItem(); });
    $('#p-act').style.display='none';
  }
}
function bindChips(b, labels){
  $$('.chip2',b).forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    if(order.includes(i)) order=order.filter(x=>x!==i); else order.push(i);
    $$('.chip2',b).forEach(x=>x.classList.toggle('used',order.includes(+x.dataset.i)));
    const L=$('#p-line'); L.textContent = order.length ? order.map(k=>labels[k]).join(' → ') : '…';
    L.classList.toggle('full', order.length>0);
    dots();
  });
}
function checkItem(){
  let ok=false;
  if(KIND==='planets'){ if(order.length<PLANETS.length) return; ok=order.every((v,i)=>v===i); }
  if(KIND==='chain'){ const it=ITEMS[I]; if(order.length<it.c.length) return; ok=order.every((v,i)=>v===i); }
  if(KIND==='predict'){ if(sel===null) return; ok = sel===ITEMS[I].a; }
  if(KIND==='sort'){ if(sel===null) return; ok = sel===ITEMS[I].g; }
  if(KIND==='moon'){ const it=ITEMS[I]; const right = it.next?(it.k+4)%8:it.k; if(sel===null) return; ok = sel===right; }
  LOG[I]=ok; if(ok) RIGHT++; buzz(ok); dots();
  srsNat(ITEMS[I], ok);
  const v=$('#p-verdict'); v.className='verdict on '+(ok?'good':'warn');

  if(KIND==='planets'){
    const L=$('#p-line'); L.className='line full '+(ok?'good':'bad');
    L.textContent=PLANETS.map(p=>p.n).join(' → ');
    $$('.chip2').forEach(x=>x.disabled=true);
    v.textContent = ok?'Порядок точний.':'Ні. Правильний порядок показано вище.';
    $('#p-why').className='why on';
    $('#p-why').innerHTML='<b>Про кожну</b>'+PLANETS.map(p=>'<div style="margin:5px 0">'+p.e+' <b>'+p.n+'</b> — '+p.r+'</div>').join('');
    $('#p-act').textContent='Підсумок'; $('#p-act').onclick=()=>{ RIGHT=ok?8:0; LOG=[ok]; ITEMS=[0]; endRun(8); };
    return;
  }
  if(KIND==='chain'){
    const it=ITEMS[I];
    const L=$('#p-line'); L.className='line full '+(ok?'good':'bad'); L.textContent=it.c.join(' → ');
    $$('.chip2').forEach(x=>x.disabled=true);
    v.textContent = ok?'Так, саме в такому порядку.':'Ні. Правильний ланцюг показано вище.';
    $('#p-why').className='why on'; $('#p-why').innerHTML='<b>Як це працює</b>'+it.r;
  }
  if(KIND==='predict'){
    const it=ITEMS[I];
    $$('.opt').forEach((el,i)=>{ el.disabled=true;
      if(i===it.a) el.classList.add('good'); else if(!ok && i===sel) el.classList.add('bad'); });
    v.textContent = ok?'Так і буде.':'Ні — правильне позначено зеленим.';
    $('#p-why').className='why on'; $('#p-why').innerHTML='<b>Чому так</b>'+it.r;
  }
  if(KIND==='sort'){
    const it=ITEMS[I];
    $$('.groups button').forEach((el,i)=>{ el.disabled=true;
      if(i===it.g) el.style.cssText='border-color:var(--ok);background:var(--ok-soft)';
      else if(!ok && i===sel) el.style.cssText='border-color:var(--bad);background:var(--bad-soft)'; });
    v.innerHTML = (ok?'Так. ':'Ні. ')+'Це <b>'+GROUPS[it.g].toLowerCase()+'</b>.';
    $('#p-why').className='why on'; $('#p-why').innerHTML='<b>Чому</b>'+it.r;
  }
  if(KIND==='moon'){
    const it=ITEMS[I], right=it.next?(it.k+4)%8:it.k;
    $$('.opt').forEach(el=>{ el.disabled=true; const i=+el.dataset.i;
      if(i===right) el.classList.add('good'); else if(!ok && i===sel) el.classList.add('bad'); });
    v.innerHTML = (ok?'Так. ':'Ні. ')+'Правильно — <b>'+MOON[right]+'</b>.';
    $('#p-why').className='why on';
    $('#p-why').innerHTML='<b>Як рахувати</b>Повний оберт фаз триває близько 29 діб, тож через два тижні фаза стає протилежною: новий місяць ↔ повний, перша чверть ↔ остання. Молодий серп світиться справа, старий — зліва; це підказка, зростає Місяць чи спадає.';
  }
  $('#p-act').style.display='inline-block'; $('#p-act').disabled=false;
  $('#p-act').textContent = I===ITEMS.length-1 ? 'Підсумок' : 'Далі →';
  $('#p-act').onclick=()=>{ I++; if(I>=ITEMS.length) endRun(); else renderItem(); };
}
function srsNat(it, ok){
  const S='🌿 Довкілля';
  let id=null, card=null;
  if(KIND==='predict'){ id='nat:pred:'+it.q.slice(0,40);
    card={sub:S,tag:'Що станеться',type:'choice',q:it.q,o:it.o,a:it.a,
      hint:'Уяви дослід крок за кроком.', why:it.r, term:'передбачення досліду'}; }
  if(KIND==='sort'){ id='nat:sort:'+it.n;
    card={sub:S,tag:'Хто є хто',type:'choice',q:'До якої групи належить <b>'+it.n+'</b>?',
      o:GROUPS,a:it.g,hint:'Дивись на дихання, покриви й те, як з\'являються малята.', why:it.r, term:'класифікація'}; }
  if(KIND==='chain'){ id='nat:chain:'+it.c.join('|');
    card={sub:S,tag:'Ланцюг живлення',type:'order',q:'Склади ланцюг живлення: хто кого їсть.',
      items:it.c,a:it.c.map((_,i)=>i),hint:'Починай із джерела енергії.', why:it.r, term:'ланцюг живлення'}; }
  if(!id) return;
  if(ok) srsHit(id); else srsMiss(id,'Колосок',card);
}

function endRun(forceMax){
  const g=GAMES.find(x=>x.id===KIND);
  const max = forceMax || ITEMS.length;
  PR.best=PR.best||{}; if(RIGHT>(PR.best[KIND]||0)) PR.best[KIND]=RIGHT;
  saveP();
  $('#e-h').textContent=g.t;
  $('#e-title').textContent = RIGHT===max?'Усе точно.' : RIGHT>=max*0.6?'Непогано.' : 'Розбір унизу — він тут головний.';
  $('#e-now').textContent=RIGHT+'/'+max; $('#e-best').textContent=PR.best[KIND];
  $('#e-again').onclick=()=>startRun(KIND);
  let log='';
  if(KIND==='chain') log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+(LOG[i]?'🟩':'🟥')+'</span><span>'+it.c.join(' → ')+'</span></div>').join('');
  if(KIND==='sort')  log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+(LOG[i]?'🟩':'🟥')+'</span><span>'+it.n+' — '+GROUPS[it.g].toLowerCase()+'</span></div>').join('');
  if(KIND==='moon')  log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+(LOG[i]?'🟩':'🟥')+'</span><span>'+MOON[it.k]+(it.next?' → через два тижні '+MOON[(it.k+4)%8]:'')+'</span></div>').join('');
  if(KIND==='predict')log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+(LOG[i]?'🟩':'🟥')+'</span><span>'+it.o[it.a]+'</span></div>').join('');
  $('#e-log').innerHTML = log ? '<b style="display:block;margin-bottom:6px">Що було</b>'+log : '';
  $('#e-log').style.display = log ? 'block' : 'none';
  homeDraw(); go('s-end');
}

homeDraw();
</script>
</body>
</html>
