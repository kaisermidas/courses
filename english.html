gger"], "e": "Подвоєння."}, {"t": "input", "q": "Вищий ступінь: «easy» →", "a": ["easier"], "e": "y → ier."}, {"t": "choice", "q": "«This book is … than that one.»", "o": ["more interesting", "interestinger", "most interesting"], "a": 0, "e": "Довгий прикметник."}, {"t": "input", "q": "Переклади «сільська місцевість»:", "a": ["countryside", "the countryside"], "e": "countryside."}, {"t": "choice", "q": "«Kyiv is … than Kiliia.»", "o": ["big", "bigger", "biggest"], "a": 1, "e": "Порівняння двох."}], "quiz3": [{"t": "input", "q": "Вищий ступінь: «nice» →", "a": ["nicer"], "e": "+r."}, {"t": "choice", "q": "«The sea is more safer than the pool» — знайди помилку.", "o": ["Подвійний ступінь: safer або more safe, не разом", "Треба «most safer»", "Помилки немає"], "a": 0, "e": "Один спосіб порівняння."}, {"t": "input", "q": "Вищий ступінь: «heavy» →", "a": ["heavier"], "e": "y → ier."}, {"t": "choice", "q": "«Amazing» means…", "o": ["вражаючий", "нудний", "маленький"], "a": 0, "e": "amazing."}]}, {"id": "en-u18", "sec": "Units 17–18", "title": "Unit 18. The weather. It. Holidays", "goal": "Ти говориш про погоду з «it» і про подорожі.", "learn": [{"h": "It", "p": ["<b>Про погоду</b>: <i>It's sunny. It's raining. It's cold today.</i>", "<b>Як об'єкт</b>: <i>That's my pen but you can use <b>it</b>.</i>", "<b>Як підмет</b>: <i>I can't do this test. <b>It's</b> too difficult.</i>"]}, {"h": "Weather and seasons", "p": ["<i>cold</i> холодний, <i>hot</i> жаркий, <i>warm</i> теплий, <i>rain</i> дощ, <i>snow</i> сніг, <i>sun</i> сонце, <i>wind</i> вітер. Пори року: <i>spring, summer, autumn, winter</i>.", "Питання: <i>What's the weather like today? — It's warm and sunny.</i>"]}, {"h": "Holidays and travel", "p": ["<i>travel</i> подорожувати, <i>visit</i> відвідати, <i>stay</i> зупинятися, <i>leave</i> від'їжджати, <i>drive</i> керувати авто, <i>fly</i> літати, <i>catch</i> сідати (на автобус), <i>get</i> добиратися, <i>come</i>, <i>hotel</i>, <i>tent</i> намет."]}, {"h": "Prepositions of time", "p": ["<b>for</b> — скільки триває: <i>My friends are staying with me <b>for</b> three days.</i>", "<b>until</b> — до якогось моменту; <b>at</b> — з часом (at 5 o'clock); <b>on</b> — з днями (on Monday); <b>in</b> — з місяцями й порами року (in May, in summer)."]}], "remember": "Погода завжди через it: It's raining. What's the weather like? Пори року: spring, summer, autumn, winter. for three days — тривалість. at 5 o'clock, on Monday, in May.", "cards": [{"f": "Як говорять про погоду?", "b": "Через it: It's sunny. It's raining."}, {"f": "What's the weather like today?", "b": "Яка сьогодні погода?"}, {"f": "Пори року", "b": "spring, summer, autumn, winter."}, {"f": "for three days", "b": "протягом трьох днів (тривалість)."}, {"f": "at / on / in з часом", "b": "at 5 o'clock, on Monday, in May."}, {"f": "tent / hotel", "b": "намет / готель."}, {"f": "fly / drive / stay", "b": "літати / керувати авто / зупинятися (жити десь тимчасово)."}], "quiz": [{"t": "choice", "q": "… raining today.", "o": ["It's", "There's", "He's"], "a": 0, "e": "Погода — it."}, {"t": "choice", "q": "«What's the weather like?» питає про…", "o": ["погоду", "улюблену справу", "одяг"], "a": 0, "e": "Погоду."}, {"t": "choice", "q": "My friends are staying … three days.", "o": ["for", "at", "in"], "a": 0, "e": "Тривалість."}, {"t": "choice", "q": "We meet … Monday.", "o": ["at", "on", "in"], "a": 1, "e": "Дні — on."}, {"t": "choice", "q": "My birthday is … May.", "o": ["at", "on", "in"], "a": 2, "e": "Місяці — in."}, {"t": "input", "q": "Переклади «осінь»:", "a": ["autumn"], "e": "autumn."}, {"t": "input", "q": "Переклади «намет»:", "a": ["tent", "a tent"], "e": "tent."}, {"t": "choice", "q": "«Warm» —", "o": ["холодний", "теплий", "вітряний"], "a": 1, "e": "Теплий."}], "quiz2": [{"t": "choice", "q": "«… snowing outside.»", "o": ["It's", "There's", "He's"], "a": 0, "e": "Погода — it."}, {"t": "choice", "q": "«My birthday is … December.»", "o": ["at", "on", "in"], "a": 2, "e": "Місяці — in."}, {"t": "choice", "q": "«We stayed there … a week.»", "o": ["for", "since", "at"], "a": 0, "e": "Тривалість."}, {"t": "input", "q": "Переклади «намет»:", "a": ["tent", "a tent"], "e": "tent."}, {"t": "choice", "q": "«What's the weather like?» — відповідь:", "o": ["It's windy.", "I like it.", "It's a weather."], "a": 0, "e": "Опис погоди."}], "quiz3": [{"t": "choice", "q": "«on Monday», «in May», «at 5 o'clock» — яке правило?", "o": ["on — дні, in — місяці й пори року, at — точний час", "Усі однакові", "Випадково"], "a": 0, "e": "Прийменники часу."}, {"t": "choice", "q": "«It's raining» vs «It rains a lot here». Різниця?", "o": ["Зараз / зазвичай", "Немає", "Перше неправильне"], "a": 0, "e": "Continuous vs Simple."}, {"t": "input", "q": "Переклади «весна»:", "a": ["spring"], "e": "spring."}, {"t": "choice", "q": "«They are staying … a hotel.»", "o": ["at", "in", "on"], "a": 1, "e": "in/at a hotel — обидва вживані, in для будівлі."}]}, {"id": "en-u19", "sec": "Units 19–20", "title": "Unit 19. A fantastic concert: Past Simple of be, Wh-questions", "goal": "Ти вживаєш was/were і ставиш питання про минуле.", "learn": [{"h": "was / were", "p": ["<b>was</b> — I, he, she, it: <i>I was late home. My dinner was cold.</i>", "<b>were</b> — we, you, they: <i>We were excited. They were at a concert.</i>", "Заперечення: <b>wasn't</b> (was not), <b>weren't</b> (were not): <i>My mum wasn't very happy. Jane and Isaac weren't at home.</i>"]}, {"h": "Questions", "p": ["<i><b>Was</b> he friendly? — Yes, he was. / No, he wasn't.</i>", "<i><b>Were</b> you at the cinema last night? — No, I wasn't.</i>", "<i>Where <b>were</b> you on Saturday night? What <b>was</b> your favourite film?</i>"]}, {"h": "Wh- questions review", "p": ["<b>When</b> — коли; <b>What</b> — що; <b>Where</b> — де; <b>Who</b> — хто; <b>Why</b> — чому; <b>How</b> — як; <b>What time</b> — о котрій. <i>Why are you wearing that funny hat? How difficult was your English test? — It was easy.</i>"]}, {"h": "Adjectives", "p": ["<i>difficult</i> складний — <i>easy</i> легкий; <i>fast</i> швидкий — <i>slow</i> повільний; <i>loud</i> гучний; <i>late</i> пізній; <i>excited</i> схвильований; <i>friendly</i> дружній; <i>brilliant</i> неперевершений; <i>heavy</i> важкий; <i>ready</i> готовий; <i>strong</i> сильний; <i>pleased</i> задоволений."]}], "remember": "was — I, he, she, it; were — we, you, they. Заперечення: wasn't / weren't. Питання: Was/Were на першому місці; Yes, he was / No, they weren't. Wh-: when, what, where, who, why, how.", "cards": [{"f": "was / were", "b": "was — I, he, she, it; were — we, you, they."}, {"f": "Заперечення в минулому з be", "b": "wasn't / weren't."}, {"f": "Were you at the cinema? — відповідь", "b": "Yes, I was. / No, I wasn't."}, {"f": "Why?", "b": "Чому?"}, {"f": "difficult / easy", "b": "складний / легкий."}, {"f": "excited / pleased", "b": "схвильований / задоволений."}, {"f": "loud / brilliant", "b": "гучний / неперевершений."}], "quiz": [{"t": "choice", "q": "I … late home yesterday.", "o": ["was", "were"], "a": 0, "e": "I was."}, {"t": "choice", "q": "They … at a concert.", "o": ["was", "were"], "a": 1, "e": "They were."}, {"t": "choice", "q": "Meg … at school yesterday. (заперечення)", "o": ["wasn't", "weren't"], "a": 0, "e": "She wasn't."}, {"t": "choice", "q": "Were your parents with you? — No, they … .", "o": ["wasn't", "weren't"], "a": 1, "e": "weren't."}, {"t": "choice", "q": "… you at the cinema last night?", "o": ["Was", "Were"], "a": 1, "e": "You → Were."}, {"t": "choice", "q": "… are you wearing that funny hat?", "o": ["Why", "Where", "When"], "a": 0, "e": "Why — чому."}, {"t": "choice", "q": "How difficult was your test? —", "o": ["It was easy.", "At 8 o'clock.", "In a small town."], "a": 0, "e": "Про складність."}, {"t": "input", "q": "Переклади «легкий» (про завдання):", "a": ["easy"], "e": "easy."}, {"t": "input", "q": "Переклади «швидкий»:", "a": ["fast", "quick"], "e": "fast."}], "quiz2": [{"t": "choice", "q": "«We … at the concert yesterday.»", "o": ["was", "were"], "a": 1, "e": "We were."}, {"t": "input", "q": "Заповни: «She … (not be) at school last Monday.»", "a": ["wasn't", "was not"], "e": "wasn't."}, {"t": "choice", "q": "«… they happy?» — Yes, they were.", "o": ["Was", "Were"], "a": 1, "e": "They → Were."}, {"t": "choice", "q": "«… were you yesterday?» — At home.", "o": ["What", "Where", "When"], "a": 1, "e": "Місце."}, {"t": "input", "q": "Antonym of «difficult»:", "a": ["easy"], "e": "easy."}], "quiz3": [{"t": "choice", "q": "«There … a lot of people at the concert.»", "o": ["was", "were"], "a": 1, "e": "People — множина."}, {"t": "choice", "q": "«How was your day?» — найкраща відповідь:", "o": ["It was great, thanks!", "I am great.", "Yes, it is."], "a": 0, "e": "Минулий час."}, {"t": "input", "q": "Заповни: «The test … easy, but the questions … long.»", "a": ["was were", "was, were", "was / were"], "e": "was … were."}, {"t": "choice", "q": "«Why were you late?» asks about…", "o": ["причину", "місце", "час"], "a": 0, "e": "Why — чому."}]}, {"id": "en-u20", "sec": "Units 19–20", "title": "Unit 20. Animals: Past Simple (правильні дієслова)", "goal": "Ти будуєш Past Simple правильних дієслів і називаєш тварин.", "learn": [{"h": "Past Simple: positive", "p": ["Дієслово + <b>-ed</b> для всіх осіб: <i>I / you / he / she / we / they <b>worked</b>.</i> <i>Richard lived in Italy until 2013. Becky worked in a hospital.</i>", "Правопис: <b>+ed</b> (work → worked); <b>+d</b> після -e (live → lived); <b>y → ied</b> після приголосної (study → studied, travel → travelled)."]}, {"h": "Past Simple: negative", "p": ["<b>didn't</b> + дієслово в <b>початковій формі</b> (без -ed!): <i>I didn't walk to school yesterday. We didn't want to go out because it was raining.</i>"]}, {"h": "Wild animals", "p": ["<i>bear</i> ведмідь, <i>crocodile</i>, <i>elephant</i> слон, <i>giraffe</i> жирафа, <i>kangaroo</i>, <i>leopard</i>, <i>monkey</i> мавпа, <i>snake</i> змія, <i>tiger</i>, <i>zebra</i>."]}, {"h": "Pets and farm animals", "p": ["<i>bird</i> пташка, <i>cat</i> — <i>kitten</i> кошеня, <i>dog</i> — <i>puppy</i> цуценя, <i>cow</i> корова, <i>donkey</i> віслюк, <i>mouse</i> миша (мн. <i>mice</i>), <i>rabbit</i> кролик, <i>sheep</i> вівця (мн. <i>sheep</i>)."]}], "remember": "Past Simple: +ed для всіх осіб (worked, lived, studied, travelled). Заперечення: didn't + початкова форма. Тварини: bear, giraffe, elephant, monkey, snake; kitten, puppy, sheep (мн. sheep), mouse — mice.", "cards": [{"f": "Past Simple правильних дієслів", "b": "Дієслово + -ed для всіх осіб."}, {"f": "live / study / travel у Past Simple", "b": "lived / studied / travelled."}, {"f": "Заперечення в Past Simple", "b": "didn't + дієслово без -ed."}, {"f": "kitten / puppy", "b": "кошеня / цуценя."}, {"f": "sheep — множина", "b": "sheep (не змінюється)."}, {"f": "mouse — множина", "b": "mice."}, {"f": "giraffe / leopard / donkey", "b": "жирафа / леопард / віслюк."}], "quiz": [{"t": "input", "q": "Past Simple: work →", "a": ["worked"], "e": "+ed."}, {"t": "input", "q": "Past Simple: live →", "a": ["lived"], "e": "+d."}, {"t": "input", "q": "Past Simple: study →", "a": ["studied"], "e": "y → ied."}, {"t": "input", "q": "Past Simple: travel →", "a": ["travelled", "traveled"], "e": "travelled."}, {"t": "choice", "q": "We … to go out because it was raining.", "o": ["didn't want", "didn't wanted"], "a": 0, "e": "Після didn't — початкова форма."}, {"t": "input", "q": "Переклади «цуценя»:", "a": ["puppy", "a puppy"], "e": "puppy."}, {"t": "input", "q": "Множина від «mouse»:", "a": ["mice"], "e": "mice."}, {"t": "input", "q": "Множина від «sheep»:", "a": ["sheep"], "e": "sheep."}, {"t": "choice", "q": "«Bear» —", "o": ["ведмідь", "бобер", "борсук"], "a": 0, "e": "Ведмідь."}], "quiz2": [{"t": "input", "q": "Past Simple: «stop» →", "a": ["stopped"], "e": "Подвоєння."}, {"t": "input", "q": "Past Simple: «carry» →", "a": ["carried"], "e": "y → ied."}, {"t": "choice", "q": "«They … visit the zoo last week.» (не відвідали)", "o": ["didn't", "don't", "weren't"], "a": 0, "e": "didn't visit."}, {"t": "input", "q": "Множина від «mouse»:", "a": ["mice"], "e": "mice."}, {"t": "choice", "q": "Which animal is a pet?", "o": ["hamster", "giraffe", "leopard"], "a": 0, "e": "Хом'як."}], "quiz3": [{"t": "choice", "q": "«She didn't watched TV» — виправ.", "o": ["She didn't watch TV.", "She didn't watches TV.", "Правильно як є."], "a": 0, "e": "Після didn't — початкова форма."}, {"t": "input", "q": "Past Simple: «play» →", "a": ["played"], "e": "Голосна + y → просто ed."}, {"t": "choice", "q": "«Ten sheep …» — яке дієслово?", "o": ["was", "were"], "a": 1, "e": "sheep — множина без змін."}, {"t": "input", "q": "Переклади «кошеня»:", "a": ["kitten", "a kitten"], "e": "kitten."}]}, {"id": "en-lifeskills", "sec": "Life Skills", "title": "Life Skills: creativity, learning English, internet safety, our world", "goal": "Ти знаєш поради з підручника про навчання, безпеку в мережі й довкілля.", "learn": [{"h": "Being creative and being you", "p": ["Кожен творчий по-своєму: <i>drawing, writing stories, making videos, playing music, cooking, building things</i>. Поради: <i>try new things, don't be afraid of mistakes, ask questions, keep a notebook of ideas</i>."]}, {"h": "Study skills: Learning English", "p": ["<i>Learn a few new words every day. Write words in a vocabulary notebook with a translation and an example. Watch cartoons in English with subtitles. Label things in your room. Speak — don't be afraid of mistakes. Read short stories. Practise every day for 10–15 minutes.</i>"], "note": "Помилки — це нормально: <i>Mistakes help you learn.</i>"}, {"h": "ICT literacy: Being careful on the internet", "p": ["<i>Don't share personal information</i> (address, school, phone). <i>Use a strong password and don't tell anyone.</i> <i>Don't meet people from the internet.</i> <i>Be kind online</i> — не пиши того, чого не сказав би в очі. <i>Tell an adult</i>, якщо щось лякає чи ображає. <i>Check information</i> — не все "o": ["переробляти", "викидати", "купувати"], "a": 0, "e": "Переробка."}, {"t": "choice", "q": "Який спосіб вивчати слова радить підручник?", "o": ["Записувати з перекладом і прикладом", "Читати один раз", "Переписувати 50 разів"], "a": 0, "e": "Словничок з прикладом."}, {"t": "choice", "q": "Що допомагає в командній роботі?", "o": ["Слухати кожного й домовлятись", "Говорити найгучніше", "Робити все самому"], "a": 0, "e": "Співпраця."}], "quiz2": [{"t": "choice", "q": "Найкращий спосіб вивчити слова:", "o": ["Записувати з прикладом і повторювати через дні", "Переписати 50 разів за раз", "Прочитати один раз"], "a": 0, "e": "Інтервальне повторення."}, {"t": "choice", "q": "Незнайомець онлайн просить твоє фото. Дія:", "o": ["Не надсилати й розказати дорослим", "Надіслати", "Спитати навіщо"], "a": 0, "e": "Безпека."}, {"t": "choice", "q": "«Recycle» means…", "o": ["переробляти", "викидати", "купувати"], "a": 0, "e": "Переробка."}, {"t": "input", "q": "Скільки хвилин щодня радять приділяти англійській?", "a": ["10-15", "10–15", "15", "10"], "e": "10–15 хвилин."}], "quiz3": [{"t": "choice", "q": "Чому корисно дивитись мультики англійською із субтитрами?", "o": ["Одночасно чуєш і бачиш слово в контексті", "Це відпочинок", "Не корисно"], "a": 0, "e": "Контекст і вимова."}, {"t": "choice", "q": "Ти боїшся говорити через помилки. Найкорисніша думка:", "o": ["Помилки — частина навчання, головне, щоб тебе зрозуміли", "Краще мовчати", "Треба спершу вивчити все"], "a": 0, "e": "Mistakes help you learn."}, {"t": "choice", "q": "Що найбільше економить воду вдома?", "o": ["Вимикати воду під час чищення зубів і швидше приймати душ", "Не пити воду", "Не мити руки"], "a": 0, "e": "Розумне споживання."}, {"t": "input", "q": "Як діяти, якщо в мережі тебе ображають? (одне слово-дія)", "a": ["розказати", "заблокувати", "повідомити", "розповісти"], "e": "Розказати дорослому й заблокувати."}]}]};

// ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ const o = P[id] || (P[id] = {learn:false, cards:false, best:null}); if(o.b2===undefined) o.b2=null; if(o.b3===undefined) o.b3=null; return o; }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function lvlLine(p){
  const done=[]; if(p.best!==null) done.push("легкий "+p.best+"%"); if(p.b2!==null) done.push("складний "+p.b2+"%"); if(p.b3!==null) done.push("дуже складний "+p.b3+"%");
  return done.length? done.join(" · ") : "Ще не проходив";
}
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = Math.max(starsOf(p.best), starsOf(p.b2), starsOf(p.b3));
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${lvlLine(p)}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  const qs=[L.quiz, L.quiz2, L.quiz3], keys=["best","b2","b3"];
  for(let k=1;k<=3;k++){
    const el=document.getElementById("q"+k+"-count"), st=document.getElementById("st-q"+k);
    const arr=qs[k-1]||[];
    el.textContent = arr.length? arr.length+" питань" : "поки немає";
    const v=p[keys[k-1]];
    st.innerHTML = v===null? "" : `<span class="stars">${starStr(starsOf(v))}</span>`;
  }
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCardsThenQuiz(){ openQuiz(1); }
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(1); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
let LEVEL = 1;
function openQuiz(lvl, items){
  if(typeof lvl==="number") LEVEL = lvl;
  const src = LEVEL===2 ? (L.quiz2||[]) : LEVEL===3 ? (L.quiz3||[]) : L.quiz;
  if(!items && !src.length){ alert("Для цього рівня питань поки немає."); return; }
  quiz = (items || src).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0;
  document.querySelector("#s-quiz .title").textContent = LEVEL===2?"Складний":LEVEL===3?"Дуже складний":"Легкий";
  showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/,/g,".").replace(/[^a-z0-9а-яіїєґ' \-\/.:%°]/gi,"").replace(/\s*([\/.:%°-])\s*/g,"$1").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = LEVEL===1
      ? `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`
      : `<b>${ok?"Правильно!":"Не зовсім."}</b>${ok?"":"Розбір буде в кінці."}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), p = lp(L.id);
  const st = LEVEL===3 ? (pct>=95?3:pct>=80?2:pct>=60?1:0) : starsOf(pct);
  const key = LEVEL===2?"b2":LEVEL===3?"b3":"best";
  const full = (LEVEL===2?(L.quiz2||[]):LEVEL===3?(L.quiz3||[]):L.quiz).length;
  if(quiz.length===full && (p[key]===null || pct>p[key])){ p[key]=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = LEVEL===3
    ? (st===3?"Неймовірно. Це найвищий рівень.":st===2?"Дуже добре для такого рівня.":st===1?"Складно — і це нормально. Спробуй ще.":"Цей рівень найважчий. Повтори легший і повертайся.")
    : (st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.");
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  const rev=document.getElementById("r-review");
  if(LEVEL>1 && qWrong.length){
    rev.style.display="block";
    rev.innerHTML = "<b>Розбір помилок</b>" + qWrong.map(q=>`<div class="rev"><i>${q.q}</i><br>${q.e}${q.t==="input"?" Правильно: <b>"+q.a[0]+"</b>.":""}</div>`).join("");
  } else rev.style.display="none";
  go("s-res");
}
function retryWrong(){ openQuiz(LEVEL, qWrong); }

load(renderList);
</script>
