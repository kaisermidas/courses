<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Англійська мова · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}.mode .ic.d{background:#FFE8D6}.mode .ic.e{background:#F0E4FF}
  .lvl-title{color:var(--ink-2);font-size:14px;margin:22px 0 8px;padding-left:2px}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
  .rev{margin-top:10px;font-size:15px;color:var(--ink-2)}.rev i{color:var(--ink);font-style:normal;font-weight:600}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <div class="lvl-title">Перевірити себе</div>
    <button class="mode" onclick="openQuiz(1)"><div class="ic c">🙂</div><div><b>Легкий</b><span id="q1-count"></span></div><div class="st" id="st-q1"></div></button>
    <button class="mode" onclick="openQuiz(2)"><div class="ic d">🔥</div><div><b>Складний</b><span id="q2-count"></span></div><div class="st" id="st-q2"></div></button>
    <button class="mode" onclick="openQuiz(3)"><div class="ic e">💀</div><div><b>Дуже складний</b><span id="q3-count"></span></div><div class="st" id="st-q3"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <div id="r-review" style="display:none;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px"></div>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz(LEVEL)">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

member": "I'm, you're, he's/she's/it's, we're, they're; заперечення — not (isn't, aren't). Присвійні: my, your, his (він), her (вона). Ukraine — Ukrainian, Spain — Spanish, Turkey — Turkish; країни й національності з великої букви.", "cards": [{"f": "Скорочені форми be", "b": "I'm, you're, he's, she's, it's, we're, they're."}, {"f": "Заперечення be", "b": "I'm not, isn't (is not), aren't (are not)."}, {"f": "his / her", "b": "його (про хлопця) / її (про дівчину)."}, {"f": "Ukraine — …", "b": "Ukrainian (українець, український)."}, {"f": "Spain / Turkey / China — національності", "b": "Spanish / Turkish / Chinese."}, {"f": "watch", "b": "наручний годинник."}, {"f": "Чи пишуть країни з великої букви?", "b": "Так, і країни, і національності завжди з великої."}], "quiz": [{"t": "choice", "q": "I … from Ukraine.", "o": ["am", "is", "are"], "a": 0, "e": "I am."}, {"t": "choice", "q": "She … my sister.", "o": ["am", "is", "are"], "a": 1, "e": "She is."}, {"t": "choice", "q": "They … Ukrainian.", "o": ["is", "are", "am"], "a": 1, "e": "They are."}, {"t": "choice", "q": "He … Italian. (заперечення)", "o": ["isn't", "aren't", "am not"], "a": 0, "e": "He isn't."}, {"t": "choice", "q": "This is Michael. He's … brother.", "o": ["my", "his", "her"], "a": 0, "e": "Мій брат."}, {"t": "choice", "q": "This is Jessica. … name is Jessica.", "o": ["His", "Her", "Your"], "a": 1, "e": "She → her."}, {"t": "choice", "q": "This is Tom. This is … camera.", "o": ["her", "his", "its"], "a": 1, "e": "He → his."}, {"t": "input", "q": "Національність від Ukraine:", "a": ["ukrainian"], "e": "Ukrainian."}, {"t": "input", "q": "Національність від Spain:", "a": ["spanish"], "e": "Spanish."}, {"t": "input", "q": "Скороти: «he is» →", "a": ["he's", "hes"], "e": "he's."}, {"t": "input", "q": "Переклади «наручний годинник»:", "a": ["watch", "a watch"], "e": "watch."}], "quiz2": [{"t": "choice", "q": "… my parents from Ukraine?", "o": ["Is", "Are", "Am"], "a": 1, "e": "Parents — множина."}, {"t": "input", "q": "Заповни: «My friends … (be) very kind.»", "a": ["are"], "e": "They are."}, {"t": "choice", "q": "«This is Ann and this is … brother.» (її брат)", "o": ["his", "her", "its"], "a": 1, "e": "Ann → her."}, {"t": "input", "q": "Національність від Turkey:", "a": ["turkish"], "e": "Turkish."}, {"t": "choice", "q": "Which sentence is correct?", "o": ["I not am tired.", "I amn't tired.", "I'm not tired."], "a": 2, "e": "I'm not."}], "quiz3": [{"t": "choice", "q": "«Mike and I … in the same class.»", "o": ["am", "is", "are"], "a": 2, "e": "Mike and I = we."}, {"t": "choice", "q": "Why is «Ukrainian» written with a capital letter?", "o": ["Національності завжди з великої в англійській", "Це помилка", "Бо це початок речення"], "a": 0, "e": "Правило."}, {"t": "input", "q": "Заповни: «It … cold in winter here.»", "a": ["is"], "e": "It is."}, {"t": "choice", "q": "«That's Tom. … camera is new.»", "o": ["Her", "His", "Their"], "a": 1, "e": "Tom → his."}, {"t": "input", "q": "Національність від China:", "a": ["chinese"], "e": "Chinese."}]}, {"id": "en-u2", "sec": "Units 1–2", "title": "Unit 2. My family: our/their, possessive 's, be questions", "goal": "Ти вживаєш our/their і присвійний 's, ставиш питання з be і називаєш членів родини та почуття.", "learn": [{"h": "our / their", "p": ["we → <b>our</b>: <i>Our mum is funny.</i> they → <b>their</b>: <i>Is that their dog?</i> it → <b>its</b>: <i>It's her birthday today.</i>"]}, {"h": "Possessive 's", "p": ["Належність показуємо через <b>'s</b>, а не «of»: <i>This is my <b>mum's</b> cat.</i> (не «the cat of my mum»). Якщо власників двоє, 's ставимо в кінці: <i>This is <b>Jake and Nat's</b> dog.</i>"]}, {"h": "be: questions and short answers", "p": ["Ставимо be на перше місце: <i><b>Am</b> I funny? — Yes, you are. / No, you aren't.</i> <i><b>Are</b> you English? — Yes, I am. / No, I'm not.</i> <i><b>Is</b> he tired? — Yes, he is. / No, he isn't.</i> <i><b>Are</b> they Spanish? — Yes, they are. / No, they aren't.</i>"], "note": "У короткій відповіді дієслово не скорочують: <b>Yes, I am</b> (не «Yes, I'm»)."}, {"h": "Family and feelings", "p": ["<i>baby</i> немовля, <i>brother</i>, <i>sister</i>, <i>child — children</i>, <i>dad, mum, father, mother, parents</i> батьки, <i>son</i> син, <i>daughter</i> донька, <i>husband</i> чоловік, <i>wife</i> дружина.", "Почуття: <i>bored</i> знудьгований, <i>clever</i> розумний, <i>funny</i> смішний, <i>happy</i>, <i>hungry</i> голодний, <i>nice</i> приємний, <i>sad</i>, <i>tired</i> втомлений, <i>hot</i>."]}], "remember": "we → our, they → their. Належність через 's: my mum's cat, Jake and Nat's dog. Питання: be на перше місце; коротка відповідь без скорочення — Yes, I am. Родина: son, daughter, husband, wife, parents, children.", "cards": [{"f": "our / their", "b": "наш / їхній."}, {"f": "Як сказати «кіт моєї мами»?", "b": "My mum's cat (не «the cat of my mum»)."}, {"f": "Собака Джейка і Нат", "b": "Jake and Nat's dog — 's тільки в кінці."}, {"f": "Are you English? — коротка відповідь", "b": "Yes, I am. / No, I'm not."}, {"f": "Чи можна «Yes, I'm»?", "b": "Ні, у короткій відповіді скорочення не вживають."}, {"f": "son / daughter", "b": "син / донька."}, {"f": "husband / wife", "b": "чоловік / дружина."}, {"f": "child → множина", "b": "children."}, {"f": "tired / hungry / bored", "b": "втомлений / голодний / знудьгований."}], "quiz": [{"t": "choice", "q": "We're James and Charlotte and this is … dog.", "o": ["our", "their", "your"], "a": 0, "e": "We → our."}, {"t": "choice", "q": "Alessandro and Laura live in England, but … dad's from Argentina.", "o": ["his", "their", "our"], "a": 1, "e": "They → their."}, {"t": "choice", "q": "Як правильно?", "o": ["the cat of my mum", "my mum's cat"], "a": 1, "e": "Присвійний 's."}, {"t": "choice", "q": "Is he tired? —", "o": ["Yes, he is.", "Yes, he's.", "Yes, he are."], "a": 0, "e": "Без скорочення."}, {"t": "choice", "q": "… you Ukrainian? — Yes, I am.", "o": ["Is", "Are", "Am"], "a": 1, "e": "You → are."}, {"t": "input", "q": "Переклади «донька»:", "a": ["daughter", "a daughter"], "e": "daughter."}, {"t": "input", "q": "Переклади «дружина»:", "a": ["wife", "a wife"], "e": "wife."}, {"t": "input", "q": "Множина від «child»:", "a": ["children"], "e": "children."}, {"t": "choice", "q": "«Втомлений» —", "o": ["bored", "tired", "clever"], "a": 1, "e": "tired."}, {"t": "choice", "q": "«Розумний» —", "o": ["funny", "clever", "nice"], "a": 1, "e": "clever."}], "quiz2": [{"t": "choice", "q": "«Це кімната моїх батьків» —", "o": ["my parent's room", "my parents' room", "my parents room"], "a": 1, "e": "Множина + апостроф після s."}, {"t": "choice", "q": "«Is your sister happy?» — правильна коротка відповідь:", "o": ["Yes, she is.", "Yes, she's.", "Yes, is she."], "a": 0, "e": "Без скорочення."}, {"t": "input", "q": "Заповни: «This is Ann and Tom. … dog is big.» (їхній)", "a": ["their"], "e": "Their."}, {"t": "choice", "q": "Хто такий «my mother's brother»?", "o": ["uncle", "cousin", "nephew"], "a": 0, "e": "Дядько."}, {"t": "input", "q": "Множина від «child»:", "a": ["children"], "e": "children."}], "quiz3": [{"t": "choice", "q": "«Мій двоюрідний брат» —", "o": ["my cousin", "my brother", "my nephew"], "a": 0, "e": "cousin — і брат, і сестра."}, {"t": "choice", "q": "«Anna and Mark's car» означає…", "o": ["одна машина обох", "дві різні машини", "машина Марка"], "a": 0, "e": "'s в кінці — спільне володіння."}, {"t": "input", "q": "Заповни: «… you tired? — No, I'm not.»", "a": ["are"], "e": "Are you."}, {"t": "choice", "q": "«Her husband's parents» — це для неї…", "o": ["батьки чоловіка", "її батьки", "її діти"], "a": 0, "e": "Ланцюжок присвійних."}, {"t": "input", "q": "Переклади «немовля»:", "a": ["baby", "a baby"], "e": "baby."}]}, {"id": "en-culture1", "sec": "Culture", "title": "Culture: The United Kingdom. Cities and towns of Ukraine", "goal": "Ти знаєш склад Великої Британії, її символи й столиці, а також англійські назви українських міст.", "learn": [{"h": "The United Kingdom", "p": ["<b>The UK</b> = <b>England</b> (capital <i>London</i>), <b>Scotland</b> (<i>Edinburgh</i>), <b>Wales</b> (<i>Cardiff</i>), <b>Northern Ireland</b> (<i>Belfast</i>). Прапор — <b>the Union Jack</b>. Мова — English. Гроші — <b>the pound (£)</b>. Королівство: <i>king</i>, <i>queen</i>."], "note": "<b>Great Britain</b> — це острів (England + Scotland + Wales); <b>the UK</b> — держава, разом з Північною Ірландією. Артикль <b>the</b> обов'язковий: the UK, the USA."}, {"h": "Famous things", "p": ["<i>Big Ben, Buckingham Palace, the London Eye, Tower Bridge, red buses, black cabs, the Underground (метро), fish and chips, tea</i>. Символи: троянда (England), будяк (Scotland), нарцис (Wales), конюшина (N. Ireland)."]}, {"h": "Cities and towns of Ukraine", "p": ["<i>Kyiv</i> — the capital of Ukraine, on the <b>Dnipro</b> river; <i>Lviv</i>, <i>Odesa</i> (on the Black Sea), <i>Kharkiv</i>, <i>Dnipro</i>, <i>Chernivtsi</i>, <i>Uzhhorod</i>, <i>Kiliia</i> (on the <b>Danube</b>). Гроші — <b>the hryvnia</b>."]}, {"h": "Talking about a place", "p": ["<i>Where do you live? — I live in Kiliia. It's a small town in the south of Ukraine, near the Danube. There are two schools and a park. It's quiet and beautiful.</i>", "Напрямки: <i>in the north / south / east / west of…</i>"]}], "remember": "The UK = England (London), Scotland (Edinburgh), Wales (Cardiff), Northern Ireland (Belfast). Прапор — the Union Jack, гроші — the pound. Great Britain — острів без Пн. Ірландії. Київ — the capital, on the Dnipro; гроші — the hryvnia.", "cards": [{"f": "З чого складається the UK?", "b": "England, Scotland, Wales, Northern Ireland."}, {"f": "Столиця Шотландії / Уельсу", "b": "Edinburgh / Cardiff."}, {"f": "Як називається прапор Британії?", "b": "The Union Jack."}, {"f": "Валюта Великої Британії / України", "b": "The pound (£) / the hryvnia."}, {"f": "Чим Great Britain відрізняється від the UK?", "b": "Great Britain — острів (без Північної Ірландії); the UK — держава."}, {"f": "the Underground", "b": "метро в Лондоні."}, {"f": "На якій річці стоїть Київ?", "b": "On the Dnipro."}, {"f": "Kiliia is on the …", "b": "Danube (Дунай)."}], "quiz": [{"t": "choice", "q": "Столиця Шотландії —", "o": ["London", "Edinburgh", "Cardiff"], "a": 1, "e": "Edinburgh."}, {"t": "choice", "q": "Cardiff — столиця…", "o": ["Wales", "Scotland", "Northern Ireland"], "a": 0, "e": "Уельсу."}, {"t": "input", "q": "Як називається прапор Великої Британії? The Union …", "a": ["jack", "union jack"], "e": "The Union Jack."}, {"t": "choice", "q": "Валюта Великої Британії —", "o": ["euro", "pound", "dollar"], "a": 1, "e": "The pound."}, {"t": "choice", "q": "Що входить до the UK, але не до Great Britain?", "o": ["Wales", "Northern Ireland", "Scotland"], "a": 1, "e": "Північна Ірландія."}, {"t": "choice", "q": "«Метро» в Лондоні —", "o": ["the Underground", "the metro", "the subway"], "a": 0, "e": "The Underground (Tube)."}, {"t": "input", "q": "Столиця України англійською:", "a": ["kyiv", "kiev"], "e": "Kyiv."}, {"t": "choice", "q": "Odesa is on the …", "o": ["Black Sea", "Danube", "Dnipro"], "a": 0, "e": "Чорне море."}, {"t": "input", "q": "Валюта України англійською:", "a": ["hryvnia", "the hryvnia"], "e": "The hryvnia."}], "quiz2": [{"t": "choice", "q": "Which is NOT part of the UK?", "o": ["Scotland", "Ireland (the Republic)", "Wales"], "a": 1, "e": "Республіка Ірландія — окрема держава."}, {"t": "choice", "q": "How many countries are in the UK?", "o": ["Three", "Four", "Two"], "a": 1, "e": "England, Scotland, Wales, N. Ireland."}, {"t": "input", "q": "The capital of Northern Ireland is …", "a": ["belfast"], "e": "Belfast."}, {"t": "choice", "q": "«I live in Kiliia, a town … the Danube.»", "o": ["in", "on", "at"], "a": 1, "e": "On the river."}], "quiz3": [{"t": "choice", "q": "Why do we say «the UK» but «Ukraine» without «the»?", "o": ["Артикль the вживають із назвами-описами держав (United Kingdom)", "Це виняток без правила", "Помилка"], "a": 0, "e": "the USA, the UK — але Ukraine, France."}, {"t": "choice", "q": "Which flower is the symbol of Wales?", "o": ["a rose", "a daffodil", "a thistle"], "a": 1, "e": "Нарцис."}, {"t": "input", "q": "Kyiv is the capital … Ukraine. Устав прийменник.", "a": ["of"], "e": "capital of."}, {"t": "choice", "q": "«Great Britain» does NOT include…", "o": ["Northern Ireland", "Scotland", "Wales"], "a": 0, "e": "Це острів."}]}, {"id": "en-u3", "sec": "Units 3–4", "title": "Unit 3. My home: there is / there are, in / on, have got +", "goal": "Ти описуєш дім і кімнати, вживаєш there is/there are та прийменники in/on.", "learn": [{"h": "there is / there are", "p": ["<b>There's</b> (there is) + однина: <i>There's a TV in the living room. There's a shower in the bathroom.</i>", "<b>There are</b> + множина: <i>There are two tables in the kitchen. There are three people in the dining room.</i>"]}, {"h": "in / on", "p": ["<b>in</b> — усередині: <i>Dad's <b>in</b> the bathroom. I live <b>in</b> a house.</i>", "<b>on</b> — на поверхні: <i>The camera is <b>on</b> the floor. There's a dictionary <b>on</b> my desk.</i>"]}, {"h": "have got (positive)", "p": ["<b>I've got</b> a phone. <b>You've got</b> a guitar. <b>He's got</b> two cats. <b>She's got</b>… <b>It's got</b>… <b>We've got</b>… <b>They've got</b>…"], "note": "'s тут = has, а не is: <i>He's got</i> = He has got."}, {"h": "Rooms and things", "p": ["Кімнати: <i>bathroom</i> ванна, <i>bedroom</i> спальня, <i>dining room</i> столова, <i>hall</i> передпокій, <i>kitchen</i> кухня, <i>living room</i> вітальня, <i>toilet</i>; <i>bath, door, floor, shower, wall, window</i>.", "Речі: <i>bed, bookcase, board games</i> настільні ігри, <i>clock</i> годинник, <i>computer, clothes</i> одяг, <i>guitar, poster, pet fish</i> акваріумна рибка, <i>television / TV, toys</i>."]}], "remember": "There's + однина, There are + множина. in — усередині, on — на поверхні. I've got / he's got (= has got). Кімнати: living room, bedroom, kitchen, bathroom, dining room, hall.", "cards": [{"f": "There's / There are", "b": "There's + однина; There are + множина."}, {"f": "in / on", "b": "in — усередині (in the kitchen); on — на поверхні (on the table)."}, {"f": "I've got / he's got", "b": "У мене є / у нього є ('s тут = has)."}, {"f": "living room / dining room", "b": "вітальня / столова."}, {"f": "hall / floor / wall", "b": "передпокій / підлога / стіна."}, {"f": "board games / pet fish", "b": "настільні ігри / акваріумна рибка."}, {"f": "bookcase / clock", "b": "книжкова шафа / годинник (на стіні)."}], "quiz": [{"t": "choice", "q": "… a shower in the bathroom.", "o": ["There's", "There are"], "a": 0, "e": "Однина."}, {"t": "choice", "q": "… four chairs in the kitchen.", "o": ["There's", "There are"], "a": 1, "e": "Множина."}, {"t": "choice", "q": "There's a guitar … the bed.", "o": ["in", "on"], "a": 1, "e": "На поверхні."}, {"t": "choice", "q": "I've got a computer … my bedroom.", "o": ["in", "on"], "a": 0, "e": "Усередині кімнати."}, {"t": "choice", "q": "He … got two cats.", "o": ["have", "has"], "a": 1, "e": "He has got."}, {"t": "input", "q": "Переклади «вітальня»:", "a": ["living room", "a living room"], "e": "living room."}, {"t": "input", "q": "Переклади «кухня»:", "a": ["kitchen", "a kitchen"], "e": "kitchen."}, {"t": "choice", "q": "«Board games» — це…", "o": ["настільні ігри", "дошки", "ігри на дошці в класі"], "a": 0, "e": "Настільні ігри."}, {"t": "input", "q": "Переклади «вікно»:", "a": ["window", "a window"], "e": "window."}, {"t": "choice", "q": "There are two pictures … the wall.", "o": ["in", "on"], "a": 1, "e": "On the wall."}], "quiz2": [{"t": "choice", "q": "… any pictures on the wall.", "o": ["There is", "There are", "There isn't"], "a": 1, "e": "Pictures — множина."}, {"t": "input", "q": "Заповни: «My sister … got a guitar.»", "a": ["has"], "e": "She has got."}, {"t": "choice", "q": "«The keys are … the table» (на столі)", "o": ["in", "on", "at"], "a": 1, "e": "on."}, {"t": "choice", "q": "Where do you usually have dinner?", "o": ["in the dining room", "on the dining room", "at dining room"], "a": 0, "e": "in the room."}, {"t": "input", "q": "Переклади «книжкова шафа»:", "a": ["bookcase", "a bookcase"], "e": "bookcase."}], "quiz3": [{"t": "choice", "q": "«There … a sofa and two chairs in the room.» Що поставити?", "o": ["is", "are"], "a": 0, "e": "Дієслово узгоджується з першим предметом."}, {"t": "choice", "q": "«He's got a dog» — що тут 's?", "o": ["has", "is", "us"], "a": 0, "e": "has got."}, {"t": "choice", "q": "«I live … a flat … the third floor.»", "o": ["in / on", "on / in", "at / on"], "a": 0, "e": "in a flat, on the floor."}, {"t": "input", "q": "Переклади «передпокій»:", "a": ["hall", "a hall"], "e": "hall."}]}, {"id": "en-u4", "sec": "Units 3–4", "title": "Unit 4. My things: have got (– і ?)", "goal": "Ти будуєш заперечення й питання з have got і описуєш свої речі.", "learn": [{"h": "Negative", "p": ["<b>haven't got</b> — I, you, we, they: <i>I haven't got a football. We haven't got any chocolate.</i>", "<b>hasn't got</b> — he, she, it: <i>He hasn't got a scarf. She hasn't got an apple.</i>"]}, {"h": "Questions and short answers", "p": ["<i><b>Have</b> you got a pet? — Yes, I have. / No, I haven't.</i>", "<i><b>Has</b> he got a bike? — Yes, he has. / No, he hasn't.</i>", "<i>Have they got their hats? — Yes, they have.</i>"]}, {"h": "Things in my school bag", "p": ["<i>banana, chocolate</i> шоколад, <i>coat</i> пальто, <i>football</i> м'яч, <i>gloves</i> рукавички, <i>hat</i> шапка, <i>keys</i> ключі, <i>scarf</i> шарф, <i>wallet</i> гаманець, <i>water bottle</i> пляшка для води."]}, {"h": "Adjectives: things", "p": ["<i>big</i> великий — <i>small</i> малий; <i>long</i> довгий — <i>short</i> короткий; <i>new</i> — <i>old</i>; <i>clean</i> чистий — <i>dirty</i> брудний; <i>dark</i> темний — <i>light blue</i> блакитний. Прикметник стоїть <b>перед</b> іменником: <i>a big bag</i>, і не має множини: <i>two big bags</i> (не «bigs»)."]}], "remember": "haven't got (I, you, we, they) / hasn't got (he, she, it). Питання: Have/Has + підмет + got? Коротко: Yes, I have / No, he hasn't. Речі: gloves, scarf, keys, wallet, water bottle. Прикметник перед іменником і без множини.", "cards": [{"f": "Заперечення have got", "b": "haven't got / hasn't got (he, she, it)."}, {"f": "Have you got a pet? — відповідь", "b": "Yes, I have. / No, I haven't."}, {"f": "Has she got a hat? — відповідь", "b": "Yes, she has. / No, she hasn't."}, {"f": "gloves / scarf", "b": "рукавички / шарф."}, {"f": "keys / wallet", "b": "ключі / гаманець."}, {"f": "water bottle", "b": "пляшка для води."}, {"f": "clean / dirty", "b": "чистий / брудний."}, {"f": "Де стоїть прикметник?", "b": "Перед іменником; у множині не змінюється: two big bags."}], "quiz": [{"t": "choice", "q": "Tony … a pet fish. (заперечення)", "o": ["haven't got", "hasn't got"], "a": 1, "e": "He → hasn't got."}, {"t": "choice", "q": "We … a shower in our bathroom. (заперечення)", "o": ["haven't got", "hasn't got"], "a": 0, "e": "We → haven't got."}, {"t": "choice", "q": "… Rebecca got a new car?", "o": ["Have", "Has"], "a": 1, "e": "Has she got."}, {"t": "choice", "q": "Have you got your glasses? —", "o": ["Yes, I have.", "Yes, I has.", "Yes, I do."], "a": 0, "e": "Yes, I have."}, {"t": "input", "q": "Переклади «рукавички»:", "a": ["gloves"], "e": "gloves."}, {"t": "input", "q": "Переклади «гаманець»:", "a": ["wallet", "a wallet"], "e": "wallet."}, {"t": "input", "q": "Переклади «шарф»:", "a": ["scarf", "a scarf"], "e": "scarf."}, {"t": "choice", "q": "«Брудний» —", "o": ["clean", "dirty", "dark"], "a": 1, "e": "dirty."}, {"t": "choice", "q": "Яке словосполучення правильне?", "o": ["a bag big", "a big bag", "a bigs bag"], "a": 1, "e": "Прикметник перед іменником."}], "quiz2": [{"t": "choice", "q": "«She … got any brothers.»", "o": ["haven't", "hasn't", "doesn't"], "a": 1, "e": "She hasn't got."}, {"t": "choice", "q": "Has your dad got a car? — …", "o": ["Yes, he has.", "Yes, he does.", "Yes, he is."], "a": 0, "e": "has."}, {"t": "input", "q": "Переклади «ключі»:", "a": ["keys"], "e": "keys."}, {"t": "choice", "q": "Which is correct?", "o": ["a big new blue bag", "a blue new big bag", "a new blue big bag"], "a": 0, "e": "Порядок: розмір — вік — колір."}, {"t": "input", "q": "Antonym of «clean»:", "a": ["dirty"], "e": "dirty."}], "quiz3": [{"t": "choice", "q": "«Two blacks cats» — знайди помилку.", "o": ["Прикметник не має множини: two black cats", "Треба «two black cat»", "Помилки немає"], "a": 0, "e": "Прикметники незмінні."}, {"t": "choice", "q": "«Have you got any money?» Чому «any»?", "o": ["Питання + незлічуване", "Money — множина", "Це помилка"], "a": 0, "e": "any в питаннях."}, {"t": "input", "q": "Заповни: «They … got a water bottle.» (не мають)", "a": ["haven't"], "e": "haven't got."}, {"t": "input", "q": "Переклади «гаманець»:", "a": ["wallet", "a wallet"], "e": "wallet."}]}, {"id": "en-u5", "sec": "Units 5–6", "title": "Unit 5. What can you do? can / can't, prepositions", "goal": "Ти вживаєш can/can't, знаєш прийменники місця і назви частин тіла й умінь.", "learn": [{"h": "can / can't", "p": ["Форма однакова для всіх осіб, <b>без -s</b> і <b>без to</b>: <i>I can play the guitar. She can play the guitar. He can't speak Italian.</i>", "Питання: <i><b>Can</b> you ride a horse? — Yes, I can. / No, I can't.</i> <i>Can she swim? — Yes, she can.</i>"]}, {"h": "Activities and skills", "p": ["<i>cook</i> готувати, <i>paint</i> малювати фарбами, <i>play</i> грати, <i>remember</i> запам'ятовувати, <i>ride</i> їздити верхи, <i>sail</i> плавати на човні, <i>sing</i> співати, <i>skate</i> кататися на ковзанах, <i>speak</i> розмовляти, <i>swim</i> плавати."]}, {"h": "Parts of the body", "p": ["<i>arm</i> рука (від кисті до плеча), <i>hand</i> кисть, <i>leg</i> нога, <i>foot — feet</i> стопа — стопи, <i>head</i> голова, <i>face</i> обличчя, <i>hair</i> волосся, <i>eye</i> око, <i>ear</i> вухо, <i>nose</i> ніс, <i>mouth</i> рот, <i>tooth — teeth</i> зуб — зуби."]}, {"h": "Prepositions: in, on, behind, under", "p": ["<i>We're <b>in</b> the classroom. Your phone's <b>on</b> the table. He's <b>behind</b> the wall</i> (за стіною). <i>Your pencil is <b>under</b> the book</i> (під книжкою)."]}], "remember": "can/can't — однаково для всіх осіб, без -s і без to. Can you…? — Yes, I can / No, I can't. Тіло: arm, hand, leg, foot—feet, tooth—teeth. Прийменники: in, on, behind (за), under (під).", "cards": [{"f": "Чи додається -s до can у he/she?", "b": "Ні: he can, she can."}, {"f": "Що йде після can?", "b": "Дієслово без to: I can swim."}, {"f": "Can you ride a horse? — відповідь", "b": "Yes, I can. / No, I can't."}, {"f": "foot / tooth — множина", "b": "feet / teeth."}, {"f": "arm / hand", "b": "рука від кисті до плеча / кисть."}, {"f": "behind / under", "b": "за / під."}, {"f": "sail / skate", "b": "плавати на човні / кататися на ковзанах."}, {"f": "paint", "b": "малювати фарбами."}], "quiz": [{"t": "choice", "q": "She … play the guitar.", "o": ["can", "cans", "can to"], "a": 0, "e": "Без -s і без to."}, {"t": "choice", "q": "I … speak Italian. (не вмію)", "o": ["can't", "don't can", "not can"], "a": 0, "e": "can't."}, {"t": "choice", "q": "Can they swim? —", "o": ["Yes, they can.", "Yes, they do.", "Yes, they are."], "a": 0, "e": "Yes, they can."}, {"t": "choice", "q": "She can … very well.", "o": ["sing", "sings", "to sing"], "a": 0, "e": "Після can — початкова форма."}, {"t": "input", "q": "Множина від «foot»:", "a": ["feet"], "e": "feet."}, {"t": "input", "q": "Множина від «tooth»:", "a": ["teeth"], "e": "teeth."}, {"t": "choice", "q": "The cat's … the bed. (під)", "o": ["on", "under", "behind"], "a": 1, "e": "under."}, {"t": "choice", "q": "He's … the wall. (за)", "o": ["behind", "in", "on"], "a": 0, "e": "behind."}, {"t": "input", "q": "Переклади «кататися на ковзанах»:", "a": ["skate", "to skate", "skating"], "e": "skate."}, {"t": "input", "q": "Переклади «вухо»:", "a": ["ear", "an ear"], "e": "ear."}], "quiz2": [{"t": "choice", "q": "«Can she swims?» — виправ.", "o": ["Can she swim?", "Can she swimming?", "Does she can swim?"], "a": 0, "e": "Після can — без -s."}, {"t": "input", "q": "Заповни: «I … ride a horse but I … swim.» (вмію / не вмію)", "a": ["can can't", "can / can't", "can, can't"], "e": "can … can't."}, {"t": "choice", "q": "«The ball is … the chair» (за стільцем)", "o": ["under", "behind", "on"], "a": 1, "e": "behind."}, {"t": "input", "q": "Множина від «foot»:", "a": ["feet"], "e": "feet."}, {"t": "choice", "q": "Скільки «feet» у людини?", "o": ["two", "one", "four"], "a": 0, "e": "Дві стопи."}], "quiz3": [{"t": "choice", "q": "«Can» вживають для…", "o": ["уміння і дозволу", "минулого", "майбутнього"], "a": 0, "e": "Ability and permission."}, {"t": "choice", "q": "«She can't paint» означає…", "o": ["вона не вміє малювати фарбами", "вона не хоче", "їй заборонили назавжди"], "a": 0, "e": "paint — фарбами."}, {"t": "input", "q": "Переклади «плавати на човні» одним словом:", "a": ["sail"], "e": "sail."}, {"t": "input", "q": "Множина від «tooth»:", "a": ["teeth"], "e": "teeth."}]}, {"id": "en-u6", "sec": "Units 5–6", "title": "Unit 6. Party time! some / any / lots of, food, time", "goal": "Ти розрізняєш злічувані й незлічувані іменники, вживаєш some/any/lots of і кажеш котра година.", "learn": [{"h": "Countable and uncountable", "p": ["<b>Countable</b> (можна порахувати): <i>an apple — two apples, cakes, eggs, tomatoes, biscuits</i>. <b>Uncountable</b> (не рахуємо): <i>milk, water, bread, butter, cheese, meat, rice, soup, juice, sugar</i> — без a/an і без множини."]}, {"h": "some / any / lots of", "p": ["<b>some</b> — у ствердженнях і <b>пропозиціях</b>: <i>We made some cakes. There is some milk. Would you like some water?</i>", "<b>any</b> — у запереченнях і питаннях: <i>We didn't make any cakes. Is there any milk? Are there any bananas?</i>", "<b>lots of</b> — багато (і з тими, і з тими): <i>We've got lots of apples. There's lots of bread.</i>"]}, {"h": "Food", "p": ["<i>biscuits</i> печиво, <i>bread</i> хліб, <i>butter</i> масло, <i>cakes</i> тістечка, <i>cheese</i> сир, <i>chicken</i> курятина, <i>chips</i> картопля фрі, <i>eggs, fruit, juice, lemonade, meat, milk, pasta, potatoes, rice, soup, sweet snacks, tomatoes, vegetables</i> овочі, <i>drinks</i> напої."]}, {"h": "Telling the time", "p": ["<i>It's four <b>o'clock</b>. It's 9 <b>am</b></i> (до полудня). <i>It's 7 <b>pm</b></i> (після полудня). <i>It's one ten</i> (1:10). <i>It's three thirty</i> (3:30). <i>It's two fifty</i> (2:50).", "<b>past</b> — для хвилин 1–30: <i>It's twenty-five past four</i>. <b>to</b> — для хвилин 31–59: <i>It's ten to three</i>. Числа: <i>thirty, forty, fifty, sixty</i>."]}], "remember": "Uncountable: milk, water, bread, butter, rice — без a/an і множини. some — ствердження й пропозиції; any — питання й заперечення; lots of — багато. Час: o'clock, am/pm; past (1–30 хв), to (31–59).", "cards": [{"f": "Незлічувані іменники", "b": "milk, water, bread, butter, cheese, rice, sugar — без a/an і без множини."}, {"f": "Коли some?", "b": "У ствердженнях і в пропозиціях: Would you like some tea?"}, {"f": "Коли any?", "b": "У запереченнях і питаннях."}, {"f": "lots of", "b": "багато — і зі злічуваними, і з незлічуваними."}, {"f": "biscuits / chips", "b": "печиво / картопля фрі."}, {"f": "vegetables / fruit", "b": "овочі / фрукти."}, {"f": "am / pm", "b": "години до полудня / після полудня."}, {"f": "past / to", "b": "past — хвилини 1–30; to — хвилини 31–59."}], "quiz": [{"t": "choice", "q": "Is there … butter?", "o": ["some", "any"], "a": 1, "e": "Питання — any."}, {"t": "choice", "q": "We've got … milk.", "o": ["some", "any"], "a": 0, "e": "Ствердження — some."}, {"t": "choice", "q": "There aren't … people here.", "o": ["some", "any"], "a": 1, "e": "Заперечення — any."}, {"t": "choice", "q": "Would you like … bananas?", "o": ["some", "any"], "a": 0, "e": "Пропозиція — some."}, {"t": "choice", "q": "Яке слово незлічуване?", "o": ["egg", "bread", "tomato"], "a": 1, "e": "bread."}, {"t": "input", "q": "Переклади «печиво»:", "a": ["biscuits", "biscuit"], "e": "biscuits."}, {"t": "input", "q": "Переклади «овочі»:", "a": ["vegetables"], "e": "vegetables."}, {"t": "choice", "q": "9 am — це…", "o": ["9 ранку", "9 вечора"], "a": 0, "e": "am — до полудня."}, {"t": "choice", "q": "«It's three thirty» — це…", "o": ["3:13", "3:30", "2:30"], "a": 1, "e": "Пів на четверту."}, {"t": "choice", "q": "Для хвилин після 30 вживають…", "o": ["past", "to"], "a": 1, "e": "ten to three."}], "quiz2": [{"t": "choice", "q": "«Would you like … tea?»", "o": ["some", "any"], "a": 0, "e": "Пропозиція — some."}, {"t": "choice", "q": "Which word is countable?", "o": ["bread", "egg", "milk"], "a": 1, "e": "an egg — two eggs."}, {"t": "choice", "q": "«It's a quarter to five» — котра година?", "o": ["4:45", "5:15", "4:15"], "a": 0, "e": "to — до п'ятої."}, {"t": "input", "q": "Заповни: «There … any juice in the fridge.» (немає)", "a": ["isn't"], "e": "Juice — незлічуване."}, {"t": "input", "q": "Переклади «картопля фрі»:", "a": ["chips"], "e": "chips (британською)."}], "quiz3": [{"t": "choice", "q": "«It's ten past seven» — котра година?", "o": ["7:10", "6:50", "10:07"], "a": 0, "e": "past — після сьомої."}, {"t": "choice", "q": "«Two waters, please» — чому так кажуть у кафе?", "o": ["Мають на увазі дві пляшки/склянки — розмовне скорочення", "Це помилка завжди", "Water злічуване"], "a": 0, "e": "Виняток розмовної мови."}, {"t": "input", "q": "Напиши час 8:30 словами (два слова + eight): half … eight", "a": ["past", "half past eight"], "e": "half past eight."}, {"t": "choice", "q": "«How much …?» — з яким словом?", "o": ["sugar", "apples", "eggs"], "a": 0, "e": "Незлічуване."}]}, {"id": "en-culture2", "sec": "Culture", "title": "Culture: Holidays in the USA and in Ukraine", "goal": "Ти знаєш головні свята США й України та фрази-привітання.", "learn": [{"h": "Holidays in the USA", "p": ["<b>New Year's Day</b> — 1 January. <b>Valentine's Day</b> — 14 February. <b>Easter</b> — весна. <b>Independence Day</b> — <b>4 July</b> (fireworks, parades, barbecue). <b>Halloween</b> — 31 October (costumes, pumpkins, «trick or treat»). <b>Thanksgiving</b> — четвертий четвер листопада (turkey, family dinner). <b>Christmas</b> — 25 December."]}, {"h": "Holidays in Ukraine", "p": ["<b>New Year</b> — 1 January. <b>Christmas</b> — 25 December. <b>Easter</b> — <i>paska</i>, <i>pysanky</i> (painted eggs). <b>Independence Day</b> — <b>24 August</b>. <b>Day of Ukrainian Writing and Language</b> — 27 October. <b>Vyshyvanka Day</b> — третій четвер травня. <b>Malanka</b>, <b>Ivan Kupala</b> (summer, flower wreaths)."]}, {"h": "Talking about holidays", "p": ["<i>My favourite holiday is… It's in December. We decorate the tree, cook a big dinner and give presents. I always visit my grandparents.</i>", "Привітання: <i>Happy New Year! Merry Christmas! Happy birthday! Happy Easter! Best wishes!</i>"]}], "remember": "USA: Independence Day 4 July, Thanksgiving — 4-й четвер листопада, Halloween 31 October. Україна: Independence Day 24 August, Easter — paska й pysanky, Vyshyvanka Day у травні. Привітання: Merry Christmas! Happy New Year!", "cards": [{"f": "Independence Day in the USA", "b": "4 July."}, {"f": "Independence Day of Ukraine", "b": "24 August."}, {"f": "Thanksgiving", "b": "Четвертий четвер листопада; індичка й родинна вечеря."}, {"f": "Halloween", "b": "31 October; костюми, гарбузи, «trick or treat»."}, {"f": "Pysanky", "b": "Розписані великодні яйця."}, {"f": "Merry Christmas!", "b": "Веселого Різдва!"}, {"f": "Vyshyvanka Day", "b": "Третій четвер травня."}], "quiz": [{"t": "input", "q": "Коли Independence Day у США? (число й місяць англійською)", "a": ["4 july", "july 4", "the fourth of july", "4th july"], "e": "4 July."}, {"t": "input", "q": "Коли День Незалежності України? (англійською)", "a": ["24 august", "august 24", "24th august"], "e": "24 August."}, {"t": "choice", "q": "Halloween is on …", "o": ["31 October", "25 December", "14 February"], "a": 0, "e": "31 жовтня."}, {"t": "choice", "q": "Коли Thanksgiving?", "o": ["У листопаді", "У липні", "У березні"], "a": 0, "e": "Четвертий четвер листопада."}, {"t": "choice", "q": "«Веселого Різдва!» —", "o": ["Happy New Year!", "Merry Christmas!", "Happy Easter!"], "a": 1, "e": "Merry Christmas!"}, {"t": "input", "q": "Як англійською назвати розписані великодні яйця (українське слово)?", "a": ["pysanky", "pysanka"], "e": "Pysanky."}, {"t": "choice", "q": "Що роблять на Halloween?", "o": ["Одягають костюми й ходять по цукерки", "Печуть паску", "Пускають феєрверки"], "a": 0, "e": "Trick or treat."}], "quiz2": [{"t": "choice", "q": "Which holiday is celebrated on the fourth Thursday of November?", "o": ["Thanksgiving", "Halloween", "Christmas"], "a": 0, "e": "США."}, {"t": "choice", "q": "«Trick or treat» is said on…", "o": ["Halloween", "Easter", "New Year"], "a": 0, "e": "31 жовтня."}, {"t": "input", "q": "When is Independence Day of Ukraine? (day + month)", "a": ["24 august", "august 24"], "e": "24 August."}, {"t": "choice", "q": "What do Ukrainians decorate for Easter?", "o": ["eggs (pysanky)", "trees", "pumpkins"], "a": 0, "e": "Писанки."}], "quiz3": [{"t": "choice", "q": "Why is the 4th of July important in the USA?", "o": ["It's Independence Day", "It's Thanksgiving", "It's Christmas"], "a": 0, "e": "1776."}, {"t": "choice", "q": "Which greeting is correct for 25 December?", "o": ["Merry Christmas!", "Happy Easter!", "Happy Halloween!"], "a": 0, "e": "Різдво."}, {"t": "input", "q": "When is Vyshyvanka Day? (month)", "a": ["may", "травень", "у травні"], "e": "May."}, {"t": "choice", "q": "Which is a traditional Thanksgiving food?", "o": ["turkey", "pysanky", "pancakes"], "a": 0, "e": "Індичка."}]}, {"id": "en-u7", "sec": "Units 7–8", "title": "Unit 7. My day: Present Simple (+ і –)", "goal": "Ти будуєш Present Simple у ствердженні й запереченні та розповідаєш про свій день.", "learn": [{"h": "Positive", "p": ["I / you / we / they + дієслово: <i>They work all day. They walk to school on Tuesdays.</i>", "<b>He / she / it + -s</b>: <i>She catches the bus to school. He finishes school at 3.30 pm.</i>", "Правопис: <i>-s</i> зазвичай (works); <b>-es</b> після -s, -sh, -ch, -x, -o (<i>catches, washes, goes</i>); <b>y → ies</b> після приголосної (<i>study → studies</i>); <i>have → has</i>."]}, {"h": "Negative", "p": ["<b>don't</b> (I, you, we, they) / <b>doesn't</b> (he, she, it) + дієслово <b>без -s</b>: <i>I don't start school at 9 o'clock. He doesn't get up at 7 o'clock every day.</i>"]}, {"h": "Daily activities", "p": ["<i>get up</i> вставати, <i>have a shower</i> приймати душ, <i>get dressed</i> одягатися, <i>have breakfast / lunch / dinner</i>, <i>catch the bus to school</i> сідати на автобус, <i>walk to school</i> іти пішки, <i>go to bed</i> лягати спати."]}, {"h": "Порядок слів", "p": ["Підмет → присудок → додаток → місце → час: <i>I have breakfast at home at 7 o'clock.</i> Час можна поставити й на початок: <i>At 7 o'clock I have breakfast.</i>"]}], "remember": "He/she/it + -s: works, catches, studies, goes, has. Заперечення: don't / doesn't + дієслово без -s. Daily: get up, have a shower, get dressed, have breakfast, catch the bus, go to bed.", "cards": [{"f": "Present Simple для he/she/it", "b": "Додаємо -s: he works, she goes."}, {"f": "Коли -es?", "b": "Після -s, -sh, -ch, -x, -o: catches, washes, goes."}, {"f": "study → he …", "b": "studies (y → ies)."}, {"f": "have → he …", "b": "has."}, {"f": "Заперечення Present Simple", "b": "don't / doesn't + дієслово без -s."}, {"f": "get up / get dressed", "b": "вставати / одягатися."}, {"f": "catch the bus", "b": "сідати на автобус."}, {"f": "go to bed", "b": "лягати спати."}], "quiz": [{"t": "input", "q": "Jack … (get up) at 6.30 am. Напиши дієслово.", "a": ["gets up", "gets"], "e": "gets up."}, {"t": "input", "q": "Freya … (have) a big breakfast.", "a": ["has"], "e": "has."}, {"t": "input", "q": "You … (catch) the bus at 8 o'clock.", "a": ["catch"], "e": "You catch — без -s."}, {"t": "input", "q": "He … (finish) school at 3.30 pm.", "a": ["finishes"], "e": "finishes (-sh → -es)."}, {"t": "choice", "q": "I … start school at 9 o'clock. (заперечення)", "o": ["don't", "doesn't"], "a": 0, "e": "I don't."}, {"t": "choice", "q": "She … like coffee. (заперечення)", "o": ["don't", "doesn't"], "a": 1, "e": "She doesn't."}, {"t": "choice", "q": "He doesn't … to school.", "o": ["walk", "walks"], "a": 0, "e": "Після doesn't — без -s."}, {"t": "input", "q": "Переклади «приймати душ»: have a …", "a": ["shower"], "e": "have a shower."}, {"t": "input", "q": "Переклади «вставати з ліжка» (два слова):", "a": ["get up"], "e": "get up."}], "quiz2": [{"t": "input", "q": "Заповни: «My brother … (study) English every day.»", "a": ["studies"], "e": "y → ies."}, {"t": "input", "q": "Заповни: «She … (not like) milk.»", "a": ["doesn't like", "does not like"], "e": "doesn't like."}, {"t": "choice", "q": "Which is correct?", "o": ["He don't get up early.", "He doesn't gets up early.", "He doesn't get up early."], "a": 2, "e": "Після doesn't — без -s."}, {"t": "input", "q": "Заповни: «We … (have) lunch at 1 pm.»", "a": ["have"], "e": "We have."}, {"t": "input", "q": "Переклади «одягатися» (два слова):", "a": ["get dressed"], "e": "get dressed."}], "quiz3": [{"t": "choice", "q": "Чому «She goes», а не «She gos»?", "o": ["Після -o додаємо -es", "Це виняток без правила", "Помилка"], "a": 0, "e": "go → goes."}, {"t": "input", "q": "Заповни: «He … (watch) TV in the evening.»", "a": ["watches"], "e": "-ch → -es."}, {"t": "input", "q": "Зроби заперечним: «She has breakfast at 7.» → «She … breakfast at 7.»", "a": ["doesn't have", "does not have"], "e": "doesn't have."}, {"t": "choice", "q": "«My dad works and my mum … too.»", "o": ["work", "works", "working"], "a": 1, "e": "mum → works."}]}, {"id": "en-u8", "sec": "Units 7–8", "title": "Unit 8. At school: питання в Present Simple, Wh-questions", "goal": "Ти ставиш питання з do/does і Wh-словами й називаєш шкільні предмети.", "learn": [{"h": "Questions and short answers", "p": ["<b>Do</b> + I/you/we/they, <b>Does</b> + he/she/it; дієслово <b>без -s</b>.", "<i>Do you use IT in English lessons? — Yes, I do. / No, I don't.</i>", "<i>Does he like maths? — Yes, he does. / No, he doesn't.</i>", "<i>Do they speak Turkish? — Yes, they do.</i>"]}, {"h": "Wh- questions", "p": ["<b>Who?</b> — людина (Ruby, my sister). <b>What?</b> — річ (a computer, lessons). <b>Where?</b> — місце (New York, school). <b>When?</b> — час або день (Sunday, 5 o'clock). <b>How often?</b> — як часто (every day, every Tuesday). Порядок: <i>Where <b>do</b> you live? What time <b>does</b> it start?</i>"]}, {"h": "School subjects", "p": ["<i>art</i> мистецтво, <i>English</i>, <i>French</i>, <i>geography</i>, <i>history</i>, <i>IT</i> інформатика, <i>maths</i> математика, <i>music</i>, <i>PE</i> фізкультура, <i>science</i> природознавство."]}, {"h": "Words with two meanings", "p": ["<i>catch</i> — ловити / сідати (на автобус); <i>come</i> — приходити / бути родом (I come from Ukraine); <i>get</i> — отримувати / добиратися; <i>meet</i> — зустрічати / знайомитися; <i>see</i> — бачити / бачитися; <i>think</i> — думати / вважати."]}], "remember": "Do/Does + підмет + дієслово? Коротко: Yes, I do / No, he doesn't. Wh-: Who (хто), What (що), Where (де), When (коли), How often (як часто). Предмети: maths, science, IT, PE, art, history, geography.", "cards": [{"f": "Питання в Present Simple", "b": "Do/Does + підмет + дієслово (без -s)?"}, {"f": "Does she like art? — відповідь", "b": "Yes, she does. / No, she doesn't."}, {"f": "Who / What / Where / When", "b": "хто / що / де / коли."}, {"f": "How often?", "b": "Як часто? — every day, every Tuesday."}, {"f": "maths / science / IT / PE", "b": "математика / природознавство / інформатика / фізкультура."}, {"f": "«I come from Ukraine» означає…", "b": "Я родом з України."}, {"f": "catch — два значення", "b": "ловити і сідати (на автобус)."}], "quiz": [{"t": "choice", "q": "… Cameron like maths?", "o": ["Do", "Does"], "a": 1, "e": "He → Does."}, {"t": "choice", "q": "… you have PE on Monday?", "o": ["Do", "Does"], "a": 0, "e": "You → Do."}, {"t": "choice", "q": "Does Maria … science at school?", "o": ["study", "studies"], "a": 0, "e": "Після does — без -s."}, {"t": "choice", "q": "Do Harvey and Isaac walk to school? —", "o": ["Yes, they do.", "Yes, they does.", "Yes, they are."], "a": 0, "e": "Yes, they do."}, {"t": "choice", "q": "… do you live? — In Kiliia.", "o": ["When", "Where", "Who"], "a": 1, "e": "Where — місце."}, {"t": "choice", "q": "… is your birthday? — In May.", "o": ["When", "Where", "What"], "a": 0, "e": "When — час."}, {"t": "input", "q": "Як англійською «фізкультура» (дві букви)?", "a": ["pe", "p.e."], "e": "PE."}, {"t": "input", "q": "Як англійською «природознавство»?", "a": ["science"], "e": "science."}, {"t": "choice", "q": "«How often do you play tennis?» питає про…", "o": ["місце", "частоту", "час доби"], "a": 1, "e": "Як часто."}], "quiz2": [{"t": "choice", "q": "«… your friends like maths?»", "o": ["Do", "Does", "Are"], "a": 0, "e": "Friends → Do."}, {"t": "input", "q": "Заповни: «What time … the lesson start?»", "a": ["does"], "e": "Lesson → does."}, {"t": "choice", "q": "«Where does she lives?» — виправ.", "o": ["Where does she live?", "Where do she live?", "Where she lives?"], "a": 0, "e": "Після does — без -s."}, {"t": "input", "q": "Переклади «розклад уроків»:", "a": ["timetable", "a timetable"], "e": "timetable."}, {"t": "choice", "q": "«How often» asks about…", "o": ["frequency", "place", "time of day"], "a": 0, "e": "Частота."}], "quiz3": [{"t": "choice", "q": "«Who teaches you English?» Чому немає «does»?", "o": ["Питання до підмета — do/does не потрібне", "Це помилка", "Teach — виняток"], "a": 0, "e": "Subject question."}, {"t": "input", "q": "Постав питання до «She studies IT»: «What … she study?»", "a": ["does"], "e": "does."}, {"t": "choice", "q": "«I come from Ukraine» означає…", "o": ["я родом з України", "я приходжу з України щодня", "я їду в Україну"], "a": 0, "e": "Друге значення come."}, {"t": "input", "q": "Переклади «природознавство»:", "a": ["science"], "e": "science."}]}, {"id": "en-u9", "sec": "Units 9–10", "title": "Unit 9. Feeling good: like + -ing, object pronouns", "goal": "Ти кажеш, що любиш і не любиш робити, і вживаєш об'єктні займенники.", "learn": [{"h": "like + -ing", "p": ["Після <b>like</b> дієслово стоїть із <b>-ing</b>: <i>I like dancing. He likes dancing. I don't like running. She doesn't like swimming.</i>", "Так само з <i>love, enjoy, hate</i>: <i>I love reading. I hate doing homework.</i>"]}, {"h": "Object pronouns", "p": ["I → <b>me</b> (<i>Do you like me?</i>), you → <b>you</b>, he → <b>him</b> (<i>I don't like him.</i>), she → <b>her</b> (<i>This present is for her.</i>), it → <b>it</b>, we → <b>us</b> (<i>Can you help us?</i>), they → <b>them</b> (<i>I like them.</i>).", "Займенник-підмет стоїть <b>перед</b> дієсловом, об'єктний — <b>після</b> дієслова або прийменника."]}, {"h": "Sports and activities", "p": ["<i>badminton, baseball, basketball, dancing, football, hockey, running, swimming, table tennis, tennis</i>."]}, {"h": "Health", "p": ["<i>feel well / feel fine / feel better</i> — почуватися добре / краще; <i>good for</i> — корисно; <i>not good for</i> — некорисно. <i>Vegetables are good for you. Sweet snacks aren't good for you.</i>"]}], "remember": "Після like/love/hate — дієслово з -ing: I like swimming. Об'єктні: me, you, him, her, it, us, them — після дієслова чи прийменника. good for you — корисно.", "cards": [{"f": "Яка форма дієслова після like?", "b": "-ing: I like dancing."}, {"f": "Об'єктні займенники", "b": "me, you, him, her, it, us, them."}, {"f": "he / she в об'єктній формі", "b": "him / her."}, {"f": "we / they в об'єктній формі", "b": "us / them."}, {"f": "good for you", "b": "корисно для тебе."}, {"f": "feel better", "b": "почуватися краще."}, {"f": "table tennis", "b": "настільний теніс."}], "quiz": [{"t": "choice", "q": "I like … basketball.", "o": ["play", "playing", "to playing"], "a": 1, "e": "like + -ing."}, {"t": "choice", "q": "Jo … dancing. (не любить)", "o": ["don't like", "doesn't like"], "a": 1, "e": "Jo → doesn't."}, {"t": "choice", "q": "Kate is very funny. I like … a lot.", "o": ["she", "her"], "a": 1, "e": "Об'єктний займенник."}, {"t": "choice", "q": "I like playing tennis. It's good for … .", "o": ["I", "me"], "a": 1, "e": "Після прийменника — me."}, {"t": "choice", "q": "They're very nice. I like … .", "o": ["they", "them"], "a": 1, "e": "them."}, {"t": "choice", "q": "Can you help …? (нам)", "o": ["we", "us"], "a": 1, "e": "us."}, {"t": "input", "q": "Переклади «настільний теніс» (два слова):", "a": ["table tennis"], "e": "table tennis."}, {"t": "choice", "q": "«Vegetables are good for you» означає…", "o": ["овочі корисні", "овочі смачні", "овочі дешеві"], "a": 0, "e": "Корисно."}, {"t": "input", "q": "Постав у -ing форму: swim →", "a": ["swimming"], "e": "swimming."}], "quiz2": [{"t": "input", "q": "Заповни: «He likes … (swim) in summer.»", "a": ["swimming"], "e": "like + -ing."}, {"t": "choice", "q": "«This present is for …» (для неї)", "o": ["she", "her", "hers"], "a": 1, "e": "Після прийменника — her."}, {"t": "choice", "q": "«We don't like … » (їх)", "o": ["they", "them", "their"], "a": 1, "e": "them."}, {"t": "input", "q": "Переклади «настільний теніс»:", "a": ["table tennis"], "e": "table tennis."}, {"t": "choice", "q": "«Vegetables are good … you.»", "o": ["for", "to", "at"], "a": 0, "e": "good for."}], "quiz3": [{"t": "choice", "q": "«I like him» vs «I like his». Яке правильне?", "o": ["I like him", "I like his", "Обидва"], "a": 0, "e": "Об'єктний займенник."}, {"t": "input", "q": "Заповни: «She hates … (get) up early.»", "a": ["getting"], "e": "hate + -ing."}, {"t": "choice", "q": "«Can you help …?» (нам)", "o": ["we", "us", "our"], "a": 1, "e": "us."}, {"t": "input", "q": "Постав -ing: «run» →", "a": ["running"], "e": "Подвоєння n."}]}, {"id": "en-u10", "sec": "Units 9–10", "title": "Unit 10. Things we do: Present Continuous", "goal": "Ти будуєш Present Continuous і називаєш домашні обов'язки та гуртки.", "learn": [{"h": "Форма", "p": ["<b>am / is / are + дієслово + -ing</b>: <i>I'm cooking. He's cooking. They're cooking.</i>", "Заперечення: <i>I'm not reading. She isn't reading. We aren't reading.</i>", "Питання: <i>Are you sleeping? — Yes, I am. / No, I'm not. Is he sleeping? — Yes, he is. / No, he isn't.</i>"]}, {"h": "Spelling -ing", "p": ["Зазвичай просто <b>+ing</b>: <i>read → reading, wash → washing, look → looking</i>.", "<b>-e</b> зникає: <i>dance → dancing, write → writing, come → coming, ride → riding</i>.", "Коротке слово з однією приголосною в кінці — <b>подвоєння</b>: <i>swim → swimming, sit → sitting</i>."]}, {"h": "After-school activities", "p": ["<i>athletics</i> легка атлетика, <i>board games</i>, <i>coding</i> кодування, <i>cookery</i> кулінарія, <i>drama</i> театральне мистецтво, <i>film</i>, <i>horse riding</i> верхова їзда, <i>Italian</i>, <i>judo</i>, <i>yoga</i>."]}, {"h": "Jobs around the house", "p": ["<i>carry the shopping</i> нести продукти, <i>clean the bath</i>, <i>cook dinner</i>, <i>do the washing-up</i> мити посуд, <i>feed the cat</i> годувати кота, <i>make your bed</i> заправляти ліжко, <i>tidy your room</i> прибирати кімнату, <i>walk the dog</i> вигулювати собаку."]}], "remember": "Present Continuous = am/is/are + V-ing (зараз). dance → dancing, swim → swimming. Питання: Are you…? Is he…? Хатні справи: do the washing-up, make your bed, tidy your room, walk the dog, feed the cat.", "cards": [{"f": "Формула Present Continuous", "b": "am / is / are + дієслово + -ing."}, {"f": "dance, write, come → -ing", "b": "dancing, writing, coming (e зникає)."}, {"f": "swim, sit → -ing", "b": "swimming, sitting (подвоєння)."}, {"f": "do the washing-up", "b": "мити посуд."}, {"f": "make your bed / tidy your room", "b": "заправляти ліжко / прибирати кімнату."}, {"f": "walk the dog / feed the cat", "b": "вигулювати собаку / годувати кота."}, {"f": "coding / cookery / drama", "b": "кодування / кулінарія / театральне мистецтво."}], "quiz": [{"t": "input", "q": "Утвори -ing форму: write →", "a": ["writing"], "e": "e зникає."}, {"t": "input", "q": "Утвори -ing форму: sit →", "a": ["sitting"], "e": "Подвоєння t."}, {"t": "choice", "q": "Freddy … photos now.", "o": ["takes", "'s taking", "take"], "a": 1, "e": "Зараз — Continuous."}, {"t": "choice", "q": "They … in the park at the moment.", "o": ["are playing", "play", "plays"], "a": 0, "e": "At the moment."}, {"t": "choice", "q": "… she cooking? — Yes, she is.", "o": ["Is", "Are", "Does"], "a": 0, "e": "She → is."}, {"t": "choice", "q": "We … TV now. (заперечення)", "o": ["aren't watching", "don't watch"], "a": 0, "e": "Continuous."}, {"t": "input", "q": "Переклади «мити посуд»: do the …", "a": ["washing-up", "washing up"], "e": "do the washing-up."}, {"t": "input", "q": "Переклади «вигулювати собаку» (три слова):", "a": ["walk the dog"], "e": "walk the dog."}, {"t": "choice", "q": "«Tidy your room» —", "o": ["прибрати кімнату", "провітрити кімнату", "пофарбувати кімнату"], "a": 0, "e": "Прибирати."}], "quiz2": [{"t": "input", "q": "Постав -ing: «make» →", "a": ["making"], "e": "e зникає."}, {"t": "choice", "q": "«Look! The cat … the mouse.»", "o": ["chases", "is chasing", "chase"], "a": 1, "e": "Look! — зараз."}, {"t": "input", "q": "Заповни: «They … (not sleep) now.»", "a": ["aren't sleeping", "are not sleeping"], "e": "aren't sleeping."}, {"t": "input", "q": "Переклади «мити посуд» (три слова):", "a": ["do the washing-up", "do the washing up"], "e": "do the washing-up."}, {"t": "choice", "q": "«What are you doing?» — правильна відповідь:", "o": ["I read a book.", "I'm reading a book.", "I reading a book."], "a": 1, "e": "Continuous."}], "quiz3": [{"t": "choice", "q": "«He is having a shower» — чому тут можна have у Continuous?", "o": ["У значенні дії (приймати душ), а не володіння", "Це помилка", "Have завжди можна"], "a": 0, "e": "Два значення have."}, {"t": "input", "q": "Постав -ing: «sit» →", "a": ["sitting"], "e": "Подвоєння."}, {"t": "input", "q": "Постав -ing: «ride» →", "a": ["riding"], "e": "e зникає."}, {"t": "choice", "q": "«Tidy your room» означає…", "o": ["прибери кімнату", "поміняй кімнату", "прикрась кімнату"], "a": 0, "e": "tidy — прибирати."}]}, {"id": "en-u11", "sec": "Units 11–12", "title": "Unit 11. My digital life: adverbs of frequency, how much / how many", "goal": "Ти ставиш прислівники частоти на правильне місце й питаєш «скільки».", "learn": [{"h": "Adverbs of frequency", "p": ["<b>always</b> (завжди) → <b>often</b> (часто) → <b>sometimes</b> (іноді) → <b>never</b> (ніколи).", "Місце: <b>перед</b> звичайним дієсловом — <i>You <b>always</b> take your phone to school. Lucy <b>often</b> does her homework in bed.</i>", "<b>після</b> дієслова be — <i>I am <b>sometimes</b> sad on Sunday evenings. We are <b>never</b> hungry after breakfast.</i>"], "note": "З never не вживають ще одне заперечення: <i>I never go</i> (не «I don't never go»)."}, {"h": "How much / How many", "p": ["<b>How many</b> + злічувані: <i>How many books have you got?</i>", "<b>How much</b> + незлічувані: <i>How much homework do you get? How much water do you drink?</i>"]}, {"h": "Technology", "p": ["<i>digital camera</i>, <i>fitness tracker</i> фітнес-браслет, <i>laptop</i> ноутбук, <i>smart speaker</i> розумна колонка, <i>smartphone</i>, <i>tablet</i> планшет."]}, {"h": "Entertainment", "p": ["<i>band</i> гурт, <i>concert</i>, <i>famous person</i> відома людина, <i>fans</i>, <i>movies</i> кінострічки, <i>newspaper</i> газета, <i>song</i>, <i>TV show</i>."]}], "remember": "always, often, sometimes, never — перед звичайним дієсловом, після be. How many + злічувані, How much + незлічувані. Техніка: laptop, tablet, smartphone, smart speaker, fitness tracker.", "cards": [{"f": "Прислівники частоти", "b": "always, often, sometimes, never."}, {"f": "Де ставити прислівник частоти?", "b": "Перед звичайним дієсловом, після дієслова be."}, {"f": "How many / How much", "b": "How many + злічувані; How much + незлічувані."}, {"f": "laptop / tablet", "b": "ноутбук / планшет."}, {"f": "smart speaker / fitness tracker", "b": "розумна колонка / фітнес-браслет."}, {"f": "band / fans", "b": "музичний гурт / фанати."}, {"f": "Чи можна «I don't never go»?", "b": "Ні — з never друге заперечення не вживають."}], "quiz": [{"t": "choice", "q": "Jack … goes to concerts. (never)", "o": ["Jack never goes", "Jack goes never"], "a": 0, "e": "Перед дієсловом."}, {"t": "choice", "q": "They … at school from Monday to Friday. (always)", "o": ["are always", "always are"], "a": 0, "e": "Після be."}, {"t": "choice", "q": "How … water do you drink?", "o": ["many", "much"], "a": 1, "e": "Water — незлічуване."}, {"t": "choice", "q": "How … apps have you got?", "o": ["many", "much"], "a": 0, "e": "Apps — злічувані."}, {"t": "input", "q": "Переклади «ноутбук»:", "a": ["laptop", "a laptop"], "e": "laptop."}, {"t": "input", "q": "Переклади «планшет»:", "a": ["tablet", "a tablet"], "e": "tablet."}, {"t": "choice", "q": "«Band» — це…", "o": ["музичний гурт", "стрічка", "банк"], "a": 0, "e": "Гурт."}, {"t": "choice", "q": "Який прислівник означає «іноді»?", "o": ["often", "sometimes", "never"], "a": 1, "e": "sometimes."}], "quiz2": [{"t": "choice", "q": "Where does «always» go? «I … late for school.»", "o": ["am always", "always am"], "a": 0, "e": "Після be."}, {"t": "choice", "q": "«She … goes to bed early.» (often)", "o": ["often goes", "goes often"], "a": 0, "e": "Перед дієсловом."}, {"t": "choice", "q": "«How … time have you got?»", "o": ["many", "much"], "a": 1, "e": "Time — незлічуване."}, {"t": "input", "q": "Переклади «розумна колонка» (два слова):", "a": ["smart speaker"], "e": "smart speaker."}, {"t": "choice", "q": "«I never don't play games» — виправ.", "o": ["I never play games.", "I don't never play games.", "Правильно як є."], "a": 0, "e": "Одне заперечення."}], "quiz3": [{"t": "choice", "q": "Розташуй правильно: «She (often) is (often) tired.»", "o": ["She is often tired", "She often is tired"], "a": 0, "e": "Після be."}, {"t": "input", "q": "Заповни: «How … books do you read a year?»", "a": ["many"], "e": "Books — злічувані."}, {"t": "choice", "q": "«Fitness tracker» українською —", "o": ["фітнес-браслет", "спортзал", "тренер"], "a": 0, "e": "Пристрій."}, {"t": "choice", "q": "Порядок частот від найбільшої до найменшої:", "o": ["always, often, sometimes, never", "never, always, often", "often, always, never"], "a": 0, "e": "Шкала частоти."}]}, {"id": "en-u12", "sec": "Units 11–12", "title": "Unit 12. Working life: Present Simple vs Continuous. Jobs", "goal": "Ти обираєш між Present Simple і Present Continuous і називаєш професії та посуд.", "learn": [{"h": "Present Simple", "p": ["Про те, що <b>щодня</b> і <b>завжди</b>: <i>I go to school. My dad drives a taxi.</i> Про те, що <b>always / often / sometimes / never</b>: <i>You always get up late on Sundays.</i>"]}, {"h": "Present Continuous", "p": ["Про те, що <b>відбувається зараз</b>: <i>Jess is sleeping. We're studying English.</i> Підказки: <i>now, at the moment, Look!, Listen!</i>"], "note": "Дієслова <i>like, want, know, need</i> у Continuous не вживають: <i>Mrs Weston likes her job</i> (не «is liking»)."}, {"h": "Jobs", "p": ["<i>doctor</i>, <i>farmer</i>, <i>firefighter</i> пожежник, <i>footballer</i>, <i>journalist</i>, <i>lorry driver</i> далекобійник, <i>musician</i> музикант, <i>nurse</i> медсестра/медбрат, <i>photographer</i> фотограф, <i>waiter / waitress</i> офіціант / офіціантка.", "Питання: <i>What does your mum do? — She's a doctor.</i> Перед професією ставимо <b>a/an</b>: <i>He's a nurse.</i>"]}, {"h": "In a café", "p": ["<i>bottle</i> пляшка, <i>bowl</i> миска, <i>cup</i> чашка, <i>fork</i> виделка, <i>glass</i> склянка, <i>knife</i> ніж, <i>plate</i> тарілка, <i>spoon</i> ложка, <i>salt</i> сіль, <i>pepper</i> перець, <i>sugar</i> цукор."]}], "remember": "Simple — щодня, завжди (usually, every day). Continuous — зараз (now, Look!). like/want/know — тільки Simple. Професії з a/an: He's a nurse. Посуд: fork, knife, spoon, plate, cup, bowl, glass.", "cards": [{"f": "Коли Present Simple?", "b": "Регулярні дії й факти: every day, always, usually."}, {"f": "Коли Present Continuous?", "b": "Дія зараз: now, at the moment, Look!"}, {"f": "Які дієслова не вживають у Continuous?", "b": "like, want, know, need."}, {"f": "What does your mum do?", "b": "Ким працює твоя мама? — She's a doctor."}, {"f": "nurse / waiter / waitress", "b": "медсестра або медбрат / офіціант / офіціантка."}, {"f": "lorry driver / firefighter", "b": "далекобійник / пожежник."}, {"f": "fork / knife / spoon", "b": "виделка / ніж / ложка."}, {"f": "plate / bowl / cup / glass", "b": "тарілка / миска / чашка / склянка."}], "quiz": [{"t": "choice", "q": "It's half past nine, Tommy's at school and he … .", "o": ["studies", "'s studying"], "a": 1, "e": "Зараз."}, {"t": "choice", "q": "Every day, Jacob … at 7 o'clock.", "o": ["gets up", "is getting up"], "a": 0, "e": "Every day — Simple."}, {"t": "choice", "q": "My mum's in the bathroom. She … a shower.", "o": ["has", "is having"], "a": 1, "e": "Зараз."}, {"t": "choice", "q": "Mrs Weston … her job. She's a doctor.", "o": ["likes", "is liking"], "a": 0, "e": "Like — тільки Simple."}, {"t": "choice", "q": "Our history teacher always … us a lot of homework.", "o": ["gives", "is giving"], "a": 0, "e": "Always — Simple."}, {"t": "input", "q": "Переклади «пожежник»:", "a": ["firefighter", "a firefighter"], "e": "firefighter."}, {"t": "input", "q": "Переклади «виделка»:", "a": ["fork", "a fork"], "e": "fork."}, {"t": "choice", "q": "«Waitress» — це…", "o": ["офіціантка", "кухарка", "продавчиня"], "a": 0, "e": "Офіціантка."}, {"t": "choice", "q": "Як спитати про професію?", "o": ["What does your mum do?", "Who is your mum?", "Where is your mum?"], "a": 0, "e": "What does she do?"}], "quiz2": [{"t": "choice", "q": "«Water … at 100 degrees.» (факт)", "o": ["boils station</i> залізнична станція, <i>supermarket</i>, <i>university</i>."]}, {"h": "Adjectives: places", "p": ["<i>beautiful</i> красивий, <i>cheap</i> дешевий, <i>expensive</i> дорогий, <i>big/small, old/new, quiet/noisy</i>. <i>My town is small but beautiful.</i>"]}], "remember": "Is there a…? — Yes, there is / No, there isn't. Are there any…? — Yes, there are / No, there aren't. inside, outside, above, below, near. Місця: bank, cinema, hospital, hotel, museum, station, supermarket.", "cards": [{"f": "Is there a bank here? — відповідь", "b": "Yes, there is. / No, there isn't."}, {"f": "Are there any cafés? — відповідь", "b": "Yes, there are. / No, there aren't."}, {"f": "inside / outside", "b": "усередині / ззовні."}, {"f": "above / below", "b": "над / під."}, {"f": "station / hospital", "b": "залізнична станція / лікарня."}, {"f": "cheap / expensive", "b": "дешевий / дорогий."}], "quiz": [{"t": "choice", "q": "… there a cinema near here?", "o": ["Is", "Are"], "a": 0, "e": "Однина."}, {"t": "choice", "q": "… there any good hotels near here?", "o": ["Is", "Are"], "a": 1, "e": "Множина."}, {"t": "choice", "q": "There … any museums in my town.", "o": ["isn't", "aren't"], "a": 1, "e": "Множина."}, {"t": "choice", "q": "Is there a museum? —", "o": ["Yes, there is.", "Yes, it is.", "Yes, there are."], "a": 0, "e": "Yes, there is."}, {"t": "choice", "q": "The lamp is … the table. (над)", "o": ["above", "below", "inside"], "a": 0, "e": "above."}, {"t": "input", "q": "Переклади «лікарня»:", "a": ["hospital", "a hospital"], "e": "hospital."}, {"t": "input", "q": "Переклади «залізнична станція»:", "a": ["station", "a station", "railway station"], "e": "station."}, {"t": "choice", "q": "«Expensive» —", "o": ["дешевий", "дорогий", "красивий"], "a": 1, "e": "Дорогий."}], "quiz2": [{"t": "choice", "q": "«… there any cafés in your town?»", "o": ["Is", "Are"], "a": 1, "e": "Множина."}, {"t": "choice", "q": "«The bank is … the post office» (навпроти)", "o": ["opposite", "above", "inside"], "a": 0, "e": "opposite."}, {"t": "input", "q": "Заповни: «There … a hospital in our town.» (немає)", "a": ["isn't"], "e": "isn't."}, {"t": "choice", "q": "«Expensive» is the opposite of…", "o": ["cheap", "beautiful", "big"], "a": 0, "e": "Дешевий."}, {"t": "input", "q": "Переклади «залізнична станція»:", "a": ["station", "railway station", "a station"], "e": "station."}], "quiz3": [{"t": "choice", "q": "«Is there any milk?» / «Are there any shops?» — у чому різниця?", "o": ["Незлічуване бере is, злічуване в множині — are", "Різниці немає", "Помилка"], "a": 0, "e": "Узгодження."}, {"t": "choice", "q": "«The lamp is … the table.» (над, не торкаючись)", "o": ["above", "on", "below"], "a": 0, "e": "above."}, {"t": "input", "q": "Постав питання: «… there a museum near here?»", "a": ["is"], "e": "Is there."}, {"t": "choice", "q": "Which sentence is correct?", "o": ["There aren't any hotels.", "There isn't any hotels.", "There aren't a hotel."], "a": 0, "e": "Множина."}]}, {"id": "en-u14", "sec": "Units 13–14", "title": "Unit 14. Out and about: because, and, but, or; Let's…, Shall we…?", "goal": "Ти з'єднуєш речення сполучниками й пропонуєш щось зробити.", "learn": [{"h": "Сполучники", "p": ["<b>because</b> — причина: <i>John is eating a big lunch <b>because</b> he's hungry.</i>", "<b>and</b> — додає ідею: <i>Many people walk <b>and</b> cycle in our town.</i>", "<b>but</b> — протилежна ідея: <i>The school is near my house, <b>but</b> I don't walk there every day.</i>", "<b>or</b> — інший можливий варіант: <i>You can take the bus <b>or</b> the Underground.</i>"]}, {"h": "Let's… / Shall we…?", "p": ["<b>Let's</b> + дієслово — пропозиція: <i>Let's have a party. Let's have a pizza for dinner.</i>", "<b>Shall we</b> + дієслово? — пропозиція-питання: <i>Shall we go swimming?</i>", "Відповіді: <i>I'd love to. Good idea! Yes, let's. Sorry, I can't.</i>"]}, {"h": "Transport", "p": ["<i>bus, car, plane</i> літак, <i>taxi, train</i> потяг, <i>tram</i> трамвай, <i>trolleybus</i> тролейбус, <i>funicular</i> фунікулер, <i>the Underground</i> метро. Кажемо <b>by bus / by train / by plane</b>, але <b>on foot</b> — пішки."]}, {"h": "Phrases for going out", "p": ["<i>go out with friends, go running, go shopping, go swimming, go to a museum, go to a restaurant, go to the park, meet friends, meet at eight o'clock, see a film, visit a museum, meet a famous person</i>."]}], "remember": "because — причина, and — додає, but — протиставляє, or — вибір. Let's go! Shall we go? — пропозиції. by bus / by train, але on foot. go shopping, go swimming, see a film.", "cards": [{"f": "because / but", "b": "тому що / але."}, {"f": "and / or", "b": "і / або."}, {"f": "Let's…", "b": "Пропозиція: Let's have a party — Влаштуймо вечірку."}, {"f": "Shall we…?", "b": "Пропозиція-питання: Shall we go swimming?"}, {"f": "by bus / on foot", "b": "автобусом / пішки."}, {"f": "tram / trolleybus / funicular", "b": "трамвай / тролейбус / фунікулер."}, {"f": "go shopping / see a film", "b": "ходити по магазинах / переглянути фільм."}], "quiz": [{"t": "choice", "q": "She walks to school … she lives near it.", "o": ["but", "because", "or"], "a": 1, "e": "Причина."}, {"t": "choice", "q": "Lizzie likes going shopping, … she hasn't got any money.", "o": ["and", "but", "because"], "a": 1, "e": "Протиставлення."}, {"t": "choice", "q": "Tom likes travelling by plane … boat.", "o": ["or", "but", "because"], "a": 0, "e": "Вибір."}, {"t": "choice", "q": "… go to the cinema!", "o": ["Let's", "Shall", "Do"], "a": 0, "e": "Let's go."}, {"t": "choice", "q": "… we go swimming?", "o": ["Let's", "Shall", "Are"], "a": 1, "e": "Shall we…?"}, {"t": "choice", "q": "Ми йдемо пішки —", "o": ["by foot", "on foot", "with foot"], "a": 1, "e": "on foot."}, {"t": "input", "q": "Переклади «потяг»:", "a": ["train", "a train"], "e": "train."}, {"t": "input", "q": "Переклади «трамвай»:", "a": ["tram", "a tram"], "e": "tram."}, {"t": "choice", "q": "«Go shopping» —", "o": ["ходити по магазинах", "іти в школу", "гуляти в парку"], "a": 0, "e": "Шопінг."}], "quiz2": [{"t": "choice", "q": "«I'm tired … I'll go to bed.»", "o": ["so", "but", "or"], "a": 0, "e": "Наслідок; but і or не підходять."}, {"t": "choice", "q": "«Shall we … to the cinema?»", "o": ["go", "going", "to go"], "a": 0, "e": "Після Shall we — початкова форма."}, {"t": "choice", "q": "«We go to school … bus.»", "o": ["by", "on", "with"], "a": 0, "e": "by bus."}, {"t": "input", "q": "Переклади «тролейбус»:", "a": ["trolleybus", "a trolleybus"], "e": "trolleybus."}, {"t": "choice", "q": "«Let's … a pizza!»", "o": ["have", "to have", "having"], "a": 0, "e": "Let's + V."}], "quiz3": [{"t": "choice", "q": "«She walks to school … she likes it, … it's far.»", "o": ["because / but", "but / because", "or / and"], "a": 0, "e": "Причина + протиставлення."}, {"t": "choice", "q": "Why do we say «on foot», not «by foot»?", "o": ["Це усталений вислів", "Помилка", "Обидва правильні"], "a": 0, "e": "Fixed phrase."}, {"t": "input", "q": "Переклади «фунікулер»:", "a": ["funicular", "a funicular"], "e": "funicular."}, {"t": "choice", "q": "Ввічлива відповідь на «Shall we go swimming?»", "o": ["I'd love to!", "No.", "Never."], "a": 0, "e": "Ввічлива згода."}]}, {"id": "en-u15", "sec": "Units 15–16", "title": "Unit 15. What shall I wear? Plurals, describing people", "goal": "Ти правильно утворюєш множину, описуєш зовнішність і називаєш одяг.", "learn": [{"h": "Plurals: spelling", "p": ["<b>завжди множина</b>: <i>clothes, jeans, glasses, trousers</i> (не можна «a jeans»).", "<b>+s</b>: house → houses, skirt → skirts, cinema → cinemas.", "<b>+es</b> після -s, -x, -ch, -sh: bus → buses, box → boxes, watch → watches, address → addresses.", "<b>y → ies</b> після приголосної: baby → babies, dictionary → dictionaries, story → stories, party → parties."]}, {"h": "Describing people", "p": ["<b>'s / 're</b> — яка людина: <i>Pam's young. They're short.</i>", "<b>'s got / 've got</b> — що має: <i>She's got short hair. He's got blue eyes.</i>", "<b>'s / are wearing</b> — що вдягнена: <i>Dan's wearing a jacket. Evie and Megan are wearing hats.</i>"]}, {"h": "Clothes", "p": ["<i>digital watch, dress</i> сукня, <i>glasses</i> окуляри, <i>jacket</i> куртка, <i>jeans</i>, <i>shirt</i> сорочка, <i>shoes</i> взуття, <i>skirt</i> спідниця, <i>trousers</i> штани, <i>T-shirt</i>."]}, {"h": "Phrases: people", "p": ["<i>tall</i> високий — <i>short</i> низький; <i>slim</i> стрункий — <i>fat</i> повний; <i>young</i> — <i>old</i>; <i>long hair, short hair, dark hair, beautiful eyes, big ears, a red nose, a brown beard</i> борода."]}], "remember": "Завжди множина: clothes, jeans, glasses, trousers. +es після -s, -x, -ch, -sh; y → ies. She's tall (яка), she's got blue eyes (що має), she's wearing a dress (що вдягнена). Одяг: skirt, trousers, jacket, shoes.", "cards": [{"f": "Слова, що завжди в множині", "b": "clothes, jeans, glasses, trousers."}, {"f": "bus, box, watch → множина", "b": "buses, boxes, watches (+es)."}, {"f": "baby, story, party → множина", "b": "babies, stories, parties (y → ies)."}, {"f": "is / has got / is wearing", "b": "яка людина / що має / у що вдягнена."}, {"f": "tall / short / slim", "b": "високий / низький / стрункий."}, {"f": "beard / glasses", "b": "борода / окуляри."}, {"f": "trousers / skirt / dress", "b": "штани / спідниця / сукня."}], "quiz": [{"t": "input", "q": "Множина: watch →", "a": ["watches"], "e": "+es."}, {"t": "input", "q": "Множина: story →", "a": ["stories"], "e": "y → ies."}, {"t": "input", "q": "Множина: shoe →", "a": ["shoes"], "e": "+s."}, {"t": "choice", "q": "Emma … tall and slim.", "o": ["is", "has got"], "a": 0, "e": "Яка вона."}, {"t": "choice", "q": "Ida … blue eyes and brown hair.", "o": ["is", "has got"], "a": 1, "e": "Що має."}, {"t": "choice", "q": "Poppy … a beautiful party dress.", "o": ["is wearing", "has", "is"], "a": 0, "e": "У що вдягнена."}, {"t": "input", "q": "Переклади «штани»:", "a": ["trousers"], "e": "trousers."}, {"t": "input", "q": "Переклади «окуляри
