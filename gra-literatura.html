<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сюжет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9; --grid:#E8E5DA;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --volt:#E9A800; --volt-soft:#FFF3D4;
    --ok:#1F9D63; --ok-soft:#E3F6EC; --bad:#D8433B; --bad-soft:#FCE9E7; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.015em;margin:0}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  .app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 44px}
  .screen{display:none}.screen.on{display:block}
  header.hero{margin:6px 0 16px}
  header.hero h1{font-size:31px;line-height:1.15}
  header.hero p{color:var(--ink-2);margin:8px 0 0;max-width:34em}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px}
  .task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .center{justify-content:center}
  .btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 17px;font-weight:600;font-size:15px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn[disabled]{opacity:.45}
  .item{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}
  .item .ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft)}
  .item .tx{flex:1;min-width:0}
  .item b{display:block;font-size:16px}
  .item span{color:var(--ink-2);font-size:13px}
  .item .sc{color:var(--ok);font-weight:700;font-size:14px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:32px}
  .bar .back{color:var(--accent);font-weight:600}
  .bar h2{font-size:16px;flex:1;text-align:center;color:var(--ink-2);font-weight:600}
  .tmr{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);width:64px;text-align:right}
  .verdict{margin-top:12px;padding:13px 15px;border-radius:12px;font-size:15px;display:none}
  .verdict.on{display:block}
  .verdict.good{background:var(--ok-soft);color:#14603E}
  .verdict.warn{background:var(--bad-soft);color:#8F2018}
  .verdict.note{background:var(--volt-soft);color:#6B4B00}
  .why{margin-top:12px;padding:13px 15px;border:1px solid var(--line);border-left:4px solid var(--volt);
    border-radius:0 12px 12px 0;background:#fff;font-size:15px;display:none}
  .why.on{display:block}
  .why b{display:block;margin-bottom:4px}
  .opts{display:grid;gap:8px;margin-top:2px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-size:16px}
  .opt.good{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .steps{display:grid;gap:8px;margin-top:2px}
  .step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;
    display:flex;gap:11px;align-items:flex-start;font-size:16px}
  .step .n{width:26px;height:26px;flex:none;border-radius:50%;background:#F4F2EC;color:var(--ink-2);
    display:grid;place-items:center;font-size:14px;font-weight:600}
  .step.on .n{background:var(--accent);color:#fff}
  .step.good{border-color:var(--ok);background:var(--ok-soft)}
  .step.bad{border-color:var(--bad);background:var(--bad-soft)}
  .facts{margin:4px 0 12px}
  .fact{background:#F4F2EC;border-radius:12px;padding:11px 14px;margin-bottom:7px;font-size:16px}
  .fact b{color:var(--ink-2);font-size:13px;display:block;margin-bottom:2px}
  .quote{font-size:19px;text-align:center;font-style:italic;margin:12px 0;color:var(--ink)}
  .book{text-align:center;color:var(--ink-2);font-size:14px;margin-bottom:8px}
  .dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .dot.now{background:var(--accent);transform:scale(1.35)}
  .dot.g{background:var(--ok)}.dot.y{background:var(--volt)}.dot.r{background:var(--bad)}
  .score{display:flex;gap:10px;margin:14px 0 0}
  .score div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
  .score b{display:block;font-size:23px;line-height:1.2}
  .score span{color:var(--ink-2);font-size:13px}
  .log-line{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

<section id="s-home" class="screen on">
  <header class="hero">
    <h1>Сюжет</h1>
    <p>П'ять ігор про книжки, які ти вже читав. Не «перекажи зміст», а як улаштована історія зсередини.</p>
  </header>
  <div id="home-list"></div>
</section>

<section id="s-play" class="screen">
  <div class="bar"><button class="back" onclick="go('s-home')">‹ Ігри</button><div class="dots" id="p-dots"></div><span class="tmr" id="p-sc"></span></div>
  <div class="panel">
    <div class="task" id="p-task"></div>
    <div id="p-body"></div>
    <div class="verdict" id="p-verdict"></div>
    <div class="why" id="p-why"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="p-act">Перевірити</button>
      <button class="btn ghost" id="p-more" style="display:none">Ще факт</button>
    </div>
  </div>
</section>

<section id="s-end" class="screen">
  <div class="bar"><button class="back" onclick="go('s-home')">‹ Ігри</button><h2 id="e-h"></h2><span class="tmr"></span></div>
  <div class="panel">
    <h2 id="e-title" style="font-size:23px;text-align:center"></h2>
    <div class="score">
      <div><b id="e-now">0</b><span>цього разу</span></div>
      <div><b id="e-best">0</b><span>рекорд</span></div>
    </div>
    <div class="row center" style="margin-top:16px">
      <button class="btn" id="e-again">Ще раз</button>
      <button class="btn ghost" onclick="go('s-home')">До ігор</button>
    </div>
  </div>
  <div class="panel" id="e-log"></div>
</section>

</div>

try { PR = Object.assign(PR, JSON.parse(localStorage.getItem(KEY)||'{}')); } catch(e){}

  r:'Найнапруженіша мить книжки: хлопець ризикує життям, порушуючи клятву мовчати.'},
 {q:'Чарлі живе з родиною в хатині, де всі голодують.', b:'Чарлі і шоколадна фабрика', a:0,
  r:'Спершу нам показують світ героя — це ще не події, а тло, на якому вони стануться.'},
 {q:'Чарлі лишається єдиним, хто дійшов до кінця екскурсії.', b:'Чарлі і шоколадна фабрика', a:2,
  r:'Момент, коли вирішується головне питання книжки — хто отримає фабрику.'},
 {q:'Полліанну збиває автівка.', b:'Полліанна', a:2,
  r:'Найгостріший момент: гра «в радість» перевіряється на самій героїні.'},
 {q:'Лис забувається і починає вити по-лисячому.', b:'Фарбований Лис', a:2,
  r:'Обман тримався рівно доти, доки герой не видав себе сам.'}
];
/* ================= ТРОПИ ================= */
const TROPES=['Епітет','Порівняння','Метафора','Уособлення'];
const TROP=[
 {q:'вітер шепоче у верховітті', a:3, r:'Неживому приписано людську дію — це уособлення (персоніфікація).'},
 {q:'очі, як волошки', a:1, r:'Є слово «як» і два предмети поруч — класичне порівняння.'},
 {q:'золоті руки', a:2, r:'Руки не із золота: ознаку перенесено за схожістю — це метафора.'},
 {q:'дрімучий ліс', a:0, r:'Художнє означення, яке додає настрою, — епітет.'},
 {q:'сонце всміхнулося з-за хмари', a:3, r:'Сонце «усміхається» — дія живої істоти в неживого предмета.'},
 {q:'місяць — срібний серп', a:2, r:'Пряме ототожнення без «як»: метафора.'},
 {q:'біжить, мов вітер', a:1, r:'Слова «мов», «наче», «ніби», «як» — вірна прикмета порівняння.'},
 {q:'сміх розсипався дзвіночком', a:1, r:'Порівняння без «як» — в орудному відмінку. Рідша форма, і саме на ній найчастіше помиляються.'},
 {q:'час летить', a:2, r:'Час не має крил: перенесення за схожістю — метафора.'},
 {q:'дощ тарабанить у шибку', a:3, r:'Дощ «тарабанить», ніби хтось стукає, — уособлення.'},
 {q:'червона калина', a:0, r:'Постійний епітет із народної пісні: означення, що століттями йде поруч зі словом.'},
 {q:'гострий розум', a:2, r:'Ознака гостроти перенесена з ножа на розум — метафора. Якби сказали «розум, як ніж», було б порівняння.'}
];
/* ================= ЖАНРИ ================= */
const GENRES=['Народна казка','Літературна казка','Оповідання','Байка'];
const GEN=[
 {q:'«Пані Метелиця» — записана братами Грімм від людей, має дві сестри-протилежності й традиційний початок.', a:0,
  r:'Народна казка не має автора: брати Грімм її записали, а не вигадали. Ознаки — сталі формули, повтори, три випробування.'},
 {q:'«Фарбований Лис» Івана Франка — звірі говорять, а наприкінці звучить чіткий висновок про хвальків.', a:1,
  r:'Це літературна казка з виразною байковою мораллю: автор відомий, сюжет придуманий ним.'},
 {q:'«Хлопчик-зірка» Оскара Вайлда — чарівні перетворення, автор відомий, мова складніша за народну.', a:1,
  r:'Літературна казка: фантастика є, але за нею стоїть конкретний письменник зі своїм стилем.'},
 {q:'Невеликий твір про один випадок із життя школяра, без жодної фантастики.', a:2,
  r:'Оповідання: мала проза про одну подію, кілька персонажів, реальні обставини.'},
 {q:'Короткий віршований твір, де Вовк і Ягня сперечаються, а в кінці — повчання.', a:3,
  r:'Байка: алегоричні звірі, стислий сюжет і мораль прямим текстом.'},
 {q:'«Микита Кожум\'яка» — переказували з вуст в уста, пояснює походження валів під Києвом.', a:0,
  r:'Народна казка, близька до легенди: автора немає, а вигадка пояснює реальну місцевість.'},
 {q:'Твір, у якому лисиця вихваляє ворону, щоб та впустила сир.', a:3,
  r:'Байка: сюжет-приклад, з якого випливає повчання про лестощі.'},
 {q:'«Хуха-Моховинка» Василя Короліва-Старого — вигадана лісова істота, авторський стиль, але казковий світ.', a:1,
  r:'Літературна казка українського письменника.'}
];

/* ================= ГОЛОВНА ================= */
const GAMES=[
 {id:'plot',   ic:'📖', t:'Стрічка сюжету', s:'Постав події твору за порядком', n:5},
 {id:'hero',   ic:'🎭', t:'Впізнай героя', s:'Менше фактів — більше балів', n:8},
 {id:'compos', ic:'🧩', t:'Частини сюжету', s:'Зав\'язка, кульмінація, розв\'язка', n:8},
 {id:'trop',   ic:'✨', t:'Художні засоби', s:'Епітет, порівняння, метафора, уособлення', n:8},
 {id:'genre',  ic:'📚', t:'Жанри', s:'Казка народна чи літературна? Байка чи оповідання?', n:6}
];
function homeDraw(){
  const box=$('#home-list'); box.innerHTML='';
  GAMES.forEach(g=>{
    const B=PR.best||{};
    const b=document.createElement('button'); b.className='item';
    const sc = B[g.id]!==undefined ? (g.id==='hero'? B.hero+' балів' : B[g.id]+'/'+g.n) : '';
    b.innerHTML='<span class="ic">'+g.ic+'</span><span class="tx"><b>'+g.t+'</b><span>'+g.s+'</span></span><span class="sc">'+sc+'</span>';
    b.onclick=()=>startRun(g.id); box.appendChild(b);
  });
}

/* ================= РУШІЙ ================= */
let KIND='', ITEMS=[], I=0, RIGHT=0, PTS=0, LOG=[], order=[], sel=null, shown=1;

function startRun(kind){
  KIND=kind; I=0; RIGHT=0; PTS=0; LOG=[];
  const g=GAMES.find(x=>x.id===kind);
  const src = kind==='plot'?PLOTS : kind==='hero'?HEROES : kind==='compos'?COMPOS : kind==='trop'?TROP : GEN;
  ITEMS=shuffle(src).slice(0,g.n);
  go('s-play'); renderItem();
}
function dots(){
  $('#p-dots').innerHTML=ITEMS.map((_,i)=>{
    const l=LOG[i]; return '<span class="dot '+(l===undefined?(i===I?'now':''):(l>0?(l===1?'y':'g'):'r'))+'"></span>'; }).join('');
  $('#p-sc').textContent = KIND==='hero' ? PTS+' б' : RIGHT+'/'+ITEMS.length;
}
function renderItem(){
  const it=ITEMS[I]; order=[]; sel=null; shown=1; dots();
  $('#p-verdict').className='verdict'; $('#p-why').className='why';
  $('#p-act').disabled=false; $('#p-act').style.display='inline-block';
  $('#p-act').textContent='Перевірити'; $('#p-act').onclick=checkItem;
  $('#p-more').style.display='none';
  const b=$('#p-body');
  if(KIND==='plot'){
    $('#p-task').innerHTML='<b>'+it.b+'</b><br>Постав події за порядком — тисни по черзі.';
    b.innerHTML='<div class="steps">'+shuffle([...it.e.keys()]).map(i=>
      '<button class="step" data-i="'+i+'"><span class="n">·</span><span>'+it.e[i]+'</span></button>').join('')+'</div>';
    $$('.step',b).forEach(el=>el.onclick=()=>{
      const i=+el.dataset.i;
      if(order.includes(i)) order=order.filter(x=>x!==i); else order.push(i);
      $$('.step',b).forEach(x=>{ const p=order.indexOf(+x.dataset.i);
        x.classList.toggle('on',p>=0); $('.n',x).textContent = p>=0?(p+1):'·'; });
    });
  }
  if(KIND==='hero'){
    $('#p-task').innerHTML='Хто це? Відповідь з першого факту — <b>3 бали</b>, з другого — 2, з третього — 1.';
    b.innerHTML='<div class="facts" id="p-facts"></div><div class="opts">'+
      shuffle(it.o).map(o=>'<button class="opt" data-v="'+o+'">'+o+'</button>').join('')+'</div>';
    drawFacts();
    $$('.opt',b).forEach(el=>el.onclick=()=>{ sel=el.dataset.v; checkItem(); });
    $('#p-act').style.display='none';
    $('#p-more').style.display='inline-block';
    $('#p-more').disabled=false;
    $('#p-more').onclick=()=>{ if(shown<3){ shown++; drawFacts(); if(shown===3) $('#p-more').disabled=true; } };
  }
  if(KIND==='compos'){
    $('#p-task').innerHTML='<div class="book">'+it.b+'</div><div class="quote">'+it.q+'</div>Яка це частина сюжету?';
    b.innerHTML='<div class="opts">'+PARTS.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>';
    $$('.opt',b).forEach(el=>el.onclick=()=>{ sel=+el.dataset.i; checkItem(); });
    $('#p-act').style.display='none';
  }
  if(KIND==='trop'){
    $('#p-task').innerHTML='<div class="quote">'+it.q+'</div>Який це художній засіб?';
    b.innerHTML='<div class="opts">'+TROPES.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>';
    $$('.opt',b).forEach(el=>el.onclick=()=>{ sel=+el.dataset.i; checkItem(); });
    $('#p-act').style.display='none';
  }
  if(KIND==='genre'){
    $('#p-task').innerHTML=it.q+'<br><br>Який це жанр?';
    b.innerHTML='<div class="opts">'+GENRES.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>';
    $$('.opt',b).forEach(el=>el.onclick=()=>{ sel=+el.dataset.i; checkItem(); });
    $('#p-act').style.display='none';
  }
}
function drawFacts(){
  const it=ITEMS[I];
  $('#p-facts').innerHTML = it.f.slice(0,shown).map((f,i)=>
    '<div class="fact"><b>Факт '+(i+1)+'</b>'+f+'</div>').join('');
}
function checkItem(){
  const it=ITEMS[I]; let ok=false, score=0;
  if(KIND==='plot'){ if(order.length<it.e.length) return; ok=order.every((v,i)=>v===i); }
  if(KIND==='hero'){ if(sel===null) return; ok = sel===it.n; score = ok ? (4-shown) : 0; }
  if(KIND==='compos'||KIND==='trop'||KIND==='genre'){ if(sel===null) return; ok = sel===it.a; }
  LOG[I] = KIND==='hero' ? score : (ok?2:0);
  if(ok) RIGHT++; PTS+=score; buzz(ok); dots();
  const v=$('#p-verdict'); v.className='verdict on '+(ok?'good':'warn');

  if(KIND==='plot'){
    $$('.step').forEach(el=>{ el.disabled=true; el.classList.add(ok?'good':'bad');
      $('.n',el).textContent = (+el.dataset.i)+1; });
    const box=$('#p-body .steps');
    [...box.children].sort((a,b)=>(+a.dataset.i)-(+b.dataset.i)).forEach(el=>box.appendChild(el));
    v.textContent = ok?'Порядок точний.':'Ні — правильні номери проставлено на картках.';
    $('#p-why').className='why on'; $('#p-why').innerHTML='<b>Про побудову</b>'+it.r;
  }
  if(KIND==='hero'){
    $$('.opt').forEach(el=>{ el.disabled=true;
      if(el.dataset.v===it.n) el.classList.add('good'); else if(!ok && el.dataset.v===sel) el.classList.add('bad'); });
    $('#p-more').style.display='none';
    v.innerHTML = ok ? 'Так — <b>'+it.n+'</b>. +'+score+' бал'+(score===1?'':'и')
                     : 'Ні. Це <b>'+it.n+'</b>.';
    $('#p-why').className='why on';
    $('#p-why').innerHTML='<b>Звідки герой</b>«'+it.b+'». '+it.f[2];
  }
  if(KIND==='compos'){
    $$('.opt').forEach((el,i)=>{ el.disabled=true;
      if(i===it.a) el.classList.add('good'); else if(!ok && i===sel) el.classList.add('bad'); });
    v.innerHTML = (ok?'Так. ':'Ні. ')+'Це <b>'+PARTS[it.a].toLowerCase()+'</b>.';
    $('#p-why').className='why on'; $('#p-why').innerHTML='<b>Чому</b>'+it.r;
  }
  if(KIND==='trop'){
    $$('.opt').forEach((el,i)=>{ el.disabled=true;
      if(i===it.a) el.classList.add('good'); else if(!ok && i===sel) el.classList.add('bad'); });
    v.innerHTML = (ok?'Так. ':'Ні. ')+'Це <b>'+TROPES[it.a].toLowerCase()+'</b>.';
    $('#p-why').className='why on'; $('#p-why').innerHTML='<b>Як розрізняти</b>'+it.r;
  }
  if(KIND==='genre'){
    $$('.opt').forEach((el,i)=>{ el.disabled=true;
      if(i===it.a) el.classList.add('good'); else if(!ok && i===sel) el.classList.add('bad'); });
    v.innerHTML = (ok?'Так. ':'Ні. ')+'Це <b>'+GENRES[it.a].toLowerCase()+'</b>.';
    $('#p-why').className='why on'; $('#p-why').innerHTML='<b>Ознаки</b>'+it.r;
  }
  $('#p-act').style.display='inline-block'; $('#p-act').disabled=false;
  $('#p-act').textContent = I===ITEMS.length-1 ? 'Підсумок' : 'Далі →';
  $('#p-act').onclick=()=>{ I++; if(I>=ITEMS.length) endRun(); else renderItem(); };
}
function endRun(){
  const g=GAMES.find(x=>x.id===KIND);
  const val = KIND==='hero' ? PTS : RIGHT;
  const max = KIND==='hero' ? ITEMS.length*3 : ITEMS.length;
  PR.best=PR.best||{}; if(val>(PR.best[KIND]||0)) PR.best[KIND]=val;
  saveP();
  $('#e-h').textContent=g.t;
  $('#e-title').textContent = val===max?'Бездоганно.' : val>=max*0.6?'Непогано.' : 'Розбір унизу — він тут головний.';
  $('#e-now').textContent=val+'/'+max; $('#e-best').textContent=PR.best[KIND];
  $('#e-again').onclick=()=>startRun(KIND);
  const mark=i=>LOG[i]>=2?'🟩':LOG[i]===1?'🟨':'🟥';
  let log='';
  if(KIND==='plot')   log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+mark(i)+'</span><span>'+it.b+'</span></div>').join('');
  if(KIND==='hero')   log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+mark(i)+'</span><span>'+it.n+' — «'+it.b+'»</span></div>').join('');
  if(KIND==='compos') log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+mark(i)+'</span><span>'+PARTS[it.a]+' — '+it.b+'</span></div>').join('');
  if(KIND==='trop')   log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+mark(i)+'</span><span>'+it.q+' — '+TROPES[it.a].toLowerCase()+'</span></div>').join('');
  if(KIND==='genre')  log=ITEMS.map((it,i)=>'<div class="log-line"><span>'+mark(i)+'</span><span>'+GENRES[it.a]+'</span></div>').join('');
  $('#e-log').innerHTML='<b style="display:block;margin-bottom:6px">Що було</b>'+log;
  homeDraw(); go('s-end');
}

homeDraw();
</script>
</body>
</html>
