<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Етика · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>
// ============================================================
//  ДАНІ КУРСУ. Один об'єкт на предмет; генерується з підручника.
// ============================================================
const COURSE = {"id": "etyka5", "title": "Етика", "subtitle": "5 клас · 16 уроків за підручниками школи, Іртищевої, Давидюк", "lessons": [{"id": "et-shcho-take-etyka", "sec": "Вступ. Людина", "title": "Що таке етика і мораль. Золоте правило", "goal": "Ти знаєш, що вивчає етика, чим мораль відрізняється від права, і формулюєш золоте правило моралі.", "learn": [{"h": "Етика", "p": ["<span class='term'>Етика</span> — наука про мораль: про добро і зло, про те, як людям належить поводитись одне з одним. Слово від грецького «етос» — звичай, характер. Засновник етики як науки — <b>Аристотель</b>."]}, {"h": "Мораль", "p": ["<span class='term'>Мораль</span> — правила поведінки, які суспільство вважає добрими й правильними: не брехати, допомагати, поважати старших. Моральні правила не записані в законах, але їх підтримує <b>совість</b> і думка людей."], "note": "<b>Право</b> — правила, записані в законах; за їх порушення карає держава. <b>Мораль</b> — за порушення карає совість і осуд людей."}, {"h": "Золоте правило моралі", "p": ["<span class='term'>Золоте правило</span>: <b>«Стався до інших так, як хочеш, щоб ставились до тебе»</b>. Воно є в усіх релігіях і культурах світу: в Біблії, у Конфуція, у давніх греків."]}, {"h": "Добро і зло", "p": ["<b>Добро</b> — те, що приносить користь, радість, допомагає жити. <b>Зло</b> — те, що шкодить, завдає болю. Головні моральні поняття: добро, зло, обов'язок, совість, честь, гідність, справедливість."]}], "remember": "Етика — наука про мораль (Аристотель). Мораль — неписані правила добра, підтримувані совістю. Право — писані закони, підтримувані державою. Золоте правило: стався до інших так, як хочеш, щоб ставились до тебе.", "cards": [{"f": "Етика", "b": "Наука про мораль, добро і зло, правила поведінки людей. Від грецького «етос» — звичай."}, {"f": "Мораль", "b": "Неписані правила поведінки, які суспільство вважає добрими; підтримує совість."}, {"f": "Чим мораль відрізняється від права?", "b": "Право — писані закони, карає держава; мораль — неписані норми, карає совість і осуд."}, {"f": "Золоте правило моралі", "b": "Стався до інших так, як хочеш, щоб ставились до тебе."}, {"f": "Хто засновник етики як науки?", "b": "Аристотель, давньогрецький філософ."}, {"f": "Совість", "b": "Внутрішній «суддя», що оцінює наші вчинки як добрі чи злі."}], "quiz": [{"t": "choice", "q": "Що вивчає етика?", "o": ["Правила правопису", "Мораль, добро і зло", "Історію держав"], "a": 1, "e": "Етика — наука про мораль."}, {"t": "choice", "q": "Від якого слова походить «етика»?", "o": ["Від грецького «етос» — звичай", "Від латинського «етнос»", "Від слова «етикетка»"], "a": 0, "e": "Етос — звичай, характер."}, {"t": "choice", "q": "Хто засновник етики як науки?", "o": ["Сократ", "Аристотель", "Піфагор"], "a": 1, "e": "Аристотель написав «Нікомахову етику»."}, {"t": "choice", "q": "Золоте правило моралі:", "o": ["Око за око", "Стався до інших так, як хочеш, щоб ставились до тебе", "Хто сильніший, той правий"], "a": 1, "e": "Є в усіх культурах світу."}, {"t": "choice", "q": "Хто «карає» за порушення моралі?", "o": ["Поліція", "Совість і осуд людей", "Суд"], "a": 1, "e": "Мораль — неписані норми."}, {"t": "choice", "q": "Правила, записані в законах, — це…", "o": ["мораль", "право", "звичай"], "a": 1, "e": "Право охороняє держава."}, {"t": "input", "q": "Як називається внутрішній «суддя», який оцінює наші вчинки?", "a": ["совість"], "e": "Совість."}, {"t": "tf", "q": "Золоте правило моралі існує лише в християнстві.", "a": false, "e": "Воно є в усіх релігіях і культурах."}, {"t": "choice", "q": "Що таке добро?", "o": ["Те, що приносить користь і радість людям", "Те, що вигідно тільки мені", "Те, що дорого коштує"], "a": 0, "e": "Добро допомагає жити."}]}, {"id": "et-unikalnist", "sec": "Вступ. Людина", "title": "Унікальність людини. Індивідуальність і особистість", "goal": "Ти розумієш, чим кожна людина унікальна, і розрізняєш поняття індивідуальність, особистість, самооцінка.", "learn": [{"h": "Кожна людина унікальна", "p": ["<span class='term'>Унікальність</span> — неповторність. Немає двох однакових людей: різні зовнішність, характер, здібності, мрії, досвід. Навіть близнюки різні. Це <span class='term'>індивідуальність</span> — сукупність рис, що відрізняють людину від інших."]}, {"h": "Особистість", "p": ["<span class='term'>Особистість</span> — людина зі своїми поглядами, цінностями, здатна відповідати за вчинки. Особистістю не народжуються — стають, розвиваючись і роблячи вибір."]}, {"h": "Пізнання себе", "p": ["<span class='term'>Самопізнання</span> — вивчення власних рис, сильних і слабких сторін. <span class='term'>Самооцінка</span> — те, як людина оцінює себе; буває занижена (я нічого не вмію), завищена (я найкращий) і <b>адекватна</b> (бачу і сильні сторони, і те, над чим працювати)."], "note": "Порівнюй себе не з іншими, а з собою вчорашнім."}, {"h": "Потреби, бажання, інтереси", "p": ["<b>Потреби</b> — те, без чого не можна жити (їжа, сон, безпека, спілкування, повага). <b>Бажання</b> — те, чого хочеться (новий телефон). <b>Інтереси</b> — те, що захоплює (спорт, музика). Важливо відрізняти потрібне від бажаного."]}], "remember": "Унікальність — неповторність кожного. Індивідуальність — риси, що відрізняють. Особистість — людина з поглядами й відповідальністю; нею стають. Самооцінка: занижена, завищена, адекватна. Потреби ≠ бажання.", "cards": [{"f": "Унікальність", "b": "Неповторність: немає двох однакових людей."}, {"f": "Індивідуальність", "b": "Сукупність рис, що відрізняють людину від інших."}, {"f": "Особистість", "b": "Людина зі своїми поглядами й цінностями, яка відповідає за вчинки; нею стають."}, {"f": "Самооцінка", "b": "Те, як людина оцінює себе: занижена, завищена, адекватна."}, {"f": "Адекватна самооцінка", "b": "Бачу і свої сильні сторони, і те, над чим треба працювати."}, {"f": "Потреби / бажання", "b": "Потреби — без чого не можна жити; бажання — чого хочеться."}], "quiz": [{"t": "choice", "q": "Що означає «людина унікальна»?", "o": ["Вона найкраща", "Вона неповторна, немає такої ж", "Вона знаменита"], "a": 1, "e": "Кожен неповторний."}, {"t": "choice", "q": "Індивідуальність — це…", "o": ["риси, що відрізняють людину від інших", "зовнішність", "одяг"], "a": 0, "e": "Характер, здібності, досвід."}, {"t": "tf", "q": "Особистістю народжуються.", "a": false, "e": "Особистістю стають, розвиваючись і роблячи вибір."}, {"t": "choice", "q": "«Я нічого не вмію, у мене ніколи не вийде» — яка самооцінка?", "o": ["Занижена", "Завищена", "Адекватна"], "a": 0, "e": "Занижена."}, {"t": "choice", "q": "«Я найрозумніший, інші дурні» — яка самооцінка?", "o": ["Занижена", "Завищена", "Адекватна"], "a": 1, "e": "Завищена."}, {"t": "choice", "q": "Що з цього потреба, а не бажання?", "o": ["Новий телефон", "Сон", "Модні кросівки"], "a": 1, "e": "Без сну жити не можна."}, {"t": "input", "q": "Як називається вивчення власних рис, сильних і слабких сторін?", "a": ["самопізнання"], "e": "Самопізнання."}, {"t": "choice", "q": "З ким варто себе порівнювати?", "o": ["З найкращим у класі", "З собою вчорашнім", "Ні з ким ніколи"], "a": 1, "e": "Так видно власний прогрес."}]}, {"id": "et-pravyla", "sec": "Моральні норми", "title": "Хто і навіщо запроваджує правила. Моральні норми", "goal": "Ти знаєш, навіщо потрібні правила, які бувають норми і що таке етикет.", "learn": [{"h": "Навіщо правила", "p": ["Правила роблять життя <b>безпечним, справедливим і передбачуваним</b>: правила дорожнього руху, шкільний статут, правила гри. Без правил був би хаос — кожен робив би що хотів, і страждали б слабші."]}, {"h": "Види норм", "p": ["<b>Моральні норми</b> — що добре і що погано (не бреши, допомагай).", "<b>Правові норми (закони)</b> — обов'язкові для всіх, ухвалює держава.", "<b>Правила етикету</b> — як поводитись чемно (вітатись, не перебивати).", "<b>Звичаї і традиції</b> — усталені в народі (колядувати, святкувати).", "<b>Релігійні норми</b> — правила віри."]}, {"h": "Етикет", "p": ["<span class='term'>Етикет</span> — правила чемної поведінки в суспільстві: за столом, у гостях, у транспорті, у школі, у спілкуванні. Етикет — зовнішня форма поваги до людей."]}, {"h": "Права й обов'язки", "p": ["У кожного є <b>права</b> (на життя, навчання, відпочинок, думку) і <b>обов'язки</b> (навчатися, поважати інших, берегти природу). Мої права закінчуються там, де починаються права іншого."]}], "remember": "Правила дають безпеку й справедливість. Норми: моральні, правові (закони), етикет, звичаї, релігійні. Етикет — правила чемної поведінки. Права й обов'язки йдуть разом.", "cards": [{"f": "Навіщо потрібні правила?", "b": "Для безпеки, справедливості й передбачуваності життя."}, {"f": "Моральні норми", "b": "Що добре і що погано: не бреши, допомагай слабшим."}, {"f": "Правові норми", "b": "Закони, обов'язкові для всіх; ухвалює держава."}, {"f": "Етикет", "b": "Правила чемної поведінки в суспільстві."}, {"f": "Звичаї і традиції", "b": "Усталені в народі правила: свята, обряди."}, {"f": "Де закінчуються мої права?", "b": "Там, де починаються права іншої людини."}], "quiz": [{"t": "choice", "q": "Навіщо потрібні правила?", "o": ["Щоб було нудно", "Для безпеки і справедливості", "Щоб дорослі командували"], "a": 1, "e": "Без правил — хаос."}, {"t": "choice", "q": "«Не бреши» — це норма…", "o": ["моральна", "правова", "етикету"], "a": 0, "e": "Моральна норма."}, {"t": "choice", "q": "«Вітайся, заходячи в приміщення» — це…", "o": ["закон", "правило етикету", "звичай"], "a": 1, "e": "Етикет — чемність."}, {"t": "choice", "q": "Хто ухвалює закони?", "o": ["Кожен сам", "Держава", "Школа"], "a": 1, "e": "Правові норми — від держави."}, {"t": "choice", "q": "Колядувати на Різдво — це…", "o": ["закон", "звичай, традиція", "етикет"], "a": 1, "e": "Народна традиція."}, {"t": "choice", "q": "Що з цього обов'язок учня?", "o": ["Навчатися", "Мати телефон", "Дивитись відео"], "a": 0, "e": "Навчатися — обов'язок."}, {"t": "tf", "q": "Права людини безмежні.", "a": false, "e": "Мої права закінчуються там, де починаються права іншого."}, {"t": "input", "q": "Як називаються правила чемної поведінки в суспільстві?", "a": ["етикет"], "e": "Етикет."}]}, {"id": "et-dobro-vchynok", "sec": "Моральні норми", "title": "Що означає робити добро. Вчинок і його наслідки", "goal": "Ти розумієш, що таке вчинок, мотив і наслідок, і чим добро відрізняється від вигоди.", "learn": [{"h": "Робити добро", "p": ["Добро — це <b>вчинки</b>, а не слова. Допомогти, поділитись, підтримати, захистити слабшого. Справжнє добро — <b>безкорисливе</b>: не заради похвали чи нагороди. <b>Милосердя</b> — співчуття й допомога тим, кому важко. <b>Благодійність</b> — добровільна допомога грошима, речами, часом (волонтерство)."]}, {"h": "Вчинок", "p": ["<span class='term'>Вчинок</span> — свідома дія, за яку людина відповідає. Вчинок має <b>мотив</b> (чому я це роблю), саму <b>дію</b> і <b>наслідки</b> (що сталось після). Оцінюють вчинок і за мотивом, і за наслідками."], "ex": ["Один мотив — різні наслідки: хотів пожартувати — образив друга.", "Перш ніж діяти, подумай: «А що буде потім? Як це вплине на інших?»"]}, {"h": "Відповідальність", "p": ["<span class='term'>Відповідальність</span> — готовність відповідати за свої вчинки й їх наслідки, виправляти помилки. Відповідальна людина не каже «це не я», а каже «я виправлю»."]}, {"h": "Вибір", "p": ["Щодня ми обираємо: сказати правду чи збрехати, допомогти чи пройти повз. <b>Моральний вибір</b> — вибір між добром і злом; його робить кожен сам, і саме він показує, яка людина."]}], "remember": "Добро — це вчинки, безкорисливі. Вчинок = мотив + дія + наслідки. Відповідальність — відповідати за вчинки і виправляти помилки. Моральний вибір — між добром і злом.", "cards": [{"f": "Вчинок", "b": "Свідома дія, за яку людина відповідає; має мотив і наслідки."}, {"f": "Мотив", "b": "Причина, чому людина робить вчинок."}, {"f": "Наслідки", "b": "Те, що стається після вчинку, як він впливає на інших."}, {"f": "Безкорисливе добро", "b": "Добро не заради похвали чи нагороди."}, {"f": "Милосердя", "b": "Співчуття й допомога тим, кому важко."}, {"f": "Відповідальність", "b": "Готовність відповідати за вчинки й виправляти помилки."}, {"f": "Моральний вибір", "b": "Вибір між добром і злом, який людина робить сама."}], "quiz": [{"t": "choice", "q": "Що таке вчинок?", "o": ["Будь-який рух", "Свідома дія, за яку людина відповідає", "Думка"], "a": 1, "e": "Вчинок свідомий і має наслідки."}, {"t": "choice", "q": "Мотив — це…", "o": ["результат дії", "причина, чому людина діє", "покарання"], "a": 1, "e": "Мотив — «чому»."}, {"t": "choice", "q": "Яке добро справжнє?", "o": ["Заради нагороди", "Безкорисливе", "Тільки для друзів"], "a": 1, "e": "Без розрахунку на вигоду."}, {"t": "choice", "q": "Петрик допоміг бабусі, щоб його похвалили. Що не так?", "o": ["Усе добре", "Мотив корисливий — заради похвали", "Бабусі не треба допомагати"], "a": 1, "e": "Учинок добрий, але мотив — вигода."}, {"t": "choice", "q": "Відповідальна людина, зробивши помилку, каже…", "o": ["«Це не я»", "«Я виправлю»", "«Так вийшло»"], "a": 1, "e": "Відповідальність — виправляти."}, {"t": "input", "q": "Як називається добровільна допомога іншим грошима, речами або часом?", "a": ["благодійність", "волонтерство"], "e": "Благодійність (волонтерство)."}, {"t": "choice", "q": "Що варто зробити перед вчинком?", "o": ["Подумати про наслідки для інших", "Нічого", "Спитати друзів"], "a": 0, "e": "«Що буде потім?»"}, {"t": "tf", "q": "Вчинок оцінюють лише за наслідками, мотив не важливий.", "a": false, "e": "І мотив, і наслідки важливі."}]}, {"id": "et-povaha", "sec": "Моральні норми", "title": "Повага до людей. Повага до Батьківщини", "goal": "Ти розумієш, як виявляти повагу до людей і що таке патріотизм.", "learn": [{"h": "Повага", "p": ["<span class='term'>Повага</span> — визнання цінності іншої людини, її гідності, думок і прав. Виявляється у ввічливості, уважності, умінні слухати, не принижувати. <span class='term'>Гідність</span> — усвідомлення власної цінності; є в кожної людини від народження."], "note": "Повага не залежить від віку, багатства, посади. Поважати треба й тих, з ким не згоден."}, {"h": "Як виявляти повагу", "p": ["Вітатись; звертатись на «ви» до старших; не перебивати; слухати; дякувати; не глузувати; поважати чужі речі й особистий простір; допомагати."]}, {"h": "Повага до Батьківщини", "p": ["<span class='term'>Батьківщина</span> — земля, де ти народився і живеш, її люди, мова, історія. <span class='term'>Патріотизм</span> — любов до Батьківщини і готовність працювати для неї. Виявляється в знанні мови й історії, шані до <b>державних символів</b> (Прапор, Герб, Гімн), турботі про свій край, чесній праці."], "ex": ["Державні символи України: синьо-жовтий Прапор, малий Герб — тризуб, Гімн «Ще не вмерла України…» (слова Павла Чубинського, музика Михайла Вербицького).", "Гімн слухають стоячи, з повагою."]}], "remember": "Повага — визнання цінності й гідності кожного; не залежить від віку й багатства. Патріотизм — любов до Батьківщини і праця для неї. Символи: Прапор, Герб (тризуб), Гімн (Чубинський, Вербицький).", "cards": [{"f": "Повага", "b": "Визнання цінності іншої людини, її гідності, думок і прав."}, {"f": "Гідність", "b": "Усвідомлення власної цінності; є в кожної людини від народження."}, {"f": "Патріотизм", "b": "Любов до Батьківщини і готовність працювати для неї."}, {"f": "Державні символи України", "b": "Прапор (синьо-жовтий), Герб (тризуб), Гімн."}, {"f": "Автори Гімну України", "b": "Слова — Павло Чубинський, музика — Михайло Вербицький."}, {"f": "Як виявляти повагу?", "b": "Вітатись, слухати, не перебивати, дякувати, не глузувати."}], "quiz": [{"t": "choice", "q": "Повага — це…", "o": ["страх перед сильнішим", "визнання цінності й гідності іншої людини", "підкорення"], "a": 1, "e": "Повага — про цінність людини."}, {"t": "choice", "q": "Кого треба поважати?", "o": ["Тільки старших", "Тільки друзів", "Кожну людину"], "a": 2, "e": "Гідність є у кожного."}, {"t": "choice", "q": "Що НЕ є виявом поваги?", "o": ["Вислухати до кінця", "Перебивати", "Подякувати"], "a": 1, "e": "Перебивання — неповага."}, {"t": "choice", "q": "Патріотизм — це…", "o": ["ненависть до інших країн", "любов до Батьківщини й праця для неї", "гучні слова"], "a": 1, "e": "Любов, що виявляється у вчинках."}, {"t": "choice", "q": "Який знак на малому Гербі України?", "o": ["Лев", "Тризуб", "Орел"], "a": 1, "e": "Тризуб."}, {"t": "choice", "q": "Хто написав музику Гімну України?", "o": ["Микола Лисенко", "Михайло Вербицький", "Павло Чубинський"], "a": 1, "e": "Вербицький — музика, Чубинський — слова."}, {"t": "input", "q": "Хто автор слів Гімну України? Напиши прізвище.", "a": ["чубинський"], "e": "Павло Чубинський."}, {"t": "tf", "q": "Гімн слухають сидячи.", "a": false, "e": "Гімн слухають стоячи."}, {"t": "choice", "q": "Як виявити повагу до Батьківщини у школі?", "o": ["Вчити мову й історію, шанувати символи", "Кричати гасла", "Нічого не робити"], "a": 0, "e": "Патріотизм — у щоденних справах."}]}, {"id": "et-sorom-strymanist", "sec": "Людські чесноти", "title": "Чесноти. Сором і совість. Стриманість", "goal": "Ти знаєш, що таке чесноти, навіщо людині сором і чому стриманість — чеснота.", "learn": [{"h": "Чесноти", "p": ["<span class='term'>Чесноти</span> — позитивні моральні риси людини: доброта, чесність, справедливість, мужність, працьовитість, скромність, стриманість, доброзичливість, відповідальність. Протилежність — <b>вади</b>: жадібність, лінь, брехливість, заздрість, грубість."], "note": "Чесноти не даються від народження — їх виховують щоденними вчинками."}, {"h": "Сором і совість", "p": ["<span class='term'>Сором</span> — неприємне почуття, коли ми зробили щось погане і розуміємо це. <span class='term'>Совість</span> — внутрішній голос, що оцінює вчинки. Сором — не слабкість, а ознака живої совісті: він допомагає не повторювати поганого. Той, кому ніколи не соромно, — безсовісний."], "ex": ["Соромно за брехню, за образу, за ледарство. Що робити: визнати, вибачитись, виправити."]}, {"h": "Стриманість", "p": ["<span class='term'>Стриманість</span> — уміння володіти собою: не кричати в гніві, не казати зайвого, не робити необдуманого, дочекатись своєї черги. Стримана людина думає, перш ніж діяти. Протилежність — запальність, нестриманість, що веде до сварок і образ."], "note": "Правило трьох секунд: розлютився — вдихни, порахуй до трьох, потім говори."}], "remember": "Чесноти — позитивні моральні риси (доброта, чесність, стриманість); вади — протилежні. Сором — ознака живої совісті. Стриманість — володіти собою, думати перед дією.", "cards": [{"f": "Чесноти", "b": "Позитивні моральні риси: доброта, чесність, мужність, скромність, стриманість."}, {"f": "Вади", "b": "Негативні риси: жадібність, лінь, брехливість, заздрість."}, {"f": "Сором", "b": "Неприємне почуття після поганого вчинку; ознака живої совісті."}, {"f": "Що робити, коли соромно?", "b": "Визнати, вибачитись, виправити."}, {"f": "Стриманість", "b": "Уміння володіти собою, не діяти в гніві, думати перед дією."}, {"f": "Чи даються чесноти від народження?", "b": "Ні, їх виховують щоденними вчинками."}], "quiz": [{"t": "choice", "q": "Чесноти — це…", "o": ["позитивні моральні риси", "дорогі речі", "знання з математики"], "a": 0, "e": "Доброта, чесність тощо."}, {"t": "choice", "q": "Що з цього — вада?", "o": ["Скромність", "Заздрість", "Працьовитість"], "a": 1, "e": "Заздрість — вада."}, {"t": "choice", "q": "Сором — це…", "o": ["слабкість", "ознака живої совісті", "хвороба"], "a": 1, "e": "Сором допомагає виправитись."}, {"t": "choice", "q": "Кого називають безсовісним?", "o": ["Того, кому ніколи не соромно", "Того, хто часто вибачається", "Того, хто мовчить"], "a": 0, "e": "Немає сорому — немає совісті."}, {"t": "choice", "q": "Стриманість — це…", "o": ["мовчати завжди", "уміння володіти собою", "боятись говорити"], "a": 1, "e": "Не діяти в гніві."}, {"t": "choice", "q": "Ти розлютився на друга. Що зробить стримана людина?", "o": ["Накричить", "Вдихне, порахує до трьох і спокійно скаже, що не так", "Ударить"], "a": 1, "e": "Спочатку подумати."}, {"t": "input", "q": "Як називається внутрішній голос, що оцінює наші вчинки?", "a": ["совість"], "e": "Совість."}, {"t": "tf", "q": "Чесноти виховуються щоденними вчинками.", "a": true, "e": "Так, чеснотами не народжуються."}]}, {"id": "et-dobrozychlyvist-starannist", "sec": "Людські чесноти", "title": "Доброзичливість. Старанність. Вихованість. Скромність", "goal": "Ти розрізняєш чесноти доброзичливості, старанності, вихованості й скромності.", "learn": [{"h": "Доброзичливість", "p": ["<span class='term'>Доброзичливість</span> — бажання добра іншим, привітність, готовність допомогти. Виявляється в усмішці, добрих словах, підтримці. Доброзичлива людина не зловтішається чужими невдачами."]}, {"h": "Старанність", "p": ["<span class='term'>Старанність</span> — робити справу ретельно, до кінця, з зусиллям. Старанність стає <b>звичкою</b>, якщо повторювати щодня: робити уроки вчасно, доводити почате до кінця. Протилежність — <b>лінь</b> і недбалість."], "note": "Прислів'я: «Без труда нема плода», «Хочеш їсти калачі — не сиди на печі»."}, {"h": "Вихованість", "p": ["<span class='term'>Вихованість</span> — уміння поводитись чемно з усіма, дотримуватись етикету, зважати на інших. Вихована людина не грубіянить, не кричить, тримає слово, поважає старших і молодших однаково."]}, {"h": "Скромність", "p": ["<span class='term'>Скромність</span> — не вихвалятись, не вимагати уваги, визнавати заслуги інших, не зазнаватись. Протилежність — <b>хвалькуватість</b> і <b>зарозумілість</b>. Скромність не означає приниження себе — це спокійна впевненість без хизування."], "ex": ["Микита Кожум'яка відмовився від нагороди — скромність. Лис Микита став царем через хвалькуватість — і загинув."]}], "remember": "Доброзичливість — бажання добра іншим. Старанність — ретельно й до кінця, стає звичкою. Вихованість — чемність з усіма. Скромність — не вихвалятись; протилежність — хвалькуватість і зарозумілість.", "cards": [{"f": "Доброзичливість", "b": "Бажання добра іншим, привітність, готовність допомогти."}, {"f": "Старанність", "b": "Робити справу ретельно, з зусиллям, до кінця."}, {"f": "Як старанність стає звичкою?", "b": "Щоденним повторенням: уроки вчасно, справи до кінця."}, {"f": "Вихованість", "b": "Чемна поведінка з усіма, дотримання етикету."}, {"f": "Скромність", "b": "Не вихвалятись, визнавати заслуги інших, не зазнаватись."}, {"f": "Протилежність скромності", "b": "Хвалькуватість, зарозумілість."}], "quiz": [{"t": "choice", "q": "Доброзичливість — це…", "o": ["бажання добра іншим", "бажання подобатись", "байдужість"], "a": 0, "e": "Привітність і готовність допомогти."}, {"t": "choice", "q": "Хто виявляє старанність?", "o": ["Той, хто робить швидко й недбало", "Той, хто робить ретельно і до кінця", "Той, хто відкладає на завтра"], "a": 1, "e": "Старанність — ретельність."}, {"t": "choice", "q": "Протилежність старанності —", "o": ["лінь", "скромність", "чесність"], "a": 0, "e": "Лінь і недбалість."}, {"t": "choice", "q": "Вихована людина…", "o": ["чемна лише з дорослими", "чемна з усіма", "чемна, коли її бачать"], "a": 1, "e": "Вихованість — для всіх і завжди."}, {"t": "choice", "q": "Скромність — це…", "o": ["приниження себе", "не вихвалятись і визнавати заслуги інших", "мовчання"], "a": 1, "e": "Спокійна впевненість без хизування."}, {"t": "choice", "q": "Протилежність скромності —", "o": ["хвалькуватість", "доброта", "старанність"], "a": 0, "e": "Хвалькуватість і зарозумілість."}, {"t": "choice", "q": "Який герой виявив скромність?", "o": ["Лис Микита", "Микита Кожум'яка", "Хлопчик-зірка на початку казки"], "a": 1, "e": "Відмовився від нагороди."}, {"t": "input", "q": "Заверши прислів'я: «Без труда нема …»", "a": ["плода"], "e": "Без труда нема плода."}]}, {"id": "et-dovira-simia", "sec": "Людина серед людей", "title": "Довіра. Сім'я", "goal": "Ти розумієш цінність довіри й значення сім'ї.", "learn": [{"h": "Довіра", "p": ["<span class='term'>Довіра</span> — впевненість у чесності й надійності іншої людини. Довіра будується довго — через чесність, виконані обіцянки, збережені таємниці — і руйнується миттєво брехнею чи зрадою. Довіру треба <b>заслужити</b> і <b>берегти</b>."], "note": "Довіра взаємна: щоб довіряли тобі, будь надійним сам. Але й сліпо довіряти кожному незнайомцю небезпечно."}, {"h": "Сім'я", "p": ["<span class='term'>Сім'я</span> — найближчі люди, пов'язані родинними зв'язками й любов'ю. У сім'ї людина народжується, отримує турботу, перші правила й цінності. <b>Родинні цінності</b>: любов, повага, взаємодопомога, спільні традиції, чесність."]}, {"h": "Мій внесок у сім'ю", "p": ["Сім'я — це не тільки те, що дають тобі, а й те, що даєш ти: допомога вдома, турбота про молодших і старших, добре слово, чесність, спільний час без телефонів. <b>Родовід</b> — знання свого роду, предків; <b>родинні традиції</b> — спільні свята, звички."]}], "remember": "Довіра — впевненість у надійності людини; будується довго, руйнується миттєво. Сім'я — найближчі люди; цінності: любов, повага, взаємодопомога, традиції. Внесок кожного важливий.", "cards": [{"f": "Довіра", "b": "Впевненість у чесності й надійності іншої людини."}, {"f": "Як заслужити довіру?", "b": "Чесністю, виконаними обіцянками, збереженими таємницями."}, {"f": "Що руйнує довіру?", "b": "Брехня, зрада, невиконані обіцянки."}, {"f": "Сім'я", "b": "Найближчі люди, пов'язані родинними зв'язками і любов'ю."}, {"f": "Родинні цінності", "b": "Любов, повага, взаємодопомога, спільні традиції, чесність."}, {"f": "Родовід", "b": "Знання свого роду, своїх предків."}], "quiz": [{"t": "choice", "q": "Довіра — це…", "o": ["впевненість у надійності іншого", "страх", "звичка"], "a": 0, "e": "Впевненість у чесності людини."}, {"t": "choice", "q": "Як довіра будується і руйнується?", "o": ["Швидко будується, довго руйнується", "Довго будується, миттєво руйнується", "Не змінюється"], "a": 1, "e": "Одна брехня може знищити роки довіри."}, {"t": "choice", "q": "Що зміцнює довіру?", "o": ["Виконані обіцянки", "Плітки", "Хвастощі"], "a": 0, "e": "Надійність."}, {"t": "tf", "q": "Довіряти треба кожному незнайомцю.", "a": false, "e": "Довіра має бути заслуженою; з незнайомцями — обережно."}, {"t": "choice", "q": "Що дає сім'я людині?", "o": ["Турботу, перші правила й цінності", "Тільки гроші", "Нічого"], "a": 0, "e": "Сім'я — початок усього."}, {"t": "choice", "q": "Що НЕ є родинною цінністю?", "o": ["Взаємодопомога", "Байдужість", "Повага"], "a": 1, "e": "Байдужість руйнує сім'ю."}, {"t": "choice", "q": "Який внесок у сім'ю може зробити п'ятикласник?", "o": ["Жодного", "Допомагати вдома, турбуватись про рідних", "Тільки вчитись"], "a": 1, "e": "Сім'я — це і давати, не лише отримувати."}, {"t": "input", "q": "Як називається знання свого роду і предків?", "a": ["родовід"], "e": "Родовід."}]}, {"id": "et-druzhba-kolektyv", "sec": "Людина серед людей", "title": "Дружба. Колектив. Взаємини в школі", "goal": "Ти знаєш, з чого починається дружба, що таке колектив і як досягти поваги в ньому.", "learn": [{"h": "Дружба", "p": ["<span class='term'>Дружба</span> — близькі стосунки, засновані на довірі, взаємній симпатії, спільних інтересах і підтримці. Справжній друг: чесний, надійний, підтримує в біді, радіє твоїм успіхам, каже правду навіть неприємну."], "note": "Дружба починається з поваги й довіри, а не з вигоди. «Друзі пізнаються в біді»."}, {"h": "Колектив", "p": ["<span class='term'>Колектив</span> — група людей, об'єднаних спільною справою і метою: клас, команда, гурток. У колективі є правила, ролі, спільна відповідальність. <b>Згуртований</b> колектив — де підтримують кожного і працюють разом."]}, {"h": "Як досягти поваги в колективі", "p": ["Бути чесним і надійним; виконувати свою частину роботи; не зневажати слабших; не пліткувати; вміти визнавати помилки; допомагати; поважати інших — і тоді поважатимуть тебе. Повагу не можна вимагати силою — її заслуговують."]}, {"h": "Взаємини в школі", "p": ["Учні — учитель: повага, чесність, виконання правил, право на запитання і власну думку. Учні між собою: рівність, підтримка, без глузування. <b>Шкільні правила</b> існують, щоб усім було безпечно й спокійно навчатись."]}], "remember": "Дружба — довіра, симпатія, підтримка; друзі пізнаються в біді. Колектив — група зі спільною метою. Повагу в колективі заслуговують чесністю, надійністю, допомогою — не силою.", "cards": [{"f": "Дружба", "b": "Близькі стосунки на основі довіри, симпатії, спільних інтересів і підтримки."}, {"f": "Справжній друг", "b": "Чесний, надійний, підтримує в біді, радіє успіхам, каже правду."}, {"f": "Колектив", "b": "Група людей, об'єднаних спільною справою і метою: клас, команда."}, {"f": "Згуртований колектив", "b": "Де підтримують кожного і працюють разом."}, {"f": "Як заслужити повагу в колективі?", "b": "Чесністю, надійністю, допомогою, визнанням помилок."}, {"f": "Чи можна вимагати повагу силою?", "b": "Ні, повагу тільки заслуговують."}], "quiz": [{"t": "choice", "q": "На чому ґрунтується дружба?", "o": ["На вигоді", "На довірі, симпатії й підтримці", "На багатстві"], "a": 1, "e": "Довіра — основа дружби."}, {"t": "choice", "q": "Справжній друг…", "o": ["каже лише приємне", "каже правду, навіть неприємну, і підтримує", "дружить, коли зручно"], "a": 1, "e": "Чесність — ознака друга."}, {"t": "choice", "q": "Заверши: «Друзі пізнаються…»", "o": ["у грі", "в біді", "в багатстві"], "a": 1, "e": "У біді."}, {"t": "choice", "q": "Колектив — це…", "o": ["будь-яка юрба", "група зі спільною справою і метою", "сім'я"], "a": 1, "e": "Клас, команда, гурток."}, {"t": "choice", "q": "Як досягти поваги в класі?", "o": ["Бути сильним і залякувати", "Бути чесним, надійним, допомагати", "Купувати подарунки"], "a": 1, "e": "Повагу заслуговують."}, {"t": "choice", "q": "Що робить колектив згуртованим?", "o": ["Суворість учителя", "Підтримка кожного і спільна робота", "Однаковий одяг"], "a": 1, "e": "Взаємопідтримка."}, {"t": "tf", "q": "Учень має право ставити запитання вчителю і мати власну думку.", "a": true, "e": "Так, при взаємній повазі."}, {"t": "choice", "q": "Навіщо шкільні правила?", "o": ["Щоб карати", "Щоб усім було безпечно й спокійно навчатись", "Просто традиція"], "a": 1, "e": "Безпека і порядок для всіх."}]}, {"id": "et-tolerantnist-konflikt", "sec": "Людина серед людей", "title": "Толерантність. Конфлікт і як його розв'язати", "goal": "Ти знаєш, що таке толерантність, права людини, конфлікт і способи його розв'язання.", "learn": [{"h": "Толерантність", "p": ["<span class='term'>Толерантність</span> — терпиме, поважне ставлення до людей, які відрізняються від тебе: іншої національності, релігії, поглядів, зовнішності, з інвалідністю. Терпимість не означає погоджуватись з усім — означає не принижувати за відмінність."], "note": "16 листопада — Міжнародний день толерантності. Протилежність — <b>нетерпимість, дискримінація</b> (ущемлення прав через відмінність)."}, {"h": "Права людини й дитини", "p": ["Кожна людина має рівні права незалежно від статі, кольору шкіри, віри. <b>Конвенція ООН про права дитини</b> (1989): право на життя, ім'я, сім'ю, освіту, захист від насильства, відпочинок, власну думку. Права інших — межа моєї свободи."]}, {"h": "Конфлікт", "p": ["<span class='term'>Конфлікт</span> — зіткнення протилежних інтересів, поглядів, бажань. Конфлікти неминучі; важливо, як їх розв'язувати. <b>Причини</b>: нерозуміння, різні бажання, образа, несправедливість."]}, {"h": "Способи розв'язання конфлікту", "p": ["<b>Компроміс</b> — кожен поступається частково. <b>Співпраця</b> — шукаємо рішення, вигідне обом (найкращий спосіб). <b>Поступка</b> — один погоджується. <b>Уникання</b> — відкладаємо. <b>Суперництво</b> — «перемога» за будь-яку ціну (найгірший). Кроки: заспокоїтись → вислухати іншого → сказати про свої почуття («я»-повідомлення: «мені образливо, коли…») → шукати рішення. <b>Медіатор</b> — третя особа, що допомагає домовитись."]}], "remember": "Толерантність — повага до тих, хто інший; 16 листопада. Права дитини — Конвенція ООН 1989. Конфлікт — зіткнення інтересів. Способи: компроміс, співпраця (найкращий), поступка, уникання, суперництво (найгірший). «Я»-повідомлення, медіатор.", "cards": [{"f": "Толерантність", "b": "Поважне ставлення до людей, які відрізняються від тебе."}, {"f": "Дискримінація", "b": "Ущемлення прав людини через її відмінність (національність, віру, стать)."}, {"f": "Конвенція ООН про права дитини", "b": "Міжнародний документ 1989 року про права кожної дитини."}, {"f": "Конфлікт", "b": "Зіткнення протилежних інтересів, поглядів, бажань."}, {"f": "Компроміс", "b": "Спосіб розв'язання конфлікту, коли кожен поступається частково."}, {"f": "Співпраця", "b": "Пошук рішення, вигідного обом; найкращий спосіб."}, {"f": "«Я»-повідомлення", "b": "Говорити про свої почуття: «мені образливо, коли…» замість «ти поганий»."}, {"f": "Медіатор", "b": "Третя особа, яка допомагає сторонам домовитись."}], "quiz": [{"t": "choice", "q": "Толерантність — це…", "o": ["погоджуватись з усім", "поважати тих, хто відрізняється", "байдужість"], "a": 1, "e": "Не принижувати за відмінність."}, {"t": "choice", "q": "Коли Міжнародний день толерантності?", "o": ["16 листопада", "1 червня", "8 березня"], "a": 0, "e": "16 листопада."}, {"t": "choice", "q": "Ущемлення прав через національність — це…", "o": ["компроміс", "дискримінація", "конфлікт"], "a": 1, "e": "Дискримінація."}, {"t": "choice", "q": "Який документ захищає права дитини?", "o": ["Конвенція ООН про права дитини", "Шкільний статут", "Правила дорожнього руху"], "a": 0, "e": "1989 рік."}, {"t": "choice", "q": "Конфлікт — це…", "o": ["бійка", "зіткнення протилежних інтересів", "розмова"], "a": 1, "e": "Зіткнення інтересів чи поглядів."}, {"t": "choice", "q": "Двоє хочуть один м'яч і домовляються грати по черзі. Це…", "o": ["суперництво", "компроміс", "уникання"], "a": 1, "e": "Кожен поступився частково."}, {"t": "choice", "q": "Який спосіб розв'язання конфлікту найкращий?", "o": ["Суперництво", "Співпраця", "Уникання"], "a": 1, "e": "Рішення, вигідне обом."}, {"t": "choice", "q": "Яке «я»-повідомлення правильне?", "o": ["«Ти завжди все псуєш!»", "«Мені образливо, коли мене перебивають»", "«Ти дурний»"], "a": 1, "e": "Говоримо про свої почуття, не звинувачуємо."}, {"t": "input", "q": "Як називається третя особа, яка допомагає сторонам конфлікту домовитись?", "a": ["медіатор", "посередник"], "e": "Медіатор."}, {"t": "tf", "q": "Конфліктів можна повністю уникнути в житті.", "a": false, "e": "Конфлікти неминучі; важливо вміти їх розв'язувати."}]}, {"id": "et-bulinh", "sec": "Людина серед людей", "title": "Агресія. Булінг і кібербулінг", "goal": "Ти знаєш, що таке булінг, його ознаки, ролі учасників і що робити.", "learn": [{"h": "Агресія", "p": ["<span class='term'>Агресія</span> — поведінка, спрямована на те, щоб завдати шкоди: фізична (бити, штовхати), словесна (образи, погрози), непряма (плітки, бойкот). Агресія відрізняється від конфлікту: у конфлікті сторони рівні і сперечаються, в агресії один нападає."]}, {"h": "Булінг", "p": ["<span class='term'>Булінг</span> (цькування) — <b>систематичне</b> (повторюване) <b>умисне</b> знущання над людиною, яка <b>слабша</b> і не може захиститись. Три ознаки: повторюваність, умисність, нерівність сил. Види: фізичний, словесний, соціальний (ігнорування, бойкот), <b>кібербулінг</b> — в інтернеті (образливі повідомлення, поширення фото, фейкові сторінки)."], "note": "Одноразова сварка — не булінг. Булінг — коли це повторюється і жертва не може відповісти."}, {"h": "Ролі", "p": ["<b>Булер</b> (агресор), <b>жертва</b>, <b>спостерігачі</b>. Спостерігачі вирішують усе: якщо вони мовчать чи сміються — булінг триває; якщо заступаються або повідомляють — він припиняється."]}, {"h": "Що робити", "p": ["Якщо цькують тебе: не мовчи — розкажи батькам, учителю, психологу; не відповідай агресією; зберігай докази (скріншоти); блокуй в інтернеті. Якщо бачиш булінг: не смійся, заступись словом, поклич дорослого. В Україні булінг заборонений законом (з 2019 р.); за нього відповідають і діти, і їхні батьки."]}], "remember": "Агресія — поведінка, що завдає шкоди. Булінг — систематичне умисне знущання над слабшим; види: фізичний, словесний, соціальний, кібербулінг. Ролі: булер, жертва, спостерігачі. Що робити: розказати дорослим, не мовчати, зберігати докази.", "cards": [{"f": "Агресія", "b": "Поведінка, спрямована на шкоду іншому: фізична, словесна, непряма."}, {"f": "Булінг", "b": "Систематичне умисне знущання над слабшим, який не може захиститись."}, {"f": "Три ознаки булінгу", "b": "Повторюваність, умисність, нерівність сил."}, {"f": "Кібербулінг", "b": "Цькування в інтернеті: образливі повідомлення, поширення фото."}, {"f": "Ролі в булінгу", "b": "Булер, жертва, спостерігачі."}, {"f": "Чому спостерігачі важливі?", "b": "Їхнє мовчання підтримує булінг, їхнє втручання його зупиняє."}, {"f": "Що робити, якщо тебе цькують?", "b": "Розказати дорослим, не мовчати, зберігати докази, блокувати."}], "quiz": [{"t": "choice", "q": "Чим булінг відрізняється від сварки?", "o": ["Нічим", "Булінг систематичний і спрямований на слабшого", "Булінг — тільки в інтернеті"], "a": 1, "e": "Повторюваність, умисність, нерівність сил."}, {"t": "choice", "q": "Однокласника щодня ігнорують і не беруть у гру. Це…", "o": ["соціальний булінг", "конфлікт", "дружба"], "a": 0, "e": "Бойкот — соціальний булінг."}, {"t": "choice", "q": "Поширення образливого фото в чаті класу — це…", "o": ["жарт", "кібербулінг", "реклама"], "a": 1, "e": "Кібербулінг."}, {"t": "choice", "q": "Хто може зупинити булінг найефективніше?", "o": ["Спостерігачі, якщо втрутяться", "Тільки булер", "Ніхто"], "a": 0, "e": "Спостерігачі вирішують усе."}, {"t": "choice", "q": "Тебе цькують. Що робити?", "o": ["Мовчати й терпіти", "Розказати батькам чи вчителю", "Відповісти тим самим"], "a": 1, "e": "Не мовчати."}, {"t": "choice", "q": "Ти бачиш, як б'ють молодшого. Що робити?", "o": ["Знімати на телефон і викласти", "Заступитись словом і покликати дорослого", "Пройти повз"], "a": 1, "e": "Не бути мовчазним спостерігачем."}, {"t": "tf", "q": "В Україні булінг заборонений законом.", "a": true, "e": "З 2019 року — штрафи для батьків і винних."}, {"t": "input", "q": "Як називають того, хто цькує інших?", "a": ["булер", "агресор", "кривдник"], "e": "Булер (агресор)."}, {"t": "choice", "q": "Навіщо зберігати скріншоти образливих повідомлень?", "o": ["Щоб перечитувати", "Як докази для дорослих", "Не треба"], "a": 1, "e": "Докази допомагають зупинити кривдника."}]}, {"id": "et-spilkuvannia", "sec": "Культура спілкування", "title": "Спілкування. Вербальне й невербальне. Мова без слів", "goal": "Ти знаєш види спілкування, правила успішного спілкування і читаєш «мову без слів».", "learn": [{"h": "Спілкування", "p": ["<span class='term'>Спілкування</span> — обмін думками, інформацією, почуттями. Види: <b>вербальне</b> (словами — усно й письмово) і <b>невербальне</b> (без слів — міміка, жести, поза, погляд, інтонація, відстань). Учені кажуть: більшість інформації про почуття ми передаємо невербально."]}, {"h": "Правила успішного спілкування", "p": ["Слухай уважно, не перебивай. Дивись на співрозмовника. Говори ясно й ввічливо. Став запитання. Поважай іншу думку. Не ображай. Умій сказати «вибач» і «дякую». Пам'ятай ім'я співрозмовника."]}, {"h": "Повага в мовленні", "p": ["Ввічливі слова: <i>будь ласка, дякую, перепрошую, дозвольте</i>. Звертання на «ви» до старших. Без грубих слів і лайки. Без суржику — чистою українською. <b>Мовний етикет</b> — правила ввічливого мовлення."]}, {"h": "Мова без слів", "p": ["<b>Міміка</b> — вираз обличчя (усмішка — привітність). <b>Жести</b> — рухи рук (кивок — згода; але жести в різних країнах різні). <b>Поза</b> — схрещені руки — закритість. <b>Погляд</b> — в очі — щирість, увага. <b>Дистанція</b> — з близькими ближче, з незнайомими далі. Правила: не тицяти пальцем, не показувати спину співрозмовнику, усміхатись щиро."]}], "remember": "Спілкування вербальне (слова) і невербальне (міміка, жести, поза, погляд, інтонація). Правила: слухай, не перебивай, поважай. Мовний етикет — ввічливі слова, «ви» до старших. Жести в різних країнах різні.", "cards": [{"f": "Вербальне спілкування", "b": "Спілкування словами — усно й письмово."}, {"f": "Невербальне спілкування", "b": "Без слів: міміка, жести, поза, погляд, інтонація, відстань."}, {"f": "Міміка", "b": "Вираз обличчя."}, {"f": "Мовний етикет", "b": "Правила ввічливого мовлення: будь ласка, дякую, «ви» до старших."}, {"f": "Головні правила спілкування", "b": "Слухай уважно, не перебивай, дивись на людину, поважай думку іншого."}, {"f": "Схрещені на грудях руки означають…", "b": "Закритість, захист."}], "quiz": [{"t": "choice", "q": "Спілкування словами — це…", "o": ["вербальне", "невербальне"], "a": 0, "e": "Вербальне — словесне."}, {"t": "choice", "q": "Усмішка, кивок, погляд — це…", "o": ["вербальне спілкування", "невербальне спілкування"], "a": 1, "e": "Мова без слів."}, {"t": "choice", "q": "Що заважає успішному спілкуванню?", "o": ["Слухати уважно", "Перебивати", "Ставити запитання"], "a": 1, "e": "Перебивання — неповага."}, {"t": "choice", "q": "Схрещені руки на грудях зазвичай означають…", "o": ["радість", "закритість, захист", "згоду"], "a": 1, "e": "Закрита поза."}, {"t": "tf", "q": "Жести означають те саме в усіх країнах світу.", "a": false, "e": "Ні, один жест може мати різні значення."}, {"t": "choice", "q": "Як звертатись до вчителя?", "o": ["На «ти»", "На «ви»", "Без звертання"], "a": 1, "e": "До старших — на «ви»."}, {"t": "input", "q": "Як називається вираз обличчя, що передає емоції?", "a": ["міміка"], "e": "Міміка."}, {"t": "choice", "q": "Що НЕ належить до мовного етикету?", "o": ["«Дякую»", "«Перепрошую»", "Лайливі слова"], "a": 2, "e": "Лайка — порушення етикету."}, {"t": "choice", "q": "Погляд в очі під час розмови означає…", "o": ["увагу й щирість", "агресію завжди", "байдужість"], "a": 0, "e": "Уважність до співрозмовника."}]}, {"id": "et-dystantsiine", "sec": "Культура спілкування", "title": "Дистанційне і віртуальне спілкування. Безпека в інтернеті", "goal": "Ти знаєш правила ввічливого й безпечного спілкування на відстані: телефон, месенджери, соцмережі.", "learn": [{"h": "Дистанційне спілкування", "p": ["Спілкування на відстані: <b>телефон, лист, смс, месенджери, відеозв'язок, соцмережі</b>. Зручно, швидко, але не видно обличчя — легко неправильно зрозуміти тон."]}, {"h": "Правила телефонної розмови", "p": ["Привітатись і назватись, якщо тебе не знають. Не дзвонити рано вранці, пізно вечері, під час уроків. Говорити коротко й по суті. Не кричати в громадських місцях. Вимикати звук у школі, театрі, кіно."]}, {"h": "Нетикет — етикет в інтернеті", "p": ["<span class='term'>Нетикет</span> — правила ввічливості в мережі. Пиши грамотно, без КАПСУ (це крик). Не пиши те, чого не сказав би в обличчя. Не спамуй десятками повідомлень. Не поширюй чужі фото й особисту інформацію без дозволу. Перевіряй інформацію, не поширюй фейки."]}, {"h": "Безпека", "p": ["Не повідомляй незнайомцям адресу, школу, телефон, паролі. Не надсилай своїх фото незнайомим. Не зустрічайся з онлайн-знайомими без дорослих. Пароль — довгий і секретний. Якщо хтось лякає, шантажує чи пропонує щось дивне — блокуй і розказуй дорослим. <b>Цифровий слід</b>: усе, що ти виклав, залишається в мережі назавжди."]}], "remember": "Дистанційне спілкування: телефон, смс, месенджери, соцмережі. Нетикет — етикет у мережі: без капсу, грамотно, без поширення чужого. Безпека: не давай особисті дані, не зустрічайся з онлайн-знайомими без дорослих, блокуй, розказуй. Цифровий слід залишається назавжди.", "cards": [{"f": "Дистанційне спілкування", "b": "На відстані: телефон, лист, смс, месенджери, відеозв'язок."}, {"f": "Нетикет", "b": "Правила ввічливості в інтернеті."}, {"f": "Що означає текст ВЕЛИКИМИ ЛІТЕРАМИ в мережі?", "b": "Крик — це неввічливо."}, {"f": "Чого не можна повідомляти незнайомцям онлайн?", "b": "Адресу, школу, телефон, паролі, свої фото."}, {"f": "Цифровий слід", "b": "Усе, що виклав в інтернет, залишається там назавжди."}, {"f": "Коли не варто дзвонити?", "b": "Рано вранці, пізно ввечері, під час уроків."}], "quiz": [{"t": "choice", "q": "Що таке нетикет?", "o": ["Назва мережі", "Етикет в інтернеті", "Вид вірусу"], "a": 1, "e": "Правила ввічливості онлайн."}, {"t": "choice", "q": "Повідомлення великими літерами сприймається як…", "o": ["радість", "крик", "важлива інформація"], "a": 1, "e": "Капс — це крик."}, {"t": "choice", "q": "Незнайомий у грі просить фото і адресу. Що робити?", "o": ["Надіслати", "Не надсилати, заблокувати, розказати батькам", "Спитати ім'я"], "a": 1, "e": "Особисті дані незнайомцям не дають."}, {"t": "choice", "q": "Чи можна викладати фото друга без його дозволу?", "o": ["Так", "Ні", "Якщо гарне"], "a": 1, "e": "Чужі фото — тільки з дозволу."}, {"t": "choice", "q": "Коли дзвонити недоречно?", "o": ["О 15:00", "О 23:00", "О 12:00"], "a": 1, "e": "Пізно ввечері не дзвонять."}, {"t": "choice", "q": "Що таке цифровий слід?", "o": ["Відбиток пальця", "Усе, що ти виклав у мережу і що там залишається", "Слід від миші"], "a": 1, "e": "Інтернет усе пам'ятає."}, {"t": "tf", "q": "Онлайн-друг запрошує зустрітись — можна піти самому, він же друг.", "a": false, "e": "Ні, тільки з дорослими: за ніком може бути будь-хто."}, {"t": "choice", "q": "Що робити з телефоном у театрі?", "o": ["Говорити тихо", "Вимкнути звук", "Знімати відео"], "a": 1, "e": "Беззвучний режим."}, {"t": "choice", "q": "Ти отримав шокуючу новину в чаті. Що спершу?", "o": ["Переслати всім", "Перевірити в надійних джерелах", "Повірити"], "a": 1, "e": "Не поширюй фейки."}]}, {"id": "et-hromadski-mistsia-odiah", "sec": "Культура спілкування", "title": "Ввічливість у громадських місцях. Доречний одяг", "goal": "Ти знаєш правила поведінки в транспорті, магазині, театрі, за столом і що означає одягатись доречно.", "learn": [{"h": "У транспорті й на вулиці", "p": ["Поступатись місцем старшим, вагітним, людям з інвалідністю. Не штовхатись, не кричати, не слухати музику без навушників. Пропускати тих, хто виходить. Не смітити."]}, {"h": "У магазині, театрі, музеї, бібліотеці", "p": ["Вітатись і дякувати продавцю. У театр не спізнюватись, до свого місця проходити обличчям до тих, хто сидить; не шуміти під час дії; телефон — беззвучно. У музеї не торкатись експонатів. У бібліотеці — тиша, книжки берегти."]}, {"h": "За столом", "p": ["Не починати їсти раніше за господарів. Не говорити з повним ротом. Не тягнутись через стіл — попросити передати. Ніж у правій руці, виделка в лівій. Серветка на колінах. Подякувати за їжу."]}, {"h": "Доречний одяг", "p": ["<span class='term'>Доречний одяг</span> — відповідний місцю й події: у школі — охайний, скромний; на свято — святковий; на спорт — спортивний; на природу — зручний. Одяг — знак поваги до людей і події. Чистота й охайність важливіші за модність і ціну. <b>Дрескод</b> — правила одягу в певному місці."]}], "remember": "Транспорт: поступатись місцем, не шуміти. Театр: не спізнюватись, обличчям до сидячих, тиша. Стіл: ніж праворуч, виделка ліворуч, не тягнутись. Доречний одяг — відповідний місцю й події; охайність важливіша за модність.", "cards": [{"f": "Кому поступаються місцем у транспорті?", "b": "Старшим, вагітним, людям з інвалідністю, з малими дітьми."}, {"f": "Як проходити до свого місця в театрі?", "b": "Обличчям до тих, хто сидить."}, {"f": "У якій руці ніж і виделка?", "b": "Ніж — у правій, виделка — у лівій."}, {"f": "Доречний одяг", "b": "Відповідний місцю й події: школа — охайний, свято — святковий, спорт — спортивний."}, {"f": "Дрескод", "b": "Правила одягу в певному місці чи на події."}, {"f": "Що важливіше в одязі за модність?", "b": "Чистота й охайність."}], "quiz": [{"t": "choice", "q": "У переповненому автобусі заходить бабуся. Що робити?", "o": ["Відвернутись", "Поступитись місцем", "Голосніше слухати музику"], "a": 1, "e": "Поступитись старшим."}, {"t": "choice", "q": "Як проходити до свого місця в театрі?", "o": ["Спиною до сидячих", "Обличчям до сидячих", "Як зручно"], "a": 1, "e": "Обличчям до людей."}, {"t": "choice", "q": "У якій руці тримають ніж?", "o": ["У лівій", "У правій"], "a": 1, "e": "Ніж — праворуч, виделка — ліворуч."}, {"t": "choice", "q": "Хочеш хліб, який стоїть далеко на столі. Що робити?", "o": ["Потягнутись через стіл", "Попросити передати", "Встати й узяти"], "a": 1, "e": "Попросити."}, {"t": "choice", "q": "Що таке доречний одяг?", "o": ["Найдорожчий", "Відповідний місцю й події", "Найяскравіший"], "a": 1, "e": "Одяг — знак поваги до події."}, {"t": "choice", "q": "Що вдягнути в театр?", "o": ["Спортивний костюм", "Святковий охайний одяг", "Пляжний одяг"], "a": 1, "e": "Театр — святкова подія."}, {"t": "input", "q": "Як називаються правила одягу в певному місці чи на події?", "a": ["дрескод", "дрес-код"], "e": "Дрескод."}, {"t": "tf", "q": "У музеї можна торкатись експонатів, якщо ніхто не бачить.", "a": false, "e": "Ні, експонати не торкають."}, {"t": "choice", "q": "Що важливіше в одязі?", "o": ["Ціна", "Охайність і чистота", "Бренд"], "a": 1, "e": "Охайність — ознака поваги до себе й інших."}]}, {"id": "et-emotsii-empatiia", "sec": "Емоції та життєвий шлях", "title": "Емоції та почуття. Емпатія. Керування емоціями", "goal": "Ти розрізняєш емоції й почуття, знаєш, що таке емпатія, і вмієш керувати емоціями.", "learn": [{"h": "Емоції та почуття", "p": ["<span class='term'>Емоції</span> — короткі переживання у відповідь на подію: радість, злість, страх, здивування, сум, огида. <span class='term'>Почуття</span> — тривалі й глибокі: любов, дружба, ненависть, гордість. Емоції бувають <b>позитивні</b> й <b>негативні</b>, але немає «поганих» емоцій — усі потрібні: страх береже, злість сигналізує про несправедливість, сум допомагає пережити втрату."]}, {"h": "Емпатія", "p": ["<span class='term'>Емпатія</span> — здатність відчувати й розуміти емоції іншої людини, «поставити себе на її місце». Емпатія — основа доброти, дружби, підтримки. Її можна тренувати: спостерігати за обличчям і настроєм інших, питати «як ти?», слухати, не оцінюючи."], "note": "<b>Співчуття</b> — шкода іншому; <b>емпатія</b> — розуміння його почуттів зсередини."}, {"h": "Керування емоціями", "p": ["Емоції не заборониш, але можна керувати їх виявом. Кроки: 1) <b>помітити</b> емоцію («я злюся»); 2) <b>назвати</b> її; 3) <b>пауза</b> — дихання, порахувати до 10, вийти; 4) <b>виразити</b> безпечно: сказати словами, «я»-повідомлення, спорт, малювання, розмова з другом. Не можна: бити, ображати, ламати речі, замикатись у собі надовго."]}], "remember": "Емоції — короткі (радість, злість, страх), почуття — тривалі (любов, дружба). Немає поганих емоцій. Емпатія — розуміти почуття іншого, поставити себе на його місце. Керування: помітити → назвати → пауза → безпечно виразити.", "cards": [{"f": "Емоції", "b": "Короткі переживання у відповідь на подію: радість, злість, страх, сум."}, {"f": "Почуття", "b": "Тривалі глибокі переживання: любов, дружба, гордість."}, {"f": "Чи є «погані» емоції?", "b": "Ні, усі потрібні: страх береже, злість сигналізує про несправедливість."}, {"f": "Емпатія", "b": "Здатність відчувати й розуміти емоції іншого, поставити себе на його місце."}, {"f": "Як тренувати емпатію?", "b": "Спостерігати, питати «як ти?», слухати не оцінюючи."}, {"f": "Кроки керування емоцією", "b": "Помітити → назвати → пауза (дихання, до 10) → виразити безпечно."}, {"f": "Безпечні способи виразити злість", "b": "Сказати словами, спорт, малювання, розмова з другом."}], "quiz": [{"t": "choice", "q": "Радість, злість, страх — це…", "o": ["почуття", "емоції", "риси характеру"], "a": 1, "e": "Короткі переживання — емоції."}, {"t": "choice", "q": "Любов і дружба — це…", "o": ["емоції", "почуття", "звички"], "a": 1, "e": "Тривалі й глибокі — почуття."}, {"t": "tf", "q": "Злість — погана емоція, її треба соромитись.", "a": false, "e": "Немає поганих емоцій; важливо, як їх виражати."}, {"t": "choice", "q": "Емпатія — це…", "o": ["жаліти себе", "розуміти й відчувати емоції іншого", "бути веселим"], "a": 1, "e": "Поставити себе на місце іншого."}, {"t": "choice", "q": "Друг сумний. Що робить емпатична людина?", "o": ["Каже «не сумуй, дурниці»", "Питає «що сталось?» і слухає", "Іде геть"], // ============================================================
//  Прогрес (localStorage Safari)
// ============================================================
const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/[^a-z0-9а-яіїєґ' \-]/gi,"").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
