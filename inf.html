<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Інформатика · 5 клас</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1E2A3A; --ink-2:#5B6779; --line:#E3E1D9;
    --accent:#2F6FE4; --accent-soft:#E6EEFF; --ok:#1F9D63; --ok-soft:#E3F6EC;
    --bad:#D8433B; --bad-soft:#FCE9E7; --gold:#E9A800;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3,.big{font-family:ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 20px 40px}
  .screen{display:none}.screen.on{display:block}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:60px}
  .bar .back{font-size:17px;color:var(--accent);padding:8px 8px 8px 0}
  .bar .title{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{width:64px}

  /* subject header */
  .subject{padding:28px 0 8px}
  .subject h1{font-size:34px;margin:0 0 4px;font-weight:700}
  .subject p{margin:0;color:var(--ink-2)}
  .summary{display:flex;gap:18px;margin:16px 0 22px;color:var(--ink-2);font-size:15px}
  .summary b{color:var(--ink);font-size:22px;display:block;font-family:ui-rounded,system-ui}

  /* lesson list */
  .section{color:var(--ink-2);font-size:15px;font-weight:600;margin:26px 0 10px;padding-left:2px}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
  .lesson:active{background:var(--accent-soft)}
  .lesson .n{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-family:ui-rounded,system-ui;flex:none}
  .lesson .n.done{background:var(--ok-soft);color:var(--ok)}
  .lesson .t{flex:1;min-width:0}
  .lesson .t b{display:block;font-weight:600}
  .lesson .t span{color:var(--ink-2);font-size:14px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:var(--line)}

  /* lesson home */
  .lh h2{font-size:28px;margin:12px 0 6px}
  .lh p.lead{color:var(--ink-2);margin:0 0 22px}
  .mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .mode:active{background:var(--accent-soft)}
  .mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .mode .ic.a{background:#FFF1D6}.mode .ic.b{background:#E6EEFF}.mode .ic.c{background:#E3F6EC}
  .mode b{display:block;font-size:18px;font-weight:600}
  .mode span{color:var(--ink-2);font-size:15px}
  .mode .st{margin-left:auto;color:var(--ink-2);font-size:14px;white-space:nowrap}

  /* learn */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:21px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .card .ex{background:var(--paper);border-radius:12px;padding:10px 14px;margin:8px 0}
  .card .ex i{color:var(--accent);font-style:normal;font-weight:600}
  .rem{background:#FFF7E0;border:1px solid #F5DFA0;border-radius:var(--r);padding:16px 20px;margin:6px 0 14px}
  .rem b{display:block;margin-bottom:4px}
  .term{font-weight:700;color:var(--accent)}
  .cta{display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;
    font-size:18px;font-weight:600;text-align:center;margin-top:8px}
  .cta:active{opacity:.85}
  .cta.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}

  /* flashcards */
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc{perspective:1200px;height:300px;margin-bottom:18px}
  .fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .in{transform:rotateY(180deg)}
  .fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc .f{background:#fff;border:1px solid var(--line)}
  .fc .f .big{font-size:30px;font-weight:700}
  .fc .f small{color:var(--ink-2);margin-top:14px}
  .fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:20px;line-height:1.45}
  .row{display:flex;gap:12px}
  .row .cta{margin:0}
  .cta.no{background:var(--bad-soft);color:var(--bad)}
  .cta.yes{background:var(--ok-soft);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){.fc .in{transition:none}.prog i{transition:none}}

  /* quiz */
  .qn{color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .q{font-size:22px;font-weight:600;margin:0 0 18px;font-family:ui-rounded,system-ui;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:18px}
  .opt:active{background:var(--accent-soft)}
  .opt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt:disabled{opacity:1}
  .inp{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.ok{border-color:var(--ok);background:var(--ok-soft)}.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
  .fb{border-radius:14px;padding:14px 18px;margin:14px 0 12px;display:none}
  .fb.on{display:block}
  .fb.ok{background:var(--ok-soft);color:#155C3B}.fb.bad{background:var(--bad-soft);color:#7E2620}
  .fb b{display:block;margin-bottom:2px}

  /* result */
  .res{text-align:center;padding:30px 0 10px}
  .res .score{font-size:64px;font-weight:800;font-family:ui-rounded,system-ui;line-height:1}
  .res .of{color:var(--ink-2);margin:6px 0 4px}
  .res .stars{font-size:30px;margin:10px 0 18px;letter-spacing:4px}
  .res p{margin:0 0 22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">

<!-- ===== Список уроків ===== -->
<section class="screen on" id="s-list">
  <div class="subject">
    <h1 id="subj-title"></h1>
    <p id="subj-sub"></p>
  </div>
  <div class="summary">
    <div><b id="sum-done">0</b>пройдено</div>
    <div><b id="sum-total">0</b>уроків</div>
    <div><b id="sum-stars">0</b>зірок</div>
  </div>
  <div id="lessons"></div>
</section>

<!-- ===== Урок: вибір режиму ===== -->
<section class="screen" id="s-lesson">
  <div class="bar"><button class="back" onclick="go('s-list')">‹ Уроки</button><div class="title" id="l-bar"></div><div class="spacer"></div></div>
  <div class="lh">
    <h2 id="l-title"></h2>
    <p class="lead" id="l-goal"></p>
    <button class="mode" onclick="openLearn()"><div class="ic a">📖</div><div><b>Вивчити</b><span>Правила й приклади коротко</span></div><div class="st" id="st-learn"></div></button>
    <button class="mode" onclick="openCards()"><div class="ic b">🃏</div><div><b>Повторити</b><span id="cards-count">Картки з термінами</span></div><div class="st" id="st-cards"></div></button>
    <button class="mode" onclick="openQuiz()"><div class="ic c">✅</div><div><b>Перевірити</b><span id="quiz-count">Тест</span></div><div class="st" id="st-quiz"></div></button>
  </div>
</section>

<!-- ===== Вивчити ===== -->
<section class="screen" id="s-learn">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Вивчити</div><div class="spacer"></div></div>
  <div id="learn-body"></div>
  <button class="cta" onclick="markLearn();openCards()">Далі — повторити картки</button>
</section>

<!-- ===== Картки ===== -->
<section class="screen" id="s-cards">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Повторити</div><div class="spacer"></div></div>
  <div class="qn" id="fc-n"></div>
  <div class="prog"><i id="fc-prog"></i></div>
  <div class="fc" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><div class="big" id="fc-front"></div><small>Торкнись, щоб перевернути</small></div><div class="b" id="fc-back"></div></div>
  </div>
  <div class="row">
    <button class="cta no" onclick="fcAnswer(false)">Ще раз</button>
    <button class="cta yes" onclick="fcAnswer(true)">Знаю</button>
  </div>
</section>

<!-- ===== Тест ===== -->
<section class="screen" id="s-quiz">
  <div class="bar"><button class="back" onclick="go('s-lesson')">‹ Назад</button><div class="title">Перевірити</div><div class="spacer"></div></div>
  <div class="qn" id="q-n"></div>
  <div class="prog"><i id="q-prog"></i></div>
  <div class="q" id="q-text"></div>
  <div id="q-body"></div>
  <div class="fb" id="q-fb"></div>
  <button class="cta" id="q-btn" onclick="qNext()">Перевірити</button>
</section>

<!-- ===== Результат ===== -->
<section class="screen" id="s-res">
  <div class="bar"><div class="spacer"></div><div class="title">Результат</div><div class="spacer"></div></div>
  <div class="res">
    <div class="score" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="stars" id="r-stars"></div>
    <p id="r-msg"></p>
    <button class="cta" id="r-retry" onclick="retryWrong()">Повторити помилки</button>
    <button class="cta ghost" onclick="openQuiz()">Пройти тест заново</button>
    <button class="cta ghost" onclick="go('s-list')">До списку уроків</button>
  </div>
</section>

</div>

<script>
// ============================================================
//  ДАНІ КУРСУ. Один об'єкт на предмет; генерується з підручника.
// ============================================================
const COURSE = {"id": "inf5", "title": "Інформатика", "subtitle": "5 клас · 10 уроків за шкільним підручником", "lessons": [{"id": "inf-informatsiia", "sec": "Інформація та інформаційні процеси", "title": "Інформація. Повідомлення. Інформаційні процеси", "goal": "Ти знаєш, що таке інформація й повідомлення, види повідомлень та інформаційні процеси.", "learn": [{"h": "Інформація", "p": ["<span class='term'>Інформатика</span> — наука про інформацію та способи її опрацювання за допомогою комп'ютера. <span class='term'>Інформація</span> — відомості про світ, які ми отримуємо через <b>органи чуття</b> (зір ~90%, слух, дотик, нюх, смак). <span class='term'>Повідомлення</span> — те, у чому міститься інформація: текст, звук, зображення."]}, {"h": "Види повідомлень", "p": ["За способом подання: <b>текстові</b>, <b>графічні</b> (малюнки, схеми, фото), <b>звукові</b>, <b>відео</b>, <b>комбіновані (мультимедійні)</b>, <b>числові</b>, <b>умовні сигнали</b> (світлофор, дзвінок). За способом сприйняття: зорові, слухові, дотикові, нюхові, смакові."]}, {"h": "Властивості інформації", "p": ["<b>Актуальна</b> (своєчасна), <b>достовірна</b> (правдива), <b>повна</b>, <b>зрозуміла</b>, <b>корисна</b>. Недостовірна інформація — <b>дезінформація, фейк</b>."]}, {"h": "Інформаційні процеси", "p": ["<span class='term'>Інформаційні процеси</span> — дії з інформацією: <b>пошук</b>, <b>отримання</b>, <b>збереження</b> (пам'ять, папір, флешка), <b>опрацювання</b> (обчислення, редагування), <b>передавання</b> (мова, лист, інтернет), <b>захист</b>. <b>Дані</b> — повідомлення, записані у формі, зручній для комп'ютера. <b>Носії</b> — папір, диск, флешка, хмара."]}], "remember": "Інформатика — наука про інформацію та її опрацювання комп'ютером. Повідомлення: текстові, графічні, звукові, відео, мультимедійні. Властивості: актуальна, достовірна, повна, зрозуміла, корисна. Процеси: пошук, збереження, опрацювання, передавання, захист.", "cards": [{"f": "Інформатика", "b": "Наука про інформацію та способи її опрацювання за допомогою комп'ютера."}, {"f": "Інформація", "b": "Відомості про світ, отримані через органи чуття."}, {"f": "Повідомлення", "b": "Те, у чому міститься інформація: текст, звук, зображення."}, {"f": "Види повідомлень за поданням", "b": "Текстові, графічні, звукові, відео, мультимедійні, числові, умовні сигнали."}, {"f": "Властивості інформації", "b": "Актуальна, достовірна, повна, зрозуміла, корисна."}, {"f": "Інформаційні процеси", "b": "Пошук, отримання, збереження, опрацювання, передавання, захист."}, {"f": "Дані", "b": "Повідомлення у формі, зручній для опрацювання комп'ютером."}, {"f": "Через який орган чуття ми отримуємо найбільше інформації?", "b": "Через зір — близько 90%."}], "quiz": [{"t": "choice", "q": "Інформатика — наука про…", "o": ["комп'ютерні ігри", "інформацію та її опрацювання комп'ютером", "електрику"], "a": 1, "e": "Інформація + комп'ютер."}, {"t": "choice", "q": "Дорожній знак — повідомлення…", "o": ["звукове", "графічне", "текстове"], "a": 1, "e": "Зображення."}, {"t": "choice", "q": "Шкільний дзвінок — це…", "o": ["умовний сигнал", "текстове повідомлення", "відео"], "a": 0, "e": "Умовний сигнал."}, {"t": "choice", "q": "Через який орган чуття ми отримуємо найбільше інформації?", "o": ["Слух", "Зір", "Нюх"], "a": 1, "e": "~90% — зір."}, {"t": "choice", "q": "Прогноз погоди на минулий тиждень — порушено властивість…", "o": ["актуальність", "повноту", "зрозумілість"], "a": 0, "e": "Застаріла."}, {"t": "choice", "q": "Записати файл на флешку — це процес…", "o": ["передавання", "збереження", "пошуку"], "a": 1, "e": "Збереження."}, {"t": "choice", "q": "Надіслати повідомлення другу — процес…", "o": ["передавання", "опрацювання", "захисту"], "a": 0, "e": "Передавання."}, {"t": "choice", "q": "Розв'язати приклад на калькуляторі — процес…", "o": ["збереження", "опрацювання", "пошуку"], "a": 1, "e": "Опрацювання."}, {"t": "input", "q": "Як називається неправдива інформація, поширена як правда?", "a": ["фейк", "дезінформація"], "e": "Ф ; URL, домен .ua. Гіперпосилання — перехід. Браузер — Chrome, Safari, Firefox. Пошукова система — Google; ключові слова, лапки. Перевіряй джерело. Плагіат — чуже як своє.", "cards": [{"f": "Інтернет", "b": "Глобальна комп'ютерна мережа для обміну даними."}, {"f": "Провайдер", "b": "Компанія, що надає доступ до Інтернету."}, {"f": "Вебсайт", "b": "Набір пов'язаних вебсторінок під однією адресою."}, {"f": "Гіперпосилання", "b": "Текст або зображення, клік по якому відкриває іншу сторінку."}, {"f": "Браузер", "b": "Програма для перегляду сайтів: Chrome, Safari, Firefox, Edge."}, {"f": "Пошукова система", "b": "Сайт для пошуку інформації: Google, Bing, DuckDuckGo."}, {"f": "Домен .ua / .gov.ua", "b": "Україна / державні сайти України."}, {"f": "Плагіат", "b": "Видавати чужий твір за свій."}], "quiz": [{"t": "choice", "q": "Інтернет — це…", "o": ["програма", "глобальна мережа", "сайт"], "a": 1, "e": "Всесвітня мережа."}, {"t": "choice", "q": "Яка з програм — браузер?", "o": ["Word", "Chrome", "Scratch"], "a": 1, "e": "Chrome, Safari, Firefox."}, {"t": "choice", "q": "Що таке гіперпосилання?", "o": ["Велика картинка", "Елемент, клік по якому веде на іншу сторінку", "Пароль"], "a": 1, "e": "Перехід між сторінками."}, {"t": "choice", "q": "Домен .gov.ua означає…", "o": ["комерційний сайт", "державний сайт України", "гру"], "a": 1, "e": "Державна установа."}, {"t": "choice", "q": "Хто надає доступ до Інтернету?", "o": ["Браузер", "Провайдер", "Пошукова система"], "a": 1, "e": "Провайдер."}, {"t": "choice", "q": "Що таке ключові слова?", "o": ["Паролі", "Головні слова пошукового запиту", "Назви сайтів"], "a": 1, "e": "Для пошуку."}, {"t": "choice", "q": "Навіщо лапки в пошуковому запиті?", "o": ["Для краси", "Знайти точну фразу", "Виключити слово"], "a": 1, "e": "Точна фраза."}, {"t": "choice", "q": "Яке джерело найнадійніше?", "o": ["Анонімний блог", "Сайт енциклопедії або .gov.ua", "Коментар у соцмережі"], "a": 1, "e": "Перевірені джерела."}, {"t": "choice", "q": "Скопіювати чужий реферат і здати як свій — це…", "o": ["пошук", "плагіат", "редагування"], "a": 1, "e": "Порушення авторського права."}, {"t": "input", "q": "Як називається програма для перегляду сайтів?", "a": ["браузер"], "e": "Браузер."}]}, {"id": "inf-bezpeka-etyket", "sec": "Інтернет", "title": "Безпека в Інтернеті. Мережевий етикет. Електронна пошта", "goal": "Ти знаєш правила безпеки онлайн, нетикет і як користуватись електронною поштою.", "learn": [{"h": "Загрози", "p": ["<b>Віруси й шкідливі програми</b> — заражають через файли, посилання, піратські ігри. <b>Фішинг</b> — підроблені сайти й листи, що виманюють паролі й дані карток. <b>Шахрайство</b> — «ти виграв приз», «терміново переказати гроші». <b>Кібербулінг</b>. <b>Небезпечні знайомства</b>. <b>Особисті дані</b>: ім'я, адреса, школа, телефон, фото, паролі — не розголошувати."]}, {"h": "Правила безпеки", "p": ["<b>Пароль</b>: довгий (8+ символів), букви + цифри + знаки, різний для сайтів, нікому не казати. <b>Антивірус</b> і оновлення. Не відкривати підозрілі посилання й вкладення. Не завантажувати з невідомих сайтів. Не зустрічатись з онлайн-знайомими без дорослих. Приватні налаштування профілю. Погано — розкажи дорослим; заблокуй; скріншот як доказ. Перевіряй адресу сайту (https, замок)."]}, {"h": "Мережевий етикет", "p": ["<span class='term'>Нетикет</span>: вітатись і підписуватись; грамотно; без Капсу (КРИК); без образ; не спамити; не пересилати неперевірене; поважати чужий час і приватність; емодзі доречно. Правило: не пиши те, чого не сказав би в очі."]}, {"h": "Електронна пошта", "p": ["<span class='term'>Електронна пошта (e-mail)</span> — служба надсилання листів. Адреса: <b>ім'я@сервер</b> (petryk@gmail.com — @ «равлик»). Лист: <b>Кому</b>, <b>Тема</b>, текст, <b>вкладення</b> (файл). Папки: Вхідні, Надіслані, Чернетки, Спам, Кошик. <b>Спам</b> — небажана реклама. Правила листа: тема, привітання, зрозумілий текст, підпис."]}], "remember": "Загрози: віруси, фішинг, шахрайство, кібербулінг. Пароль 8+ символів, різний, секретний. Не відкривати підозрілі посилання; особисті дані — нікому. Нетикет: без Капсу, без образ, підписуйся. E-mail: ім'я@сервер; Кому, Тема, вкладення; спам — небажана пошта.", "cards": [{"f": "Фішинг", "b": "Підроблені сайти й листи, що виманюють паролі й дані карток."}, {"f": "Надійний пароль", "b": "8+ символів, букви, цифри, знаки; різний для сайтів; секретний."}, {"f": "Особисті дані, які не розголошують", "b": "Адреса, школа, телефон, паролі, фото, дані батьків."}, {"f": "Ознака безпечного сайту", "b": "https і значок замка в адресному рядку."}, {"f": "Нетикет", "b": "Правила ввічливості в мережі: без Капсу, образ, спаму."}, {"f": "Структура e-mail адреси", "b": "ім'я@сервер, наприклад petryk@gmail.com."}, {"f": "Основні поля листа", "b": "Кому, Тема, текст, вкладення."}, {"f": "Спам", "b": "Небажані рекламні листи."}], "quiz": [{"t": "choice", "q": "Лист від «банку» просить ввести пароль на сайті за посиланням. Це…", "o": ["звичайний лист", "фішинг", "спам-реклама"], "a": 1, "e": "Виманювання даних."}, {"t": "choice", "q": "Який пароль надійний?", "o": ["123456", "Kilia2026!Sova", "пароль"], "a": 1, "e": "Довгий, з цифрами й знаками."}, {"t": "choice", "q": "Чи можна казати пароль найкращому другу?", "o": ["Так", "Ні"], "a": 1, "e": "Пароль — тільки твій."}, {"t": "choice", "q": "Незнайомець у грі просить фото і школу. Що робити?", "o": ["Надіслати", "Не надсилати, заблокувати, розказати батькам", "Спитати навіщо"], "a": 1, "e": "Особисті дані не розголошують."}, {"t": "choice", "q": "Що означає замок біля адреси сайту?", "o": ["Сайт закритий", "Захищене з'єднання https", "Сайт платний"], "a": 1, "e": "Шифрування."}, {"t": "choice", "q": "ТЕКСТ ВЕЛИКИМИ ЛІТЕРАМИ в чаті сприймають як…", "o": ["радість", "крик", "важливість"], "a": 1, "e": "Капс — крик."}, {"t": "choice", "q": "Що означає @ в адресі пошти?", "o": ["Відділяє ім'я від сервера", "Це прикраса", "Означає «англійська»"], "a": 0, "e": "ім'я@сервер."}, {"t": "choice", "q": "Куди потрапляє небажана реклама в пошті?", "o": ["Вхідні", "Спам", "Чернетки"], "a": 1, "e": "Папка Спам."}, {"t": "choice", "q": "Файл, доданий до листа, називається…", "o": ["тема", "вкладення", "підпис"], "a": 1, "e": "Вкладення."}, {"t": "choice", "q": "Отримав лист «Ти виграв айфон, оплати доставку». Це…", "o": ["удача", "шахрайство", "реклама магазину"], "a": 1, "e": "Не платити, не відповідати."}]}, {"id": "inf-prezentatsii", "sec": "Презентації", "title": "Комп'ютерні презентації. Слайди, макети, оформлення", "goal": "Ти знаєш, що таке презентація, слайд, макет, і правила гарної презентації.", "learn": [{"h": "Презентація", "p": ["<span class='term'>Комп'ютерна презентація</span> — набір <b>слайдів</b> для показу доповіді. Програми: <b>PowerPoint</b>, Google Slides, Keynote, Canva. Файл — <b>.pptx</b>. <b>Слайд</b> — одна сторінка; містить заголовок, текст, зображення, таблиці, діаграми, відео, звук."]}, {"h": "Створення", "p": ["<b>Макет слайда</b> — заготовка розташування (титульний, заголовок і вміст, два стовпці, порожній). <b>Тема (шаблон)</b> — готове оформлення: кольори, шрифти, фон. Додати слайд, змінити макет, вставити зображення (Вставлення → Зображення), <b>анімація</b> об'єктів, <b>перехід</b> між слайдами. Показ: клавіша <b>F5</b> (з початку), Esc — вийти."]}, {"h": "Правила гарної презентації", "p": ["Один слайд — одна думка; мало тексту (до 6 рядків), великий шрифт (не менше 24); контраст тексту і фону; якісні зображення; єдиний стиль; титульний слайд (назва, автор) і завершальний («Дякую за увагу»); не читати з екрана — розповідати; не зловживати анімацією."]}], "remember": "Презентація — набір слайдів; PowerPoint, .pptx. Слайд: заголовок, текст, зображення. Макет — розташування; тема — оформлення. F5 — показ. Правила: одна думка на слайд, мало тексту, шрифт ≥ 24, контраст, єдиний стиль.", "cards": [{"f": "Комп'ютерна презентація", "b": "Набір слайдів для показу доповіді."}, {"f": "Програми для презентацій", "b": "PowerPoint, Google Slides, Keynote, Canva."}, {"f": "Слайд", "b": "Одна сторінка презентації із заголовком, текстом, зображеннями."}, {"f": "Макет слайда", "b": "Заготовка розташування об'єктів на слайді."}, {"f": "Тема (шаблон)", "b": "Готове оформлення: кольори, шрифти, фон."}, {"f": "Клавіша для показу презентації з початку", "b": "F5."}, {"f": "Скільки тексту на слайді?", "b": "Мало: до 6 рядків, шрифт не менше 24."}, {"f": "Розширення файлу презентації", "b": ".pptx."}], "quiz": [{"t": "choice", "q": "Одна сторінка презентації називається…", "o": ["аркуш", "слайд", "кадр"], "a": 1, "e": "Слайд."}, {"t": "choice", "q": "Яка програма для презентацій?", "o": ["Word", "PowerPoint", "Paint"], "a": 1, "e": "PowerPoint."}, {"t": "choice", "q": "Розширення презентації PowerPoint —", "o": [".docx", ".pptx", ".jpg"], "a": 1, "e": ".pptx."}, {"t": "choice", "q": "Що таке макет слайда?", "o": ["Колір фону", "Заготовка розташування об'єктів", "Анімація"], "a": 1, "e": "Розміщення заголовка, тексту, картинок."}, {"t": "choice", "q": "Яка клавіша запускає показ з початку?", "o": ["F1", "F5", "Esc"], "a": 1, "e": "F5."}, {"t": "choice", "q": "Скільки думок має бути на одному слайді?", "o": ["Одна", "Три", "Якомога більше"], "a": 0, "e": "Один слайд — одна думка."}, {"t": "choice", "q": "Який мінімальний розмір шрифту на слайді?", "o": ["12", "24", "8"], "a": 1, "e": "Щоб читалось із залу."}, {"t": "choice", "q": "Що НЕ варто робити у презентації?", "o": ["Додавати зображення", "Читати текст з екрана слово в слово", "Робити титульний слайд"], "a": 1, "e": "Слайд — опора, а не текст доповіді."}, {"t": "choice", "q": "Ефект появи об'єкта на слайді — це…", "o": ["перехід", "анімація", "макет"], "a": 1, "e": "Анімація; перехід — між слайдами."}, {"t": "tf", "q": "Жовтий текст на білому фоні добре читається.", "a": false, "e": "Потрібен контраст."}]}, {"id": "inf-word-1", "sec": "Текстовий процесор", "title": "Текстовий документ. Уведення й редагування тексту в Word", "goal": "Ти знаєш, що таке текстовий процесор, об'єкти тексту і як редагувати текст.", "learn": [{"h": "Текстовий процесор", "p": ["<span class='term'>Текстовий процесор</span> — програма для створення й опрацювання текстових документів: <b>Microsoft Word</b> (.docx), Google Docs, LibreOffice Writer. Простий <b>текстовий редактор</b> — Блокнот (.txt). Вікно Word: <b>стрічка</b> з вкладками (Основне, Вставлення, Макет), робоча область, <b>курсор</b> (місце введення), лінійка, рядок стану."]}, {"h": "Об'єкти тексту", "p": ["<b>Символ</b> — буква, цифра, знак, пробіл. <b>Слово</b>. <b>Рядок</b>. <b>Речення</b>. <b>Абзац</b> — фрагмент від Enter до Enter. <b>Сторінка</b>. <b>Фрагмент</b> — виділена частина."]}, {"h": "Правила введення", "p": ["Один пробіл між словами; розділовий знак — одразу після слова, потім пробіл; <b>Enter</b> — лише для нового абзацу (не в кінці рядка!); <b>Shift</b> — велика буква; <b>Caps Lock</b> — усі великі; лапки й дужки — без пробілів усередині; тире з пробілами, дефіс без. Перемикання мови — Alt+Shift або Win+пробіл."]}, {"h": "Редагування", "p": ["<span class='term'>Редагування</span> — зміна змісту: виправлення помилок, вставлення, видалення, переміщення. <b>Backspace</b> — видаляє символ ліворуч, <b>Delete</b> — праворуч. <b>Виділити</b>: мишею, Shift+стрілки, подвійний клік — слово, потрійний — абзац, Ctrl+A — все. Копіювати Ctrl+C, вирізати Ctrl+X, вставити Ctrl+V, скасувати Ctrl+Z, повернути Ctrl+Y. <b>Перевірка правопису</b>: червоне підкреслення — орфографічна помилка, синє/зелене — граматична; правий клік — варіанти. <b>Пошук і заміна</b> — Ctrl+H."]}], "remember": "Word — текстовий процесор (.docx). Об'єкти: символ, слово, рядок, речення, абзац (Enter), сторінка. Enter — тільки новий абзац; пробіл після розділового знака. Backspace — ліворуч, Delete — праворуч. Редагування — зміна змісту; червоне підкреслення — помилка.", "cards": [{"f": "Текстовий процесор", "b": "Програма для створення й опрацювання документів: Word, Google Docs."}, {"f": "Абзац у Word", "b": "Фрагмент тексту в const KEY = "course:" + COURSE.id;
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && (TG.isVersionAtLeast ? TG.isVersionAtLeast("6.9") : true) ? TG.CloudStorage : null;
let P = {};
function load(cb){
  let done=false; const finish=v=>{ if(done) return; done=true; try{ P = JSON.parse(v||"{}"); }catch(e){ P={}; } cb(); };
  if(CS){ CS.getItem(KEY, (err,v)=>finish(err?null:v)); setTimeout(()=>finish(null), 1500); }
  else { let v=null; try{ v = localStorage.getItem(KEY); }catch(e){} finish(v); }
}
function save(){
  const s = JSON.stringify(P);
  if(CS) CS.setItem(KEY, s, ()=>{});
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
function lp(id){ return P[id] || (P[id] = {learn:false, cards:false, best:null}); }
function starsOf(pct){ return pct===null?0 : pct>=90?3 : pct>=70?2 : pct>=50?1 : 0; }
function starStr(n){ let s=""; for(let i=0;i<3;i++) s+= i<n ? "★" : "<span class='off'>★</span>"; return s; }

// ============================================================
//  Навігація
// ============================================================
let L = null, cardsQueue=[], cardsTotal=0, quiz=[], qi=0, qPick=null, qWrong=[], qRight=0;
const BACK = {"s-lesson":"s-list","s-learn":"s-lesson","s-cards":"s-lesson","s-quiz":"s-lesson","s-res":"s-list"};
let CUR = "s-list";
function go(id){
  CUR = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); document.getElementById(id).classList.add("on"); window.scrollTo(0,0);
  if(TG && TG.BackButton){ if(BACK[id]) TG.BackButton.show(); else TG.BackButton.hide(); }
}
if(TG && TG.BackButton) TG.BackButton.onClick(()=>{ const b = BACK[CUR]; if(b==="s-list") renderList(); else if(b) go(b); });

let listScroll = 0;
function renderList(){
  document.getElementById("subj-title").textContent = COURSE.title;
  document.getElementById("subj-sub").textContent = COURSE.subtitle;
  let done=0, stars=0, html="";
  let lastSec = null;
  COURSE.lessons.forEach((l,i)=>{
    const p = lp(l.id), st = starsOf(p.best);
    if(p.best!==null && st>0) done++; stars+=st;
    if(l.sec && l.sec!==lastSec){ html += `<div class="section">${l.sec}</div>`; lastSec = l.sec; }
    html += `<button class="lesson" onclick="openLesson(${i})">
      <div class="n ${st>0?'done':''}">${st>0?'✓':i+1}</div>
      <div class="t"><b>${l.title}</b><span>${p.best===null?'Ще не проходив':'Найкращий результат: '+p.best+'%'}</span></div>
      <div class="stars">${starStr(st)}</div></button>`;
  });
  document.getElementById("lessons").innerHTML = html;
  document.getElementById("sum-done").textContent = done;
  document.getElementById("sum-total").textContent = COURSE.lessons.length;
  document.getElementById("sum-stars").textContent = stars;
  go("s-list"); window.scrollTo(0, listScroll);
}

function openLesson(i){
  listScroll = window.scrollY;
  L = COURSE.lessons[i]; const p = lp(L.id);
  document.getElementById("l-bar").textContent = "Урок " + (i+1);
  document.getElementById("l-title").textContent = L.title;
  document.getElementById("l-goal").textContent = L.goal;
  document.getElementById("cards-count").textContent = L.cards.length + " карток";
  document.getElementById("quiz-count").textContent = L.quiz.length + " питань";
  document.getElementById("st-learn").textContent = p.learn ? "✓" : "";
  document.getElementById("st-cards").textContent = p.cards ? "✓" : "";
  document.getElementById("st-quiz").innerHTML = p.best===null ? "" : `<span class="stars">${starStr(starsOf(p.best))}</span>`;
  go("s-lesson");
}

// ---- Вивчити
function openLearn(){
  let h = "";
  L.learn.forEach(b=>{
    h += `<div class="card"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join("")}`;
    if(b.ex) h += b.ex.map(x=>`<div class="ex">${x}</div>`).join("");
    if(b.note) h += `<p style="color:var(--ink-2);margin-top:10px">${b.note}</p>`;
    h += `</div>`;
  });
  h += `<div class="rem"><b>Запам'ятай</b>${L.remember}</div>`;
  document.getElementById("learn-body").innerHTML = h;
  go("s-learn");
}
function markLearn(){ lp(L.id).learn = true; save(); }

// ---- Картки
function openCards(){
  cardsQueue = L.cards.slice().sort(()=>Math.random()-.5); cardsTotal = cardsQueue.length;
  showCard(); go("s-cards");
}
function showCard(){
  const fc = document.getElementById("fc"); fc.classList.remove("flip");
  const c = cardsQueue[0];
  document.getElementById("fc-front").textContent = c.f;
  document.getElementById("fc-back").textContent = c.b;
  const left = cardsQueue.length;
  document.getElementById("fc-n").textContent = `Залишилось: ${left}`;
  document.getElementById("fc-prog").style.width = ((cardsTotal-left)/cardsTotal*100) + "%";
}
function fcAnswer(known){
  const c = cardsQueue.shift();
  if(!known) cardsQueue.push(c);
  if(cardsQueue.length===0){ lp(L.id).cards = true; save(); openQuiz(); return; }
  setTimeout(showCard, 60);
}

// ---- Тест
function openQuiz(items){
  quiz = (items || L.quiz).slice(); if(!items) quiz.sort(()=>Math.random()-.5);
  qi=0; qWrong=[]; qRight=0; showQ(); go("s-quiz");
}
function showQ(){
  const q = quiz[qi]; qPick=null;
  document.getElementById("q-n").textContent = `Питання ${qi+1} з ${quiz.length}`;
  document.getElementById("q-prog").style.width = (qi/quiz.length*100)+"%";
  document.getElementById("q-text").textContent = q.q;
  const fb = document.getElementById("q-fb"); fb.className="fb"; fb.innerHTML="";
  const btn = document.getElementById("q-btn"); btn.textContent="Перевірити"; btn.dataset.state="check";
  let h="";
  if(q.t==="choice") h = q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("");
  else if(q.t==="tf") h = `<button class="opt" onclick="pick(true,this)">Так, правильно</button><button class="opt" onclick="pick(false,this)">Ні, неправильно</button>`;
  else h = `<input class="inp" id="q-inp" autocomplete="off" autocapitalize="off" placeholder="Впиши відповідь">`;
  document.getElementById("q-body").innerHTML = h;
  if(q.t==="input") document.getElementById("q-inp").addEventListener("keydown", e=>{ if(e.key==="Enter") qNext(); });
}
function pick(v, el){ if(document.getElementById("q-btn").dataset.state!=="check") return; qPick=v; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick")); el.classList.add("pick"); }
function norm(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'").replace(/[^a-z0-9а-яіїєґ' \-]/gi,"").replace(/\s+/g," ").trim(); }
function qNext(){
  const btn = document.getElementById("q-btn"), q = quiz[qi];
  if(btn.dataset.state==="check"){
    let ok=false;
    if(q.t==="input"){
      const inp=document.getElementById("q-inp"), v=norm(inp.value); if(!v){ inp.focus(); inp.placeholder="Впиши відповідь і натисни Перевірити"; return; }
      ok = q.a.map(norm).includes(v); inp.classList.add(ok?"ok":"bad"); inp.disabled=true;
    } else {
      if(qPick===null) return;
      ok = (qPick===q.a);
      document.querySelectorAll(".opt").forEach((o,i)=>{
        const val = q.t==="tf" ? (i===0) : i;
        if(val===q.a) o.classList.add("ok"); else if(val===qPick) o.classList.add("bad");
        o.disabled=true;
      });
    }
    if(ok) qRight++; else qWrong.push(q);
    const fb=document.getElementById("q-fb"); fb.className="fb on "+(ok?"ok":"bad");
    fb.innerHTML = `<b>${ok?"Правильно!":"Не зовсім."}</b>${q.e}${(!ok && q.t==="input")?" Правильно: <b>"+q.a[0]+"</b>.":""}`;
    btn.textContent = qi+1<quiz.length ? "Наступне" : "Результат"; btn.dataset.state="next";
  } else {
    qi++; if(qi<quiz.length) showQ(); else showResult();
  }
}
function showResult(){
  const pct = Math.round(qRight/quiz.length*100), st = starsOf(pct), p = lp(L.id);
  if(quiz.length===L.quiz.length && (p.best===null || pct>p.best)){ p.best=pct; save(); }
  document.getElementById("r-score").textContent = pct+"%";
  document.getElementById("r-of").textContent = `${qRight} з ${quiz.length} правильно`;
  document.getElementById("r-stars").innerHTML = starStr(st);
  document.getElementById("r-msg").textContent = st===3?"Чудово, тему знаєш.":st===2?"Добре. Глянь на помилки — і буде три зірки.":st===1?"Половина є. Повтори картки й спробуй ще.":"Повернись до «Вивчити», потім спробуй знову.";
  document.getElementById("r-retry").style.display = qWrong.length? "block":"none";
  go("s-res");
}
function retryWrong(){ openQuiz(qWrong); }

load(renderList);
</script>
